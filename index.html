<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020207;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font-family:Arial,sans-serif;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

/* =========================
   GŁÓWNE MENU
========================= */

#home{
  position:fixed;
  inset:0;
  overflow:auto;
  text-align:center;
  background:
    radial-gradient(circle at 50% 15%,#24245c,#09091c 48%,#020207 100%);
}

.menuStars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.menuStar{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px #fff;
  animation:starMove linear infinite;
}

@keyframes starMove{
  from{
    transform:translateY(-20px);
    opacity:.2;
  }
  50%{
    opacity:1;
  }
  to{
    transform:translateY(110vh);
    opacity:.1;
  }
}

.logo{
  position:relative;
  margin:0;
  padding-top:55px;
  font-size:clamp(48px,11vw,100px);
  font-weight:900;
  letter-spacing:6px;
  text-shadow:
    0 0 10px #00ffff,
    0 0 30px #00ffff,
    0 0 70px #8a2cff;
  animation:logoPulse 2s infinite alternate;
}

@keyframes logoPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.35)}
}

.subtitle{
  position:relative;
  margin:8px 15px 25px;
  color:#aaa;
  letter-spacing:3px;
}

.mainButtons{
  position:relative;
  width:min(420px,90%);
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.mainButton{
  width:100%;
  padding:16px;
  border-radius:14px;
  color:#fff;
  background:#101027;
  border:1px solid #33335a;
  font-size:19px;
  font-weight:900;
}

.mainButton:hover{
  border-color:#00ffff;
  box-shadow:0 0 20px #00ffff44;
}

.mainButton.primary{
  color:#020207;
  background:#00ffff;
  box-shadow:0 0 25px #00ffff;
}

.homeStats{
  position:relative;
  width:min(800px,94%);
  margin:30px auto;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.stat{
  min-width:145px;
  padding:15px;
  border-radius:15px;
  background:#0e0e24dd;
  border:1px solid #29294c;
}

.stat b{
  display:block;
  margin-bottom:4px;
  font-size:26px;
  color:#00ffff;
}

.levelTitle{
  position:relative;
  margin:25px 0 12px;
  color:#aaa;
  letter-spacing:2px;
}

.levelList{
  position:relative;
  width:min(1000px,94%);
  margin:15px auto 60px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}

.levelCard{
  padding:17px;
  border-radius:15px;
  background:#101021dd;
  border:1px solid #303050;
  text-align:left;
}

.levelCard.locked{
  opacity:.4;
}

.levelName{
  margin:6px 0;
  font-size:18px;
  font-weight:bold;
}

.levelInfo{
  color:#999;
  font-size:13px;
}

/* =========================
   GRA
========================= */

#game{
  position:fixed;
  inset:0;
  display:none;
  background:#020207;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

#top{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  height:42px;
  display:flex;
  gap:8px;
  z-index:5;
}

.topButton{
  width:45px;
  height:42px;
  border-radius:10px;
  color:#fff;
  background:#10101dcc;
  border:1px solid #444;
  font-size:18px;
}

#bar{
  flex:1;
  height:10px;
  margin:auto 0;
  overflow:hidden;
  border-radius:20px;
  background:#222238;
}

#barFill{
  width:0%;
  height:100%;
  background:#00ffff;
  box-shadow:0 0 15px #00ffff;
}

#levelTitle{
  position:absolute;
  top:59px;
  left:15px;
  z-index:5;
  font-weight:bold;
  text-shadow:0 0 10px currentColor;
}

#mobileJump{
  position:absolute;
  bottom:25px;
  left:50%;
  z-index:5;
  display:none;
  width:115px;
  height:70px;
  transform:translateX(-50%);
  border-radius:18px;
  background:#00ffff22;
  border:2px solid #00ffff88;
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

/* =========================
   PANELE
========================= */

.panel{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#000b;
}

.box{
  width:min(520px,94%);
  max-height:90vh;
  overflow:auto;
  padding:25px;
  border-radius:20px;
  background:#0c0c20;
  border:1px solid #44446a;
  text-align:center;
  box-shadow:0 0 50px #000;
}

.box h2{
  margin-top:0;
}

.actionButton{
  width:100%;
  margin-top:9px;
  padding:13px;
  border-radius:10px;
  background:#17172d;
  color:#fff;
  border:1px solid #33334e;
  font-weight:bold;
}

.actionButton.primary{
  background:#00ffff;
  color:#020207;
}

.menuLevels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.levelButton{
  padding:13px 6px;
  border-radius:10px;
  background:#17172d;
  color:#fff;
  border:1px solid #33334e;
}

.levelButton.unlocked{
  border-color:#00ffff;
}

.levelButton.locked{
  opacity:.3;
}

.achievement{
  margin:8px 0;
  padding:12px;
  border-radius:12px;
  background:#14142a;
  border:1px solid #333;
  text-align:left;
}

.achievement.done{
  border-color:#00ffff;
  box-shadow:0 0 15px #00ffff22;
}

.achievement small{
  color:#999;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  top:25px;
  left:50%;
  z-index:100;
  padding:13px 20px;
  border-radius:12px;
  background:#111126ee;
  border:1px solid #00ffff;
  box-shadow:0 0 25px #00ffff55;
  transform:translateX(-50%) translateY(-100px);
  transition:.3s;
  pointer-events:none;
  font-weight:bold;
}

#toast.show{
  transform:translateX(-50%) translateY(0);
}

@media(max-width:700px){

  #mobileJump{
    display:block;
  }

  .logo{
    padding-top:35px;
  }

  .levelList{
    grid-template-columns:1fr 1fr;
  }

  .levelCard{
    padding:13px;
  }
}

@media(max-width:430px){

  .levelList{
    grid-template-columns:1fr;
  }

  .stat{
    min-width:100px;
  }
}
</style>

</head>

<script>

/* =====================================================
   POZIOMY
===================================================== */

const levels=[
  ["NEON RUSH","#00ffff",5.8,7000],
  ["CRYSTAL DRIVE","#6fa8ff",6.0,7300],
  ["LAVA PULSE","#ff482e",6.2,7600],
  ["SKY CIRCUIT","#75ff70",6.4,7900],
  ["VIOLET RUN","#c86cff",6.6,8200],
  ["SHADOW FACTORY","#aaaabb",6.8,8500],
  ["CYBER STORM","#00aaff",7.0,8800],
  ["INFERNO CORE","#ff7800",7.2,9000],
  ["ELECTRIC VOID","#eeff00",7.4,9200],
  ["GRAVITY BREAK","#ff35bb",7.6,9400],
  ["OVERDRIVE","#00ff88",7.8,9600],
  ["FINAL CHAOS","#ffffff",8.0,10000]
];


/* =====================================================
   ZAPIS
===================================================== */

let completed=
  JSON.parse(
    localStorage.getItem("nd_completed")||"[]"
  );

let levelCoins=
  JSON.parse(
    localStorage.getItem("nd_coins")||"[]"
  );

let achievements=
  JSON.parse(
    localStorage.getItem("nd_achievements")||"{}"
  );

let sound=
  localStorage.getItem("nd_sound")!=="off";

if(!Array.isArray(completed))
  completed=[];

if(!Array.isArray(levelCoins))
  levelCoins=[];

if(!achievements ||
   typeof achievements!=="object")
  achievements={};


function save(){

  localStorage.setItem(
    "nd_completed",
    JSON.stringify(completed)
  );

  localStorage.setItem(
    "nd_coins",
    JSON.stringify(levelCoins)
  );

  localStorage.setItem(
    "nd_achievements",
    JSON.stringify(achievements)
  );

  localStorage.setItem(
    "nd_sound",
    sound?"on":"off"
  );
}


function completedTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    if(completed[i])
      n++;
  }

  return n;
}


function coinsTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    n+=Number(
      levelCoins[i]||0
    );
  }

  return n;
}


/* =====================================================
   OSIĄGNIĘCIA
===================================================== */

const achievementData=[

  [
    "first",
    "🚀 PIERWSZY KROK",
    "Ukończ pierwszy poziom."
  ],

  [
    "three",
    "🔥 ROZGRZEWKA",
    "Ukończ 3 poziomy."
  ],

  [
    "six",
    "⚡ POŁOWA DROGI",
    "Ukończ 6 poziomów."
  ],

  [
    "all",
    "👑 NEON MASTER",
    "Ukończ wszystkie poziomy."
  ],

  [
    "coins10",
    "🪙 KOLEKCJONER",
    "Zdobądź 10 monet."
  ],

  [
    "coins25",
    "💰 SKARBNIK",
    "Zdobądź 25 monet."
  ],

  [
    "perfect",
    "💎 PERFEKCJA",
    "Zdobądź wszystkie 3 monety w poziomie."
  ],

  [
    "survivor",
    "☠️ SURVIVOR",
    "Ukończ poziom bez śmierci."
  ]
];


function achievementTotal(){

  let n=0;

  for(const a of achievementData){

    if(achievements[a[0]])
      n++;
  }

  return n;
}


function checkAchievements(){

  let unlockedNow=[];

  function unlock(id){

    if(!achievements[id]){

      achievements[id]=true;
      unlockedNow.push(id);
    }
  }

  if(completedTotal()>=1)
    unlock("first");

  if(completedTotal()>=3)
    unlock("three");

  if(completedTotal()>=6)
    unlock("six");

  if(completedTotal()>=12)
    unlock("all");

  if(coinsTotal()>=10)
    unlock("coins10");

  if(coinsTotal()>=25)
    unlock("coins25");

  if(collected===3)
    unlock("perfect");

  if(levelDeaths===0)
    unlock("survivor");

  save();

  if(unlockedNow.length){

    const a=
      achievementData.find(
        x=>x[0]===unlockedNow[0]
      );

    if(a)
      toast("🏆 "+a[1]);
  }
}

/* =====================================================
   MENU GWIAZDY
===================================================== */

function createMenuStars(){

  const container=
    document.getElementById(
      "menuStars"
    );

  container.innerHTML="";

  for(let i=0;i<70;i++){

    const star=
      document.createElement("div");

    star.className="menuStar";

    star.style.left=
      Math.random()*100+"%";

    star.style.animationDuration=
      3+Math.random()*7+"s";

    star.style.animationDelay=
      -Math.random()*8+"s";

    star.style.opacity=
      .2+Math.random()*.8;

    container.appendChild(star);
  }
}


/* =====================================================
   CANVAS
===================================================== */

let W=0;
let H=0;
let dpr=1;

function resize(){

  dpr=
    Math.min(
      window.devicePixelRatio||1,
      2
    );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  makeStars();
}

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   STAN GRY
===================================================== */

let currentLevel=0;

let playing=false;
let paused=false;
let dead=false;
let won=false;

let progress=0;
let lastTime=0;

let obstacles=[];
let coins=[];
let pads=[];
let portals=[];
let particles=[];
let stars=[];
let trail=[];

let collected=0;

let currentSpeed=1;
let gravityDir=1;

let levelDeaths=0;

let shake=0;
let flash=0;


/* =====================================================
   GRACZ
===================================================== */

const player={

  x:120,
  y:0,
  size:32,
  vy:0,
  grounded:true,
  rotation:0

};


function ground(){

  return H*.78;
}


function ceiling(){

  return 75;
}


/* =====================================================
   GWIAZDY W GRZE
===================================================== */

function makeStars(){

  stars=[];

  for(let i=0;i<110;i++){

    stars.push({

      x:Math.random()*W,

      y:Math.random()*H*.72,

      r:.5+Math.random()*1.7,

      speed:.2+Math.random()*.8

    });
  }
}


/* =====================================================
   TWORZENIE POZIOMU
===================================================== */

function createLevel(){

  obstacles=[];
  coins=[];
  pads=[];
  portals=[];
  particles=[];
  trail=[];

  progress=0;
  collected=0;

  currentSpeed=1;
  gravityDir=1;

  levelDeaths=0;

  const length=
    levels[currentLevel][3];


  /* PRZESZKODY */

  let x=500;

  while(
    x<length-450
  ){

    const type=
      Math.random();

    if(type<.50){

      obstacles.push({

        type:"spike",
        x:x,
        w:38,
        h:40

      });

      if(Math.random()<.20){

        obstacles.push({

          type:"spike",
          x:x+42,
          w:38,
          h:40

        });

        x+=42;
      }

    }else if(type<.72){

      obstacles.push({

        type:"saw",
        x:x,
        w:46,
        h:46

      });

    }else{

      obstacles.push({

        type:"gap",
        x:x,
        w:80+
          Math.random()*35

      });
    }

    x+=
      280+
      Math.random()*260;
  }


  /* JUMP PADY */

  pads=[

    {
      x:length*.20,
      power:13
    },

    {
      x:length*.47,
      power:15
    },

    {
      x:length*.76,
      power:14
    }

  ];


  /* PORTALE */

  portals=[

    {
      x:length*.34,
      type:"speed",
      mult:1.25,
      used:false
    },

    {
      x:length*.52,
      type:"gravity",
      mult:1,
      used:false
    },

    {
      x:length*.62,
      type:"speed",
      mult:.82,
      used:false
    },

    {
      x:length*.72,
      type:"gravity",
      mult:1,
      used:false
    },

    {
      x:length*.86,
      type:"speed",
      mult:1.35,
      used:false
    }

  ];


  /* MONETY */

  const positions=[

    length*.27,
    length*.55,
    length*.80

  ];

  for(let i=0;i<3;i++){

    coins.push({

      x:positions[i],

      y:
        ground()-
        100-
        (i===1?70:0),

      collected:false,

      r:11

    });
  }


  /* GRACZ */

  player.x=120;

  player.y=
    ground()-
    player.size;

  player.vy=0;

  player.grounded=true;

  player.rotation=0;
}


/* =====================================================
   TŁO
===================================================== */

function drawBackground(){

  const color=
    levels[currentLevel][1];

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(
    0,
    "#11112d"
  );

  gradient.addColorStop(
    .65,
    "#050511"
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  /* GWIAZDY */

  for(const s of stars){

    let x=
      (
        s.x-
        progress*
        s.speed*
        .08
      )%(W+30);

    if(x<0)
      x+=W+30;

    ctx.fillStyle="#fff";

    ctx.globalAlpha=
      .2+s.speed*.4;

    ctx.beginPath();

    ctx.arc(
      x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;


  /* SIATKA */

  ctx.strokeStyle=
    color+"25";

  ctx.lineWidth=1;

  const g=ground();

  for(
    let x=-((progress*.25)%50);
    x<W;
    x+=50
  ){

    ctx.beginPath();

    ctx.moveTo(x,g);

    ctx.lineTo(
      W/2+
      (x-W/2)*.2,
      H
    );

    ctx.stroke();
  }

  for(
    let y=g;
    y<H;
    y+=35
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }


  /* BŁYSK */

  if(flash>0){

    ctx.fillStyle=color;

    ctx.globalAlpha=
      Math.min(.25,flash);

    ctx.fillRect(
      0,0,W,H
    );

    ctx.globalAlpha=1;
  }
}


/* =====================================================
   ZIEMIA
===================================================== */

function drawGround(){

  const color=
    levels[currentLevel][1];

  const g=ground();

  ctx.fillStyle="#080812";

  ctx.fillRect(
    0,g,W,H-g
  );

  ctx.fillStyle=color;

  ctx.shadowBlur=15;
  ctx.shadowColor=color;

  ctx.fillRect(
    0,g,W,3
  );

  if(gravityDir<0){

    ctx.fillRect(
      0,
      ceiling(),
      W,
      3
    );
  }

  ctx.shadowBlur=0;
}


/* =====================================================
   ŚLAD
===================================================== */

function drawTrail(){

  const color=
    levels[currentLevel][1];

  for(
    let i=0;
    i<trail.length;
    i++
  ){

    const t=trail[i];

    ctx.globalAlpha=
      (i/trail.length)*.32;

    ctx.fillStyle=color;

    ctx.fillRect(
      t.x,
      t.y,
      player.size,
      player.size
    );
  }

  ctx.globalAlpha=1;
}


/* =====================================================
   GRACZ
===================================================== */

function drawPlayer(){

  const color=
    levels[currentLevel][1];

  ctx.save();

  ctx.translate(
    player.x+
      player.size/2,
    player.y+
      player.size/2
  );

  ctx.rotate(
    player.rotation
  );

  ctx.shadowBlur=18;
  ctx.shadowColor=color;

  ctx.fillStyle="#fff";

  ctx.fillRect(
    -player.size/2,
    -player.size/2,
    player.size,
    player.size
  );

  ctx.strokeStyle=color;
  ctx.lineWidth=3;

  ctx.strokeRect(
    -player.size/2,
    -player.size/2,
    player.size,
    player.size
  );

  ctx.restore();

/* =====================================================
   PRZESZKODY
===================================================== */

function drawObstacle(o){

  const color=
    levels[currentLevel][1];

  const x=
    o.x-progress;

  if(
    x<-100||
    x>W+100
  )
    return;

  ctx.save();


  if(o.type==="spike"){

    ctx.fillStyle=color;

    ctx.shadowBlur=14;
    ctx.shadowColor=color;

    if(gravityDir>0){

      ctx.beginPath();

      ctx.moveTo(
        x,
        ground()
      );

      ctx.lineTo(
        x+o.w/2,
        ground()-o.h
      );

      ctx.lineTo(
        x+o.w,
        ground()
      );

      ctx.closePath();
      ctx.fill();

    }else{

      ctx.beginPath();

      ctx.moveTo(
        x,
        ceiling()
      );

      ctx.lineTo(
        x+o.w/2,
        ceiling()+o.h
      );

      ctx.lineTo(
        x+o.w,
        ceiling()
      );

      ctx.closePath();
      ctx.fill();
    }


  }else if(o.type==="saw"){

    const cx=
      x+o.w/2;

    const cy=
      gravityDir>0
      ? ground()-o.h/2
      : ceiling()+o.h/2;

    ctx.translate(
      cx,
      cy
    );

    ctx.rotate(
      progress*.012
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=15;
    ctx.shadowColor=color;

    const teeth=12;

    ctx.beginPath();

    for(
      let i=0;
      i<teeth*2;
      i++
    ){

      const a=
        i*Math.PI/teeth;

      const r=
        i%2===0
        ? o.w/2
        : o.w*.34;

      const px=
        Math.cos(a)*r;

      const py=
        Math.sin(a)*r;

      if(i===0)
        ctx.moveTo(px,py);
      else
        ctx.lineTo(px,py);
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#05050b";

    ctx.beginPath();

    ctx.arc(
      0,0,7,0,Math.PI*2
    );

    ctx.fill();


  }else if(o.type==="gap"){

    ctx.fillStyle="#000";

    if(gravityDir>0){

      ctx.fillRect(
        x,
        ground(),
        o.w,
        H-ground()
      );

    }else{

      ctx.fillRect(
        x,
        0,
        o.w,
        ceiling()
      );
    }
  }

  ctx.restore();
}


/* =====================================================
   MONETY
===================================================== */

function drawCoins(){

  for(const c of coins){

    if(c.collected)
      continue;

    const x=
      c.x-progress;

    if(
      x<-30||

    );

    );

    ctx.fill();

    ctx.fillStyle="#fff4a0";

    ctx.arc(
      -3,-3,3,
      0,Math.PI*2
    );

    ctx.restore();
  }
}


/* =====================================================
   JUMP PADY
===================================================== */

function drawPads(){

  for(const pad of pads){

    const x=
      pad.x-progress;

    if(
      x<-60||
      x>W+60
    )

    ctx.shadowColor="#00ff66";

      x+16,

    );

    ctx.fillStyle="#fff";

    ctx.font=
      "bold 16px Arial";

    ctx.fillText(

      x+16,

    );

    ctx.restore();
  }
}


/* =====================================================
   PORTALE
===================================================== */

function drawPortals(){

  for(const portal of portals){

    const x=
      portal.x-progress;

    if(
      x<-80||
      x>W+80
    )
      continue;

    const y=H*.43;

    ctx.save();

    if(portal.type==="speed"){

      ctx.strokeStyle=
        portal.mult>1
        ? "#00ff88"
        : "#ff5577";

      ctx.shadowBlur=25;

      ctx.shadowColor=
        portal.mult>1
        ? "#00ff88"
        : "#ff5577";

      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.ellipse(
        x,

        27,
        55,
        0,
        0,

      );

      ctx.stroke();

      ctx.fillStyle="#fff";

        "bold 13px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        portal.mult>1
        ?"SPEED +"
        :"SPEED -",
        x,
        y+5
      );

    }else{

      ctx.strokeStyle="#b85cff";

      ctx.shadowBlur=25;
      ctx.shadowColor="#b85cff";

      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        35,
        0,
        Math.PI*2
      );

      ctx.stroke();

      ctx.fillStyle="#fff";

      ctx.font=
        "bold 12px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        "GRAVITY",
        x,
        y+4
      );
    }

    ctx.restore();
  }
}


/* =====================================================
   CZĄSTECZKI
===================================================== */

function spawnParticles(
  x,
  y,
  color,
  count
){

  for(let i=0;i<count;i++){

    particles.push({

      x:x,
      y:y,

      vx:
        (Math.random()-.5)*8,

      vy:
        (Math.random()-.5)*8,

      life:
        25+
        Math.random()*35,

      size:
        2+
        Math.random()*4,

      color:color

    });
  }
}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.life-=dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}


function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/60
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =====================================================
   AUDIO
===================================================== */

let audio=null;

function initAudio(){

  if(audio)
    return;

  try{

    audio=
      new (
        window.AudioContext||
        window.webkitAudioContext
      )();

  }catch(e){}
}


function beep(
  freq,
  duration
){

  if(!sound)
    return;

  initAudio();

  if(!audio)
    return;

  try{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type="square";

    osc.frequency.value=
      freq;

    gain.gain.value=.035;

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+
      duration
    );

    osc.stop(
      audio.currentTime+
      duration
    );

  }catch(e){}
}


function soundJump(){
  beep(650,.06);
}

function soundCoin(){
  beep(900,.08);
}

function soundDeath(){
  beep(120,.18);
}

function soundPortal(){
  beep(500,.08);
  setTimeout(()=>{
    beep(800,.10);
  },70);
}

function soundPad(){
  beep(750,.07);
  setTimeout(()=>{
    beep(1100,.08);
  },60);
}

function soundWin(){
  beep(600,.08);
  setTimeout(()=>{
    beep(800,.08);
  },90);
}


/* =====================================================
   SKOK
===================================================== */

function jump(){

  if(!playing)
    return;

  if(paused||
     dead||
     won)
    return;

  if(player.grounded){

    player.vy=
      -12*gravityDir;

    player.grounded=false;

    spawnParticles(
      player.x+
        player.size/2,
      player.y+
        player.size/2,
      levels[currentLevel][1],
      10
    );

    soundJump();
  }
}


/* =====================================================
   FIZYKA
===================================================== */

function updatePhysics(dt){

  player.vy+=
    .72*
    gravityDir*
    dt;

  player.y+=
    player.vy*
    dt;


  if(gravityDir>0){

    if(
      player.y+
      player.size>=
      ground()
    ){

      player.y=
        ground()-
        player.size;

      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
    }

  }else{

    if(
      player.y<=ceiling()
    ){

      player.y=ceiling();

      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
    }
  }


  if(!player.grounded){

    player.rotation+=
      .08*dt;

  }else{

    player.rotation=
      Math.round(
        player.rotation/
        (Math.PI/2)
      )*
      (Math.PI/2);
  }
}


/* =====================================================
   KOLIZJE
===================================================== */

function updateCollisions(){

  const p={
    x:player.x+5,
    y:player.y+5,
    w:player.size-10,
    h:player.size-10
  };


  /* PRZESZKODY */

  for(const o of obstacles){

    const x=
      o.x-progress;


    if(o.type==="spike"){

      const hitX=
        p.x<x+o.w &&
        p.x+p.w>x;

      let hitY=false;

      if(gravityDir>0){

        hitY=
          p.y+p.h>
          ground()-
          o.h+
          8;

      }else{

        hitY=
          p.y<
          ceiling()+
          o.h-
          8;
      }

      if(hitX&&hitY){

        die();
        return;
      }


    }else if(o.type==="saw"){

      const cx=
        x+o.w/2;

      const cy=
        gravityDir>0
        ? ground()-o.h/2
        : ceiling()+o.h/2;

      const closestX=
        Math.max(
          p.x,
          Math.min(
            cx,
            p.x+p.w
          )
        );

      const closestY=
        Math.max(
          p.y,
          Math.min(
            cy,
            p.y+p.h
          )
        );

      const dx=
        cx-closestX;

      const dy=
        cy-closestY;

      if(
        dx*dx+
        dy*dy<
        (o.w*.43)*
        (o.w*.43)
      ){

        die();
        return;
      }


    }else if(o.type==="gap"){

      if(
        player.grounded &&
        p.x<x+o.w &&
        p.x+p.w>x
      ){

        die();
        return;
      }
    }
  }


  /* MONETY */

  for(const c of coins){

    if(c.collected)
      continue;

    const x=
      c.x-progress;

    const dx=
      player.x+
      player.size/2-
      x;

    const dy=
      player.y+
      player.size/2-
      c.y;

    const radius=
      c.r+
      player.size*.45;

    if(
      dx*dx+
      dy*dy<
      radius*radius
    ){

      c.collected=true;

      collected++;

      spawnParticles(
        x,
        c.y,
        "#ffd900",
        18
      );

      soundCoin();

      flash=.15;
    }
  }


  /* JUMP PADY */

  for(const pad of pads){

    const x=
      pad.x-progress;

    const center=
      player.x+
      player.size/2;

    if(
      Math.abs(
        center-
        (x+16)
      )<25 &&
      player.grounded
    ){

      player.vy=
        -pad.power*
        gravityDir;

      player.grounded=false;

      spawnParticles(
        x+16,
        gravityDir>0
        ? ground()
        : ceiling(),
        "#00ff66",
        15
      );

      soundPad();

      shake=3;
    }
  }


  /* PORTALE */

  for(const portal of portals){

    if(portal.used)
      continue;

    const x=
      portal.x-progress;

    if(
      Math.abs(
        player.x+
        player.size/2-
        x
      )<24
    ){

      portal.used=true;

      if(
        portal.type==="speed"
      ){

        currentSpeed=
          Math.max(
            .55,
            Math.min(
              1.45,
              currentSpeed*
              portal.mult
            )
          );

        toast(
          portal.mult>1
          ?"⚡ PRĘDKOŚĆ +"
          :"🐢 PRĘDKOŚĆ -"
        );

      }else{

        gravityDir*=-1;

        player.vy=0;
        player.grounded=false;

        toast(
          "🌀 GRAWITACJA!"
        );
      }

      spawnParticles(
        player.x+
          player.size/2,
        player.y+
          player.size/2,
        portal.type==="gravity"
        ?"#b85cff"
        :"#00ffff",
        25
      );

      soundPortal();

      flash=.25;
      shake=5;
    }
  }
}


/* =====================================================
   ŚMIERĆ
===================================================== */

function die(){

  if(dead)
    return;

  dead=true;
  playing=false;

  levelDeaths++;

  spawnParticles(
    player.x+
      player.size/2,
    player.y+
      player.size/2,
    levels[currentLevel][1],
    45
  );

  soundDeath();

  shake=12;
  flash=.5;

  deadInfo.textContent=
    "Postęp: "+
    Math.floor(
      progress/
      levels[currentLevel][3]*
      100
    )+
    "% • Monety: "+
    collected+
    "/3";

  deadPanel.style.display=
    "flex";
}


/* =====================================================
   WYGRANA
===================================================== */

function win(){

  if(won)
    return;

  won=true;
  playing=false;

  completed[currentLevel]=true;

  const old=
    Number(
      levelCoins[currentLevel]||0
    );

  levelCoins[currentLevel]=
    Math.max(
      old,
      collected
    );

  save();

  checkAchievements();

  soundWin();

  winInfo.textContent=
    "Poziom: "+
    levels[currentLevel][0]+
    " • Monety: "+
    Number(
      levelCoins[currentLevel]||0
    )+
    "/3";

  if(
    currentLevel===
    levels.length-1
  ){

    nextLevelButton.style.display=
      "none";

  }else{

    nextLevelButton.style.display=
      "block";
  }

  winPanel.style.display=
    "flex";

  updateHome();
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  if(!playing||
     paused||
     dead||
     won)
    return;

  const baseSpeed=
    levels[currentLevel][2];

  const length=
    levels[currentLevel][3];

  progress+=
    baseSpeed*
    currentSpeed*
    dt;

  if(progress>=length){

    progress=length;

    win();

    return;
  }

  updatePhysics(dt);

  updateCollisions();

  updateParticles(dt);


  /* ŚLAD */

  trail.push({
    x:player.x,
    y:player.y
  });

  if(trail.length>14)
    trail.shift();


  shake*=.88;

  if(shake<.1)
    shake=0;

  flash*=.88;

  barFill.style.width=
    (
      progress/
      length*
      100
    )+"%";
}


/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*
      shake,
      (Math.random()-.5)*
      shake
    );
  }

  drawBackground();

  drawGround();

  drawPads();

  drawPortals();

  for(const o of obstacles)
    drawObstacle(o);

  drawCoins();

  drawTrail();

  drawParticles();

  if(!dead)
    drawPlayer();

  ctx.restore();
}


/* =====================================================
   PĘTLA
===================================================== */

function loop(time){

  if(!lastTime)
    lastTime=time;

  let dt=
    (time-lastTime)/
    16.6667;

  lastTime=time;

  dt=Math.min(
    dt,
    2
  );

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}

requestAnimationFrame(loop);


/* =====================================================
   START GRY
===================================================== */

function startGame(){

  home.style.display="none";
  game.style.display="block";

  let level=
    completedTotal();

  if(level>=levels.length)
    level=levels.length-1;

  startLevel(level);
}


function startLevel(index){

  if(
    index<0||
    index>=levels.length
  )
    return;

  if(
    index>0&&
    !completed[index-1]
  ){

    toast(
      "🔒 Najpierw ukończ poprzedni poziom!"
    );

    return;
  }

  currentLevel=index;

  closeAllPanels();

  paused=false;
  dead=false;
  won=false;
  playing=true;

  levelTitle.textContent=
    "LEVEL "+
    (index+1)+
    " • "+
    levels[index][0];

  levelTitle.style.color=
    levels[index][1];

  createLevel();

  barFill.style.width="0%";

  lastTime=
    performance.now();

  initAudio();

  if(
    audio &&
    audio.state==="suspended"
  ){

    audio.resume().catch(()=>{});
  }
}

   RESTART
===================================================== */

function restartLevel(){

  closeAllPanels();

  paused=false;
  dead=false;
  won=false;
  playing=true;

  createLevel();

  barFill.style.width="0%";

  lastTime=
    performance.now();
}


/* =====================================================
   PAUZA
===================================================== */

function pauseGame(){

  if(!playing)
    return;

  playing=false;
  paused=true;

  pausePanel.style.display=
    "flex";
}


function resumeGame(){

  pausePanel.style.display=
    "none";

  if(!dead&&!won){

    paused=false;
    playing=true;

    lastTime=
      performance.now();
  }
}

function openLevelsMenu(){

  game.style.display="block";

  playing=false;
  paused=true;

  buildMenuLevels();

}


function showLevels(){

  pausePanel.style.display="none";
  deadPanel.style.display="none";
  winPanel.style.display="none";

  playing=false;
  paused=true;

  buildMenuLevels();

  levelsPanel.style.display=
    "flex";
}


function closeLevels(){

  levelsPanel.style.display=
    "none";

  if(
    game.style.display==="block"&&
    !dead&&
    !won
  ){

    paused=false;
    playing=true;

    lastTime=
      performance.now();
  }
}


function buildMenuLevels(){

  menuLevels.innerHTML="";

  for(
    let i=0;
    i<levels.length;
    i++
  ){

    const unlocked=
      i===0||
      completed[i-1];

    const button=
      document.createElement(
        "button"
      );

    button.className=
      "levelButton "+
      (
        unlocked
        ?"unlocked"
        :"locked"
      );

    button.innerHTML=
      (i+1)+
      ". "+
      levels[i][0]+
      "<br><small>"+
      (
        unlocked
        ?"🪙 "+
          Number(
            levelCoins[i]||0
          )+
          "/3"
        :"🔒 ZABLOKOWANY"
      )+
      "</small>";

    if(unlocked){

      button.onclick=()=>{
        startLevel(i);
      };

    }else{

      button.onclick=()=>{
        toast(
          "🔒 Ukończ poprzedni poziom!"
        );
      };
    }

    menuLevels.appendChild(
      button
    );
  }
}


/* =====================================================
   NASTĘPNY POZIOM
===================================================== */

function nextLevel(){

  if(
    currentLevel<
    levels.length-1
  ){

    startLevel(
      currentLevel+1
    );

  }else{

    backHome();
  }
}


/* =====================================================
   OSIĄGNIĘCIA
===================================================== */

function openAchievements(){

  home.style.display="none";
  game.style.display="block";

  playing=false;
  paused=true;

  achievementList.innerHTML="";

  for(
    const a of achievementData
  ){

    const done=
      !!achievements[a[0]];

    const div=
      document.createElement(
        "div"
      );

    div.className=
      "achievement "+
      (
        done
        ?"done"
        :""
      );

    div.innerHTML=
      "<b>"+
      (
        done
        ?"✅ "
        :"🔒 "
      )+
      a[1]+
      "</b><br>"+
      "<small>"+
      a[2]+
      "</small>";

    achievementList.appendChild(
      div
    );
  }

  achievementsPanel.style.display=
    "flex";
}


/* =====================================================
   USTAWIENIA
===================================================== */

function openSettings(){

  home.style.display="none";
  game.style.display="block";

  playing=false;
  paused=true;

  updateSettingsButton();

  settingsPanel.style.display=
    "flex";
}


function updateSettingsButton(){

  settingsSoundButton.textContent=
    sound
    ?"🔊 DŹWIĘK: WŁĄCZONY"
    :"🔇 DŹWIĘK: WYŁĄCZONY";
}


/* =====================================================
   ZAMYKANIE PANELI
===================================================== */

function closeAllPanels(){

  pausePanel.style.display="none";

  levelsPanel.style.display="none";

  achievementsPanel.style.display=
    "none";

  settingsPanel.style.display="none";

  deadPanel.style.display="none";

  winPanel.style.display="none";
}


function closeExtraPanel(){

  achievementsPanel.style.display=
    "none";

  settingsPanel.style.display=
    "none";

  if(game.style.display==="block"){

    game.style.display="none";
    home.style.display="block";

    playing=false;
    paused=false;

    updateHome();
  }
}


/* =====================================================
   MENU GŁÓWNE
===================================================== */

function backHome(){

  playing=false;
  paused=false;
  dead=false;
  won=false;

  closeAllPanels();

  game.style.display="none";
  home.style.display="block";

  updateHome();
}


/* =====================================================
   RESET
===================================================== */

function resetProgress(){

  const ok=
    confirm(
      "Na pewno chcesz usunąć cały postęp?"
    );

  if(!ok)
    return;

  completed=[];
  levelCoins=[];
  achievements={};

  save();

  updateHome();

  updateAchievementsPanel();

  toast(
    "🗑️ Postęp został zresetowany."
  );
}


function updateAchievementsPanel(){

  achievementList.innerHTML="";

  for(
    const a of achievementData
  ){

    const done=
      !!achievements[a[0]];

    const div=
      document.createElement(
        "div"
      );

    div.className=
      "achievement "+
      (
        done
        ?"done"
        :""
      );

    div.innerHTML=
      "<b>"+
      (
        done
        ?"✅ "
        :"🔒 "
      )+
      a[1]+
      "</b><br><small>"+
      a[2]+
      "</small>";

    achievementList.appendChild(
      div
    );
  }
}


/* =====================================================
   DŹWIĘK
===================================================== */

function toggleSound(){

  sound=!sound;

  soundButton.textContent=
    sound
    ?"🔊"
    :"🔇";

  updateSettingsButton();

  save();

  if(sound)
    beep(700,.06);
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;

function toast(text){

  toastElement.textContent=
    text;

  toastElement.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(()=>{
      toastElement.classList.remove(
        "show"
      );
    },1800);
}


/* =====================================================
   KLAWIATURA
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="Space"||
      e.code==="ArrowUp"||
      e.code==="KeyW"
    ){

      e.preventDefault();

      if(!e.repeat)
        jump();
    }


    if(
      e.code==="Escape"
    ){

      if(
        game.style.display==="block"&&
        playing
      ){

        pauseGame();
      }
    }


    if(
      e.code==="KeyR"&&
      game.style.display==="block"
    ){

      restartLevel();
    }
  }
);


/* =====================================================
   MYSZ / KLIK
===================================================== */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(
      e.pointerType==="mouse"||
      e.pointerType==="pen"
    ){

      jump();
    }
  }
);


/* =====================================================
   TELEFON
===================================================== */

mobileJump.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    jump();
  }
);


canvas.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    jump();

  },
  {
    passive:false
  }
);


/* =====================================================
   AUTO PAUZA
===================================================== */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.hidden&&
      playing&&
      !dead&&
      !won
    ){

      pauseGame();
    }
  }
);


window.addEventListener(
  "blur",
  function(){

    if(
      playing&&
      !dead&&
      !won
    ){

      pauseGame();
    }
  }
);


/* =====================================================
   AKTUALIZACJA MENU
===================================================== */

function updateHome(){

  completedCount.textContent=
    completedTotal()+
    "/12";

  coinCount.textContent=
    coinsTotal()+
    "/36";

  achievementCount.textContent=
    achievementTotal()+
    "/8";

  levelList.innerHTML="";

  for(
    let i=0;
    i<levels.length;
    i++
  ){

    const unlocked=
      i===0||
      completed[i-1];

    const card=
      document.createElement(
        "div"
      );

    card.className=
      "levelCard "+
      (
        unlocked
        ?""
        :"locked"
      );

    card.style.borderColor=
      unlocked
      ?levels[i][1]+"77"
      :"";

    card.innerHTML=
      "<div style='color:"+
      levels[i][1]+
      "'>LEVEL "+
      (i+1)+
      "</div>"+
      "<div class='levelName'>"+
      levels[i][0]+
      "</div>"+
      "<div class='levelInfo'>"+
      (
        unlocked
        ?"🪙 "+
          Number(
            levelCoins[i]||0
          )+
          "/3"
        :"🔒 ZABLOKOWANY"
      )+
      "</div>";

    levelList.appendChild(
      card
    );
  }
}


/* =====================================================
   START
===================================================== */

createMenuStars();

resize();

soundButton.textContent=
  sound
  ?"🔊"
  :"🔇";

updateSettingsButton();

updateHome();

save();

</script>

</body>
</html>
