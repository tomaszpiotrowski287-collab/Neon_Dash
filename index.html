<script>
"use strict";

/* =========================================================
   ELEMENTY
========================================================= */

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const errorBox =
    document.getElementById("errorBox");


/* =========================================================
   ROZMIAR
========================================================= */

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){

    W=Math.max(320,window.innerWidth);
    H=Math.max(240,window.innerHeight);

    canvas.width=W;
    canvas.height=H;

    if(running){
        draw();
    }
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   ZAPIS
========================================================= */

const SAVE_KEY="neon_dash_working";

const defaultSave={
    unlocked:1,
    completed:[],
    coins:0,
    selectedSkin:0,
    ownedSkins:[0],
    achievements:[],
    music:true,
    sound:true
};

let save;

function loadSave(){

    try{

        const data=
            localStorage.getItem(SAVE_KEY);

        if(data){

            save={
                ...defaultSave,
                ...JSON.parse(data)
            };

        }else{

            save={
                ...defaultSave,
                completed:[],
                ownedSkins:[0],
                achievements:[]
            };
        }

    }catch(e){

        save={
            ...defaultSave,
            completed:[],
            ownedSkins:[0],
            achievements:[]
        };
    }
}

function saveGame(){

    try{
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)
        );
    }catch(e){}
}

loadSave();


/* =========================================================
   SKINY
========================================================= */

const skins=[
    {
        name:"Neon",
        color:"#00eaff",
        price:0
    },
    {
        name:"Czerwony",
        color:"#ff3355",
        price:25
    },
    {
        name:"Zielony",
        color:"#55ff88",
        price:50
    },
    {
        name:"Fioletowy",
        color:"#b45cff",
        price:75
    },
    {
        name:"Złoty",
        color:"#ffe600",
        price:100
    },
    {
        name:"Pomarańczowy",
        color:"#ff7b00",
        price:150
    }
];


/* =========================================================
   POZIOMY
========================================================= */

const themes=[
    ["Stereo Start","#00eaff"],
    ["Blue Rush","#168cff"],
    ["Neon City","#b400ff"],
    ["Red Line","#ff3355"],
    ["Electric","#ffe600"],
    ["Purple Sky","#8d45ff"],
    ["Dark Pulse","#00ff91"],
    ["Hyper Drive","#ff7b00"],
    ["Gravity","#ff00c8"],
    ["Flash","#00ffea"],
    ["Inferno","#ff4422"],
    ["Crystal","#62a0ff"],
    ["Voltage","#aaff00"],
    ["Cyber","#00ff66"],
    ["Galaxy","#a855ff"],
    ["Final Rush","#00eaff"],
    ["Neon Storm","#ff4cff"],
    ["Ultimate Run","#00ffd5"]
];

const levels=[];

for(let i=0;i<18;i++){

    const length=3800+i*250;

    const speed=5+i*0.18;

    const obstacles=[];

    const coins=[];

    let x=600;

    while(x<length-250){

        const width=
            55+
            (Math.floor(x/250)%3)*20;

        obstacles.push({
            x:x,
            width:width,
            height:50
        });

        coins.push(x-100);

        x+=270+
            (Math.floor(x/300)%3)*45;
    }

    levels.push({
        name:themes[i][0],
        color:themes[i][1],
        length:length,
        speed:speed,
        obstacles:obstacles,
        coins:coins
    });
}


/* =========================================================
   OSIĄGNIĘCIA
========================================================= */

const achievements=[
    {
        id:"first",
        name:"Pierwszy krok",
        desc:"Ukończ pierwszy poziom."
    },
    {
        id:"five",
        name:"Rozgrzewka",
        desc:"Ukończ 5 poziomów."
    },
    {
        id:"ten",
        name:"Nie do zatrzymania",
        desc:"Ukończ 10 poziomów."
    },
    {
        id:"all",
        name:"Neon Master",
        desc:"Ukończ wszystkie poziomy."
    },
    {
        id:"coins",
        name:"Kolekcjoner",
        desc:"Zbierz 50 monet."
    }
];


/* =========================================================
   ZMIENNE GRY
========================================================= */

let levelIndex=0;
let level=null;
let player=null;

let running=false;
let paused=false;

let cameraX=0;

let collectedCoins=new Set();

let particles=[];
let confetti=[];

let leftPressed=false;
let rightPressed=false;

let lastTime=0;

let animationId=null;

let deathTimer=null;


/* =========================================================
   PODSTAWY
========================================================= */

function groundY(){
    return H-95;
}

function createPlayer(){

    return{
        x:120,
        y:groundY()-42,

        w:42,
        h:42,

        vy:0,

        grounded:true,

        rotation:0,

        squash:1,

        blinkTimer:0,

        blink:false,

        anim:0
    };
}


/* =========================================================
   PANELE
========================================================= */

function hidePanels(){

    document.querySelectorAll(".panel")
        .forEach(panel=>{
            panel.classList.add("hidden");
        });
}

function home(){

    running=false;
    paused=false;

    leftPressed=false;
    rightPressed=false;

    if(animationId!==null){
        cancelAnimationFrame(animationId);
        animationId=null;
    }

    clearTimeout(deathTimer);

    hidePanels();

    game.classList.add("hidden");

    menu.classList.remove("hidden");
}


/* =========================================================
   GRAJ
========================================================= */

function startGame(index=levelIndex){

    clearTimeout(deathTimer);

    hidePanels();

    menu.classList.add("hidden");

    game.classList.remove("hidden");

    if(index<0) index=0;

    if(index>=levels.length)
        index=levels.length-1;

    levelIndex=index;

    level=levels[levelIndex];

    player=createPlayer();

    cameraX=0;

    collectedCoins=new Set();

    particles=[];

    confetti=[];

    running=true;
    paused=false;

    leftPressed=false;
    rightPressed=false;

    document.getElementById("levelName").textContent=
        "Poziom "+
        (levelIndex+1)+
        " — "+
        level.name;

    updateProgress();

    lastTime=performance.now();

    draw();

    if(animationId!==null){
        cancelAnimationFrame(animationId);
    }

    animationId=
        requestAnimationFrame(loop);
}


/* =========================================================
   PĘTLA
========================================================= */

function loop(time){

    if(!running)
        return;

    if(paused){

        lastTime=time;

        animationId=
            requestAnimationFrame(loop);

        return;
    }

    let dt=
        (time-lastTime)/16.6667;

    if(!Number.isFinite(dt))
        dt=1;

    dt=Math.max(
        0.3,
        Math.min(2,dt)
    );

    lastTime=time;

    update(dt);

    draw();

    if(running){

        animationId=
            requestAnimationFrame(loop);
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!player || !level)
        return;

    player.anim+=dt;

    player.blinkTimer+=dt;

    if(
        player.blinkTimer>180
    ){

        player.blinkTimer=0;
        player.blink=true;

        setTimeout(()=>{
            if(player)
                player.blink=false;
        },100);
    }


    /* RUCH */

    let speed=level.speed;

    if(leftPressed)
        speed-=2;

    if(rightPressed)
        speed+=2;

    speed=Math.max(2,speed);

    player.x+=speed*dt;


    /* GRAWITACJA */

    player.vy+=0.72*dt;

    player.y+=player.vy*dt;


    const floor=
        groundY()-player.h;


    if(player.y>=floor){

        player.y=floor;

        player.vy=0;

        player.grounded=true;

        player.rotation*=0.75;

        player.squash+=
            (1-player.squash)*0.25;

    }else{

        player.grounded=false;

        player.rotation+=0.055*dt;

        player.squash+=
            (1-player.squash)*0.12;
    }


    /* KOLIZJE */

    for(const obstacle of level.obstacles){

        const ox=obstacle.x;
        const oy=
            groundY()-
            obstacle.height;

        const ow=obstacle.width;
        const oh=obstacle.height;

        const hit=
            player.x+player.w-5>ox &&
            player.x+5<ox+ow &&
            player.y+player.h-4>oy &&
            player.y+5<groundY();

        if(hit){

            die();

            return;
        }
    }


    /* MONETY */

    level.coins.forEach(
        (cx,index)=>{

            if(
                collectedCoins.has(index)
            )
                return;

            const cy=
                groundY()-95;

            const dx=
                player.x+
                player.w/2-
                cx;

            const dy=
                player.y+
                player.h/2-
                cy;

            if(
                Math.hypot(dx,dy)<35
            ){

                collectedCoins.add(index);

                save.coins++;

                saveGame();

                beep(
                    880,
                    0.1,
                    "sine",
                    0.04
                );

                coinParticles(
                    cx,
                    cy
                );

                checkAchievements();
            }
        }
    );


    /* KAMERA */

    const target=
        player.x-150;

    if(target>cameraX){

        cameraX+=
            (target-cameraX)*
            0.12*
            dt;
    }

    cameraX=
        Math.max(
            0,
            cameraX
        );


    /* META */

    if(
        player.x>=level.length
    ){

        win();

        return;
    }


    /* PARTICLES */

    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=0.12*dt;

        p.life-=dt;
    }

    particles=
        particles.filter(
            p=>p.life>0
        );

    updateProgress();
}


/* =========================================================
   SKOK
========================================================= */

function jump(){

    if(
        !running ||
        paused ||
        !player
    )
        return;

    if(player.grounded){

        player.vy=-13;

        player.grounded=false;

        player.squash=0.82;

        beep(
            520,
            0.08,
            "square",
            0.03
        );

        jumpParticles();
    }
}


/* =========================================================
   ŚMIERĆ
========================================================= */

function die(){

    if(!running)
        return;

    running=false;

    beep(
        110,
        0.18,
        "sawtooth",
        0.04
    );

    deathTimer=setTimeout(()=>{

        const again=
            confirm(
                "Ups! Rozbiłeś się.\n\nZagrać jeszcze raz?"
            );

        if(again){

            startGame(levelIndex);

        }else{

            home();
        }

    },250);
}


/* =========================================================
   WYGRANA
========================================================= */

function win(){

    if(!running)
        return;

    running=false;

    beep(
        660,
        0.12,
        "triangle",
        0.04
    );

    setTimeout(()=>{
        beep(
            880,
            0.12,
            "triangle",
            0.04
        );
    },120);

    if(
        !save.completed.includes(
            levelIndex
        )
    ){

        save.completed.push(
            levelIndex
        );

        save.coins+=5;

        if(
            levelIndex<
            levels.length-1
        ){

            save.unlocked=
                Math.max(
                    save.unlocked,
                    levelIndex+2
                );
        }

        saveGame();
    }

    checkAchievements();

    createConfetti();

    document
        .getElementById("winPanel")
        .classList
        .remove("hidden");

    const next=
        document.getElementById(
            "nextButton"
        );

    next.style.display=
        levelIndex<
        levels.length-1
        ?"block"
        :"none";

    let start=performance.now();

    function celebration(time){

        updateConfetti();

        draw();

        if(
            time-start<1600 &&
            !document
                .getElementById(
                    "winPanel"
                )
                .classList
                .contains("hidden")
        ){

            requestAnimationFrame(
                celebration
            );
        }
    }

    requestAnimationFrame(
        celebration
    );
}


/* =========================================================
   POSTĘP
========================================================= */

function updateProgress(){

    if(!level || !player)
        return;

    const percent=
        Math.max(
            0,
            Math.min(
                100,
                player.x/
                level.length*
                100
            )
        );

    document.getElementById(
        "progressText"
    ).textContent=
        Math.floor(percent)+"%";

    document.getElementById(
        "levelProgressBar"
    ).style.width=
        percent+"%";
}


/* =========================================================
   RYSOWANIE
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    if(!level || !player){

        drawMenuBackground();

        return;
    }

    drawBackground();

    drawGround();

    drawObstacles();

    drawCoins();

    drawFinish();

    drawParticles();

    drawPlayer();

    drawConfetti();

/* TŁO GRY */

function drawBackground(){

        ctx.createLinearGradient(
            0,
            0,
            0,

        );

    gradient.addColorStop(
        0,
        "#09092a"
    );

    gradient.addColorStop(
        0.6,

    );

        1,
        "#020204"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const color=level.color;

    ctx.strokeStyle=
        color+"18";

    const grid=60;

    const offset=
        -(cameraX*0.25)%grid;


    for(
        let x=offset;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();
    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();
    }
}

/* =========================================================
   ⭐ POSTAĆ ⭐

   TYLKO JEDNA BRYŁA.

   BRAK:
   - RĄK
   - NÓG
   - GŁOWY
   - TUŁOWIA
   - BUTÓW

function drawPlayer(){

    if(!player)
        return;

    const skin=
        skins[
            save.selectedSkin
        ] || skins[0];

    const x=
        player.x-cameraX;

    const y=
        player.y;

    const size=42;

    const cx=
        x+size/2;

    const cy=
        y+size/2;


    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        player.rotation
    );


    ctx.scale(
        player.squash,
        2-player.squash
    );


    ctx.translate(
        -size/2,
        -size/2
    );


    /* JEDNA BRYŁA */

    ctx.fillStyle=
        skin.color;

    ctx.shadowColor=
        skin.color;

    ctx.shadowBlur=18;


    ctx.beginPath();

    ctx.roundRect(
        0,
        0,
        size,
        size,
        7
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /* OCZY */

    ctx.fillStyle="#101018";


    if(player.blink){

        ctx.fillRect(
            8,
            18,
            8,
            2
        );

        ctx.fillRect(
            26,
            18,
            8,
            2
        );

    }else{

        ctx.beginPath();

        ctx.arc(
            13,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            29,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="white";


        ctx.beginPath();

        ctx.arc(
            12,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            28,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* USTA */

    ctx.strokeStyle="#101018";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        15,
        30
    );

    ctx.lineTo(
        27,
        30
    );

    ctx.stroke();


    ctx.restore();
}

function createConfetti(){

    confetti=[];

    const colors=[
        "#00eaff",
        "#ff3d68",
        "#ffe600",
        "#55ff88",
        "#b45cff",
        "#ff7b00"
    ];

    for(let i=0;i<70;i++){

        confetti.push({

            x:Math.random()*W,

            y:-Math.random()*H,

            vx:(Math.random()-0.5)*4,

            vy:Math.random()*4+2,

            size:Math.random()*7+3,

            rotation:Math.random()*6,

            color:
                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ]
        });
    }
}


function updateConfetti(){

    for(
        const c
        of confetti
    ){

        c.x+=c.vx;

        c.y+=c.vy;

        c.vy+=0.04;

        c.rotation+=0.05;

        if(c.y>H+20){

            c.y=-20;

            c.x=Math.random()*W;
        }
    }
}


function drawConfetti(){

    if(!confetti.length)
        return;

    for(
        const c
        of confetti
    ){

        ctx.save();

        ctx.translate(
            c.x,
            c.y
        );

        ctx.rotate(
            c.rotation
        );

        ctx.fillStyle=c.color;

        ctx.fillRect(
            -c.size/2,
            -c.size/2,
            c.size,
            c.size
        );

        ctx.restore();
    }
}

let audioContext=null;


function getAudio(){

    try{

        const AudioClass=
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass)
            return null;

        if(!audioContext)
            audioContext=
                new AudioClass();

        if(
            audioContext.state===
            "suspended"
        ){

            audioContext.resume()
                .catch(()=>{});
        }

        return audioContext;

    }catch(e){

        return null;
    }
}


function beep(
    frequency,
    duration,
    type,
    volume
){

    if(!save.sound)
        return;

    const audio=getAudio();

    if(!audio)
        return;

    try{

        const oscillator=
            audio.createOscillator();

        const gain=
            audio.createGain();

        oscillator.type=
            type || "square";

        oscillator.frequency.value=
            frequency || 440;

        gain.gain.setValueAtTime(
            volume || 0.03,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime+
            (duration || 0.1)
        );

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime+
            (duration || 0.1)
        );

    }catch(e){}
}
