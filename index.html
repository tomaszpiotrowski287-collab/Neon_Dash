<script>

  {name:"OVERDRIVE",diff:"⭐⭐⭐⭐⭐⭐",speed:365,color:"#ff3bea",bpm:154,wave:"square",notes:[247,330,440,523,659,523,440,330],gravity:1},
  {name:"FINAL CHAOS",diff:"⭐⭐⭐⭐⭐⭐",speed:375,color:"#ff247f",bpm:158,wave:"sawtooth",notes:[220,330,440,659,523,784,659,440],gravity:1}
];

/* =========================================================
   DOM
========================================================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const levelsBox=document.getElementById("levels");
const achievements=document.getElementById("achievements");
const achList=document.getElementById("achList");

const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

const levelName=document.getElementById("levelName");
const coinsText=document.getElementById("coins");
const percent=document.getElementById("percent");
const menuBar=document.getElementById("menuBar");
const gameBar=document.getElementById("gameBar");
const progressText=document.getElementById("progressText");
const doneText=document.getElementById("doneText");

/* =========================================================
   STORAGE
========================================================= */

function get(key,def){
  try{
    const value=localStorage.getItem(key);
    return value===null?def:value;
  }catch{
    return def;
  }
}

function set(key,value){
  try{
    localStorage.setItem(key,String(value));
  }catch{}
}

function completed(index){
  return get("nd_level_"+index,"0")==="1";
}

function completedCount(){
  let count=0;

  for(let i=0;i<LEVELS.length;i++){
    if(completed(i)) count++;
  }

  return count;
}

/* =========================================================
   ACHIEVEMENTS
========================================================= */

const ACH=[
  ["first","🎮 Pierwszy krok","Ukończ poziom 1."],
  ["three","⚡ Rozgrzewka","Ukończ 3 poziomy."],
  ["six","🔥 Weteran","Ukończ 6 poziomów."],
  ["all","👑 Mistrz Neon Dash","Ukończ wszystkie poziomy."],
  ["final","💀 Chaos pokonany","Ukończ FINAL CHAOS."],
  ["coins10","🪙 Łowca monet","Zbierz 10 monet."],
  ["coins25","💰 Kolekcjoner","Zbierz 25 monet."],
  ["perfect","💎 Perfekcja","Ukończ poziom bez śmierci."],
  ["survivor","🛡️ Twardziel","Ukończ poziom po 3+ śmierciach."],
  ["allcoins","🌟 Pełna kolekcja","Zbierz wszystkie 3 monety w jednym przejściu."]
];

function achUnlocked(id){
  return get("nd_ach_"+id,"0")==="1";
}

function unlock(id){
  if(achUnlocked(id)) return;
  set("nd_ach_"+id,"1");
  renderAchievements();
}

function checkAchievements(){
  const count=completedCount();

  if(count>=1) unlock("first");
  if(count>=3) unlock("three");
  if(count>=6) unlock("six");
  if(count>=LEVELS.length) unlock("all");

  if(completed(LEVELS.length-1)) unlock("final");

  const total=Number(get("nd_totalCoins","0"));

  if(total>=10) unlock("coins10");
  if(total>=25) unlock("coins25");

  if(deaths===0) unlock("perfect");
  if(deaths>=3) unlock("survivor");
  if(runCoins===3) unlock("allcoins");
}

function renderAchievements(){
  achList.innerHTML="";

  for(const a of ACH){
    const div=document.createElement("div");

    div.className=
      "ach"+
      (achUnlocked(a[0])?" on":"");

    div.innerHTML=
      "<b>"+a[1]+"</b><br>"+
      "<small>"+a[2]+"</small>";

    achList.appendChild(div);
  }
}

/* =========================================================
   MENU
========================================================= */

function renderMenu(){
  levelsBox.innerHTML="";

  LEVELS.forEach((level,index)=>{
    const button=document.createElement("button");

    button.type="button";
    button.className="level";

    button.innerHTML=
      '<span class="levelStatus">'+
      (completed(index)?"✅":"▶️")+
      '</span>'+
      '<div class="levelName">'+
      (index+1)+". "+level.name+
      '</div>'+
      '<div class="levelInfo">'+
      level.diff+
      " • "+
      level.speed+
      " px/s • "+
      level.bpm+
      " BPM"+
      '</div>';

    button.addEventListener("click",e=>{
      e.preventDefault();
      e.stopPropagation();

      /*
        Najważniejsze:
        audio jest uruchamiane bezpośrednio
        z kliknięcia przycisku.
      */
      prepareAudioFromUserGesture();

      startLevel(index,true);
    });

    levelsBox.appendChild(button);
  });

  const done=completedCount();

  const progress=
    Math.round(done/LEVELS.length*100);

  progressText.textContent=progress+"%";
  menuBar.style.width=progress+"%";

  doneText.textContent=

}

document.getElementById("achBtn").addEventListener("click",()=>{
  achievements.style.display="flex";
  renderAchievements();
});

document.getElementById("closeAch").addEventListener("click",()=>{
  achievements.style.display="none";
});

/* =========================================================
   CANVAS
========================================================= */

let W=window.innerWidth;
let H=window.innerHeight;
let ground=H*.78;
let dpr=1;

/* =========================================================
   PLAYER
========================================================= */

const player={
  x:150,
  y:0,
  size:34,
  vy:0,
  rot:0,
  grounded:false
};

/* =========================================================
   GAME STATE
========================================================= */

let current=0;
let running=false;
let paused=false;
let finished=false;
let dying=false;

let world=0;
let last=0;
let raf=0;

let deaths=0;
let runCoins=0;
let collected=new Set();

let obstacles=[];
let coinObjects=[];
let pads=[];
let portals=[];
let particles=[];
let stars=[];
let trail=[];

let shake=0;
let flash=0;
let gravityDirection=1;
let speedBoost=1;
let levelLength=0;

/* =========================================================
   RESIZE
========================================================= */

function resize(){
  W=Math.max(240,window.innerWidth);
  H=Math.max(240,window.innerHeight);

  dpr=Math.min(
    Math.max(window.devicePixelRatio||1,1),
    2
  );

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  ground=Math.max(
    150,
    Math.min(H-45,H*.78)
  );

  if(!running){
    player.y=
      gravityDirection===1
      ?ground-player.size
      :0;
  }

  createStars();
}

window.addEventListener("resize",resize,{passive:true});

window.addEventListener("orientationchange",()=>{
  setTimeout(resize,150);
},{passive:true});

/* =========================================================
   AUDIO
========================================================= */

let audio=null;
let musicTimer=null;
let musicIndex=0;
let musicStep=0;

let sound=
  get("nd_sound","1")==="1";

function initAudio(){
  if(audio) return true;

  try{
    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext){
      return false;
    }

    audio=new AudioContext();

    return true;
  }catch{
    return false;
  }
}

/*
  Ta funkcja jest wywoływana BEZPOŚREDNIO
  podczas kliknięcia/tapnięcia użytkownika.
*/
function prepareAudioFromUserGesture(){

  if(!sound){
    return;
  }

  if(!initAudio()){
    return;
  }

  try{
    if(audio.state==="suspended"){
      audio.resume().then(()=>{
        if(running&&!paused&&sound){
          startMusic();
        }
      }).catch(()=>{});
    }else if(audio.state==="running"){
      if(running&&!paused){
        startMusic();
      }
    }
  }catch{}
}

async function unlockAudio(){
  if(!initAudio()){
    return false;
  }

  try{
    if(audio.state==="suspended"){
      await audio.resume();
    }

    return audio.state==="running";
  }catch{
    return false;
  }
}

function playTone(
  frequency,
  duration=.1,
  type="square",
  volume=.04,
  when=0
){
  if(
    !sound||
    !audio||
    audio.state!=="running"
  ){
    return;
  }

  try{
    const now=
      audio.currentTime+when;

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    const filter=
      audio.createBiquadFilter();

    osc.type=type;

    osc.frequency.setValueAtTime(
      frequency,
      now
    );

    filter.type="lowpass";

    filter.frequency.setValueAtTime(
      5000,
      now
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      Math.max(volume,.0002),
      now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now+duration
    );

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audio.destination);

    osc.start(now);
    osc.stop(now+duration+.03);
  }catch{}
}

function playKick(){
  if(
    !audio||
    !sound||
    audio.state!=="running"
  ){
    return;
  }

  try{
    const now=audio.currentTime;

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
      120,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      45,
      now+.12
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .08,
      now+.005
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now+.14
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(now);
    osc.stop(now+.16);
  }catch{}
}

function playHat(){
  if(
    !audio||
    !sound||
    audio.state!=="running"
  ){
    return;
  }

  try{
    const buffer=
      audio.createBuffer(
        1,
        Math.floor(audio.sampleRate*.035),
        audio.sampleRate
      );

    const data=
      buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
      data[i]=
        (Math.random()*2-1)*.2;
    }

    const source=
      audio.createBufferSource();

    const gain=
      audio.createGain();

    const filter=
      audio.createBiquadFilter();

    filter.type="highpass";
    filter.frequency.value=4500;

    gain.gain.value=.035;

    source.buffer=buffer;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(audio.destination);

    source.start();
  }catch{}
}

function startMusic(){

  stopMusic();

  if(
    !sound||
    !audio||
    audio.state!=="running"||
    !running||
    paused
  ){
    return;
  }

  const level=LEVELS[current];

  musicIndex=0;
  musicStep=0;

  const interval=
    Math.max(
      75,
      60000/(level.bpm*2)
    );

  function musicTick(){

    if(
      !running||
      paused||
      !sound||
      !audio||
      audio.state!=="running"
    ){
      stopMusic();
      return;
    }

    const note=
      level.notes[
        musicIndex%level.notes.length
      ];

    const step=
      musicStep%8;

    playTone(
      note,
      .13,
      level.wave,
      .035
    );

    if(step%2===0){

      playTone(
        note/2,
        .18,
        "sine",
        .028
      );

      playKick();

    }else{

      playHat();
    }

    if(step===3||step===7){

      playTone(
        note*1.5,
        .09,
        "triangle",
        .02
      );
    }

    musicIndex++;
    musicStep++;
  }

  musicTick();

  musicTimer=
    setInterval(
      musicTick,
      interval
    );
}

function stopMusic(){

  if(musicTimer!==null){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}

function playJumpSound(){
  playTone(520,.08,"square",.06);
  playTone(780,.06,"triangle",.025,.02);
}

function playCoinSound(){

}

function playDeathSound(){

}

function playPortalSound(){

}

function playWinSound(){
  [523,659,784,1047].forEach((n,i)=>{

    );

}

/* =========================================================
   START LEVEL
========================================================= */

function startLevel(index,newRun=true){

  if(
    index<0||
    index>=LEVELS.length
  ){
    return;
  }

  current=index;

  if(newRun){

    deaths=0;
    runCoins=0;
    collected=new Set();
  }

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){
    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="block";
  menu.style.display="none";

  pause.style.display="none";
  finish.style.display="none";

  world=0;
  speedBoost=1;
  last=performance.now();

  particles=[];
  trail=[];
  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];

  shake=0;
  flash=0;

  gravityDirection=
    LEVELS[current].gravity;

  levelLength=
    10500+
    current*650;

  resetPlayer();
  generateLevel();
  createStars();

  levelName.textContent=
    (current+1)+
    " • "+
    LEVELS[current].name;

  coinsText.textContent=
    "🪙 "+
    runCoins+
    "/3";

  percent.textContent="0%";
  gameBar.style.width="0%";

  running=true;

  draw();

  raf=
    requestAnimationFrame(loop);

  /*
    Jeżeli AudioContext jest już odblokowany,
    muzyka startuje od razu.
  */
  if(
    sound&&
    audio&&
    audio.state==="running"
  ){
    startMusic();
  }
}

/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayer(){

  player.x=
    Math.max(
      75,
      Math.min(180,W*.22)
    );

  player.y=
    gravityDirection===1
    ?ground-player.size
    :0;

  player.vy=0;
  player.rot=0;
  player.grounded=true;
}

/* =========================================================
   LEVEL GENERATION
========================================================= */

function generateLevel(){

  let x=620;
  let patternIndex=0;

  const patterns=[
    "spike",
    "double",
    "saw",
    "gap",
    "pad",
    "spike",
    "saw",
    "speed",
    "double",
    "gap",
    "spikeSaw",
    "gravity",
    "triple",
    "saw"
  ];

  while(x<levelLength-700){

    const type=
      patterns[
        patternIndex%patterns.length
      ];

    switch(type){

      case "spike":
        spike(x);
        x+=420;
        break;

      case "double":
        spike(x);
        spike(x+64);
        x+=530;
        break;

      case "triple":
        spike(x);
        spike(x+62);
        spike(x+124);
        x+=630;
        break;

      case "saw":
        saw(x);
        x+=510;
        break;

      case "spikeSaw":
        spike(x);
        saw(x+230);
        x+=660;
        break;

      case "gap":
        gap(x,155);
        x+=650;
        break;

      case "pad":
        pad(x);
        spike(x+210);
        x+=620;
        break;

      case "speed":
        speedPortal(x,1.18);
        spike(x+250);
        saw(x+490);
        x+=790;
        break;

      case "gravity":
        gravityPortal(x);
        spike(x+290);
        spike(x+355);
        x+=760;
        break;
    }

    patternIndex++;
  }

  const positions=[
    levelLength*.24,
    levelLength*.51,
    levelLength*.78
  ];

  positions.forEach((originalX,index)=>{

    let finalX=originalX;

    for(let tries=0;tries<50;tries++){

      let bad=false;

      for(const obstacle of obstacles){

        if(obstacle.type==="gap"){

          if(
            finalX>obstacle.x-110&&
            finalX<
              obstacle.x+
              obstacle.w+
              110
          ){
            bad=true;
            break;
          }

        }else{

          if(
            Math.abs(
              finalX-obstacle.x
            )<125
          ){
            bad=true;
            break;
          }
        }
      }

      if(!bad) break;

      finalX+=100;
    }

    coinObjects.push({
      id:index,
      x:Math.min(
        finalX,
        levelLength-250
      ),
      collected:collected.has(index)
    });
  });
}

/* =========================================================
   OBJECTS
========================================================= */

function spike(x){
  obstacles.push({
    type:"spike",
    x
  });
}

function saw(x){
  obstacles.push({
    type:"saw",
    x,
    r:28
  });
}

function gap(x,w){
  obstacles.push({
    type:"gap",
    x,
    w
  });
}

function pad(x){
  pads.push({
    x,
    used:false
  });
}

function speedPortal(x,mult){
  portals.push({
    type:"speed",
    x,
    mult,
    used:false
  });
}

function gravityPortal(x){
  portals.push({
    type:"gravity",
    x,
    used:false
  });
}

   INPUT

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  const level=LEVELS[current];

  let speed=
    level.speed*
    speedBoost;

  for(const portal of portals){

    if(
      portal.type==="speed"&&
      world+player.x>
        portal.x&&
      world+player.x<
        portal.x+170
    ){

      speed*=portal.mult;
    }
  }

  speedBoost+=
    (1-speedBoost)*
    Math.min(1,dt*4);

  world+=speed*dt;

  const gravity=
    2100*
    gravityDirection;

  player.vy+=gravity*dt;
  player.y+=player.vy*dt;

  const onGap=
    gapUnder();

  if(gravityDirection===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !onGap
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*
        (Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8.5;
    }

  }else{

    const ceiling=0;

    if(
      player.y<=ceiling&&
      !onGap
    ){

      player.y=ceiling;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*
        (Math.PI/2);

    }else{

      player.grounded=false;
      player.rot-=dt*8.5;
    }
  }

  checkPads();
  checkPortals();
  checkCoins();
  collisions();

  if(
    player.y>H+120||
    player.y<-120
  ){

    die();
    return;
  }

  if(Math.random()<.9){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.32,
      size:16+
        Math.random()*7
    });
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){

    shake=Math.max(
      0,
      shake-dt*16
    );
  }

  if(flash>0){

    flash=Math.max(
      0,
      flash-dt*3.5
    );
  }
}

function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;

  for(const obstacle of obstacles){

    if(
      obstacle.type==="gap"&&
      center>obstacle.x&&
      center<
        obstacle.x+
        obstacle.w
    ){

      return true;
    }
  }

  return false;
}

/* =========================================================
   MECHANICS
========================================================= */

function checkPads(){

  for(const padObject of pads){

    if(padObject.used) continue;

    const px=
      world+
      player.x+
      player.size/2;

    if(
      px>padObject.x&&
      px<padObject.x+55&&
      player.grounded
    ){

      padObject.used=true;

      player.vy=
        -1000*
        gravityDirection;

      player.grounded=false;

      particlesPad(
        padObject.x-world
      );

      playTone(
        620,
        .12,
        "triangle",
        .06
      );

      shake=5;
    }
  }
}

function checkPortals(){

  for(const portal of portals){

    if(portal.used) continue;

    const px=
      world+
      player.x+
      player.size/2;

    if(
      px>portal.x&&
      px<portal.x+60
    ){

      portal.used=true;

      if(portal.type==="speed"){

        speedBoost=portal.mult;

        particlesPortal(
          portal.x-world,
          "#ffe14a"
        );

        playPortalSound();

        shake=4;
      }

      if(portal.type==="gravity"){

        gravityDirection*=-1;

        player.vy=0;
        player.grounded=false;

        particlesPortal(
          portal.x-world,
          "#ff4be8"
        );

        playPortalSound();

        shake=7;
      }
    }
  }
}

function checkCoins(){

  for(const coin of coinObjects){

    if(coin.collected) continue;

    const x=
      coin.x-world;

    const y=
      gravityDirection===1
      ?ground-125
      :125;

    const px=
      player.x+17;

    const py=
      player.y+17;

    if(
      Math.hypot(
        px-x,
        py-y
      )<38
    ){

      coin.collected=true;

      collected.add(coin.id);

      runCoins=
        collected.size;

      coinsText.textContent=
        "🪙 "+
        runCoins+
        "/3";

      particlesCoin(x,y);
      playCoinSound();

      shake=3;
    }
  }
}

/* =========================================================
   COLLISIONS
========================================================= */

function collisions(){

  const px=
    world+
    player.x;

  const size=
    player.size;

  const left=
    px+5;

  const right=
    px+size-5;

  const top=
    player.y+5;

  const bottom=
    player.y+size-5;

  for(const obstacle of obstacles){

    if(obstacle.type==="spike"){

      const sx=
        obstacle.x;

      const sw=46;

      if(
        right>sx+6&&
        left<sx+sw-5
      ){

        if(gravityDirection===1){

          if(bottom>ground-43){

            die();
            return;
          }

        }else{

          if(top<43){

            die();
            return;
          }
        }
      }
    }

    if(obstacle.type==="saw"){

      const cx=
        obstacle.x;

      const cy=
        gravityDirection===1
        ?ground-obstacle.r
        :obstacle.r;

      const closestX=
        Math.max(
          left,
          Math.min(cx,right)
        );

      const closestY=
        Math.max(
          top,
          Math.min(cy,bottom)
        );

      const dx=
        cx-closestX;

      const dy=
        cy-closestY;

      const hitRadius=
        obstacle.r-5;

      if(
        dx*dx+
        dy*dy<
        hitRadius*hitRadius
      ){

        die();
        return;
      }
    }

    if(obstacle.type==="gap"){

      const center=
        world+
        player.x+
        size/2;

      if(
        gravityDirection===1&&
        center>obstacle.x&&
        center<
          obstacle.x+
          obstacle.w&&
        bottom>=ground-5
      ){

        die();
        return;
      }

      if(
        gravityDirection===-1&&
        center>obstacle.x&&
        center<
          obstacle.x+
          obstacle.w&&
        top<=5
      ){

        die();
        return;
      }
    }
  }
}

/* =========================================================
   DEATH
========================================================= */

function die(){

  if(
    dying||
    finished||
    !running
  ){

    return;
  }

  dying=true;
  running=false;

  deaths++;

  shake=16;
  flash=1;

  stopMusic();

  playDeathSound();
  particlesDeath();

  setTimeout(()=>{

    if(!dying){
      return;
    }

    dying=false;

    startLevel(
      current,
      false
    );

    for(const coin of coinObjects){

      coin.collected=
        collected.has(coin.id);
    }

    runCoins=
      collected.size;

    coinsText.textContent=
      "🪙 "+
      runCoins+
      "/3";

    if(sound){

      prepareAudioFromUserGesture();

      if(
        audio&&
        audio.state==="running"
      ){

        startMusic();
      }
    }

  },650);
}

/* =========================================================
   WIN
========================================================= */

function checkWin(){

  if(world>=levelLength){
    finishLevel();
  }
}

function finishLevel(){

  if(finished){
    return;
  }

  finished=true;
  running=false;

  stopMusic();

  playWinSound();

  set(
    "nd_level_"+current,
    "1"
  );

  const oldTotal=
    Number(
      get(
        "nd_totalCoins",
        "0"
      )
    );

  const previous=
    Number(
      get(
        "nd_lastCoins_"+current,
        "-1"
      )
    );

  if(previous!==runCoins){

    set(
      "nd_lastCoins_"+current,
      runCoins
    );

    set(
      "nd_totalCoins",
      oldTotal+runCoins
    );
  }

  checkAchievements();

  particlesWin();

  document.getElementById(
    "finishTitle"
  ).textContent=
    "🎉 POZIOM UKOŃCZONY!";

  document.getElementById(
    "finishInfo"
  ).textContent=
    LEVELS[current].name+
    " • 🪙 "+
    runCoins+
    "/3"+
    " • ☠️ "+
    deaths+
    " śmierci";

  document.getElementById(
    "nextLevel"
  ).style.display=
    current<LEVELS.length-1
    ?"block"
    :"none";

  finish.style.display="flex";

  renderMenu();

  victoryAnimation();
}

/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!running&&!dying){
    return;
  }

  if(paused){

    last=time;

    raf=
      requestAnimationFrame(loop);

    return;
  }

  if(dying){

    draw();

    raf=
      requestAnimationFrame(loop);

    return;
  }

  let dt=
    (time-last)/1000;

  if(
    !Number.isFinite(dt)||
    dt<0
  ){

    dt=0;
  }

  dt=
    Math.min(dt,.05);

  last=time;

  update(dt);
  draw();
  checkWin();

  if(running||dying){

    raf=
      requestAnimationFrame(loop);
  }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  const level=
    LEVELS[current];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(
    0,
    "#080b20"
  );

  gradient.addColorStop(
    .55,
    "#040614"
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  drawStars();
  drawGrid();
  drawSpeedLines();

  ctx.fillStyle="#090b17";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle=
    level.color;

  ctx.lineWidth=3;

  ctx.shadowColor=
    level.color;

  ctx.shadowBlur=14;

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  for(const obstacle of obstacles){

    const x=
      obstacle.x-world;

    if(
      x<-150||
      x>W+150
    ){
      continue;
    }

    if(
      obstacle.type==="spike"
    ){
      drawSpike(x);
    }

    if(
      obstacle.type==="saw"
    ){
      drawSaw(
        x,
        obstacle.r
      );
    }

    if(
      obstacle.type==="gap"
    ){

      ctx.fillStyle="#010106";

      ctx.fillRect(
        x,
        ground,
        obstacle.w,
        H-ground
      );
    }
  }

  for(const padObject of pads){

    const x=
      padObject.x-world;

    if(
      x>-80&&
      x<W+80
    ){

      drawPad(x);
    }
  }

  for(const portal of portals){

    const x=
      portal.x-world;

    if(
      x>-100&&
      x<W+100
    ){

      if(
        portal.type==="speed"
      ){

        drawSpeedPortal(x);

      }else{

        drawGravityPortal(x);
      }
    }
  }

  for(const coin of coinObjects){

    if(coin.collected){
      continue;
    }

    const x=
      coin.x-world;

    if(
      x>-50&&
      x<W+50
    ){

      drawCoin(
        x,
        gravityDirection===1
        ?ground-125
        :125
      );
    }
  }

  drawTrail();

  if(
    !dying&&
    !finished
  ){

    drawPlayer();
  }

  drawParticles();

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(
        .5,
        flash*.5
      )+
      ")";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }

  ctx.restore();

  const progress=
    Math.min(
      100,
      Math.floor(
        world/
        levelLength*
        100
      )
    );

  percent.textContent=
    progress+"%";

  gameBar.style.width=
    progress+"%";
}

/* =========================================================
   PLAYER
========================================================= */

/*
  WAŻNE:
  POSTAĆ MA TYLKO KWADRAT + OCZY.
  NIE MA:
  - rąk
  - nóg
  - butów
  - ciała dodatkowego
  - żadnych kończyn
*/

let nextBlink=
  performance.now()+3000;

let blinkUntil=0;

function updateBlink(){

  const now=
    performance.now();

  if(now>=nextBlink){

    blinkUntil=
      now+120;

    nextBlink=
      now+
      2400+
      Math.random()*3200;
  }
}

function drawPlayer(){

  updateBlink();

  const color=
    LEVELS[current].color;

  const now=
    performance.now();

  const blinking=
    now<blinkUntil;

  const pulse=
    1+
    Math.sin(now/80)*.025;

  ctx.save();

  ctx.translate(
    player.x+17,
    player.y+17
  );

  ctx.rotate(
    player.rot
  );

  ctx.scale(
    pulse,
    pulse
  );

  /*
    JEDYNY KSZTAŁT POSTACI:
    neonowy kwadrat.
  */

  ctx.shadowColor=
    color;

  ctx.shadowBlur=22;

  ctx.fillStyle=
    color;

  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );

  ctx.shadowBlur=0;

  /*
    OCZY.
  */

  ctx.fillStyle="#050510";

  if(blinking){

    ctx.fillRect(
      -11,
      -4,
      7,
      2
    );

    ctx.fillRect(
      4,
      -4,
      7,
      2
    );

  }else{

    ctx.fillRect(
      -10,
      -8,
      5,
      7
    );

    ctx.fillRect(
      5,
      -8,
      5,
      7
    );
  }

  ctx.restore();
}

/* =========================================================
   SPIKE
========================================================= */

function drawSpike(x){

  const color=
    LEVELS[current].color;

  ctx.save();

  ctx.fillStyle=
    color;

  ctx.shadowColor=
    color;

  ctx.shadowBlur=17;

  ctx.beginPath();

  if(gravityDirection===1){

    ctx.moveTo(
      x,
      ground
    );

    ctx.lineTo(
      x+23,
      ground-47
    );

    ctx.lineTo(
      x+46,
      ground
    );

  }else{

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+23,
      47
    );

    ctx.lineTo(
      x+46,
      0
    );
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=1;

  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   SAW
========================================================= */

function drawSaw(x,r){

  const color=
    LEVELS[current].color;

  const cy=
    gravityDirection===1
    ?ground-r
    :r;

  ctx.save();

  ctx.translate(
    x,
    cy
  );

  ctx.rotate(
    performance.now()/280
  );

  ctx.fillStyle=
    color;

  ctx.shadowColor=
    color;

  ctx.shadowBlur=18;

  const teeth=14;

  ctx.beginPath();

  for(
    let i=0;
    i<teeth*2;
    i++
  ){

    const angle=
      i*Math.PI/teeth;

    const radius=
      i%2===0
      ?r
      :r*.7;

    const xx=
      Math.cos(angle)*radius;

    const yy=
      Math.sin(angle)*radius;

    if(i===0){

      ctx.moveTo(
        xx,
        yy
      );

    }else{

      ctx.lineTo(
        xx,
        yy
      );
    }
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   BACKGROUND
========================================================= */

function createStars(){

  stars=[];

  for(let i=0;i<90;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*
        Math.max(
          100,
          ground*.9
        ),
      r:Math.random()*2+.4,
      v:Math.random()*.9+.15,
      a:Math.random()*.5+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="#fff";

  for(const star of stars){

    star.x-=star.v;

    if(star.x<0){

      star.x=
        W+
        Math.random()*40;
    }

    ctx.globalAlpha=
      star.a;

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const color=
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.08;

  const size=70;

  const offset=
    -(world*.25)%size;

  for(
    let x=offset;
    x<W;
    x+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      ground
    );

    ctx.stroke();
  }

  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const color=
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.1;
  ctx.lineWidth=2;

  const offset=
    -(world*.8)%190;

  for(
    let x=offset-190;
    x<W+190;
    x+=190
  ){

    const range=
      Math.max(
        100,
        ground-150
      );

    const y=
      100+
      Math.abs(x*7)%range;

    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );

    ctx.lineTo(
      x+80,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   TRAIL
========================================================= */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;

    if(
      trail[i].life<=0
    ){

      trail.splice(
        i,
        1
      );
    }
  }

  if(trail.length>38){

    trail.splice(
      0,
      trail.length-38
    );
  }
}

function drawTrail(){

  const color=
    LEVELS[current].color;

  for(const item of trail){

    ctx.globalAlpha=
      Math.max(
        0,
        item.life/.32
      )*.35;

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    ctx.fillRect(
      item.x-item.size/2,
      item.y-item.size/2,
      item.size,
      item.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =========================================================
   PARTICLES
========================================================= */

function particle(
  x,
  y,
  vx,
  vy,
  life,
  size,
  type
){

  if(
    particles.length>=300
  ){
    return;
  }

  particles.push({
    x,
    y,
    vx,
    vy,
    life,
    max:life,
    size,
    type,
    rot:Math.random()*Math.PI*2,
    spin:(Math.random()-.5)*12
  });
}

function particlesJump(){

  for(let i=0;i<10;i++){

    particle(

}

    );

function particlesPortal(x,color){

  for(let i=0;i<32;i++){

    particle(
      x,
      H*.48,
      (Math.random()-.5)*330,
      (Math.random()-.5)*330,
      .8,
      4,

    );
  }

function particlesWin(){

  for(let i=0;i<150;i++){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*750,
      (Math.random()-.8)*750,
      1.5+Math.random(),
      Math.random()*8+3,
      "win"
    );
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=
      Math.pow(
        .985,
        dt*60
      );

    p.vy+=500*dt;

    p.rot+=p.spin*dt;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );
    }
  }
}

function drawParticles(){

  const winColors=[
    "#00eaff",
    "#ff36d1",
    "#ffe14a",
    "#49ff9a",
    "#9c7bff"
  ];

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );

    let color=
      LEVELS[current].color;

    if(p.type==="coin"){
      color="#ffd43b";
    }

    if(p.type==="pad"){
      color="#49ff9a";
    }

    if(p.type==="portal"){
      color="#ff4be8";
    }

    if(p.type==="win"){

      color=
        winColors[
          Math.floor(
            Math.abs(
              p.x+p.y+p.life*10
            )
          )%winColors.length
        ];
    }

    ctx.fillStyle=color;

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(
      p.rot
    );

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -p.size/2,
      -p.size/2,
      p.size,
      p.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

function togglePause(){

  if(
    !running&&
    !paused
  ){
    return;
  }

  paused=!paused;

  pause.style.display=
    paused
    ?"flex"
    :"none";

  if(paused){

    stopMusic();

  }else{

    last=
      performance.now();

    if(sound){

      unlockAudio().then(()=>{
        if(
          running&&
          !paused
        ){

          startMusic();
        }
      });
    }
  }
}

document.getElementById("pauseBtn")

    e=>{

      togglePause();

  );

document.getElementById("resume")
  .addEventListener(
    "click",
    async()=>{
      paused=false;

      pause.style.display=
        "none";

      last=
        performance.now();

      if(sound){

        await unlockAudio();

        if(
          running&&
          !paused
        ){

          startMusic();
        }
      }
    }
  );

      );

/* =========================================================
   AUTO PAUSE
========================================================= */

function autoPause(){

  if(
    running&&
    !paused&&
    !finished
  ){

    paused=true;

    pause.style.display=
      "flex";

    stopMusic();
  }
}

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      autoPause();
    }
  }
);

window.addEventListener(
  "blur",
  ()=>{
    autoPause();
  }
);

/* =========================================================
   VICTORY
========================================================= */

function victoryAnimation(){

  let frames=0;

  function animate(){

    if(!finished){
      return;
    }

    updateParticles(.016);
    draw();

    frames++;

    if(frames<150){

      requestAnimationFrame(
        animate
      );
    }
  }

  requestAnimationFrame(
    animate
  );
}

/* =========================================================
   START
========================================================= */

resize();
renderMenu();
renderAchievements();
updateSound();

</script>
