<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const levels=[
["NEON RUSH","#00ffff",5.8,7000,150,261.63],
["CRYSTAL DRIVE","#6fa8ff",6.0,7300,128,220],
["LAVA PULSE","#ff482e",6.2,7600,172,164.81],
["SKY CIRCUIT","#75ff70",6.4,7900,138,196],
["VIOLET RUN","#c86cff",6.6,8200,160,246.94],
["SHADOW FACTORY","#aaaabb",6.8,8500,118,146.83],
["CYBER STORM","#00aaff",7.0,8800,180,185],
["INFERNO CORE","#ff7800",7.2,9000,190,130.81],
["ELECTRIC VOID","#eeff00",7.4,9200,165,220],
["GRAVITY BREAK","#ff35bb",7.6,9400,145,174.61],
["OVERDRIVE","#00ff88",7.8,9600,200,196],
["FINAL CHAOS","#ffffff",8.0,10000,210,130.81],
["STARFALL","#58a6ff",8.2,10400,132,233.08],
["QUANTUM","#b76cff",8.4,10800,175,196],
["NEON INFERNO","#ff4f81",8.6,11200,198,155.56],
["ZERO GRAVITY","#45ffff",8.8,11600,125,174.61],
["NIGHTMARE","#ff3333",9.0,12000,205,123.47],
["ULTIMATE DASH","#ffffff",9.3,12600,220,261.63]
];

const skins=[
["CLASSIC","#ffffff",0],
["CYAN","#00ffff",10],
["LIME","#72ff55",20],
["VIOLET","#c86cff",30],
["FIRE","#ff4b30",40],
["GOLD","#ffd84a",60],
["PINK","#ff4ca8",80],
["ICE","#a8f7ff",100]
];

const achievements=[
["first","Pierwszy krok","Ukończ pierwszy poziom"],
["three","Rozgrzewka","Ukończ 3 poziomy"],
["six","Szybki gracz","Ukończ 6 poziomów"],
["all","NEON MASTER","Ukończ wszystkie poziomy"],
["coins10","Łowca monet","Zbierz 10 monet"],
["coins25","Kolekcjoner","Zbierz 25 monet"],
["perfect","Perfekcja","Ukończ poziom bez śmierci"],
["survivor","Nie poddaję się","Ukończ poziom po 5+ próbach"]
];

let data=JSON.parse(localStorage.getItem("neonDashSave")||"null")||{
unlocked:1,progress:Array(18).fill(0),coins:0,skin:0,owned:[0],
ach:{},attempts:Array(18).fill(0),settings:{music:true,sound:true,fx:true}
};

function save(){localStorage.setItem("neonDashSave",JSON.stringify(data))}
function $(id){return document.getElementById(id)}

let currentLevel=0;
let running=false,paused=false,dead=false,won=false;
let animationFrame=0,lastTime=0;
let worldX=0,attempt=1;
let player,obstacles=[],coins=[],particles=[],trail=[],stars=[],pads=[],portals=[];
let groundY=0;

function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}

function updateMainStats(){
 $("mainStats").textContent=`Poziomy: ${data.progress.filter(x=>x>=100).length}/${levels.length}   •   🪙 ${data.coins}`;
}

function renderLevels(){
 const g=$("levelGrid");g.innerHTML="";
 levels.forEach((l,i)=>{
   const d=document.createElement("div");
   d.className="level"+(i>=data.unlocked?" locked":"");
   d.innerHTML=`<h3>${i+1}. ${l[0]}</h3>
   <div class="small">Prędkość: ${l[2].toFixed(1)}</div>
   <div class="small">${i<data.unlocked?"🔓 ODblokowany":"🔒 Zablokowany"}</div>
   <div class="bar"><i style="width:${data.progress[i]||0}%"></i></div>`;
   if(i<data.unlocked)d.onclick=()=>startLevel(i);
   g.appendChild(d);
 });
 $("levelStats").textContent=`Odblokowane: ${data.unlocked}/${levels.length} • Ukończone: ${data.progress.filter(x=>x>=100).length}`;
}

function renderSkins(){
 const g=$("skinGrid");g.innerHTML="";
 $("skinCoins").textContent=data.coins;
 skins.forEach((s,i)=>{
  const owned=data.owned.includes(i);
  const selected=data.skin===i;
  const d=document.createElement("div");
  d.className="skin"+(!owned&&data.coins<s[2]?" locked":"");
  d.innerHTML=`<div style="width:45px;height:45px;border-radius:8px;background:${s[1]};box-shadow:0 0 20px ${s[1]};margin-bottom:10px"></div>
  <h3>${s[0]}</h3><div class="small">${selected?"✓ WYBRANA":owned?"POSIADANA":`🪙 ${s[2]}`}</div>`;
  d.onclick=()=>{
   if(owned){data.skin=i;save();renderSkins();return}
   if(data.coins>=s[2]){
    data.coins-=s[2];data.owned.push(i);data.skin=i;save();renderSkins();toast("Kupiono skórkę!");
   }
  };
  g.appendChild(d);
 });
}

function renderAchievements(){
 const g=$("achGrid");g.innerHTML="";
 achievements.forEach(a=>{
  const done=!!data.ach[a[0]];
  const d=document.createElement("div");
  d.className="achievement";
  d.style.borderColor=done?"#00eaff":"#ffffff20";
  d.innerHTML=`<h3>${done?"🏆":"🔒"} ${a[1]}</h3><div class="small">${a[2]}</div>`;
  g.appendChild(d);
 });
}

function renderSettings(){
 ["music","sound","fx"].forEach(x=>{
  const el=$(x+"Switch");
  el.classList.toggle("on",data.settings[x]);
 });
}

function toast(t){
 $("toast").textContent=t;
 $("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",1800);
}

function createLevel(){
 const L=levels[currentLevel];
 worldX=0;dead=false;won=false;paused=false;
 obstacles=[];coins=[];particles=[];trail=[];pads=[];portals=[];
 groundY=H*.72;

 player={x:W*.22,y:groundY-42,w:42,h:42,vy:0,onGround:true,rot:0,blink:0,blinkTimer:Math.random()*3+2};

 const gap=600;
 let x=650;
 let pattern=0;

 while(x<L[3]){
   pattern=(pattern+1)%8;
   const h=45+(pattern%3)*20;
   const width=40+(pattern%4)*10;

   if(pattern===0){
    obstacles.push({type:"spike",x,y:groundY-45,w:45,h:45});
    obstacles.push({type:"spike",x:x+55,y:groundY-45,w:45,h:45});
    x+=260;
   }else if(pattern===1){
    obstacles.push({type:"block",x,y:groundY-70,w:55,h:70});
    obstacles.push({type:"spike",x:x+55,y:groundY-45,w:45,h:45});
    x+=300;
   }else if(pattern===2){
    obstacles.push({type:"saw",x:x+40,y:groundY-70,r:30});
    x+=280;
   }else if(pattern===3){
    obstacles.push({type:"spike",x,y:groundY-45,w:45,h:45});
    obstacles.push({type:"spike",x:x+50,y:groundY-45,w:45,h:45});
    obstacles.push({type:"spike",x:x+100,y:groundY-45,w:45,h:45});
    x+=340;
   }else if(pattern===4){
    pads.push({x:x+20,y:groundY-15,w:55,h:15});
    obstacles.push({type:"spike",x:x+115,y:groundY-45,w:45,h:45});
    x+=320;
   }else if(pattern===5){
    obstacles.push({type:"block",x,y:groundY-100,w:55,h:100});
    obstacles.push({type:"block",x:x+90,y:groundY-55,w:55,h:55});
    x+=350;
   }else if(pattern===6){
    portals.push({x:x+50,y:groundY-125,w:30,h:100});
    obstacles.push({type:"spike",x:x+110,y:groundY-45,w:45,h:45});
    x+=330;
   }else{
    obstacles.push({type:"saw",x:x+40,y:groundY-90,r:32});
    obstacles.push({type:"spike",x:x+95,y:groundY-45,w:45,h:45});
    x+=360;
   }

   if(Math.random()>.35){
    coins.push({x:x-80,y:groundY-120-Math.random()*100,r:10,got:false});
   }
 }

 obstacles.push({type:"finish",x:L[3]-100,y:groundY-200,w:40,h:200});

 for(let i=0;i<100;i++){
  stars.push({
   x:Math.random()*W,
   y:Math.random()*H*.7,
   r:Math.random()*1.7+.3,
   a:Math.random()
  });
 }

 $("levelName").textContent=`${currentLevel+1}. ${L[0]}`;
 $("coinText").textContent="🪙 0";
 $("attemptText").textContent=`ATTEMPT ${attempt}`;
 $("progress").firstElementChild.style.width="0%";
}

function startLevel(index){
 if(index>=data.unlocked)return;
 currentLevel=index;
 attempt=(data.attempts[index]||0)+1;
 data.attempts[index]=attempt;
 save();

 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $("hud").classList.add("active");
 $("pause").classList.add("active");
 $("message").classList.remove("active");
 $("mobileJump").style.display="block";

 initAudio();
 createLevel();
 running=true;
 lastTime=performance.now();
 stopLoop();
 startLoop();
 startMusic();
}

function stopLoop(){
 if(animationFrame)cancelAnimationFrame(animationFrame);
 animationFrame=0;
}

function startLoop(){
 if(!animationFrame)animationFrame=requestAnimationFrame(loop);
}

function jump(){
 if(!running||paused||dead||won)return;
 if(player.onGround){
  player.vy=-12.5;
  player.onGround=false;
  sfxJump();
 }
}

function die(){
 if(dead||won)return;
 dead=true;
 running=false;
 sfxDeath();
 createParticles(player.x+player.w/2,player.y+player.h/2,35,levels[currentLevel][1]);
 setTimeout(()=>{
  $("resultTitle").textContent="LEVEL FAILED";
  $("resultText").textContent=`Próba ${attempt}. Spróbuj jeszcze raz!`;
  $("message").classList.add("active");
  $("pause").classList.remove("active");
  $("mobileJump").style.display="none";
  stopMusic();
 },300);
}

function win(){
 if(won)return;
 won=true;
 running=false;
 data.progress[currentLevel]=100;
 data.unlocked=Math.max(data.unlocked,Math.min(levels.length,currentLevel+2));
 data.ach.first=true;
 if(currentLevel>=2)data.ach.three=true;
 if(currentLevel>=5)data.ach.six=true;
 if(currentLevel===levels.length-1)data.ach.all=true;
 if(attempt===1)data.ach.perfect=true;
 if(attempt>=5)data.ach.survivor=true;
 save();

 sfxWin();
 createParticles(player.x+player.w/2,player.y+player.h/2,120,levels[currentLevel][1]);
 stopMusic();

 setTimeout(()=>{
  $("resultTitle").textContent="LEVEL COMPLETE!";
  $("resultText").textContent=`100%  •  🪙 ${coins.filter(c=>c.got).length}  •  Próby: ${attempt}`;
  $("message").classList.add("active");
  $("pause").classList.remove("active");
  $("mobileJump").style.display="none";
 },650);
}

function update(dt){
 if(!running||paused||dead||won)return;

 const speed=levels[currentLevel][2];
 worldX+=speed*dt*60;

 player.vy+=.65*dt*60;
 player.y+=player.vy*dt*60;

 if(player.y+player.h>=groundY){
  player.y=groundY-player.h;
  player.vy=0;
  player.onGround=true;
 }else player.onGround=false;

 if(!player.onGround)player.rot+=.13*dt*60;
 else player.rot*=.8;

 player.blinkTimer-=dt;
 if(player.blinkTimer<=0){
  player.blink=0.18;
  player.blinkTimer=2+Math.random()*4;
 }
 player.blink=Math.max(0,player.blink-dt);

 for(const c of coins){
  if(c.got)continue;
  const cx=c.x-worldX+W*.22;
  const cy=c.y;
  if(Math.hypot(cx-(player.x+21),cy-(player.y+21))<30){
   c.got=true;
   data.coins++;
   $("coinText").textContent=`🪙 ${coins.filter(q=>q.got).length}`;
   if(data.coins>=10)data.ach.coins10=true;
   if(data.coins>=25)data.ach.coins25=true;
   save();
   sfxCoin();
   createParticles(cx,cy,15,"#ffe35c");
  }
 }

 for(const p of pads){
  const px=p.x-worldX+W*.22;
  if(player.x+player.w>px&&player.x<px+p.w&&player.y+player.h>p.y){
   player.vy=-15;
   player.onGround=false;
  }
 }

 for(const o of obstacles){
  const ox=o.x-worldX+W*.22;
  if(o.type==="finish"){
   if(ox<player.x+player.w)win();
   continue;
  }

  if(o.type==="spike"){
   if(rectHit(player.x+5,player.y+5,player.w-10,player.h-8,ox+5,o.y+12,o.w-10,o.h-12))die();
  }

  if(o.type==="block"){
   if(rectHit(player.x,player.y,player.w,player.h,ox,o.y,o.w,o.h))die();
  }

  if(o.type==="saw"){
   if(Math.hypot((player.x+21)-(ox+o.r),(player.y+21)-(o.y+o.r))<o.r+18)die();
  }
 }

 trail.push({x:player.x+21,y:player.y+21,a:1});
 if(trail.length>20)trail.shift();
 trail.forEach(t=>t.a-=.05);

 const progress=Math.min(100,(worldX/(levels[currentLevel][3]))*100);
 $("progress").firstElementChild.style.width=progress+"%";

 if(worldX>levels[currentLevel][3]+W)win();

 if(data.settings.fx){
  if(Math.random()<.35)createParticles(player.x+5,player.y+35,1,levels[currentLevel][1]);
 }
}

function rectHit(a,b,c,d,e,f,g,h){
 return a<e+g&&a+c>e&&b<f+h&&b+d>f;
}

function createParticles(x,y,n,color){
 if(!data.settings.fx)return;
 for(let i=0;i<n;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*8,
   vy:(Math.random()-.5)*8,
   life:.5+Math.random()*.8,
   max:1,
   size:2+Math.random()*4,
   color
  });
 }
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt*60;
  p.y+=p.vy*dt*60;
  p.vy+=.15*dt*60;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const color=levels[currentLevel][1];

 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#030518");
 grad.addColorStop(1,"#080b18");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 drawStars();
 drawGrid(color);

 if(running||dead||won){
  drawWorld(color);
  drawPlayer(color);
  drawParticles();
 }
}

function drawStars(){
 for(const s of stars){
  s.x-=levels[currentLevel][2]*.03;
  if(s.x<0)s.x=W;
  ctx.globalAlpha=s.a;
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function drawGrid(color){
 ctx.strokeStyle=color+"12";
 ctx.lineWidth=1;
 const off=-(worldX*.35%50);
 for(let x=off;x<W;x+=50){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=groundY%50;y<H;y+=50){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 ctx.strokeStyle=color+"55";
 ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();

 ctx.fillStyle=color+"0b";
 ctx.fillRect(0,groundY,W,H-groundY);
}

function drawWorld(color){
 for(const o of obstacles){
  const x=o.x-worldX+W*.22;
  if(x<-100||x>W+100)continue;

  if(o.type==="spike"){
   ctx.fillStyle="#fff";
   ctx.shadowBlur=15;ctx.shadowColor=color;
   ctx.beginPath();
   ctx.moveTo(x,o.y+o.h);
   ctx.lineTo(x+o.w/2,o.y);
   ctx.lineTo(x+o.w,o.y+o.h);
   ctx.closePath();ctx.fill();
   ctx.shadowBlur=0;
  }else if(o.type==="block"){
   ctx.fillStyle="#101a32";
   ctx.strokeStyle=color;
   ctx.lineWidth=2;
   ctx.shadowBlur=12;ctx.shadowColor=color;
   ctx.fillRect(x,o.y,o.w,o.h);
   ctx.strokeRect(x,o.y,o.w,o.h);
   ctx.shadowBlur=0;
  }else if(o.type==="saw"){
   ctx.save();
   ctx.translate(x+o.r,o.y+o.r);
   ctx.rotate(worldX*.01);
   ctx.fillStyle="#dceaff";
   ctx.shadowBlur=15;ctx.shadowColor=color;
   for(let i=0;i<16;i++){
    ctx.rotate(Math.PI/8);
    ctx.beginPath();
    ctx.moveTo(o.r-3,0);
    ctx.lineTo(o.r+9,-5);
    ctx.lineTo(o.r+9,5);
    ctx.closePath();ctx.fill();
   }
   ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#202840";ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
   ctx.restore();
  }else if(o.type==="finish"){
   ctx.fillStyle=color;
   ctx.shadowBlur=25;ctx.shadowColor=color;
   ctx.fillRect(x,o.y,8,o.h);
   ctx.shadowBlur=0;
  }
 }

 for(const p of pads){
  const x=p.x-worldX+W*.22;
  ctx.fillStyle=color;
  ctx.shadowBlur=15;ctx.shadowColor=color;
  ctx.fillRect(x,p.y,p.w,p.h);
  ctx.shadowBlur=0;
 }

 for(const p of portals){
  const x=p.x-worldX+W*.22;
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.shadowBlur=20;ctx.shadowColor=color;
  ctx.strokeRect(x,p.y,p.w,p.h);
  ctx.shadowBlur=0;
 }

 for(const c of coins){
  if(c.got)continue;
  const x=c.x-worldX+W*.22;
  ctx.strokeStyle="#ffe35c";
  ctx.lineWidth=4;
  ctx.shadowBlur=15;ctx.shadowColor="#ffe35c";
  ctx.beginPath();ctx.arc(x,c.y,c.r,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
 }
}

function drawPlayer(color){
 const s=skins[data.skin];
 for(const t of trail){
  ctx.globalAlpha=Math.max(0,t.a)*.25;
  ctx.fillStyle=s[1];
  ctx.fillRect(t.x-12,t.y-12,24,24);
 }
 ctx.globalAlpha=1;

 ctx.save();
 ctx.translate(player.x+21,player.y+21);
 ctx.rotate(player.rot);
 ctx.fillStyle=s[1];
 ctx.shadowBlur=22;ctx.shadowColor=s[1];
 ctx.fillRect(-21,-21,42,42);
 ctx.shadowBlur=0;

 ctx.fillStyle="#111";
 const eyeH=player.blink>0?.8:8;
 ctx.fillRect(-12,-10,6,eyeH);
 ctx.fillRect(6,-10,6,eyeH);

 ctx.strokeStyle="#111";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.arc(0,4,8,0,Math.PI);
 ctx.stroke();

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.size,p.size);
 }
 ctx.globalAlpha=1;
}

function loop(t){
 animationFrame=requestAnimationFrame(loop);
 const dt=Math.min(.035,(t-lastTime)/1000||0);
 lastTime=t;
 update(dt);
 updateParticles(dt);
 draw();
}

function handleJumpInput(e){
 if(e.type==="keydown"){
  if(e.code!=="Space"&&e.code!=="ArrowUp")return;
  if(e.repeat)return;
  e.preventDefault();
 }else{

 }
 jump();
}

let audioCtx=null,masterGain=null,musicGain=null,musicTimer=null,musicStep=0;

function initAudio(){
 try{
  if(!audioCtx){
   audioCtx=new(window.AudioContext||window.webkitAudioContext)();
   masterGain=audioCtx.createGain();
   musicGain=audioCtx.createGain();
   masterGain.gain.value=.22;
   musicGain.gain.value=.6;
   musicGain.connect(masterGain);
   masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==="suspended")audioCtx.resume();
  return true;
 }catch(e){return false}
}

function note(freq,duration,type="square",volume=.08,when=0){
 if(!audioCtx||!data.settings.music)return;
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.type=type;
 o.frequency.value=freq;
 g.gain.setValueAtTime(0.0001,audioCtx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+when+.01);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);
 o.connect(g);g.connect(musicGain);
 o.start(audioCtx.currentTime+when);
 o.stop(audioCtx.currentTime+when+duration+.03);
}

function kick(when){
 if(!audioCtx||!data.settings.music)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sine";
 o.frequency.setValueAtTime(130,audioCtx.currentTime+when);
 o.frequency.exponentialRampToValueAtTime(45,audioCtx.currentTime+when+.12);
 g.gain.setValueAtTime(.16,audioCtx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+when+.14);
 o.connect(g);g.connect(musicGain);
 o.start(audioCtx.currentTime+when);
 o.stop(audioCtx.currentTime+when+.15);
}

function hat(when){
 if(!audioCtx||!data.settings.music)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="square";o.frequency.value=7000;
 g.gain.setValueAtTime(.025,audioCtx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+when+.04);
 o.connect(g);g.connect(musicGain);
 o.start(audioCtx.currentTime+when);
 o.stop(audioCtx.currentTime+when+.05);
}

function startMusic(){
 if(!data.settings.music)return;
 if(!initAudio())return;
 clearTimeout(musicTimer);
 musicStep=0;

 const L=levels[currentLevel];
 const bpm=L[4];
 const beat=60/bpm;
 const melodies=[
  [0,4,7,12,7,4,2,7],
  [0,3,7,10,7,3,5,10],
  [0,5,7,12,10,7,5,3],
  [0,4,9,7,12,9,4,2]
 ];
 const melody=melodies[currentLevel%melodies.length];

 function schedule(){
  if(!data.settings.music||!running||paused){musicTimer=null;return}
  const base=L[5];
  const scale=[1,1.122,1.26,1.335,1.498,1.682,1.888];
  const step=musicStep++;

  for(let i=0;i<8;i++){
   const idx=(step+i)%melody.length;
   const semi=melody[idx];
   const octave=(step%16>11)?2:1;
   const freq=base*scale[semi%7]*octave;
   note(freq,.16,"square",.035,i*beat/2);
   note(freq/2,.22,"triangle",.025,i*beat/2+.02);
   if(i%2===0)kick(i*beat/2);
   else hat(i*beat/2);
  }

  musicTimer=setTimeout(schedule,beat*4000);
 }
 schedule();
}

function stopMusic(){
 clearTimeout(musicTimer);
 musicTimer=null;
}

function sfx(freq,dur=.1,type="square",vol=.08){
 if(!data.settings.sound)return;
 if(!initAudio())return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(vol,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
 o.connect(g);g.connect(masterGain);
 o.start();o.stop(audioCtx.currentTime+dur);
}
