<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a;color:#fff;font-family:Arial,sans-serif}
button{font:inherit;color:#fff;border:0;cursor:pointer;user-select:none;touch-action:manipulation}
#menu{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:25px 14px 35px;background:radial-gradient(circle at 50% 5%,#252b78,#090a20 45%,#020207)}
.logo{margin:12px 0 4px;font-size:clamp(30px,7vw,54px);font-weight:900;letter-spacing:5px;text-align:center;text-shadow:0 0 10px #00eaff,0 0 25px #00eaff,0 0 45px #a855ff}
.subtitle{text-align:center;opacity:.7;margin-bottom:18px}
.progress{width:min(680px,100%);background:#11152d;border:2px solid #303963;border-radius:17px;padding:15px;margin-bottom:15px}
.progressTop{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:13px;background:#050712;border-radius:20px;overflow:hidden;margin-top:8px}
#menuBar{height:100%;width:0;background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7)}
#doneText{text-align:center;opacity:.65;margin-top:7px}
#levels{width:min(680px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.level{min-height:82px;text-align:left;padding:12px;border-radius:15px;border:2px solid #303861;background:linear-gradient(135deg,#171c3b,#0d1024)}
.level:active{transform:scale(.96)}
.levelStatus{float:right;font-size:20px}.levelName{font-weight:900;font-size:17px;padding-right:25px}.levelInfo{font-size:12px;opacity:.7;margin-top:5px}
#achBtn{width:min(680px,100%);min-height:48px;margin-top:14px;padding:12px;border-radius:14px;background:#242a50;border:2px solid #414d7c;font-weight:bold}
#achievements,#pause,#finish{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000b;padding:15px}
.panel{width:min(570px,100%);max-height:90vh;overflow:auto;background:#10142c;border:2px solid #3d4a7d;border-radius:20px;padding:20px}
.panel h2{text-align:center;margin-top:0}.panel button{width:100%;min-height:46px;margin-top:9px;padding:12px;border-radius:12px;background:#29335e;font-weight:bold}
.ach{padding:12px;margin:8px 0;border-radius:12px;background:#191e3b;opacity:.4}.ach.on{opacity:1;border:1px solid #00eaff}
#game{position:fixed;inset:0;display:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;z-index:4;left:10px;right:10px;top:10px;pointer-events:none;text-shadow:0 2px 5px #000}
.hudLine{display:flex;justify-content:space-between;gap:6px;font-size:clamp(11px,2.6vw,16px);font-weight:bold}
.hudBar{margin-top:7px;height:9px;background:#0008;border-radius:20px;overflow:hidden}
#gameBar{height:100%;width:0;background:#00eaff;box-shadow:0 0 12px #00eaff}
.gameButtons{position:absolute;right:10px;top:10px;z-index:10;display:flex;gap:7px}
.gameButtons button{min-width:44px;min-height:44px;padding:8px 11px;background:#10162ddd;border:1px solid #53618e;border-radius:10px}
@media(max-width:650px){#levels{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="menu">
<div class="logo">NEON DASH</div>
<div class="subtitle">Ultimate Edition • Dotknij / kliknij / SPACJA</div>
<div class="progress">
<div class="progressTop"><span>📊 PROGRES GRY</span><span id="progressText">0%</span></div>
<div class="bar"><div id="menuBar"></div></div>
<div id="doneText">0 / 20 poziomów</div>
</div>
<div id="levels"></div>
<button id="achBtn">🏆 ACHIEVEMENTY</button>
</div>

<div id="achievements">
<div class="panel">
<h2>🏆 ACHIEVEMENTY</h2>
<div id="achList"></div>
<button id="closeAch">ZAMKNIJ</button>
</div>
</div>

<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
<div class="hudLine">
<span id="levelName">LEVEL</span>
<span id="modeText">⬛ CUBE</span>
<span id="coins">🪙 0/3</span>
<span id="percent">0%</span>
</div>
<div class="hudBar"><div id="gameBar"></div></div>
</div>

<div class="gameButtons">
<button id="pauseBtn">⏸</button>
<button id="soundBtn">🔊</button>
<button id="menuBtn">☰</button>
</div>

<div id="pause">
<div class="panel">
<h2>⏸ PAUZA</h2>
<button id="resume">▶ WRÓĆ DO GRY</button>
<button id="pauseMenu">☰ MENU</button>
</div>
</div>

<div id="finish">
<div class="panel">
<h2 id="finishTitle">🎉 UKOŃCZONO!</h2>
<p id="finishInfo"></p>
<button id="again">🔄 ZAGRAJ PONOWNIE</button>
<button id="finishMenu">☰ MENU</button>
</div>
</div>
</div>

<script>
"use strict";

/* =====================================================
   POZIOMY
===================================================== */

const LEVELS=[
["NEON RUSH","⭐⭐",280,"#00eaff",124],
["CRYSTAL DRIVE","⭐⭐⭐",295,"#72a7ff",112],
["LAVA PULSE","⭐⭐⭐⭐",310,"#ff4d42",140],
["SKY CIRCUIT","⭐⭐⭐⭐",305,"#9c7bff",132],
["VIOLET RUN","⭐⭐⭐⭐",320,"#d35cff",128],
["SHADOW FACTORY","⭐⭐⭐⭐⭐",325,"#b44cff",118],
["CYBER STORM","⭐⭐⭐⭐⭐",335,"#27f0c5",136],
["INFERNO CORE","⭐⭐⭐⭐⭐",345,"#ff7338",145],
["ELECTRIC VOID","⭐⭐⭐⭐⭐⭐",355,"#35b7ff",150],
["GRAVITY BREAK","⭐⭐⭐⭐⭐⭐",340,"#45ff9a",142],
["OVERDRIVE","⭐⭐⭐⭐⭐⭐",365,"#ff3bea",154],
["FINAL CHAOS","⭐⭐⭐⭐⭐⭐",375,"#ff247f",158],
["NEON HYPER","⭐⭐⭐⭐⭐⭐",380,"#00ffc8",160],
["DARK MATTER","⭐⭐⭐⭐⭐⭐⭐",390,"#925cff",162],
["PHANTOM RUSH","⭐⭐⭐⭐⭐⭐⭐",400,"#ff55b8",165],
["VOID STORM","⭐⭐⭐⭐⭐⭐⭐",410,"#42b9ff",168],
["INFINITE CORE","⭐⭐⭐⭐⭐⭐⭐",420,"#ff9238",170],
["CYBERFALL","⭐⭐⭐⭐⭐⭐⭐",430,"#35ffd0",172],
["ULTRA NOVA","⭐⭐⭐⭐⭐⭐⭐⭐",440,"#ff3bda",176],
["FINAL OVERDRIVE","⭐⭐⭐⭐⭐⭐⭐⭐",450,"#ff247f",180]
];

const modes={
cube:{name:"⬛ CUBE"},
ship:{name:"🚀 SHIP"},
ufo:{name:"🛸 UFO"},
wave:{name:"〰️ WAVE"},
ball:{name:"⚫ BALL"}
};

/* =====================================================
   DOM
===================================================== */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const levelsBox=document.getElementById("levels");
const achievements=document.getElementById("achievements");
const achList=document.getElementById("achList");
const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

const levelName=document.getElementById("levelName");
const modeText=document.getElementById("modeText");
const coinsText=document.getElementById("coins");
const percent=document.getElementById("percent");
const gameBar=document.getElementById("gameBar");
const menuBar=document.getElementById("menuBar");
const progressText=document.getElementById("progressText");
const doneText=document.getElementById("doneText");

/* =====================================================
   SAVE
===================================================== */

function get(k,d){
try{
const v=localStorage.getItem(k);
return v===null?d:v;
}catch(e){return d}
}

function set(k,v){
try{localStorage.setItem(k,String(v))}catch(e){}
}

function completed(i){
return get("nd_level_"+i,"0")==="1";
}

function completedCount(){
let n=0;
for(let i=0;i<LEVELS.length;i++){
if(completed(i))n++;
}
return n;
}

/* =====================================================
   ACHIEVEMENTY
===================================================== */

const ACH=[
["first","🎮 Pierwszy krok","Ukończ pierwszy poziom."],
["three","⚡ Rozgrzewka","Ukończ 3 poziomy."],
["six","🔥 Weteran","Ukończ 6 poziomów."],
["all","👑 Mistrz Neon Dash","Ukończ wszystkie poziomy."],
["final","💀 Finalista","Ukończ FINAL OVERDRIVE."],
["coins10","🪙 Łowca monet","Zbierz 10 monet."],
["coins25","💰 Kolekcjoner","Zbierz 25 monet."],
["perfect","💎 Perfekcja","Ukończ poziom bez śmierci."],
["survivor","🛡️ Twardziel","Ukończ poziom po 3+ śmierciach."],
["allcoins","🌟 Pełna kolekcja","Zbierz 3 monety w jednym przejściu."]
];

function unlock(id){
if(get("nd_ach_"+id,"0")==="1")return;
set("nd_ach_"+id,"1");
renderAchievements();
}

function renderAchievements(){
achList.innerHTML="";
ACH.forEach(a=>{
const d=document.createElement("div");
d.className="ach"+(get("nd_ach_"+a[0],"0")==="1"?" on":"");
d.innerHTML="<b>"+a[1]+"</b><br><small>"+a[2]+"</small>";
achList.appendChild(d);
});
}

function checkAchievements(){
const n=completedCount();

if(n>=1)unlock("first");
if(n>=3)unlock("three");
if(n>=6)unlock("six");
if(n>=LEVELS.length)unlock("all");
if(completed(LEVELS.length-1))unlock("final");

const total=Number(get("nd_totalCoins","0"));

if(total>=10)unlock("coins10");
if(total>=25)unlock("coins25");
if(deaths===0)unlock("perfect");
if(deaths>=3)unlock("survivor");
if(runCoins===3)unlock("allcoins");
}

/* =====================================================
   MENU
===================================================== */

function renderMenu(){

levelsBox.innerHTML="";

LEVELS.forEach((l,i)=>{

const b=document.createElement("button");
b.className="level";
b.type="button";

b.innerHTML=
'<span class="levelStatus">'+
(completed(i)?"✅":"▶️")+
'</span>'+
'<div class="levelName">'+
(i+1)+". "+l[0]+
'</div>'+
'<div class="levelInfo">'+
l[1]+" • "+l[2]+" px/s"+
'</div>';

b.addEventListener("click",()=>{
startLevel(i,true);
});

levelsBox.appendChild(b);
});

const done=completedCount();
const p=Math.round(done/LEVELS.length*100);

progressText.textContent=p+"%";
menuBar.style.width=p+"%";
doneText.textContent=done+" / "+LEVELS.length+" poziomów";
}

document.getElementById("achBtn").onclick=()=>{
achievements.style.display="flex";
renderAchievements();
};

document.getElementById("closeAch").onclick=()=>{
achievements.style.display="none";
};

/* =====================================================
   CANVAS
===================================================== */

let W=innerWidth;
let H=innerHeight;
let ground=H*.78;

const player={
x:150,
y:0,
size:34,
vy:0,
rot:0,
grounded:false,
waveDir:1
};

function resize(){

W=Math.max(240,innerWidth);
H=Math.max(240,innerHeight);

const d=Math.min(Math.max(devicePixelRatio||1,1),2);

canvas.width=W*d;
canvas.height=H*d;
canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(d,0,0,d,0,0);

ground=Math.max(160,Math.min(H-55,H*.78));

if(!running){
player.y=ground-player.size;
}

createStars();
}

addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,100));

/* =====================================================
   STATE
===================================================== */

let current=0;
let currentMode="cube";
let running=false;
let paused=false;
let finished=false;
let dying=false;

let world=0;
let last=0;
let raf=0;

let deaths=0;
let runCoins=0;

let collected=new Set();

let obstacles=[];
let portals=[];
let pads=[];
let coins=[];

let particles=[];
let stars=[];
let trail=[];

let gravityDirection=1;

let shake=0;
let flash=0;

let audio=null;
let musicTimer=null;
let musicIndex=0;

let sound=get("nd_sound","1")==="1";

/* =====================================================
   START
===================================================== */

function resetPlayer(){

player.x=Math.max(90,Math.min(180,W*.22));

player.y=
gravityDirection===1?
ground-player.size:
0;

player.vy=0;
player.rot=0;
player.waveDir=1;
player.grounded=true;
}

function changeMode(mode){

if(!modes[mode])return;

currentMode=mode;

modeText.textContent=modes[mode].name;

/*
  Najważniejsza część:
  po zmianie trybu zerujemy starą fizykę.
*/

player.vy=0;
player.rot=0;
player.grounded=false;

if(mode==="cube"||mode==="ball"){

player.y=
gravityDirection===1?
ground-player.size:
0;

player.grounded=true;

}else{

player.y=Math.max(
40,
Math.min(
ground-player.size-40,
player.y
)
);

}

if(mode==="wave"){
player.waveDir=1;
}
}

function startLevel(index,newRun=true){

if(index<0||index>=LEVELS.length)return;

current=index;

if(newRun){
deaths=0;
runCoins=0;
collected=new Set();
}

running=false;
paused=false;
finished=false;
dying=false;

if(raf){
cancelAnimationFrame(raf);
raf=0;
}

stopMusic();

game.style.display="block";
menu.style.display="none";
pause.style.display="none";
finish.style.display="none";

world=0;
particles=[];
trail=[];
shake=0;
flash=0;

gravityDirection=1;

currentMode="cube";

resetPlayer();

generateLevel();

levelName.textContent=
(current+1)+" • "+LEVELS[current][0];

modeText.textContent="⬛ CUBE";
coinsText.textContent="🪙 0/3";

running=true;
last=performance.now();

if(sound)startMusic();

draw();

raf=requestAnimationFrame(loop);
}

/* =====================================================
   LEVEL GENERATOR
===================================================== */

function generateLevel(){

obstacles=[];
portals=[];
pads=[];
coins=[];

const length=11500+current*600;

let x=650;
let pattern=0;

while(x<length){

const type=pattern%10;

if(type===0){

spike(x);
x+=420;

}else if(type===1){

/*
  DWA KOLCE DOKŁADNIE OBOK SIEBIE.
*/
spike(x);
spike(x+46);
x+=520;

}else if(type===2){

saw(x);
x+=520;

}else if(type===3){

gap(x,150);
x+=630;

}else if(type===4){

pad(x);
spike(x+190);
x+=600;

}else if(type===5){

spike(x);
saw(x+230);
x+=650;

}else if(type===6){

speedPortal(x);
spike(x+250);
x+=650;

}else if(type===7){

gravityPortal(x);
spike(x+270);
x+=700;

}else if(type===8){

spike(x);
spike(x+46);
spike(x+92);
x+=650;

}else{

saw(x);
spike(x+150);
x+=650;
}

pattern++;
}

/*
  TRYBY.
  Każdy portal ma duży odstęp od następnego,
  żeby tryb rzeczywiście dało się przetestować.
*/

const base=1800;

modePortal(base,"ship");
modePortal(base+900,"cube");

modePortal(base+1900,"ufo");
modePortal(base+2900,"cube");

modePortal(base+3900,"wave");
modePortal(base+5100,"cube");

modePortal(base+6100,"ball");
modePortal(base+7300,"cube");

const positions=[
length*.25,
length*.52,
length*.79
];

positions.forEach((x,i)=>{
coins.push({
id:i,
x:x,
collected:false
});
});
}

/* =====================================================
   OBJECTS
===================================================== */

function spike(x){
obstacles.push({type:"spike",x});
}

function saw(x){
obstacles.push({type:"saw",x,r:28});
}

function gap(x,w){
obstacles.push({type:"gap",x,w});
}

function pad(x){
pads.push({x,used:false});
}

function speedPortal(x){
portals.push({
type:"speed",
x,
used:false
});
}

function gravityPortal(x){
portals.push({
type:"gravity",
x,
used:false
});
}

function modePortal(x,mode){
portals.push({
type:"mode",
mode,
x,
used:false
});
}

/* =====================================================
   INPUT
===================================================== */

function action(){

if(!running||paused||dying||finished)return;

if(currentMode==="cube"){
cubeJump();
return;
}

if(currentMode==="ball"){
ballFlip();
return;
}

if(currentMode==="ship"){
shipFlap();
return;
}

if(currentMode==="ufo"){
ufoJump();
return;
}

if(currentMode==="wave"){
waveSwitch();
return;
}
}

/* CUBE */

function cubeJump(){

if(!player.grounded)return;

player.vy=-730*gravityDirection;
player.grounded=false;

particlesJump();
}

/* BALL */

function ballFlip(){

gravityDirection*=-1;

player.vy=0;
player.grounded=false;

particlesPortal(player.x);
}

/* SHIP */

function shipFlap(){

/*
  Kliknięcie powoduje mocne wznoszenie.
  Puszczenie = opadanie.
  Działa płynnie zamiast zwykłego skoku.
*/

player.vy=-520*gravityDirection;
}

/* UFO */

function ufoJump(){

player.vy=-620*gravityDirection;

particlesJump();
}

/* WAVE */

function waveSwitch(){

/*
  TO BYŁ GŁÓWNY BŁĄD POPRZEDNIEJ WERSJI.

  Wave zmienia kierunek przy KAŻDYM kliknięciu.
*/

player.waveDir*=-1;

player.vy=
player.waveDir*
720*
gravityDirection;

}

/*
  Pointer + klawiatura.
*/

game.addEventListener("pointerdown",e=>{

if(
e.target.closest(".gameButtons")||
e.target.closest("#pause")||
e.target.closest("#finish")
)return;

action();

});

addEventListener("keydown",e=>{

if(
e.code==="Space"||
e.code==="ArrowUp"||
e.code==="KeyW"
){

e.preventDefault();
action();

}

if(
e.code==="Escape"||
e.code==="KeyP"
){

if(running)togglePause();

}

});

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

let speed=LEVELS[current][2];

/* speed portal */

for(const p of portals){

if(
p.type==="speed"&&
world+player.x>p.x&&
world+player.x<p.x+180
){

speed*=1.18;

}

}

world+=speed*dt;

/* ===================================================
   CUBE
=================================================== */

if(currentMode==="cube"){

const gravity=2100*gravityDirection;

player.vy+=gravity*dt;
player.y+=player.vy*dt;

if(gravityDirection===1){

const floor=ground-player.size;

if(player.y>=floor&&!gapUnder()){

player.y=floor;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot+=dt*8;

}

}else{

if(player.y<=0&&!gapUnder()){

player.y=0;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot-=dt*8;

}

}

}

/* ===================================================
   BALL
=================================================== */

else if(currentMode==="ball"){

const gravity=2100*gravityDirection;

player.vy+=gravity*dt;
player.y+=player.vy*dt;

if(gravityDirection===1){

const floor=ground-player.size;

if(player.y>=floor){

player.y=floor;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;

}

}else{

if(player.y<=0){

player.y=0;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;

}

}

player.rot+=dt*8*gravityDirection;

}

/* ===================================================
   SHIP
=================================================== */

else if(currentMode==="ship"){

/*
  Grawitacja + opadanie.
*/

player.vy+=1450*gravityDirection*dt;

/*
  Opór.
*/

player.vy*=Math.pow(.985,dt*60);

player.y+=player.vy*dt;

const minY=15;
const maxY=ground-player.size-15;

if(player.y<minY){

player.y=minY;
player.vy=0;

}

if(player.y>maxY){

player.y=maxY;
player.vy=0;

}

player.rot=
Math.max(
-.65,
Math.min(
.65,
player.vy*.001
)
);

}

/* ===================================================
   UFO
=================================================== */

else if(currentMode==="ufo"){

player.vy+=1500*gravityDirection*dt;

player.y+=player.vy*dt;

const minY=15;
const maxY=ground-player.size-15;

if(player.y<minY){

player.y=minY;
player.vy=0;

}

if(player.y>maxY){

player.y=maxY;
player.vy=0;

}

player.rot=player.vy*.0007;

}

/* ===================================================
   WAVE
=================================================== */

else if(currentMode==="wave"){

/*
  Wave NIE używa grawitacji.
  Leci po linii prostej po skosie.

  Każde kliknięcie:
  góra -> dół
  dół -> góra
*/

const waveSpeed=720;

player.vy=
player.waveDir*
waveSpeed;

player.y+=player.vy*dt;

if(player.y<=10){

player.y=10;
player.waveDir=1;

}

if(
player.y>=ground-player.size-10
){

player.y=
ground-player.size-10;

player.waveDir=-1;

}

player.rot=
player.waveDir>0?
.45:
-.45;

}

/* ===================================================
   MECHANIKI
=================================================== */

checkPads();
checkPortals();
checkCoins();
checkCollisions();

trail.push({
x:player.x+17,
y:player.y+17,
life:.3,
size:18
});

updateTrail(dt);
updateParticles(dt);

if(shake>0){

shake-=dt*13;

if(shake<0)shake=0;

}

if(flash>0){

flash-=dt*3;

if(flash<0)flash=0;

}

}

/* =====================================================
   PADY
===================================================== */

function checkPads(){

if(
currentMode!=="cube"&&
currentMode!=="ball"
)return;

for(const p of pads){

if(p.used)continue;

const px=world+player.x+17;

if(
px>p.x&&
px<p.x+50&&
player.grounded
){

p.used=true;

player.vy=
-1000*
gravityDirection;

player.grounded=false;

particlesPad(p.x-world);

}

}

}

/* =====================================================
   PORTALE
===================================================== */

function checkPortals(){

const px=world+player.x+17;

for(const p of portals){

if(p.used)continue;

if(
px>p.x&&
px<p.x+60
){

p.used=true;

if(p.type==="speed"){

/* tylko chwilowy efekt prędkości */

particlesPortal(p.x-world);

}

else if(p.type==="gravity"){

gravityDirection*=-1;

player.vy=0;
player.grounded=false;

particlesPortal(p.x-world);

}

else if(p.type==="mode"){

/*
  NAJWAŻNIEJSZE:
  portal natychmiast zmienia tryb.
*/

changeMode(p.mode);

particlesMode(
p.x-world,
p.mode
);

}

}

}

}

/* =====================================================
   COINS
===================================================== */

function checkCoins(){

for(const c of coins){

if(c.collected)continue;

const x=c.x-world;

const y=
gravityDirection===1?
ground-125:
125;

if(
Math.hypot(
player.x+17-x,
player.y+17-y
)<40
){

c.collected=true;

collected.add(c.id);

runCoins=collected.size;

coinsText.textContent=
"🪙 "+runCoins+"/3";

particlesCoin(x,y);

}

}

}

/* =====================================================
   COLLISIONS
===================================================== */

function checkCollisions(){

const px=world+player.x;

const left=px+5;
const right=px+player.size-5;
const top=player.y+5;
const bottom=player.y+player.size-5;

/* przeszkody */

for(const o of obstacles){

if(o.type==="spike"){

if(
right>o.x+4&&
left<o.x+46
){

if(
gravityDirection===1&&
bottom>ground-45
){

die();
return;

}

if(
gravityDirection===-1&&
top<48
){

die();
return;

}

}

}

if(o.type==="saw"){

const cy=
gravityDirection===1?
ground-o.r:
o.r;

const nx=Math.max(left,Math.min(o.x,right));
const ny=Math.max(top,Math.min(cy,bottom));

const dx=o.x-nx;
const dy=cy-ny;

if(
dx*dx+dy*dy<
(o.r-5)*(o.r-5)
){

die();
return;

}

}

if(
o.type==="gap"&&
(currentMode==="cube"||
currentMode==="ball")&&
gravityDirection===1
){

const center=world+player.x+17;

if(
center>o.x&&
center<o.x+o.w&&
bottom>=ground-8
){

die();
return;

}

}

}

/*
  Tryby latające nie mogą wylecieć poza ekran.
*/

if(
currentMode==="ship"||
currentMode==="ufo"||
currentMode==="wave"
){

if(
player.y<=2||
player.y+player.size>=ground-2
){

die();
return;

}

}

}

/* =====================================================
   GAP
===================================================== */

function gapUnder(){

const center=
world+
player.x+
player.size/2;

for(const o of obstacles){

if(
o.type==="gap"&&
center>o.x&&
center<o.x+o.w
){

return true;

}

}

return false;
}

/* =====================================================
   DEATH
===================================================== */

function die(){

if(dying||finished||!running)return;

dying=true;
running=false;

deaths++;

shake=14;
flash=1;

particlesDeath();

setTimeout(()=>{

if(!dying)return;

dying=false;

startLevel(
current,
false
);

},600);

}

/* =====================================================
   WIN
===================================================== */

function checkWin(){

const length=11500+current*600;

if(world>=length){
finishLevel();
}

}

function finishLevel(){

if(finished)return;

finished=true;
running=false;

stopMusic();

set(
"nd_level_"+current,
"1"
);

const old=
Number(
get("nd_totalCoins","0")
);

set(
"nd_totalCoins",
old+runCoins
);

checkAchievements();

document.getElementById("finishInfo").textContent=
LEVELS[current][0]+
" • 🪙 "+
runCoins+
"/3 • ☠️ "+
deaths+
" śmierci";

finish.style.display="flex";

renderMenu();

}

/* =====================================================
   DRAW
===================================================== */

function draw(){

const color=LEVELS[current][3];

ctx.clearRect(0,0,W,H);

ctx.save();

if(shake>0){

ctx.translate(
(Math.random()-.5)*shake,
(Math.random()-.5)*shake
);

}

const bg=ctx.createLinearGradient(0,0,0,H);

bg.addColorStop(0,"#080b20");
bg.addColorStop(1,"#020207");

ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);

drawStars();
drawGrid();

ctx.fillStyle="#0b0d18";

ctx.fillRect(
0,
ground,
W,
H-ground
);

ctx.strokeStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=14;
ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(0,ground);
ctx.lineTo(W,ground);
ctx.stroke();

ctx.shadowBlur=0;

/* przeszkody */

for(const o of obstacles){

const x=o.x-world;

if(x<-100||x>W+100)continue;

if(o.type==="spike")drawSpike(x);

if(o.type==="saw")drawSaw(x,o.r);

if(o.type==="gap"){

ctx.fillStyle="#020207";

ctx.fillRect(
x,
ground,
o.w,
H-ground
);

}

}

/* pady */

for(const p of pads){

const x=p.x-world;

if(x>-100&&x<W+100){
drawPad(x);
}

}

/* portale */

for(const p of portals){

const x=p.x-world;

if(x>-100&&x<W+100){

if(p.type==="speed")
drawPortal(x,"#ffe14a",">>");

if(p.type==="gravity")
drawPortal(x,"#ff4be8","↕");

if(p.type==="mode"){

const data={
ship:["#ff9b3d","🚀"],
ufo:["#8cff4d","🛸"],
wave:["#45b7ff","〰"],
ball:["#d66cff","●"],
cube:["#00eaff","⬛"]
};

drawPortal(
x,
data[p.mode][0],
data[p.mode][1]
);

}

}

}

/* monety */

for(const c of coins){

if(c.collected)continue;

const x=c.x-world;

if(x>-50&&x<W+50){

drawCoin(
x,
gravityDirection===1?
ground-125:
125
);

}

}

drawTrail();

if(!dying&&!finished){
drawPlayer();
}

drawParticles();

if(flash>0){

ctx.fillStyle=
"rgba(255,255,255,"+
Math.min(.5,flash*.5)+")";

ctx.fillRect(0,0,W,H);

}

ctx.restore();

const length=11500+current*600;

const p=Math.min(
100,
Math.floor(world/length*100)
);

percent.textContent=p+"%";
gameBar.style.width=p+"%";

}

/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

const color=LEVELS[current][3];

ctx.save();

ctx.translate(
player.x+17,
player.y+17
);

ctx.rotate(player.rot);

ctx.shadowColor=color;
ctx.shadowBlur=20;

if(currentMode==="cube"){

ctx.fillStyle=color;
ctx.fillRect(-17,-17,34,34);

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.strokeRect(-17,-17,34,34);

}

else if(currentMode==="ship"){

ctx.fillStyle=color;

ctx.beginPath();

ctx.moveTo(23,0);
ctx.lineTo(-15,-14);
ctx.lineTo(-8,0);
ctx.lineTo(-15,14);
ctx.closePath();

ctx.fill();

ctx.fillStyle="#fff";
ctx.fillRect(-4,-5,9,10);

}

else if(currentMode==="ufo"){

ctx.fillStyle=color;

ctx.beginPath();

ctx.ellipse(
0,
3,
21,
10,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#fff";

ctx.beginPath();

ctx.arc(
0,
-5,
9,
Math.PI,
Math.PI*2
);

ctx.fill();

}

else if(currentMode==="wave"){

ctx.fillStyle=color;

ctx.beginPath();

ctx.moveTo(-18,9);
ctx.lineTo(18,-9);
ctx.lineTo(18,7);
ctx.closePath();

ctx.fill();

}

else if(currentMode==="ball"){

ctx.fillStyle=color;

ctx.beginPath();

ctx.arc(
0,
0,
17,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#fff";
ctx.stroke();

}

ctx.shadowBlur=0;
ctx.restore();

}

/* =====================================================
   DRAW OBJECTS
===================================================== */

function drawSpike(x){

const c=LEVELS[current][3];

ctx.save();

ctx.fillStyle=c;
ctx.shadowColor=c;
ctx.shadowBlur=16;

ctx.beginPath();

if(gravityDirection===1){

ctx.moveTo(x,ground);
ctx.lineTo(x+23,ground-47);
ctx.lineTo(x+46,ground);

}else{

ctx.moveTo(x,0);
ctx.lineTo(x+23,47);
ctx.lineTo(x+46,0);

}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();

}

function drawSaw(x,r){

const c=LEVELS[current][3];

const cy=
gravityDirection===1?
ground-r:
r;

ctx.save();

ctx.translate(x,cy);
ctx.rotate(performance.now()/280);

ctx.fillStyle=c;
ctx.shadowColor=c;
ctx.shadowBlur=17;

const teeth=14;

ctx.beginPath();

for(let i=0;i<teeth*2;i++){

const a=i*Math.PI/teeth;
const rr=i%2===0?r:r*.7;

const xx=Math.cos(a)*rr;
const yy=Math.sin(a)*rr;

if(i===0)ctx.moveTo(xx,yy);
else ctx.lineTo(xx,yy);

}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;

ctx.fillStyle="#05050c";

ctx.beginPath();
ctx.arc(0,0,r*.28,0,Math.PI*2);
ctx.fill();

ctx.restore();

}

function drawPad(x){

ctx.save();

ctx.fillStyle="#49ff9a";
ctx.shadowColor="#49ff9a";
ctx.shadowBlur=18;

ctx.beginPath();

ctx.arc(
x+25,
ground-10,
20,
Math.PI,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();

}

function drawPortal(x,color,text){

ctx.save();

ctx.translate(
x+30,
H*.48
);

ctx.strokeStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=22;
ctx.lineWidth=5;

ctx.beginPath();

ctx.arc(
0,
0,
30+Math.sin(performance.now()/140)*4,
0,
Math.PI*2
);

ctx.stroke();

ctx.shadowBlur=0;

ctx.fillStyle="#fff";
ctx.font="bold 20px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(text,0,0);

ctx.restore();

}

function drawCoin(x,y){

ctx.save();

ctx.translate(x,y);

ctx.shadowColor="#ffd43b";
ctx.shadowBlur=20;
ctx.fillStyle="#ffd43b";

ctx.beginPath();
ctx.arc(0,0,14,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();

}

/* =====================================================
   BACKGROUND
===================================================== */

function createStars(){

stars=[];

for(let i=0;i<70;i++){

stars.push({
x:Math.random()*W,
y:Math.random()*ground,
r:Math.random()*2+.5,
v:Math.random()*.8+.2
});

}

}

function drawStars(){

ctx.fillStyle="#fff";

for(const s of stars){

s.x-=s.v;

if(s.x<0)s.x=W;

ctx.globalAlpha=.3+s.r*.2;

ctx.beginPath();

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}

function drawGrid(){

const color=LEVELS[current][3];

ctx.strokeStyle=color;
ctx.globalAlpha=.08;

const size=70;
const off=-(world*.25)%size;

for(let x=off;x<W;x+=size){

ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,ground);
ctx.stroke();

}

for(let y=40;y<ground;y+=size){

ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(W,y);
ctx.stroke();

}

ctx.globalAlpha=1;

}

/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

for(let i=trail.length-1;i>=0;i--){

trail[i].life-=dt;

if(trail[i].life<=0){
trail.splice(i,1);
}

}

if(trail.length>35){
trail.splice(0,trail.length-35);
}

}

function drawTrail(){

const color=LEVELS[current][3];

for(const t of trail){

ctx.globalAlpha=
Math.max(0,t.life/.3)*.35;

ctx.fillStyle=color;

ctx.fillRect(
t.x-t.size/2,
t.y-t.size/2,
t.size,
t.size
);

}

ctx.globalAlpha=1;

}

/* =====================================================
   PARTICLES
===================================================== */

function particle(x,y,vx,vy,life,size,color){

particles.push({
x,y,vx,vy,
life,
max:life,
size,
color,
rot:Math.random()*6,
spin:(Math.random()-.5)*8
});

if(particles.length>300){
particles.shift();
}

}

function particlesJump(){

for(let i=0;i<10;i++){

particle(
player.x+17,
player.y+17,
(Math.random()-.5)*150,
Math.random()*80,
.4,
3,
LEVELS[current][3]
);

}

}

function particlesDeath(){

for(let i=0;i<45;i++){

particle(
player.x+17,
player.y+17,
(Math.random()-.5)*500,
(Math.random()-.6)*500,
.8,
Math.random()*7+2,
LEVELS[current][3]
);

}

}

function particlesCoin(x,y){

for(let i=0;i<20;i++){

particle(
x,
y,
(Math.random()-.5)*250,
(Math.random()-.7)*250,
.7,
4,
"#ffd43b"
);

}

}

function particlesPad(x){

for(let i=0;i<18;i++){

particle(
x,
ground-15,
(Math.random()-.5)*220,
-Math.random()*220,
.7,
4,
"#49ff9a"
);

}

}

function particlesPortal(x){

for(let i=0;i<25;i++){

particle(
x,
H*.48,
(Math.random()-.5)*300,
(Math.random()-.5)*300,
.7,
4,
"#ff4be8"
);

}

}

function particlesMode(x,mode){

const colors={
cube:"#00eaff",
ship:"#ff9b3d",
ufo:"#8cff4d",
wave:"#45b7ff",
ball:"#d66cff"
};

for(let i=0;i<35;i++){

particle(
x,
H*.48,
(Math.random()-.5)*350,
(Math.random()-.5)*350,
.8,
4,
colors[mode]
);

}

}

function updateParticles(dt){

for(let i=particles.length-1;i>=0;i--){

const p=particles[i];

p.life-=dt;

p.x+=p.vx*dt;
p.y+=p.vy*dt;

p.vy+=500*dt;
p.rot+=p.spin*dt;

if(p.life<=0){
particles.splice(i,1);
}

}

}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=
Math.max(0,p.life/p.max);

ctx.fillStyle=p.color;

ctx.save();

ctx.translate(p.x,p.y);
ctx.rotate(p.rot);

ctx.fillRect(
-p.size/2,
-p.size/2,
p.size,
p.size
);

ctx.restore();

}

ctx.globalAlpha=1;

}

/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

stopMusic();

try{

if(!audio){

audio=new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(audio.state==="suspended"){
audio.resume();
}

const notes=[
262,330,392,523,
392,330,294,330
];

musicIndex=0;

function note(){

if(!sound||!running||paused)return;

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.type="square";

osc.frequency.value=
notes[musicIndex%notes.length];

gain.gain.setValueAtTime(
.03,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+.15
);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();
osc.stop(audio.currentTime+.16);

musicIndex++;

}

note();

musicTimer=setInterval(
note,
60000/LEVELS[current][4]
);

}catch(e){}

}

function stopMusic(){

if(musicTimer){

clearInterval(musicTimer);
musicTimer=null;

}

}

/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

if(!running)return;

paused=!paused;

pause.style.display=
paused?"flex":"none";

if(paused){

stopMusic();

}else{

last=performance.now();

if(sound)startMusic();

}

}

document.getElementById("pauseBtn").onclick=e=>{
e.stopPropagation();
togglePause();
};

document.getElementById("resume").onclick=()=>{
paused=false;
pause.style.display="none";
last=performance.now();
if(sound)startMusic();
};

/* =====================================================
   MENU
===================================================== */

function goMenu(){

running=false;
paused=false;
finished=false;
dying=false;

if(raf){
cancelAnimationFrame(raf);
raf=0;
}

stopMusic();

game.style.display="none";
menu.style.display="flex";

pause.style.display="none";
finish.style.display="none";

renderMenu();

}

document.getElementById("menuBtn").onclick=e=>{
e.stopPropagation();
goMenu();
};

document.getElementById("pauseMenu").onclick=goMenu;
document.getElementById("finishMenu").onclick=goMenu;

document.getElementById("again").onclick=()=>{
startLevel(current,true);
};

/* =====================================================
   SOUND
===================================================== */

function updateSound(){

document.getElementById("soundBtn").textContent=
sound?"🔊":"🔇";

}

document.getElementById("soundBtn").onclick=e=>{

e.stopPropagation();

sound=!sound;

set(
"nd_sound",
sound?"1":"0"
);

updateSound();

if(sound&&running&&!paused){
startMusic();
}else{
stopMusic();
}

};

/* =====================================================
   AUTO PAUSE
===================================================== */

document.addEventListener("visibilitychange",()=>{

if(
document.hidden&&
running&&
!paused
){

paused=true;
pause.style.display="flex";
stopMusic();

}

});

addEventListener("blur",()=>{

if(
running&&
!paused
){

paused=true;
pause.style.display="flex";
stopMusic();

}

});

/* =====================================================
   LOOP
===================================================== */

function loop(time){

if(!running)return;

if(paused){

last=time;
raf=requestAnimationFrame(loop);
return;

}

let dt=(time-last)/1000;

if(!Number.isFinite(dt)||dt<0)dt=0;

dt=Math.min(dt,.05);

last=time;

update(dt);
draw();
checkWin();

if(running){
raf=requestAnimationFrame(loop);
}

}

/* =====================================================
   INIT
===================================================== */

resize();
renderMenu();
renderAchievements();
updateSound();

</script>

</body>
