<!DOCTYPE html>

<html lang="pl">
<head>

<title>Neon Dash</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050510;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

button{
    border:2px solid #00ffff;
    background:rgba(0,20,35,.85);
    color:white;
    font-weight:900;
    font-size:18px;
    padding:13px 28px;
    border-radius:10px;
    cursor:pointer;
    text-shadow:0 0 8px currentColor;
    box-shadow:0 0 12px rgba(0,255,255,.35), inset 0 0 12px rgba(0,255,255,.08);
    transition:.15s;
}

button:hover{
    transform:scale(1.04);
    background:rgba(0,70,90,.9);
}

button:active{
    transform:scale(.96);
}

.hidden{
    display:none!important;
}

#menu,
#levelMenu,
#achMenu,
#settingsMenu,
#gameUI{
    position:fixed;
    inset:0;
    z-index:5;
}

.panel{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,760px);
    max-height:90vh;
    overflow:auto;
    padding:30px;
    border:2px solid rgba(0,255,255,.7);
    border-radius:22px;
    background:rgba(3,5,20,.9);
    box-shadow:
        0 0 30px rgba(0,255,255,.25),
        inset 0 0 30px rgba(0,255,255,.05);
    text-align:center;
    backdrop-filter:blur(8px);
}

.logo{
    font-size:clamp(45px,10vw,100px);
    font-weight:1000;
    letter-spacing:8px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #00ffff,
        0 0 35px #00ffff;
    margin-bottom:8px;
}

.subtitle{
    color:#9ff;
    letter-spacing:4px;
    margin-bottom:35px;
}

.menuButtons{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:330px;
    margin:auto;
}

.menuButtons button{
    width:100%;
}

.levelGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:12px;
    margin:20px 0;
}

.levelBtn{
    min-height:85px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
}

.levelBtn small{
    opacity:.7;
}

.levelBtn.completed{
    background:rgba(0,100,60,.6);
    border-color:#00ff88;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    align-items:center;
    gap:12px;
    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,15,.65);
    border:1px solid rgba(255,255,255,.25);
    padding:8px 12px;
    border-radius:8px;
    font-weight:900;
    text-shadow:0 0 8px #fff;
}

#progressWrap{
    flex:1;
    height:12px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:20px;
    overflow:hidden;
    background:rgba(0,0,0,.5);
}

#progress{
    height:100%;
    width:0%;
    background:#00ffff;
    box-shadow:0 0 15px #00ffff;
}

#pauseBtn{
    pointer-events:auto;
    padding:7px 13px;
    font-size:16px;
}

#mobileControls{
    position:absolute;
    bottom:25px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    pointer-events:none;
}

#jumpBtn{
    pointer-events:auto;
    width:110px;
    height:70px;
    border-radius:50%;
    font-size:17px;
    background:rgba(0,255,255,.13);
}

#gameInfo{
    position:absolute;
    left:50%;
    top:70px;
    transform:translateX(-50%);
    text-align:center;
    pointer-events:none;
}

#levelName{
    font-size:22px;
    font-weight:1000;
    text-shadow:0 0 12px currentColor;
}

#musicName{
    font-size:12px;
    opacity:.65;
    margin-top:3px;
}

#pausePanel,
#winPanel,
#deathPanel{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,10,.58);
    backdrop-filter:blur(5px);
}

.bigTitle{
    font-size:clamp(35px,8vw,72px);
    font-weight:1000;
    margin:0 0 10px;
    text-shadow:
        0 0 5px #fff,
        0 0 20px currentColor,
        0 0 40px currentColor;
}

.stat{
    margin:8px 0;
    color:#ddd;
}

.coins{
    color:#ffe65c;
    text-shadow:0 0 10px #ffe65c;
}

#toast{
    position:fixed;
    z-index:30;
    left:50%;
    bottom:25px;
    transform:translate(-50%,30px);
    opacity:0;
    pointer-events:none;
    padding:12px 20px;
    border:1px solid #00ffff;
    border-radius:12px;
    background:rgba(0,10,25,.95);
    box-shadow:0 0 20px rgba(0,255,255,.4);
    font-weight:900;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.settingsRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:15px 5px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.shopGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin:20px 0;
}

.skin{
    padding:15px;
    border:2px solid rgba(255,255,255,.2);
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,.03);
}

.skin.selected{
    border-color:#00ffff;
    box-shadow:0 0 18px rgba(0,255,255,.35);
}

.skinPreview{
    width:48px;
    height:48px;
    margin:0 auto 10px;
    border-radius:6px;
    border:3px solid white;
}

#completionFX{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:10;
}

@media(max-width:600px){
    .panel{
        padding:20px 15px;
    }

    .logo{
        letter-spacing:4px;
    }

    button{
        font-size:16px;
    }

    #hud{
        gap:6px;
    }

    .hudBox{
        padding:6px 8px;
        font-size:12px;
    }
}
</style>

</head>

<script>
"use strict";

/* =========================================================
   NEON DASH
   Wszystkie utwory są proceduralnie generowane.
   Każdy poziom ma osobną melodię, tempo, instrumenty i rytm.
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=Math.floor(W*DPR);
    canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* ================= SAVE ================= */

const defaultSave={
    completed:[],
    coins:0,
    collectedCoins:{},
    selectedSkin:0,
    ownedSkins:[0],
    music:true,
    sound:true,
    fx:true
};

let save=JSON.parse(localStorage.getItem("neonDashSave")||"null")||structuredClone(defaultSave);

function saveGame(){
    localStorage.setItem("neonDashSave",JSON.stringify(save));
}

/* ================= LEVELS ================= */

const levels=[
    {name:"NEON RUSH",color:"#00ffff",speed:5.8,length:7000,bpm:150,style:0},
    {name:"CRYSTAL DRIVE",color:"#6fa8ff",speed:6,length:7300,bpm:128,style:1},
    {name:"LAVA PULSE",color:"#ff482e",speed:6.2,length:7600,bpm:172,style:2},
    {name:"SKY CIRCUIT",color:"#75ff70",speed:6.4,length:7900,bpm:138,style:3},
    {name:"VIOLET RUN",color:"#c86cff",speed:6.6,length:8200,bpm:160,style:4},
    {name:"SHADOW FACTORY",color:"#aaaabb",speed:6.8,length:8500,bpm:118,style:5},
    {name:"CYBER STORM",color:"#00aaff",speed:7,length:8800,bpm:180,style:6},
    {name:"INFERNO CORE",color:"#ff7800",speed:7.2,length:9000,bpm:190,style:7},
    {name:"ELECTRIC VOID",color:"#eeff00",speed:7.4,length:9200,bpm:165,style:8},
    {name:"GRAVITY BREAK",color:"#ff35bb",speed:7.6,length:9400,bpm:145,style:9},
    {name:"OVERDRIVE",color:"#00ff88",speed:7.8,length:9600,bpm:200,style:10},
    {name:"FINAL CHAOS",color:"#ffffff",speed:8,length:10000,bpm:210,style:11},
    {name:"STARFALL",color:"#58a6ff",speed:8.2,length:10400,bpm:132,style:12},
    {name:"QUANTUM",color:"#b76cff",speed:8.4,length:10800,bpm:175,style:13},
    {name:"NEON INFERNO",color:"#ff4f81",speed:8.6,length:11200,bpm:198,style:14},
    {name:"ZERO GRAVITY",color:"#45ffff",speed:8.8,length:11600,bpm:125,style:15},
    {name:"NIGHTMARE",color:"#ff3333",speed:9,length:12000,bpm:205,style:16},
    {name:"ULTIMATE DASH",color:"#ffffff",speed:9.3,length:12600,bpm:220,style:17}
];

let currentLevel=0;

/* ================= SKINS ================= */

const skins=[
    {name:"CLASSIC",color:"#ffffff",price:0},
    {name:"CYAN",color:"#00ffff",price:10},
    {name:"LIME",color:"#7cff00",price:20},
    {name:"VIOLET",color:"#bd55ff",price:30},
    {name:"FIRE",color:"#ff4b24",price:40},
    {name:"GOLD",color:"#ffe04a",price:60},
    {name:"PINK",color:"#ff4fbe",price:80},
    {name:"ICE",color:"#9deeff",price:100}
];

/* ================= ACHIEVEMENTS ================= */

const achievements=[
    ["first","PIERWSZY KROK","Ukończ pierwszy poziom"],
    ["three","ROZGRZEWKA","Ukończ 3 poziomy"],
    ["six","NEON MASTER","Ukończ 6 poziomów"],
    ["all","ULTIMATE","Ukończ wszystkie poziomy"],
    ["coins10","KOLEKCJONER","Zdobądź 10 monet"],
    ["coins25","ŁOWCA MONET","Zdobądź 25 monet"],
    ["perfect","PERFECT RUN","Ukończ poziom bez śmierci"],
    ["survivor","SURVIVOR","Ukończ poziom po wielu próbach"]
];

let unlockedAchievements=[];

/* ================= GAME STATE ================= */

let playing=false;
let paused=false;
let dead=false;
let won=false;
let attempts=1;
let levelDeaths=0;
let distance=0;
let collected=0;

let player={
    x:180,
    y:0,
    size:42,
    vy:0,
    grounded:false,
    rotation:0,
    blink:0
};

let obstacles=[];
let coins=[];
let particles=[];
let trail=[];
let stars=[];
let portals=[];
let pads=[];

let animationFrame=null;
let musicTimer=null;
let musicStep=0;
let musicNextTime=0;
let audioCtx=null;

let cameraX=0;
let shake=0;

let winFX={
    active:false,
    time:0,
    duration:260,
    bursts:[],
    rings:[],
    confetti:[],
    rays:[]
};

/* ================= AUDIO ================= */

function initAudio(){
    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function tone(freq,duration,type="square",volume=.045,when=null){
    if(!save.sound || !audioCtx) return;

    const now=when??audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.setValueAtTime(freq,now);

    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(volume,now+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now+duration+.03);
}

function jumpSound(){
    tone(520,.09,"square",.045);
    tone(780,.07,"triangle",.025);
}

function coinSound(){
    tone(880,.08,"triangle",.055);
    tone(1320,.12,"sine",.035,.06);
}

function deathSound(){
    tone(180,.18,"sawtooth",.05);
    tone(100,.25,"square",.035,.08);
}

function portalSound(){
    tone(500,.08,"sine",.035);
    tone(900,.16,"triangle",.03,.08);
}

function winSound(){
    const now=audioCtx?.currentTime||0;
    [523,659,784,1047,1319].forEach((n,i)=>{
        tone(n,.22,"triangle",.055,now+i*.1);
    });
}

/* =========================================================
   PROCEDURAL LEVEL MUSIC
   Każdy poziom ma inne nuty, tempo i charakter.
========================================================= */

const scales=[
    [261.63,293.66,329.63,392,440,523.25],
    [220,261.63,293.66,329.63,392,440],
    [164.81,196,233.08,261.63,311.13,349.23],
    [196,220,246.94,293.66,329.63,392],
    [246.94,293.66,349.23,392,466.16,587.33],
    [146.83,174.61,196,233.08,261.63,293.66],
    [185,220,277.18,329.63,369.99,440],
    [130.81,155.56,185,207.65,246.94,277.18],
    [220,246.94,277.18,329.63,369.99,415.3],
    [174.61,207.65,246.94,293.66,349.23,415.3],
    [196,246.94,293.66,369.99,440,493.88],
    [130.81,164.81,196,246.94,293.66,392],
    [233.08,277.18,311.13,369.99,466.16,554.37],
    [196,233.08,293.66,349.23,440,523.25],
    [155.56,196,233.08,277.18,329.63,392],
    [174.61,220,261.63,329.63,392,493.88],
    [123.47,146.83,174.61,207.65,246.94,293.66],
    [261.63,311.13,369.99,440,523.25,622.25]
];

function playMusicNote(level,step,time){
    if(!save.music || !audioCtx) return;

    const bpm=level.bpm;
    const beat=60/bpm;
    const s=scales[level.style%scales.length];

    const mode=level.style%6;

    let index;
    let type="square";
    let volume=.025;

    if(mode===0){
        index=[0,2,4,2,1,3,5,3][step%8];
        type="square";
    }else if(mode===1){
        index=[0,0,2,4,3,2,1,2][step%8];
        type="triangle";
    }else if(mode===2){
        index=[0,3,2,5,3,1,4,2][step%8];
        type="sawtooth";
        volume=.018;
    }else if(mode===3){
        index=[0,1,3,5,3,1,2,4][step%8];
        type="sine";
    }else if(mode===4){
        index=[0,2,5,3,4,2,1,5][step%8];
        type="square";
    }else{
        index=[0,3,1,4,2,5,3,4][step%8];
        type="triangle";
    }

    const octave=(step%16===0||step%16===8)?2:1;

    tone(
        s[index]*octave,
        beat*.75,
        type,
        volume,
        time
    );

    if(step%4===0){
        tone(
            s[0]/2,
            beat*.35,
            "sine",
            .025,
            time
        );
    }

    if(mode===2 && step%2===0){
        tone(
            s[(index+2)%s.length]/2,
            beat*.18,
            "square",
            .018,
            time+.03
        );
    }

    if(mode===5 && step%8===7){
        tone(
            s[5]*2,
            beat*.3,
            "triangle",
            .018,
            time
        );
    }
}

function startMusic(){
    stopMusic();

    if(!save.music) return;

    initAudio();

    const level=levels[currentLevel];
    const beat=60/level.bpm;

    musicStep=0;
    musicNextTime=audioCtx.currentTime+.05;

    function schedule(){
        if(!playing || paused || dead || won || !save.music){
            musicTimer=null;
            return;
        }

        while(musicNextTime<audioCtx.currentTime+.18){
            playMusicNote(level,musicStep,musicNextTime);
            musicStep++;
            musicNextTime+=beat/2;
        }

        musicTimer=setTimeout(schedule,35);
    }

    schedule();
}

function stopMusic(){
    if(musicTimer){
        clearTimeout(musicTimer);
        musicTimer=null;
    }
}

/* ================= UTIL ================= */

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function rectsOverlap(a,b){
    return a.x<b.x+b.w &&
           a.x+a.w>b.x &&
           a.y<b.y+b.h &&
           a.y+a.h>b.y;
}

function hexToRgb(hex){
    const n=parseInt(hex.replace("#",""),16);
    return {
        r:(n>>16)&255,
        g:(n>>8)&255,
        b:n&255
    };
}

/* ================= MENU ================= */

function hideMenus(){
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("levelMenu").classList.add("hidden");
    document.getElementById("achMenu").classList.add("hidden");
    document.getElementById("settingsMenu").classList.add("hidden");
    document.getElementById("shopMenu").classList.add("hidden");
}

function backHome(){
    playing=false;
    paused=false;
    dead=false;

/* ================= LEVEL GENERATION ================= */

function createLevel(){
    obstacles=[];
    coins=[];
    portals=[];
    pads=[];
    particles=[];
    trail=[];

    const level=levels[currentLevel];

    const groundY=H*.76;

    player.x=180;
    player.y=groundY-player.size;
    player.vy=0;
    player.grounded=true;
    player.rotation=0;
    player.blink=0;

    distance=0;
    collected=0;
    cameraX=0;

    const seedOffset=currentLevel*10000;

    let x=500;

    while(x<level.length-400){

        const type=Math.random();

        if(type<.5){
            obstacles.push({
                type:"spike",
                x:x,
                y:groundY-48,
                w:45,
                h:48
            });

            if(Math.random()<.3){
                obstacles.push({
                    type:"spike",
                    x:x+47,
                    y:groundY-48,
                    w:45,
                    h:48
                });

                x+=40;
            }

            x+=rand(260,470);

        }else if(type<.72){

            obstacles.push({
                type:"saw",
                x:x,
                y:groundY-rand(100,180),
                r:27,
                spin:Math.random()*6
            });

            x+=rand(300,500);

        }else if(type<.86){

            obstacles.push({
                type:"gap",
                x:x,
                y:groundY,
                w:rand(100,190),
                h:300
            });

            x+=rand(350,550);

        }else{

            pads.push({
                x:x,
                y:groundY-18,
                w:55,
                h:18
            });

            x+=rand(300,450);
        }

        if(Math.random()<.72){
            coins.push({
                x:x-rand(50,130),
                y:groundY-rand(100,180),
                r:12,
                collected:false,
                spin:Math.random()*6
            });
        }
    }

    while(coins.length<3){
        coins.push({
            x:1200+coins.length*1700,
            y:groundY-140,
            r:12,
            collected:false,
            spin:0
        });
    }

    coins=coins.slice(0,3);

    /* specjalne portale */
    for(let i=0;i<3;i++){
        portals.push({
            x:1600+i*(level.length/4),
            y:groundY-120-rand(0,120),
            type:i%2===0?"speed":"gravity",
            used:false
        });
    }

    for(let i=0;i<120;i++){
        stars.push({
            x:Math.random()*level.length,
            y:Math.random()*H*.75,
            s:rand(1,3),
            a:rand(.2,1),
            p:Math.random()*Math.PI*2
        });
    }

    void seedOffset;
}

/* ================= START / STOP ================= */

function startLevel(index){
    currentLevel=clamp(index,0,levels.length-1);

    hideMenus();

    document.getElementById("gameUI").classList.remove("hidden");
    document.getElementById("pausePanel").classList.add("hidden");
    document.getElementById("deathPanel").classList.add("hidden");
    document.getElementById("winPanel").classList.add("hidden");

    playing=true;
    paused=false;
    dead=false;
    won=false;

    attempts=1;
    levelDeaths=0;

        `${currentLevel+1}. ${level.name}`;

    document.getElementById("levelName").style.color=level.color;

    document.getElementById("musicName").textContent=
        `♪ ORIGINAL TRACK • ${level.bpm} BPM`;

    createLevel();
    updateHUD();

    initAudio();
    startMusic();

    startLoop();
}

function stopLoop(){
    if(animationFrame!==null){
        cancelAnimationFrame(animationFrame);
        animationFrame=null;
    }
}

function startLoop(){
    stopLoop();
    animationFrame=requestAnimationFrame(loop);
}

function loop(time){
    if(!playing || paused || dead || won){
        animationFrame=null;
        return;
    }

    update();
    draw();

    animationFrame=requestAnimationFrame(loop);
}

/* ================= GAME UPDATE ================= */

let lastTime=0;

function update(){
    const level=levels[currentLevel];

    const dt=1;

    distance+=level.speed;

    cameraX=distance;

    player.vy+=.65*dt;
    player.y+=player.vy*dt;

    const groundY=H*.76;

    player.grounded=false;

    if(player.y+player.size>=groundY){
        player.y=groundY-player.size;
        player.vy=0;
        player.grounded=true;
    }

    /* gap collision */
    for(const g of obstacles){
        if(g.type==="gap"){
            if(
                player.x+player.size>g.x &&
                player.x<g.x+g.w &&
                player.y+player.size>=groundY-5
            ){
                die();
                return;
            }
        }
    }

    /* spikes */
    for(const o of obstacles){
        if(o.type!=="spike") continue;

        const bx=o.x-distance+180;

        const hit={
            x:bx+7,
            y:o.y,
            w:o.w-14,
            h:o.h
        };

        const pbox={
            x:player.x+6,
            y:player.y+5,
            w:player.size-12,
            h:player.size-8
        };

        if(rectsOverlap(pbox,hit)){
            die();
            return;
        }
    }

    /* saws */
    for(const o of obstacles){
        if(o.type!=="saw") continue;

        const sx=o.x-distance+180;
        const sy=o.y;

        const cx=player.x+player.size/2;
        const cy=player.y+player.size/2;

        const dx=cx-sx;
        const dy=cy-sy;

        if(Math.sqrt(dx*dx+dy*dy)<o.r+player.size*.36){
            die();
            return;
        }
    }

    /* pads */
    for(const p of pads){
        const px=p.x-distance+180;

        if(
            player.x+player.size>px &&
            player.x<px+p.w &&
            player.y+player.size>=groundY-25 &&
            player.grounded
        ){
            player.vy=-13;
            player.grounded=false;

            spawnBurst(player.x+player.size/2,player.y+player.size,levels[currentLevel].color,8);
        }
    }

    /* portals */
    for(const p of portals){
        const px=p.x-distance+180;

        if(!p.used &&
           Math.abs(player.x-px)<45){

            p.used=true;

            if(p.type==="speed"){
                spawnBurst(px,p.y,"#00ff88",18);
                portalSound();
            }else{
                spawnBurst(px,p.y,"#ff35bb",18);
                portalSound();
            }
        }
    }

    /* coins */
    for(const c of coins){
        if(c.collected) continue;

        const cx=c.x-distance+180;
        const cy=c.y;

        const dx=(player.x+player.size/2)-cx;
        const dy=(player.y+player.size/2)-cy;

        if(Math.sqrt(dx*dx+dy*dy)<30){
            c.collected=true;
            collected++;
            save.coins++;

            coinSound();

            spawnBurst(cx,cy,"#ffe65c",18);

            saveGame();
            checkAchievements();
        }

        c.spin+=.1;
    }

    /* player animation */
    player.rotation+=player.grounded?0.025:0.09;

    player.blink-=1;

    if(player.blink<0 && Math.random()<.008){
        player.blink=10;
    }

    /* trail */
    if(save.fx){
        trail.push({
            x:player.x+player.size/2,
            y:player.y+player.size/2,
            a:1
        });

        if(trail.length>18) trail.shift();

        for(const t of trail){
            t.a-=.045;
        }

        trail=trail.filter(t=>t.a>0);
    }

    /* particles */
    for(const p of particles){
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.g;
        p.life-=1;
        p.rot+=p.rv;
    }

    particles=particles.filter(p=>p.life>0);

    /* shake */
    shake*=.84;

    updateHUD();

    if(distance>=level.length){
        win();
    }

    lastTime=performance.now();
}

/* ================= JUMP ================= */

function jump(){
    if(!playing || paused || dead || won) return;

    initAudio();

    if(player.grounded){
        player.vy=-12;
        player.grounded=false;

        jumpSound();

        if(save.fx){
            spawnBurst(
                player.x+player.size/2,
                player.y+player.size,
                levels[currentLevel].color,
                10
            );
        }
    }
}

addEventListener("keydown",e=>{
    if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
        e.preventDefault();
        jump();
    }

    if(e.code==="Escape" && playing){
        if(paused) resumeGame();
        else pauseGame();
    }
});

document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{
    e.preventDefault();
    jump();
});

/* ================= DIE ================= */

function die(){
    if(dead||won) return;

    dead=true;
    playing=false;

    stopLoop();
    stopMusic();

    levelDeaths++;
    attempts++;

    if(save.sound){
        initAudio();
        deathSound();
    }

    shake=16;

    spawnBurst(
        player.x+player.size/2,
        player.y+player.size/2,
        "#ff304f",
        save.fx?45:10
    );

    document.getElementById("deathProgress").textContent=
        Math.floor(distance/levels[currentLevel].length*100)+"%";

    document.getElementById("deathCoins").textContent=
        collected+"/3";

    document.getElementById("deathPanel").classList.remove("hidden");

    checkAchievements();
}

/* ================= WIN ================= */

function win(){
    if(won||dead) return;

    won=true;
    playing=false;

    stopLoop();
    stopMusic();

    const oldCompleted=save.completed.includes(currentLevel);

    if(!oldCompleted){
        save.completed.push(currentLevel);
    }

    const key=String(currentLevel);

    save.collectedCoins[key]=Math.max(
        save.collectedCoins[key]||0,
        collected
    );

    saveGame();

    if(save.sound){
        initAudio();
        winSound();
    }

    checkAchievements();

    startWinAnimation();
}

/* ================= VICTORY FX ================= */

let winFrame=null;

function stopWinAnimation(){
    winFX.active=false;

    if(winFrame!==null){
        cancelAnimationFrame(winFrame);
        winFrame=null;
    }
}

function startWinAnimation(){
    stopWinAnimation();

    document.getElementById("winPanel").classList.add("hidden");

    winFX.active=true;
    winFX.time=0;
    winFX.bursts=[];
    winFX.rings=[];
    winFX.confetti=[];
    winFX.rays=[];

    const level=levels[currentLevel];

    for(let i=0;i<8;i++){
        winFX.rays.push({
            a:i*Math.PI/4,
            len:rand(180,450),
            alpha:0
        });
    }

    for(let i=0;i<6;i++){
        spawnWinBurst(
            W/2+rand(-100,100),
            H/2+rand(-100,100),
            level.color,
            35
        );
    }

    winFrame=requestAnimationFrame(winLoop);
}

function winLoop(){
    if(!winFX.active){
        winFrame=null;
        return;
    }

    updateWinFX();
    draw();

    drawVictoryOverlay();

    if(winFX.time>=winFX.duration){
        finishWinAnimation();
        return;
    }

    winFrame=requestAnimationFrame(winLoop);
}

function updateWinFX(){
    winFX.time++;

    const t=winFX.time;

    if(t===1){
        shake=18;
    }

    if(t%25===0 && t<170){
        const level=levels[currentLevel];

        spawnWinBurst(
            W/2+rand(-220,220),
            H/2+rand(-150,150),
            level.color,
            28
        );
    }

    if(t===35||t===75||t===115){
        winFX.rings.push({
            x:W/2,
            y:H/2,
            r:10,
            a:1
        });
    }

    for(const r of winFX.rings){
        r.r+=8;
        r.a-=.025;
    }

    winFX.rings=winFX.rings.filter(r=>r.a>0);

    for(const b of winFX.bursts){
        b.x+=b.vx;
        b.y+=b.vy;
        b.vx*=.985;
        b.vy*=.985;
        b.vy+=.025;
        b.life--;
        b.rot+=b.rv;
    }

    winFX.bursts=winFX.bursts.filter(b=>b.life>0);

    for(const c of winFX.confetti){
        c.x+=c.vx;
        c.y+=c.vy;
        c.vy+=.08;
        c.rot+=c.rv;
        c.life--;
    }

    winFX.confetti=winFX.confetti.filter(c=>c.life>0);

    shake*=.91;
}

function spawnWinBurst(x,y,color,count){
    for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2;
        const s=rand(2,8);

        winFX.bursts.push({
            x,
            y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            size:rand(3,9),
            life:rand(45,120),
            color,
            rot:Math.random()*6,
            rv:rand(-.15,.15)
        });
    }

    for(let i=0;i<Math.floor(count/2);i++){
        winFX.confetti.push({
            x,
            y,
            vx:rand(-7,7),
            vy:rand(-10,-2),
            size:rand(5,12),
            rot:rand(0,6),
            rv:rand(-.15,.15),
            life:rand(70,160),
            color
        });
    }
}

function finishWinAnimation(){
    winFX.active=false;
    winFrame=null;

    document.getElementById("winLevel").textContent=
        levels[currentLevel].name;

    document.getElementById("winCoins").textContent=
        collected;

/* ================= DRAW ================= */

function draw(){
    const level=levels[currentLevel];

    ctx.save();

    let sx=0;
    let sy=0;

    if(shake>0){
        sx=rand(-shake,shake);
        sy=rand(-shake,shake);
    }

    ctx.translate(sx,sy);

    /* background */

    const grad=ctx.createLinearGradient(0,0,0,H);

    grad.addColorStop(0,"#050515");
    grad.addColorStop(1,"#09001a");

    ctx.fillStyle=grad;
    ctx.fillRect(-50,-50,W+100,H+100);

    /* stars */

    for(const s of stars){
        const x=s.x-distance*.12;

        if(x<-20||x>W+20) continue;

        const a=.3+.25*Math.sin(performance.now()*.002+s.p);

        ctx.globalAlpha=a;
        ctx.fillStyle="#fff";
        ctx.fillRect(x,s.y,s.s,s.s);
    }

    ctx.globalAlpha=1;

    /* grid */

    ctx.strokeStyle="rgba(0,255,255,.08)";
    ctx.lineWidth=1;

    const gridSize=60;
    const off=-(distance*.35%gridSize);

    for(let x=off;x<W;x+=gridSize){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=H*.76;y>0;y-=gridSize){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /* ground */

    ctx.fillStyle="rgba(0,20,35,.95)";
    ctx.fillRect(0,H*.76,W,H*.24);

    ctx.strokeStyle=level.color;
    ctx.shadowColor=level.color;
    ctx.shadowBlur=14;
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(0,H*.76);
    ctx.lineTo(W,H*.76);
    ctx.stroke();

    ctx.shadowBlur=0;

    /* obstacles */

    for(const o of obstacles){
        if(o.type==="spike"){
            const x=o.x-distance+180;

            if(x<-100||x>W+100) continue;

            ctx.fillStyle="#ff3055";
            ctx.shadowColor="#ff3055";
            ctx.shadowBlur=15;

            ctx.beginPath();
            ctx.moveTo(x,H*.76);
            ctx.lineTo(x+o.w/2,H*.76-o.h);
            ctx.lineTo(x+o.w,H*.76);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur=0;
        }

        if(o.type==="saw"){
            const x=o.x-distance+180;

            ctx.save();
            ctx.translate(x,o.y);
            ctx.rotate(performance.now()*.004);

            ctx.fillStyle="#e8e8ff";
            ctx.shadowColor=level.color;
            ctx.shadowBlur=18;

            ctx.beginPath();

            for(let i=0;i<20;i++){
                const a=i*Math.PI*2/20;
                const r=i%2===0?o.r:o.r*.65;

                ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
            }

            ctx.closePath();
            ctx.fill();

            ctx.fillStyle="#222";
            ctx.beginPath();
            ctx.arc(0,0,o.r*.25,0,Math.PI*2);
            ctx.fill();

            ctx.restore();
        }
    }

    /* pads */

    for(const p of pads){
        const x=p.x-distance+180;

        ctx.fillStyle="#00ff88";
        ctx.shadowColor="#00ff88";
        ctx.shadowBlur=15;

        ctx.fillRect(x,p.y,p.w,p.h);

        ctx.shadowBlur=0;
    }

    /* portals */

    for(const p of portals){
        const x=p.x-distance+180;

        ctx.strokeStyle=p.type==="speed"?"#00ff88":"#ff35bb";
        ctx.lineWidth=5;
        ctx.shadowColor=ctx.strokeStyle;
        ctx.shadowBlur=20;

        ctx.beginPath();
        ctx.arc(x,p.y,32,0,Math.PI*2);
        ctx.stroke();

        ctx.shadowBlur=0;
    }

    /* coins */

    for(const c of coins){
        if(c.collected) continue;

        const x=c.x-distance+180;

        ctx.save();
        ctx.translate(x,c.y);
        ctx.rotate(c.spin);

        ctx.fillStyle="#ffe65c";
        ctx.shadowColor="#ffe65c";
        ctx.shadowBlur=20;

        ctx.beginPath();
        ctx.arc(0,0,c.r,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#fff4a0";
        ctx.font="bold 13px Arial";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText("★",0,1);

        ctx.restore();
    }

    /* trail */

    if(save.fx){
        for(const t of trail){
            ctx.globalAlpha=t.a*.35;
            ctx.fillStyle=level.color;
            ctx.fillRect(
                t.x-t.size/2||t.x-8,
                t.y-8,
                16,
                16
            );
        }

        ctx.globalAlpha=1;
    }

    /* particles */

    for(const p of particles){
        ctx.save();

        ctx.globalAlpha=clamp(p.life/50,0,1);
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);

        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);

        ctx.restore();
    }

    drawPlayer();

    ctx.restore();
}

function drawPlayer(){
    const skin=skins[save.selectedSkin]||skins[0];
    const level=levels[currentLevel];

    const x=player.x;
    const y=player.y;
    const s=player.size;

    ctx.save();

    ctx.translate(x+s/2,y+s/2);

    ctx.rotate(
        player.grounded
            ? Math.sin(performance.now()*.012)*.04
            : player.rotation
    );

    ctx.shadowColor=skin.color;
    ctx.shadowBlur=25;

    ctx.fillStyle=skin.color;
    ctx.fillRect(-s/2,-s/2,s,s);

    ctx.shadowBlur=0;

    ctx.strokeStyle=level.color;
    ctx.lineWidth=3;
    ctx.strokeRect(-s/2,-s/2,s,s);

    /* eyes */

    ctx.fillStyle="#111";

    if(player.blink>0){
        ctx.fillRect(-12,-7,7,2);
        ctx.fillRect(5,-7,7,2);
    }else{
        ctx.fillRect(-12,-9,7,9);
        ctx.fillRect(5,-9,7,9);
    }

    /* pupils */

    if(player.blink<=0){
        ctx.fillStyle="#fff";
        ctx.fillRect(-10,-8,2,3);
        ctx.fillRect(7,-8,2,3);
    }

    /* mouth */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(0,4,8,0,Math.PI);
    ctx.stroke();

    ctx.restore();
}

/* ================= VICTORY DRAW ================= */

function drawVictoryOverlay(){
    const level=levels[currentLevel];

    ctx.save();

    const t=winFX.time;
    const fadeIn=clamp(t/25,0,1);
    const fadeOut=clamp((winFX.duration-t)/45,0,1);
    const alpha=Math.min(fadeIn,fadeOut);

    /* flash */

    if(t<18){
        ctx.globalAlpha=(18-t)/18*.65;
        ctx.fillStyle="#fff";
        ctx.fillRect(0,0,W,H);
    }

    /* rays */

    ctx.save();
    ctx.translate(W/2,H/2);

    for(const r of winFX.rays){
        ctx.save();
        ctx.rotate(r.a);

        const pulse=Math.sin(t*.08+r.a)*.15+.85;

        ctx.globalAlpha=alpha*.18*pulse;
        ctx.fillStyle=level.color;

        ctx.beginPath();
        ctx.moveTo(0,-15);
        ctx.lineTo(r.len,-55);
        ctx.lineTo(r.len,55);
        ctx.lineTo(0,15);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();

    /* rings */

    for(const r of winFX.rings){
        ctx.globalAlpha=r.a*.7;
        ctx.strokeStyle=level.color;
        ctx.shadowColor=level.color;
        ctx.shadowBlur=25;
        ctx.lineWidth=5;

        ctx.beginPath();
        ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
        ctx.stroke();
    }

    /* particles */

    for(const b of winFX.bursts){
        ctx.save();

        ctx.globalAlpha=clamp(b.life/70,0,1);
        ctx.translate(b.x,b.y);
        ctx.rotate(b.rot);

        ctx.fillStyle=b.color;
        ctx.shadowColor=b.color;
        ctx.shadowBlur=15;

        ctx.fillRect(
            -b.size/2,
            -b.size/2,
            b.size,
            b.size
        );

        ctx.restore();
    }

    /* confetti */

    for(const c of winFX.confetti){
        ctx.save();

        ctx.globalAlpha=clamp(c.life/70,0,1);
        ctx.translate(c.x,c.y);
        ctx.rotate(c.rot);

        ctx.fillStyle=c.color;
        ctx.fillRect(-c.size/2,-c.size/2,c.size,c.size*.55);

        ctx.restore();
    }

    /* central text */

    const p=clamp(t/35,0,1);
    const scale=1+Math.sin(Math.min(t,80)*.06)*.025;

    ctx.save();

    ctx.translate(W/2,H*.42);
    ctx.scale(scale*p,scale*p);

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font=`1000 ${Math.min(76,W*.105)}px Arial`;

    ctx.globalAlpha=alpha;

    ctx.fillStyle="#fff";
    ctx.shadowColor=level.color;
    ctx.shadowBlur=35;

    ctx.fillText("LEVEL COMPLETE!",0,0);

    ctx.shadowBlur=0;

    ctx.font=`1000 ${Math.min(120,W*.16)}px Arial`;
    ctx.fillStyle=level.color;

    ctx.fillText("100%",0,105);

    ctx.restore();

    /* coin rewards */

    for(let i=0;i<3;i++){
        const appear=55+i*22;

        if(t<appear) continue;

        const coinAlpha=clamp((t-appear)/12,0,1);

        const cx=W/2+(i-1)*75;
        const cy=H*.67;

        ctx.globalAlpha=coinAlpha;

        ctx.fillStyle=i<collected?"#ffe65c":"#333";
        ctx.strokeStyle=i<collected?"#fff2a0":"#666";
        ctx.lineWidth=4;

        ctx.shadowColor=i<collected?"#ffe65c":"transparent";
        ctx.shadowBlur=i<collected?25:0;

        ctx.beginPath();
        ctx.arc(cx,cy,25,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();

        if(i<collected){
            ctx.fillStyle="#fff";
            ctx.font="bold 22px Arial";
            ctx.textAlign="center";
            ctx.textBaseline="middle";
            ctx.fillText("★",cx,cy);
        }
    }

    ctx.restore();
}

/* ================= ACHIEVEMENTS ================= */

function unlockAchievement(id){
    if(unlockedAchievements.includes(id)) return;

    unlockedAchievements.push(id);

    saveGame();

    const a=achievements.find(x=>x[0]===id);

    if(a){
        toast("★ Osiągnięcie: "+a[1]);
    }
}

function checkAchievements(){
    const done=save.completed.length;

    if(done>=1) unlockAchievement("first");
    if(done>=3) unlockAchievement("three");
    if(done>=6) unlockAchievement("six");
    if(done>=levels.length) unlockAchievement("all");
    if(save.coins>=10) unlockAchievement("coins10");
    if(save.coins>=25) unlockAchievement("coins25");
    if(won && levelDeaths===0) unlockAchievement("perfect");
    if(won && attempts>=5) unlockAchievement("survivor");
}

/* ================= TOAST ================= */

let toastTimer=null;

function toast(text){
    const el=document.getElementById("toast");

    el.textContent=text;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}

/* ================= INITIAL ================= */

unlockedAchievements=
    JSON.parse(localStorage.getItem("neonDashAchievements")||"[]");

const originalSaveGame=saveGame;

saveGame=function(){
    localStorage.setItem(
        "neonDashSave",
        JSON.stringify(save)
    );

    localStorage.setItem(
        "neonDashAchievements",
        JSON.stringify(unlockedAchievements)
    );

    updateMenu();
};

updateMenu();
renderMenuBackground();

/* ================= MENU BACKGROUND ================= */

let menuStars=[];

for(let i=0;i<130;i++){
    menuStars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        s:rand(1,3),
        p:Math.random()*6
    });
}

function renderMenuBackground(){
    if(!document.getElementById("menu").classList.contains("hidden")){
        ctx.clearRect(0,0,W,H);

        const g=ctx.createLinearGradient(0,0,W,H);
        g.addColorStop(0,"#050515");
        g.addColorStop(1,"#120020");

        ctx.fillStyle=g;
        ctx.fillRect(0,0,W,H);

        for(const s of menuStars){
            s.y+=.15;

            if(s.y>H){
                s.y=0;
                s.x=Math.random()*W;
            }

            ctx.globalAlpha=.3+.3*Math.sin(performance.now()*.002+s.p);
            ctx.fillStyle="#fff";
            ctx.fillRect(s.x,s.y,s.s,s.s);
        }

        ctx.globalAlpha=1;

        requestAnimationFrame(renderMenuBackground);
    }else{
        setTimeout(renderMenuBackground,100);
    }
}

/* prevent page scrolling */
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

</script>
