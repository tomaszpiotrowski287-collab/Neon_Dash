/* =========================================================

let currentLevel=0;

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioCtx=null;
let musicTimer=null;
let musicStep=0;
let musicNextTime=0;

/*
   Ważne:
   Muzyka składa się z 4 warstw:
   1. melody
   2. bass
   3. chord
   4. drums
*/

function initAudio(){
    if(!audioCtx){
        audioCtx=new(
            window.AudioContext||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function note(freq,duration,type,volume,when){
    if(!audioCtx)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.setValueAtTime(freq,when);

    gain.gain.setValueAtTime(.0001,when);
    gain.gain.exponentialRampToValueAtTime(
        Math.max(.0002,volume),
        when+.008
    );
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        when+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(when);
    osc.stop(when+duration+.03);
}

function kick(when){
    if(!audioCtx||!save.music)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(130,when);
    osc.frequency.exponentialRampToValueAtTime(45,when+.12);

    gain.gain.setValueAtTime(.0001,when);
    gain.gain.exponentialRampToValueAtTime(.13,when+.005);
    gain.gain.exponentialRampToValueAtTime(.0001,when+.13);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(when);
    osc.stop(when+.15);
}

function snare(when){
    if(!audioCtx||!save.music)return;

    const buffer=audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*.09,
        audioCtx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=(Math.random()*2-1)*
            Math.pow(1-i/data.length,3);
    }

    const src=audioCtx.createBufferSource();
    const gain=audioCtx.createGain();

    src.buffer=buffer;

    gain.gain.setValueAtTime(.0001,when);
    gain.gain.exponentialRampToValueAtTime(.055,when+.003);
    gain.gain.exponentialRampToValueAtTime(.0001,when+.09);

    src.connect(gain);
    gain.connect(audioCtx.destination);

    src.start(when);
}

function hat(when){
    if(!audioCtx||!save.music)return;

    const buffer=audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*.035,
        audioCtx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=(Math.random()*2-1)*
            Math.pow(1-i/data.length,4);
    }

    const src=audioCtx.createBufferSource();
    const gain=audioCtx.createGain();

    src.buffer=buffer;
    gain.gain.value=.025;

    src.connect(gain);
    gain.connect(audioCtx.destination);

    src.start(when);
}

function getScale(level){
    const r=level.root;

    return[
        r,
        r*1.12246,
        r*1.25992,
        r*1.33484,
        r*1.49831,
        r*1.68179,
        r*2
    ];
}

function scheduleMusicStep(level,step,time){
    const scale=getScale(level);
    const melodyIndex=level.melody[step%level.melody.length];

    /*
       MELODIA
    */
    let octave=1;

    if(step%16===12||step%16===14){
        octave=2;
    }

    note(
        scale[melodyIndex]*octave,
        .22,
        "square",
        .045,
        time
    );

    /*
       DRUGA WARSTWA — krótsze nuty
    */
    if(step%2===1){
        const second=scale[
            (melodyIndex+2)%scale.length
        ];

        note(
            second,
            .10,
            "triangle",
            .022,
            time+.03
        );
    }

    /*
       BAS
    */
    if(step%4===0){
        note(
            level.root/2,
            .30,
            "sawtooth",
            .055,
            time
        );
    }

    if(step%4===2){
        note(
            level.root*1.5/2,
            .18,
            "sawtooth",
            .035,
            time
        );
    }

    /*
       AKORD / PAD
    */
    if(step%8===0){
        const chord=[
            scale[0],
            scale[2],
            scale[4]
        ];

        chord.forEach((f,i)=>{
            note(
                f,
                .8,
                "sine",
                .012,
                time+i*.01
            );
        });
    }

    /*
       PERKUSJA
    */
    const beat=60/level.bpm;

    if(step%4===0){
        kick(time);
    }

    if(step%4===2){
        snare(time);
    }

    hat(time+beat*.25);

    if(step%2===0){
        hat(time+beat*.5);
    }
}

function startMusic(){

    const level=levels[currentLevel];

    musicStep=0;

    const halfBeat=(60/level.bpm)/2;

    musicNextTime=audioCtx.currentTime+.05;

    function scheduler(){

        if(
            !playing||
            paused||
            dead||
            won||
            !save.music
        ){
            musicTimer=null;
            return;
        }

        while(
            musicNextTime<
            audioCtx.currentTime+.25
        ){
            scheduleMusicStep(
                level,
                musicStep,
                musicNextTime
            );

            musicStep++;

            musicNextTime+=halfBeat;
        }

        musicTimer=setTimeout(
            scheduler,
            35
        );
    }

    scheduler();
}

function stopMusic(){
    if(musicTimer!==null){
        clearTimeout(musicTimer);
        musicTimer=null;
    }
}

/* =========================================================

========================================================= */

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function overlap(a,b){
    return(
        a.x<b.x+b.w&&
        a.x+a.w>b.x&&
        a.y<b.y+b.h&&
        a.y+a.h>b.y
    );
}

/* =========================================================
   CREATE LEVEL
========================================================= */

function createLevel(){

    obstacles=[];
    coins=[];
    pads=[];
    portals=[];
    particles=[];
    trail=[];

    const level=levels[currentLevel];

    const groundY=H*.76;

    player.x=180;
    player.y=groundY-player.size;
    player.vy=0;
    player.grounded=true;
    player.rotation=0;
    player.blink=0;

    distance=0;
    collected=0;
    cameraX=0;

    let x=520;

    while(x<level.length-350){

        const r=Math.random();

        if(r<.48){

            obstacles.push({
                type:"spike",
                x:x,
                y:groundY-48,
                w:45,
                h:48
            });

            if(Math.random()<.3){

                obstacles.push({
                    type:"spike",
                    x:x+46,
                    y:groundY-48,
                    w:45,
                    h:48
                });

                x+=40;
            }

            x+=rand(260,470);

        }else if(r<.68){

            obstacles.push({
                type:"saw",
                x:x,
                y:groundY-rand(100,180),
                r:27
            });

            x+=rand(300,500);

        }else if(r<.84){

            obstacles.push({
                type:"gap",
                x:x,
                y:groundY,
                w:rand(100,185),
                h:300
            });

            x+=rand(350,550);

        }else{

            pads.push({
                x:x,
                y:groundY-18,
                w:55,
                h:18
            });

            x+=rand(300,450);
        }

        if(Math.random()<.7){

            coins.push({
                x:x-rand(50,140),
                y:groundY-rand(100,190),
                r:12,
                collected:false,
                spin:Math.random()*6
            });
        }
    }

    while(coins.length<3){

        coins.push({
            x:1300+coins.length*1800,
            y:groundY-150,
            r:12,
            collected:false,
            spin:0
        });
    }

    coins=coins.slice(0,3);

    for(let i=0;i<3;i++){

        portals.push({
            x:1600+i*(level.length/4),
            y:groundY-100-rand(0,140),
            type:i%2===0
                ?"speed"
                :"gravity",
            used:false
        });
    }

    stars=[];

    for(let i=0;i<150;i++){

        stars.push({
            x:Math.random()*level.length,
            y:Math.random()*H*.73,
            s:rand(1,3),
            p:Math.random()*6
        });
    }
}

/* =========================================================
   LOOP
========================================================= */

function stopLoop(){

    if(animationFrame!==null){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame=null;
    }
}

function startLoop(){

    stopLoop();

    animationFrame=
        requestAnimationFrame(loop);
}

function loop(){

    if(
        !playing||
        paused||
        dead||
        won
    ){
        animationFrame=null;
        return;
    }

    update();
    draw();

    animationFrame=
        requestAnimationFrame(loop);
}

/* =========================================================
   UPDATE
========================================================= */

function update(){

    const level=levels[currentLevel];

    distance+=level.speed;

    const groundY=H*.76;

    player.vy+=.65;
    player.y+=player.vy;

    player.grounded=false;

    if(
        player.y+player.size>=groundY
    ){
        player.y=
            groundY-player.size;

        player.vy=0;
        player.grounded=true;
    }

    /* GAP */

    for(const g of obstacles){

        if(g.type!=="gap")continue;

        if(
            player.x+player.size>g.x-distance+180&&
            player.x<g.x+g.w-distance+180&&
            player.y+player.size>=groundY-5
        ){
            die();
            return;
        }
    }

    /* SPIKES */

    for(const o of obstacles){

        if(o.type!=="spike")continue;

        const x=
            o.x-distance+180;

        const box={
            x:x+7,
            y:o.y,
            w:o.w-14,
            h:o.h
        };

        const pbox={
            x:player.x+6,
            y:player.y+5,
            w:player.size-12,
            h:player.size-8
        };

        if(overlap(pbox,box)){
            die();
            return;
        }
    }

    /* SAWS */

    for(const o of obstacles){

        if(o.type!=="saw")continue;

        const x=
            o.x-distance+180;

        const dx=
            player.x+player.size/2-x;

        const dy=
            player.y+player.size/2-o.y;

        if(
            Math.sqrt(dx*dx+dy*dy)
            <
            o.r+player.size*.35
        ){
            die();
            return;
        }
    }

    /* PADS */

    for(const p of pads){

        const x=
            p.x-distance+180;

        if(
            player.x+player.size>x&&
            player.x<x+p.w&&
            player.y+player.size>=groundY-25&&
            player.grounded
        ){

            player.vy=-13;
            player.grounded=false;

            spawnParticles(
                player.x+player.size/2,
                player.y+player.size,
                level.color,
                10
            );
        }
    }

    /* PORTALS */

    for(const p of portals){

        const x=
            p.x-distance+180;

        if(
            !p.used&&
            Math.abs(
                player.x-x
            )<45
        ){

            p.used=true;

            portalSound();

            spawnParticles(
                x,
                p.y,
                p.type==="speed"
                    ?"#00ff88"
                    :"#ff35bb",
                22
            );
        }
    }

    /* COINS */

    for(const c of coins){

        if(c.collected)continue;

        const x=
            c.x-distance+180;

        const dx=
            player.x+player.size/2-x;

        const dy=
            player.y+player.size/2-c.y;

        if(
            Math.sqrt(dx*dx+dy*dy)<32
        ){

            c.collected=true;

            collected++;
            save.coins++;

            coinSound();

            spawnParticles(
                x,
                c.y,
                "#ffe65c",
                22
            );

            saveGame();
            checkAchievements();
        }

        c.spin+=.1;
    }

    /* PLAYER */

    if(player.grounded){
        player.rotation+=.025;
    }else{
        player.rotation+=.09;
    }

    player.blink--;

    if(
        player.blink<0&&
        Math.random()<.008
    ){
        player.blink=10;
    }

    /* TRAIL */

    if(save.fx){

        trail.push({
            x:player.x+player.size/2,
            y:player.y+player.size/2,
            a:1
        });

        if(trail.length>18){
            trail.shift();
        }

        for(const t of trail){
            t.a-=.045;
        }

        trail=trail.filter(
            t=>t.a>0
        );
    }

    /* PARTICLES */

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.g;

        p.life--;
        p.rot+=p.rv;
    }

    particles=
        particles.filter(
            p=>p.life>0
        );

    shake*=.84;

    updateHUD();

    if(
        distance>=level.length
    ){
        win();
    }
}

function jump(){

/* =========================================================
   DIE
========================================================= */

function die(){

    if(dead||won)return;

    dead=true;
    playing=false;

    stopLoop();
    stopMusic();

    levelDeaths++;
    attempts++;

    deathSound();

    shake=18;

    spawnParticles(
        player.x+player.size/2,
        player.y+player.size/2,
        "#ff304f",
        45
    );

    document.getElementById("deathProgress")
        .textContent=
        Math.floor(
            distance/
            levels[currentLevel].length*
            100
        )+"%";

    document.getElementById("deathCoins")
        .textContent=
        collected+"/3";

    document.getElementById("deathPanel")
        .classList.remove("hidden");

    checkAchievements();
}

/* =========================================================
   WIN
========================================================= */

function win(){

    if(won||dead)return;

    won=true;
    playing=false;

    stopLoop();
    stopMusic();

    if(
        !save.completed.includes(
            currentLevel
        )
    ){
        save.completed.push(
            currentLevel
        );
    }

    const key=String(currentLevel);

    save.collectedCoins[key]=Math.max(
        save.collectedCoins[key]||0,
        collected
    );

    saveGame();

    winSound();

    checkAchievements();

    startWinAnimation();
}

/* =========================================================
   VICTORY ANIMATION
========================================================= */

function stopWinAnimation(){

    winFX.active=false;

    if(winFrame!==null){

        cancelAnimationFrame(
            winFrame
        );

        winFrame=null;
    }
}

function startWinAnimation(){

    stopWinAnimation();

    document.getElementById("winPanel")
        .classList.add("hidden");

    winFX.active=true;
    winFX.time=0;

    winFX.bursts=[];
    winFX.rings=[];
    winFX.confetti=[];

    for(let i=0;i<7;i++){

        spawnWinBurst(
            W/2+rand(-150,150),
            H/2+rand(-100,100),
            levels[currentLevel].color,
            40
        );
    }

    winFrame=
        requestAnimationFrame(winLoop);
}

function winLoop(){

    if(!winFX.active){
        winFrame=null;
        return;
    }

    updateWinFX();
    draw();
    drawVictory();

    if(
        winFX.time>=
        winFX.duration
    ){

        finishWinAnimation();
        return;
    }

    winFrame=
        requestAnimationFrame(winLoop);
}

function updateWinFX(){

    winFX.time++;

    const t=winFX.time;

    if(
        t%24===0&&
        t<180
    ){

        spawnWinBurst(
            W/2+rand(-250,250),
            H/2+rand(-160,160),
            levels[currentLevel].color,
            35
        );
    }

    if(
        t===35||
        t===75||
        t===115
    ){

        winFX.rings.push({
            x:W/2,
            y:H/2,
            r:10,
            a:1
        });
    }

    for(const r of winFX.rings){

        r.r+=8;
        r.a-=.025;
    }

    winFX.rings=
        winFX.rings.filter(
            r=>r.a>0
        );

    for(const b of winFX.bursts){

        b.x+=b.vx;
        b.y+=b.vy;

        b.vx*=.985;
        b.vy*=.985;
        b.vy+=.025;

        b.life--;
        b.rot+=b.rv;
    }

    winFX.bursts=
        winFX.bursts.filter(
            b=>b.life>0
        );

    for(const c of winFX.confetti){

        c.x+=c.vx;
        c.y+=c.vy;
        c.vy+=.08;
        c.rot+=c.rv;
        c.life--;
    }

    winFX.confetti=
        winFX.confetti.filter(
            c=>c.life>0
        );

    shake*=.91;
}

function spawnWinBurst(
    x,y,color,count
){

    for(let i=0;i<count;i++){

        const a=
            Math.random()*Math.PI*2;

        const s=rand(2,8);

        winFX.bursts.push({
            x:x,
            y:y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            size:rand(3,9),
            life:rand(45,120),
            color:color,
            rot:Math.random()*6,
            rv:rand(-.15,.15)
        });
    }

    for(
        let i=0;
        i<Math.floor(count/2);
        i++
    ){

        winFX.confetti.push({
            x:x,
            y:y,
            vx:rand(-7,7),
            vy:rand(-10,-2),
            size:rand(5,12),
            rot:rand(0,6),
            rv:rand(-.15,.15),
            life:rand(70,160),
            color:color
        });
    }
}

function finishWinAnimation(){

    winFX.active=false;
    winFrame=null;

    document.getElementById("winLevel")
        .textContent=
        levels[currentLevel].name;

    document.getElementById("winCoins")
        .textContent=collected;

    document.getElementById("winAttempts")
        .textContent=attempts;

    document.getElementById("winPanel")
        .classList.remove("hidden");

    updateMenu();
}

/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        !playing||
        dead||
        won
    )return;

    paused=true;

    stopLoop();
    stopMusic();

    document.getElementById("pausePanel")
        .classList.remove("hidden");
}

function resumeGame(){

    if(!paused)return;

    paused=false;

    document.getElementById("pausePanel")
        .classList.add("hidden");

    startMusic();
    startLoop();
}

function restartLevel(){

    stopLoop();
    stopMusic();
    stopWinAnimation();

    document.getElementById("pausePanel")
        .classList.add("hidden");

    document.getElementById("deathPanel")
        .classList.add("hidden");

    document.getElementById("winPanel")
        .classList.add("hidden");

    dead=false;
    won=false;
    paused=false;

    attempts++;

    createLevel();

    playing=true;

    startMusic();
    startLoop();
}

function nextLevel(){

    stopWinAnimation();

    if(
        currentLevel<
        levels.length-1
    ){

        startLevel(
            currentLevel+1
        );

    }else{

        toast(
            "🏆 Ukończyłeś wszystkie poziomy!"
        );

        backHome();
    }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("coinHUD")
        .textContent=
        collected+"/3";

    document.getElementById("attemptHUD")
        .textContent=attempts;

    const percent=clamp(
        distance/
        levels[currentLevel].length*
        100,
        0,
        100
    );

    const bar=
        document.getElementById("progress");

    bar.style.width=
        percent+"%";

    bar.style.background=
        levels[currentLevel].color;

    bar.style.boxShadow=
        `0 0 15px ${levels[currentLevel].color}`;
}

/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(
    x,y,color,count
){

    if(!save.fx)return;

    for(let i=0;i<count;i++){

        const a=
            Math.random()*Math.PI*2;

        const s=rand(1,5);

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            g:.08,
            size:rand(2,6),
            life:rand(20,55),
            color:color,
            rot:Math.random()*6,
            rv:rand(-.15,.15)
        });
    }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

    const level=
        levels[currentLevel];

    ctx.save();

    let sx=0;
    let sy=0;

    if(shake>0){

        sx=rand(-shake,shake);
        sy=rand(-shake,shake);
    }

    ctx.translate(sx,sy);

    /* BACKGROUND */

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#050515"
    );

    gradient.addColorStop(
        1,
        "#100018"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        -50,
        -50,
        W+100,
        H+100
    );

    /* STARS */

    for(const s of stars){

        const x=
            s.x-distance*.12;

        if(
            x<-20||
            x>W+20
        )continue;

        ctx.globalAlpha=
            .3+
            .3*
            Math.sin(
                performance.now()*.002+
                s.p
            );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x,
            s.y,
            s.s,
            s.s
        );
    }

    ctx.globalAlpha=1;

    /* GRID */

    ctx.strokeStyle=
        "rgba(0,255,255,.08)";

    ctx.lineWidth=1;

    const grid=60;

    const offset=
        -(distance*.35%grid);

    for(
        let x=offset;
        x<W;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(
        let y=H*.76;
        y>0;
        y-=grid
    ){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /* GROUND */

    ctx.fillStyle=
        "rgba(0,20,35,.96)";

    ctx.fillRect(
        0,
        H*.76,
        W,
        H*.24
    );

    ctx.strokeStyle=
        level.color;

    ctx.shadowColor=
        level.color;

    ctx.shadowBlur=14;
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.76
    );

    ctx.lineTo(
        W,
        H*.76
    );

    ctx.stroke();

    ctx.shadowBlur=0;

    /* OBSTACLES */

    for(const o of obstacles){

        if(o.type==="spike"){

            const x=
                o.x-distance+180;

            if(
                x<-100||
                x>W+100
            )continue;

            ctx.fillStyle=
                "#ff3055";

            ctx.shadowColor=
                "#ff3055";

            ctx.shadowBlur=15;

            ctx.beginPath();

            ctx.moveTo(
                x,
                H*.76
            );

            ctx.lineTo(
                x+o.w/2,
                H*.76-o.h
            );

            ctx.lineTo(
                x+o.w,
                H*.76
            );

            ctx.closePath();

            ctx.fill();

            ctx.shadowBlur=0;
        }

        if(o.type==="saw"){

            const x=
                o.x-distance+180;

            ctx.save();

            ctx.translate(
                x,
                o.y
            );

            ctx.rotate(
                performance.now()*.004
            );

            ctx.fillStyle="#e8e8ff";

            ctx.shadowColor=
                level.color;

            ctx.shadowBlur=18;

            ctx.beginPath();

            for(
                let i=0;
                i<20;
                i++
            ){

                const a=
                    i*Math.PI*2/20;

                const r=
                    i%2===0
                    ?o.r
                    :o.r*.65;

                ctx.lineTo(
                    Math.cos(a)*r,
                    Math.sin(a)*r
                );
            }

            ctx.closePath();
            ctx.fill();

            ctx.fillStyle="#222";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                o.r*.25,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.restore();
        }
    }

    /* PADS */

    for(const p of pads){

        const x=
            p.x-distance+180;

        ctx.fillStyle="#00ff88";
        ctx.shadowColor="#00ff88";
        ctx.shadowBlur=15;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.shadowBlur=0;
    }

    /* PORTALS */

    for(const p of portals){

        const x=
            p.x-distance+180;

        const color=
            p.type==="speed"
            ?"#00ff88"
            :"#ff35bb";

        ctx.strokeStyle=color;
        ctx.lineWidth=5;
        ctx.shadowColor=color;
        ctx.shadowBlur=20;

        ctx.beginPath();

        ctx.arc(
            x,
            p.y,
            32,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.shadowBlur=0;
    }

    /* COINS */

    for(const c of coins){

        if(c.collected)continue;

        const x=
            c.x-distance+180;

        ctx.save();

        ctx.translate(
            x,
            c.y
        );

        ctx.rotate(c.spin);

        ctx.fillStyle="#ffe65c";
        ctx.shadowColor="#ffe65c";
        ctx.shadowBlur=20;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            c.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#fff4a0";
        ctx.font="bold 13px Arial";
        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(
            "★",
            0,
            1
        );

        ctx.restore();
    }

    /* TRAIL */

    if(save.fx){

        for(const t of trail){

            ctx.globalAlpha=
                t.a*.35;

            ctx.fillStyle=
                level.color;

            ctx.fillRect(
                t.x-8,
                t.y-8,
                16,
                16
            );
        }

        ctx.globalAlpha=1;
    }

    /* PARTICLES */

    for(const p of particles){

        ctx.save();

        ctx.globalAlpha=
            clamp(
                p.life/50,
                0,
                1
            );

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(p.rot);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size
        );

        ctx.restore();
    }

    drawPlayer();

    ctx.restore();
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const skin=
        skins[save.selectedSkin]||
        skins[0];

    const level=
        levels[currentLevel];

    const s=player.size;

    ctx.save();

    ctx.translate(
        player.x+s/2,
        player.y+s/2
    );

    ctx.rotate(
        player.grounded
        ?Math.sin(
            performance.now()*.012
        )*.04
        :player.rotation
    );

    ctx.fillStyle=
        skin.color;

    ctx.shadowColor=
        skin.color;

    ctx.shadowBlur=25;

    ctx.fillRect(
        -s/2,
        -s/2,
        s,
        s
    );

    ctx.shadowBlur=0;

    ctx.strokeStyle=
        level.color;

    ctx.lineWidth=3;

    ctx.strokeRect(
        -s/2,
        -s/2,
        s,
        s
    );

    /* OCZY */

    ctx.fillStyle="#111";

    if(player.blink>0){

        ctx.fillRect(
            -12,-7,7,2
        );

        ctx.fillRect(
            5,-7,7,2
        );

    }else{

        ctx.fillRect(
            -12,-9,7,9
        );

        ctx.fillRect(
            5,-9,7,9
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            -10,-8,2,3
        );

        ctx.fillRect(
            7,-8,2,3
        );
    }

    /* UŚMIECH */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        8,
        0,
        Math.PI
    );

    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   VICTORY DRAW
========================================================= */

function drawVictory(){

    const level=
        levels[currentLevel];

    const t=winFX.time;

    const fade=
        Math.min(
            clamp(t/25,0,1),
            clamp(
                (winFX.duration-t)/45,
                0,
                1
            )
        );

    ctx.save();

    /* FLASH */

    if(t<18){

        ctx.globalAlpha=
            ((18-t)/18)*.7;

        ctx.fillStyle="#fff";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }

    /* RINGS */

    for(const r of winFX.rings){

        ctx.globalAlpha=
            r.a*.7;

        ctx.strokeStyle=
            level.color;

        ctx.shadowColor=
            level.color;

        ctx.shadowBlur=25;

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            r.r,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* BURSTS */

    for(const b of winFX.bursts){

        ctx.save();

        ctx.globalAlpha=
            clamp(
                b.life/70,
                0,
                1
            );

        ctx.translate(
            b.x,
            b.y
        );

        ctx.rotate(b.rot);

        ctx.fillStyle=b.color;

        ctx.shadowColor=b.color;
        ctx.shadowBlur=15;

        ctx.fillRect(
            -b.size/2,
            -b.size/2,
            b.size,
            b.size
        );

        ctx.restore();
    }

    /* CONFETTI */

    for(const c of winFX.confetti){

        ctx.save();

        ctx.globalAlpha=
            clamp(
                c.life/70,
                0,
                1
            );

        ctx.translate(
            c.x,
            c.y
        );

        ctx.rotate(c.rot);

        ctx.fillStyle=c.color;

        ctx.fillRect(
            -c.size/2,
            -c.size/2,
            c.size,
            c.size*.55
        );

        ctx.restore();
    }

    /* TEXT */

    const scale=
        clamp(t/35,0,1);

    ctx.save();

    ctx.translate(
        W/2,
        H*.40
    );

    ctx.scale(
        scale,
        scale
    );

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font=
        `1000 ${Math.min(76,W*.105)}px Arial`;

    ctx.globalAlpha=fade;

    ctx.fillStyle="#fff";

    ctx.shadowColor=
        level.color;

    ctx.shadowBlur=35;

    ctx.fillText(
        "LEVEL COMPLETE!",
        0,
        0
    );

    ctx.shadowBlur=0;

    ctx.font=
        `1000 ${Math.min(120,W*.16)}px Arial`;

    ctx.fillStyle=
        level.color;

    ctx.fillText(
        "100%",
        0,
        105
    );

    ctx.restore();

    /* COINS */

    for(let i=0;i<3;i++){

        const appear=
            55+i*22;

        if(t<appear)continue;

        const a=
            clamp(
                (t-appear)/12,
                0,
                1
            );

        const x=
            W/2+(i-1)*75;

        const y=
            H*.67;

        ctx.globalAlpha=a;

        ctx.fillStyle=
            i<collected
            ?" #ffe65c"
            :"#333";

        ctx.strokeStyle=
            i<collected
            ?" #fff2a0"
            :"#666";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();
        ctx.stroke();

        if(i<collected){

            ctx.fillStyle="#fff";

            ctx.font="bold 22px Arial";

            ctx.textAlign="center";
            ctx.textBaseline="middle";

            ctx.fillText(
                "★",
                x,
                y
            );
        }
    }

    ctx.restore();
}

/* =========================================================
   ACHIEVEMENTS
========================================================= */

function unlockAchievement(id){

    if(
        unlockedAchievements.includes(id)
    )return;

    unlockedAchievements.push(id);

    saveGame();

    const a=
        achievements.find(
            x=>x[0]===id
        );

    if(a){
        toast(
            "★ Osiągnięcie: "+
            a[1]
        );
    }
}

function checkAchievements(){

    const done=
        save.completed.length;

    if(done>=1)
        unlockAchievement("first");

    if(done>=3)
        unlockAchievement("three");

    if(done>=6)
        unlockAchievement("six");

    if(done>=levels.length)
        unlockAchievement("all");

    if(save.coins>=10)
        unlockAchievement("coins10");

    if(save.coins>=25)
        unlockAchievement("coins25");

    if(won&&levelDeaths===0)
        unlockAchievement("perfect");

    if(won&&attempts>=5)
        unlockAchievement("survivor");
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(text){

    const el=
        document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}

   MENU BACKGROUND

let menuStars=[];

for(let i=0;i<150;i++){

    menuStars.push({

function menuBackground(){

    if(
        !document
        .getElementById("menu")
        .classList
        .contains("hidden")
    ){

        ctx.clearRect(
            0,0,W,H
        );

        const g=
            ctx.createLinearGradient(
                0,0,W,H
            );

        g.addColorStop(
            0,
            "#050515"
        );

        g.addColorStop(
            1,
            "#120020"
        );

        ctx.fillStyle=g;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        for(const s of menuStars){

            s.y+=.15;

            if(s.y>H){

            }

            ctx.globalAlpha=

                );

            ctx.fillStyle="#fff";

            ctx.fillRect(
                s.x,
                s.y,
                s.s,
                s.s
            );
        }

        ctx.globalAlpha=1;
    }

    requestAnimationFrame(
