<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resizeCanvas(){

    W =
        Math.max(
            320,
            window.innerWidth
        );

    H =
        Math.max(
            240,
            window.innerHeight
        );

    canvas.width=W;
    canvas.height=H;

    if(running)
        draw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY =
    "neon_dash_save_final_v3";


const defaultSave = {

    unlocked:1,

    completed:[],

    coins:0,

    selectedSkin:0,

    ownedSkins:[0],

    achievements:[],

    music:true,

    sound:true
};


let save;


function loadSave(){

    try{

        const raw =
            localStorage.getItem(
                SAVE_KEY
            );

        if(!raw){

            save =
                JSON.parse(
                    JSON.stringify(
                        defaultSave
                    )
                );

            return;
        }


        const data =
            JSON.parse(raw);


        save={
            ...defaultSave,
            ...data
        };


        if(!Array.isArray(save.completed))
            save.completed=[];

        if(!Array.isArray(save.ownedSkins))
            save.ownedSkins=[0];

        if(!Array.isArray(save.achievements))
            save.achievements=[];


        if(
            !save.ownedSkins.includes(0)
        ){

            save.ownedSkins.unshift(0);
        }


        save.unlocked =
            Math.max(
                1,
                Math.min(
                    18,
                    Number(save.unlocked)||1
                )
            );

    }catch(e){

        save =
            JSON.parse(
                JSON.stringify(
                    defaultSave
                )
            );
    }
}


function saveGame(){

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(save)
        );

    }catch(e){}
}


loadSave();


/* =========================================================
   POZIOMY
========================================================= */

const levelThemes=[

    ["Stereo Start","#00eaff"],
    ["Blue Rush","#168cff"],
    ["Neon City","#b400ff"],
    ["Red Line","#ff3355"],
    ["Electric","#ffe600"],
    ["Purple Sky","#8d45ff"],
    ["Dark Pulse","#00ff91"],
    ["Hyper Drive","#ff7b00"],
    ["Gravity","#ff00c8"],
    ["Flash","#00ffea"],
    ["Inferno","#ff4422"],
    ["Crystal","#62a0ff"],
    ["Voltage","#aaff00"],
    ["Cyber","#00ff66"],
    ["Galaxy","#a855ff"],
    ["Final Rush","#00eaff"],
    ["Neon Storm","#ff4cff"],
    ["Ultimate Run","#00ffd5"]

];


const levels=[];


for(
    let i=0;
    i<18;
    i++
){

    const length =
        3900+i*280;

    const speed =
        5+i*.22;

    const obstacles=[];

    const coins=[];

    let x=650;

    let pattern=i%4;


    while(
        x<length-250
    ){

        let width;


        if(pattern===0)
            width=55;

        else if(pattern===1)
            width=75;

        else if(pattern===2)
            width=100;

        else{

            width =
                (
                    Math.floor(x/250)%3===0
                )
                ?100
                :55;
        }


        obstacles.push([
            Math.round(x),
            0,
            width,
            50
        ]);


        coins.push(
            Math.round(x-110)
        );


        x +=
            250+
            (
                Math.floor(x/100)%3
            )*45;


        pattern =
            (pattern+1)%4;
    }


    levels.push({

        name:
            levelThemes[i][0],

        color:
            levelThemes[i][1],

        speed,

        length,

        obstacles,

        coins

    });
}

    stopMusic();

        .add("hidden");


    hidePanels();


    document
        .getElementById("levelsPanel")
        .classList
        .remove("hidden");


    const grid =
        document.getElementById(
            "levelGrid"
        );


    grid.innerHTML="";


    levels.forEach(
        (l,i)=>{

            const button =
                document.createElement(
                    "button"
                );


            const unlocked =
                i<save.unlocked;


            const completed =
                save.completed.includes(i);


            button.className =
                "levelButton "+
                (
                    unlocked
                    ?"unlocked "
                    :"locked "
                )+
                (
                    completed
                    ?"completed"
                    :""
                );


            if(unlocked){

                button.textContent =
                    `${i+1}\n${l.name}`;


                button.onclick=()=>{
                    startGame(i);
                };

                button.textContent="🔒";

function renderShop(){

    document
        .getElementById("coinAmount")
        .textContent=
            save.coins;


    const grid =
        document.getElementById(
            "skinGrid"
        );


    grid.innerHTML="";


    skins.forEach(
        (skin,i)=>{

            const div =
                document.createElement(
                    "div"
                );


            const owned =
                save.ownedSkins
                    .includes(i);


            const selected =
                save.selectedSkin===i;


            div.className =
                "skin"+
                (
                    selected
                    ?" selected"
                    :""
                );


            div.innerHTML=`

                <div
                    class="skinPreview"
                    style="
                        background:${skin.color};
                        box-shadow:0 0 15px ${skin.color};
                    ">
                </div>

                <div style="margin-top:10px">
                    ${skin.name}
                </div>

                <div
                    style="
                        margin-top:6px;
                        color:#aaa;
                    ">
                    ${
                        owned
                        ?"POSIADANY"
                        :skin.price+" monet"
                    }
                </div>

            `;


            div.onclick=()=>{

                if(owned){

                    save.selectedSkin=i;

                    saveGame();

                    renderShop();

                    return;
                }


                if(
                    save.coins>=
                    skin.price
                ){

                    save.coins -=
                        skin.price;

                    save.ownedSkins
                        .push(i);

                    save.selectedSkin=i;

                    saveGame();

                    renderShop();


                    beep(
                        900,
                        .1,
                        "triangle",
                        .04
                    );
                }
            };


            grid.appendChild(div);

        }
    );
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

let musicTimer=null;

let musicStep=0;


function getAudio(){

    try{

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AC)
            return null;


        if(!audioCtx)
            audioCtx=new AC();


        if(
            audioCtx.state===
            "suspended"
        ){

            audioCtx
                .resume()
                .catch(()=>{});
        }


        return audioCtx;

    }catch(e){

        return null;
    }
}


function beep(
    frequency=440,
    duration=.08,
    type="square",
    volume=.035
){

    if(!save.sound)
        return;


    const audio =
        getAudio();


    if(!audio)
        return;


    try{

        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type=
            type;


        oscillator.frequency.value=
            frequency;


        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime+
            duration
        );


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();

        oscillator.stop(
            audio.currentTime+
            duration
        );

    }catch(e){}
}


function startMusic(){

    if(!save.music)
        return;


    if(musicTimer)
        return;


    const notes=[
        220,
        277,
        330,
        277,
        247,
        330,
        370,
        330
    ];


    musicTimer =
        setInterval(
            ()=>{

                if(
                    !running ||
                    paused
                )
                    return;


                beep(
                    notes[
                        musicStep%
                        notes.length
                    ],
                    .06,
                    "triangle",
                    .015
                );


                musicStep++;

            },
            180
        );
}


function stopMusic(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer=null;
    }
}


function toggleMusic(){

    save.music=
        !save.music;

    saveGame();


    if(save.music)
        startMusic();

    else
        stopMusic();


    updateSettingsUI();
}


function toggleSound(){

    save.sound=
        !save.sound;

    saveGame();

    updateSettingsUI();
}


function toggleFullscreen(){

    try{

        if(
            !document.fullscreenElement
        ){

            document
                .documentElement
                .requestFullscreen?.();

        }else{

            document
                .exitFullscreen?.();
        }

    }catch(e){}
}

}

            groundY()-42,

        w:42,

/* =========================================================
   TWORZENIE POZIOMU
========================================================= */

function createLevel(){

/* =========================================================
   START
========================================================= */

function startGame(index=null){

    clearTimeout(
        deathTimer
    );


    loopToken++;


    if(index!==null){

        if(
            index<0 ||
            index>=levels.length
        )
            return;


        if(
            index>=save.unlocked
        )
            return;


        levelIndex=index;
    }


    hidePanels();


    document
        .getElementById("menu")
        .classList
        .add("hidden");


    document
        .getElementById("game")
        .classList
        .remove("hidden");


    createLevel();


    running=true;

    paused=false;


    leftPressed=false;

    rightPressed=false;


    lastTime =
        performance.now();


    draw();


    startMusic();


    const token =
        loopToken;


    requestAnimationFrame(
        t=>{
            gameLoop(
                t,
                token
            );
        }
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    time,
    token
){

    if(
        token!==loopToken
    )
        return;


    if(!running)
        return;


    if(paused){

        lastTime=time;


        requestAnimationFrame(
            t=>{
                gameLoop(
                    t,
                    token
                );
            }
        );


        return;
    }


    let dt =
        (
            time-lastTime
        )/16.6667;


    if(
        !Number.isFinite(dt)
    )
        dt=1;


    dt =
        Math.max(
            .25,
            Math.min(
                2,
                dt
            )
        );


    lastTime=time;


    update(dt);

    draw();


    if(
        running &&
        token===loopToken
    ){

        requestAnimationFrame(
            t=>{
                gameLoop(
                    t,
                    token
                );
            }
        );
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !player ||
        !level
    )
        return;


    player.animationTime+=dt;

    player.blinkTime+=dt;


    /* MRUGANIE */

    if(
        player.blinkTime>180
    ){

        player.blinkTime=0;

        player.blink=true;


        setTimeout(
            ()=>{

                if(player)
                    player.blink=false;

            },
            110
        );
    }


    /* RUCH */

    let movement =
        level.speed;


    if(leftPressed)
        movement-=2;


    if(rightPressed)
        movement+=2;


    movement =
        Math.max(
            2,
            movement
        );


    player.x +=
        movement*dt;


    /* GRAWITACJA */

    player.vy +=
        .72*dt;


    player.y +=
        player.vy*dt;


    const floorY =
        groundY()-
        player.h;


    if(
        player.y>=floorY
    ){

        player.y=floorY;

        player.vy=0;

        player.grounded=true;

        player.rotation*=.78;

        player.jumpSquash +=
            (
                1-
                player.jumpSquash
            )*.25;

    }else{

        player.grounded=false;

        player.rotation +=
            .055*dt;

        player.jumpSquash +=
            (
                1-
                player.jumpSquash
            )*.12;
    }


    /* KOLIZJE */

    for(
        const obstacle
        of level.obstacles
    ){

        const ox =
            obstacle[0];

        const ow =
            obstacle[2];

        const oh =
            obstacle[3];

        const oy =
            groundY()-oh;


        const hit =

            player.x+
            player.w-6>
            ox &&

            player.x+6<
            ox+ow &&

            player.y+
            player.h-5>
            oy &&

            player.y+5<
            groundY();


        if(hit){

            die();

            return;
        }
    }


    /* MONETY */

    level.coins.forEach(
        (cx,index)=>{

            if(
                collectedCoins
                    .has(index)
            )
                return;


            const cy =
                groundY()-95;


            const dx =
                player.x+
                player.w/2-
                cx;


            const dy =
                player.y+
                player.h/2-
                cy;


            if(
                Math.hypot(
                    dx,
                    dy
                )<35
            ){

                collectedCoins
                    .add(index);


                save.coins++;


                saveGame();


                beep(
                    880,
                    .1,
                    "sine",
                    .05
                );


                createCoinParticles(
                    cx,
                    cy
                );


                checkAchievements();
            }
        }
    );


    /* KAMERA */

    const target =
        player.x-135;


    if(
        target>cameraX
    ){

        cameraX +=
            (
                target-cameraX
            )*.12*dt;
    }


    cameraX =
        Math.max(
            0,
            cameraX
        );


    /* META */

    if(
        player.x>=
        level.length
    ){

        winLevel();

        return;
    }


    /* PARTICLES */

    for(
        const p
        of particles
    ){

        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;

        p.vy +=
            .12*dt;

        p.life -=
            dt;
    }


    particles =
        particles.filter(
            p=>p.life>0
        );


    updateProgress();
}


/* =========================================================
   SKOK
========================================================= */

function jump(){

    if(
        !running ||
        paused ||
        !player
    )
        return;


    if(player.grounded){

        player.vy=-13;

        player.grounded=false;

        player.jumpSquash=.82;


        beep(
            520,
            .08,
            "square",
            .035
        );


        createJumpParticles();
    }
}


/* =========================================================
   ŚMIERĆ
========================================================= */

function die(){

    if(!running)
        return;


    running=false;

    loopToken++;


    stopMusic();


    beep(
        110,
        .2,
        "sawtooth",
        .045
    );


    if(navigator.vibrate){

        try{
            navigator.vibrate(100);
        }catch(e){}
    }


    deathTimer =
        setTimeout(
            ()=>{

                const again =
                    confirm(
                        "Ups! Rozbiłeś się.\n\nZagrać jeszcze raz?"
                    );


                if(again)
                    startGame(
                        levelIndex
                    );

                else
                    backHome();

            },
            250
        );
}


/* =========================================================
   WYGRANA
========================================================= */

function winLevel(){

    if(!running)
        return;


    running=false;

    loopToken++;


    stopMusic();


    beep(
        660,
        .12,
        "triangle",
        .05
    );


    setTimeout(
        ()=>{
            beep(
                880,
                .12,
                "triangle",
                .05
            );
        },
        120
    );


    setTimeout(
        ()=>{
            beep(
                1100,
                .18,
                "triangle",
                .05
            );
        },
        240
    );


    if(
        !save.completed
            .includes(levelIndex)
    ){

        save.completed.push(
            levelIndex
        );


        save.coins+=5;


        if(
            levelIndex<
            levels.length-1
        ){

            save.unlocked =
                Math.max(
                    save.unlocked,
                    levelIndex+2
                );
        }


        saveGame();
    }


    checkAchievements();

    createConfetti();


    document
        .getElementById(
            "winPanel"
        )
        .classList
        .remove("hidden");


    const next =
        document.getElementById(
            "nextButton"
        );


    next.style.display =
        levelIndex<
        levels.length-1
        ?"block"
        :"none";


    const token =
        loopToken;


    const startTime =
        performance.now();


    function celebration(time){

        if(
            token!==loopToken
        )
            return;


        updateConfetti();

        draw();


        if(
            time-startTime<
            1600
        ){

            requestAnimationFrame(
                celebration
            );
        }
    }


    requestAnimationFrame(
        celebration
    );
}


function nextLevel(){

    if(
        levelIndex>=
        levels.length-1
    ){

        backHome();

        return;
    }


    startGame(
        levelIndex+1
    );
}


function restartLevel(){

    startGame(
        levelIndex
    );
}


/* =========================================================
   POSTĘP
========================================================= */

function updateProgress(){

    if(
        !level ||
        !player
    )
        return;


    const percent =
        Math.max(
            0,
            Math.min(
                100,
                player.x/
                level.length*
                100
            )
        );


    document
        .getElementById(
            "progressText"
        )
        .textContent =
            Math.floor(
                percent
            )+"%";


    document
        .getElementById(
            "levelProgressBar"
        )
        .style.width =
            percent+"%";
}


/* =========================================================
   PARTICLES
========================================================= */

function createJumpParticles(){

    for(
        let i=0;
        i<7;
        i++
    ){

        particles.push({

            x:
                player.x+
                player.w/2,

            y:
                groundY(),

            vx:
                (Math.random()-.5)*3,

            vy:
                -Math.random()*2,

            life:25
        });
    }
}


function createCoinParticles(
    x,
    y
){

    for(
        let i=0;
        i<10;
        i++
    ){

        particles.push({

            x,

            y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:30
        });
    }
}


/* =========================================================
   RYSOWANIE
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(
        !level ||
        !player
    ){

        drawMenuBackground();

        return;
    }


    drawBackground();

    drawGround();

    drawObstacles();

    drawCoins();

    drawFinish();

    drawParticles();

    drawPlayer();


    if(confetti.length)
        drawConfetti();
}


/* =========================================================
   TŁO MENU
========================================================= */

function drawMenuBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#111342"
    );


    gradient.addColorStop(
        1,
        "#030306"
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   TŁO GRY
========================================================= */

function drawBackground(){

    const color =
        level.color;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#09092a"
    );


    gradient.addColorStop(
        .55,
        "#050511"
    );


    gradient.addColorStop(
        1,
        "#020204"
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const glow =
        ctx.createRadialGradient(
            W*.5,
            H*.3,
            10,
            W*.5,
            H*.3,
            Math.max(W,H)*.75
        );


    glow.addColorStop(
        0,
        color+"20"
    );


    glow.addColorStop(
        1,
        "transparent"
    );


    ctx.fillStyle=glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.strokeStyle =
        color+"15";


    ctx.lineWidth=1;


    const grid=60;


    const offset =
        -(cameraX*.25)%grid;


    for(
        let x=offset;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }
}


/* =========================================================
   ZIEMIA
========================================================= */

function drawGround(){

    const gy =
        groundY();


    ctx.fillStyle =
        "#10101b";


    ctx.fillRect(
        0,
        gy,
        W,
        H-gy
    );


    ctx.fillStyle =
        level.color;


    ctx.shadowColor =
        level.color;


    ctx.shadowBlur=12;


    ctx.fillRect(
        0,
        gy-4,
        W,
        4
    );


    ctx.shadowBlur=0;


    ctx.strokeStyle =
        "#ffffff10";


    const size=45;


    const offset =
        -(cameraX*.6)%size;


    for(
        let x=offset;
        x<W;
        x+=size
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            gy
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }
}


/* =========================================================
   PRZESZKODY
========================================================= */

function drawObstacles(){

    const gy =
        groundY();


    for(
        const o
        of level.obstacles
    ){

        const x =
            o[0]-cameraX;

        const y =
            gy-o[3];

        const width =
            o[2];

        const height =
            o[3];


        if(
            x+width<0 ||
            x>W
        )
            continue;


        ctx.save();


        ctx.fillStyle =
            "#ff3d68";


        ctx.shadowColor =
            "#ff174f";


        ctx.shadowBlur=15;


        ctx.fillRect(
            x,
            y,
            width,
            height
        );


        ctx.shadowBlur=0;


        ctx.fillStyle =
            "#ff9bb2";


        ctx.fillRect(
            x+5,
            y+5,
            width-10,
            5
        );


        ctx.restore();
    }
}


/* =========================================================
   MONETY
========================================================= */

function drawCoins(){

    const gy =
        groundY();


    for(
        let i=0;
        i<level.coins.length;
        i++
    ){

        if(
            collectedCoins.has(i)
        )
            continue;


        const cx =
            level.coins[i];


        const x =
            cx-cameraX;


        const y =
            gy-95;


        if(
            x<-30 ||
            x>W+30
        )
            continue;


        const pulse =
            1+
            Math.sin(
                performance.now()/180+
                cx
            )*.08;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.scale(
            pulse,
            pulse
        );


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            12,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            "#ffe600";


        ctx.shadowColor =
            "#ffe600";


        ctx.shadowBlur=15;


        ctx.fill();


        ctx.shadowBlur=0;


        ctx.strokeStyle =
            "#fff5a0";


        ctx.lineWidth=2;


        ctx.stroke();


        ctx.restore();
    }
}


/* =========================================================
   META
========================================================= */

function drawFinish(){

    const x =
        level.length-cameraX;


    if(
        x<-100 ||
        x>W+100
    )
        return;


    const gy =
        groundY();


    ctx.save();


    ctx.fillStyle =
        level.color;


    ctx.shadowColor =
        level.color;


    ctx.shadowBlur=25;


    ctx.fillRect(
        x,
        gy-150,
        8,
        150
    );


    ctx.shadowBlur=0;


    ctx.font =
        "bold 16px Arial";


    ctx.fillStyle="#fff";


    ctx.fillText(
        "META",
        x-22,
        gy-160
    );


    ctx.restore();
}


/* =========================================================
   ⭐ POSTAĆ ⭐
   
   TUTAJ JEST NAJWAŻNIEJSZA ZMIANA.

   POSTAĆ JEST JEDNĄ BRYŁĄ.

   NIE MA:
   ❌ RĄK
   ❌ NÓG
   ❌ GŁOWY
   ❌ TUŁOWIA
   ❌ DŁONI
   ❌ BUTÓW

   JEST TYLKO:
   ✅ JEDEN KWADRAT
   ✅ OCZY
   ✅ USTA
   ✅ OBRÓT
========================================================= */

function drawPlayer(){

    if(!player)
        return;


    const skin =
        skins[
            save.selectedSkin
        ] ||
        skins[0];


    const x =
        player.x-cameraX;


    const y =
        player.y;


    const size=42;


    const centerX =
        x+size/2;


    const centerY =
        y+size/2;


    ctx.save();


    /* środek postaci */

    ctx.translate(
        centerX,
        centerY
    );


    /* obrót */

    ctx.rotate(
        player.rotation
    );


    /* animacja skoku */

    let scaleX=1;

    let scaleY=1;


    if(
        player.grounded
    ){

        const pulse =
            Math.sin(
                player.animationTime*.35
            )*.015;


        scaleX =
            1+pulse;


        scaleY =
            1-pulse;

    }else{

        scaleX =
            player.jumpSquash;

        scaleY =
            2-
            player.jumpSquash;
    }


    ctx.scale(
        scaleX,
        scaleY
    );


    ctx.translate(
        -size/2,
        -size/2
    );


    /* =====================================================
       JEDYNY KSZTAŁT POSTACI
    ===================================================== */

    ctx.fillStyle =
        skin.color;


    ctx.shadowColor =
        skin.color;


    ctx.shadowBlur=18;


    ctx.beginPath();


    ctx.moveTo(
        7,
        0
    );


    ctx.lineTo(
        size-7,
        0
    );


    ctx.quadraticCurveTo(
        size,
        0,
        size,
        7
    );


    ctx.lineTo(
        size,
        size-7
    );


    ctx.quadraticCurveTo(
        size,
        size,
        size-7,
        size
    );


    ctx.lineTo(
        7,
        size
    );


    ctx.quadraticCurveTo(
        0,
        size,
        0,
        size-7
    );


    ctx.lineTo(
        0,
        7
    );


    ctx.quadraticCurveTo(
        0,
        0,
        7,
        0
    );


    ctx.closePath();


    ctx.fill();


    ctx.shadowBlur=0;


    /* =====================================================
       OCZY
    ===================================================== */

    ctx.fillStyle =
        "#101018";


    if(player.blink){

        ctx.fillRect(
            8,
            18,
            8,
            2
        );


        ctx.fillRect(
            26,
            18,
            8,
            2
        );

    }else{

        ctx.beginPath();

        ctx.arc(
            13,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            29,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();

        ctx.arc(
            12,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            28,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* =====================================================
       USTA
    ===================================================== */

    ctx.strokeStyle =
        "#101018";


    ctx.lineWidth=2;


    ctx.beginPath();


    ctx.moveTo(
        15,
        30
    );


    ctx.lineTo(
        27,
        30
    );


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

    for(
        const p
        of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/30
            );


        ctx.fillStyle =
            level.color;


        ctx.fillRect(
            p.x-cameraX,
            p.y,
            4,
            4
        );
    }


    ctx.globalAlpha=1;
}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    confetti=[];


    for(
        let i=0;
        i<80;
        i++
    ){

        confetti.push({

            x:
                Math.random()*W,

            y:
                -Math.random()*H,

            vx:
                (Math.random()-.5)*4,

            vy:
                Math.random()*4+2,

            size:
                Math.random()*7+3,

            rot:
                Math.random()*6,

            vr:
                (Math.random()-.5)*.2,

            color:[
                "#00eaff",
                "#ff3d68",
                "#ffe600",
                "#55ff88",
                "#b45cff",
                "#ff7b00"
            ][
                Math.floor(
                    Math.random()*6
                )
            ]
        });
    }
}


function updateConfetti(){

    for(
        const c
        of confetti
    ){

        c.x+=c.vx;

        c.y+=c.vy;

        c.vy+=.04;

        c.rot+=c.vr;


        if(
            c.y>H+20
        ){

            c.y=-20;

            c.x=
                Math.random()*W;
        }
    }
}


function drawConfetti(){

    for(
        const c
        of confetti
    ){

        ctx.save();


        ctx.translate(
            c.x,
            c.y
        );


        ctx.rotate(
            c.rot
        );


        ctx.fillStyle =
            c.color;


        ctx.fillRect(
            -c.size/2,
            -c.size/2,
            c.size,
            c.size
        );


        ctx.restore();
    }
}

function unlockAchievement(id){

    if(
        save.achievements
            .includes(id)
    )
        return;


    save.achievements
        .push(id);


    saveGame();


    beep(
        1000,
        .15,
        "triangle",
        .04
    );
}


function checkAchievements(){

    if(
        save.completed.length>=1
    )
        unlockAchievement(
            "first"
        );


    if(
        save.completed.length>=5
    )
        unlockAchievement(
            "five"
        );


    if(
        save.completed.length>=10
    )
        unlockAchievement(
            "ten"
        );


    if(
        save.completed.length>=
        levels.length
    )
        unlockAchievement(
            "all"
        );


    if(
        save.coins>=50
    )
        unlockAchievement(
            "coins"
        );
}

function holdButton(

    up
){

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            down();
        }
    );


    element.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            up();
        }
    );


    element.addEventListener(
        "pointercancel",
        up
    );


    element.addEventListener(
        "pointerleave",
        up
    );
}
