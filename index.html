<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#03040b;color:#fff;font-family:Arial,sans-serif
}
button{
 font:inherit;color:#fff;border:0;cursor:pointer;
 user-select:none;touch-action:manipulation
}
#menu{
 position:fixed;inset:0;overflow:auto;z-index:10;
 padding:18px 14px 35px;
 background:
 radial-gradient(circle at 50% 0,#303b99,#11142f 35%,#03040b 78%);
}
.wrap{width:min(1100px,100%);margin:auto}
.logo{
 text-align:center;font-size:clamp(36px,8vw,70px);
 font-weight:1000;letter-spacing:5px;margin:4px 0;
 text-shadow:0 0 12px #00eaff,0 0 35px #00eaff,0 0 60px #ff27d7;
 animation:logoPulse 1.8s infinite alternate;
}
@keyframes logoPulse{
 from{transform:scale(1)}
 to{transform:scale(1.025)}
}
.sub{text-align:center;color:#aeb9e5;margin-bottom:15px}
.card{
 background:#10152eea;border:1px solid #3a4777;
 border-radius:18px;padding:15px;box-shadow:0 10px 35px #0006
}
.topGrid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.cardTitle{font-size:13px;color:#8e9bd0;font-weight:900;margin-bottom:8px}
.xpBar{
 height:12px;background:#050712;border-radius:20px;
 overflow:hidden;margin-top:8px
}
#xpFill{
 height:100%;width:0%;
 background:linear-gradient(90deg,#00eaff,#795cff,#ff27d7);
 box-shadow:0 0 15px #00eaff;
 transition:.35s
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{
 text-align:center;background:#171d3b;border-radius:12px;padding:9px
}
.stat b{display:block;font-size:19px}
.stat small{color:#8d98c4}
.actions{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:8px;margin:12px 0
}
.action{
 min-height:48px;border-radius:13px;
 background:linear-gradient(135deg,#273260,#171c39);
 border:1px solid #46558c;font-weight:900
}
.action:hover{border-color:#00eaff}
.section{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin:16px 2px 9px
}
.section h2{margin:0;font-size:20px}
#search{
 width:190px;max-width:45%;padding:9px 11px;
 background:#080d20;border:1px solid #3a4775;
 color:#fff;border-radius:10px
}
#levels{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.level{
 min-height:112px;text-align:left;padding:13px;
 border-radius:16px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#171d3b,#0c1024);
 border:2px solid #303b67;transition:.15s
}
.level:hover{border-color:#00eaff;transform:translateY(-2px)}
.level:active{transform:scale(.97)}
.num{font-size:11px;color:#7d89b8}
.name{font-size:17px;font-weight:900;margin:4px 0}
.diff{font-size:12px;color:#ffd34d}
.best{font-size:11px;color:#77e7ff;margin-top:6px}
.levelStar{
 position:absolute;right:9px;top:7px;font-size:22px
}
#modal,#pause,#finish{
 position:fixed;inset:0;z-index:30;display:none;
 align-items:center;justify-content:center;
 background:#000b;padding:14px
}
.panel{
 width:min(650px,100%);max-height:90vh;overflow:auto;
 background:#10152f;border:2px solid #3d4b80;
 border-radius:20px;padding:20px;
 box-shadow:0 0 50px #00eaff22
}
.panel h2{text-align:center;margin-top:0}
.panel button{
 width:100%;min-height:46px;margin-top:8px;
 border-radius:12px;background:#29345f;font-weight:900
}
.list{display:grid;gap:8px}
.row{
 padding:12px;border-radius:12px;
 background:#181e3b;border:1px solid #303b64
}
.ach{padding:11px;border-radius:12px;background:#181e3b;border:1px solid #303b64}
.ach.on{border-color:#00eaff;box-shadow:0 0 12px #00eaff22}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shopItem{
 padding:12px;background:#181e3b;
 border:1px solid #303b64;border-radius:12px
}
.shopItem button{margin-top:7px}
#game{
 position:fixed;inset:0;display:none;
 background:#02030a;touch-action:none
}
canvas{
 position:absolute;inset:0;width:100%;height:100%;
 display:block;touch-action:none
}
#hud{
 position:absolute;left:10px;right:10px;top:10px;
 z-index:4;pointer-events:none;text-shadow:0 2px 5px #000
}
.hudLine{
 display:flex;justify-content:space-between;
 gap:8px;font-weight:900
}
.gameBar{
 height:9px;background:#0009;
 border-radius:20px;overflow:hidden;margin-top:7px
}
#gameFill{
 height:100%;width:0%;background:#00eaff;
 box-shadow:0 0 13px #00eaff
}
#comboHUD{
 margin-top:7px;font-size:14px;color:#ffe14a;
 opacity:0;transition:.2s
}
.gameButtons{
 position:absolute;right:10px;top:10px;
 z-index:8;display:flex;gap:6px
}
.gameButtons button{
 min-width:44px;height:44px;
 border-radius:11px;background:#10172edd;
 border:1px solid #52618e
}
#error{
 position:fixed;left:10px;right:10px;bottom:10px;
 background:#681414;color:white;padding:12px;
 border-radius:12px;z-index:100;display:none
}
.rank{
 display:inline-block;padding:4px 9px;border-radius:20px;
 background:#202b54;border:1px solid #4d6096
}
@media(max-width:850px){
 .topGrid{grid-template-columns:1fr}
 #levels{grid-template-columns:repeat(2,1fr)}
 .actions{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:540px){
 #levels{grid-template-columns:1fr}
 .actions{grid-template-columns:repeat(2,1fr)}
 .logo{letter-spacing:3px}
}
</style>

</head>

/* =====================================================
   STORAGE
===================================================== */

function get(key,def="0"){
 try{
  const value=localStorage.getItem(key);
  return value===null?def:value;
 }catch(e){
  return def;
 }
}

function set(key,value){
 try{
  localStorage.setItem(key,String(value));
 }catch(e){}
}

function completed(i){
 return get("nd_done_"+i)==="1";
}

function completedCount(){
 let n=0;
 for(let i=0;i<LEVELS.length;i++){
  if(completed(i))n++;
 }
 return n;
}

function totalCoins(){
 return Number(get("nd_coins","0"));
}

function totalDeaths(){
 return Number(get("nd_deaths","0"));
}

function xp(){
 return Number(get("nd_xp","0"));
}

function playerLevel(){
 return Math.floor(xp()/100)+1;
}

function rank(){
 const l=playerLevel();

 if(l>=25)return "👑 LEGEND";
 if(l>=20)return "💎 MASTER";
 if(l>=15)return "🔥 PRO";
 if(l>=10)return "⚡ EXPERT";
 if(l>=5)return "🎮 PLAYER";
 return "🟢 ROOKIE";
}

function addXP(amount){
 set("nd_xp",xp()+amount);
}

/* =====================================================
   MENU
===================================================== */

function renderMenu(){

 const box=document.getElementById("levels");
 const query=
  (document.getElementById("search").value||"")
  .toLowerCase();

 box.innerHTML="";

 LEVELS.forEach((level,index)=>{

  const searchText=
   (index+1)+" "+level[0];

  if(
   query&&
   !searchText.toLowerCase().includes(query)
  )return;

  const b=document.createElement("button");

  b.type="button";
  b.className="level";

  /*
    ZACHOWANE BEZPOŚREDNIE URUCHAMIANIE.
  */

  b.setAttribute(
   "onclick",
   "startLevel("+index+")"
  );

  const best=
   get("nd_best_"+index,"-");

  b.innerHTML=
   '<span class="levelStar">'+
   (completed(index)?"★":"☆")+
   '</span>'+
   '<div class="num">LEVEL '+(index+1)+'</div>'+
   '<div class="name">'+level[0]+'</div>'+
   '<div class="diff">'+
   level[1]+" • "+
   level[2]+" px/s"+
   '</div>'+
   '<div class="best">'+
   (best==="-"?
    "Brak rekordu":
    "☠️ "+best+" śmierci")+
   '</div>';

  box.appendChild(b);
 });

 document.getElementById("progress").textContent=
  completedCount()+"/20";

 document.getElementById("coinsStat").textContent=
  totalCoins();

 document.getElementById("winsStat").textContent=
  completedCount();

 document.getElementById("deathsStat").textContent=
  totalDeaths();

 const currentXP=xp()%100;

 document.getElementById("playerLevel").textContent=
  "LEVEL "+playerLevel();

 document.getElementById("rank").textContent=
  rank();

 document.getElementById("xpText").textContent=
  currentXP+" / 100 XP";

 document.getElementById("xpFill").style.width=
  currentXP+"%";
}

document.getElementById("search")
.addEventListener(
 "input",

);

function openModal(title,html){

 modalPanel.innerHTML=
  "<h2>"+title+"</h2>"+
  html+
  '<button onclick="closeModal()">ZAMKNIJ</button>';

 modal.style.display="flex";
}

function closeModal(){

/* =====================================================
   ACHIEVEMENTS
===================================================== */

function unlock(id){
 if(get("nd_ach_"+id)==="1")return;
 set("nd_ach_"+id,"1");
}

function checkAchievements(){

 const n=completedCount();
 const c=totalCoins();

 if(n>=1)unlock("first");
 if(n>=3)unlock("three");
 if(n>=6)unlock("six");
 if(n>=10)unlock("ten");
 if(n>=20)unlock("all");

 if(c>=10)unlock("coins10");
 if(c>=25)unlock("coins25");
 if(c>=50)unlock("coins50");

 if(deaths===0)unlock("perfect");
 if(deaths>=3)unlock("survivor");
 if(runCoins===3)unlock("allcoins");

 if(
  deaths===0&&
  runCoins===3
 ){
  unlock("speedrunner");
 }

 if(bestCombo>=10)unlock("combo10");
 if(bestCombo>=25)unlock("combo25");

 for(let i=1;i<20;i++){
  if(completed(i)){
   const id=
    i===11?
    "final":
    "level"+(i+1);

   unlock(id);
  }
 }
}

function openAchievements(){

 let html='<div class="list">';

 ACH.forEach(a=>{

  const on=
   get("nd_ach_"+a[0])==="1";

  html+=
   '<div class="ach '+(on?"on":"")+'">'+
   "<b>"+a[1]+"</b><br>"+
   "<small>"+a[2]+"</small>"+
   "</div>";
 });

 html+="</div>";

 openModal(
  "🏆 ACHIEVEMENTY",
  html
 );
}

/* =====================================================
   SHOP
===================================================== */

function openShop(){

 let html=
  "<p>🪙 Masz <b>"+
  totalCoins()+
  "</b> monet.</p>"+
  '<div class="shopGrid">';

 SHOP.forEach(item=>{

  const bought=
   get("nd_shop_"+item[0])==="1";

  html+=
   '<div class="shopItem">'+
   "<b>"+item[1]+"</b><br>"+
   "🪙 "+item[2]+
   '<button onclick="buyItem(\''+
   item[0]+"\","+item[2]+')">'+
   (bought?"✅ KUPIONE":"KUP")+
   "</button></div>";
 });

 html+="</div>";

 openModal(
  "🛒 SKLEP",
  html
 );
}

function buyItem(id,cost){

 if(get("nd_shop_"+id)==="1"){
  return;
 }

 if(totalCoins()<cost){
  alert("Nie masz wystarczającej liczby monet!");
  return;
 }

 set(
  "nd_coins",
  totalCoins()-cost
 );

 set(
  "nd_shop_"+id,
  "1"
 );

 unlock("shop");

 openShop();
 renderMenu();
}

/* =====================================================
   START LEVEL
===================================================== */

function startLevel(index){

 if(typeof index!=="number"){
  index=Number(index);
 }

 if(
  !Number.isInteger(index)||
  index<0||
  index>=LEVELS.length
 ){
  alert("Nieprawidłowy poziom.");
  return;
 }

 try{

  current=index;

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){
   cancelAnimationFrame(raf);
   raf=0;
  }

  stopMusic();

  deaths=0;
  runCoins=0;
  combo=0;
  bestCombo=0;

  collected=new Set();

  world=0;
  shake=0;
  flash=0;
  portalShield=0;

  /*
    Każdy poziom startuje normalnie.
    GRAVITY BREAK zmienia grawitację
    dopiero przez portale.
  */

  gravity=1;

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];
  particles=[];
  trail=[];
  stars=[];

  menu.style.display="none";
  game.style.display="block";

  pause.style.display="none";
  finish.style.display="none";

  resizeCanvas();

  generateLevel();
  resetPlayer();

  updateHUD();

  running=true;

  last=performance.now();

  draw();

  raf=requestAnimationFrame(loop);

  if(sound){
   startMusic();
  }

 }catch(error){

  console.error(error);

  showError(
   "Błąd uruchamiania poziomu: "+
   error.message
  );

  backToMenu();
 }
}

/* =====================================================
   LEVEL GENERATION
===================================================== */

function spike(x,side="bottom"){
 obstacles.push({
  type:"spike",
  x:x,
  side:side
 });
}

function saw(x,side="bottom"){
 obstacles.push({
  type:"saw",
  x:x,
  r:28,
  side:side
 });
}

function gap(x,w,side="bottom"){
 obstacles.push({
  type:"gap",
  x:x,
  w:w,
  side:side
 });
}

function pad(x,side="bottom"){
 pads.push({
  x:x,
  side:side,
  used:false
 });
}

function gravityPortal(x,target){
 portals.push({
  type:"gravity",
  x:x,
  target:target,
  used:false
 });
}

function speedPortal(x){
 portals.push({
  type:"speed",
  x:x,
  used:false
 });
}

function generateLevel(){

 obstacles=[];
 coinObjects=[];
 pads=[];
 portals=[];

 const length=
  11500+
  current*600;

 /*
   Specjalna, bezpieczna trasa
   dla GRAVITY BREAK.
 */

 if(current===9){

  let x=550;

  for(let i=0;i<7;i++){

   spike(x,"bottom");

   if(i%2===1){
    saw(x+180,"bottom");
   }

   x+=500;
  }

  /*
    Pierwszy portal:
    gracz przechodzi na górę.
    Kolce pozostają na dole.
  */

  gravityPortal(4200,-1);

  for(let i=0;i<8;i++){

   spike(
    4650+i*550,
    "bottom"
   );

   if(i%2===0){
    saw(
     4900+i*550,
     "bottom"
    );
   }
  }

  /*
    Drugi portal:
    gracz wraca na dół.
    Kolejne kolce są na górze.
  */

  gravityPortal(9000,1);

  for(let i=0;i<5;i++){

   spike(
    9450+i*500,
    "top"
   );
  }

 }else{

  let x=600;

  const patterns=[
   "spike",
   "double",
   "saw",
   "gap",
   "pad",
   "spike",
   "saw",
   "speed",
   "double",
   "gap"
  ];

  let p=0;

  while(x<length){

   const type=
    patterns[p++%patterns.length];

   if(type==="spike"){

    spike(x);
    x+=420;

   }else if(type==="double"){

    spike(x);
    spike(x+62);
    x+=530;

   }else if(type==="saw"){

    saw(x);
    x+=520;

   }else if(type==="gap"){

    gap(x,145);
    x+=620;

   }else if(type==="pad"){

    pad(x);
    spike(x+210);
    x+=600;

   }else if(type==="speed"){

    speedPortal(x);
    spike(x+250);
    saw(x+500);
    x+=760;
   }
  }
 }

 /*
   Trzy zwykłe monety.
 */

 const coinPositions=[
  length*.25,
  length*.52,
  length*.79
 ];

 coinPositions.forEach((x,i)=>{

  let safeX=x;

  for(let tries=0;tries<30;tries++){

   let bad=false;

   for(const o of obstacles){

    if(
     Math.abs(
      safeX-o.x
     )<120
    ){
     bad=true;
     break;
    }
   }

   if(!bad)break;

   safeX+=100;
  }

  coinObjects.push({
   id:i,
   x:safeX,
   side:
    current===9&&i===1?
    "top":
    "bottom",
   collected:false
  });
 });

 /*
   Bonusowa moneta.
   Pojawia się tylko na trudniejszych poziomach.
 */

 if(current>=4){

  coinObjects.push({
   id:3,
   x:length*.92,
   side:
    current===9?
    "bottom":
    "bottom",
   bonus:true,
   collected:false
  });
 }
}

/* =====================================================
   RESET PLAYER
===================================================== */

function resetPlayer(){

 player.x=
  Math.max(
   80,
   Math.min(180,W*.22)
  );

 player.y=
  gravity===1?
  ground-player.size:
  0;

 player.vy=0;
 player.rot=0;
 player.grounded=true;
}

/* =====================================================
   INPUT
===================================================== */

function jump(){

 if(
  !running||
  paused||
  dying||
  finished
 )return;

 if(player.grounded){

  player.vy=
   -735*gravity;

  player.grounded=false;

  combo++;

  if(combo>bestCombo){
   bestCombo=combo;
  }

  set(
   "nd_bestCombo",
   Math.max(
    Number(get("nd_bestCombo","0")),
    bestCombo
   )
  );

  set(
   "nd_jumps",
   Number(get("nd_jumps","0"))+1
  );

  particlesJump();

  shake=3;
 }
}

game.addEventListener(
 "pointerdown",

  )return;

 },
 {passive:true}
);

);

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

 if(portalShield>0){
  portalShield-=dt;
 }

 let speed=
  LEVELS[current][2];

 for(const p of portals){

  if(
   p.type==="speed"&&
   !p.used&&
   world+player.x>
    p.x-20&&
   world+player.x<
    p.x+70
  ){
   speed*=1.18;
  }
 }

 world+=speed*dt;

 const gravityForce=
  2100*gravity;

 player.vy+=
  gravityForce*dt;

 player.y+=
  player.vy*dt;

 const floor=
  ground-player.size;

 if(gravity===1){

  if(
   player.y>=floor&&
   !gapAtSide("bottom")
  ){

   player.y=floor;
   player.vy=0;
   player.grounded=true;

  }else{

   player.grounded=false;
   player.rot+=dt*8;
  }

 }else{

  if(
   player.y<=0&&
   !gapAtSide("top")
  ){

   player.y=0;
   player.vy=0;
   player.grounded=true;

  }else{

   player.grounded=false;
   player.rot-=dt*8;
  }
 }

 checkPads();
 checkPortals();
 checkCoins();
 collisions();

 /*
   Combo lekko spada, jeśli gracz długo
   nie skacze.
 */

 if(
  player.grounded&&
  combo>0
 ){
  combo=Math.max(
   0,
   combo-dt*.7
  );
 }

 updateParticles(dt);
 updateTrail(dt);

 if(shake>0){
  shake-=dt*12;
  if(shake<0)shake=0;
 }

 if(flash>0){
  flash-=dt*3;
  if(flash<0)flash=0;
 }

 const time=
  Number(get("nd_time","0"))+
  dt;

 set(
  "nd_time",
  time.toFixed(1)
 );
}

function gapAtSide(side){

 const center=
  world+
  player.x+
  player.size/2;

 for(const o of obstacles){

  if(
   o.type==="gap"&&
   o.side===side&&
   center>o.x&&
   center<o.x+o.w
  ){
   return true;
  }
 }

 return false;
}

/* =====================================================
   PORTALE
===================================================== */

function checkPortals(){

 for(const p of portals){

  if(p.used)continue;

  const px=
   world+
   player.x+
   player.size/2;

  if(
   px>p.x&&
   px<p.x+65
  ){

   p.used=true;

   if(p.type==="gravity"){

    gravity=p.target;

    /*
      NATYCHMIAST przenosimy gracza
      na bezpieczną stronę.
    */

    if(gravity===1){
     player.y=ground-player.size;
    }else{
     player.y=0;
    }

    player.vy=0;
    player.grounded=true;

    /*
      Krótka osłona zapobiega śmierci
      przez obiekt stojący przy portalu.
    */

    portalShield=.45;

    particlesPortal(
     p.x-world,
     p.target
    );

    shake=7;
   }
  }
 }
}

/* =====================================================
   PADS
===================================================== */

function checkPads(){

 const side=
  gravity===1?
  "bottom":
  "top";

 for(const p of pads){

  if(
   p.used||
   p.side!==side
  )continue;

  const px=
   world+
   player.x+
   player.size/2;

  if(
   px>p.x&&
   px<p.x+55&&
   player.grounded
  ){

   p.used=true;

   player.vy=
    -1000*gravity;

   player.grounded=false;

   particlesPad(
    p.x-world,
    side
   );

   shake=5;
  }
 }
}

/* =====================================================
   COINS
===================================================== */

function coinY(c){

 if(c.side==="top"){
  return 120;
 }

 return ground-125;
}

function checkCoins(){

 for(const c of coinObjects){

  if(c.collected)continue;

  const cx=
   c.x-world;

  const cy=
   coinY(c);

  const px=
   player.x+
   player.size/2;

  const py=
   player.y+
   player.size/2;

  if(
   Math.hypot(
    px-cx,
    py-cy
   )<40
  ){

   c.collected=true;
   collected.add(c.id);

   runCoins++;

   combo+=2;

   particlesCoin(cx,cy);

   shake=3;

   document.getElementById("coinHUD")
   .textContent=
    "🪙 "+runCoins+"/3";
  }
 }
}

/* =====================================================
   COLLISIONS
===================================================== */

function collisions(){

 if(portalShield>0)return;

 const left=
  world+
  player.x+6;

 const right=
  world+
  player.x+
  player.size-6;

 const top=
  player.y+6;

 const bottom=
  player.y+
  player.size-5;

 for(const o of obstacles){

  if(o.type==="spike"){

   if(
    o.side==="bottom"&&
    right>o.x+6&&
    left<o.x+46&&
    bottom>ground-46
   ){
    die();
    return;
   }

   if(
    o.side==="top"&&
    right>o.x+6&&
    left<o.x+46&&
    top<46
   ){
    die();
    return;
   }
  }

  if(o.type==="saw"){

   const cx=o.x;

   const cy=
    o.side==="bottom"?
    ground-o.r:
    o.r;

   const nx=
    Math.max(
     left,
     Math.min(cx,right)
    );

   const ny=
    Math.max(
     top,
     Math.min(cy,bottom)
    );

   const dx=cx-nx;
   const dy=cy-ny;

   if(
    dx*dx+dy*dy<
    (o.r-5)*(o.r-5)
   ){
    die();
    return;
   }
  }

  if(o.type==="gap"){

   const center=
    world+
    player.x+
    player.size/2;

   if(
    o.side==="bottom"&&
    gravity===1&&
    center>o.x&&
    center<o.x+o.w&&
    bottom>=ground-8
   ){
    die();
    return;
   }

   if(
    o.side==="top"&&
    gravity===-1&&
    center>o.x&&
    center<o.x+o.w&&
    top<=8
   ){
    die();
    return;
   }
  }
 }
}

/* =====================================================
   DEATH
===================================================== */

function die(){

 if(
  dying||
  finished||
  !running
 )return;

 dying=true;
 running=false;

 deaths++;

 combo=0;

 set(
  "nd_deaths",
  totalDeaths()+1
 );

 shake=15;
 flash=1;

 particlesDeath();

  if(!dying)return;

  dying=false;

  startLevel(current);

 },650);
}

/* =====================================================
   WIN
===================================================== */

function finishLevel(){

 if(finished)return;

 finished=true;
 running=false;

 stopMusic();

 set(
  "nd_done_"+current,
  "1"
 );

 const oldCoins=
  totalCoins();

 /*
   Zwykłe monety + bonusowa
   są liczone jako monety.
 */

 set(
  "nd_coins",
  oldCoins+runCoins
 );

 addXP(
  25+
  current*3+
  runCoins*10
 );

 checkAchievements();

 const day=
  Math.floor(Date.now()/86400000);

 const dailyLevel=
  day%LEVELS.length;

 if(current===dailyLevel){

  if(get("nd_daily_"+day)!=="1"){

   set(
    "nd_daily_"+day,
    "1"
   );

   addXP(50);
   set(
    "nd_coins",
    totalCoins()+10
   );

   unlock("daily");
  }
 }

 const oldBest=
  get("nd_best_"+current,"999");

 if(
  oldBest==="999"||
  deaths<Number(oldBest)
 ){
  set(
   "nd_best_"+current,
   deaths
  );
 }

 if(completedCount()===20){
  particlesUltimate();
 }

 document.getElementById(
  "finishTitle"
 ).textContent=
  completedCount()===20?
  "👑 20/20 — MISTRZ NEON DASH!":
  "🎉 POZIOM UKOŃCZONY!";

 document.getElementById(
  "finishInfo"
 ).innerHTML=
  LEVELS[current][0]+
  "<br><br>"+
  "🪙 Monety: <b>"+runCoins+"/3</b><br>"+
  "☠️ Śmierci: <b>"+deaths+"</b><br>"+
  "🔥 Najlepsze combo: <b>x"+
  bestCombo+"</b><br>"+
  "⭐ XP: <b>+"+
  (25+current*3+runCoins*10)+
  "</b>";

 finish.style.display="flex";

 renderMenu();

 victoryAnimation();
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

 if(!running)return;

 if(paused){

  last=time;

  raf=requestAnimationFrame(loop);

  return;
 }

 let dt=
  (time-last)/1000;

 if(
  !Number.isFinite(dt)||
  dt<0
 ){
  dt=0;
 }

 dt=Math.min(dt,.05);

 last=time;

 update(dt);
 draw();

 const length=
  11500+
  current*600;

 if(world>=length){
  finishLevel();
 }

 if(running){
  raf=requestAnimationFrame(loop);
 }
}

/* =====================================================
   DRAW
===================================================== */

function draw(){

 const level=
  LEVELS[current];

 ctx.clearRect(
  0,0,W,H
 );

 ctx.save();

 if(shake>0){

  ctx.translate(
   (Math.random()-.5)*shake,
   (Math.random()-.5)*shake
  );
 }

 /*
   Dynamiczne tło.
 */

 const pulse=
  (Math.sin(
   performance.now()/500
  )+1)/2;

 const grad=
  ctx.createLinearGradient(
   0,0,0,H
  );

 grad.addColorStop(
  0,
  "#080b20"
 );

 grad.addColorStop(
  .55,
  level[3]+"18"
 );

 grad.addColorStop(
  1,
  "#020207"
 );

 ctx.fillStyle=grad;

 ctx.fillRect(
  0,0,W,H
 );

 drawStars();
 drawGrid();
 drawSpeedLines();

 /*
   Ground.
 */

 ctx.fillStyle="#0a0d18";

 ctx.fillRect(
  0,
  ground,
  W,
  H-ground
 );

 ctx.strokeStyle=level[3];
 ctx.lineWidth=3;
 ctx.shadowColor=level[3];
 ctx.shadowBlur=15;

 ctx.beginPath();

 ctx.moveTo(
  0,
  ground
 );

 ctx.lineTo(
  W,
  ground
 );

 ctx.stroke();

 ctx.shadowBlur=0;

 /*
   Obstacles.
 */

 for(const o of obstacles){

  const x=
   o.x-world;

  if(
   x<-150||
   x>W+150
  )continue;

  if(o.type==="spike"){
   drawSpike(o);
  }

  if(o.type==="saw"){
   drawSaw(o);
  }

  if(o.type==="gap"){

   ctx.fillStyle="#020207";

   if(o.side==="bottom"){

    ctx.fillRect(
     x,
     ground,
     o.w,
     H-ground
    );

   }else{

    ctx.fillRect(
     x,
     0,
     o.w,
     50
    );
   }
  }
 }

 for(const p of pads){

  const x=
   p.x-world;

  if(
   x>-80&&
   x<W+80
  ){
   drawPad(p,x);
  }
 }

 for(const p of portals){

  const x=
   p.x-world;

  if(
   x>-100&&
   x<W+100
  ){
   drawPortal(p,x);
  }
 }

 for(const c of coinObjects){

  if(c.collected)continue;

  const x=
   c.x-world;

  if(
   x>-60&&
   x<W+60
  ){
   drawCoin(
    x,
    coinY(c),
    c.bonus
   );
  }
 }

 drawTrail();

 if(!dying&&!finished){
  drawPlayer();
 }

 drawParticles();

 if(flash>0){

  ctx.fillStyle=
   "rgba(255,255,255,"+
   Math.min(.5,flash*.5)+
   ")";

  ctx.fillRect(
   0,0,W,H
  );
 }

 ctx.restore();

 const length=
  11500+
  current*600;

 const percentValue=
  Math.min(
   100,
   Math.floor(
    world/length*100
   )
  );

 document.getElementById(
  "percent"
 ).textContent=
  percentValue+"%";

 document.getElementById(
  "gameFill"
 ).style.width=
  percentValue+"%";

 updateCombo();
}

   PLAYER
===================================================== */

function selectedColor(){

 const skin=
  get("nd_skin","cyan");

 for(const s of SKINS){

  if(s[0]===skin){
   return s[2];
  }
 }

 return LEVELS[current][3];
}

function drawPlayer(){

 const color=
  selectedColor();

 ctx.save();

 ctx.translate(
  player.x+17,
  player.y+17
 );

 ctx.rotate(
  player.rot
 );

 ctx.shadowColor=color;
 ctx.shadowBlur=22;

 ctx.fillStyle=color;

 ctx.fillRect(
  -17,-17,
  34,34
 );

 ctx.shadowBlur=0;

 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;

 ctx.strokeRect(
  -17,-17,
  34,34
 );

 /*
   Mały neonowy środek.
 */

 ctx.fillStyle="#07101d";

 ctx.fillRect(
  -7,-7,
  5,5
 );

 ctx.fillRect(
  3,-7,
  5,5
 );

 ctx.restore();
}

/* =====================================================
   OBSTACLES
===================================================== */

function drawSpike(o){

 const x=o.x-world;
 const color=LEVELS[current][3];

 ctx.save();

 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=18;

 ctx.beginPath();

 if(o.side==="bottom"){

  ctx.moveTo(x,ground);
  ctx.lineTo(x+23,ground-47);
  ctx.lineTo(x+46,ground);

 }else{

  ctx.moveTo(x,0);
  ctx.lineTo(x+23,47);
  ctx.lineTo(x+46,0);
 }

 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle="#fff";
 ctx.stroke();

 ctx.restore();
}

function drawSaw(o){

 const x=o.x-world;
 const color=LEVELS[current][3];

 const cy=
  o.side==="bottom"?
  ground-o.r:
  o.r;

 ctx.save();

 ctx.translate(x,cy);

 ctx.rotate(
  performance.now()/250
 );

 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=18;

 const teeth=14;

 ctx.beginPath();

 for(
  let i=0;
  i<teeth*2;
  i++
 ){

  const angle=
   i*Math.PI/teeth;

  const radius=
   i%2===0?
   o.r:
   o.r*.68;

  const px=
   Math.cos(angle)*radius;

  const py=
   Math.sin(angle)*radius;

  if(i===0)
   ctx.moveTo(px,py);
  else
   ctx.lineTo(px,py);
 }

 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#05050c";

 ctx.beginPath();

 ctx.arc(
  0,0,
  o.r*.28,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.restore();
}

/* =====================================================
   COINS
===================================================== */

function drawCoin(x,y,bonus=false){

 const scale=
  1+
  Math.sin(
   performance.now()/120
  )*.1;

 ctx.save();

 ctx.translate(x,y);
 ctx.scale(scale,scale);

 ctx.shadowColor=
  bonus?
  "#ff4bd8":
  "#ffd43b";

 ctx.shadowBlur=25;

 ctx.fillStyle=
  bonus?
  "#ff4bd8":
  "#ffd43b";

 ctx.beginPath();

 ctx.arc(
  0,0,
  bonus?16:14,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle="#fff";
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.fillStyle="#fff";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";

 ctx.fillText(
  bonus?"★":"$",
  0,4
 );

 ctx.restore();
}

/* =====================================================
   PAD / PORTAL
===================================================== */

function drawPad(p,x){

 const color="#49ff9a";

 ctx.save();

 const y=
  p.side==="bottom"?
  ground-10:
  10;

 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=18;

 ctx.beginPath();

 if(p.side==="bottom"){

  ctx.arc(
   x+25,
   y,
   20,
   Math.PI,
   Math.PI*2
  );

 }else{

  ctx.arc(
   x+25,
   y,
   20,
   0,
   Math.PI
  );
 }

 ctx.fill();

 ctx.shadowBlur=0;
 ctx.strokeStyle="#fff";
 ctx.stroke();

 ctx.restore();
}

function drawPortal(p,x){

 const color=
  p.type==="speed"?
  "#ffe14a":
  "#ff4be8";

 const y=H*.48;

 ctx.save();

 ctx.translate(
  x+30,
  y
 );

 ctx.strokeStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=25;
 ctx.lineWidth=5;

 ctx.beginPath();

 ctx.arc(
  0,0,
  29+
  Math.sin(
   performance.now()/120
  )*4,
  0,
  Math.PI*2
 );

 ctx.stroke();

 ctx.shadowBlur=0;

 ctx.fillStyle="#fff";
 ctx.font="bold 20px Arial";
 ctx.textAlign="center";

 if(p.type==="speed"){
  ctx.fillText(">>",0,7);
 }else{
  ctx.fillText(
   p.target===-1?"↓":"↑",
   0,7
  );
 }

 ctx.restore();
}

/* =====================================================
   BACKGROUND
===================================================== */

function createStars(){

 stars=[];

 for(let i=0;i<90;i++){

  stars.push({
   x:Math.random()*W,
   y:Math.random()*Math.max(100,ground*.9),
   r:Math.random()*2+.4,
   v:Math.random()*.8+.15
  });
 }
}

function drawStars(){

 ctx.fillStyle="#fff";

 for(const s of stars){

  s.x-=s.v;

  if(s.x<0)s.x=W;

  ctx.globalAlpha=
   .25+s.r*.2;

  ctx.beginPath();

  ctx.arc(
   s.x,s.y,s.r,
   0,Math.PI*2
  );

  ctx.fill();
 }

 ctx.globalAlpha=1;
}

function drawGrid(){

 const color=
  LEVELS[current][3];

 ctx.strokeStyle=color;
 ctx.globalAlpha=.08;

 const size=70;

 const offset=
  -(world*.25)%size;

 for(
  let x=offset;
  x<W;
  x+=size
 ){

  ctx.beginPath();

  ctx.moveTo(x,0);
  ctx.lineTo(x,ground);

  ctx.stroke();
 }

 for(
  let y=40;
  y<ground;
  y+=size
 ){

  ctx.beginPath();

  ctx.moveTo(0,y);
  ctx.lineTo(W,y);

  ctx.stroke();
 }

 ctx.globalAlpha=1;
}

function drawSpeedLines(){

 const color=
  LEVELS[current][3];

 ctx.strokeStyle=color;
 ctx.globalAlpha=.12;
 ctx.lineWidth=2;

 const offset=
  -(world*.8)%190;

 for(
  let x=offset-190;
  x<W+190;
  x+=190
 ){

  const y=
   90+
   Math.abs(x*7)%
   Math.max(
    100,
    ground-150
   );

  ctx.beginPath();

  ctx.moveTo(x,y);
  ctx.lineTo(x+85,y);

  ctx.stroke();
 }

 ctx.globalAlpha=1;
}

/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

 if(
  running&&
  !dying
 ){

  trail.push({
   x:player.x+17,
   y:player.y+17,
   life:.3,
   size:14
  });
 }

 for(
  let i=trail.length-1;
  i>=0;
  i--
 ){

  trail[i].life-=dt;

  if(trail[i].life<=0){
   trail.splice(i,1);
  }
 }

 if(trail.length>35){
  trail.splice(
   0,
   trail.length-35
  );
 }
}

function drawTrail(){

 const color=
  selectedColor();

 for(const t of trail){

  ctx.globalAlpha=
   Math.max(0,t.life/.3)*.35;

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=15;

  ctx.fillRect(
   t.x-t.size/2,
   t.y-t.size/2,
   t.size,
   t.size
  );
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

/* =====================================================
   PARTICLES
===================================================== */

function particle(
 x,y,vx,vy,life,size,type
){

 if(particles.length>300)return;

 particles.push({
  x,y,vx,vy,life,
  max:life,size,type,
  rot:Math.random()*6,
  spin:(Math.random()-.5)*10
 });
}

 for(let i=0;i<10;i++){

   (Math.random()-.5)*160,

  );

}

function particlesDeath(){

  particle(
   player.x+17,
   player.y+17,

   (Math.random()-.6)*550,

   Math.random()*7+2,

  );

}

function particlesCoin(x,y){

  );

}

function particlesPad(x,side){

 for(let i=0;i<18;i++){

  particle(
   x,
   side==="bottom"?
    ground-15:
    15,
   (Math.random()-.5)*240,
   -Math.random()*250,
   .7,

   "pad"
  );

}

function particlesPortal(x,target){

 for(let i=0;i<35;i++){

  particle(
   x,
   H*.48,
   (Math.random()-.5)*320,
   (Math.random()-.5)*320,
   .9,
   4,
   "portal"
  );
 }
}

function particlesUltimate(){

 for(let i=0;i<220;i++){

  particle(
   W/2,
   H*.4,
   (Math.random()-.5)*850,
   (Math.random()-.8)*850,
   1.5+Math.random()*1.5,
   Math.random()*9+3,
   "ultimate"
  );
 }
}

function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=particles[i];

  p.life-=dt;

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  p.vy+=500*dt;
  p.rot+=p.spin*dt;

  if(p.life<=0){
   particles.splice(i,1);
  }
 }
}

function drawParticles(){

 for(const p of particles){

  ctx.globalAlpha=
   Math.max(
    0,
    p.life/p.max
   );

  let color=
   LEVELS[current][3];

  if(p.type==="coin")
   color="#ffd43b";

  if(p.type==="pad")
   color="#49ff9a";

  if(p.type==="portal")
   color="#ff4be8";

  if(p.type==="ultimate"){

   const colors=[
    "#00eaff",
    "#ff27d7",
    "#ffe14a",
    "#49ff9a",
    "#a855ff"
   ];

   color=
    colors[
     Math.floor(
      Math.random()*colors.length
     )
    ];
  }

  ctx.fillStyle=color;

  ctx.save();

  ctx.translate(
   p.x,p.y
  );

  ctx.rotate(p.rot);

  ctx.shadowColor=color;
  ctx.shadowBlur=10;

  ctx.fillRect(
   -p.size/2,
   -p.size/2,
   p.size,
   p.size
  );

  ctx.restore();
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

 stopMusic();

 try{

  if(!audio){

   audio=new(
    window.AudioContext||
    window.webkitAudioContext
   )();
  }

  if(audio.state==="suspended"){
   audio.resume();
  }

  const notes=[
   262,330,392,523,
   392,330,294,330
  ];

  const wave=[
   "square",
   "triangle",
   "sine"
  ][current%3];

  musicIndex=0;

  function note(){

   if(
    !sound||
    !running||
    paused
   )return;

   const osc=
    audio.createOscillator();

   const gain=
    audio.createGain();

   osc.type=wave;

   osc.frequency.value=
    notes[
     musicIndex%notes.length
    ]*(1+current*.01);

   gain.gain.setValueAtTime(
    .035,
    audio.currentTime
   );

   gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.15
   );

   osc.connect(gain);
   gain.connect(audio.destination);

   osc.start();

   osc.stop(
    audio.currentTime+.16
   );

   musicIndex++;
  }

  note();

  musicTimer=
   setInterval(
    note,
    60000/LEVELS[current][4]
   );

 }catch(e){}
}

function stopMusic(){

 if(musicTimer){

  clearInterval(
   musicTimer
  );

  musicTimer=null;
 }
}

/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

 if(
  !running&&
  !paused
 )return;

 paused=!paused;

 pause.style.display=
  paused?
  "flex":
  "none";

 if(paused){

  stopMusic();

 }else{

  last=performance.now();

  if(sound){
   startMusic();
  }
 }
}

function restart(){

 pause.style.display="none";
 finish.style.display="none";

 startLevel(current);
}

/* =====================================================
   SOUND
===================================================== */

function toggleSound(){

 sound=!sound;

 set(
  "nd_sound",
  sound?"1":"0"
 );

 document.getElementById(
  "soundButton"
 ).textContent=
  sound?"🔊":"🔇";

 if(
  sound&&
  running&&
  !paused
 ){
  startMusic();
 }else{
  stopMusic();
 }
}

/* =====================================================
   MENU
===================================================== */

function backToMenu(){

 running=false;
 paused=false;
 finished=false;
 dying=false;

 if(raf){

  cancelAnimationFrame(raf);
  raf=0;
 }

 stopMusic();

 game.style.display="none";
 menu.style.display="block";

 pause.style.display="none";
 finish.style.display="none";

 renderMenu();
}

/* =====================================================
   VICTORY
===================================================== */

function victoryAnimation(){

 let frames=0;

 function animate(){

  if(!finished)return;

  updateParticles(.016);
  draw();

  frames++;

  if(frames<150){
   requestAnimationFrame(animate);
  }
 }

 requestAnimationFrame(animate);
}

/* =====================================================
   ERROR HANDLING
===================================================== */

function showError(message){

 const box=
  document.getElementById("error");

 box.textContent=
  "⚠️ "+message;

 box.style.display="block";

 setTimeout(()=>{
  box.style.display="none";
 },6000);
}

window.addEventListener(
 "error",
 e=>{
  console.error(e.error||e.message);
 }
);

window.addEventListener(
 "unhandledrejection",
 e=>{
  console.error(e.reason);
 }
);

/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
 "visibilitychange",
 ()=>{

  if(
   document.hidden&&
   running&&
   !paused
  ){
   togglePause();
  }
 }
);

/* =====================================================
   INIT
===================================================== */

resizeCanvas();
renderMenu();

</script>
