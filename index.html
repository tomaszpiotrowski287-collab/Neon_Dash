<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash — Ultimate Edition</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020208;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:#fff;
  border:0;
  outline:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

/* =========================
   MENU
========================= */

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    max(20px,env(safe-area-inset-top))
    14px
    max(30px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 0%,#26308a 0%,#101438 22%,#07091b 52%,#020207 100%);
}

#menu::before{
  content:"";
  position:absolute;
  inset:-50%;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 70px,
      rgba(0,234,255,.025) 71px 72px
    );
  transform:perspective(500px) rotateX(55deg);
  animation:menuGrid 8s linear infinite;
}

@keyframes menuGrid{
  from{transform:perspective(500px) rotateX(55deg) translateY(0)}
  to{transform:perspective(500px) rotateX(55deg) translateY(140px)}
}

.logo{
  position:relative;
  margin:16px 0 3px;
  font-size:clamp(36px,8vw,70px);
  font-weight:1000;
  letter-spacing:clamp(3px,1vw,8px);
  text-align:center;
  animation:logoFloat 2.8s ease-in-out infinite;
  text-shadow:
    0 0 8px #00eaff,
    0 0 20px #00eaff,
    0 0 45px #7b5cff,
    0 0 80px #ff27d7;
}

@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-5px) scale(1.015)}
}

.subtitle{
  position:relative;
  opacity:.72;
  font-size:clamp(12px,3vw,17px);
  text-align:center;
  margin-bottom:18px;
}

.progress{
  position:relative;
  width:min(720px,100%);
  padding:15px;
  margin-bottom:15px;
  border:2px solid #354174;
  border-radius:18px;
  background:linear-gradient(135deg,#141a3cdd,#090c20dd);
  box-shadow:
    0 0 25px #00eaff10,
    inset 0 0 25px #ffffff04;
  backdrop-filter:blur(8px);
}

.progressTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:900;
}

.bar{
  height:14px;
  margin-top:9px;
  overflow:hidden;
  border-radius:20px;
  background:#030510;
  border:1px solid #293052;
}

#menuBar{
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 18px #00eaff;
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}

#doneText{
  text-align:center;
  opacity:.62;
  margin-top:7px;
  font-size:13px;
}

#levels{
  position:relative;
  width:min(720px,100%);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.level{
  min-width:0;
  min-height:88px;
  position:relative;
  overflow:hidden;
  padding:13px;
  text-align:left;
  border-radius:16px;
  border:2px solid #303861;
  background:linear-gradient(135deg,#171d40,#0c1028);
  transition:
    transform .12s ease,
    border-color .2s,
    box-shadow .2s;
}

.level::after{
  content:"";
  position:absolute;
  left:-100%;
  top:0;
  width:60%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );
  transform:skewX(-20deg);
  transition:left .4s;
}

.level:hover{
  border-color:#00eaff;
  box-shadow:0 0 20px #00eaff16;
  transform:translateY(-2px);
}

.level:hover::after{
  left:140%;
}

.level:active{
  transform:scale(.96);
}

.levelStatus{
  float:right;
  font-size:21px;
}

.levelName{
  font-weight:1000;
  font-size:clamp(14px,3.5vw,18px);
  padding-right:28px;
}

.levelInfo{
  margin-top:6px;
  font-size:12px;
  opacity:.65;
}

#achBtn{
  position:relative;
  width:min(720px,100%);
  min-height:50px;
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:linear-gradient(135deg,#282f61,#171c3d);
  border:2px solid #465585;
  font-weight:1000;
  transition:.2s;
}

#achBtn:hover{
  border-color:#ffdc3d;
  box-shadow:0 0 25px #ffdc3d18;
  transform:translateY(-2px);
}

/* =========================
   OVERLAYS
========================= */

#achievements,
#pause,
#finish{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
}

.panel{
  width:min(590px,100%);
  max-height:min(90vh,720px);
  overflow:auto;
  padding:21px;
  border-radius:21px;
  border:2px solid #405084;
  background:
    radial-gradient(circle at 50% 0%,#1b2350,#0d1129 65%);
  box-shadow:
    0 0 50px #00eaff18,
    inset 0 0 30px #ffffff03;
  animation:panelIn .22s ease-out;
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.96);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.panel h2{
  margin-top:0;
  text-align:center;
}

.panel button{
  width:100%;
  min-height:47px;
  margin-top:9px;
  padding:12px;
  border-radius:12px;
  background:#29345f;
  font-weight:900;
  border:1px solid #455487;
  transition:.15s;
}

.panel button:hover{
  background:#354476;
  transform:translateY(-1px);
}

.ach{
  margin:8px 0;
  padding:13px;
  border-radius:13px;
  background:#171d3b;
  opacity:.35;
  border:1px solid transparent;
  transition:.2s;
}

.ach.on{
  opacity:1;
  border-color:#00eaff;
  box-shadow:0 0 18px #00eaff12;
}

/* =========================
   GAME
========================= */

#game{
  position:fixed;
  inset:0;
  display:none;
  touch-action:none;
  overscroll-behavior:none;
}

canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:4;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

.hudLine{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(12px,2.8vw,17px);
  font-weight:900;
}

.hudBar{
  height:9px;
  margin-top:7px;
  overflow:hidden;
  border-radius:20px;
  background:#0009;
}

#gameBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00eaff,#9d6cff,#ff35d7);
  box-shadow:0 0 14px #00eaff;
  transition:width .1s linear;
}

.gameButtons{
  position:absolute;
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  z-index:10;
  display:flex;
  gap:7px;
}

.gameButtons button{
  min-width:44px;
  min-height:44px;
  padding:8px 11px;
  border-radius:11px;
  background:#10162ddd;
  border:1px solid #53618e;
  transition:.15s;
}

.gameButtons button:hover{
  border-color:#00eaff;
  box-shadow:0 0 14px #00eaff18;
}

#dashHint{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  pointer-events:none;
  padding:8px 13px;
  border-radius:20px;
  background:#0007;
  border:1px solid #ffffff20;
  color:#fff;
  opacity:0;
  transition:opacity .4s;
  font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){
  #levels{
    grid-template-columns:1fr;
  }
}

@media(min-width:1000px){
  #levels{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-height:500px){
  .logo{
    margin:4px 0;
    font-size:32px;
  }

  .subtitle{
    margin-bottom:8px;
  }

  .progress{
    padding:9px;
    margin-bottom:8px;
  }

  .level{
    min-height:67px;
  }

  #achBtn{
    margin-top:8px;
  }

  #dashHint{
    bottom:8px;
  }
}
</style>
</head>

<body>

<div id="menu">

  <div class="logo">NEON DASH</div>

  <div class="subtitle">
    ULTIMATE EDITION • DOTKNIJ / KLIKNIJ / SPACJA
  </div>

  <div class="progress">
    <div class="progressTop">
      <span>📊 PROGRES GRY</span>
      <span id="progressText">0%</span>
    </div>

    <div class="bar">
      <div id="menuBar"></div>
    </div>

    <div id="doneText">0 / 12 poziomów</div>
  </div>

  <div id="levels"></div>

  <button id="achBtn">🏆 ACHIEVEMENTY</button>

</div>

<div id="achievements">
  <div class="panel">
    <h2>🏆 ACHIEVEMENTY</h2>
    <div id="achList"></div>
    <button id="closeAch">ZAMKNIJ</button>
  </div>
</div>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hudLine">
      <span id="levelName">LEVEL</span>
      <span id="coins">🪙 0/3</span>
      <span id="percent">0%</span>
    </div>

    <div class="hudBar">
      <div id="gameBar"></div>
    </div>
  </div>

  <div class="gameButtons">
    <button id="pauseBtn">⏸</button>
    <button id="restartBtn">↻</button>
    <button id="soundBtn">🔊</button>
    <button id="menuBtn">☰</button>
  </div>

  <div id="dashHint">⚡ PODWÓJNE TAPNIĘCIE = DASH</div>

  <div id="pause">
    <div class="panel">
      <h2>⏸ PAUZA</h2>
      <button id="resume">▶ WRÓĆ DO GRY</button>
      <button id="pauseRestart">↻ RESTART</button>
      <button id="pauseMenu">☰ MENU</button>
    </div>
  </div>

  <div id="finish">
    <div class="panel">
      <h2 id="finishTitle">🎉 UKOŃCZONO!</h2>
      <p id="finishInfo"></p>
      <button id="again">🔄 ZAGRAJ PONOWNIE</button>
      <button id="nextLevel">➡️ NASTĘPNY POZIOM</button>
      <button id="finishMenu">☰ MENU</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* =====================================================
   LEVELS
===================================================== */

const LEVELS=[
 {
  name:"NEON RUSH",
  diff:"⭐⭐",
  speed:280,
  color:"#00eaff",
  bpm:124,
  wave:"square",
  notes:[262,330,392,523,392,330,294,330],
  gravity:1
 },
 {
  name:"CRYSTAL DRIVE",
  diff:"⭐⭐⭐",
  speed:295,

  bpm:112,

  notes:[196,247,294,370,494,370,294,247],
  gravity:1
 },
 {
  name:"LAVA PULSE",
  diff:"⭐⭐⭐⭐",
  speed:310,
  color:"#ff4d42",
  bpm:140,

 },
 {

 },

  gravity:1
 },
 {
  name:"SHADOW FACTORY",
  diff:"⭐⭐⭐⭐⭐",
  speed:325,
  color:"#b44cff",
  bpm:118,
  wave:"square",
  notes:[147,174,220,207,147,174,233,220],
  gravity:1
 },
 {
  name:"CYBER STORM",
  diff:"⭐⭐⭐⭐⭐",
  speed:335,
  color:"#27f0c5",
  bpm:136,
  wave:"triangle",
  notes:[165,220,277,330,440,330,277,220],
  gravity:1
 },
 {
  name:"INFERNO CORE",
  diff:"⭐⭐⭐⭐⭐",
  speed:345,
  color:"#ff7338",
  bpm:145,
  wave:"sawtooth",
  notes:[98,123,147,196,147,123,110,98],
  gravity:1
 },
 {
  name:"ELECTRIC VOID",
  diff:"⭐⭐⭐⭐⭐⭐",
  speed:355,
  color:"#35b7ff",
  bpm:150,
  wave:"square",
  notes:[220,330,440,659,523,440,330,247],
  gravity:1
 },
 {
  name:"GRAVITY BREAK",
  diff:"⭐⭐⭐⭐⭐⭐",
  speed:340,
  color:"#45ff9a",
  bpm:142,
  wave:"triangle",
  notes:[196,247,330,392,494,392,330,247],
  gravity:-1
 },
 {
  name:"OVERDRIVE",
  diff:"⭐⭐⭐⭐⭐⭐",
  speed:365,
  color:"#ff3bea",
  bpm:154,
  wave:"square",
  notes:[247,330,440,523,659,523,440,330],
  gravity:1
 },
 {
  name:"FINAL CHAOS",
  diff:"⭐⭐⭐⭐⭐⭐",
  speed:375,
  color:"#ff247f",
  bpm:158,
  wave:"sawtooth",
  notes:[220,330,440,659,523,784,659,440],
  gravity:1
 }
];

/* =====================================================
   DOM
===================================================== */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const levelsBox=document.getElementById("levels");
const achievements=document.getElementById("achievements");
const achList=document.getElementById("achList");

const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

const levelName=document.getElementById("levelName");
const coinsText=document.getElementById("coins");
const percent=document.getElementById("percent");
const menuBar=document.getElementById("menuBar");
const gameBar=document.getElementById("gameBar");
const progressText=document.getElementById("progressText");
const doneText=document.getElementById("doneText");
const dashHint=document.getElementById("dashHint");

/* =====================================================
   STORAGE
===================================================== */

function get(key,def){
  try{
    const value=localStorage.getItem(key);
    return value===null?def:value;
  }catch(e){
    return def;
  }
}

function set(key,value){
  try{
    localStorage.setItem(key,String(value));
  }catch(e){}
}

function completed(i){
  return get("nd_level_"+i,"0")==="1";
}

function completedCount(){
  let n=0;

  for(let i=0;i<LEVELS.length;i++){
    if(completed(i)) n++;
  }

  return n;
}

/* =====================================================
   ACHIEVEMENTS
===================================================== */

const ACH=[
 ["first","🎮 Pierwszy krok","Ukończ poziom 1."],
 ["three","⚡ Rozgrzewka","Ukończ 3 poziomy."],
 ["six","🔥 Weteran","Ukończ 6 poziomów."],
 ["all","👑 Mistrz Neon Dash","Ukończ wszystkie poziomy."],
 ["final","💀 Chaos pokonany","Ukończ FINAL CHAOS."],
 ["coins10","🪙 Łowca monet","Zbierz 10 monet."],
 ["coins25","💰 Kolekcjoner","Zbierz 25 monet."],
 ["perfect","💎 Perfekcja","Ukończ poziom bez śmierci."],
 ["survivor","🛡️ Twardziel","Ukończ poziom po 3+ śmierciach."],
 ["allcoins","🌟 Pełna kolekcja","Zbierz wszystkie 3 monety w jednym przejściu."],
 ["dasher","⚡ Sprinter","Użyj dasha 10 razy."],
 ["checkpoint","🚩 Ratunek","Aktywuj checkpoint."],
 ["gravity","🌀 Odwrócony świat","Użyj portalu grawitacyjnego."]
];

function achUnlocked(id){
  return get("nd_ach_"+id,"0")==="1";
}

function unlock(id){
  if(achUnlocked(id)) return;

  set("nd_ach_"+id,"1");
  renderAchievements();
}

function checkAchievements(){

  const n=completedCount();

  if(n>=1) unlock("first");
  if(n>=3) unlock("three");
  if(n>=6) unlock("six");
  if(n>=12) unlock("all");

  if(completed(11)) unlock("final");

  const total=Number(get("nd_totalCoins","0"));

  if(total>=10) unlock("coins10");
  if(total>=25) unlock("coins25");

  if(deaths===0) unlock("perfect");
  if(deaths>=3) unlock("survivor");

  if(runCoins===3) unlock("allcoins");

  if(totalDashes>=10) unlock("dasher");

  if(checkpointUsed) unlock("checkpoint");

  if(gravityUsed) unlock("gravity");
}

function renderAchievements(){

  achList.innerHTML="";

  ACH.forEach(a=>{

    const d=document.createElement("div");

    d.className=
      "ach"+
      (achUnlocked(a[0])?" on":"");

    d.innerHTML=
      "<b>"+a[1]+"</b><br>"+
      "<small>"+a[2]+"</small>";

    achList.appendChild(d);
  });
}

/* =====================================================
   MENU
===================================================== */

function renderMenu(){

  levelsBox.innerHTML="";

  LEVELS.forEach((l,i)=>{

    const b=document.createElement("button");

    b.type="button";
    b.className="level";

    b.innerHTML=
      '<span class="levelStatus">'+
      (completed(i)?"✅":"▶️")+
      '</span>'+
      '<div class="levelName">'+
      (i+1)+". "+l.name+
      '</div>'+
      '<div class="levelInfo">'+
      l.diff+
      " • "+
      l.speed+
      " px/s"+
      '</div>';

    b.addEventListener("click",e=>{

      e.preventDefault();
      e.stopPropagation();

      startLevel(i,true);
    });

    levelsBox.appendChild(b);
  });

  const done=completedCount();

  const p=Math.round(
    done/LEVELS.length*100
  );

  progressText.textContent=p+"%";
  menuBar.style.width=p+"%";

  doneText.textContent=
    done+" / "+
    LEVELS.length+
    " poziomów";
}

document.getElementById("achBtn")
.addEventListener("click",()=>{
  achievements.style.display="flex";
  renderAchievements();
});

document.getElementById("closeAch")
.addEventListener("click",()=>{
  achievements.style.display="none";
});

/* =====================================================
   CANVAS
===================================================== */

let W=window.innerWidth;
let H=window.innerHeight;
let ground=H*.78;

function resize(){

  W=Math.max(240,window.innerWidth);
  H=Math.max(240,window.innerHeight);

  const d=Math.min(
    Math.max(window.devicePixelRatio||1,1),
    2
  );

  canvas.width=Math.round(W*d);
  canvas.height=Math.round(H*d);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(d,0,0,d,0,0);

  ground=Math.max(
    150,
    Math.min(H-50,H*.78)
  );

  if(!running){
    player.y=
      gravityDirection===1?
      ground-player.size:
      0;
  }

  createStars();
}

/* =====================================================
   PLAYER
===================================================== */

const player={
  x:150,
  y:0,
  size:34,
  vy:0,
  rot:0,
  grounded:false,
  dash:false,
  dashTime:0,
  dashCooldown:0
};

/* =====================================================
   GAME STATE
===================================================== */

let current=0;
let running=false;
let paused=false;
let finished=false;
let dying=false;

let world=0;
let last=0;
let raf=0;

let deaths=0;
let runCoins=0;

let collected=new Set();

let obstacles=[];
let coinObjects=[];
let pads=[];
let portals=[];
let checkpoints=[];
let particles=[];
let stars=[];
let trail=[];

let shake=0;
let flash=0;

let gravityDirection=1;

let checkpointWorld=0;
let checkpointUsed=false;

let gravityUsed=false;

let totalDashes=
  Number(get("nd_totalDashes","0"));

let lastTap=0;

/* =====================================================
   AUDIO
===================================================== */

let audio=null;
let musicTimer=null;
let musicIndex=0;

let sound=
  get("nd_sound","1")==="1";

function initAudio(){

  try{

    if(!audio){

      const AudioContext=
        window.AudioContext||
        window.webkitAudioContext;

      if(!AudioContext)
        return false;

      audio=new AudioContext();
    }

    return true;

  }catch(e){
    return false;
  }
}

async function unlockAudio(){

  if(!initAudio())
    return false;

  try{

    if(audio.state==="suspended")
      await audio.resume();

    return audio.state==="running";

  }catch(e){
    return false;
  }
}

function playTone(
  frequency,
  duration,
  type="square",
  volume=.035
){

  if(
    !audio||
    !sound||
    audio.state!=="running"
  ) return;

  try{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type=type;
    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
      .0001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      audio.currentTime+.012
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    osc.stop(
      audio.currentTime+
      duration+.02
    );

  }catch(e){}
}

function startMusic(){

  stopMusic();

  if(
    !sound||
    !audio||
    audio.state!=="running"
  ) return;

  const l=LEVELS[current];

  musicIndex=0;

  function note(){

    if(
      !sound||
      !running||
      paused||
      !audio||
      audio.state!=="running"
    ) return;

    const f=
      l.notes[
        musicIndex%l.notes.length
      ];

    playTone(
      f,
      .13,
      l.wave,
      .028
    );

    musicIndex++;
  }

  note();

  musicTimer=setInterval(
    note,
    Math.max(80,60000/l.bpm)
  );
}

function stopMusic(){

  if(musicTimer){

    clearInterval(musicTimer);
    musicTimer=null;
  }
}

function playJumpSound(){

}

function playCoinSound(){

}

/* =====================================================
   START LEVEL
===================================================== */

async function startLevel(index,newRun=true){

  if(
    index<0||
    index>=LEVELS.length
  ) return;

  current=index;

  if(newRun){

    deaths=0;
    runCoins=0;
    collected=new Set();

    checkpointWorld=0;
    checkpointUsed=false;

    gravityUsed=false;
  }

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){
    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="block";
  menu.style.display="none";

  pause.style.display="none";
  finish.style.display="none";

  world=
    newRun?
    0:
    checkpointWorld;

  last=performance.now();

  particles=[];
  trail=[];

  shake=0;
  flash=0;

  gravityDirection=
    newRun?
    LEVELS[current].gravity:
    gravityDirection;

  player.dash=false;
  player.dashTime=0;
  player.dashCooldown=0;

  resetPlayer();

  generateLevel();
  createStars();

  levelName.textContent=
    (current+1)+" • "+LEVELS[current].name;

  coinsText.textContent=
    "🪙 "+runCoins+"/3";

  running=true;

  dashHint.style.opacity=
    newRun&&current===0?
    "1":
    "0";

  draw();

  raf=requestAnimationFrame(loop);

  if(sound){

    const ok=await unlockAudio();

    if(ok&&running&&!paused)
      startMusic();
  }
}

function resetPlayer(){

  player.x=Math.max(
    75,
    Math.min(180,W*.22)
  );

  player.y=
    gravityDirection===1?
    ground-player.size:
    0;

  player.vy=0;
  player.rot=0;
  player.grounded=true;
}

/* =====================================================
   LEVEL GENERATOR
===================================================== */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];
  checkpoints=[];

  const length=
    11500+
    current*700;

  let x=650;

  const patterns=[
    "spike",
    "double",
    "saw",
    "gap",
    "pad",
    "spikeSaw",
    "speed",
    "double",
    "checkpoint",
    "gap",
    "gravity",
    "triple",
    "saw",
    "dashWall"
  ];

  let p=0;

  while(x<length){

    const type=
      patterns[p%patterns.length];

    if(type==="spike"){
      spike(x);
      x+=430;

    }else if(type==="double"){
      spike(x);
      spike(x+65);
      x+=520;

    }else if(type==="triple"){
      spike(x);
      spike(x+65);
      spike(x+130);
      x+=620;

    }else if(type==="saw"){
      saw(x);
      x+=520;

    }else if(type==="spikeSaw"){
      spike(x);
      saw(x+230);
      x+=650;

    }else if(type==="gap"){
      gap(x,150);
      x+=630;

    }else if(type==="pad"){
      pad(x);
      spike(x+190);
      x+=600;

    }else if(type==="speed"){
      speedPortal(x,1.2);
      spike(x+250);
      saw(x+480);
      x+=760;

    }else if(type==="checkpoint"){
      checkpoint(x);
      spike(x+240);
      x+=720;

    }else if(type==="gravity"){
      gravityPortal(x);
      spike(x+280);
      spike(x+345);
      x+=720;

    }else if(type==="dashWall"){
      dashWall(x);
      x+=700;
    }

    p++;
  }

  const positions=[
    length*.25,
    length*.52,
    length*.79
  ];

  positions.forEach((cx,i)=>{

    let finalX=cx;

    for(let a=0;a<50;a++){

      let bad=false;

      for(const o of obstacles){

        if(o.type==="gap"){

          if(
            finalX>o.x-100&&
            finalX<o.x+o.w+100
          ){
            bad=true;
            break;
          }

        }else{

          if(
            Math.abs(finalX-o.x)<120
          ){
            bad=true;
            break;
          }
        }
      }

      if(!bad) break;

      finalX+=110;
    }

    coinObjects.push({
      id:i,
      x:finalX,
      collected:collected.has(i)
    });
  });
}

/* =====================================================
   OBJECTS
===================================================== */

function spike(x){
  obstacles.push({
    type:"spike",
    x
  });
}

function saw(x){
  obstacles.push({
    type:"saw",
    x,
    r:28
  });
}

function gap(x,w){
  obstacles.push({
    type:"gap",
    x,
    w
  });
}

function pad(x){
  pads.push({
    x,
    used:false
  });
}

function speedPortal(x,mult){
  portals.push({
    type:"speed",
    x,
    mult,
    used:false
  });
}

function gravityPortal(x){
  portals.push({
    type:"gravity",
    x,
    used:false
  });
}

function checkpoint(x){
  checkpoints.push({
    x,
    active:false
  });
}

function dashWall(x){
  obstacles.push({
    type:"dashWall",
    x,
    w:34,
    h:120
  });
}

/* =====================================================
   INPUT
===================================================== */

function jump(){

  if(
    !running||
    paused||
    dying||
    finished
  ) return;

  if(player.grounded){

    player.vy=
      -730*gravityDirection;

    player.grounded=false;

    particlesJump();

    playJumpSound();

    shake=3;
  }
}

function dash(){

  if(
    !running||
    paused||
    dying||
    finished||
    player.dashCooldown>0
  ) return;

  player.dash=true;
  player.dashTime=.18;
  player.dashCooldown=.8;

  totalDashes++;

  set("nd_totalDashes",totalDashes);

  playDashSound();

  shake=5;

  for(let i=0;i<15;i++){

    particle(
      player.x+17,
      player.y+17,
      -Math.random()*500,
      (Math.random()-.5)*250,
      .35,
      Math.random()*6+2,
      "dash"
    );
  }
}

game.addEventListener(

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  let speed=
    LEVELS[current].speed;

  for(const p of portals){

    if(
      p.type==="speed"&&
      world+player.x>p.x&&
      world+player.x<p.x+180
    ){

      speed*=p.mult;
    }
  }

  if(player.dash){

    speed*=2.7;

    player.dashTime-=dt;

    if(player.dashTime<=0)
      player.dash=false;
  }

  if(player.dashCooldown>0)
    player.dashCooldown-=dt;

  world+=speed*dt;

  const g=
    2100*gravityDirection;

  player.vy+=g*dt;
  player.y+=player.vy*dt;

  if(gravityDirection===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*(Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8;
    }

  }else{

    if(
      player.y<=0&&
      !gapUnder()
    ){

      player.y=0;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;
    }
  }

  checkPads();
  checkPortals();
  checkCheckpoints();
  checkCoins();

  collisions();

  if(
    Math.random()<.9
  ){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.35,
      size:player.dash?25:18
    });
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){

    shake-=dt*13;

    if(shake<0)
      shake=0;
  }

  if(flash>0){

    flash-=dt*3;

    if(flash<0)
      flash=0;
  }
}

function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;

  for(const o of obstacles){

    if(
      o.type==="gap"&&
      center>o.x&&
      center<o.x+o.w
    ){

      return true;
    }
  }

  return false;
}

/* =====================================================
   MECHANICS
===================================================== */

function checkPads(){

  for(const p of pads){

    if(p.used) continue;

    const px=
      world+
      player.x+17;

    if(
      px>p.x&&
      px<p.x+50&&
      player.grounded
    ){

      p.used=true;

      player.vy=
        -1000*gravityDirection;

      player.grounded=false;

      particlesPad(p.x-world);

      shake=5;
    }
  }
}

function checkPortals(){

  for(const p of portals){

    if(p.used) continue;

    const px=
      world+
      player.x+17;

    if(
      px>p.x&&
      px<p.x+55
    ){

      p.used=true;

      if(p.type==="gravity"){

        gravityDirection*=-1;

        gravityUsed=true;

        particlesPortal(p.x-world);

        player.vy=0;
        player.grounded=false;

        shake=7;
      }
    }
  }
}

function checkCheckpoints(){

  for(const c of checkpoints){

    if(c.active) continue;

    const px=
      world+
      player.x+17;

    if(
      px>c.x&&
      px<c.x+70
    ){

      c.active=true;

      checkpointWorld=world;

      checkpointUsed=true;

      playCheckpointSound();

      for(let i=0;i<35;i++){

        particle(
          c.x-world,
          ground-65,
          (Math.random()-.5)*300,
          -Math.random()*300,
          .8,
          4,
          "checkpoint"
        );
      }
    }
  }
}

function checkCoins(){

  for(const c of coinObjects){

    if(c.collected) continue;

    const cx=c.x-world;

    const cy=
      gravityDirection===1?
      ground-125:
      125;

    const px=player.x+17;
    const py=player.y+17;

    if(
      Math.hypot(
        px-cx,
        py-cy
      )<38
    ){

      c.collected=true;

      collected.add(c.id);

      runCoins=collected.size;

      coinsText.textContent=
        "🪙 "+runCoins+"/3";

      particlesCoin(cx,cy);

      playCoinSound();

      shake=3;
    }
  }
}

/* =====================================================
   COLLISIONS
===================================================== */

function collisions(){

  const px=world+player.x;
  const s=player.size;

  const left=px+6;
  const right=px+s-6;
  const top=player.y+6;
  const bottom=player.y+s-5;

  for(const o of obstacles){

    if(o.type==="spike"){

      if(
        gravityDirection===1&&
        right>o.x+7&&
        left<o.x+44&&
        bottom>ground-45
      ){

        if(!player.dash){
          die();
          return;
        }
      }

      if(
        gravityDirection===-1&&
        right>o.x+7&&
        left<o.x+44&&
        top<48
      ){

        if(!player.dash){
          die();
          return;
        }
      }
    }

    if(o.type==="saw"){

      const cx=o.x;

      const cy=
        gravityDirection===1?
        ground-o.r:
        o.r;

      const nx=Math.max(
        left,
        Math.min(cx,right)
      );

      const ny=Math.max(
        top,
        Math.min(cy,bottom)
      );

      const dx=cx-nx;
      const dy=cy-ny;

      if(
        dx*dx+dy*dy<
        (o.r-5)*(o.r-5)
      ){

        if(!player.dash){
          die();
          return;
        }
      }
    }

    if(o.type==="dashWall"){

      const x=o.x;

      if(
        right>x&&
        left<x+o.w&&
        bottom>ground-o.h
      ){

        if(!player.dash){
          die();
          return;
        }
      }
    }

    if(o.type==="gap"){

      const center=
        world+
        player.x+
        s/2;

      if(
        gravityDirection===1&&
        center>o.x&&
        center<o.x+o.w&&
        bottom>=ground-8
      ){

        die();
        return;
      }
    }
  }

  /*
    Falling outside the visible game area.
  */

  if(
    player.y>H+100||
    player.y<-100
  ){

    die();
  }
}

/* =====================================================
   DEATH
===================================================== */

function die(){

  if(
    dying||
    finished||
    !running
  ) return;

  dying=true;
  deaths++;

  running=false;

  shake=14;
  flash=1;

  playDeathSound();

  particlesDeath();

  setTimeout(()=>{

    if(!dying) return;

    dying=false;

    /*
      Checkpoint respawn.
    */

    startLevel(
      current,
      false
    );

  },650);
}

/* =====================================================
   WIN
===================================================== */

function checkWin(){

  const length=
    11500+
    current*700;

  if(world>=length)
    finishLevel();
}

function finishLevel(){

  if(finished) return;

  finished=true;
  running=false;

  stopMusic();

  set(
    "nd_level_"+current,
    "1"
  );

  const old=
    Number(
      get("nd_totalCoins","0")
    );

  set(
    "nd_totalCoins",
    old+runCoins
  );

  checkAchievements();

  particlesWin();

  document.getElementById(
    "finishTitle"
  ).textContent=
    "🎉 POZIOM UKOŃCZONY!";

  document.getElementById(
    "finishInfo"
  ).textContent=
    LEVELS[current].name+
    " • 🪙 "+runCoins+"/3"+
    " • ☠️ "+deaths+" śmierci";

  const next=
    document.getElementById("nextLevel");

  next.style.display=
    current<LEVELS.length-1?
    "block":
    "none";

  finish.style.display="flex";

  renderMenu();

  victoryAnimation();
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running) return;

  if(paused){

    last=time;

    raf=requestAnimationFrame(loop);

    return;
  }

  let dt=(time-last)/1000;

  if(!Number.isFinite(dt)||dt<0)
    dt=0;

  dt=Math.min(dt,.05);

  last=time;

  update(dt);
  draw();
  checkWin();

  if(running)
    raf=requestAnimationFrame(loop);
}

/* =====================================================
   DRAW
===================================================== */

function draw(){

  const l=LEVELS[current];

  ctx.clearRect(0,0,W,H);

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  const bg=
    ctx.createLinearGradient(0,0,0,H);

  bg.addColorStop(0,"#080b20");
  bg.addColorStop(.55,"#050717");
  bg.addColorStop(1,"#020207");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  drawStars();
  drawGrid();
  drawSpeedLines();

  ctx.fillStyle="#0a0c18";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle=l.color;
  ctx.lineWidth=3;
  ctx.shadowColor=l.color;
  ctx.shadowBlur=13;

  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(W,ground);
  ctx.stroke();

  ctx.shadowBlur=0;

  for(const o of obstacles){

    const x=o.x-world;

    if(x<-180||x>W+180)
      continue;

    if(o.type==="spike")
      drawSpike(x);

    if(o.type==="saw")
      drawSaw(x,o.r);

    if(o.type==="gap"){

      ctx.fillStyle="#010105";

      ctx.fillRect(
        x,
        ground,
        o.w,
        H-ground
      );

      ctx.fillStyle=l.color;
      ctx.globalAlpha=.18;

      ctx.fillRect(
        x,
        ground,
        3,
        H-ground
      );

      ctx.fillRect(
        x+o.w-3,
        ground,
        3,
        H-ground
      );

      ctx.globalAlpha=1;
    }

    if(o.type==="dashWall")
      drawDashWall(x,o);
  }

  for(const p of pads){

    const x=p.x-world;

    if(x>-80&&x<W+80)
      drawPad(x);
  }

  for(const p of portals){

    const x=p.x-world;

    if(x>-100&&x<W+100){

      if(p.type==="speed")
        drawSpeedPortal(x);
      else
        drawGravityPortal(x);
    }
  }

  for(const c of checkpoints){

    const x=c.x-world;

    if(x>-100&&x<W+100)
      drawCheckpoint(x,c);
  }

  for(const c of coinObjects){

    if(c.collected) continue;

    const x=c.x-world;

    if(x>-50&&x<W+50){

      drawCoin(
        x,
        gravityDirection===1?
        ground-125:
        125
      );
    }
  }

  drawTrail();

  if(!dying&&!finished)
    drawPlayer();

  drawParticles();

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(.5,flash*.5)+
      ")";

    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  const length=
    11500+
    current*700;

  const p=Math.min(
    100,
    Math.floor(world/length*100)
  );

  percent.textContent=p+"%";
  gameBar.style.width=p+"%";
}

/* =====================================================
   PLAYER
===================================================== */

let nextBlink=
  performance.now()+3000;

let blinkUntil=0;

function updateBlink(){

  const now=performance.now();

  if(now>=nextBlink){

    blinkUntil=now+120;

    nextBlink=
      now+
      2500+
      Math.random()*3000;
  }
}

function drawPlayer(){

  updateBlink();

  const color=
    LEVELS[current].color;

  const now=performance.now();

  const blinking=
    now<blinkUntil;

  ctx.save();

  ctx.translate(
    player.x+17,
    player.y+17
  );

  ctx.rotate(player.rot);

  /*
    Dash aura
  */

  if(player.dash){

    ctx.shadowColor=color;
    ctx.shadowBlur=35;

    ctx.globalAlpha=.28;

    ctx.fillStyle=color;

    ctx.fillRect(
      -25,
      -25,
      50,
      50
    );

    ctx.globalAlpha=1;
  }

  /*
    Square
  */

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.fillStyle=color;

  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );

  ctx.shadowBlur=0;

  /*
    eyes
  */

  ctx.fillStyle="#050510";

  if(blinking){

    ctx.fillRect(-11,-4,7,2);
    ctx.fillRect(4,-4,7,2);

  }else{

    ctx.fillRect(-10,-8,5,7);
    ctx.fillRect(5,-8,5,7);
  }

  ctx.restore();
}

/* =====================================================
   OBSTACLES
===================================================== */

function drawSpike(x){

  const c=LEVELS[current].color;

  ctx.save();

  ctx.fillStyle=c;
  ctx.shadowColor=c;
  ctx.shadowBlur=16;

  ctx.beginPath();

  if(gravityDirection===1){

    ctx.moveTo(x,ground);
    ctx.lineTo(x+23,ground-47);
    ctx.lineTo(x+46,ground);

  }else{

    ctx.moveTo(x,0);
    ctx.lineTo(x+23,47);
    ctx.lineTo(x+46,0);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.stroke();

  ctx.restore();
}

function drawSaw(x,r){

  const c=LEVELS[current].color;

  const cy=
    gravityDirection===1?
    ground-r:
    r;

  ctx.save();

  ctx.translate(x,cy);

  ctx.rotate(performance.now()/280);

  ctx.fillStyle=c;
  ctx.shadowColor=c;
  ctx.shadowBlur=17;

  const teeth=14;

  ctx.beginPath();

  for(let i=0;i<teeth*2;i++){

    const a=i*Math.PI/teeth;

    const rr=
      i%2===0?r:r*.7;

    const xx=Math.cos(a)*rr;
    const yy=Math.sin(a)*rr;

    if(i===0)
      ctx.moveTo(xx,yy);
    else
      ctx.lineTo(xx,yy);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawDashWall(x,o){

  const c="#ff3b70";

  const y=
    gravityDirection===1?
    ground-o.h:
    0;

  ctx.save();

  ctx.fillStyle=c;
  ctx.shadowColor=c;
  ctx.shadowBlur=20;

  ctx.fillRect(
    x,
    y,
    o.w,
    o.h
  );

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.strokeRect(
    x,
    y,
    o.w,
    o.h
  );

  ctx.fillStyle="#fff";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";

  ctx.fillText(
    "DASH",
    x+o.w/2,
    y+o.h/2
  );

  ctx.restore();
}

/* =====================================================
   COINS
===================================================== */

function drawCoin(x,y){

  const s=
    1+
    Math.sin(performance.now()/130)*.1;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.fillStyle="#ffd43b";

  ctx.beginPath();

  ctx.arc(
    0,0,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.fillStyle="#a56d00";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText("★",0,5);

  ctx.restore();
}

/* =====================================================
   PADS / PORTALS / CHECKPOINTS
===================================================== */

function drawPad(x){

  ctx.save();

  ctx.fillStyle="#49ff9a";
  ctx.shadowColor="#49ff9a";
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    x+25,
    ground-10,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.stroke();

  ctx.restore();
}

function drawSpeedPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  const pulse=
    Math.sin(performance.now()/120)*4;

  ctx.strokeStyle="#ffe14a";
  ctx.shadowColor="#ffe14a";
  ctx.shadowBlur=20;
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    28+pulse,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";

  ctx.fillText(
    ">>",
    0,
    7
  );

  ctx.restore();
}

function drawGravityPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  const pulse=
    Math.sin(performance.now()/140)*4;

  ctx.strokeStyle="#ff4be8";
  ctx.shadowColor="#ff4be8";
  ctx.shadowBlur=22;
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    29+pulse,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";
  ctx.font="bold 22px Arial";
  ctx.textAlign="center";

  ctx.fillText("↕",0,8);

  ctx.restore();
}

function drawCheckpoint(x,c){

  ctx.save();

  const color=
    c.active?
    "#49ff9a":
    "#ffe14a";

  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    x+20,
    ground-100
  );

  ctx.lineTo(
    x+20,
    ground
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    x+20,
    ground-98
  );

  ctx.lineTo(
    x+65,
    ground-82
  );

  ctx.lineTo(
    x+20,
    ground-66
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* =====================================================
   BACKGROUND
===================================================== */

function createStars(){

  stars=[];

  for(let i=0;i<80;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*Math.max(100,ground*.9),
      r:Math.random()*2+.5,
      v:Math.random()*.8+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="#fff";

  for(const s of stars){

    s.x-=s.v;

    if(s.x<0)
      s.x=W;

    ctx.globalAlpha=
      .25+s.r*.2;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const c=LEVELS[current].color;

  ctx.strokeStyle=c;
  ctx.globalAlpha=.08;

  const size=70;

  const off=
    -(world*.25)%size;

  for(let x=off;x<W;x+=size){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,ground);

    ctx.stroke();
  }

  for(let y=40;y<ground;y+=size){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const c=LEVELS[current].color;

  ctx.strokeStyle=c;
  ctx.globalAlpha=.12;
  ctx.lineWidth=2;

  const off=
    -(world*.8)%190;

  for(
    let x=off-190;
    x<W+190;
    x+=190
  ){

    const y=
      100+
      Math.abs(x*7)%
      Math.max(
        100,
        ground-150
      );

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+80,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

  for(let i=trail.length-1;i>=0;i--){

    trail[i].life-=dt;

    if(trail[i].life<=0)
      trail.splice(i,1);
  }

  if(trail.length>38){

    trail.splice(
      0,
      trail.length-38
    );
  }
}

function drawTrail(){

  const c=LEVELS[current].color;

  for(const t of trail){

    ctx.globalAlpha=
      Math.max(0,t.life/.35)*.35;

    ctx.fillStyle=c;

    ctx.shadowColor=c;
    ctx.shadowBlur=15;

    ctx.fillRect(
      t.x-t.size/2,
      t.y-t.size/2,
      t.size,
      t.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================
   PARTICLES
===================================================== */

function particle(
  x,y,vx,vy,life,size,type
){

  if(particles.length>320)
    return;

  particles.push({
    x,
    y,
    vx,
    vy,
    life,
    max:life,
    size,
    type,
    rot:Math.random()*6,
    spin:(Math.random()-.5)*10
  });
}

function particlesJump(){

  for(let i=0;i<10;i++){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*150,
      Math.random()*80,
      .4,
      3,
      "jump"
    );
  }
}

function particlesDeath(){

  for(let i=0;i<45;i++){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*500,
      (Math.random()-.6)*500,
      .9,
      Math.random()*7+2,
      "death"
    );
  }
}

function particlesCoin(x,y){

  for(let i=0;i<20;i++){

    particle(
      x,
      y,
      (Math.random()-.5)*250,
      (Math.random()-.7)*250,
      .7,
      Math.random()*5+2,
      "coin"
    );
  }
}

function particlesPad(x){

  for(let i=0;i<18;i++){

    particle(
      x,
      ground-15,
      (Math.random()-.5)*220,
      -Math.random()*220,
      .7,
      4,
      "pad"
    );
  }
}

function particlesPortal(x){

  for(let i=0;i<30;i++){

    particle(
      x,
      H*.48,
      (Math.random()-.5)*300,
      (Math.random()-.5)*300,
      .8,
      4,
      "portal"
    );
  }
}

function particlesWin(){

  for(let i=0;i<130;i++){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*700,
      (Math.random()-.8)*700,
      1.5+Math.random(),
      Math.random()*8+3,
      "win"
    );
  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=500*dt;

    p.rot+=p.spin*dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/p.max);

    let c=
      LEVELS[current].color;

    if(p.type==="coin")
      c="#ffd43b";

    if(p.type==="pad")
      c="#49ff9a";

    if(p.type==="portal")
      c="#ff4be8";

    if(p.type==="checkpoint")
      c="#ffe14a";

    if(p.type==="dash")
      c="#fff";

    if(p.type==="win"){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      c=
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ];
    }

    ctx.fillStyle=c;

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);

    ctx.shadowColor=c;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -p.size/2,
      -p.size/2,
      p.size,
      p.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!running) return;

  paused=!paused;

  pause.style.display=
    paused?"flex":"none";

  if(paused){

    stopMusic();

  }else{

    last=performance.now();

    if(sound){

      unlockAudio().then(()=>{

        if(running&&!paused)
          startMusic();
      });
    }
  }
}

document.getElementById("pauseBtn")
.addEventListener("click",e=>{

  e.stopPropagation();
  togglePause();
});

document.getElementById("resume")
.addEventListener("click",()=>{

  paused=false;

  pause.style.display="none";

  last=performance.now();

  if(sound){

    unlockAudio().then(()=>{

      if(running&&!paused)
        startMusic();
    });
  }
});

document.getElementById("pauseRestart")
.addEventListener("click",async()=>{

  await startLevel(current,true);
});

/* =====================================================
   MENU
===================================================== */

function goMenu(){

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){

    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="none";
  menu.style.display="flex";

  pause.style.display="none";
  finish.style.display="none";

  renderMenu();
  renderAchievements();
}

document.getElementById("menuBtn")
.addEventListener("click",e=>{

  e.stopPropagation();
  goMenu();
});

document.getElementById("pauseMenu")
.addEventListener(
  "click",
  goMenu
);

document.getElementById("finishMenu")
.addEventListener(
  "click",
  goMenu
);

document.getElementById("again")
.addEventListener(
  "click",
  async()=>{

    await startLevel(
      current,
      true
    );
  }
);

document.getElementById("nextLevel")
.addEventListener(
  "click",
  async()=>{

    if(current<LEVELS.length-1){

      await startLevel(
        current+1,
        true
      );
    }
  }
);

document.getElementById("restartBtn")
.addEventListener(
  "click",
  async e=>{

    e.stopPropagation();

    await startLevel(
      current,
      true
    );
  }
);

/* =====================================================
   SOUND
===================================================== */

function updateSound(){

  document.getElementById(
    "soundBtn"
  ).textContent=
    sound?"🔊":"🔇";
}

document.getElementById("soundBtn")
.addEventListener(
  "click",
  async e=>{

    e.stopPropagation();

    sound=!sound;

    set(
      "nd_sound",
      sound?"1":"0"
    );

    updateSound();

    if(
      sound&&
      running&&
      !paused
    ){

      const ok=
        await unlockAudio();

      if(ok)
        startMusic();

    }else{

      stopMusic();
    }
  }
);

/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden&&
      running&&
      !paused
    ){

      paused=true;

      pause.style.display="flex";

      stopMusic();
    }
  }
);

window.addEventListener(
  "blur",
  ()=>{

    if(
      running&&
      !paused
    ){

      paused=true;

      pause.style.display="flex";

      stopMusic();
    }
  }
);

/* =====================================================
   VICTORY
===================================================== */

function victoryAnimation(){

  let frames=0;

  function anim(){

    if(!finished)
      return;

    updateParticles(.016);
    draw();

    frames++;

    if(frames<120)
      requestAnimationFrame(anim);
  }

  requestAnimationFrame(anim);
}

/* =====================================================
   INIT
===================================================== */

resize();
renderMenu();
renderAchievements();
updateSound();

</script>
