<script>

/* =========================================================
   POZIOMY
========================================================= */

const levels=[
  ["NEON RUSH","#00ffff",5.8,7000],
  ["CRYSTAL DRIVE","#6fa8ff",6.0,7300],
  ["LAVA PULSE","#ff482e",6.2,7600],
  ["SKY CIRCUIT","#75ff70",6.4,7900],
  ["VIOLET RUN","#c86cff",6.6,8200],
  ["SHADOW FACTORY","#aaaabb",6.8,8500],
  ["CYBER STORM","#00aaff",7.0,8800],
  ["INFERNO CORE","#ff7800",7.2,9000],
  ["ELECTRIC VOID","#eeff00",7.4,9200],
  ["GRAVITY BREAK","#ff35bb",7.6,9400],
  ["OVERDRIVE","#00ff88",7.8,9600],
  ["FINAL CHAOS","#ffffff",8.0,10000]
];


/* =========================================================
   ZAPIS
========================================================= */

let completed=
  JSON.parse(
    localStorage.getItem(
      "nd_completed"
    )||"[]"
  );

let levelCoins=
  JSON.parse(
    localStorage.getItem(
      "nd_coins"
    )||"[]"
  );

let sound=
  localStorage.getItem(
    "nd_sound"
  )!=="off";

if(!Array.isArray(completed))
  completed=[];

if(!Array.isArray(levelCoins))
  levelCoins=[];


function save(){

  localStorage.setItem(
    "nd_completed",
    JSON.stringify(completed)
  );

  localStorage.setItem(
    "nd_coins",
    JSON.stringify(levelCoins)
  );

  localStorage.setItem(
    "nd_sound",
    sound?"on":"off"
  );
}


function completedTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    if(completed[i])
      n++;
  }

  return n;
}


function coinsTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    n+=Number(
      levelCoins[i]||0
    );
  }

  return n;
}


/* =========================================================
   DOM
========================================================= */

const home=
  document.getElementById("home");

const game=
  document.getElementById("game");

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext("2d");

const pausePanel=
  document.getElementById("pausePanel");

const levelsPanel=
  document.getElementById("levelsPanel");

const deadPanel=
  document.getElementById("deadPanel");

const winPanel=
  document.getElementById("winPanel");

const levelList=
  document.getElementById("levelList");

const menuLevels=
  document.getElementById("menuLevels");

const completedCount=
  document.getElementById(
    "completedCount"
  );

const coinCount=
  document.getElementById(
    "coinCount"
  );

const barFill=
  document.getElementById(
    "barFill"
  );

const soundButton=
  document.getElementById(
    "soundButton"
  );

const mobileJump=
  document.getElementById(
    "mobileJump"
  );

const winInfo=
  document.getElementById(
    "winInfo"
  );

const nextLevelButton=
  document.getElementById(
    "nextLevelButton"
  );

const levelTitle=
  document.getElementById(
    "levelTitle"
  );

const speedText=
  document.getElementById(
    "speedText"
  );


/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;
let dpr=1;

function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  makeStars();
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   STAN
========================================================= */

let currentLevel=0;

let playing=false;
let paused=false;
let dead=false;
let won=false;

let progress=0;
let lastTime=0;

let obstacles=[];
let coins=[];
let particles=[];
let trail=[];
let stars=[];
let objects=[];

let collected=0;


/* =========================================================
   FIZYKA
========================================================= */

const player={

  x:120,

  y:0,

  size:32,

  vy:0,

  grounded:true,

  gravity:1,

  rotation:0,

  speedMultiplier:1,

  coyote:0
};


function ground(){

  return H*.78;
}


function playerFloor(){

  return player.gravity>0
    ? ground()-player.size
    : 70;
}


/* =========================================================
   LOSOWANIE DETERMINISTYCZNE
========================================================= */

function seededRandom(seed){

  const x=
    Math.sin(seed)*10000;

  return x-
    Math.floor(x);
}


/* =========================================================
   POZIOM
========================================================= */

function createLevel(){

  obstacles=[];
  coins=[];
  particles=[];
  trail=[];
  objects=[];

  progress=0;
  collected=0;

  player.gravity=1;
  player.speedMultiplier=1;
  player.vy=0;
  player.rotation=0;
  player.grounded=true;

  const length=
    levels[currentLevel][3];

  let x=450;

  let seed=
    currentLevel*937+41;


  /* =========================
     PRZESZKODY
  ========================= */

  while(
    x<length-500
  ){

    const r=
      seededRandom(seed++);

    const r2=
      seededRandom(seed++);


    if(r<.38){

      obstacles.push({

        type:"spike",

        x:x,

        w:38,

        h:40
      });

      if(
        r2<.28 &&
        x<length-800
      ){

        obstacles.push({

          type:"spike",

          x:x+43,

          w:38,

          h:40
        });

        x+=43;
      }

    }else if(r<.55){

      obstacles.push({

        type:"triple",

        x:x,

        w:125,

        h:40
      });

    }else if(r<.72){

      obstacles.push({

        type:"saw",

        x:x,

        w:48,

        h:48
      });

    }else if(r<.84){

      obstacles.push({

        type:"sawDouble",

        x:x,

        w:100,

        h:48
      });

    }else{

      obstacles.push({

        type:"gap",

        x:x,

        w:
          75+
          r2*45
      });
    }


    x+=
      300+
      r2*250;
  }


  /* =========================
     MONETY
  ========================= */

  const positions=[
    length*.27,
    length*.55,
    length*.80
  ];

  for(
    let i=0;
    i<3;
    i++
  ){

    coins.push({

      x:positions[i],

      y:
        ground()-
        105-
        (i===1?60:0),

      collected:false,

      r:11
    });
  }


  /* =========================
     JUMP PADY
  ========================= */

  const padPositions=[
    length*.17,
    length*.43,
    length*.68,
    length*.90
  ];

  for(
    let i=0;
    i<padPositions.length;
    i++
  ){

    objects.push({

      type:"pad",

      x:padPositions[i],

      power:
        15+
        i*.4,

      used:false
    });
  }


  /* =========================
     PORTALE PRĘDKOŚCI
  ========================= */

  const speedPositions=[
    length*.34,
    length*.58,
    length*.76
  ];

  for(
    let i=0;
    i<speedPositions.length;
    i++
  ){

    objects.push({

      type:"speed",

      x:speedPositions[i],

      multiplier:
        i%2===0
        ?1.25
        :0.82,

      used:false
    });
  }


  /* =========================
     PORTALE GRAWITACJI
  ========================= */

  if(currentLevel>=3){

    objects.push({

      type:"gravity",

      x:length*.46,

      used:false
    });

    objects.push({

      type:"gravity",

      x:length*.73,

      used:false
    });
  }


  resetPlayer();

  levelTitle.textContent=
    levels[currentLevel][0];

  updateSpeedText();

  barFill.style.width="0%";
}


function resetPlayer(){

  player.x=120;

  player.y=
    playerFloor();

  player.vy=0;

  player.grounded=true;

  player.gravity=1;

  player.speedMultiplier=1;

  player.rotation=0;

  player.coyote=0;
}


/* =========================================================
   GWIAZDY
========================================================= */

function makeStars(){

  stars=[];

  for(
    let i=0;
    i<110;
    i++
  ){

    stars.push({

      x:
        Math.random()*
        Math.max(W,1),

      y:
        Math.random()*
        Math.max(H*.7,1),

      r:
        .5+
        Math.random()*1.7,

      speed:
        .2+
        Math.random()*.8
    });
  }
}


/* =========================================================
   TŁO
========================================================= */

function drawBackground(){

  const color=
    levels[currentLevel][1];

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(
    0,
    "#11112d"
  );

  gradient.addColorStop(
    .65,
    "#050511"
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  for(const s of stars){

    let x=
      (
        s.x-
        progress*
        s.speed*
        .08
      )%
      (W+30);

    if(x<0)
      x+=W+30;

    ctx.fillStyle="#ffffff";

    ctx.globalAlpha=
      .2+
      s.speed*.4;

    ctx.beginPath();

    ctx.arc(
      x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;


  /* SIATKA */

  ctx.strokeStyle=
    color+"25";

  ctx.lineWidth=1;

  const g=ground();

  for(
    let x=0;
    x<W;
    x+=50
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      g
    );

    ctx.lineTo(
      W/2+
      (x-W/2)*.2,
      H
    );

    ctx.stroke();
  }


  for(
    let y=g;
    y<H;
    y+=35
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();
  }
}


/* =========================================================
   TEREN
========================================================= */

function drawGround(){

  const color=
    levels[currentLevel][1];

  const g=ground();

  ctx.fillStyle="#080812";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  if(player.gravity>0){

    ctx.fillStyle="#080812";

    ctx.fillRect(
      0,
      g,
      W,
      H-g
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=15;

    ctx.shadowColor=color;

    ctx.fillRect(
      0,
      g,
      W,
      3
    );

  }else{

    ctx.fillStyle="#080812";

    ctx.fillRect(
      0,
      0,
      W,
      70
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=15;

    ctx.shadowColor=color;

    ctx.fillRect(
      0,
      68,
      W,
      3
    );
  }

  ctx.shadowBlur=0;
}


/* =========================================================
   TRAIL
========================================================= */

function updateTrail(){

  trail.push({

    x:
      player.x+
      player.size/2,

    y:
      player.y+
      player.size/2,

    life:1
  });

  if(trail.length>14)
    trail.shift();
}


function drawTrail(){

  const color=
    levels[currentLevel][1];

  for(
    let i=0;
    i<trail.length;
    i++
  ){

    const t=
      trail[i];

    const alpha=
      i/
      trail.length*
      .35;

    ctx.globalAlpha=alpha;

    ctx.fillStyle=color;

    const size=
      5+
      i/trail.length*7;

    ctx.fillRect(
      t.x-size/2,
      t.y-size/2,
      size,
      size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   GRACZ
========================================================= */

function drawPlayer(){

  const color=
    levels[currentLevel][1];

  ctx.save();

  ctx.translate(
    player.x+
    player.size/2,

    player.y+
    player.size/2
  );

  ctx.rotate(
    player.rotation
  );

  ctx.shadowBlur=18;

  ctx.shadowColor=color;

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    -player.size/2,

  );

/* =========================================================
   PRZESZKODY
========================================================= */

function drawSpike(
  x,
  w,
  h
){

  const color=
    levels[currentLevel][1];

  ctx.fillStyle=color;

  ctx.shadowBlur=14;

  ctx.shadowColor=color;

  ctx.beginPath();

  ctx.moveTo(
    x,
    ground()
  );

  ctx.lineTo(
    x+w/2,
    ground()-h
  );

  ctx.lineTo(
    x+w,
    ground()
  );

  ctx.closePath();

  ctx.fill();
}


function drawSaw(
  cx,
  cy,
  size
){

  const color=
    levels[currentLevel][1];

  ctx.save();

  ctx.translate(
    cx,
    cy
  );

  ctx.rotate(
    progress*.012
  );

  ctx.fillStyle=color;

  ctx.shadowBlur=15;

  ctx.shadowColor=color;

  const teeth=14;

  ctx.beginPath();

  for(
    let i=0;
    i<teeth*2;
    i++
  ){

    const a=
      i*Math.PI/teeth;

    const r=
      i%2===0
      ?size/2
      :size*.34;

    const px=
      Math.cos(a)*r;

    const py=
      Math.sin(a)*r;

    if(i===0)
      ctx.moveTo(px,py);
    else
      ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#05050b";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


function drawObstacle(o){

  const color=
    levels[currentLevel][1];

  const x=
    o.x-progress;

  if(
    x<-150||
    x>W+150
  )return;

  ctx.save();


  if(o.type==="spike"){

    drawSpike(
      x,
      o.w,
      o.h
    );


  }else if(
    o.type==="triple"
  ){

    drawSpike(
      x,
      38,
      o.h
    );

    drawSpike(
      x+43,
      38,
      o.h
    );

    drawSpike(
      x+86,
      38,
      o.h
    );


  }else if(
    o.type==="saw"
  ){

    drawSaw(
      x+o.w/2,
      ground()-o.h/2,
      o.w
    );


  }else if(
    o.type==="sawDouble"
  ){

    drawSaw(
      x+24,
      ground()-24,
      48
    );

    drawSaw(
      x+76,
      ground()-24,
      48
    );


  }else if(
    o.type==="gap"
  ){

    ctx.fillStyle="#000";

    ctx.fillRect(
      x,
      ground(),
      o.w,
      H-ground()
    );

    ctx.strokeStyle=color;

    ctx.lineWidth=2;

    ctx.strokeRect(
      x,
      ground(),
      o.w,
      H-ground()
    );
  }

  ctx.restore();
}

/* =========================================================
   CZĄSTECZKI
========================================================= */

function spawnParticles(
  x,
  y,
  color,
  count
){

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        25+
        Math.random()*35,

      size:
        2+
        Math.random()*4,

      color:color
    });
  }
}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      .12*dt;

    p.life-=dt;

    if(
      p.life<=0
    ){

      particles.splice(
        i,
        1
      );
    }
  }
}


function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/60
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   AUDIO / MUZYKA
========================================================= */

let audio=null;
let musicTimer=null;
let musicStep=0;


function initAudio(){

  if(audio)
    return;

  try{

    audio=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

  }catch(e){}
}


function beep(
  freq,
  duration,
  volume=.035,
  type="square"
){

  if(!sound)
    return;

  initAudio();

  if(!audio)
    return;

  try{

    if(
      audio.state==="suspended"
    ){

      audio.resume();
    }

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type=type;

    osc.frequency.value=
      freq;

    gain.gain.value=
      volume;

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+
      duration
    );

    osc.stop(
      audio.currentTime+
      duration
    );

  }catch(e){}
}


function startMusic(){

  if(musicTimer)
    return;

  if(!sound)
    return;

  musicStep=0;

  musicTimer=
    setInterval(
      playMusicStep,
      250
    );
}


function playMusicStep(){

  if(
    !playing||
    paused||
    dead||
    won||
    !sound
  ){
    return;
  }

  const bases=[
    261.63,
    293.66,
    329.63,
    392.00,
    440.00,
    329.63,
    293.66,
    392.00
  ];

  const note=
    bases[
      musicStep%
      bases.length
    ];

  beep(
    note,
    .12,
    .018,
    "triangle"
  );

  if(
    musicStep%4===0
  ){

    beep(
      note/2,
      .16,
      .014,
      "sine"
    );
  }

  musicStep++;
}


function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}


function soundJump(){
  beep(650,.06,.035);
}


function soundCoin(){
  beep(900,.08,.04);
}

  beep(

    .05,
    "sawtooth"
  );
}


function soundWin(){

  beep(1000,.1,.04);

  setTimeout(

  );

  );

/* =========================================================
   KOLIZJE
========================================================= */

function updateCollisions(){

  const p={

    x:
      player.x+6,

    y:
      player.y+6,

    w:
      player.size-12,

    h:
      player.size-12
  };


  for(
    const o of obstacles
  ){

    const x=
      o.x-progress;


    /* SPIKE */

    if(
      o.type==="spike"
    ){

      const hit=

        p.x<
        x+o.w-5&&

        p.x+p.w>
        x+5&&

        (
          player.gravity>0
          ?
          p.y+p.h>
          ground()-o.h+10
          :
          p.y<
          70+o.h-10
        );

      if(hit){

        die();

        return;
      }
    }


    /* TRIPLE */

    else if(
      o.type==="triple"
    ){

      for(
        let i=0;
        i<3;
        i++
      ){

        const sx=
          x+i*43;

        if(
          p.x<
          sx+38&&

          p.x+p.w>
          sx+5&&

          p.y+p.h>
          ground()-o.h+10
        ){

          die();

          return;
        }
      }
    }


    /* SAW */

    else if(
      o.type==="saw"||
      o.type==="sawDouble"
    ){

      const count=
        o.type==="saw"
        ?1
        :2;

      for(
        let i=0;
        i<count;
        i++
      ){

        const cx=
          x+
          (
            o.type==="saw"
            ?o.w/2
            :24+i*52
          );

        const cy=
          ground()-24;

        const closestX=
          Math.max(
            p.x,
            Math.min(
              cx,
              p.x+p.w
            )
          );

        const closestY=
          Math.max(
            p.y,
            Math.min(
              cy,
              p.y+p.h
            )
          );

        const dx=
          cx-closestX;

        const dy=
          cy-closestY;

        if(
          dx*dx+
          dy*dy<
          21*21
        ){

          die();

          return;
        }
      }
    }


    /* GAP */

    else if(
      o.type==="gap"
    ){

      if(
        player.gravity>0&&
        player.grounded&&
        p.x<
        x+o.w&&
        p.x+p.w>
        x
      ){

        die();

        return;
      }
    }
  }


  /* MONETY */

  for(
    const c of coins
  ){

    if(c.collected)
      continue;

    const x=
      c.x-progress;

    const dx=
      player.x+
      player.size/2-
      x;

    const dy=
      player.y+
      player.size/2-
      c.y;

    if(
      dx*dx+
      dy*dy<
      (c.r+
      player.size*.45)*
      (c.r+
      player.size*.45)
    ){

      c.collected=true;

      collected++;

      spawnParticles(
        x,
        c.y,
        "#ffd900",
        15
      );

      soundCoin();
    }
  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!playing)
    return;

  if(paused)
    return;

  if(dead)
    return;

  if(won)
    return;


  const baseSpeed=
    levels[currentLevel][2];

  const length=
    levels[currentLevel][3];

  const speed=
    baseSpeed*
    player.speedMultiplier;


  progress+=
    speed*dt;


  if(
    progress>=length
  ){

    progress=length;

    win();

    return;
  }


  /* GRAVITACJA */

  player.vy+=
    .72*
    player.gravity*
    dt;

  player.y+=
    player.vy*dt;


  /* DÓŁ */

  if(
    player.gravity>0
  ){

    if(
      player.y+
      player.size>=
      ground()
    ){

      player.y=
        ground()-
        player.size;

      player.vy=0;

      if(!player.grounded)
        player.coyote=4;

      player.grounded=true;

    }else{

      if(player.grounded)
        player.coyote=4;

      player.grounded=false;
    }


    if(
      player.y>
      H+100
    ){

      die();

      return;
    }

  }


  /* GÓRA */

  else{

    if(
      player.y<=70
    ){

      player.y=70;

      player.vy=0;

      if(!player.grounded)
        player.coyote=4;

      player.grounded=true;

    }else{

      if(player.grounded)
        player.coyote=4;

      player.grounded=false;
    }


    if(
      player.y<
      -100
    ){

      die();

      return;
    }
  }


  if(
    player.coyote>0
  ){

    player.coyote-=dt;
  }


  /* ROTACJA */

  if(
    !player.grounded
  ){

    player.rotation+=
      .08*
      player.gravity*
      dt;

  }else{

    player.rotation=
      Math.round(
        player.rotation/
        (Math.PI/2)
      )*
      (Math.PI/2);
  }


  updateSpecialObjects();

  updateCollisions();

  updateParticles(dt);

  updateTrail();


  barFill.style.width=
    (
      progress/
      length*
      100
    )+
    "%";
}

/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!lastTime)
    lastTime=time;

  let dt=
    (time-lastTime)/
    16.6667;

  lastTime=time;

  dt=Math.min(
    dt,
    2
  );

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}

requestAnimationFrame(
  loop
);

  stopMusic();

  createLevel();

  lastTime=
    performance.now();

  startMusic();
}


/* =========================================================
   PAUZA
========================================================= */

function pauseGame(){

  if(!playing)
    return;

  playing=false;

  paused=true;

  stopMusic();

  pausePanel.style.display=
    "flex";
}


function resumeGame(){

  pausePanel.style.display=
    "none";

  if(
    !dead&&
    !won
  ){

    paused=false;

    playing=true;

    lastTime=
      performance.now();

    startMusic();
  }
}


/* =========================================================
   POZIOMY
========================================================= */

function openLevelSelector(){

  buildMenuLevels();

  levelsPanel.style.display=
    "flex";
}


function showLevels(){

  pausePanel.style.display=
    "none";

  winPanel.style.display=
    "none";

  deadPanel.style.display=
    "none";

  playing=false;

  paused=true;

  stopMusic();

  buildMenuLevels();

  levelsPanel.style.display=
    "flex";
}


function closeLevels(){

  levelsPanel.style.display=
    "none";

  if(
    game.style.display==="block"&&
    !dead&&
    !won
  ){

    paused=false;

    playing=true;

    lastTime=
      performance.now();

    startMusic();
  }
}


function buildMenuLevels(){

  menuLevels.innerHTML="";

  for(
    let i=0;
    i<levels.length;
    i++
  ){

    const unlocked=
      i===0||
      completed[i-1];

    const button=
      document.createElement(
        "button"
      );

    button.className=
      "levelButton "+
      (
        unlocked
        ?"unlocked"
        :"locked"
      );

    button.innerHTML=
      (i+1)+
      ". "+
      levels[i][0]+
      "<br><small>"+
      (
        unlocked
        ?"🪙 "+
        Number(
          levelCoins[i]||0
        )+
        "/3"
        :"🔒 ZABLOKOWANY"
      )+
      "</small>";


    if(unlocked){

      button.onclick=()=>{
        startLevel(i);
      };

    }else{

      button.onclick=()=>{

        alert(
          "Najpierw ukończ poprzedni poziom."
        );
      };
    }

    menuLevels.appendChild(
      button
    );
  }
}


/* =========================================================
   NASTĘPNY
========================================================= */

function nextLevel(){

  if(
    currentLevel<
    levels.length-1
  ){

    startLevel(
      currentLevel+1
    );

  }else{

    backHome();
  }
}


/* =========================================================
   MENU
========================================================= */

function backHome(){

  playing=false;

  paused=false;

  dead=false;

  won=false;

  stopMusic();

  game.style.display=
    "none";

  home.style.display=
    "block";

  pausePanel.style.display=
    "none";

  levelsPanel.style.display=
    "none";

  deadPanel.style.display=
    "none";

  winPanel.style.display=
    "none";

  updateHome();
}


/* =========================================================
   DŹWIĘK
========================================================= */

function toggleSound(){

  sound=!sound;

  soundButton.textContent=
    sound
    ?"🔊"
    :"🔇";

  save();

  if(sound){

    initAudio();

    startMusic();

    beep(
      700,
      .06
    );

  }else{

    stopMusic();
  }
}


/* =========================================================
   PEŁNY EKRAN
========================================================= */

async function toggleFullscreen(){

  try{

    if(!document.fullscreenElement){

      await document.documentElement
        .requestFullscreen();

    }else{

      await document.exitFullscreen();
    }

  }catch(e){}
}


/* =========================================================
   KLAWIATURA
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="Space"||
      e.code==="ArrowUp"||
      e.code==="KeyW"
    ){

      e.preventDefault();

      if(!e.repeat){

        jump();
      }
    }


    if(
      e.code==="Escape"
    ){

      if(
        game.style.display==="block"&&
        playing
      ){

        pauseGame();
      }
    }


    if(
      e.code==="KeyR"&&
      game.style.display==="block"
    ){

      restartLevel();
    }
  }
);


/* =========================================================
   MYSZ
========================================================= */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(
      e.pointerType==="mouse"||
      e.pointerType==="pen"
    ){

      jump();
    }
  }
);


/* =========================================================
   TELEFON
========================================================= */

mobileJump.addEventListener(
  "pointerdown",

    e.preventDefault();

    jump();
  }
);


canvas.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    jump();

  },

  }
);

   AUTO PAUZA
========================================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.hidden&&
      playing&&
      !dead&&
      !won
    ){

      pauseGame();
    }
  }
);


window.addEventListener(
  "blur",
  function(){

    if(
      playing&&
      !dead&&
      !won
    ){

      pauseGame();
    }

);

function updateHome(){

  completedCount.textContent=
    completedTotal()+
    "/12";

  coinCount.textContent=
    coinsTotal()+

  levelList.innerHTML="";


  for(

    i++
  ){

      i===0||

    const card=
      document.createElement(
        "div"
      );

    card.className=
      "levelCard "+
      (
        unlocked
        ?""
        :"locked"
      );

    card.style.borderColor=
      unlocked
      ?levels[i][1]+"77"
      :"";

    card.innerHTML=
      "<div style='color:"+
      levels[i][1]+
      "'>LEVEL "+
      (i+1)+
      "</div>"+

      "<div class='levelName'>"+
      levels[i][0]+
      "</div>"+

      "<div class='levelInfo'>"+
      (
        unlocked
        ?"🪙 "+
        Number(
          levelCoins[i]||0
        )+
        "/3"
        :"🔒 ZABLOKOWANY"
      )+
      "</div>";


    if(unlocked){

      card.onclick=()=>{

        home.style.display=

        game.style.display=

        );

}
