<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DASH</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#03030a;color:white;font-family:Arial,sans-serif;
}
button{font:inherit;color:white;border:0;cursor:pointer;touch-action:manipulation}
#menu{
  position:fixed;inset:0;overflow:auto;
  display:flex;flex-direction:column;align-items:center;
  padding:22px 14px 35px;
  background:radial-gradient(circle at 50% 5%,#252b78,#090a20 45%,#020207);
}
.logo{
  margin:15px 0 4px;font-size:clamp(34px,8vw,64px);
  font-weight:900;letter-spacing:5px;text-align:center;
  text-shadow:0 0 10px #00eaff,0 0 28px #00eaff,0 0 55px #a855ff;
}
.subtitle{opacity:.7;text-align:center;margin-bottom:18px}
.progress{
  width:min(720px,100%);padding:15px;border-radius:17px;
  background:#11152d;border:2px solid #303963;margin-bottom:15px;
}
.progressTop{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:13px;background:#050712;border-radius:20px;overflow:hidden;margin-top:8px}
#menuBar{height:100%;width:0;background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7)}
#doneText{text-align:center;opacity:.65;margin-top:7px}
#levels{
  width:min(720px,100%);
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
.level{
  min-height:82px;text-align:left;padding:12px;border-radius:15px;
  border:2px solid #303861;background:linear-gradient(135deg,#171c3b,#0d1024);
}
.level:active{transform:scale(.97)}
.levelStatus{float:right;font-size:20px}
.levelName{font-weight:900;font-size:17px;padding-right:25px}
.levelInfo{font-size:12px;opacity:.7;margin-top:5px}
.menuBtns{
  width:min(720px,100%);display:grid;
  grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;
}
.menuBtns button{
  min-height:48px;border-radius:13px;background:#242a50;
  border:2px solid #414d7c;font-weight:bold;
}
#achievements,#shop,#missions,#settings,#pause,#finish{
  position:fixed;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;background:#000b;padding:15px;
}
.panel{
  width:min(600px,100%);max-height:90vh;overflow:auto;
  background:#10142c;border:2px solid #3d4a7d;border-radius:20px;
  padding:20px;box-shadow:0 0 40px #00eaff22;
}
.panel h2{text-align:center;margin-top:0}
.panel button{
  width:100%;min-height:46px;margin-top:9px;padding:11px;
  border-radius:12px;background:#29335e;font-weight:bold;
}
.item{
  padding:12px;margin:8px 0;border-radius:12px;
  background:#191e3b;border:1px solid #303961;
}
.item.on{border-color:#00eaff}
#game{position:fixed;inset:0;display:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{
  position:absolute;z-index:5;left:10px;right:10px;top:10px;
  pointer-events:none;text-shadow:0 2px 5px #000;
}
.hudLine{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}
.hudBar{margin-top:7px;height:9px;background:#0008;border-radius:20px;overflow:hidden}
#gameBar{height:100%;width:0;background:#00eaff;box-shadow:0 0 12px #00eaff}
.gameButtons{
  position:absolute;right:10px;top:10px;z-index:10;
  display:flex;gap:7px;
}
.gameButtons button{
  min-width:44px;min-height:44px;padding:8px 11px;
  background:#10162ddd;border:1px solid #53618e;border-radius:10px;
}
#touchJump{
  position:absolute;z-index:9;right:20px;bottom:25px;
  width:90px;height:90px;border-radius:50%;
  background:#00eaff33;border:2px solid #00eaff;
  box-shadow:0 0 25px #00eaff55;
  font-size:30px;display:none;
}
@media(max-width:650px){
  #levels{grid-template-columns:1fr}
  .menuBtns{grid-template-columns:1fr}
}
</style>

</head>

<body>

<div id="menu">
  <div class="logo">NEON DASH</div>
  <div class="subtitle">Ultimate Edition • fizyka arcade</div>

  <div class="progress">
    <div class="progressTop">
      <span>📊 PROGRES</span>
      <span id="progressText">0%</span>
    </div>
    <div class="bar"><div id="menuBar"></div></div>
    <div id="doneText">0 / 20 poziomów</div>
  </div>

  <div id="levels"></div>

  <div class="menuBtns">
    <button id="randomBtn">🎲 LOSOWY</button>
    <button id="practiceBtn">🧪 PRACTICE</button>
    <button id="shopBtn">🎨 SKINY</button>
    <button id="missionsBtn">🎯 MISJE</button>
    <button id="achBtn">🏆 ACHIEVEMENTY</button>
    <button id="settingsBtn">⚙️ USTAWIENIA</button>
    <button id="resetBtn">🗑️ RESET</button>
    <button id="infoBtn">ℹ️ INFORMACJE</button>
  </div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hudLine">
      <span id="levelName">LEVEL</span>
      <span id="coins">🪙 0/3</span>
      <span id="percent">0%</span>
    </div>
    <div class="hudBar"><div id="gameBar"></div></div>
  </div>

  <div class="gameButtons">
    <button id="pauseBtn">⏸</button>
    <button id="restartBtn">🔄</button>
    <button id="soundBtn">🔊</button>
    <button id="menuBtn">☰</button>
  </div>

<button id="touchJump">▲</button>

  <div id="pause">
    <div class="panel">
      <h2>⏸ PAUZA</h2>
      <button id="resume">▶ WRÓĆ</button>
      <button id="pauseRestart">🔄 RESTART</button>
      <button id="pauseMenu">☰ MENU</button>
    </div>
  </div>

  <div id="finish">
    <div class="panel">
      <h2>🎉 UKOŃCZONO!</h2>
      <p id="finishInfo"></p>
      <button id="again">🔄 JESZCZE RAZ</button>
      <button id="finishMenu">☰ MENU</button>
    </div>
  </div>
</div>

<div id="achievements">
  <div class="panel">
    <h2>🏆 ACHIEVEMENTY</h2>
    <div id="achList"></div>
    <button class="closePanel">ZAMKNIJ</button>
  </div>
</div>

<div id="shop">
  <div class="panel">
    <h2>🎨 SKINY</h2>
    <div id="skinList"></div>
    <button class="closePanel">ZAMKNIJ</button>
  </div>
</div>

<div id="missions">
  <div class="panel">
    <h2>🎯 MISJE</h2>
    <div id="missionList"></div>
    <button class="closePanel">ZAMKNIJ</button>
  </div>
</div>

<div id="settings">
  <div class="panel">
    <h2>⚙️ USTAWIENIA</h2>
    <button id="toggleTouch"></button>
    <button id="toggleMusic"></button>
    <button id="toggleSfx"></button>
    <button id="settingsClose">ZAMKNIJ</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   POZIOMY
========================================================= */

const LEVELS=[
["NEON RUSH","#00eaff",275,12000,1,2],
["CRYSTAL DRIVE","#72a7ff",290,12600,1,3],
["LAVA PULSE","#ff5147",305,13200,1,4],
["SKY CIRCUIT","#9c7bff",300,13800,1,4],
["VIOLET RUN","#d35cff",315,14400,1,5],
["SHADOW FACTORY","#b44cff",325,15000,1,5],
["CYBER STORM","#27f0c5",335,15600,1,5],
["INFERNO CORE","#ff7338",345,16200,1,6],
["ELECTRIC VOID","#35b7ff",355,16800,1,6],
["GRAVITY BREAK","#45ff9a",350,17400,-1,6],
["OVERDRIVE","#ff3bea",365,18000,1,7],
["FINAL CHAOS","#ff247f",375,18600,1,7],
["NEON HYPER","#00ffbf",385,19200,1,7],
["DARK MATTER","#a96cff",395,19800,-1,8],
["PHANTOM RUSH","#4de8ff",405,20400,1,8],
["VOID STORM","#ff5bce",415,21000,-1,8],
["INFINITE CORE","#ffc34d",425,21600,1,9],
["CYBERFALL","#5cff72",435,22200,-1,9],
["ULTRA NOVA","#ff476f",445,22800,1,10],
["FINAL OVERDRIVE","#ffffff",455,24000,1,10]
].map((x,i)=>({
 name:x[0],color:x[1],speed:x[2],length:x[3],
 gravity:x[4],difficulty:x[5],index:i
}));

/* =========================================================
   SAVE
========================================================= */

const defaultSave={
 completed:[],
 coins:0,
 diamonds:0,
 stars:0,
 deaths:0,
 skin:0,
 music:true,
 sfx:true,
 touch:"ontouchstart" in window,
 achievements:[],
 missionCoins:0,
 missionDeaths:0
};

let save;

try{
 save=JSON.parse(localStorage.getItem("neonDashSave"))||structuredClone(defaultSave);
}catch(e){
 save=structuredClone(defaultSave);
}

function saveGame(){
 try{
   localStorage.setItem("neonDashSave",JSON.stringify(save));
 }catch(e){}
}

/* =========================================================
   DOM
========================================================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const levelsBox=document.getElementById("levels");
const achievements=document.getElementById("achievements");
const shop=document.getElementById("shop");
const missions=document.getElementById("missions");
const settings=document.getElementById("settings");
const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

let W=innerWidth;
let H=innerHeight;
let ground=H*.78;

/* =========================================================
   PLAYER — FIZYKA GD-STYLE
========================================================= */

const PLAYER_SIZE=36;

/*
  Najważniejsze parametry fizyki.
  Ruch jest liczony niezależnie od FPS.
*/

const PHYSICS={
 gravity:2400,
 jumpVelocity:760,
 rotationSpeed:7.5,
 cubeX:.22,
 hitboxInset:6
};

const player={
 x:0,
 y:0,
 vy:0,
 rot:0,
 grounded:false,
 alive:true
};

/* =========================================================
   GAME STATE
========================================================= */

let current=0;
let running=false;
let pausedGame=false;
let finished=false;
let practice=false;

let world=0;
let lastTime=0;
let accumulator=0;

const FIXED_DT=1/120;

let deathsRun=0;
let runCoins=0;
let collectedCoins=new Set();

let obstacles=[];
let coins=[];
let pads=[];
let portals=[];
let particles=[];
let stars=[];
let trail=[];

let gravityDirection=1;
let speedMultiplier=1;

let audio=null;
let musicTimer=null;
let musicStep=0;

/* =========================================================
   RESIZE
========================================================= */

function resize(){

 W=Math.max(320,innerWidth);
 H=Math.max(240,innerHeight);

 const d=Math.min(devicePixelRatio||1,2);

 canvas.width=Math.floor(W*d);
 canvas.height=Math.floor(H*d);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(d,0,0,d,0,0);

 ground=Math.min(H-50,H*.78);

 if(!running){
   player.y=ground-PLAYER_SIZE;
 }

 createStars();
}

addEventListener("resize",resize);

/* =========================================================
   MENU
========================================================= */

function renderMenu(){

 levelsBox.innerHTML="";

 LEVELS.forEach((l,i)=>{

   const b=document.createElement("button");
   b.className="level";
   b.type="button";

   const unlocked=
     i===0||
     save.completed.includes(i-1);

   b.disabled=!unlocked;

   b.innerHTML=
   `<span class="levelStatus">
      ${save.completed.includes(i)?"✅":unlocked?"▶️":"🔒"}
    </span>
    <div class="levelName">${i+1}. ${l.name}</div>
    <div class="levelInfo">
      ${"⭐".repeat(l.difficulty)} • ${l.speed} speed
    </div>`;

   if(unlocked){
     b.onclick=()=>{
       startLevel(i,false);
     };
   }

   levelsBox.appendChild(b);
 });

 const done=save.completed.length;
 const p=Math.round(done/LEVELS.length*100);

 document.getElementById("progressText").textContent=p+"%";
 document.getElementById("menuBar").style.width=p+"%";
 document.getElementById("doneText").textContent=
   `${done} / ${LEVELS.length} poziomów`;
}

/* =========================================================
   LEVEL START
========================================================= */

function startLevel(index,isPractice=false){

 if(index<0||index>=LEVELS.length)return;

 current=index;
 practice=isPractice;

 running=false;
 pausedGame=false;
 finished=false;

 cancelAnimationFrame(window.__neonRAF);

 stopMusic();

 world=0;
 accumulator=0;
 deathsRun=0;
 runCoins=0;
 collectedCoins=new Set();

 gravityDirection=LEVELS[current].gravity;
 speedMultiplier=1;

 particles=[];
 trail=[];

 player.x=Math.max(110,W*PHYSICS.cubeX);
 player.y=
   gravityDirection===1
   ?ground-PLAYER_SIZE
   :0;

 player.vy=0;
 player.rot=0;
 player.grounded=true;
 player.alive=true;

 generateLevel();

 game.style.display="block";
 menu.style.display="none";

 pause.style.display="none";
 finish.style.display="none";

 document.getElementById("levelName").textContent=
   `${current+1} • ${LEVELS[current].name}`;

 updateCoinHud();

 document.getElementById("touchJump").style.display=
   save.touch?"block":"none";

 running=true;
 lastTime=performance.now();

 if(save.music)startMusic();

 draw();

 window.__neonRAF=requestAnimationFrame(loop);
}

/* =========================================================
   LEVEL GENERATOR
========================================================= */

function generateLevel(){

 obstacles=[];
 coins=[];
 pads=[];
 portals=[];

 const length=LEVELS[current].length;

 let x=650;
 let pattern=0;

 while(x<length-900){

   const mode=pattern%11;

   if(mode===0){
     spike(x);
     x+=430;
   }

   else if(mode===1){
     spike(x);
     spike(x+75);
     x+=570;
   }

   else if(mode===2){
     saw(x);
     x+=500;
   }

   else if(mode===3){
     gap(x,145);
     x+=600;
   }

   else if(mode===4){
     pad(x);
     spike(x+210);
     x+=650;
   }

   else if(mode===5){
     spike(x);
     saw(x+230);
     x+=700;
   }

   else if(mode===6){
     speedPortal(x,1.15);
     spike(x+260);
     x+=760;
   }

   else if(mode===7){
     gravityPortal(x);
     spike(x+270);
     x+=760;
   }

   else if(mode===8){
     saw(x);
     saw(x+190);
     x+=680;
   }

   else if(mode===9){
     /*
       ZAWSZE TYLKO DWA SPIKE'I.
       BRAK TRIPLE SPIKE.
     */
     spike(x);
     spike(x+70);
     x+=620;
   }

   else{
     pad(x);
     saw(x+230);
     spike(x+400);
     x+=800;
   }

   pattern++;
 }

 /*
   Dokładnie 3 monety.
 */
 [0.24,0.52,0.79].forEach((ratio,i)=>{

   let cx=length*ratio;

   /*
     Nie wkładamy monety bezpośrednio
     w przeszkodę.
   */
   for(let tries=0;tries<20;tries++){

     let bad=false;

     for(const o of obstacles){

       const ox=o.x;

       if(Math.abs(cx-ox)<130){
         bad=true;
         break;
       }
     }

     if(!bad)break;

     cx+=120;
   }

   coins.push({
     id:i,
     x:cx,
     collected:false
   });
 });
}

/* =========================================================
   OBIEKTY
========================================================= */

function spike(x){
 obstacles.push({type:"spike",x});
}

function saw(x){
 obstacles.push({type:"saw",x,r:29});
}

function gap(x,w){
 obstacles.push({type:"gap",x,w});
}

function pad(x){
 pads.push({x,used:false});
}

function speedPortal(x,mult){
 portals.push({
   type:"speed",
   x,
   mult,
   used:false
 });
}

function gravityPortal(x){
 portals.push({
   type:"gravity",
   x,
   used:false
 });
}

/* =========================================================
   INPUT
========================================================= */

function jump(){

 if(!running||pausedGame||finished||!player.alive)return;

 /*
   GD-style:
   skok działa tylko wtedy, kiedy kostka stoi na podłożu.
 */
 if(player.grounded){

   player.vy=
     -PHYSICS.jumpVelocity*gravityDirection;

   player.grounded=false;

   /*
     Obrót zaczyna się od razu.
   */
   player.rot+=
     gravityDirection===1
     ?Math.PI/2
     :-Math.PI/2;

   burst(player.x+18,player.y+18,10,LEVELS[current].color);
   playSfx(520);
 }
}

function handleInput(e){

 if(e.target.closest &&
    (e.target.closest(".gameButtons")||
     e.target.closest("#touchJump")))return;

 jump();
}

game.addEventListener("pointerdown",handleInput);

document.getElementById("touchJump").addEventListener(
 "pointerdown",
 e=>{
   e.preventDefault();
   jump();
 }
);

addEventListener("keydown",e=>{

 if(e.code==="Space"||
    e.code==="ArrowUp"||
    e.code==="KeyW"){

   e.preventDefault();
   jump();
 }

 if(e.code==="Escape"||
    e.code==="KeyP"){

   e.preventDefault();
   togglePause();
 }

 if(e.code==="KeyR"){
   e.preventDefault();
   startLevel(current,practice);
 }
});

/* =========================================================
   UPDATE FIZYKI
========================================================= */

function fixedUpdate(dt){

 const l=LEVELS[current];

 /*
   Stała prędkość auto-runa.
 */
 world+=
   l.speed*
   speedMultiplier*
   dt;

 /*
   GRAWITACJA
 */
 player.vy+=
   PHYSICS.gravity*
   gravityDirection*
   dt;

 player.y+=player.vy*dt;

 /*
   PODŁOŻE / SUFIT
 */
 if(gravityDirection===1){

   const floor=ground-PLAYER_SIZE;

   if(player.y>=floor && !isInGap()){

     player.y=floor;
     player.vy=0;
     player.grounded=true;

     snapRotation();

   }else{
     player.grounded=false;

     /*
       Płynny obrót jak kostka.
     */
     player.rot+=
       PHYSICS.rotationSpeed*
       dt*
       (player.vy>=0?1:1);
   }

 }else{

   if(player.y<=0 && !isInGap()){

     player.y=0;
     player.vy=0;
     player.grounded=true;

     snapRotation();

   }else{
     player.grounded=false;

     player.rot-=
       PHYSICS.rotationSpeed*
       dt;
   }
 }

 /*
   PADY
 */
 checkPads();

 /*
   PORTALE
 */
 checkPortals();

 /*
   MONETY
 */
 checkCoins();

 /*
   KOLIZJE
 */
 checkCollisions();

 /*
   TRAIL
 */
 trail.push({
   x:player.x+18,
   y:player.y+18,
   life:.22
 });

 if(trail.length>28)trail.shift();

 updateParticles(dt);
 updateTrail(dt);

 if(world>=l.length){
   finishLevel();
 }
}

/* =========================================================
   OBRÓT KOSTKI
========================================================= */

function snapRotation(){

 const step=Math.PI/2;

 player.rot=
   Math.round(player.rot/step)*step;
}

/* =========================================================
   GAP
========================================================= */

function isInGap(){

 const center=
   world+
   player.x+
   PLAYER_SIZE/2;

 for(const o of obstacles){

   if(
     o.type==="gap" &&
     center>o.x &&
     center<o.x+o.w
   ){
     return true;
   }
 }

 return false;
}

/* =========================================================
   PADY
========================================================= */

function checkPads(){

 for(const p of pads){

   if(p.used)continue;

   const px=
     world+
     player.x+
     PLAYER_SIZE/2;

   if(
     px>p.x &&
     px<p.x+55 &&
     player.grounded
   ){

     p.used=true;

     player.vy=
       -PHYSICS.jumpVelocity*1.35*
       gravityDirection;

     player.grounded=false;

     player.rot+=
       gravityDirection===1
       ?Math.PI/2
       :-Math.PI/2;

     burst(
       p.x-world,
       ground-15,
       18,
       "#49ff9a"
     );

     playSfx(760);
   }
 }
}

/* =========================================================
   PORTALE
========================================================= */

function checkPortals(){

 for(const p of portals){

   if(p.used)continue;

   const px=
     world+
     player.x+
     PLAYER_SIZE/2;

   if(px>p.x&&px<p.x+65){

     p.used=true;

     if(p.type==="speed"){

       speedMultiplier=p.mult;

       burst(
         p.x-world,
         H*.48,
         25,
         "#ffe14a"
       );

       playSfx(900);

     }else{

       gravityDirection*=-1;

       player.vy=0;
       player.grounded=false;

       burst(
         p.x-world,
         H*.48,
         35,
         "#ff4be8"
       );

       playSfx(650);
     }
   }
 }
}

/* =========================================================
   MONETY
========================================================= */

function updateCoinHud(){
 document.getElementById("coins").textContent=
   `🪙 ${runCoins}/3`;
}

function coinY(){
 return gravityDirection===1
   ?ground-125
   :125;
}

function checkCoins(){

 for(const c of coins){

   if(c.collected)continue;

   const x=c.x-world;
   const y=coinY();

   const dx=
     player.x+18-x;

   const dy=
     player.y+18-y;

   if(Math.hypot(dx,dy)<38){

     c.collected=true;
     runCoins++;

     updateCoinHud();

     burst(x,y,20,"#ffd43b");

     playSfx(980);
   }
 }
}

/* =========================================================
   KOLIZJE
========================================================= */

function checkCollisions(){

 const left=
   world+
   player.x+
   PHYSICS.hitboxInset;

 const right=
   world+
   player.x+
   PLAYER_SIZE-
   PHYSICS.hitboxInset;

 const top=
   player.y+
   PHYSICS.hitboxInset;

 const bottom=
   player.y+
   PLAYER_SIZE-
   PHYSICS.hitboxInset;

 for(const o of obstacles){

   if(o.type==="spike"){

     const sx=o.x;
     const sw=46;
     const sh=48;

     if(
       right>sx+7 &&
       left<sx+sw-5
     ){

       if(gravityDirection===1){

         if(bottom>ground-sh+5){
           die();
           return;
         }

       }else{

         if(top<sh-5){
           die();
           return;
         }
       }
     }
   }

   if(o.type==="saw"){

     const cx=o.x;
     const cy=
       gravityDirection===1
       ?ground-o.r
       :o.r;

     const nx=Math.max(left,Math.min(cx,right));
     const ny=Math.max(top,Math.min(cy,bottom));

     const dx=cx-nx;
     const dy=cy-ny;

     if(dx*dx+dy*dy<(o.r-5)*(o.r-5)){

       die();
       return;
     }
   }

   if(o.type==="gap"){

     const center=
       world+
       player.x+
       PLAYER_SIZE/2;

     if(
       gravityDirection===1 &&
       center>o.x &&
       center<o.x+o.w &&
       bottom>=ground-5
     ){

       die();
       return;
     }
   }
 }
}

/* =========================================================
   ŚMIERĆ
========================================================= */

function die(){

 if(!player.alive)return;

 player.alive=false;
 running=false;

 deathsRun++;
 save.deaths++;
 save.missionDeaths++;

 saveGame();

 burst(
   player.x+18,
   player.y+18,
   45,
   LEVELS[current].color
 );

 playSfx(90);

 setTimeout(()=>{

   startLevel(current,practice);

 },450);
}

/* =========================================================
   KONIEC
========================================================= */

function finishLevel(){

 if(finished)return;

 finished=true;
 running=false;

 stopMusic();

 if(!practice){

   if(!save.completed.includes(current)){
     save.completed.push(current);
     save.stars++;
     save.diamonds++;
   }

   save.coins+=runCoins;
   save.missionCoins+=runCoins;

   checkAchievements();
 }

 saveGame();

 document.getElementById("finishInfo").textContent=
   `${LEVELS[current].name} • 🪙 ${runCoins}/3 • ☠️ ${deathsRun}`;

 finish.style.display="flex";

 burst(W/2,H*.35,100,LEVELS[current].color);
}

/* =========================================================
   LOOP — 120 HZ PHYSICS
========================================================= */

function loop(now){

 if(!running)return;

 if(pausedGame){

   lastTime=now;
   window.__neonRAF=requestAnimationFrame(loop);
   return;
 }

 let frameTime=
   Math.min(.05,(now-lastTime)/1000);

 lastTime=now;

 accumulator+=frameTime;

 let steps=0;

 /*
   Maksymalnie kilka kroków na klatkę,
   żeby nie było spirali po spadku FPS.
 */
 while(accumulator>=FIXED_DT && steps<8){

   fixedUpdate(FIXED_DT);

   accumulator-=FIXED_DT;
   steps++;
 }

 draw();

 if(running){
   window.__neonRAF=
     requestAnimationFrame(loop);
 }
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

 const l=LEVELS[current];

 ctx.clearRect(0,0,W,H);

 const bg=
   ctx.createLinearGradient(0,0,0,H);

 bg.addColorStop(0,"#080b20");
 bg.addColorStop(1,"#020207");

 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 drawStars();
 drawGrid();

 ctx.fillStyle="#080a13";
 ctx.fillRect(0,ground,W,H-ground);

 ctx.strokeStyle=l.color;
 ctx.shadowColor=l.color;
 ctx.shadowBlur=16;
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.moveTo(0,ground);
 ctx.lineTo(W,ground);
 ctx.stroke();

 ctx.shadowBlur=0;

 for(const o of obstacles){

   const x=o.x-world;

   if(x<-100||x>W+100)continue;

   if(o.type==="spike")drawSpike(x);
   if(o.type==="saw")drawSaw(x,o.r);

   if(o.type==="gap"){
     ctx.fillStyle="#010105";
     ctx.fillRect(x,ground,o.w,H-ground);
   }
 }

 for(const p of pads){

   const x=p.x-world;

   if(x>-100&&x<W+100)
     drawPad(x);
 }

 for(const p of portals){

   const x=p.x-world;

   if(x>-100&&x<W+100){

     if(p.type==="speed")
       drawSpeedPortal(x);
     else
       drawGravityPortal(x);
   }
 }

 for(const c of coins){

   if(c.collected)continue;

   const x=c.x-world;

   if(x>-50&&x<W+50)
     drawCoin(x,coinY());
 }

 drawTrail();

 if(player.alive)
   drawPlayer();

 drawParticles();

 const percent=
   Math.min(100,Math.floor(world/l.length*100));

 document.getElementById("percent").textContent=
   percent+"%";

 document.getElementById("gameBar").style.width=
   percent+"%";
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

 const l=LEVELS[current];

 ctx.save();

 ctx.translate(
   player.x+18,
   player.y+18
 );

 ctx.rotate(player.rot);

 ctx.shadowColor=l.color;
 ctx.shadowBlur=22;

 ctx.fillStyle=l.color;

 ctx.fillRect(-18,-18,36,36);

 ctx.shadowBlur=0;

 ctx.strokeStyle="white";
 ctx.lineWidth=2;
 ctx.strokeRect(-18,-18,36,36);

 /*
   TYLKO OCZY.
 */
 ctx.fillStyle="#05050a";

 ctx.beginPath();
 ctx.arc(-7,-4,3,0,Math.PI*2);
 ctx.arc(7,-4,3,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

/* =========================================================
   OBSTACLES
========================================================= */

function drawSpike(x){

 const c=LEVELS[current].color;

 ctx.save();

 ctx.fillStyle=c;
 ctx.shadowColor=c;
 ctx.shadowBlur=18;

 ctx.beginPath();

 if(gravityDirection===1){

   ctx.moveTo(x,ground);
   ctx.lineTo(x+23,ground-48);
   ctx.lineTo(x+46,ground);

 }else{

   ctx.moveTo(x,0);
   ctx.lineTo(x+23,48);
   ctx.lineTo(x+46,0);
 }

 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.strokeStyle="white";
 ctx.stroke();

 ctx.restore();
}

function drawSaw(x,r){

 const c=LEVELS[current].color;

 const cy=
   gravityDirection===1
   ?ground-r
   :r;

 ctx.save();
 ctx.translate(x,cy);
 ctx.rotate(performance.now()/300);

 ctx.fillStyle=c;
 ctx.shadowColor=c;
 ctx.shadowBlur=18;

 ctx.beginPath();

 for(let i=0;i<28;i++){

   const a=i*Math.PI/14;
   const rr=i%2===0?r:r*.68;

   const px=Math.cos(a)*rr;
   const py=Math.sin(a)*rr;

   if(i===0)ctx.moveTo(px,py);
   else ctx.lineTo(px,py);
 }

 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#05050c";
 ctx.beginPath();
 ctx.arc(0,0,r*.25,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawPad(x){

 ctx.save();

 ctx.fillStyle="#49ff9a";
 ctx.shadowColor="#49ff9a";
 ctx.shadowBlur=20;

 ctx.beginPath();
 ctx.arc(x+27,ground-8,20,Math.PI,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawSpeedPortal(x){

 ctx.save();

 ctx.translate(x+30,H*.48);

 ctx.strokeStyle="#ffe14a";
 ctx.shadowColor="#ffe14a";
 ctx.shadowBlur=20;
 ctx.lineWidth=5;

 ctx.beginPath();
 ctx.arc(0,0,31+Math.sin(performance.now()/120)*4,0,Math.PI*2);
 ctx.stroke();

 ctx.shadowBlur=0;

 ctx.fillStyle="white";
 ctx.font="bold 20px Arial";
 ctx.textAlign="center";
 ctx.fillText(">>",0,7);

 ctx.restore();
}

function drawGravityPortal(x){

 ctx.save();

 ctx.translate(x+30,H*.48);

 ctx.strokeStyle="#ff4be8";
 ctx.shadowColor="#ff4be8";
 ctx.shadowBlur=22;
 ctx.lineWidth=5;

 ctx.beginPath();
 ctx.arc(0,0,31+Math.sin(performance.now()/130)*4,0,Math.PI*2);
 ctx.stroke();

 ctx.shadowBlur=0;

 ctx.fillStyle="white";
 ctx.font="bold 25px Arial";
 ctx.textAlign="center";
 ctx.fillText("↕",0,9);

 ctx.restore();
}

function drawCoin(x,y){

 const s=1+Math.sin(performance.now()/130)*.1;

 ctx.save();

 ctx.translate(x,y);
 ctx.scale(s,s);

 ctx.fillStyle="#ffd43b";
 ctx.shadowColor="#ffd43b";
 ctx.shadowBlur=22;

 ctx.beginPath();
 ctx.arc(0,0,14,0,Math.PI*2);
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle="white";
 ctx.stroke();

 ctx.restore();
}

/* =========================================================
   BACKGROUND
========================================================= */

function createStars(){

 stars=[];

 for(let i=0;i<90;i++){

   stars.push({
     x:Math.random()*W,
     y:Math.random()*ground*.9,
     r:.5+Math.random()*1.8,
     speed:.15+Math.random()*.6
   });
 }
}

function drawStars(){

 ctx.fillStyle="white";

 for(const s of stars){

   s.x-=s.speed;

   if(s.x<0)s.x=W;

   ctx.globalAlpha=.2+s.r*.15;

   ctx.beginPath();
   ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
   ctx.fill();
 }

 ctx.globalAlpha=1;
}

function drawGrid(){

 const c=LEVELS[current].color;

 ctx.strokeStyle=c;
 ctx.globalAlpha=.08;

 const size=70;
 const offset=-(world*.22)%size;

 for(let x=offset;x<W;x+=size){

   ctx.beginPath();
   ctx.moveTo(x,0);
   ctx.lineTo(x,ground);
   ctx.stroke();
 }

 for(let y=35;y<ground;y+=size){

   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(W,y);
   ctx.stroke();
 }

 ctx.globalAlpha=1;
}

/* =========================================================
   TRAIL
========================================================= */

function updateTrail(dt){

 for(let i=trail.length-1;i>=0;i--){

   trail[i].life-=dt;

   if(trail[i].life<=0)
     trail.splice(i,1);
 }
}

function drawTrail(){

 const c=LEVELS[current].color;

 for(const t of trail){

   ctx.globalAlpha=
     Math.max(0,t.life/.22)*.3;

   ctx.fillStyle=c;

   ctx.fillRect(
     t.x-8,
     t.y-8,
     16,
     16
   );
 }

 ctx.globalAlpha=1;
}

/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,count,color){

 for(let i=0;i<count;i++){

   if(particles.length>350)break;

   particles.push({
     x,y,
     vx:(Math.random()-.5)*500,
     vy:(Math.random()-.5)*500,
     life:.4+Math.random()*.8,
     size:2+Math.random()*6,
     color
   });
 }
}

function updateParticles(dt){

 for(let i=particles.length-1;i>=0;i--){

   const p=particles[i];

   p.life-=dt;
   p.x+=p.vx*dt;
   p.y+=p.vy*dt;
   p.vy+=450*dt;

   if(p.life<=0)
     particles.splice(i,1);
 }
}

function drawParticles(){

 for(const p of particles){

   ctx.globalAlpha=Math.max(0,p.life);

   ctx.fillStyle=p.color;

   ctx.shadowColor=p.color;
   ctx.shadowBlur=10;

   ctx.fillRect(
     p.x-p.size/2,
     p.y-p.size/2,
     p.size,
     p.size
   );
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

/* =========================================================
   AUDIO
========================================================= */

function getAudio(){

 if(audio)return audio;

 try{
   audio=new(
     window.AudioContext||
     window.webkitAudioContext
   )();
 }catch(e){}

 return audio;
}

function playSfx(freq){

 if(!save.sfx)return;

 try{

   const a=getAudio();
   if(!a)return;

   if(a.state==="suspended")a.resume();

   const osc=a.createOscillator();
   const gain=a.createGain();

   osc.frequency.value=freq;
   osc.type="square";

   gain.gain.setValueAtTime(.035,a.currentTime);
   gain.gain.exponentialRampToValueAtTime(
     .001,
     a.currentTime+.12
   );

   osc.connect(gain);
   gain.connect(a.destination);

   osc.start();
   osc.stop(a.currentTime+.13);

 }catch(e){}
}

function startMusic(){

 stopMusic();

 if(!save.music)return;

 try{

   const a=getAudio();
   if(!a)return;

   if(a.state==="suspended")a.resume();

   musicStep=0;

   const notes=[262,330,392,523,392,330,294,330];

   musicTimer=setInterval(()=>{

     if(!running||pausedGame)return;

     const osc=a.createOscillator();
     const gain=a.createGain();

     osc.type="triangle";
     osc.frequency.value=
       notes[musicStep%notes.length];

     gain.gain.setValueAtTime(.018,a.currentTime);
     gain.gain.exponentialRampToValueAtTime(
       .001,
       a.currentTime+.14
     );

     osc.connect(gain);
     gain.connect(a.destination);

     osc.start();
     osc.stop(a.currentTime+.15);

     musicStep++;

   },110);

 }catch(e){}
}

function stopMusic(){

 if(musicTimer){
   clearInterval(musicTimer);
   musicTimer=null;
 }
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

 if(!running)return;

 pausedGame=!pausedGame;

 pause.style.display=
   pausedGame?"flex":"none";

 if(pausedGame){
   stopMusic();
 }else{
   lastTime=performance.now();
   if(save.music)startMusic();
 }
}

document.getElementById("pauseBtn").onclick=togglePause;

document.getElementById("resume").onclick=()=>{
 pausedGame=false;
 pause.style.display="none";
 lastTime=performance.now();
 if(save.music)startMusic();
};

document.getElementById("pauseRestart").onclick=()=>{
 pause.style.display="none";
 startLevel(current,practice);
};

document.getElementById("pauseMenu").onclick=goMenu;

/* =========================================================
   MENU / RESTART / FINISH
========================================================= */

function goMenu(){

 running=false;
 pausedGame=false;
 finished=false;

 cancelAnimationFrame(window.__neonRAF);
 stopMusic();

 game.style.display="none";
 menu.style.display="flex";

 pause.style.display="none";
 finish.style.display="none";

 renderMenu();
}

document.getElementById("restartBtn").onclick=()=>{
 startLevel(current,practice);
};

document.getElementById("menuBtn").onclick=goMenu;

document.getElementById("again").onclick=()=>{
 startLevel(current,practice);
};

document.getElementById("finishMenu").onclick=goMenu;

/* =========================================================
   ACHIEVEMENTS
========================================================= */

const ACH=[
["first","🎮 Pierwszy krok","Ukończ pierwszy poziom."],
["five","⚡ Rozgrzewka","Ukończ 5 poziomów."],
["ten","🔥 Weteran","Ukończ 10 poziomów."],
["all","👑 Mistrz","Ukończ wszystkie 20 poziomów."],
["coins","🪙 Kolekcjoner","Zdobądź 25 monet."],
["diamond","💎 Diament","Zdobądź diament."],
["survivor","🛡️ Twardziel","Zgiń 10 razy."],
["final","🌌 Koniec","Ukończ FINAL OVERDRIVE."]
];

function unlock(id){

 if(!save.achievements.includes(id)){
   save.achievements.push(id);
   saveGame();
 }
}

function checkAchievements(){

 const n=save.completed.length;

 if(n>=1)unlock("first");
 if(n>=5)unlock("five");
 if(n>=10)unlock("ten");
 if(n>=20)unlock("all");
 if(save.coins>=25)unlock("coins");
 if(save.diamonds>=1)unlock("diamond");
 if(save.deaths>=10)unlock("survivor");
 if(save.completed.includes(19))unlock("final");
}

function renderAchievements(){

 const box=document.getElementById("achList");
 box.innerHTML="";

 ACH.forEach(a=>{

   const d=document.createElement("div");

   d.className=
     "item"+
     (save.achievements.includes(a[0])?" on":"");

   d.innerHTML=
     `<b>${a[1]}</b><br><small>${a[2]}</small>`;

   box.appendChild(d);
 });
}

document.getElementById("achBtn").onclick=()=>{
 renderAchievements();
 achievements.style.display="flex";
};

/* =========================================================
   SHOP
========================================================= */

const SKINS=[
["Classic","#00eaff",0],
["Violet","#d35cff",10],
["Lava","#ff5147",20],
["Gold","#ffd43b",30],
["Cyber","#27f0c5",45],
["Plasma","#ff247f",60]
];

function renderShop(){

 const box=document.getElementById("skinList");
 box.innerHTML="";

 SKINS.forEach((s,i)=>{

   const b=document.createElement("button");
   b.className="item";
   b.style.borderColor=s[1];

   b.innerHTML=
     `■ ${s[0]} • ${s[2]} 🪙`;

   b.onclick=()=>{

     if(save.skin===i)return;

     if(save.coins>=s[2]){

       save.coins-=s[2];
       save.skin=i;
       saveGame();
       renderShop();
     }
   };

   if(save.skin===i)
     b.innerHTML+=" ✓ WYBRANY";

   box.appendChild(b);
 });
}

 shop.style.display="flex";
