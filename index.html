<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:18px;
}

.hidden{
    display:none!important;
}

/* MENU */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    background:
        radial-gradient(circle at 50% 30%,#202060 0,#09091b 42%,#030307 100%);
}

.menuBox{
    width:min(92%,520px);
    padding:28px;
    text-align:center;
}

.logo{
    font-size:clamp(48px,12vw,82px);
    font-weight:900;
    letter-spacing:3px;
    color:#00eaff;
    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #00eaff,
        0 0 55px #0066ff;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    margin-bottom:28px;
}

.menuButton{
    width:100%;
    max-width:360px;
    margin:7px auto;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(135deg,#096cff,#00c8ff);
    box-shadow:0 0 18px #008cff66;
}

.menuButton:active{
    transform:scale(.97);
}

.smallButton{
    background:#17172a;
    border:1px solid #38385c;
}

.panel{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.82);
    z-index:30;
}

.panelBox{
    width:min(94%,600px);
    max-height:90vh;
    overflow:auto;
    padding:25px;
    border-radius:18px;
    background:#101021;
    border:1px solid #34345c;
    box-shadow:0 0 40px #000;
}

.panelBox h2{
    text-align:center;
    color:#00eaff;
}

.backButton{
    width:100%;
    padding:13px;
    margin-top:15px;
    border-radius:10px;
    background:#24243b;
}

/* GAME */

#game{
    position:absolute;
    inset:0;
    background:#000;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    pointer-events:none;
}

#levelName{
    font-size:18px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#progressText{
    font-size:13px;
    margin-top:3px;
    color:#ddd;
}

#progressOuter{
    height:7px;
    margin-top:6px;
    background:#222235;
    border-radius:20px;
    overflow:hidden;
}

#levelProgressBar{
    width:0%;
    height:100%;
    background:#00eaff;
    box-shadow:0 0 10px #00eaff;
}

#pauseButton{
    position:absolute;
    right:12px;
    top:12px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#151526dd;
    border:1px solid #55557a;
}

#mobileJump{
    position:absolute;
    right:22px;
    bottom:25px;
    z-index:20;
    width:90px;
    height:90px;
    border-radius:50%;

    border:2px solid #00eaff;
    box-shadow:0 0 20px #00cfff66;

}

#mobileLeft,
#mobileRight{
    position:absolute;
    bottom:28px;

    height:65px;

#mobileLeft{

#mobileRight{
    left:95px;
}

    z-index:40;
}

.pauseTitle{
    text-align:center;
    font-size:35px;

}

.winTitle{
    text-align:center;
    font-size:40px;
    color:#55ff88;
    text-shadow:0 0 15px #55ff88;
}

.levelGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:15px;
}

.levelButton{
    min-height:65px;
    border-radius:10px;

.levelButton.completed{

<script>
"use strict";

/* =========================================================
   NEON DASH
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

if(!ctx){
    document.getElementById("errorBox").style.display="block";
    document.getElementById("errorBox").textContent="Twoja przeglądarka nie obsługuje Canvas.";
}

/* ---------- SAVE ---------- */

const SAVE_KEY="neon_dash_save_v3";

const defaultSave={
    unlocked:1,
    completed:[],
    coins:0,
    selectedSkin:0,
    ownedSkins:[0],
    achievements:[],
    music:true,
    sound:true
};

let save;

function loadSave(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);

        if(!raw){
            save=structuredClone(defaultSave);
            return;
        }

        const parsed=JSON.parse(raw);

        save={
            ...defaultSave,
            ...parsed,
            completed:Array.isArray(parsed.completed)?parsed.completed:[],
            ownedSkins:Array.isArray(parsed.ownedSkins)?parsed.ownedSkins:[0],
            achievements:Array.isArray(parsed.achievements)?parsed.achievements:[]
        };

        if(!save.ownedSkins.includes(0)){
            save.ownedSkins.unshift(0);
        }
    }catch(e){
        save=structuredClone(defaultSave);
    }
}

function saveGame(){
    try{
        localStorage.setItem(SAVE_KEY,JSON.stringify(save));
    }catch(e){}
}

/* ---------- AUDIO ---------- */

let audioCtx=null;
let musicTimer=null;
let musicStep=0;

function getAudio(){
    try{
        if(!audioCtx){
            const AC=window.AudioContext||window.webkitAudioContext;
            if(!AC)return null;
            audioCtx=new AC();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume().catch(()=>{});
        }

        return audioCtx;
    }catch(e){
        return null;
    }
}

function beep(freq=440,duration=.08,type="square",volume=.035){
    if(!save.sound)return;

    const a=getAudio();
    if(!a)return;

    try{
        const osc=a.createOscillator();
        const gain=a.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(volume,a.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);

        osc.connect(gain);
        gain.connect(a.destination);

        osc.start();
        osc.stop(a.currentTime+duration);
    }catch(e){}
}

function startMusic(){
    if(!save.music || musicTimer)return;

    getAudio();

    const notes=[220,277,330,277,247,330,370,330];

    musicTimer=setInterval(()=>{
        if(!running || paused)return;

        beep(notes[musicStep%notes.length],.07,"triangle",.018);
        musicStep++;
    },180);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
    }
}

function toggleMusic(){
    save.music=!save.music;
    saveGame();

    if(save.music)startMusic();
    else stopMusic();

    updateSettingsUI();
}

function toggleSound(){
    save.sound=!save.sound;

    updateSettingsUI();
}

/* ---------- GAME ---------- */

function groundY(){
    return H-95;
}

function createPlayer(){
    return {
        x:100,
        y:groundY()-42,
        w:42,
        h:42,
        vy:0,
        grounded:true,
        rotation:0,
        anim:0
    };
}

function createLevel(){
    level=levels[levelIndex];

    player=createPlayer();

    cameraX=0;

    collectedCoins=new Set();

    particles=[];
    confetti=[];

    document.getElementById("levelName").textContent=
        `Poziom ${levelIndex+1} — ${level.name}`;

    updateProgress();
}

function startGame(index=null){
    clearTimeout(deathTimer);
    clearTimeout(winTimer);

    loopId++;

    if(index!==null){
        if(index<0 || index>=levels.length)return;
        if(index>=save.unlocked)return;

        levelIndex=index;
    }

    hidePanels();

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    createLevel();

    running=true;
    paused=false;

    lastTime=performance.now();

    /* NAJWAŻNIEJSZE:
       pierwsza klatka jest rysowana natychmiast */
    draw();

    startMusic();

    const currentLoop=loopId;

    requestAnimationFrame(time=>{
        gameLoop(time,currentLoop);
    });
}

function restartLevel(){
    hidePanels();

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    startGame(levelIndex);
}

function gameLoop(time,myLoop){
    if(myLoop!==loopId)return;
    if(!running)return;

    if(paused){
        lastTime=time;
        requestAnimationFrame(t=>gameLoop(t,myLoop));
        return;
    }

    let dt=(time-lastTime)/16.6667;

    if(!isFinite(dt))dt=1;

    dt=Math.max(.2,Math.min(2,dt));

    lastTime=time;

    update(dt);
    draw();

    if(running && myLoop===loopId){
        requestAnimationFrame(t=>gameLoop(t,myLoop));
    }
}

/* ---------- UPDATE ---------- */

function update(dt){
    if(!player || !level)return;

    player.anim+=dt;

    const speed=level.speed;

    let move=speed;

    if(leftPressed)move-=2;
    if(rightPressed)move+=2;

    if(move<2)move=2;

    player.x+=move*dt;

    /* GRAVITY */

    player.vy+=0.72*dt;
    player.y+=player.vy*dt;

    const gy=groundY()-player.h;

    if(player.y>=gy){
        player.y=gy;

        if(player.vy>0){
            player.vy=0;
        }

        player.grounded=true;
    }else{
        player.grounded=false;
    }

    /* COLLISION WITH BLOCKS */

    for(const o of level.obstacles){
        const ox=o[0];
        const ow=o[2];
        const oh=o[3];

        const oy=groundY()-oh;

        if(
            player.x+player.w>ox &&
            player.x<ox+ow &&
            player.y+player.h>oy &&
            player.y<groundY()
        ){
            die();
            return;
        }
    }

    /* COINS */

    level.coins.forEach((cx,i)=>{
        if(collectedCoins.has(i))return;

        const cy=groundY()-95;

        const dx=(player.x+player.w/2)-cx;
        const dy=(player.y+player.h/2)-cy;

        if(Math.hypot(dx,dy)<30){
            collectedCoins.add(i);

            save.coins++;
            saveGame();

            beep(880,.1,"sine",.05);

            for(let n=0;n<8;n++){
                particles.push({
                    x:cx,
                    y:cy,
                    vx:(Math.random()-.5)*4,
                    vy:(Math.random()-.5)*4,
                    life:30
                });
            }

            checkAchievements();
        }
    });

    /* CAMERA */

    const targetCamera=player.x-130;

    if(targetCamera>cameraX){
        cameraX+=(targetCamera-cameraX)*.12*dt;
    }

    if(cameraX<0)cameraX=0;

    /* FINISH */

    if(player.x>=level.length){
        winLevel();
        return;
    }

    /* PARTICLES */

    particles.forEach(p=>{
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vy+=.12*dt;
        p.life-=dt;
    });

    particles=particles.filter(p=>p.life>0);

    updateProgress();
}

function updateProgress(){
    if(!level || !player)return;

    const progress=Math.max(
        0,
        Math.min(100,(player.x/level.length)*100)
    );

    document.getElementById("progressText").textContent=
        Math.floor(progress)+"%";

    document.getElementById("levelProgressBar").style.width=
        progress+"%";
}

/* ---------- JUMP ---------- */

function jump(){
    if(!running || paused || !player)return;

    if(player.grounded){
        player.vy=-13;
        player.grounded=false;

        beep(520,.08,"square",.035);
    }
}

/* ---------- DEATH ---------- */

function die(){
    if(!running)return;

    running=false;
    loopId++;

    stopMusic();

    beep(110,.2,"sawtooth",.045);

    if(navigator.vibrate){
        try{navigator.vibrate(100);}catch(e){}
    }

    deathTimer=setTimeout(()=>{
        if(confirm("Ups! Rozbiłeś się. Zagrać jeszcze raz?")){
            startGame(levelIndex);
        }else{
            backHome();
        }
    },250);
}

/* ---------- WIN ---------- */

function winLevel(){
    if(!running)return;

    running=false;
    loopId++;

    stopMusic();

    beep(660,.12,"triangle",.05);

    setTimeout(()=>{
        beep(880,.12,"triangle",.05);
    },120);

    setTimeout(()=>{
        beep(1100,.18,"triangle",.05);
    },240);

    if(!save.completed.includes(levelIndex)){
        save.completed.push(levelIndex);

        save.coins+=5;

        if(levelIndex+1<levels.length){
            save.unlocked=Math.max(
                save.unlocked,
                levelIndex+2
            );
        }

        saveGame();
    }

    checkAchievements();

    createConfetti();

    document.getElementById("winPanel").classList.remove("hidden");

    const next=document.getElementById("nextButton");

    if(levelIndex<levels.length-1){
        next.style.display="block";
    }else{
        next.style.display="none";
    }

    const token=loopId;

    function celebration(t){
        if(token!==loopId)return;

        updateConfetti();
        draw();

        if(t<lastTime+1600){
            requestAnimationFrame(celebration);
        }
    }

    lastTime=performance.now();

    requestAnimationFrame(celebration);
}

function nextLevel(){
    if(levelIndex>=levels.length-1){
        backHome();
        return;
    }

    startGame(levelIndex+1);
}

/* ---------- CONFETTI ---------- */

function createConfetti(){
    confetti=[];

    for(let i=0;i<80;i++){
        confetti.push({
            x:Math.random()*W,
            y:-Math.random()*H,
            vx:(Math.random()-.5)*4,
            vy:Math.random()*4+2,
            size:Math.random()*7+3,
            rot:Math.random()*6,
            vr:(Math.random()-.5)*.2
        });
    }
}

function updateConfetti(){
    confetti.forEach(c=>{
        c.x+=c.vx;
        c.y+=c.vy;
        c.vy+=.04;
        c.rot+=c.vr;

        if(c.y>H+20){
            c.y=-20;
            c.x=Math.random()*W;
        }
    });
}

/* ---------- DRAW ---------- */

function draw(){
    if(!ctx)return;

    ctx.clearRect(0,0,W,H);

    if(!level || !player){
        drawMenuBackground();
        return;
    }

    drawBackground();

    drawGround();

    drawCoins();

    drawObstacles();

    drawFinish();

    drawPlayer();

    drawParticles();

    if(confetti.length){
        drawConfetti();
    }
}

function drawMenuBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,"#101040");
    g.addColorStop(1,"#030307");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
}

function drawBackground(){
    const c=level.color;

    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,"#080820");
    g.addColorStop(.6,"#060611");
    g.addColorStop(1,"#020204");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    /* GLOW */

    const glow=ctx.createRadialGradient(
        W*.5,H*.35,20,
        W*.5,H*.35,Math.max(W,H)*.7
    );

    glow.addColorStop(0,c+"22");
    glow.addColorStop(1,"transparent");

    ctx.fillStyle=glow;
    ctx.fillRect(0,0,W,H);

    /* GRID */

    ctx.save();

    ctx.strokeStyle=c+"18";
    ctx.lineWidth=1;

    const grid=60;

    const offset=-(cameraX*.25)%grid;

    for(let x=offset;x<W;x+=grid){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=grid){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.restore();
}

function drawGround(){
    const gy=groundY();

    ctx.fillStyle="#10101b";
    ctx.fillRect(0,gy,W,H-gy);

    ctx.fillStyle=level.color;
    ctx.shadowColor=level.color;
    ctx.shadowBlur=12;

    ctx.fillRect(0,gy-4,W,4);

    ctx.shadowBlur=0;

    /* ground grid */

    ctx.strokeStyle="#ffffff10";
    ctx.lineWidth=1;

    const size=45;
    const offset=-(cameraX*.6)%size;

    for(let x=offset;x<W;x+=size){
        ctx.beginPath();
        ctx.moveTo(x,gy);
        ctx.lineTo(x,H);
        ctx.stroke();
    }
}

function drawObstacles(){
    const gy=groundY();

    level.obstacles.forEach(o=>{
        const x=o[0]-cameraX;
        const y=gy-o[3];
        const w=o[2];
        const h=o[3];

        if(x+w<-20 || x>W+20)return;

        ctx.save();

        ctx.fillStyle="#ff3d68";
        ctx.shadowColor="#ff174f";
        ctx.shadowBlur=15;

        ctx.fillRect(x,y,w,h);

        ctx.shadowBlur=0;

        ctx.fillStyle="#ff9bb2";
        ctx.fillRect(x+5,y+5,w-10,5);

        ctx.restore();
    });
}

function drawCoins(){
    const gy=groundY();

    level.coins.forEach((cx,i)=>{
        if(collectedCoins.has(i))return;

        const x=cx-cameraX;
        const y=gy-95;

        if(x<-30 || x>W+30)return;

        const pulse=1+Math.sin(performance.now()/180+cx)*.08;

        ctx.save();

        ctx.translate(x,y);
        ctx.scale(pulse,pulse);

        ctx.beginPath();
        ctx.arc(0,0,12,0,Math.PI*2);

        ctx.fillStyle="#ffe600";
        ctx.shadowColor="#ffe600";
        ctx.shadowBlur=15;

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.strokeStyle="#fff5a0";
        ctx.lineWidth=2;

        ctx.stroke();

        ctx.restore();
    });
}

function drawFinish(){
    const x=level.length-cameraX;

    if(x<-100 || x>W+100)return;

    ctx.save();

    ctx.fillStyle=level.color;
    ctx.shadowColor=level.color;
    ctx.shadowBlur=25;

    ctx.fillRect(x,groundY()-150,8,150);

    ctx.shadowBlur=0;

    ctx.font="bold 16px Arial";
    ctx.fillStyle="#fff";
    ctx.fillText("META",x-22,groundY()-160);

    ctx.restore();
}

function drawPlayer(){
    if(!player)return;

    const x=player.x-cameraX;
    const y=player.y;

    const skin=skins[save.selectedSkin]||skins[0];

    const walking=
        player.grounded &&
        running &&
        Math.sin(player.anim*.45)>0;

    ctx.save();

    ctx.translate(x+player.w/2,y+player.h/2);

    /* rotation while jumping */

    if(!player.grounded){
        player.rotation+=.08;
    }else{
        player.rotation*=.8;
    }

    ctx.rotate(player.rotation);

    /* glow */

    ctx.shadowColor=skin.color;
    ctx.shadowBlur=15;

    /* body */

    ctx.fillStyle=skin.color;

    ctx.fillRect(
        -player.w/2,
        -player.h/2,
        player.w,
        player.h
    );

    ctx.shadowBlur=0;

    /* eyes */

    ctx.fillStyle="#fff";

    ctx.fillRect(-12,-10,7,9);
    ctx.fillRect(5,-10,7,9);

    ctx.fillStyle="#111";

    ctx.fillRect(-9,-7,3,5);
    ctx.fillRect(8,-7,3,5);

    /* arms */

    ctx.strokeStyle=skin.color;
    ctx.lineWidth=7;
    ctx.lineCap="round";

    const arm=Math.sin(player.anim*.45)*7;

    ctx.beginPath();
    ctx.moveTo(-18,-1);
    ctx.lineTo(-25,arm);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(18,-1);
    ctx.lineTo(25,-arm);
    ctx.stroke();

    /* legs */

    const leg=walking?Math.sin(player.anim*.55)*8:0;

    ctx.beginPath();
    ctx.moveTo(-10,19);
    ctx.lineTo(-13,30+leg);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(10,19);
    ctx.lineTo(13,30-leg);
    ctx.stroke();

    ctx.restore();
}

function drawParticles(){
    particles.forEach(p=>{
        ctx.globalAlpha=Math.max(0,p.life/30);

        ctx.fillStyle=level.color;

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            4,
            4
        );
    });

    ctx.globalAlpha=1;
}

function drawConfetti(){
    confetti.forEach(c=>{
        ctx.save();

        ctx.translate(c.x,c.y);
        ctx.rotate(c.rot);

        ctx.fillStyle=[
            "#00eaff",
            "#ff3d68",
            "#ffe600",
            "#55ff88",
            "#b45cff",
            "#ff7b00"
        ][Math.floor(Math.random()*6)];

        ctx.fillRect(
            -c.size/2,
            -c.size/2,
            c.size,
            c.size
        );

        ctx.restore();
    });
}

/* ---------- ACHIEVEMENTS ---------- */

function unlockAchievement(id){
    if(save.achievements.includes(id))return;

    save.achievements.push(id);
    saveGame();

    beep(1000,.15,"triangle",.04);
}

function checkAchievements(){
    if(save.completed.length>=1){
        unlockAchievement("first");
    }

    if(save.completed.length>=5){
        unlockAchievement("five");
    }

    if(save.completed.length>=10){
        unlockAchievement("ten");
    }

    if(save.completed.length>=levels.length){
        unlockAchievement("all");
    }

    if(save.coins>=50){
        unlockAchievement("coins");
    }
}

/* ---------- PAUSE ---------- */

document.getElementById("pauseButton").addEventListener("click",()=>{
    if(!running)return;

    paused=true;
    document.getElementById("pausePanel").classList.remove("hidden");
});

function resumeGame(){
    document.getElementById("pausePanel").classList.add("hidden");

    paused=false;

    lastTime=performance.now();
}

/* ---------- KEYBOARD ---------- */

window.addEventListener("keydown",e=>{
    if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){
        e.preventDefault();

        if(document.getElementById("game").classList.contains("hidden")){
            return;
        }

        jump();
    }

    if(e.code==="ArrowLeft" || e.code==="KeyA"){
        leftPressed=true;
    }

    if(e.code==="ArrowRight" || e.code==="KeyD"){
        rightPressed=true;
    }

    if(e.code==="Escape"){
        if(running && !paused){
            paused=true;
            document.getElementById("pausePanel").classList.remove("hidden");
        }
    }
});

window.addEventListener("keyup",e=>{
    if(e.code==="ArrowLeft" || e.code==="KeyA"){
        leftPressed=false;
    }

    if(e.code==="ArrowRight" || e.code==="KeyD"){
        rightPressed=false;
    }
});

/* ---------- MOBILE CONTROLS ---------- */

function holdButton(element,down,up){
    element.addEventListener("pointerdown",e=>{
        e.preventDefault();
        down();
    });

    element.addEventListener("pointerup",e=>{
        e.preventDefault();
        up();
    });

    element.addEventListener("pointercancel",up);
    element.addEventListener("pointerleave",up);
}

holdButton(
    document.getElementById("mobileLeft"),
    ()=>{leftPressed=true;},
    ()=>{leftPressed=false;}
);

holdButton(
    document.getElementById("mobileRight"),
    ()=>{rightPressed=true;},

);

document.getElementById("mobileJump").addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopPropagation();

    jump();

    getAudio();
});

});

document.addEventListener("pointerdown",()=>{

},{once:false});

    }
});
