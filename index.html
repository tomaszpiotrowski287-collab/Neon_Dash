<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash 2.6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{color:#fff;border:0;cursor:pointer;user-select:none;touch-action:manipulation}
button:active{transform:scale(.97)}
#menu{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px 14px 30px;background:radial-gradient(circle at 50% 0%,#29327d,#090a20 43%,#020207)}
.logo{margin:10px 0 3px;font-size:clamp(32px,8vw,58px);font-weight:900;letter-spacing:5px;text-align:center;text-shadow:0 0 10px #00eaff,0 0 25px #00eaff,0 0 50px #a855ff;animation:pulse 1.8s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.025)}}
.subtitle{opacity:.7;text-align:center;margin-bottom:14px}
.topCards{width:min(900px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.topCard{background:#10142b;border:1px solid #35416f;border-radius:16px;padding:11px;text-align:center}
.topCard small{display:block;opacity:.6;margin-bottom:4px}
.progress{width:min(900px,100%);background:#11152d;border:2px solid #303963;border-radius:17px;padding:14px;margin-bottom:12px}
.progressTop{display:flex;justify-content:space-between}
.bar{height:12px;background:#050712;border-radius:20px;overflow:hidden;margin-top:8px}
#menuBar{height:100%;width:0;background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);transition:.35s}
#doneText{text-align:center;opacity:.65;margin-top:7px;font-size:13px}
.quick{width:min(900px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button,#achBtn{min-height:46px;padding:10px;border-radius:13px;background:#202750;border:1px solid #465582;font-weight:bold}
#dailyCard{width:min(900px,100%);padding:14px;margin-bottom:12px;border-radius:17px;border:2px solid #8d5cff;background:linear-gradient(135deg,#25164d,#11152d)}
#dailyBtn{margin-top:10px;width:100%;min-height:44px;border-radius:12px;background:#7c4dff;font-weight:bold}
.searchRow{width:min(900px,100%);margin-bottom:10px}
#search{width:100%;min-height:44px;padding:10px 13px;color:#fff;background:#0d1125;border:1px solid #39476f;border-radius:12px;outline:none}
#levels{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:20px}
.level{min-height:94px;text-align:left;padding:12px;border-radius:15px;border:2px solid #303861;background:linear-gradient(135deg,#171c3b,#0d1024);position:relative}
.levelStatus{float:right;font-size:20px}.levelName{font-weight:900;font-size:18px;padding-right:28px}.levelInfo,.levelBest{font-size:12px;opacity:.7;margin-top:5px}.levelBest{color:#ffd43b}
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000b;padding:15px}
.panel{width:min(620px,100%);max-height:90vh;overflow:auto;background:#10142c;border:2px solid #3d4a7d;border-radius:20px;padding:20px}
.panel h2{text-align:center;margin-top:0}.panel button{width:100%;min-height:44px;margin-top:9px;padding:10px;border-radius:12px;background:#29335e;font-weight:bold}
.ach,.mission,.shopItem,.stat{padding:11px;margin:7px 0;border-radius:12px;background:#191e3b}.ach{opacity:.4}.ach.on{opacity:1;border:1px solid #00eaff}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#game{position:fixed;inset:0;display:none;touch-action:none;overscroll-behavior:none;background:#03030a}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;z-index:5;left:10px;right:10px;top:10px;pointer-events:none;text-shadow:0 2px 5px #000}
.hudLine{display:flex;justify-content:space-between;gap:8px;font-size:clamp(11px,2.8vw,17px);font-weight:bold}
.hudBar{margin-top:7px;height:9px;background:#0008;border-radius:20px;overflow:hidden}
#gameBar{height:100%;width:0;background:#00eaff;box-shadow:0 0 12px #00eaff}
.gameButtons{position:absolute;right:10px;top:10px;z-index:10;display:flex;gap:7px}
.gameButtons button{min-width:44px;min-height:44px;padding:8px 11px;background:#10162ddd;border:1px solid #53618e;border-radius:10px}
@media(max-width:650px){.quick{grid-template-columns:repeat(2,1fr)}#levels{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="menu">
<div class="logo">NEON DASH</div>
<div class="subtitle">Ultimate Edition 2.6 • Dotknij / kliknij / SPACJA</div>

<div class="topCards">
<div class="topCard"><small>🪙 MONETY</small><b id="coinsUI">0</b></div>
<div class="topCard"><small>⭐ XP</small><b id="xpUI">0</b></div>
<div class="topCard"><small>🔥 SERIA</small><b id="streakUI">0</b></div>
</div>

<div class="progress">
<div class="progressTop"><b>📊 PROGRES GRY</b><b id="progressText">0%</b></div>
<div class="bar"><div id="menuBar"></div></div>
<div id="doneText">0 / 20 poziomów</div>
</div>

<div class="quick">
<button id="shopBtn">🛒 SKLEP</button>
<button id="missionsBtn">🎯 MISJE</button>
<button id="statsBtn">📈 STATYSTYKI</button>
<button id="randomBtn">🎲 LOSOWY</button>
</div>

<div id="dailyCard">
<b>📅 DAILY CHALLENGE</b>
<div id="dailyInfo">Dzisiejsze wyzwanie.</div>
<button id="dailyBtn">▶ ZAGRAJ DAILY</button>
</div>

<div class="searchRow"><input id="search" placeholder="🔎 Szukaj poziomu..."></div>
<div id="levels"></div>
<button id="achBtn">🏆 ACHIEVEMENTY</button>
</div>

<div id="achievements" class="overlay"><div class="panel"><h2>🏆 ACHIEVEMENTY</h2><div id="achList"></div><button id="closeAch">ZAMKNIJ</button></div></div>
<div id="shop" class="overlay"><div class="panel"><h2>🛒 SKLEP</h2><p id="shopCoins"></p><div id="shopList"></div><button id="closeShop">ZAMKNIJ</button></div></div>
<div id="missions" class="overlay"><div class="panel"><h2>🎯 MISJE</h2><div id="missionList"></div><button id="closeMissions">ZAMKNIJ</button></div></div>
<div id="stats" class="overlay"><div class="panel"><h2>📈 STATYSTYKI</h2><div id="statsContent"></div><button id="closeStats">ZAMKNIJ</button></div></div>

<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
<div class="hudLine">
<span id="levelName">LEVEL</span>
<span id="coinsText">🪙 0/3</span>
<span id="percent">0%</span>
</div>
<div class="hudBar"><div id="gameBar"></div></div>
</div>

<div class="gameButtons">
<button id="pauseBtn">⏸</button>
<button id="soundBtn">🔊</button>
<button id="menuBtn">☰</button>
</div>

<div id="pause" class="overlay">
<div class="panel">
<h2>⏸ PAUZA</h2>
<button id="resume">▶ WRÓĆ DO GRY</button>
<button id="restartPause">🔄 RESTART</button>
<button id="pauseMenu">☰ MENU</button>
</div>
</div>

<div id="finish" class="overlay">
<div class="panel">
<h2 id="finishTitle">🎉 UKOŃCZONO!</h2>
<div id="finishInfo"></div>
<button id="again">🔄 ZAGRAJ PONOWNIE</button>
<button id="nextLevel">➡️ NASTĘPNY POZIOM</button>
<button id="finishMenu">☰ MENU</button>
</div>
</div>
</div>

<script>
"use strict";

/* =========================
   DANE
========================= */

const LEVELS=[
["NEON RUSH","⭐⭐",280,"#00eaff",124],
["CRYSTAL DRIVE","⭐⭐⭐",295,"#72a7ff",112],
["LAVA PULSE","⭐⭐⭐⭐",310,"#ff4d42",140],
["SKY CIRCUIT","⭐⭐⭐⭐",305,"#9c7bff",132],
["VIOLET RUN","⭐⭐⭐⭐",320,"#d35cff",128],
["SHADOW FACTORY","⭐⭐⭐⭐⭐",325,"#b44cff",118],
["CYBER STORM","⭐⭐⭐⭐⭐",335,"#27f0c5",136],
["INFERNO CORE","⭐⭐⭐⭐⭐",345,"#ff7338",145],
["ELECTRIC VOID","⭐⭐⭐⭐⭐⭐",355,"#35b7ff",150],
["GRAVITY BREAK","⭐⭐⭐⭐⭐⭐",340,"#45ff9a",142],
["OVERDRIVE","⭐⭐⭐⭐⭐⭐",365,"#ff3bea",154],
["FINAL CHAOS","⭐⭐⭐⭐⭐⭐",375,"#ff247f",158],
["NEON HYPER","⭐⭐⭐⭐⭐⭐",380,"#00ffc8",160],
["DARK MATTER","⭐⭐⭐⭐⭐⭐⭐",390,"#925cff",162],
["PHANTOM RUSH","⭐⭐⭐⭐⭐⭐⭐",400,"#ff55b8",165],
["VOID STORM","⭐⭐⭐⭐⭐⭐⭐",410,"#42b9ff",168],
["INFINITE CORE","⭐⭐⭐⭐⭐⭐⭐",420,"#ff9238",170],
["CYBERFALL","⭐⭐⭐⭐⭐⭐⭐",430,"#35ffd0",172],
["ULTRA NOVA","⭐⭐⭐⭐⭐⭐⭐⭐",440,"#ff3bda",176],
["FINAL OVERDRIVE","⭐⭐⭐⭐⭐⭐⭐⭐",450,"#ff247f",180]
];

const SKINS=[
["cyan","CYAN","#00eaff",0],
["purple","PURPLE","#a855ff",3],
["pink","PINK","#ff27d7",5],
["green","NEON GREEN","#49ff9a",7],
["orange","ORANGE","#ff7338",10],
["gold","GOLD","#ffd43b",12],
["white","WHITE","#fff",15],
["red","RED","#ff3b4f",18]
];

const SHOP=[
["trail_fire","🔥 FIRE TRAIL",60],
["trail_electric","⚡ ELECTRIC TRAIL",80],
["trail_rainbow","🌈 RAINBOW TRAIL",120],
["trail_ghost","👻 GHOST TRAIL",150],
["effect_burst","💥 MEGA DEATH",100],
["effect_star","⭐ STAR DEATH",140]
];

const ACH=[
["first","🎮 Pierwszy krok","Ukończ NEON RUSH."],
["three","⚡ Rozgrzewka","Ukończ 3 poziomy."],
["six","🔥 Weteran","Ukończ 6 poziomów."],
["ten","💥 Połowa drogi","Ukończ 10 poziomów."],
["all","👑 Mistrz Neon Dash","Ukończ wszystkie 20 poziomów."],
["coins10","🪙 Łowca monet","Zbierz 10 monet."],
["coins25","💰 Kolekcjoner","Zbierz 25 monet."],
["coins50","💎 Bogacz","Zbierz 50 monet."],
["perfect","✨ Perfekcja","Ukończ poziom bez śmierci."],
["survivor","🛡️ Twardziel","Ukończ poziom po 3+ śmierciach."],
["allcoins","🌟 Pełna kolekcja","Zbierz wszystkie 3 monety."],
["speedrunner","⚡ Speedrunner","Ukończ poziom bez śmierci i zbierz wszystkie monety."],
["rich","💰 Skarbiec","Zbierz 100 monet."],
["shop","🛒 Kolekcjoner","Kup pierwszy przedmiot."],
["daily","📅 Codzienny","Ukończ Daily Challenge."]
];

const MISSIONS=[
["levels3","Ukończ 3 poziomy"],
["levels10","Ukończ 10 poziomów"],
["coins25","Zbierz 25 monet"],
["coins50","Zbierz 50 monet"],
["deaths10","Zgiń 10 razy"]
];

/* =========================
   DOM
========================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const levelsBox=document.getElementById("levels");
const search=document.getElementById("search");

const achievements=document.getElementById("achievements");
const achList=document.getElementById("achList");

const shop=document.getElementById("shop");
const shopList=document.getElementById("shopList");

const missions=document.getElementById("missions");
const missionList=document.getElementById("missionList");

const stats=document.getElementById("stats");
const statsContent=document.getElementById("statsContent");

const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

const player={
x:150,y:0,size:34,vy:0,rot:0,grounded:false
};

/* =========================
   STORAGE
========================= */

function get(k,d){
try{
const v=localStorage.getItem(k);
return v===null?d:v;
}catch(e){return d}
}

function set(k,v){
try{localStorage.setItem(k,String(v))}catch(e){}
}

function num(k,d=0){
const n=Number(get(k,d));
return Number.isFinite(n)?n:d;
}

function completed(i){
return get("nd_level_"+i,"0")==="1";
}

function completedCount(){
let n=0;
for(let i=0;i<LEVELS.length;i++){
if(completed(i))n++;
}
return n;
}

function totalCoins(){return num("nd_totalCoins",0)}
function totalDeaths(){return num("nd_totalDeaths",0)}
function addXP(x){set("nd_xp",num("nd_xp")+x)}
function addCoins(x){set("nd_totalCoins",totalCoins()+x)}

/* =========================
   STATE
========================= */

let W=innerWidth;
let H=innerHeight;
let ground=H*.78;

let current=0;
let running=false;
let paused=false;
let finished=false;
let dying=false;
let dailyMode=false;

let world=0;
let last=0;
let raf=0;

let deaths=0;
let runCoins=0;
let combo=0;
let bestCombo=0;

let gravity=1;

let obstacles=[];
let coinObjects=[];
let pads=[];
let portals=[];
let particles=[];
let stars=[];
let trail=[];

let shake=0;
let flash=0;

let audio=null;
let musicTimer=null;
let musicIndex=0;

let sound=get("nd_sound","1")==="1";
let selectedSkin=get("nd_skin","cyan");

/* =========================
   CANVAS
========================= */

function resizeCanvas(){

W=Math.max(260,innerWidth);
H=Math.max(260,innerHeight);

const d=Math.min(Math.max(devicePixelRatio||1,1),2);

canvas.width=Math.round(W*d);
canvas.height=Math.round(H*d);
canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(d,0,0,d,0,0);

ground=Math.max(150,Math.min(H-50,H*.78));

if(!running){
player.y=gravity===1?ground-player.size:0;
}

createStars();
}

addEventListener("resize",resizeCanvas,{passive:true});

/* =========================
   MENU
========================= */

function renderMenu(){

levelsBox.innerHTML="";

const q=search.value.trim().toLowerCase();

LEVELS.forEach((l,i)=>{

if(q&&!((i+1)+" "+l[0]).toLowerCase().includes(q))return;

const b=document.createElement("button");

b.className="level";
b.type="button";

const best=num("nd_best_"+i,0);

b.innerHTML=
'<span class="levelStatus">'+
(completed(i)?"✅":"▶️")+
'</span>'+
'<div class="levelName">'+(i+1)+". "+l[0]+'</div>'+
'<div class="levelInfo">'+l[1]+" • "+l[2]+" px/s"+'</div>'+
'<div class="levelBest">'+
(best?"🏆 "+best+"%":"Brak rekordu")+
'</div>';

b.setAttribute("onclick","startLevel("+i+")");

levelsBox.appendChild(b);
});

const done=completedCount();
const p=Math.round(done/20*100);

document.getElementById("progressText").textContent=p+"%";
document.getElementById("menuBar").style.width=p+"%";
document.getElementById("doneText").textContent=done+" / 20 poziomów";

document.getElementById("coinsUI").textContent=totalCoins();
document.getElementById("xpUI").textContent=num("nd_xp");
document.getElementById("streakUI").textContent=num("nd_streak");

updateDaily();
}

search.addEventListener("input",renderMenu);

/* =========================
   DAILY
========================= */

function dailyIndex(){

const d=new Date();

const key=
d.getFullYear()*10000+
(d.getMonth()+1)*100+
d.getDate();

return key%20;
}

function updateDaily(){

const i=dailyIndex();

document.getElementById("dailyInfo").textContent=
"Dzisiejszy poziom: "+(i+1)+". "+LEVELS[i][0]+" • 25 🪙 + 50 XP";

const done=
get("nd_dailyDate","")===
String(i)+"_"+new Date().toDateString();

document.getElementById("dailyBtn").textContent=
done?"✅ DAILY UKOŃCZONE":"▶ ZAGRAJ DAILY";
}

document.getElementById("dailyBtn").onclick=()=>{
dailyMode=true;
startLevel(dailyIndex());
};

/* =========================
   START
========================= */

function startLevel(index){

index=Number(index);

if(!Number.isInteger(index)||index<0||index>=20){
alert("Nieprawidłowy poziom.");
return;
}

try{

current=index;
running=false;
paused=false;
finished=false;
dying=false;

if(raf){
cancelAnimationFrame(raf);
raf=0;
}

stopMusic();

deaths=0;
runCoins=0;
combo=0;
bestCombo=0;

world=0;
shake=0;
flash=0;

collected=new Set();

obstacles=[];
coinObjects=[];
pads=[];
portals=[];
particles=[];
trail=[];
stars=[];

/*
  GRAVITY BREAK:
  ten poziom zaczyna normalnie.
  Portal dopiero później odwraca grawitację.
*/
gravity=1;

menu.style.display="none";
game.style.display="block";

pause.style.display="none";
finish.style.display="none";

resizeCanvas();
generateLevel();
resetPlayer();
updateHUD();

running=true;
last=performance.now();

draw();

raf=requestAnimationFrame(loop);

if(sound)startMusic();

}catch(e){

console.error(e);
alert("Błąd uruchamiania poziomu:\n\n"+e.message);
backToMenu();
}
}

/* =========================
   GENEROWANIE
========================= */

function generateLevel(){

obstacles=[];
coinObjects=[];
pads=[];
portals=[];

const length=10000+current*430;

/*
  Ważna zmiana:
  GRAVITY BREAK ma specjalny układ.
  Najpierw normalna sekcja.
  Po portalu grawitacyjnym kolce pojawiają się
  na dole, czyli po stronie przeciwnej do gracza.
*/

if(current===9){

let x=650;

/* normalna część */
spike(x);x+=430;
saw(x);x+=520;
spike(x);x+=430;
pad(x);x+=650;

/* portal znajduje się w bezpiecznej przestrzeni */
gravityPortal(x);
x+=650;

/*
  Po zmianie grawitacji:
  gracz jest na górze,
  więc przeszkody są na dole.
*/
for(let i=0;x<length-500;i++){

const type=i%5;

if(type===0){
bottomSpike(x);
x+=430;
}

else if(type===1){
bottomSaw(x);
x+=500;
}

else if(type===2){
bottomSpike(x);
x+=390;
}

else if(type===3){
bottomGap(x,135);
x+=590;
}

else{
speedPortal(x);
bottomSpike(x+220);
x+=700;
}
}

}else{

const sets=[
["spike","spike","saw","gap","spike","pad"],
["spike","double","saw","gap","pad","spike"],
["saw","spike","gap","double","speed","saw"],
["spike","pad","saw","gap","spike","speed"],
["double","saw","spike","gap","pad","speed"],
["saw","spike","gap","spike","speed","saw"]
];

const patterns=sets[current%sets.length];

let x=620;
let i=0;

while(x<length-500){

const type=patterns[i%patterns.length];

if(type==="spike"){
spike(x);
x+=390;
}

else if(type==="double"){
spike(x);
spike(x+62);
x+=540;
}

else if(type==="saw"){
saw(x);
x+=500;
}

else if(type==="gap"){
gap(x,135);
x+=590;
}

else if(type==="pad"){
pad(x);
spike(x+210);
x+=620;
}

else if(type==="speed"){
speedPortal(x);
spike(x+230);
saw(x+470);
x+=760;
}

i++;
}
}

/* trzy bezpieczne monety */
const targets=[
length*.25,
length*.52,
length*.79
];

targets.forEach((target,id)=>{

let x=target;

for(let tries=0;tries<60;tries++){

let bad=false;

for(const o of obstacles){

if(
Math.abs(x-o.x)<110
){
bad=true;
break;
}
}

if(!bad)break;

x+=90;
}

coinObjects.push({
id:id,
x:x,
collected:false
});
});
}

/* =========================
   OBIEKTY
========================= */

function spike(x){
obstacles.push({type:"spike",x:x,side:"bottom"});
}

function bottomSpike(x){
obstacles.push({type:"spike",x:x,side:"bottom"});
}

function saw(x){
obstacles.push({type:"saw",x:x,r:27,side:"bottom"});
}

function bottomSaw(x){
obstacles.push({type:"saw",x:x,r:27,side:"bottom"});
}

function gap(x,w){
obstacles.push({type:"gap",x:x,w:w,side:"bottom"});
}

function bottomGap(x,w){
obstacles.push({type:"gap",x:x,w:w,side:"bottom"});
}

function pad(x){
pads.push({x:x,used:false});
}

function speedPortal(x){
portals.push({type:"speed",x:x,used:false});
}

function gravityPortal(x){
portals.push({type:"gravity",x:x,used:false});
}

/* =========================
   RESET
========================= */

function resetPlayer(){

player.x=Math.max(80,Math.min(180,W*.22));

player.y=
gravity===1?
ground-player.size:
0;

player.vy=0;
player.rot=0;
player.grounded=true;
}

/* =========================
   STEROWANIE
========================= */

function jump(){

if(!running||paused||dying||finished)return;

if(player.grounded){

player.vy=-720*gravity;
player.grounded=false;

for(let i=0;i<10;i++){
particle(
player.x+17,
player.y+17,
(Math.random()-.5)*150,
Math.random()*80,
.4,
3,
"jump"
);
}

shake=3;
}
}

game.addEventListener("pointerdown",e=>{
if(e.target.closest(".gameButtons")||
e.target.closest("#pause")||
e.target.closest("#finish"))return;
jump();
},{passive:true});

addEventListener("keydown",e=>{

if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
e.preventDefault();
jump();
}

if(e.code==="Escape"||e.code==="KeyP"){
if(running)togglePause();
}
});

/* =========================
   UPDATE
========================= */

function update(dt){

let speed=LEVELS[current][2];

for(const p of portals){

const px=world+player.x+17;

if(
p.type==="speed"&&
px>p.x-20&&
px<p.x+180
){
speed*=1.16;
}
}

world+=speed*dt;

player.vy+=2050*gravity*dt;
player.y+=player.vy*dt;

/*
  KLUCZOWA POPRAWKA GRAWITACJI:
  Przy gravity = 1 gracz ląduje na dole.
  Przy gravity = -1 gracz ląduje na górze.
*/
if(gravity===1){

const floor=ground-player.size;

if(player.y>=floor&&!gapUnder()){

player.y=floor;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot+=dt*8;
}

}else{

const ceiling=0;

if(player.y<=ceiling&&!gapUnder()){

player.y=ceiling;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot-=dt*8;
}
}

checkPads();
checkPortals();
checkCoins();
collisions();

if(Math.random()<.9){

trail.push({
x:player.x+17,
y:player.y+17,
life:.32,
size:18
});
}

updateTrail(dt);
updateParticles(dt);

shake=Math.max(0,shake-dt*13);
flash=Math.max(0,flash-dt*3);
}

/*
  Dziura jest sprawdzana tylko wtedy,
  gdy gracz faktycznie znajduje się przy odpowiedniej
  powierzchni.
*/
function gapUnder(){

const center=world+player.x+player.size/2;

for(const o of obstacles){

if(
o.type==="gap"&&
center>o.x&&
center<o.x+o.w
){
return true;
}
}

return false;
}

/* =========================
   PORTALE / PADY
========================= */

function checkPads(){

for(const p of pads){

if(p.used)continue;

const px=world+player.x+17;

if(
px>p.x&&
px<p.x+55&&
player.grounded&&
gravity===1
){

p.used=true;
player.vy=-980;
player.grounded=false;
shake=5;
}
}
}

function checkPortals(){

for(const p of portals){

if(p.used)continue;

const px=world+player.x+17;

if(px>p.x&&px<p.x+60){

p.used=true;

if(p.type==="gravity"){

/*
  Bezpieczna zmiana:
  gracz zostaje ustawiony od razu na nowej stronie.
  Dzięki temu nie przelatuje przez kolce.
*/
gravity*=-1;
player.vy=0;
player.grounded=true;

if(gravity===1){
player.y=ground-player.size;
}else{
player.y=0;
}

/*
  Przesuwamy portalowe przeszkody,
  aby pierwsza przeszkoda po zmianie była
  wystarczająco daleko.
*/
for(const o of obstacles){

if(o.x>p.x&&o.x<p.x+300){
o.x+=180;
}
}

shake=7;

for(let i=0;i<30;i++){
particle(
p.x-world,
gravity===1?ground*.45:H*.45,
(Math.random()-.5)*300,
(Math.random()-.5)*300,
.8,
4,
"portal"
);
}
}
}
}
}

/* =========================
   MONETY
========================= */

function checkCoins(){

for(const c of coinObjects){

if(c.collected)continue;

const cx=c.x-world;
const cy=gravity===1?ground-125:125;

if(
Math.hypot(
player.x+17-cx,
player.y+17-cy
)<38
){

c.collected=true;
runCoins=++combo>bestCombo?combo:bestCombo;
bestCombo=Math.max(bestCombo,combo);

document.getElementById("coinsText").textContent=
"🪙 "+collectedCoins()+"/3";

for(let i=0;i<20;i++){
particle(
cx,cy,
(Math.random()-.5)*250,
(Math.random()-.7)*250,
.7,
4,
"coin"
);
}
}
}
}

function collectedCoins(){

let n=0;

for(const c of coinObjects){
if(c.collected)n++;
}

return n;
}

/* =========================
   KOLIZJE
========================= */

function collisions(){

const px=world+player.x;
const left=px+7;
const right=px+player.size-7;
const top=player.y+7;
const bottom=player.y+player.size-5;

for(const o of obstacles){

/*
  Kolce są zawsze rysowane po stronie
  przeciwnej do gracza.
*/
if(o.type==="spike"){

if(
gravity===1&&
o.side==="bottom"&&
right>o.x+6&&
left<o.x+46&&
bottom>ground-45
){
die();
return;
}

if(
gravity===-1&&
o.side==="bottom"&&
right>o.x+6&&
left<o.x+46&&
top<47
){
/*
  Ten warunek nie zabija od samego bycia
  na górze — kolce bottom nie mogą być
  dotykane od góry.
*/
continue;
}
}

/*
  Gdy grawitacja jest odwrócona,
  dolne kolce nie są zagrożeniem.
  Gracz jest na górze.
*/
if(o.type==="saw"){

const cy=
gravity===1?
ground-o.r:
ground-o.r;

/*
  Piły pozostają na dole.
  Przy odwróconej grawitacji są więc
  bezpieczne, dopóki gracz nie spadnie.
*/
const cx=o.x;

const nx=Math.max(left,Math.min(cx,right));
const ny=Math.max(top,Math.min(cy,bottom));

const dx=cx-nx;
const dy=cy-ny;

if(
dx*dx+dy*dy<
(o.r-6)*(o.r-6)
){
die();
return;
}
}

if(o.type==="gap"){

const center=world+player.x+player.size/2;

if(
gravity===1&&
center>o.x&&
center<o.x+o.w&&
bottom>=ground-7
){
die();
return;
}

/*
  Przy grawitacji odwróconej dziury na dole
  nie zabierają gracza z sufitu.
*/
}
}
}

/* =========================
   ŚMIERĆ
========================= */

function die(){

if(dying||finished||!running)return;

dying=true;
running=false;

deaths++;
set("nd_totalDeaths",totalDeaths()+1);

combo=0;
shake=14;
flash=1;

for(let i=0;i<45;i++){
particle(
player.x+17,
player.y+17,
(Math.random()-.5)*500,
(Math.random()-.6)*500,
.9,
Math.random()*7+2,
"death"
);
}

setTimeout(()=>{
if(finished)return;
dying=false;
startLevel(current);
},550);
}

/* =========================
   KONIEC
========================= */

function checkWin(){

const length=10000+current*430;

if(world>=length)finishLevel();
}

function finishLevel(){

if(finished)return;

finished=true;
running=false;

stopMusic();

set("nd_level_"+current,"1");

if(100>num("nd_best_"+current,0)){
set("nd_best_"+current,100);
}

addCoins(runCoins);

const xp=40+current*5+runCoins*10;
addXP(xp);

if(deaths===0)unlock("perfect");
if(deaths>=3)unlock("survivor");
if(runCoins===3)unlock("allcoins");

if(completedCount()>=1)unlock("first");
if(completedCount()>=3)unlock("three");
if(completedCount()>=6)unlock("six");
if(completedCount()>=10)unlock("ten");
if(completedCount()>=20)unlock("all");

if(dailyMode){
set(
"nd_dailyDate",
String(current)+"_"+new Date().toDateString()
);
set("nd_dailyDone","1");
addCoins(25);
addXP(50);
unlock("daily");
dailyMode=false;
}

document.getElementById("finishInfo").innerHTML=
"<b>"+LEVELS[current][0]+"</b><br>"+
"🪙 Monety: "+runCoins+"/3<br>"+
"☠️ Śmierci: "+deaths+"<br>"+
"🔥 Combo: "+bestCombo+"<br>"+
"⭐ XP: +"+xp;

finish.style.display="flex";

renderMenu();
}

/* =========================
   LOOP
========================= */

function loop(t){

if(!running)return;

if(paused){
last=t;
raf=requestAnimationFrame(loop);
return;
}

let dt=(t-last)/1000;

if(!Number.isFinite(dt)||dt<0)dt=0;

dt=Math.min(dt,.045);

last=t;

update(dt);
draw();
checkWin();

if(running)raf=requestAnimationFrame(loop);
}

   HUD
========================= */

function updateHUD(){

document.getElementById("levelName").textContent=
(current+1)+" • "+LEVELS[current][0];

/* =========================
   RYSOWANIE
========================= */

function draw(){

const color=LEVELS[current][3];

ctx.clearRect(0,0,W,H);

ctx.save();

if(shake){
ctx.translate(
(Math.random()-.5)*shake,
(Math.random()-.5)*shake
);
}

const bg=ctx.createLinearGradient(0,0,0,H);
bg.addColorStop(0,"#080b20");
bg.addColorStop(1,"#020207");

ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);

drawStars();
drawGrid();

ctx.fillStyle="#0b0d18";
ctx.fillRect(0,ground,W,H-ground);

ctx.strokeStyle=color;
ctx.lineWidth=3;
ctx.shadowColor=color;
ctx.shadowBlur=12;

ctx.beginPath();
ctx.moveTo(0,ground);
ctx.lineTo(W,ground);
ctx.stroke();

ctx.shadowBlur=0;

for(const o of obstacles){

const x=o.x-world;

if(x<-150||x>W+150)continue;

if(o.type==="spike")drawSpike(x,o.side);

if(o.type==="saw")drawSaw(x,o.r,o.side);

if(o.type==="gap"){
ctx.fillStyle="#020207";
ctx.fillRect(x,ground,o.w,H-ground);
}
}

for(const p of pads){
const x=p.x-world;
if(x>-80&&x<W+80)drawPad(x);
}

for(const p of portals){
const x=p.x-world;
if(x>-100&&x<W+100){
p.type==="gravity"?
drawGravityPortal(x):
drawSpeedPortal(x);
}
}

for(const c of coinObjects){

if(c.collected)continue;

const x=c.x-world;

if(x>-50&&x<W+50){
drawCoin(
x,
gravity===1?ground-125:125
);
}
}

drawTrail();

if(!dying&&!finished)drawPlayer();

drawParticles();

if(flash){
ctx.fillStyle="rgba(255,255,255,.3)";
ctx.fillRect(0,0,W,H);
}

ctx.restore();

const length=10000+current*430;
const p=Math.min(100,Math.floor(world/length*100));

document.getElementById("percent").textContent=p+"%";
document.getElementById("gameBar").style.width=p+"%";
}

/* =========================
   GRACZ
========================= */

function skinColor(){

for(const s of SKINS){
if(s[0]===selectedSkin)return s[2];
}

return LEVELS[current][3];
}

function drawPlayer(){

const color=skinColor();

ctx.save();

ctx.translate(
player.x+17,
player.y+17
);

ctx.rotate(player.rot);

ctx.shadowColor=color;
ctx.shadowBlur=20;
ctx.fillStyle=color;

ctx.fillRect(-17,-17,34,34);

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.strokeRect(-17,-17,34,34);

ctx.fillStyle="#05050c";
ctx.fillRect(-9,-7,5,5);
ctx.fillRect(4,-7,5,5);

ctx.restore();
}

/* =========================
   PRZESZKODY
========================= */

function drawSpike(x,side){

const color=LEVELS[current][3];

ctx.save();

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=16;

ctx.beginPath();

/*
  side="bottom" oznacza kolce na dole.
  Nie zmieniamy ich strony podczas lotu.
*/
ctx.moveTo(x,ground);
ctx.lineTo(x+23,ground-47);
ctx.lineTo(x+46,ground);

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();
}

function drawSaw(x,r,side){

const color=LEVELS[current][3];

const cy=ground-r;

ctx.save();

ctx.translate(x,cy);
ctx.rotate(performance.now()/280);

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=17;

const teeth=14;

ctx.beginPath();

for(let i=0;i<teeth*2;i++){

const a=i*Math.PI/teeth;
const rr=i%2===0?r:r*.7;

const xx=Math.cos(a)*rr;
const yy=Math.sin(a)*rr;

if(i===0)ctx.moveTo(xx,yy);
else ctx.lineTo(xx,yy);
}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;
ctx.fillStyle="#05050c";

ctx.beginPath();
ctx.arc(0,0,r*.28,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function drawCoin(x,y){

const s=1+Math.sin(performance.now()/130)*.1;

ctx.save();
ctx.translate(x,y);
ctx.scale(s,s);

ctx.shadowColor="#ffd43b";
ctx.shadowBlur=22;
ctx.fillStyle="#ffd43b";

ctx.beginPath();
ctx.arc(0,0,14,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();
}

/* =========================
   PORTALE
========================= */

function drawPad(x){

ctx.save();

ctx.fillStyle="#49ff9a";
ctx.shadowColor="#49ff9a";
ctx.shadowBlur=18;

ctx.beginPath();
ctx.arc(x+25,ground-10,20,Math.PI,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();
}

function drawSpeedPortal(x){

ctx.save();

ctx.translate(x+25,H*.48);

ctx.strokeStyle="#ffe14a";
ctx.shadowColor="#ffe14a";
ctx.shadowBlur=20;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(0,0,30+Math.sin(performance.now()/120)*4,0,Math.PI*2);
ctx.stroke();

ctx.shadowBlur=0;
ctx.fillStyle="#fff";
ctx.font="bold 18px Arial";
ctx.textAlign="center";
ctx.fillText(">>",0,7);

ctx.restore();
}

function drawGravityPortal(x){

ctx.save();

ctx.translate(x+25,H*.48);

ctx.strokeStyle="#ff4be8";
ctx.shadowColor="#ff4be8";
ctx.shadowBlur=22;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(0,0,30+Math.sin(performance.now()/140)*4,0,Math.PI*2);
ctx.stroke();

ctx.shadowBlur=0;
ctx.fillStyle="#fff";
ctx.font="bold 22px Arial";
ctx.textAlign="center";
ctx.fillText("↕",0,8);

ctx.restore();
}

/* =========================
   TŁO
========================= */

function createStars(){

stars=[];

for(let i=0;i<75;i++){

stars.push({
x:Math.random()*W,
y:Math.random()*Math.max(100,ground*.9),
r:Math.random()*2+.5,
v:Math.random()*.8+.2
});
}
}

function drawStars(){

ctx.fillStyle="#fff";

for(const s of stars){

s.x-=s.v;

if(s.x<0)s.x=W;

ctx.globalAlpha=.3+s.r*.2;

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
}

ctx.globalAlpha=1;
}

function drawGrid(){

const color=LEVELS[current][3];

ctx.strokeStyle=color;
ctx.globalAlpha=.08;

const size=70;
const off=-(world*.25)%size;

for(let x=off;x<W;x+=size){

ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,ground);
ctx.stroke();
}

for(let y=40;y<ground;y+=size){

ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(W,y);
ctx.stroke();
}

ctx.globalAlpha=1;
}

/* =========================
   TRAIL
========================= */

function updateTrail(dt){

for(let i=trail.length-1;i>=0;i--){

trail[i].life-=dt;

if(trail[i].life<=0)trail.splice(i,1);
}

if(trail.length>35){
trail.splice(0,trail.length-35);
}
}

function drawTrail(){

const color=skinColor();

for(const t of trail){

ctx.globalAlpha=Math.max(0,t.life/.32)*.3;
ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=15;

ctx.fillRect(
t.x-t.size/2,
t.y-t.size/2,
t.size,
t.size
);
}

ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

/* =========================
   PARTICLES
========================= */

function particle(x,y,vx,vy,life,size,type){

if(particles.length>280)return;

particles.push({
x,y,vx,vy,life,max:life,size,type,
rot:Math.random()*6,
spin:(Math.random()-.5)*10
});
}

function updateParticles(dt){

for(let i=particles.length-1;i>=0;i--){

const p=particles[i];

p.life-=dt;
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.vy+=500*dt;
p.rot+=p.spin*dt;

if(p.life<=0)particles.splice(i,1);
}
}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=Math.max(0,p.life/p.max);

let c=LEVELS[current][3];

if(p.type==="coin")c="#ffd43b";
if(p.type==="portal")c="#ff4be8";
if(p.type==="pad")c="#49ff9a";

ctx.fillStyle=c;

ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(p.rot);
ctx.shadowColor=c;
ctx.shadowBlur=10;

ctx.fillRect(
-p.size/2,
-p.size/2,
p.size,
p.size
);

ctx.restore();
}

ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

/* =========================
   AUDIO
========================= */

function startMusic(){

stopMusic();

try{

if(!audio){
audio=new(window.AudioContext||window.webkitAudioContext)();
}

if(audio.state==="suspended")audio.resume();

const notes=[220,277,330,440,523,440,330,277];

musicIndex=0;

function note(){

if(!sound||!running||paused)return;

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.type=current%3===0?"square":current%3===1?"triangle":"sine";
osc.frequency.value=notes[musicIndex%notes.length];

gain.gain.setValueAtTime(.025,audio.currentTime);
gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();
osc.stop(audio.currentTime+.17);

musicIndex++;
}

note();

musicTimer=setInterval(
note,
60000/LEVELS[current][4]
);

}catch(e){}
}

function stopMusic(){

if(musicTimer){
clearInterval(musicTimer);
musicTimer=null;
}
}

paused=!paused;
pause.style.display=paused?"flex":"none";

if(paused){
stopMusic();
}else{
last=performance.now();
if(sound)startMusic();
}
}

togglePause();
};

pause.style.display="none";
last=performance.now();
if(sound)startMusic();
};

};

shop.style.display="none";
};

/* =========================
   MISJE
========================= */

function missionDone(id){

if(id==="levels3")return completedCount()>=3;
if(id==="levels10")return completedCount()>=10;
if(id==="coins25")return totalCoins()>=25;
if(id==="coins50")return totalCoins()>=50;
if(id==="deaths10")return totalDeaths()>=10;

return false;
}

function renderMissions(){

missionList.innerHTML="";

MISSIONS.forEach(m=>{

const d=document.createElement("div");

d.className="mission";

d.innerHTML=
(missionDone(m[0])?"✅ ":"🎯 ")+m[1];

missionList.appendChild(d);
});
}

document.getElementById("missionsBtn").onclick=()=>{
missions.style.display="flex";
renderMissions();
};

document.getElementById("closeMissions").onclick=()=>{
missions.style.display="none";
};

/* =========================
   STATYSTYKI
========================= */

function renderStats(){

statsContent.innerHTML=
'<div class="statGrid">'+
'<div class="stat">🏁 Poziomy<br><b>'+completedCount()+"/20</b></div>"+
'<div class="stat">🪙 Monety<br><b>'+totalCoins()+"</b></div>"+
'<div class="stat">⭐ XP<br><b>'+num("nd_xp")+"</b></div>"+
'<div class="stat">☠️ Śmierci<br><b>'+totalDeaths()+"</b></div>"+
'<div class="stat">🔥 Seria<br><b>'+num("nd_streak")+"</b></div>"+
'<div class="stat">🏆 Achievementy<br><b>"+
ACH.filter(a=>unlocked(a[0])).length+
"/"+ACH.length+
"</b></div>"+
"</div>";
}

document.getElementById("statsBtn").onclick=()=>{
stats.style.display="flex";
renderStats();
};

document.getElementById("closeStats").onclick=()=>{
stats.style.display="none";
};

/* =========================
   LOSOWY
========================= */

document.getElementById("randomBtn").onclick=()=>{
dailyMode=false;
startLevel(Math.floor(Math.random()*20));
};

/* =========================
   SOUND
========================= */

function updateSound(){
document.getElementById("soundBtn").textContent=sound?"🔊":"🔇";
}

document.getElementById("soundBtn").onclick=e=>{

e.stopPropagation();

sound=!sound;
set("nd_sound",sound?"1":"0");
updateSound();

if(sound&&running&&!paused)startMusic();
else stopMusic();
};

/* =========================
   AUTO PAUZA
========================= */

document.addEventListener("visibilitychange",()=>{
if(document.hidden&&running&&!paused){
paused=true;
pause.style.display="flex";
stopMusic();
}
});

addEventListener("blur",()=>{
if(running&&!paused){
paused=true;
pause.style.display="flex";
stopMusic();
}
});

/* =========================
   START
========================= */

resizeCanvas();
renderMenu();
renderAchievements();
renderMissions();
updateSound();

</script>

</body>
</html>
