
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Dash</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050510;
  font-family:Arial,sans-serif;
  color:white;
}
button{
  font:inherit;
  color:white;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}
#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,#172050 0%,#080817 45%,#030308 100%);
}
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}
.hidden{display:none!important}

.logo{
  font-size:clamp(42px,10vw,90px);
  font-weight:1000;
  letter-spacing:5px;
  color:#00ffff;
  text-shadow:0 0 8px #00ffff,0 0 25px #008cff;
  margin-bottom:25px;
}
.subtitle{
  color:#aaa;
  margin-top:-15px;
  margin-bottom:25px;
}

.menuButtons{
  width:min(380px,90vw);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.menuBtn{
  min-height:58px;
  border-radius:14px;
  border:2px solid #00ffff;
  background:rgba(0,255,255,.08);
  box-shadow:0 0 15px rgba(0,255,255,.18);
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}
.menuBtn:hover{
  background:rgba(0,255,255,.2);
  box-shadow:0 0 25px rgba(0,255,255,.45);
}
.back{
  position:absolute;
  top:18px;
  left:18px;
  min-width:100px;
  padding:12px 18px;
  border-radius:10px;
  background:#161629;
  border:1px solid #555;
  z-index:30;
}

.panel{
  width:min(900px,94vw);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border:1px solid #333;
  border-radius:18px;
  background:rgba(5,5,18,.92);
}
.panel h2{
  text-align:center;
  margin-top:0;
  color:#00ffff;
}
.levelGrid,.skinGrid,.achievementGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
}
.level,.skin,.achievement{
  min-height:100px;
  padding:14px;
  border-radius:12px;
  background:#101024;
  border:1px solid #333;
  text-align:center;
  position:relative;
}
.level.unlocked,.skin.unlocked{
  border-color:#00ffff;
}
.level.locked,.skin.locked{
  opacity:.4;
  cursor:not-allowed;
}
.level strong,.skin strong{
  display:block;
  margin-bottom:8px;
}
.level small,.skin small{
  color:#aaa;
}
.achievement{
  min-height:90px;
}
.achievement.done{
  border-color:#ffe600;
  box-shadow:0 0 15px rgba(255,230,0,.2);
}
.achievement small{color:#aaa}

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 5px;
  border-bottom:1px solid #222;
}
.switch{
  width:60px;
  height:32px;
  border-radius:20px;
  background:#333;
  padding:4px;
}
.switch i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:white;
  transition:.2s;
}
.switch.on{
  background:#00aaff;
}
.switch.on i{
  transform:translateX(28px);
}

#game{
  position:absolute;
  inset:0;
  display:none;
  z-index:5;
}
#game.active{display:block}
#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#gameTouch{
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:auto;
}
#hud{
  position:absolute;
  left:15px;
  right:15px;
  top:12px;
  z-index:15;
  pointer-events:none;
}
#hudTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#levelName{
  font-weight:900;
  text-shadow:0 2px 5px black;
}
#progress{
  width:180px;
  height:9px;
  border-radius:10px;
  background:#222;
  overflow:hidden;
}
#progressBar{
  width:0%;
  height:100%;
  background:#00ffff;
  box-shadow:0 0 10px #00ffff;
}
#pause{
  pointer-events:auto;
  width:46px;
  height:46px;
  border-radius:12px;
  background:rgba(10,10,25,.9);
  border:1px solid #555;
  font-size:20px;
}
#gameMessage{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(30px,7vw,70px);
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  text-align:center;
  text-shadow:0 0 20px currentColor;
  z-index:14;
}
#mobileJump{
  position:absolute;
  right:25px;
  bottom:25px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(0,255,255,.18);
  border:2px solid #00ffff;
  box-shadow:0 0 20px rgba(0,255,255,.3);
  z-index:16;
  font-weight:900;
}
#mobileJump:active{
  transform:scale(.94);
}

#audioUnlock{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
}
.audioBox{
  width:min(380px,90vw);
  padding:30px;
  border-radius:20px;
  text-align:center;
  background:#101020;
  border:2px solid #00ffff;
}
.audioBox h2{color:#00ffff}
.audioBtn{
  padding:15px 25px;
  border-radius:12px;
  background:#00aaff;
  font-weight:900;
}

#result{
  z-index:50;
  background:rgba(0,0,0,.72);
}
.resultBox{
  text-align:center;
  padding:30px;
  width:min(430px,90vw);
  background:#0b0b1c;
  border:2px solid #00ffff;
  border-radius:20px;
}
.resultBox h1{
  color:#00ffff;
  font-size:42px;
}
.resultButtons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.resultButtons button{
  padding:14px 20px;
  border-radius:10px;
  background:#15152b;
  border:1px solid #00ffff;
}

#pauseScreen{
  z-index:40;
  background:rgba(0,0,0,.75);
}
.pauseBox{
  width:min(380px,90vw);
  padding:30px;
  text-align:center;
  border-radius:18px;
  background:#0b0b1c;
  border:2px solid #00ffff;
}
</style>
</head>

<body>
<div id="app">

  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="logo">NEON DASH</div>
    <div class="subtitle">RUN • JUMP • SURVIVE</div>

    <div class="menuButtons">
      <button id="playBtn" class="menuBtn">▶ GRAJ</button>
      <button id="levelsBtn" class="menuBtn">☷ POZIOMY</button>
      <button id="shopBtn" class="menuBtn">◆ SKLEP</button>
      <button id="achievementsBtn" class="menuBtn">★ OSIĄGNIĘCIA</button>
      <button id="settingsBtn" class="menuBtn">⚙ USTAWIENIA</button>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="levelsScreen" class="screen hidden">
    <button class="back" id="levelsBack">← Wróć</button>
    <div class="panel">
      <h2>POZIOMY</h2>
      <div id="levelGrid" class="levelGrid"></div>
    </div>
  </section>

  <!-- SHOP -->
  <section id="shopScreen" class="screen hidden">
    <button class="back" id="shopBack">← Wróć</button>
    <div class="panel">
      <h2>SKLEP</h2>
      <p style="text-align:center">Monety: <b id="coinCount">0</b></p>
      <div id="skinGrid" class="skinGrid"></div>
    </div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section id="achievementsScreen" class="screen hidden">
    <button class="back" id="achievementsBack">← Wróć</button>
    <div class="panel">
      <h2>OSIĄGNIĘCIA</h2>
      <div id="achievementGrid" class="achievementGrid"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settingsScreen" class="screen hidden">
    <button class="back" id="settingsBack">← Wróć</button>
    <div class="panel">
      <h2>USTAWIENIA</h2>

      <div class="setting">
        <span>Muzyka</span>
        <button id="musicSwitch" class="switch on"><i></i></button>
      </div>

      <div class="setting">
        <span>Dźwięki</span>
        <button id="soundSwitch" class="switch on"><i></i></button>
      </div>

      <div class="setting">
        <span>Efekty</span>
        <button id="fxSwitch" class="switch on"><i></i></button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game">
    <canvas id="canvas"></canvas>

    <!-- TYLKO TEN ELEMENT ODBIERA KLIKNIĘCIA JAKO SKOK -->
    <div id="gameTouch"></div>

    <div id="hud">
      <div id="hudTop">
        <div>
          <div id="levelName">NEON RUSH</div>
          <div id="progress"><div id="progressBar"></div></div>
        </div>
        <button id="pause">Ⅱ</button>
      </div>
    </div>

    <div id="gameMessage"></div>
    <button id="mobileJump">JUMP</button>
  </section>

  <!-- PAUSE -->
  <section id="pauseScreen" class="screen hidden">
    <div class="pauseBox">
      <h1>PAUZA</h1>
      <div class="menuButtons">
        <button id="resumeBtn" class="menuBtn">▶ WRÓĆ DO GRY</button>
        <button id="pauseRestart" class="menuBtn">↻ RESTART</button>
        <button id="pauseMenu" class="menuBtn">⌂ MENU</button>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen hidden">
    <div class="resultBox">
      <h1 id="resultTitle">LEVEL COMPLETE!</h1>
      <p id="resultText"></p>

      <div class="resultButtons">
        <button id="resultRestart">↻ JESZCZE RAZ</button>
        <button id="resultNext">▶ NASTĘPNY</button>
        <button id="resultMenu">⌂ MENU</button>
      </div>
    </div>
  </section>

  <!-- AUDIO -->
  <div id="audioUnlock">
    <div class="audioBox">
      <h2>NEON DASH</h2>
      <p>Kliknij, aby włączyć muzykę i dźwięki.</p>
      <button id="audioBtn" class="audioBtn">WŁĄCZ MUZYKĘ</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* =========================
   DANE
========================= */

const levels = [
  ["NEON RUSH","#00ffff",5.8,7000,150,261.63],
  ["CRYSTAL DRIVE","#6fa8ff",6.0,7300,128,220],
  ["LAVA PULSE","#ff482e",6.2,7600,172,164.81],
  ["SKY CIRCUIT","#75ff70",6.4,7900,138,196],
  ["VIOLET RUN","#c86cff",6.6,8200,160,246.94],
  ["SHADOW FACTORY","#aaaabb",6.8,8500,118,146.83],
  ["CYBER STORM","#00aaff",7.0,8800,180,185],
  ["INFERNO CORE","#ff7800",7.2,9000,190,130.81],
  ["ELECTRIC VOID","#eeff00",7.4,9200,165,220],
  ["GRAVITY BREAK","#ff35bb",7.6,9400,145,174.61],
  ["OVERDRIVE","#00ff88",7.8,9600,200,196],
  ["FINAL CHAOS","#ffffff",8.0,10000,210,130.81],
  ["STARFALL","#58a6ff",8.2,10400,132,233.08],
  ["QUANTUM","#b76cff",8.4,10800,175,196],
  ["NEON INFERNO","#ff4f81",8.6,11200,198,155.56],
  ["ZERO GRAVITY","#45ffff",8.8,11600,125,174.61],
  ["NIGHTMARE","#ff3333",9.0,12000,205,123.47],
  ["ULTIMATE DASH","#ffffff",9.3,12600,220,261.63]
];

const skins = [
  ["CLASSIC","#ffffff",0],
  ["CYAN","#00ffff",10],
  ["LIME","#75ff70",20],
  ["VIOLET","#c86cff",30],
  ["FIRE","#ff482e",40],
  ["GOLD","#ffe600",60],
  ["PINK","#ff35bb",80],
  ["ICE","#75ddff",100]
];

const achievements = [
  ["first","Pierwszy krok","Ukończ pierwszy poziom"],
  ["three","Rozgrzewka","Ukończ 3 poziomy"],
  ["six","Coraz dalej","Ukończ 6 poziomów"],
  ["all","Mistrz","Ukończ wszystkie poziomy"],
  ["coins10","Kolekcjoner","Zbierz 10 monet"],
  ["coins25","Łowca monet","Zbierz 25 monet"],
  ["perfect","Perfekcja","Ukończ poziom bez śmierci"],
  ["survivor","Nie poddaję się","Ukończ poziom po 5+ próbach"]
];

/* =========================
   SAVE
========================= */

let save = JSON.parse(localStorage.getItem("neonDashSave") || "null");

if(!save){
  save = {
    unlocked:1,
    coins:0,
    selectedSkin:0,
    ownedSkins:[0],
    completed:[],
    achievements:{},
    attempts:Array(levels.length).fill(0),
    settings:{
      music:true,
      sound:true,
      fx:true
    }
  };
}

function saveGame(){
  localStorage.setItem("neonDashSave",JSON.stringify(save));
}

/* =========================
   ELEMENTY
========================= */

const menu = document.getElementById("menu");
const levelsScreen = document.getElementById("levelsScreen");
const shopScreen = document.getElementById("shopScreen");
const achievementsScreen = document.getElementById("achievementsScreen");
const settingsScreen = document.getElementById("settingsScreen");

const game = document.getElementById("game");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const gameTouch = document.getElementById("gameTouch");

const pauseScreen = document.getElementById("pauseScreen");
const result = document.getElementById("result");

const levelGrid = document.getElementById("levelGrid");
const skinGrid = document.getElementById("skinGrid");
const achievementGrid = document.getElementById("achievementGrid");

const coinCount = document.getElementById("coinCount");

const progressBar = document.getElementById("progressBar");
const levelName = document.getElementById("levelName");

const mobileJump = document.getElementById("mobileJump");

/* =========================
   EKRANY
========================= */

function showOnly(screen){
  [
    menu,
    levelsScreen,
    shopScreen,
    achievementsScreen,
    settingsScreen
  ].forEach(x=>x.classList.add("hidden"));

  screen.classList.remove("hidden");
  game.classList.remove("active");
  pauseScreen.classList.add("hidden");
  result.classList.add("hidden");
}

function openMenu(){
  running=false;
  paused=false;
  game.classList.remove("active");
  pauseScreen.classList.add("hidden");
  result.classList.add("hidden");
  showOnly(menu);
}

function openLevels(){
  running=false;
  showOnly(levelsScreen);
  renderLevels();
}

function openShop(){
  running=false;
  showOnly(shopScreen);
  renderSkins();
}

function openAchievements(){
  running=false;
  showOnly(achievementsScreen);
  renderAchievements();
}

function openSettings(){
  running=false;
  showOnly(settingsScreen);
  renderSettings();
}

/* =========================
   PRZYCISKI MENU
========================= */

document.getElementById("playBtn").addEventListener("click",function(e){
  e.stopPropagation();
  startLevel(0);
});

document.getElementById("levelsBtn").addEventListener("click",function(e){
  e.stopPropagation();
  openLevels();
});

document.getElementById("shopBtn").addEventListener("click",function(e){
  e.stopPropagation();
  openShop();
});

document.getElementById("achievementsBtn").addEventListener("click",function(e){
  e.stopPropagation();
  openAchievements();
});

document.getElementById("settingsBtn").addEventListener("click",function(e){
  e.stopPropagation();
  openSettings();
});

document.getElementById("levelsBack").addEventListener("click",openMenu);
document.getElementById("shopBack").addEventListener("click",openMenu);
document.getElementById("achievementsBack").addEventListener("click",openMenu);
document.getElementById("settingsBack").addEventListener("click",openMenu);

/* =========================
   LEVEL SELECT
========================= */

function renderLevels(){
  levelGrid.innerHTML="";

  levels.forEach((lv,i)=>{
    const b=document.createElement("button");
    b.className="level "+(i<save.unlocked?"unlocked":"locked");

    b.innerHTML=`
      <strong>${i+1}. ${lv[0]}</strong>
      <small>${i<save.unlocked?"ODblokowany":"🔒 Zablokowany"}</small>
    `;

    if(i<save.unlocked){
      b.addEventListener("click",function(e){
        e.stopPropagation();
        startLevel(i);
      });
    }

    levelGrid.appendChild(b);
  });
}

/* =========================
   SKINS
========================= */

function renderSkins(){
  skinGrid.innerHTML="";
  coinCount.textContent=save.coins;

  skins.forEach((s,i)=>{
    const owned=save.ownedSkins.includes(i);

    const b=document.createElement("button");
    b.className="skin "+(owned?"unlocked":"locked");

    let bottom;

    if(save.selectedSkin===i){
      bottom="✓ WYBRANY";
    }else if(owned){
      bottom="WYBIERZ";
    }else{
      bottom=`${s[2]} monet`;
    }

    b.innerHTML=`
      <strong style="color:${s[1]}">${s[0]}</strong>
      <div style="
        width:35px;
        height:35px;
        margin:8px auto;
        background:${s[1]};
        box-shadow:0 0 15px ${s[1]};
      "></div>
      <small>${bottom}</small>
    `;

    b.addEventListener("click",function(e){
      e.stopPropagation();

      if(owned){
        save.selectedSkin=i;
        saveGame();
        renderSkins();
        return;
      }

      if(save.coins>=s[2]){
        save.coins-=s[2];
        save.ownedSkins.push(i);
        save.selectedSkin=i;
        saveGame();
        renderSkins();
      }
    });

    skinGrid.appendChild(b);
  });
}

/* =========================
   ACHIEVEMENTS
========================= */

function renderAchievements(){
  achievementGrid.innerHTML="";

  achievements.forEach(a=>{
    const done=!!save.achievements[a[0]];

    const b=document.createElement("div");
    b.className="achievement "+(done?"done":"");

    b.innerHTML=`
      <strong>${done?"★":"☆"} ${a[1]}</strong>
      <small>${a[2]}</small>
    `;

    achievementGrid.appendChild(b);
  });
}

function checkAchievements(){
  if(save.completed.length>=1) save.achievements.first=true;
  if(save.completed.length>=3) save.achievements.three=true;
  if(save.completed.length>=6) save.achievements.six=true;
  if(save.completed.length>=levels.length) save.achievements.all=true;
  if(save.coins>=10) save.achievements.coins10=true;
  if(save.coins>=25) save.achievements.coins25=true;

  if(currentLevel>=0){
    if(deaths===0) save.achievements.perfect=true;
    if(save.attempts[currentLevel]>=5) save.achievements.survivor=true;
  }

  saveGame();
}

/* =========================
   SETTINGS
========================= */

function renderSettings(){
  const ms=document.getElementById("musicSwitch");
  const ss=document.getElementById("soundSwitch");
  const fs=document.getElementById("fxSwitch");

  ms.classList.toggle("on",save.settings.music);
  ss.classList.toggle("on",save.settings.sound);
  fs.classList.toggle("on",save.settings.fx);
}

document.getElementById("musicSwitch").addEventListener("click",function(e){
  e.stopPropagation();
  save.settings.music=!save.settings.music;
  saveGame();
  renderSettings();

  if(save.settings.music){
    startMusic();
  }else{
    stopMusic();
  }
});

document.getElementById("soundSwitch").addEventListener("click",function(e){
  e.stopPropagation();
  save.settings.sound=!save.settings.sound;
  saveGame();
  renderSettings();
});

document.getElementById("fxSwitch").addEventListener("click",function(e){
  e.stopPropagation();
  save.settings.fx=!save.settings.fx;
  saveGame();
  renderSettings();
});

/* =========================
   CANVAS
========================= */

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

/* =========================
   GAME STATE
========================= */

let currentLevel=0;
let running=false;
let paused=false;

let player={
  x:120,
  y:0,
  size:38,
  vy:0,
  grounded:false,
  rotation:0
};

let cameraX=0;
let worldX=0;
let deaths=0;
let collectedThisLevel=0;

let obstacles=[];
let coins=[];
let particles=[];
let trail=[];
let stars=[];

let levelSpeed=6;
let levelLength=7000;
let levelColor="#00ffff";

/* =========================
   LEVEL GENERATION
========================= */

function createLevel(){
  obstacles=[];
  coins=[];
  particles=[];
  trail=[];
  stars=[];

  worldX=0;
  cameraX=0;
  collectedThisLevel=0;

  const ground=canvas.height-100;

  player.x=130;
  player.y=ground-player.size;
  player.vy=0;
  player.grounded=true;
  player.rotation=0;

  for(let i=0;i<90;i++){
    stars.push({
      x:Math.random()*levelLength,
      y:Math.random()*canvas.height*.65,
      r:Math.random()*2+1
    });
  }

  /* początkowy bezpieczny odcinek */
  let x=600;

  while(x<levelLength-500){

    const type=Math.random();

    if(type<.45){
      obstacles.push({
        type:"spike",
        x:x,
        y:ground,
        w:38,
        h:40
      });

      if(Math.random()<.25){
        obstacles.push({
          type:"spike",
          x:x+40,
          y:ground,
          w:38,
          h:40
        });
        x+=40;
      }
    }
    else if(type<.7){
      obstacles.push({
        type:"block",
        x:x,
        y:ground-55,
        w:55,
        h:55
      });
    }
    else if(type<.85){
      obstacles.push({
        type:"saw",
        x:x,
        y:ground-60,
        w:60,
        h:60
      });
    }
    else{
      obstacles.push({
        type:"spike",
        x:x,
        y:ground,
        w:38,
        h:40
      });

      coins.push({
        x:x+120,
        y:ground-120,
        r:12,
        taken:false
      });
    }

    x+=180+Math.random()*250;
  }

}

/* =========================
   COLLISION
========================= */

function rectsOverlap(a,b){
  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

function playerBox(){
  return {
    x:player.x,
    y:player.y,
    w:player.size,
    h:player.size
  };
}

function checkCollision(){
  const p=playerBox();

  for(const o of obstacles){

    if(o.type==="spike"){
      const hit={
        x:o.x+8,
        y:o.y-o.h+10,
        w:o.w-16,
        h:o.h-10
      };

      if(rectsOverlap(p,hit)){
        die();
        return;
      }
    }

    if(o.type==="block"){
      const hit={
        x:o.x,
        y:o.y,
        w:o.w,
        h:o.h
      };

      if(rectsOverlap(p,hit)){
        if(player.vy>0 &&
           player.y+player.size-player.vy<=o.y){
          player.y=o.y-player.size;
          player.vy=0;
          player.grounded=true;
        }else{
          die();
          return;
        }
      }
    }

    if(o.type==="saw"){
      const cx=o.x+o.w/2;
      const cy=o.y-o.h/2;

      const px=player.x+player.size/2;
      const py=player.y+player.size/2;

      const dx=px-cx;
      const dy=py-cy;

      if(Math.sqrt(dx*dx+dy*dy)<34){
        die();
        return;
      }
    }
  }
}

/* =========================
   COINS
========================= */

function collectCoins(){
  const px=player.x+player.size/2;
  const py=player.y+player.size/2;

  for(const c of coins){
    if(c.taken)continue;

    const dx=px-c.x;
    const dy=py-c.y;

    if(Math.sqrt(dx*dx+dy*dy)<35){
      c.taken=true;
      collectedThisLevel++;
      save.coins++;
      sfxCoin();

      for(let i=0;i<10;i++){
        particles.push({
          x:c.x,
          y:c.y,
          vx:(Math.random()-.5)*5,
          vy:(Math.random()-.5)*5,
          life:30
        });
      }
    }
  }
}

function win(){
  if(!running)return;

  running=false;

  if(!save.completed.includes(currentLevel)){
    save.completed.push(currentLevel);
  }

  if(currentLevel+1<levels.length &&
     save.unlocked<=currentLevel+1){
    save.unlocked=currentLevel+2;
  }

  checkAchievements();
  saveGame();

  sfxWin();

  resultTitle.textContent="LEVEL COMPLETE!";
  resultText.textContent=
    `Monety: +${collectedThisLevel} • Próby: ${save.attempts[currentLevel]}`;

  document.getElementById("resultNext").style.display=
    currentLevel<levels.length-1 ? "inline-block":"none";

  result.classList.remove("hidden");

/* =========================
   UPDATE
========================= */

let lastTime=0;

function update(dt){

  if(!running || paused)return;

  worldX+=levelSpeed*dt;

  const ground=canvas.height-100;

  player.vy+=0.72*dt;
  player.y+=player.vy*dt;

  if(player.y+player.size>=ground){
    player.y=ground-player.size;
    player.vy=0;
    player.grounded=true;
    player.rotation=0;
  }else{
    player.grounded=false;
    player.rotation+=.15*dt;
  }

  checkCollision();
  collectCoins();

  cameraX=Math.max(0,worldX-200);

  progressBar.style.width=
    Math.min(100,worldX/levelLength*100)+"%";

  trail.push({
    x:player.x,
    y:player.y,
    life:18
  });

  if(trail.length>25)trail.shift();

  for(const t of trail)t.life--;

  trail=trail.filter(t=>t.life>0);

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=.15*dt;
    p.life-=dt;
  }

  particles=particles.filter(p=>p.life>0);

  if(worldX>=levelLength){
    win();
  }
}

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const ground=canvas.height-100;

  /* tło */
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,"#050518");
  grad.addColorStop(1,"#080820");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  /* gwiazdy */
  ctx.fillStyle="rgba(255,255,255,.7)";

  for(const s of stars){
    let sx=s.x-cameraX*.3;

    if(sx<-10)sx+=levelLength;

    if(sx<canvas.width+10){
      ctx.beginPath();
      ctx.arc(sx,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  /* grid */
  ctx.strokeStyle="rgba(0,255,255,.06)";
  ctx.lineWidth=1;

  for(let x=-(cameraX%50);x<canvas.width;x+=50){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }

  for(let y=0;y<canvas.height;y+=50){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }

  /* ziemia */
  ctx.fillStyle="#10102a";
  ctx.fillRect(0,ground,canvas.width,100);

  ctx.fillStyle=levelColor;
  ctx.fillRect(0,ground,canvas.width,3);

  /* przeszkody */
  for(const o of obstacles){

    const x=o.x-cameraX;

    if(x<-100 || x>canvas.width+100)continue;

    ctx.shadowBlur=15;
    ctx.shadowColor=levelColor;
    ctx.strokeStyle=levelColor;
    ctx.fillStyle="rgba(0,0,0,.45)";

    if(o.type==="spike"){
      ctx.beginPath();
      ctx.moveTo(x,ground);
      ctx.lineTo(x+o.w/2,ground-o.h);
      ctx.lineTo(x+o.w,ground);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    if(o.type==="block"){
      ctx.fillRect(x,o.y,o.w,o.h);
      ctx.strokeRect(x,o.y,o.w,o.h);
    }

    if(o.type==="saw"){
      const cx=x+o.w/2;
      const cy=o.y-o.h/2;

      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(worldX*.04);

      ctx.beginPath();

      for(let i=0;i<20;i++){
        const a=i*Math.PI*2/20;
        const r=i%2===0?30:19;

        const px=Math.cos(a)*r;
        const py=Math.sin(a)*r;

        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      }

      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    ctx.shadowBlur=0;
  }

  /* monety */
  for(const c of coins){

    if(c.taken)continue;

    const x=c.x-cameraX;

    if(x<-30 || x>canvas.width+30)continue;

    ctx.beginPath();
    ctx.arc(x,c.y,c.r,0,Math.PI*2);

    ctx.fillStyle="#ffe600";
    ctx.shadowBlur=15;
    ctx.shadowColor="#ffe600";
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff8a0";
    ctx.beginPath();
    ctx.arc(x-3,c.y-3,3,0,Math.PI*2);
    ctx.fill();
  }

  /* trail */
  if(save.settings.fx){
    for(const t of trail){
      const alpha=Math.max(0,t.life/18);

      ctx.fillStyle=
        `rgba(0,255,255,${alpha*.25})`;

      ctx.fillRect(t.x-cameraX+8,t.y+8,22,22);
    }
  }

  /* player */
  const skin=skins[save.selectedSkin];
  const px=player.x;
  const py=player.y;

  ctx.save();

  ctx.translate(px+player.size/2,py+player.size/2);
  ctx.rotate(player.rotation);

  ctx.shadowBlur=18;
  ctx.shadowColor=skin[1];

  ctx.fillStyle=skin[1];
  ctx.fillRect(-19,-19,38,38);

  ctx.shadowBlur=0;

  /* oczy */
  ctx.fillStyle="#050510";
  ctx.fillRect(-10,-8,5,7);
  ctx.fillRect(5,-8,5,7);

  /* nogi */
  ctx.strokeStyle="#050510";
  ctx.lineWidth=5;

  const walk=
    player.grounded ? Math.sin(performance.now()/90)*5:0;

  ctx.beginPath();
  ctx.moveTo(-7,18);
  ctx.lineTo(-10+walk,27);
  ctx.moveTo(7,18);
  ctx.lineTo(10-walk,27);
  ctx.stroke();

  /* ręce */
  ctx.beginPath();
  ctx.moveTo(-18,-1);
  ctx.lineTo(-27-walk/2,8);
  ctx.moveTo(18,-1);
  ctx.lineTo(27+walk/2,8);
  ctx.stroke();

  ctx.restore();

  /* particles */
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/50);
    ctx.fillStyle=levelColor;
    ctx.fillRect(p.x-cameraX,p.y,5,5);
  }

  ctx.globalAlpha=1;
}

/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

  if(!lastTime)lastTime=time;

  let dt=(time-lastTime)/16.67;
  lastTime=time;

  dt=Math.min(dt,2);

  update(dt);
  draw();

  if(running || paused){
    requestAnimationFrame(gameLoop);
  }
}

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let masterGain=null;
let musicGain=null;
let musicTimer=null;
let musicStep=0;

function initAudio(){

  if(audioCtx)return true;

  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();

    masterGain=audioCtx.createGain();
    musicGain=audioCtx.createGain();

    masterGain.gain.value=.24;
    musicGain.gain.value=.65;

    musicGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    return true;
  }catch(e){
    return false;
  }
}

async function unlockAudio(){

  const ok=initAudio();

  if(!ok){
    document.getElementById("audioUnlock").classList.add("hidden");
    return;
  }

  try{
    await audioCtx.resume();

    /* krótki dźwięk testowy */
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.frequency.value=440;
    gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.12);

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();
    osc.stop(audioCtx.currentTime+.13);

  }catch(e){}

  document.getElementById("audioUnlock").classList.add("hidden");

  if(save.settings.music){
    startMusic();
  }
}

document.getElementById("audioBtn").addEventListener("click",function(e){
  e.stopPropagation();
  unlockAudio();
});

function note(freq,duration,type="sine",volume=.08){

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start();
  osc.stop(audioCtx.currentTime+duration+.02);
}

function startMusic(){

  if(!audioCtx || !save.settings.music)return;

  stopMusic();

  const data=levels[currentLevel];
  const bpm=data[4];
  const root=data[5];

  const interval=60000/bpm/2;

  musicStep=0;

  musicTimer=setInterval(()=>{

    if(!running || paused)return;

    const scale=[1,1.122,1.26,1.335,1.498,1.682,1.888];
    const n=scale[musicStep%scale.length];

    note(
      root*n,
      .16,
      "square",
      .035
    );

    if(musicStep%4===0){
      note(
        root/2,
        .12,
        "triangle",
        .045
      );
    }

    musicStep++;

  },interval);
}

function stopMusic(){

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

function sfx(freq,duration=.08,type="square"){

  if(!audioCtx || !save.settings.sound)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioCtx.currentTime+duration+.02);
}

function sfxJump(){
  sfx(500,.07,"square");
}

function sfxCoin(){
  sfx(900,.1,"triangle");
}

function sfxDeath(){
  sfx(120,.3,"sawtooth");
}

function sfxWin(){
  if(!audioCtx || !save.settings.sound)return;

  setTimeout(()=>sfx(523,.12,"square"),0);
  setTimeout(()=>sfx(659,.12,"square"),130);
  setTimeout(()=>sfx(784,.2,"square"),260);
}
