
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Dash</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050510;
    color:white;
    font-family:Arial,sans-serif;
}

button{
    font:inherit;
    color:white;
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 30%,
            #172050,
            #080817 45%,
            #030308
        );
}

.hidden{
    display:none!important;
}

/* ================= MENU ================= */

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    pointer-events:auto;
}

#menu{
    z-index:500;
}

.logo{
    font-size:clamp(42px,10vw,90px);
    font-weight:1000;
    letter-spacing:5px;
    color:#0ff;
    text-shadow:
        0 0 8px #0ff,
        0 0 25px #08f;
    margin-bottom:25px;
}

.subtitle{
    color:#aaa;
    margin:-15px 0 25px;
}

.menuButtons{
    width:min(380px,90vw);
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menuBtn{
    position:relative;
    z-index:9999;
    min-height:58px;
    border-radius:14px;
    border:2px solid #0ff;
    background:rgba(0,255,255,.08);
    box-shadow:0 0 15px rgba(0,255,255,.18);
    font-size:20px;
    font-weight:900;
    pointer-events:auto;
}

.menuBtn:hover{
    background:rgba(0,255,255,.2);
}

.back{
    position:absolute;
    top:18px;
    left:18px;
    padding:12px 18px;
    border-radius:10px;
    background:#161629;
    border:1px solid #555;
    z-index:300;
}

.panel{
    width:min(900px,94vw);
    max-height:85vh;
    overflow:auto;
    padding:25px;
    border:1px solid #333;
    border-radius:18px;
    background:rgba(5,5,18,.94);
}

.panel h2{
    text-align:center;
    color:#0ff;
}

.levelGrid,
.skinGrid,
.achievementGrid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
}

.level,
.skin,
.achievement{
    min-height:100px;
    padding:14px;
    border-radius:12px;
    background:#101024;
    border:1px solid #333;
    text-align:center;
}

.level.unlocked,
.skin.unlocked{
    border-color:#0ff;
}

.level.locked,
.skin.locked{
    opacity:.4;
}

.achievement.done{
    border-color:#ffe600;
    box-shadow:0 0 15px #ffe60033;
}

.level small,
.skin small,
.achievement small{
    display:block;
    color:#aaa;
    margin-top:8px;
}

/* ================= GAME ================= */

#game{
    position:absolute;
    inset:0;
    display:none;
    z-index:1;
}

#game.active{
    display:block;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#gameTouch{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:auto;
}

#hud{
    position:absolute;
    left:15px;
    right:15px;
    top:12px;
    z-index:15;
    pointer-events:none;
}

#hudTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#levelName{
    font-weight:900;
    text-shadow:0 2px 5px #000;
}

#progress{
    width:180px;
    height:9px;
    border-radius:10px;
    background:#222;
    overflow:hidden;
}

#progressBar{
    height:100%;
    width:0;
    background:#0ff;
    box-shadow:0 0 10px #0ff;
}

#pause{
    pointer-events:auto;
    width:46px;
    height:46px;
    border-radius:12px;
    background:#0a0a19ee;
    border:1px solid #555;
}

#mobileJump{
    position:absolute;
    right:25px;
    bottom:25px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#00ffff2e;
    border:2px solid #0ff;
    box-shadow:0 0 20px #0ff4;
    z-index:16;
    font-weight:900;
}

/* ================= PAUSE / RESULT ================= */

#pauseScreen{
    z-index:600;
    background:#000b;
}

#result{
    z-index:700;
    background:#000b;
}

.pauseBox,
.resultBox{
    width:min(430px,90vw);
    padding:30px;
    text-align:center;
    border-radius:20px;
    background:#0b0b1c;
    border:2px solid #0ff;
}

.resultBox h1{
    color:#0ff;
    font-size:42px;
}

.resultButtons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.resultButtons button{
    padding:14px 20px;
    border-radius:10px;
    background:#15152b;
    border:1px solid #0ff;
}

/* ================= AUDIO ================= */

#audioUnlock{
    display:none!important;
    pointer-events:none!important;
}

/* ================= SETTINGS ================= */

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 5px;
    border-bottom:1px solid #222;
}

.switch{
    width:60px;
    height:32px;
    border-radius:20px;
    background:#333;
    padding:4px;
}

.switch i{
    display:block;
    width:24px;
    height:24px;
    border-radius:50%;
    background:white;
    transition:.2s;
}

.switch.on{
    background:#08f;
}

.switch.on i{
    transform:translateX(28px);
}
</style>
</head>

<body>

<div id="app">

<!-- ================= MENU ================= -->

<section id="menu" class="screen">

    <div class="logo">NEON DASH</div>

    <div class="subtitle">
        RUN • JUMP • SURVIVE
    </div>

    <div class="menuButtons">

        <button
            id="playBtn"

        >
            ▶ GRAJ
        </button>

        <button id="levelsBtn" class="menuBtn">
            ☷ POZIOMY
        </button>

        <button id="shopBtn" class="menuBtn">
            ◆ SKLEP
        </button>

        <button id="achievementsBtn" class="menuBtn">

        </button>

        <button id="settingsBtn" class="menuBtn">

</section>

<!-- ================= LEVELS ================= -->

<section id="levelsScreen" class="screen hidden">

<!-- ================= SHOP ================= -->

        <h2>SKLEP</h2>

        </p>

</section>

<!-- ================= ACHIEVEMENTS ================= -->

<section id="achievementsScreen" class="screen hidden">

    <button class="back" id="achievementsBack">
        ← Wróć
    </button>

    <div class="panel">

        <h2>OSIĄGNIĘCIA</h2>

        <div
            id="achievementGrid"

</section>

<!-- ================= SETTINGS ================= -->

<section id="settingsScreen" class="screen hidden">

    <button class="back" id="settingsBack">

    <div class="panel">

        <h2>USTAWIENIA</h2>

        <div class="setting">

            <span>Muzyka</span>

            <button

                class="switch on"

                <i></i>
            </button>

        </div>

        <div class="setting">

            <span>Dźwięki</span>

            <button
                id="soundSwitch"
                class="switch on"
            >
                <i></i>
            </button>

        </div>

        <div class="setting">

            <span>Efekty</span>

            <button
                id="fxSwitch"
                class="switch on"
            >
                <i></i>
            </button>

        </div>

    </div>

</section>

<!-- ================= GAME ================= -->

<section id="game">

    <canvas id="canvas"></canvas>

    <div id="gameTouch"></div>

    <div id="hud">

        <div id="hudTop">

            <div>

                <div id="levelName">
                    NEON RUSH
                </div>

                <div id="progress">
                    <div id="progressBar"></div>
                </div>

            </div>

            <button id="pause">
                Ⅱ
            </button>

        </div>

    </div>

    <button id="mobileJump">
        JUMP
    </button>

</section>

<!-- ================= PAUSE ================= -->

<section id="pauseScreen" class="screen hidden">

    <div class="pauseBox">

        <h1>PAUZA</h1>

        <div class="menuButtons">

            <button
                id="resumeBtn"
                class="menuBtn"
            >
                ▶ WRÓĆ DO GRY
            </button>

            <button
                id="pauseRestart"
                class="menuBtn"
            >
                ↻ RESTART
            </button>

            <button
                id="pauseMenu"
                class="menuBtn"
            >
                ⌂ MENU
            </button>

        </div>

    </div>

</section>

<!-- ================= RESULT ================= -->

<section id="result" class="screen hidden">

    <div class="resultBox">

        <h1 id="resultTitle">
            LEVEL COMPLETE!
        </h1>

        <p id="resultText"></p>

        <div class="resultButtons">

            <button id="resultRestart">
                ↻ JESZCZE RAZ
            </button>

            <button id="resultNext">
                ▶ NASTĘPNY
            </button>

            <button id="resultMenu">
                ⌂ MENU
            </button>

        </div>

    </div>

</section>

</div>

<script>
"use strict";

/* =========================================================
   POZIOMY
========================================================= */

const levels=[
    ["NEON RUSH","#00ffff",5.8,7000,150,261.63],
    ["CRYSTAL DRIVE","#6fa8ff",6,7300,128,220],
    ["LAVA PULSE","#ff482e",6.2,7600,172,164.81],
    ["SKY CIRCUIT","#75ff70",6.4,7900,138,196],
    ["VIOLET RUN","#c86cff",6.6,8200,160,246.94],
    ["SHADOW FACTORY","#aaaabb",6.8,8500,118,146.83],
    ["CYBER STORM","#00aaff",7,8800,180,185],
    ["INFERNO CORE","#ff7800",7.2,9000,190,130.81],
    ["ELECTRIC VOID","#eeff00",7.4,9200,165,220],
    ["GRAVITY BREAK","#ff35bb",7.6,9400,145,174.61],
    ["OVERDRIVE","#00ff88",7.8,9600,200,196],
    ["FINAL CHAOS","#fff",8,10000,210,130.81],
    ["STARFALL","#58a6ff",8.2,10400,132,233.08],
    ["QUANTUM","#b76cff",8.4,10800,175,196],
    ["NEON INFERNO","#ff4f81",8.6,11200,198,155.56],
    ["ZERO GRAVITY","#45ffff",8.8,11600,125,174.61],
    ["NIGHTMARE","#ff3333",9,12000,205,123.47],
    ["ULTIMATE DASH","#fff",9.3,12600,220,261.63]
];

/* =========================================================
   SKINY
========================================================= */

const skins=[
    ["CLASSIC","#fff",0],
    ["CYAN","#0ff",10],
    ["LIME","#75ff70",20],
    ["VIOLET","#c86cff",30],
    ["FIRE","#ff482e",40],
    ["GOLD","#ffe600",60],
    ["PINK","#ff35bb",80],
    ["ICE","#75ddff",100]
];

/* =========================================================
   OSIĄGNIĘCIA
========================================================= */

const achievements=[
    ["first","Pierwszy krok","Ukończ pierwszy poziom"],
    ["three","Rozgrzewka","Ukończ 3 poziomy"],
    ["six","Coraz dalej","Ukończ 6 poziomów"],
    ["all","Mistrz","Ukończ wszystkie poziomy"],
    ["coins10","Kolekcjoner","Zbierz 10 monet"],
    ["coins25","Łowca monet","Zbierz 25 monet"],
    ["perfect","Perfekcja","Ukończ poziom bez śmierci"],
    ["survivor","Nie poddaję się","Ukończ poziom po 5+ próbach"]
];

/* =========================================================
   ZAPIS
========================================================= */

let save;

try{
    save=JSON.parse(
        localStorage.getItem("neonDashSave")||"null"
    );
}catch(e){
    save=null;
}

if(!save){

    save={
        unlocked:1,
        coins:0,
        selectedSkin:0,
        ownedSkins:[0],
        completed:[],
        achievements:{},
        attempts:Array(levels.length).fill(0),
        settings:{
            music:true,
            sound:true,
            fx:true
        }
    };
}

if(!Array.isArray(save.attempts)){
    save.attempts=Array(levels.length).fill(0);
}

while(save.attempts.length<levels.length){
    save.attempts.push(0);
}

if(!save.settings){
    save.settings={
        music:true,
        sound:true,
        fx:true
    };
}

function saveGame(){

    try{
        localStorage.setItem(
            "neonDashSave",
            JSON.stringify(save)
        );
    }catch(e){}
}

/* =========================================================
   ELEMENTY
========================================================= */

const $=id=>document.getElementById(id);

const menu=$("menu");
const levelsScreen=$("levelsScreen");
const shopScreen=$("shopScreen");
const achievementsScreen=$("achievementsScreen");
const settingsScreen=$("settingsScreen");

const game=$("game");
const canvas=$("canvas");
const ctx=canvas.getContext("2d");

const gameTouch=$("gameTouch");
const pauseScreen=$("pauseScreen");
const result=$("result");

const levelGrid=$("levelGrid");
const skinGrid=$("skinGrid");
const achievementGrid=$("achievementGrid");

const coinCount=$("coinCount");
const progressBar=$("progressBar");
const levelName=$("levelName");
const mobileJump=$("mobileJump");

/* =========================================================
   ZMIENNE GRY
========================================================= */

let currentLevel=0;

let running=false;
let paused=false;

let player={
    x:130,
    y:0,
    size:38,
    vy:0,
    grounded:true,
    rotation:0
};

let cameraX=0;
let worldX=0;

let deaths=0;
let collectedThisLevel=0;

let obstacles=[];
let coins=[];
let particles=[];
let trail=[];
let stars=[];

let levelSpeed=6;
let levelLength=7000;
let levelColor="#0ff";

let lastTime=0;

/* ================= MRUGANIE ================= */

let blinkTimer=0;
let blinking=false;

function updateBlink(dt){

    blinkTimer-=dt;

    if(blinkTimer<=0){

        blinking=true;

        setTimeout(()=>{
            blinking=false;
        },110);

        blinkTimer=
            2.5+
            Math.random()*3;
    }
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let masterGain=null;
let musicGain=null;
let musicTimer=null;
let musicStep=0;

function initAudio(){

    if(audioCtx)
        return true;

    try{

        const AudioContext=
            window.AudioContext||
            window.webkitAudioContext;

        if(!AudioContext)
            return false;

        audioCtx=new AudioContext();

        masterGain=
            audioCtx.createGain();

        musicGain=
            audioCtx.createGain();

        masterGain.gain.value=.24;
        musicGain.gain.value=.65;

        musicGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        return true;

    }catch(e){

        console.error("Audio init error:",e);

        return false;
    }
}

async function unlockAudio(){

    if(!initAudio())
        return false;

    try{

        if(audioCtx.state==="suspended"){
            await audioCtx.resume();
        }

        return audioCtx.state==="running";

    }catch(e){

        return false;
    }
}

function note(
    freq,
    duration,
    type="sine",
    volume=.08
){

    if(
        !audioCtx||
        !save.settings.music
    )
        return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(musicGain);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+
        .02
    );
}

function startMusic(){

    stopMusic();

    if(
        !audioCtx||
        !save.settings.music
    )
        return;

    if(audioCtx.state==="suspended")
        return;

    const data=
        levels[currentLevel];

    const bpm=data[4];
    const root=data[5];

    const interval=
        60000/bpm/2;

    musicStep=0;

    /* pierwszy dźwięk od razu */

    playMusicStep();

    musicTimer=
        setInterval(
            playMusicStep,
            interval
        );
}

function playMusicStep(){

    if(
        !audioCtx||
        !save.settings.music||
        !running||
        paused
    )
        return;

    const data=
        levels[currentLevel];

    const root=data[5];

    const scale=[
        1,
        1.122,
        1.26,
        1.335,
        1.498,
        1.682,
        1.888,
        2
    ];

    note(
        root*
        scale[
            musicStep%
            scale.length
        ],
        .16,
        "square",
        .035
    );

    if(musicStep%4===0){

        note(
            root/2,
            .14,
            "triangle",
            .045
        );
    }

    if(musicStep%8===4){

        note(
            root*2,
            .08,
            "sine",
            .025
        );
    }

    musicStep++;
}

function stopMusic(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer=null;
    }
}

function sfx(
    freq,
    duration=.08,
    type="square"
){

    if(
        !audioCtx||
        !save.settings.sound
    )
        return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .12,
        audioCtx.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+
        .02
    );
}

function sfxJump(){
    sfx(500,.07,"square");
}

function sfxCoin(){
    sfx(900,.1,"triangle");
}

function sfxDeath(){
    sfx(120,.3,"sawtooth");
}

function sfxWin(){

    if(
        !audioCtx||
        !save.settings.sound
    )
        return;

    setTimeout(
        ()=>sfx(523,.12,"square"),
        0
    );

    setTimeout(
        ()=>sfx(659,.12,"square"),
        130
    );

    setTimeout(
        ()=>sfx(784,.2,"square"),
        260
    );
}

/* =========================================================
   EKRANY
========================================================= */

function showOnly(screen){

    menu.classList.add("hidden");
    levelsScreen.classList.add("hidden");
    shopScreen.classList.add("hidden");
    achievementsScreen.classList.add("hidden");
    settingsScreen.classList.add("hidden");

    screen.classList.remove("hidden");
}

function openMenu(){

    running=false;
    paused=false;

    stopMusic();

    game.classList.remove("active");

    pauseScreen.classList.add("hidden");
    result.classList.add("hidden");

    showOnly(menu);
}

function openLevels(){

    running=false;
    stopMusic();

    game.classList.remove("active");

    showOnly(levelsScreen);
    renderLevels();
}

function openShop(){

    running=false;
    stopMusic();

    game.classList.remove("active");

    showOnly(shopScreen);
    renderSkins();
}

function openAchievements(){

    running=false;
    stopMusic();

    game.classList.remove("active");

    showOnly(achievementsScreen);
    renderAchievements();
}

function openSettings(){

    running=false;
    stopMusic();

    game.classList.remove("active");

    showOnly(settingsScreen);
    renderSettings();
}

/* =========================================================
   MENU
========================================================= */

$("levelsBtn").onclick=openLevels;
$("shopBtn").onclick=openShop;
$("achievementsBtn").onclick=openAchievements;
$("settingsBtn").onclick=openSettings;

$("levelsBack").onclick=openMenu;
$("shopBack").onclick=openMenu;
$("achievementsBack").onclick=openMenu;
$("settingsBack").onclick=openMenu;

/* =========================================================
   START GRY
========================================================= */

async function startGameDirect(){

    console.log("GRAJ — startGameDirect()");

    /*
       Audio jest odblokowywane bezpośrednio
       po kliknięciu GRAJ.
    */

    try{
        await unlockAudio();
    }catch(e){
        console.log("Audio unlock:",e);
    }

    startLevel(0);
}

/* =========================================================
   POZIOMY
========================================================= */

function renderLevels(){

    levelGrid.innerHTML="";

    levels.forEach((lv,i)=>{

        const b=
            document.createElement("button");

        b.className=
            "level "+
            (
                i<save.unlocked
                ?"unlocked"
                :"locked"
            );

        b.innerHTML=
            `<strong>
                ${i+1}. ${lv[0]}
             </strong>
             <small>
                ${
                    i<save.unlocked
                    ?"Odblokowany"
                    :"🔒 Zablokowany"
                }
             </small>`;

        if(i<save.unlocked){

            b.onclick=async()=>{

                await unlockAudio();

                startLevel(i);
            };
        }

        levelGrid.appendChild(b);
    });
}

/* =========================================================
   SKLEP
========================================================= */

function renderSkins(){

    skinGrid.innerHTML="";
    coinCount.textContent=save.coins;

    skins.forEach((s,i)=>{

        const owned=
            save.ownedSkins.includes(i);

        const b=
            document.createElement("button");

        b.className=

            :`${s[2]} monet`;

        b.innerHTML=

                ${s[0]}

                height:35px;

                background:${s[1]};
                box-shadow:0 0 15px ${s[1]}
             "></div>

/* =========================================================
   TWORZENIE POZIOMU
========================================================= */

function createLevel(){

    obstacles=[];
    coins=[];
    particles=[];
    trail=[];
    stars=[];

    worldX=0;
    cameraX=0;
    collectedThisLevel=0;

    progressBar.style.width="0%";

    const ground=
        canvas.height-100;

    player.x=130;

    player.y=
        ground-player.size;

    player.vy=0;
    player.grounded=true;
    player.rotation=0;

    blinkTimer=2;
    blinking=false;

    for(let i=0;i<90;i++){

        stars.push({
            x:Math.random()*levelLength,
            y:
                Math.random()*
                canvas.height*.65,
            r:
                Math.random()*2+1
        });
    }

    let x=600;

    while(
        x<levelLength-500
    ){

        const type=
            Math.random();

        if(type<.45){

            obstacles.push({
                type:"spike",
                x:x,
                y:ground,
                w:38,
                h:40
            });

            if(Math.random()<.25){

                obstacles.push({
                    type:"spike",
                    x:x+40,
                    y:ground,
                    w:38,
                    h:40
                });

                x+=40;
            }

        }else if(type<.7){

            obstacles.push({
                type:"block",
                x:x,
                y:ground-55,
                w:55,
                h:55
            });

        }else if(type<.85){

            obstacles.push({
                type:"saw",
                x:x,
                y:ground-60,
                w:60,
                h:60
            });

        }else{

            obstacles.push({
                type:"spike",
                x:x,
                y:ground,
                w:38,
                h:40
            });

            coins.push({
                x:x+120,
                y:ground-120,
                r:12,
                taken:false
            });
        }

        x+=
            180+
            Math.random()*250;
    }

    for(let i=0;i<8;i++){

        coins.push({
            x:850+i*700,
            y:
                ground-
                100-
                Math.random()*100,
            r:12,
            taken:false
        });
    }
}

async function startLevel(index){

    if(
        index<0||
        index>=levels.length

        return;
    }

    currentLevel=index;

    const data=

    levelName.textContent=
        data[0];

    levelColor=data[1];
    levelSpeed=data[2];
    levelLength=data[3];

    save.attempts[index]++;

    saveGame();

    deaths=0;

    menu.classList.add("hidden");
    levelsScreen.classList.add("hidden");
    shopScreen.classList.add("hidden");
    achievementsScreen.classList.add("hidden");
    settingsScreen.classList.add("hidden");

    pauseScreen.classList.add("hidden");
    result.classList.add("hidden");

    game.classList.add("active");

    running=true;
    paused=false;

    createLevel();

    lastTime=0;

    requestAnimationFrame(gameLoop);

    /*
       Odblokowanie audio także dla:
       - poziomów
       - restartu
       - następnego poziomu
    */

    try{

        const audioReady=
            await unlockAudio();

        if(
            audioReady&&
            running&&
            !paused&&
            save.settings.music
        ){
            startMusic();
        }

    }catch(e){

            "Muzyka niedostępna:",
            e

    }
}

/* =========================================================
   KOLIZJE
========================================================= */

function overlap(a,b){

    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );
}

function collision(){

    /*
       WAŻNA POPRAWKA:
       player.x jest pozycją na ekranie,
       więc do kolizji używamy jego pozycji
       w świecie: cameraX + player.x.
    */

    const playerWorldX=
        cameraX+
        player.x;

    const p={
        x:playerWorldX,
        y:player.y,
        w:player.size,
        h:player.size
    };

    for(const o of obstacles){

        if(o.type==="spike"){

            const h={
                x:o.x+8,
                y:o.y-o.h+10,
                w:o.w-16,
                h:o.h-10
            };

            if(overlap(p,h)){

                die();
                return;
            }
        }

        if(o.type==="block"){

            const h={
                x:o.x,
                y:o.y,
                w:o.w,
                h:o.h
            };

            if(overlap(p,h)){

                /*
                   Lądowanie na bloku.
                */

                if(
                    player.vy>0 &&
                    player.y+
                    player.size-
                    player.vy<=o.y
                ){

                    player.y=
                        o.y-player.size;

                    player.vy=0;
                    player.grounded=true;

                }else{

                    die();
                    return;
                }
            }
        }

        if(o.type==="saw"){

            const cx=
                o.x+o.w/2;

            const cy=
                o.y-o.h/2;

            const px=
                playerWorldX+
                player.size/2;

            const py=
                player.y+
                player.size/2;

            if(
                Math.hypot(
                    px-cx,
                    py-cy
                )<34
            ){

                die();
                return;
            }
        }
    }
}

/* =========================================================
   MONETY
========================================================= */

function collectCoins(){

    const playerWorldX=
        cameraX+
        player.x;

    const px=
        playerWorldX+
        player.size/2;

    const py=
        player.y+
        player.size/2;

    for(const c of coins){

        if(c.taken)
            continue;

        if(
            Math.hypot(
                px-c.x,
                py-c.y
            )<35
        ){

            c.taken=true;

            collectedThisLevel++;

            save.coins++;

            saveGame();

            sfxCoin();

            for(let i=0;i<10;i++){

                particles.push({
                    x:c.x,
                    y:c.y,
                    vx:
                        (Math.random()-.5)*5,
                    vy:
                        (Math.random()-.5)*5,
                    life:30
                });
            }
        }
    }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !running||
        paused
    )
        return;

    worldX+=
        levelSpeed*dt;

    const ground=
        canvas.height-100;

    /*
       Grawitacja.
    */

    player.vy+=
        .72*dt;

    player.y+=
        player.vy*dt;

    if(
        player.y+
        player.size>=ground
    ){

        player.y=
            ground-player.size;

        player.vy=0;

        player.grounded=true;

        player.rotation=0;

    }else{

        player.grounded=false;

        player.rotation+=
            .15*dt;
    }

    updateBlink(dt);

    /*
       Kamera.
    */

    cameraX=
        Math.max(
            0,
            worldX-200
        );

    collision();

    if(!running)
        return;

    collectCoins();

    progressBar.style.width=
        Math.min(
            100,
            worldX/levelLength*100
        )+"%";

    /*
       Trail.
    */

    if(save.settings.fx){

        trail.push({
            x:
                cameraX+
                player.x,
            y:player.y,
            life:18
        });

        if(trail.length>25)
            trail.shift();

        for(const t of trail)
            t.life--;

        trail=
            trail.filter(
                t=>t.life>0
            );
    }

    /*
       Cząsteczki.
    */

    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vy+=.15*dt;
        p.life-=dt;
    }

    particles=
        particles.filter(
            p=>p.life>0
        );

    if(
        worldX>=levelLength
    ){

        win();
    }
}

/* =========================================================
   RYSOWANIE
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const ground=
        canvas.height-100;

    /*
       TŁO
    */

    const grad=
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    grad.addColorStop(
        0,
        "#050518"
    );

    grad.addColorStop(
        1,
        "#080820"
    );

    ctx.fillStyle=grad;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
       GWIAZDY
    */

    ctx.fillStyle=
        "rgba(255,255,255,.7)";

    for(const s of stars){

        let sx=
            s.x-
            cameraX*.3;

        if(sx<-10)
            sx+=levelLength;

        if(
            sx<
            canvas.width+10
        ){

            ctx.beginPath();

            ctx.arc(
                sx,
                s.y,
                s.r,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    /*
       GRID
    */

    ctx.strokeStyle=
        "rgba(0,255,255,.06)";

    for(
        let x=-(cameraX%50);
        x<canvas.width;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }

    for(
        let y=0;
        y<canvas.height;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }

    /*
       ZIEMIA
    */

    ctx.fillStyle="#10102a";

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        100
    );

    ctx.fillStyle=levelColor;

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        3
    );

    /*
       PRZESZKODY
    */

    for(const o of obstacles){

        const x=
            o.x-cameraX;

        if(
            x<-100||
            x>canvas.width+100
        )
            continue;

        ctx.shadowBlur=15;
        ctx.shadowColor=levelColor;

        ctx.strokeStyle=
            levelColor;

        ctx.fillStyle=
            "rgba(0,0,0,.45)";

        if(o.type==="spike"){

            ctx.beginPath();

            ctx.moveTo(
                x,
                ground
            );

            ctx.lineTo(
                x+o.w/2,
                ground-o.h
            );

            ctx.lineTo(
                x+o.w,
                ground
            );

            ctx.closePath();

            ctx.fill();
            ctx.stroke();
        }

        if(o.type==="block"){

            ctx.fillRect(
                x,
                o.y,
                o.w,
                o.h
            );

            ctx.strokeRect(
                x,
                o.y,
                o.w,
                o.h
            );
        }

        if(o.type==="saw"){

            const cx=
                x+o.w/2;

            const cy=
                o.y-o.h/2;

            ctx.save();

            ctx.translate(
                cx,
                cy
            );

            ctx.rotate(
                worldX*.04
            );

            ctx.beginPath();

            for(
                let i=0;
                i<20;
                i++
            ){

                const a=
                    i*Math.PI*2/20;

                const r=
                    i%2===0
                    ?30
                    :19;

                const px=
                    Math.cos(a)*r;

                const py=
                    Math.sin(a)*r;

                if(i===0){

                    ctx.moveTo(
                        px,
                        py
                    );

                }else{

                    ctx.lineTo(
                        px,
                        py
                    );
                }
            }

            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        ctx.shadowBlur=0;
    }

    /*
       MONETY
    */

    for(const c of coins){

        if(c.taken)
            continue;

        const x=
            c.x-cameraX;

        if(
            x<-30||
            x>canvas.width+30
        )
            continue;

        ctx.beginPath();

        ctx.arc(
            x,
            c.y,
            c.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffe600";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ffe600";

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle="#fff8a0";

        ctx.beginPath();

        ctx.arc(
            x-3,
            c.y-3,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /*
       TRAIL
    */

    if(save.settings.fx){

        for(const t of trail){

            const alpha=
                Math.max(
                    0,
                    t.life/18
                );

            const x=
                t.x-cameraX;

            ctx.fillStyle=
                `rgba(
                    0,
                    255,
                    255,
                    ${alpha*.25}
                )`;

            ctx.fillRect(
                x+8,
                t.y+8,
                22,
                22
            );
        }
    }

    /*
       ============================
       POSTAĆ
       ============================

       TYLKO KWADRAT + OCZY.
       BEZ RĄK.
       BEZ NÓG.
    */

    const skin=
        skins[save.selectedSkin];

    ctx.save();

    ctx.translate(
        player.x+
        player.size/2,
        player.y+
        player.size/2
    );

    ctx.rotate(
        player.rotation
    );

    ctx.shadowBlur=18;
    ctx.shadowColor=skin[1];

    ctx.fillStyle=skin[1];

    ctx.fillRect(
        -19,
        -19,
        38,
        38
    );

    ctx.shadowBlur=0;

    /*
       OCZY
    */

    ctx.fillStyle="#050510";

    if(blinking){

        ctx.fillRect(
            -11,
            -5,
            7,
            2
        );

        ctx.fillRect(
            4,
            -5,
            7,
            2
        );

    }else{

        ctx.fillRect(
            -10,
            -8,
            5,
            7
        );

        ctx.fillRect(
            5,
            -8,
            5,
            7
        );
    }

    ctx.restore();

    /*
       PARTICLES
    */

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/50
            );

        ctx.fillStyle=
            levelColor;

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            5,
            5
        );
    }

    ctx.globalAlpha=1;
}

/* =========================================================
   PĘTLA GRY
========================================================= */

function gameLoop(time){

    if(!lastTime)
        lastTime=time;

    let dt=
        (time-lastTime)/16.67;

    lastTime=time;

    dt=Math.min(
        dt,
        2
    );

    update(dt);
    draw();

    if(
        running||
        paused
    ){

        requestAnimationFrame(
            gameLoop
        );
    }
}
