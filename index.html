<script>

/* =========================================================
   DANE POZIOMÓW
========================================================= */

const levels=[
  ["NEON RUSH","#00ffff",5.8,7000],
  ["CRYSTAL DRIVE","#6fa8ff",6.0,7300],
  ["LAVA PULSE","#ff482e",6.2,7600],
  ["SKY CIRCUIT","#75ff70",6.4,7900],
  ["VIOLET RUN","#c86cff",6.6,8200],
  ["SHADOW FACTORY","#aaaabb",6.8,8500],
  ["CYBER STORM","#00aaff",7.0,8800],
  ["INFERNO CORE","#ff7800",7.2,9000],
  ["ELECTRIC VOID","#eeff00",7.4,9200],
  ["GRAVITY BREAK","#ff35bb",7.6,9400],
  ["OVERDRIVE","#00ff88",7.8,9600],
  ["FINAL CHAOS","#ffffff",8.0,10000]
];


/* =========================================================
   ZAPIS
========================================================= */

let completed=
  JSON.parse(localStorage.getItem("nd_completed")||"[]");

let levelCoins=
  JSON.parse(localStorage.getItem("nd_coins")||"[]");

let sound=
  localStorage.getItem("nd_sound")!=="off";

if(!Array.isArray(completed)) completed=[];
if(!Array.isArray(levelCoins)) levelCoins=[];


function save(){

  localStorage.setItem(
    "nd_completed",
    JSON.stringify(completed)
  );

  localStorage.setItem(
    "nd_coins",
    JSON.stringify(levelCoins)
  );

  localStorage.setItem(
    "nd_sound",
    sound?"on":"off"
  );
}


function completedTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    if(completed[i]) n++;
  }

  return n;
}


function coinsTotal(){

  let n=0;

  for(let i=0;i<levels.length;i++){

    n+=Number(levelCoins[i]||0);
  }

  return n;
}


/* =========================================================
   DOM
========================================================= */

const home=
  document.getElementById("home");

const game=
  document.getElementById("game");

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext("2d");

const pausePanel=
  document.getElementById("pausePanel");

const levelsPanel=
  document.getElementById("levelsPanel");

const deadPanel=
  document.getElementById("deadPanel");

const winPanel=
  document.getElementById("winPanel");

const levelList=
  document.getElementById("levelList");

const menuLevels=
  document.getElementById("menuLevels");

const completedCount=
  document.getElementById("completedCount");

const coinCount=
  document.getElementById("coinCount");

const barFill=
  document.getElementById("barFill");

const soundButton=
  document.getElementById("soundButton");

const mobileJump=
  document.getElementById("mobileJump");

const winInfo=
  document.getElementById("winInfo");

const nextLevelButton=
  document.getElementById("nextLevelButton");

const levelTitle=
  document.getElementById("levelTitle");


/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;
let dpr=1;


function resize(){

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  makeStars();
}


window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   STAN GRY
========================================================= */

let currentLevel=0;

let playing=false;
let paused=false;
let dead=false;
let won=false;

let progress=0;
let lastTime=0;

let obstacles=[];
let coins=[];
let particles=[];
let stars=[];

let collected=0;


/* =========================================================
   GRACZ
========================================================= */

const player={
  x:120,
  y:0,
  size:32,
  vy:0,
  grounded:true,
  rotation:0
};


function ground(){

  return H*.78;
}


/* =========================================================
   GWIAZDY
========================================================= */

function makeStars(){

  stars=[];

  for(let i=0;i<110;i++){

    stars.push({

      x:Math.random()*Math.max(W,1),

      y:Math.random()*
        Math.max(H*.7,1),

      r:.5+Math.random()*1.7,

      speed:.2+
        Math.random()*.8
    });
  }
}


/* =========================================================
   GENERATOR POZIOMU
   DETERMINISTYCZNY
========================================================= */

function seededRandom(seed){

  let x=Math.sin(seed)*10000;

  return x-Math.floor(x);
}


function createLevel(){

  obstacles=[];
  coins=[];
  particles=[];

  progress=0;
  collected=0;

  const length=
    levels[currentLevel][3];

  let x=500;

  let pattern=
    currentLevel*137+25;

  while(x<length-400){

    const random=
      seededRandom(
        pattern++
      );

    if(random<.52){

      obstacles.push({

        type:"spike",

        x:x,

        w:38,

        h:40
      });

      if(
        seededRandom(pattern++)<.20 &&
        x<length-650
      ){

        obstacles.push({

          type:"spike",

          x:x+44,

          w:38,

          h:40
        });

        x+=44;
      }

    }else if(random<.80){

      obstacles.push({

        type:"saw",

        x:x,

        w:46,

        h:46
      });

    }else{

      obstacles.push({

        type:"gap",

        x:x,

        w:75+
          seededRandom(pattern++)*35
      });
    }

    x+=
      300+
      seededRandom(pattern++)*280;
  }


  /* =========================
     3 MONETY
  ========================= */

  const positions=[
    length*.27,
    length*.55,
    length*.80
  ];

  for(let i=0;i<3;i++){

    coins.push({

      x:positions[i],

      y:
        ground()-
        100-
        (i===1?65:0),

      collected:false,

      r:11
    });
  }


  resetPlayer();

  levelTitle.textContent=
    levels[currentLevel][0];

  barFill.style.width="0%";
}


function resetPlayer(){

  player.x=120;

  player.y=
    ground()-player.size;

  player.vy=0;

  player.grounded=true;

  player.rotation=0;
}


/* =========================================================
   TŁO
========================================================= */

function drawBackground(){

  const color=
    levels[currentLevel][1];

  const gradient=
    ctx.createLinearGradient(
      0,0,0,H
    );

  gradient.addColorStop(
    0,
    "#11112d"
  );

  gradient.addColorStop(
    .65,
    "#050511"
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  for(const s of stars){

    let x=
      (s.x-
      progress*
      s.speed*
      .08)%
      (W+30);

    if(x<0)
      x+=W+30;

    ctx.fillStyle="#ffffff";

    ctx.globalAlpha=
      .2+s.speed*.4;

    ctx.beginPath();

    ctx.arc(
      x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;


  /* SIATKA */

  ctx.strokeStyle=
    color+"25";

  ctx.lineWidth=1;

  const g=ground();

  for(let x=0;x<W;x+=50){

    ctx.beginPath();

    ctx.moveTo(x,g);

    ctx.lineTo(
      W/2+
      (x-W/2)*.2,
      H
    );

    ctx.stroke();
  }

  for(
    let y=g;
    y<H;
    y+=35
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();
  }
}


/* =========================================================
   TEREN
========================================================= */

function drawGround(){

  const color=
    levels[currentLevel][1];

  const g=ground();

  ctx.fillStyle="#080812";

  ctx.fillRect(
    0,g,W,H-g
  );

  ctx.fillStyle=color;

  ctx.shadowBlur=15;

  ctx.shadowColor=color;

  ctx.fillRect(
    0,g,W,3
  );

  ctx.shadowBlur=0;
}


/* =========================================================
   GRACZ
========================================================= */

function drawPlayer(){

  const color=
    levels[currentLevel][1];

  ctx.save();

  ctx.translate(
    player.x+
    player.size/2,

    player.y+
    player.size/2
  );

  ctx.rotate(
    player.rotation
  );

  ctx.shadowBlur=18;

  ctx.shadowColor=color;

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    -player.size/2,
    -player.size/2,
    player.size,
    player.size
  );

  ctx.strokeStyle=color;

  ctx.lineWidth=3;

  ctx.strokeRect(
    -player.size/2,
    -player.size/2,
    player.size,
    player.size
  );

  ctx.restore();
}


/* =========================================================
   PRZESZKODY
========================================================= */

function drawObstacle(o){

  const color=
    levels[currentLevel][1];

  const x=
    o.x-progress;

  if(
    x<-100||
    x>W+100
  )return;

  ctx.save();


  if(o.type==="spike"){

    ctx.fillStyle=color;

    ctx.shadowBlur=14;

    ctx.shadowColor=color;

    ctx.beginPath();

    ctx.moveTo(
      x,
      ground()
    );

    ctx.lineTo(
      x+o.w/2,
      ground()-o.h
    );

    ctx.lineTo(
      x+o.w,
      ground()
    );

    ctx.closePath();

    ctx.fill();


  }else if(o.type==="saw"){

    const cx=
      x+o.w/2;

    const cy=
      ground()-o.h/2;

    ctx.translate(
      cx,
      cy
    );

    ctx.rotate(
      progress*.01
    );

    ctx.fillStyle=color;

    ctx.shadowBlur=15;

    ctx.shadowColor=color;

    const teeth=12;

    ctx.beginPath();

    for(
      let i=0;
      i<teeth*2;
      i++
    ){

      const a=
        i*Math.PI/teeth;

      const r=
        i%2===0
        ? o.w/2
        : o.w*.34;

      const px=
        Math.cos(a)*r;

      const py=
        Math.sin(a)*r;

      if(i===0)
        ctx.moveTo(px,py);
      else
        ctx.lineTo(px,py);
    }

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#05050b";

    ctx.beginPath();

    ctx.arc(
      0,0,7,
      0,
      Math.PI*2
    );

    ctx.fill();


  }else if(o.type==="gap"){

    ctx.fillStyle="#000";

    ctx.fillRect(
      x,
      ground(),
      o.w,
      H-ground()
    );

    ctx.strokeStyle=color;

    ctx.lineWidth=2;

    ctx.strokeRect(
      x,
      ground(),
      o.w,
      H-ground()
    );
  }

  ctx.restore();
}


/* =========================================================
   MONETY
========================================================= */

function drawCoins(){

  for(const c of coins){

    if(c.collected)
      continue;

    const x=
      c.x-progress;

    if(
      x<-30||
      x>W+30
    )continue;

    ctx.save();

    ctx.translate(
      x,
      c.y
    );

    ctx.rotate(
      Math.sin(progress*.02)*.2
    );

    ctx.fillStyle="#ffd900";

    ctx.shadowBlur=18;

    ctx.shadowColor="#ffd900";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff4a0";

    ctx.beginPath();

    ctx.arc(
      -3,
      -3,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   CZĄSTECZKI
========================================================= */

function spawnParticles(
  x,
  y,
  color,
  count
){

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*6,

      vy:
        (Math.random()-.5)*6,

      life:
        25+
        Math.random()*30,

      size:
        2+
        Math.random()*3,

      color:color
    });
  }
}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.life-=dt;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );
    }
  }
}


function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/50
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   SKOK
========================================================= */

function jump(){

  if(!playing)return;

  if(paused)return;

  if(dead)return;

  if(won)return;

  if(!player.grounded)
    return;

  player.vy=-12;

  player.grounded=false;

  spawnParticles(
    player.x+
    player.size/2,

    player.y+
    player.size,

    levels[currentLevel][1],

    8
  );

  soundJump();
}


/* =========================================================
   AUDIO
========================================================= */

let audio=null;


function initAudio(){

  if(audio)return;

  try{

    audio=
      new (
        window.AudioContext||
        window.webkitAudioContext
      )();

  }catch(e){}
}


function beep(
  freq,
  duration
){

  if(!sound)return;

  initAudio();

  if(!audio)return;

  try{

    if(
      audio.state==="suspended"
    ){
      audio.resume();
    }

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.frequency.value=freq;

    osc.type="square";

    gain.gain.value=.035;

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+
      duration
    );

    osc.stop(
      audio.currentTime+
      duration
    );

  }catch(e){}
}


function soundJump(){
  beep(650,.06);
}


function soundCoin(){
  beep(900,.08);
}


function soundDeath(){
  beep(120,.18);
}


function soundWin(){
  beep(1000,.1);

  setTimeout(
    ()=>beep(1300,.12),
    100
  );
}


/* =========================================================
   KOLIZJE
========================================================= */

function updateCollisions(){

  const p={

    x:
      player.x+6,

    y:
      player.y+6,

    w:
      player.size-12,

    h:
      player.size-12
  };


  for(const o of obstacles){

    const x=
      o.x-progress;


    /* SPIKE */

    if(o.type==="spike"){

      const hit=

        p.x<x+o.w-5 &&

        p.x+p.w>x+5 &&

        p.y+p.h>
          ground()-o.h+10;

      if(hit){

        die();

        return;
      }
    }


    /* SAW */

    else if(o.type==="saw"){

      const cx=
        x+o.w/2;

      const cy=
        ground()-o.h/2;

      const closestX=
        Math.max(
          p.x,
          Math.min(
            cx,
            p.x+p.w
          )
        );

      const closestY=
        Math.max(
          p.y,
          Math.min(
            cy,
            p.y+p.h
          )
        );

      const dx=
        cx-closestX;

      const dy=
        cy-closestY;

      if(
        dx*dx+
        dy*dy<
        (o.w*.40)*
        (o.w*.40)
      ){

        die();

        return;
      }
    }


    /* PRZEPAŚĆ */

    else if(o.type==="gap"){

      if(
        player.grounded &&
        p.x<x+o.w &&
        p.x+p.w>x
      ){

        die();

        return;
      }
    }
  }


  /* MONETY */

  for(const c of coins){

    if(c.collected)
      continue;

    const x=
      c.x-progress;

    const dx=
      player.x+
      player.size/2-
      x;

    const dy=
      player.y+
      player.size/2-
      c.y;

    if(
      dx*dx+
      dy*dy<
      (c.r+
      player.size*.45)*
      (c.r+
      player.size*.45)
    ){

      c.collected=true;

      collected++;

      spawnParticles(
        x,
        c.y,
        "#ffd900",
        15
      );

      soundCoin();
    }
  }
}


/* =========================================================
   ŚMIERĆ
========================================================= */

function die(){

  if(dead)return;

  dead=true;

  playing=false;

  spawnParticles(
    player.x+
    player.size/2,

    player.y+
    player.size/2,

    levels[currentLevel][1],

    35
  );

  soundDeath();

  deadPanel.style.display="flex";
}


/* =========================================================
   WYGRANA
========================================================= */

function win(){

  if(won)return;

  won=true;

  playing=false;

  completed[currentLevel]=true;

  const old=
    Number(
      levelCoins[currentLevel]||0
    );

  levelCoins[currentLevel]=
    Math.max(
      old,
      collected
    );

  save();

  const total=
    Number(
      levelCoins[currentLevel]||0
    );

  winInfo.textContent=
    "Poziom: "+
    levels[currentLevel][0]+
    " • Monety: "+
    total+"/3";

  if(
    currentLevel===
    levels.length-1
  ){

    nextLevelButton.style.display=
      "none";

  }else{

    nextLevelButton.style.display=
      "block";

    nextLevelButton.textContent=
      "NASTĘPNY POZIOM";
  }

  soundWin();

  winPanel.style.display="flex";

  updateHome();
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(!playing)return;

  if(paused)return;

  if(dead)return;

  if(won)return;

  const speed=
    levels[currentLevel][2];

  const length=
    levels[currentLevel][3];


  progress+=
    speed*dt;


  if(
    progress>=length
  ){

    progress=length;

    win();

    return;
  }


  /* FIZYKA */

  player.vy+=
    .72*dt;

  player.y+=
    player.vy*dt;


  if(
    player.y+
    player.size>=
    ground()
  ){

    player.y=
      ground()-
      player.size;

    player.vy=0;

    player.grounded=true;

  }else{

    player.grounded=false;
  }


  /* ROTACJA */

  if(
    !player.grounded
  ){

    player.rotation+=
      .08*dt;

  }else{

    player.rotation=
      Math.round(
        player.rotation/
        (Math.PI/2)
      )*
      (Math.PI/2);
  }


  updateCollisions();

  updateParticles(dt);


  barFill.style.width=
    (
      progress/
      length*
      100
    )+"%";
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawGround();

  for(const o of obstacles){

    drawObstacle(o);
  }

  drawCoins();

  drawParticles();

  if(!dead){

    drawPlayer();
  }
}


/* =========================================================
   PĘTLA
========================================================= */

function loop(time){

  if(!lastTime){

    lastTime=time;
  }

  let dt=
    (time-lastTime)/
    16.6667;

  lastTime=time;

  dt=Math.min(
    dt,
    2
  );

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}


requestAnimationFrame(
  loop
);


/* =========================================================
   START GRY
========================================================= */

function startGame(){

  home.style.display="none";

  game.style.display="block";

  let level=
    completedTotal();

  if(level>=levels.length){

    level=
      levels.length-1;
  }

  startLevel(level);
}


function startLevel(index){

  if(
    index<0||
    index>=levels.length
  ){

    return;
  }


  if(
    index>0 &&
    !completed[index-1]
  ){

    return;
  }


  currentLevel=index;

  pausePanel.style.display="none";

  levelsPanel.style.display="none";

  deadPanel.style.display="none";

  winPanel.style.display="none";

  paused=false;

  dead=false;

  won=false;

  playing=true;

  createLevel();

  lastTime=
    performance.now();

  initAudio();
}

   RESTART
========================================================= */

function restartLevel(){

  pausePanel.style.display="none";

  deadPanel.style.display="none";

  winPanel.style.display="none";

  levelsPanel.style.display="none";

  paused=false;

  dead=false;

  won=false;

  playing=true;

  createLevel();

  lastTime=
    performance.now();
}

   PAUZA
========================================================= */

function pauseGame(){

  if(!playing)return;

  playing=false;

  paused=true;

  pausePanel.style.display="flex";
}


function resumeGame(){

  pausePanel.style.display="none";

  if(!dead&&!won){

    paused=false;

    playing=true;

    lastTime=
      performance.now();
  }
}

   POZIOMY
========================================================= */

function openLevelSelector(){

}


function showLevels(){

  pausePanel.style.display="none";

  winPanel.style.display="none";

  deadPanel.style.display="none";

  playing=false;

  paused=true;

  buildMenuLevels();

  levelsPanel.style.display="flex";
}


function closeLevels(){

  levelsPanel.style.display="none";

  if(
    game.style.display==="block" &&
    !dead &&
    !won
  ){

    paused=false;

    playing=true;

    lastTime=
      performance.now();
  }
}


function buildMenuLevels(){

  menuLevels.innerHTML="";

  for(
    let i=0;
    i<levels.length;
    i++
  ){

    const unlocked=
      i===0||
      completed[i-1];

    const button=
      document.createElement(
        "button"
      );

    button.className=
      "levelButton "+
      (
        unlocked
        ?"unlocked"
        :"locked"
      );

    button.innerHTML=
      (i+1)+
      ". "+
      levels[i][0]+
      "<br><small>"+
      (
        unlocked
        ?"🪙 "+
        Number(
          levelCoins[i]||0
        )+
        "/3"
        :"🔒 ZABLOKOWANY"
      )+
      "</small>";


    if(unlocked){

      button.onclick=()=>{
        startLevel(i);
      };

    }else{

      button.onclick=()=>{

        alert(
          "Najpierw ukończ poprzedni poziom."
        );
      };
    }

    menuLevels.appendChild(
      button
    );
  }
}
