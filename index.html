<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash Ultimate</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#03030a;color:#fff;font-family:Arial,sans-serif
}
button,input{font:inherit}
button{
  color:#fff;border:0;cursor:pointer;user-select:none;
  -webkit-user-select:none;touch-action:manipulation
}
button:active{transform:scale(.97)}

#menu{
  position:fixed;inset:0;overflow:auto;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 14px 40px;
  background:
    radial-gradient(circle at 50% 0%,#30358c 0,#111536 28%,#050611 65%,#020207 100%);
}

.logo{
  margin:10px 0 2px;
  font-size:clamp(34px,8vw,64px);
  font-weight:900;letter-spacing:5px;text-align:center;
  text-shadow:0 0 10px #00eaff,0 0 25px #00eaff,0 0 50px #a855ff;
  animation:logoPulse 1.8s infinite alternate
}
@keyframes logoPulse{to{transform:scale(1.035)}}

.subtitle{
  opacity:.7;text-align:center;
  font-size:14px;margin-bottom:15px
}

.topCard{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:12px;
  margin-bottom:12px
}

.card{
  background:linear-gradient(145deg,#171d42dd,#090d20ee);
  border:1px solid #3b4779;
  border-radius:18px;
  padding:15px;
  box-shadow:0 0 25px #0005
}

.playerCard{
  display:flex;align-items:center;gap:14px
}

.avatar{
  width:65px;height:65px;flex:none;
  display:grid;place-items:center;
  background:#10182c;
  border:2px solid #00eaff;
  border-radius:16px;
  box-shadow:0 0 18px #00eaff55;
  font-size:30px
}

.playerName{font-size:20px;font-weight:900}
.playerStats{opacity:.7;font-size:12px;margin-top:4px}

.xpBar{
  height:9px;background:#050712;border-radius:20px;
  overflow:hidden;margin-top:10px
}
#xpFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 12px #00eaff
}

.daily{
  text-align:left;
  cursor:pointer;
  border:1px solid #674b9b;
  background:linear-gradient(145deg,#251a46,#101126)
}
.dailyTitle{font-size:12px;opacity:.7}
.dailyName{font-size:19px;font-weight:900;margin:5px 0}
.dailyInfo{font-size:12px;opacity:.7}

.progress{
  width:min(900px,100%);
  padding:14px;
  margin-bottom:12px
}
.progressTop{
  display:flex;justify-content:space-between;font-weight:bold
}
.bar{
  height:12px;background:#050712;border-radius:20px;
  overflow:hidden;margin-top:8px
}
#menuBar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  transition:.3s
}
#doneText{text-align:center;opacity:.65;margin-top:7px;font-size:13px}

.actions{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;margin-bottom:12px
}
.action{
  min-height:48px;
  border-radius:13px;
  background:#1b2142;
  border:1px solid #3d4976;
  font-weight:bold
}
.action:hover{border-color:#00eaff}

.searchRow{
  width:min(900px,100%);
  display:flex;gap:8px;margin-bottom:12px
}
#search{
  min-width:0;flex:1;
  background:#0c1024;color:#fff;
  border:1px solid #39466f;
  border-radius:12px;padding:12px 14px;
  outline:none
}
#search:focus{border-color:#00eaff}

#levels{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px
}

.level{
  min-width:0;min-height:94px;
  text-align:left;padding:13px;
  border-radius:16px;
  border:2px solid #303861;
  background:linear-gradient(135deg,#171c3b,#0d1024);
  position:relative;overflow:hidden
}
.level:hover{border-color:#00eaff}
.level.favorite{border-color:#ffd43b}
.levelStatus{float:right;font-size:19px}
.levelName{font-weight:900;font-size:16px;padding-right:25px}
.levelInfo{font-size:11px;opacity:.65;margin-top:5px}
.levelBest{font-size:11px;color:#00eaff;margin-top:6px}

#achBtn{
  width:min(900px,100%);
  min-height:50px;margin-top:12px;
  border-radius:14px;background:#242a50;
  border:2px solid #414d7c;font-weight:bold
}

.overlay{
  position:fixed;inset:0;z-index:30;
  display:none;align-items:center;justify-content:center;
  background:#000b;padding:15px
}
.panel{
  width:min(600px,100%);
  max-height:90vh;overflow:auto;
  background:#10142c;
  border:2px solid #3d4a7d;
  border-radius:20px;padding:20px;
  box-shadow:0 0 40px #00eaff22
}
.panel h2{text-align:center;margin-top:0}
.panel button{
  width:100%;min-height:46px;margin-top:9px;
  padding:12px;border-radius:12px;
  background:#29335e;font-weight:bold
}

.tabs{
  display:flex;gap:6px;overflow:auto;margin-bottom:12px
}
.tab{
  white-space:nowrap;padding:9px 12px;
  border-radius:10px;background:#191f3c;
  border:1px solid #3d4770
}
.tab.active{border-color:#00eaff;background:#15294a}

.shopGrid,.missionGrid,.skinGrid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.item{
  padding:13px;border-radius:13px;
  background:#191e3b;border:1px solid #343e66
}
.item b{display:block;margin-bottom:5px}
.item small{opacity:.65}
.item button{margin-top:9px}

.ach{
  padding:12px;margin:8px 0;
  border-radius:12px;background:#191e3b;
  opacity:.4
}
.ach.on{opacity:1;border:1px solid #00eaff}

.statRow{
  display:flex;justify-content:space-between;
  gap:10px;padding:9px 0;
  border-bottom:1px solid #252c4c
}

#game{
  position:fixed;inset:0;display:none;
  touch-action:none;overscroll-behavior:none
}
canvas{
  position:absolute;inset:0;
  display:block;width:100%;height:100%;
  touch-action:none
}

#hud{
  position:absolute;z-index:4;
  left:10px;right:10px;top:10px;
  pointer-events:none;text-shadow:0 2px 5px #000
}
.hudLine{
  display:flex;justify-content:space-between;
  gap:8px;font-size:clamp(12px,2.8vw,17px);
  font-weight:bold
}
.hudBar{
  margin-top:7px;height:9px;
  background:#0008;border-radius:20px;overflow:hidden
}
#gameBar{
  height:100%;width:0;background:#00eaff;
  box-shadow:0 0 12px #00eaff
}
.gameButtons{
  position:absolute;right:10px;top:10px;z-index:10;
  display:flex;gap:7px
}
.gameButtons button{
  min-width:44px;min-height:44px;
  padding:8px 11px;background:#10162ddd;
  border:1px solid #53618e;border-radius:10px
}

#toast{
  position:fixed;left:50%;bottom:25px;
  transform:translateX(-50%);
  z-index:100;padding:12px 18px;
  border-radius:12px;background:#111936ee;
  border:1px solid #00eaff;
  box-shadow:0 0 20px #00eaff44;
  display:none;font-weight:bold
}

#errorBox{
  position:fixed;left:10px;right:10px;bottom:10px;
  z-index:999;background:#250b12;
  border:2px solid #ff3b4f;border-radius:12px;
  padding:12px;display:none;
  font:12px monospace;white-space:pre-wrap;
  max-height:40%;overflow:auto
}

@media(max-width:750px){
  .topCard{grid-template-columns:1fr}
  #levels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:480px){
  #levels{grid-template-columns:1fr}
  .actions{grid-template-columns:repeat(2,1fr)}
  .shopGrid,.missionGrid,.skinGrid{grid-template-columns:1fr}
}
</style>

</head>

/* =========================================================
   STORAGE
========================================================= */

function get(key,def){
  try{
    const v=localStorage.getItem(key);
    return v===null?def:v;
  }catch(e){
    return def;
  }
}

function set(key,val){
  try{
    localStorage.setItem(key,String(val));
  }catch(e){}
}

function num(key,def=0){
  const n=Number(get(key,String(def)));
  return Number.isFinite(n)?n:def;
}

function completed(i){
  return get("nd_done_"+i,"0")==="1";
}

function completedCount(){
  let n=0;
  for(let i=0;i<20;i++){
    if(completed(i))n++;
  }
  return n;
}

function totalCoins(){

  toast.style.display="block";
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{

function updateProfile(){

  const xp=num("nd_xp",0);
  const level=Math.floor(xp/100)+1;
  const inside=xp%100;

  document.getElementById("playerLevel").textContent=level;
  document.getElementById("xpText").textContent=xp;
  document.getElementById("coinText").textContent=totalCoins();

  document.getElementById("xpFill").style.width=inside+"%";
}

function updateMenuProgress(){

  const done=completedCount();
  const p=Math.round(done/20*100);

  document.getElementById("progressText").textContent=p+"%";
  document.getElementById("menuBar").style.width=p+"%";
  document.getElementById("doneText").textContent=
    done+" / 20 poziomów";
}

function renderMenu(){

  levelsBox.innerHTML="";

  const query=search.value.trim().toLowerCase();

  LEVELS.forEach((l,i)=>{

    if(
      query &&
      !(
        l[0].toLowerCase().includes(query)||
        String(i+1).includes(query)
      )
    )return;

    const b=document.createElement("button");

    b.type="button";
    b.className="level";

    const fav=
      get("nd_fav_"+i,"0")==="1";

    const best=
      get("nd_best_"+i,"—");

    b.innerHTML=
      '<span class="levelStatus">'+
      (completed(i)?"✅":"▶️")+
      '</span>'+
      '<div class="levelName">'+
      (fav?"⭐ ":"")+
      (i+1)+". "+l[0]+
      '</div>'+
      '<div class="levelInfo">'+
      l[1]+" • "+l[2]+" px/s"+
      '</div>'+
      '<div class="levelBest">'+
      "Rekord: "+best+
      '</div>';

    b.setAttribute(

/* =========================================================
   ACHIEVEMENTY
========================================================= */

function achUnlocked(id){
  return get("nd_ach_"+id,"0")==="1";
}

function unlock(id){

  if(achUnlocked(id))return;

  set("nd_ach_"+id,"1");

  const a=ACH.find(x=>x[0]===id);

  if(a)showToast("🏆 "+a[1]);

  renderAchievements();
}

function checkAchievements(){

  const done=completedCount();
  const coins=totalCoins();

  if(done>=1)unlock("first");
  if(done>=3)unlock("three");
  if(done>=6)unlock("six");
  if(done>=10)unlock("ten");
  if(done>=20)unlock("all");

  for(let i=0;i<20;i++){

    if(!completed(i))continue;

    if(i===0)unlock("first");
    else if(i===11)unlock("final");
    else unlock("level"+(i+1));
  }

  if(coins>=10)unlock("coins10");
  if(coins>=25)unlock("coins25");
  if(coins>=50)unlock("coins50");
  if(coins>=100)unlock("rich");

  if(deaths===0)unlock("perfect");
  if(deaths>=3)unlock("survivor");

  if(runCoins===3)unlock("allcoins");

  if(runCoins===3 && deaths===0)
    unlock("speedrunner");

  const streak=num("nd_streak",0);

  if(streak>=3)unlock("streak3");
  if(streak>=5)unlock("streak5");
}

function renderAchievements(){

  const box=document.getElementById("achList");
  box.innerHTML="";

  ACH.forEach(a=>{

    const d=document.createElement("div");

    d.className=
      "ach"+
      (achUnlocked(a[0])?" on":"");

    d.innerHTML=
      "<b>"+a[1]+"</b><br>"+
      "<small>"+a[2]+"</small>";

    box.appendChild(d);
  });
}

/* =========================================================

========================================================= */

function owned(id){
  return get("nd_item_"+id,"0")==="1";
}

function buyItem(id,name,cost){

  if(owned(id)){

    set("nd_selectedTrail",id);

    showToast("Wybrano "+name);
    return;
  }

  const coins=totalCoins();

  if(coins<cost){

  }

  set("nd_coins",coins-cost);
  set("nd_item_"+id,"1");

  unlock("shop");

  showToast("🛒 Kupiono "+name);

  renderShop();
  updateProfile();
}

function renderShop(){

  const box=document.getElementById("shopList");
  box.innerHTML="";

  SHOP.forEach(item=>{

    const d=document.createElement("div");

    d.className="item";

    const isOwned=owned(item[0]);

function missionProgress(id){

  const done=completedCount();
  const coins=totalCoins();

  if(id==="complete3")return Math.min(done,3);
  if(id==="complete10")return Math.min(done,10);
  if(id==="collect10")return Math.min(coins,10);
  if(id==="collect30")return Math.min(coins,30);

  return num("nd_perfect",0);
}

function claimMission(id,reward){

  if(get("nd_mission_"+id,"0")==="1"){

    showToast("Misja już odebrana");
    return;
  }

  set("nd_coins",totalCoins()+reward);
  set("nd_mission_"+id,"1");

  showToast("🎁 +"+reward+" monet");

  renderMissions();
  updateProfile();
}

function renderMissions(){

  const box=document.getElementById("missionList");
  box.innerHTML="";

  MISSIONS.forEach(m=>{

    const progress=missionProgress(m[0]);
    const done=progress>=m[2];
    const claimed=get("nd_mission_"+m[0],"0")==="1";

    const d=document.createElement("div");
    d.className="item";

    d.innerHTML=
      "<b>"+m[1]+"</b>"+
      "<small>"+
      progress+" / "+m[2]+
      " • nagroda "+m[3]+" 🪙"+
      "</small>";

    const b=document.createElement("button");
    b.className="action";

    if(claimed)b.textContent="ODEBRANO";
    else if(done)b.textContent="🎁 ODBIERZ";
    else b.textContent="W TRAKCIE";

    b.disabled=claimed||!done;

    if(done&&!claimed){
      b.onclick=()=>{
        claimMission(m[0],m[3]);
      };
    }

    d.appendChild(b);
    box.appendChild(d);
  });
}

function resizeCanvas(){

  H=Math.max(300,window.innerHeight);

    Math.max(window.devicePixelRatio||1,1),

   START LEVEL — BEZ BLOKADY
========================================================= */

function startLevel(index){

  if(typeof index!=="number"){
    index=Number(index);
  }

  if(
    !Number.isInteger(index)||
    index<0||
    index>=LEVELS.length
  ){
    alert("Nieprawidłowy poziom.");
    return;
  }

  try{

    current=index;

    running=false;
    paused=false;
    finished=false;
    dying=false;

    if(raf){
      cancelAnimationFrame(raf);
      raf=0;
    }

    stopMusic();

    deaths=0;
    runCoins=0;
    combo=0;
    bestCombo=0;

    collected=new Set();

    world=0;
    shake=0;
    flash=0;
    portalShield=0;

    gravity=
      index===9?
      1:
      1;

    practice=false;
    dailyMode=false;

    obstacles=[];
    coinObjects=[];
    pads=[];
    portals=[];
    particles=[];
    trail=[];
    stars=[];

    menu.style.display="none";
    game.style.display="block";

    pause.style.display="none";
    finish.style.display="none";

    resizeCanvas();
    generateLevel();
    resetPlayer();
    updateHUD();

    running=true;
    last=performance.now();

    numIncrement("nd_games");

    draw();

    raf=requestAnimationFrame(loop);

    if(sound){
      startMusic();
    }

  }catch(error){

    console.error(error);

    errorBox.style.display="block";
    errorBox.textContent=
      "BŁĄD URUCHAMIANIA POZIOMU:\n\n"+
      error.stack;

/* =========================================================
   GENEROWANIE POZIOMU
========================================================= */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];

  const length=
    10500+
    current*420;

  /* Gravity Break ma własny bezpieczny układ. */
  if(current===9){

    for(let x=650;x<3800;x+=470){
      spike(x,"bottom");
    }

    gravityPortal(4100,-1);

    for(let x=4700;x<8500;x+=480){
      spike(x,"bottom");
    }

    gravityPortal(9000,1);

    for(let x=9500;x<length;x+=450){
      spike(x,"top");
    }

  }else{

    let x=650;
    let p=0;

    const patterns=[
      "spike",
      "double",
      "saw",
      "gap",
      "pad",
      "spike",
      "saw",
      "speed",
      "double",
      "gap",
      "spikeSaw",
      "tripleSafe"
    ];

    while(x<length){

      const type=
        patterns[p%patterns.length];

      if(type==="spike"){

        spike(x,"bottom");
        x+=440;

      }else if(type==="double"){

        spike(x,"bottom");
        spike(x+75,"bottom");
        x+=540;

      }else if(type==="tripleSafe"){

        /* Trzy osobne przeszkody z dużym odstępem.
           To NIE jest Triple Spike. */

        spike(x,"bottom");
        spike(x+150,"bottom");
        spike(x+300,"bottom");

        x+=680;

      }else if(type==="saw"){

        saw(x,"bottom");
        x+=530;

      }else if(type==="spikeSaw"){

        spike(x,"bottom");
        saw(x+240,"bottom");
        x+=670;

      }else if(type==="gap"){

        gap(x,145,"bottom");
        x+=650;

      }else if(type==="pad"){

        pad(x);
        spike(x+210,"bottom");
        x+=620;

      }else if(type==="speed"){

        speedPortal(x,1.15);
        spike(x+260,"bottom");
        saw(x+500,"bottom");
        x+=760;
      }

      p++;
    }
  }

  /* Dokładnie 3 monety na każdy poziom. */

  const positions=[
    length*.25,
    length*.52,
    length*.79
  ];

  positions.forEach((cx,i)=>{

    let finalX=cx;

    for(let tries=0;tries<50;tries++){

      let bad=false;

      for(const o of obstacles){

        if(o.type==="gap"){

          if(
            finalX>o.x-100&&
            finalX<o.x+o.w+100
          ){
            bad=true;
            break;
          }

        }else{

          if(Math.abs(finalX-o.x)<125){
            bad=true;
            break;
          }
        }
      }

      if(!bad)break;

      finalX+=120;
    }

    coinObjects.push({
      id:i,
      x:finalX,
      collected:false
    });
  });
}

/* =========================================================
   OBIEKTY
========================================================= */

function spike(x,side="bottom"){
  obstacles.push({
    type:"spike",
    x,
    side
  });
}

function saw(x,side="bottom"){
  obstacles.push({
    type:"saw",
    x,
    r:28,
    side
  });
}

function gap(x,w,side="bottom"){
  obstacles.push({
    type:"gap",
    x,
    w,
    side
  });
}

function pad(x){
  pads.push({
    x,
    used:false
  });
}

function speedPortal(x,mult){
  portals.push({
    type:"speed",
    x,
    mult,
    used:false
  });
}

function gravityPortal(x,target){
  portals.push({
    type:"gravity",
    x,
    target,
    used:false
  });
}

/* =========================================================
   PLAYER
========================================================= */

function resetPlayer(){

  player.x=Math.max(
    80,
    Math.min(180,W*.22)
  );

  player.y=
    gravity===1?
    ground-player.size:
    0;

  player.vy=0;
  player.rot=0;
  player.grounded=true;
}

function jump(){

  if(
    !running||
    paused||
    dying||
    finished
  )return;

  if(player.grounded){

    player.vy=
      -720*gravity;

    player.grounded=false;

    numIncrement("nd_jumps");

    particlesJump();

    shake=3;
  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  let speed=LEVELS[current][2];

  for(const p of portals){

    if(
      p.type==="speed"&&
      world+player.x>p.x&&
      world+player.x<p.x+180
    ){
      speed*=p.mult;
    }
  }

  world+=speed*dt;

  const g=2050*gravity;

  player.vy+=g*dt;
  player.y+=player.vy*dt;

  if(gravity===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*(Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8;
    }

  }else{

    if(
      player.y<=0&&
      !gapUnder()
    ){

      player.y=0;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;
    }
  }

  if(portalShield>0){
    portalShield-=dt;
  }

  checkPads();
  checkPortals();
  checkCoins();

  if(portalShield<=0){
    collisions();
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){
    shake-=dt*13;
    if(shake<0)shake=0;
  }

  if(flash>0){
    flash-=dt*3;
    if(flash<0)flash=0;
  }
}

function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;

  for(const o of obstacles){

    if(
      o.type==="gap"&&
      o.side==="bottom"&&
      center>o.x&&
      center<o.x+o.w
    ){
      return true;
    }
  }

  return false;
}

/* =========================================================
   MECHANIKI
========================================================= */

function checkPads(){

  for(const p of pads){

    if(p.used)continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+55&&
      player.grounded
    ){

      p.used=true;

      player.vy=
        -980*gravity;

      player.grounded=false;

      particlesPad(
        p.x-world
      );

      shake=5;
    }
  }
}

function checkPortals(){

  for(const p of portals){

    if(p.used)continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+55
    ){

      p.used=true;

      if(p.type==="gravity"){

        gravity=p.target;

        player.vy=0;
        player.grounded=true;

        player.y=
          gravity===1?
          ground-player.size:
          0;

        player.rot=0;

        portalShield=.55;

        particlesPortal(
          p.x-world
        );

        shake=7;
      }
    }
  }
}

function checkCoins(){

  for(const c of coinObjects){

    if(c.collected)continue;

    const x=c.x-world;

    const y=
      gravity===1?
      ground-125:
      125;

    const px=player.x+17;
    const py=player.y+17;

    if(
      Math.hypot(px-x,py-y)<38
    ){

      c.collected=true;
      collected.add(c.id);

      runCoins=collected.size;

      combo++;

      if(combo>bestCombo)
        bestCombo=combo;

      particlesCoin(x,y);
      shake=3;

      updateHUD();
    }
  }
}

function collisions(){

  const left=
    world+player.x+6;

  const right=
    world+player.x+
    player.size-6;

  const top=
    player.y+6;

  const bottom=
    player.y+
    player.size-5;

  for(const o of obstacles){

    if(o.type==="spike"){

      if(
        o.side==="bottom"&&
        right>o.x+7&&
        left<o.x+46&&
        bottom>ground-48
      ){
        die();
        return;
      }

      if(
        o.side==="top"&&
        right>o.x+7&&
        left<o.x+46&&
        top<48
      ){
        die();
        return;
      }
    }

    if(o.type==="saw"){

      const cx=o.x;

      const cy=
        o.side==="bottom"?
        ground-o.r:
        o.r;

      const nx=Math.max(
        left,
        Math.min(cx,right)
      );

      const ny=Math.max(
        top,
        Math.min(cy,bottom)
      );

      const dx=cx-nx;
      const dy=cy-ny;

      if(
        dx*dx+dy*dy<
        (o.r-5)*(o.r-5)
      ){
        die();
        return;
      }
    }

    if(o.type==="gap"){

      const center=
        world+
        player.x+
        player.size/2;

      if(
        o.side==="bottom"&&
        center>o.x&&
        center<o.x+o.w&&
        bottom>=ground-8
      ){
        die();
        return;
      }
    }
  }
}

========================================================= */

function die(){

  if(
    dying||
    finished||
    !running
  )return;

  dying=true;
  deaths++;

  numIncrement("nd_deaths");

  running=false;

  flash=1;

  particlesDeath();

  setTimeout(()=>{

    dying=false;

    startLevel(current);

  },650);
}

/* =========================================================
   KONIEC
========================================================= */

function finishLevel(){

  if(finished)return;

  finished=true;
  running=false;

  stopMusic();

  set(
    "nd_done_"+current,
    "1"
  );

  const oldBest=get(
    "nd_best_"+current,
    "—"
  );

  const score=
    Math.max(
      0,
      100-
      deaths*5+
      runCoins*3
    );

  if(
    oldBest==="—"||
    score>Number(oldBest)
  ){
    set(
      "nd_best_"+current,
      String(score)
    );
  }

  set(
    "nd_coins",
    totalCoins()+runCoins
  );

  set(
    "nd_xp",
    num("nd_xp",0)+
    50+
    runCoins*10
  );

  if(deaths===0){
    set(
      "nd_perfect",
      num("nd_perfect",0)+1
    );
  }

  let streak=
    num("nd_streak",0)+1;

  set("nd_streak",streak);

  checkAchievements();

  particlesWin();

  document.getElementById("finishTitle").textContent=
    dailyMode?
    "📅 DAILY UKOŃCZONY!":
    "🎉 POZIOM UKOŃCZONY!";

  document.getElementById("finishInfo").textContent=
    LEVELS[current][0]+
    " • 🪙 "+runCoins+"/3"+
    " • ☠️ "+deaths+
    " • ⭐ "+score+
    " • 🔥 Combo "+bestCombo;

  finish.style.display="flex";

  renderMenu();
  renderStats();

  if(dailyMode)
    unlock("daily");

  victoryAnimation();
}

function checkWin(){

  const length=
    10500+
    current*420;

  if(world>=length){
    finishLevel();
  }
}

/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!running)return;

  if(paused){

    last=time;
    raf=requestAnimationFrame(loop);
    return;
  }

  let dt=(time-last)/1000;

  if(
    !Number.isFinite(dt)||
    dt<0
  )dt=0;

  dt=Math.min(dt,.05);

  last=time;

  update(dt);
  draw();
  checkWin();

  if(running){
    raf=requestAnimationFrame(loop);
  }
}

   HUD
========================================================= */

function updateHUD(){

  document.getElementById("levelName").textContent=
    (current+1)+" • "+LEVELS[current][0];

  document.getElementById("coins").textContent=

  const length=

  );

  document.getElementById("percent").textContent=

}

/* =========================================================
   RYSOWANIE
========================================================= */

function draw(){

  const color=LEVELS[current][3];

  ctx.clearRect(0,0,W,H);

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  const bg=
    ctx.createLinearGradient(0,0,0,H);

  bg.addColorStop(0,"#080b20");
  bg.addColorStop(1,"#020207");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  drawStars();
  drawGrid();
  drawSpeedLines();

  ctx.fillStyle="#0b0d18";
  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle=color;
  ctx.lineWidth=3;
  ctx.shadowColor=color;
  ctx.shadowBlur=12;

  ctx.beginPath();
  ctx.moveTo(0,ground);
  ctx.lineTo(W,ground);
  ctx.stroke();

  ctx.shadowBlur=0;

  for(const o of obstacles){

    const x=o.x-world;

    if(
      x<-150||
      x>W+150
    )continue;

    if(o.type==="spike")
      drawSpike(o,x);

    if(o.type==="saw")
      drawSaw(o,x);

    if(o.type==="gap"){

      ctx.fillStyle="#020207";

      ctx.fillRect(
        x,
        o.side==="bottom"?
        ground:
        0,
        o.w,
        o.side==="bottom"?
        H-ground:
        48
      );
    }
  }

  for(const p of pads){

    const x=p.x-world;

    if(x>-80&&x<W+80)
      drawPad(x);
  }

  for(const p of portals){

    const x=p.x-world;

    if(x>-100&&x<W+100){

      if(p.type==="speed")
        drawSpeedPortal(x);
      else
        drawGravityPortal(x,p.target);
    }
  }

  for(const c of coinObjects){

    if(c.collected)continue;

    const x=c.x-world;

    if(x>-50&&x<W+50){

      drawCoin(
        x,
        gravity===1?
        ground-125:
        125
      );
    }
  }

  drawTrail();

  if(!dying&&!finished)
    drawPlayer();

  drawParticles();

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(.5,flash*.5)+
      ")";

    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  updateHUD();
}

/* =========================================================
   OBIEKTY GRAFICZNE
========================================================= */

function drawPlayer(){

  const color=
    getSelectedSkinColor();

  ctx.save();

  ctx.translate(
    player.x+17,
    player.y+17
  );

  ctx.rotate(player.rot);

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.fillStyle=color;

  ctx.fillRect(
    -17,-17,34,34
  );

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;

  ctx.strokeRect(
    -17,-17,34,34
  );

  ctx.fillStyle="#05050b";

  ctx.fillRect(-8,-7,5,5);
  ctx.fillRect(3,-7,5,5);

  ctx.restore();
}

function drawSpike(o,x){

  const color=
    LEVELS[current][3];

  ctx.save();

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=16;

  ctx.beginPath();

  if(o.side==="bottom"){

    ctx.moveTo(x,ground);
    ctx.lineTo(x+23,ground-47);
    ctx.lineTo(x+46,ground);

  }else{

    ctx.moveTo(x,0);
    ctx.lineTo(x+23,47);
    ctx.lineTo(x+46,0);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.stroke();

  ctx.restore();
}

function drawSaw(o,x){

  const color=
    LEVELS[current][3];

  const cy=
    o.side==="bottom"?
    ground-o.r:
    o.r;

  ctx.save();

  ctx.translate(x,cy);

  ctx.rotate(performance.now()/280);

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=17;

  const teeth=14;

  ctx.beginPath();

  for(let i=0;i<teeth*2;i++){

    const a=i*Math.PI/teeth;
    const r=i%2===0?o.r:o.r*.7;

    const xx=Math.cos(a)*r;
    const yy=Math.sin(a)*r;

    if(i===0)ctx.moveTo(xx,yy);
    else ctx.lineTo(xx,yy);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();
  ctx.arc(0,0,o.r*.28,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawCoin(x,y){

  const s=
    1+
    Math.sin(performance.now()/130)*.1;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.fillStyle="#ffd43b";

  ctx.beginPath();
  ctx.arc(0,0,14,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();
}

function drawPad(x){

  ctx.save();

  ctx.fillStyle="#49ff9a";
  ctx.shadowColor="#49ff9a";
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    x+25,
    ground-10,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;
  ctx.strokeStyle="#fff";
  ctx.stroke();

  ctx.restore();
}

function drawSpeedPortal(x){

  ctx.save();

  ctx.translate(x+25,H*.48);

  ctx.strokeStyle="#ffe14a";
  ctx.shadowColor="#ffe14a";
  ctx.shadowBlur=20;
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,0,
    28+Math.sin(performance.now()/120)*4,
    0,Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";
  ctx.font="bold 18px Arial";
  ctx.textAlign="center";
  ctx.fillText(">>",0,7);

  ctx.restore();
}

function drawGravityPortal(x,target){

  ctx.save();

  ctx.translate(x+25,H*.48);

  ctx.strokeStyle=
    target===-1?
    "#ff4be8":
    "#49ff9a";

  ctx.shadowColor=ctx.strokeStyle;
  ctx.shadowBlur=22;
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,0,
    29+Math.sin(performance.now()/140)*4,
    0,Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";
  ctx.font="bold 22px Arial";
  ctx.textAlign="center";
  ctx.fillText("↕",0,8);

  ctx.restore();
}

/* =========================================================
   TŁO
========================================================= */

function createStars(){

  stars=[];

  for(let i=0;i<75;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*Math.max(100,ground*.9),
      r:Math.random()*2+.5,
      v:Math.random()*.8+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="#fff";

  for(const s of stars){

    s.x-=s.v;

    if(s.x<0)s.x=W;

    ctx.globalAlpha=.3+s.r*.2;

    ctx.beginPath();

    ctx.arc(
      s.x,s.y,s.r,
      0,Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const color=
    LEVELS[current][3];

  ctx.strokeStyle=color;
  ctx.globalAlpha=.08;

  const size=70;
  const off=-(world*.25)%size;

  for(let x=off;x<W;x+=size){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,ground);
    ctx.stroke();
  }

  for(let y=40;y<ground;y+=size){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const color=
    LEVELS[current][3];

  ctx.strokeStyle=color;
  ctx.globalAlpha=.12;
  ctx.lineWidth=2;

  const off=-(world*.8)%190;

  for(
    let x=off-190;
    x<W+190;
    x+=190
  ){

    const y=
      100+
      Math.abs(x*7)%
      Math.max(100,ground-150);

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+80,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   TRAIL
========================================================= */

function getSelectedSkinColor(){

  const id=get(
    "nd_skin",
    "cyan"
  );

  const s=
    SKINS.find(x=>x[0]===id);

  return s?s[2]:"#00eaff";
}

function updateTrail(dt){

  const id=
    get("nd_selectedTrail","");

  if(id){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.3,
      size:18,
      type:id
    });
  }

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;

    if(trail[i].life<=0)
      trail.splice(i,1);
  }

  if(trail.length>45)
    trail.splice(0,trail.length-45);
}

function drawTrail(){

  for(const t of trail){

    ctx.globalAlpha=
      Math.max(0,t.life/.3)*.35;

    let color=
      getSelectedSkinColor();

    if(t.type==="trail_fire")
      color="#ff7338";

    if(t.type==="trail_electric")
      color="#00eaff";

    if(t.type==="trail_rainbow"){

      const colors=[
        "#ff247f",
        "#ff7338",
        "#ffe14a",
        "#49ff9a",
        "#00eaff",
        "#a855ff"
      ];

      color=
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ];
    }

    if(t.type==="trail_ghost")
      color="#ffffff";

    ctx.fillStyle=color;
    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    ctx.fillRect(
      t.x-t.size/2,
      t.y-t.size/2,
      t.size,
      t.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =========================================================
   PARTICLE
========================================================= */

function particle(
  x,y,vx,vy,life,size,type
){

  if(particles.length>300)return;

  particles.push({
    x,y,vx,vy,life,max:life,size,
    type,
    rot:Math.random()*6,
    spin:(Math.random()-.5)*10
  });
}

function particlesJump(){

  for(let i=0;i<10;i++){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*150,
      Math.random()*80,
      .4,
      3,
      "jump"
    );
  }
}

function particlesDeath(){

  for(let i=0;i<55;i++){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*550,
      (Math.random()-.6)*550,
      .9,
      Math.random()*7+2,
      "death"
    );
  }
}

function particlesCoin(x,y){

  for(let i=0;i<20;i++){

    particle(
      x,y,
      (Math.random()-.5)*250,
      (Math.random()-.7)*250,
      .7,
      Math.random()*5+2,
      "coin"
    );
  }
}

function particlesPad(x){

  for(let i=0;i<18;i++){

    particle(
      x,
      ground-15,
      (Math.random()-.5)*220,
      -Math.random()*220,
      .7,
      4,
      "pad"
    );
  }
}

function particlesPortal(x){

  for(let i=0;i<30;i++){

    particle(
      x,
      H*.48,
      (Math.random()-.5)*300,
      (Math.random()-.5)*300,
      .8,
      4,
      "portal"
    );
  }
}

function particlesWin(){

  for(let i=0;i<130;i++){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*700,
      (Math.random()-.8)*700,
      1.5+Math.random(),
      Math.random()*8+3,
      "win"
    );
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=500*dt;
    p.rot+=p.spin*dt;

    if(p.life<=0)
      particles.splice(i,1);
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/p.max);

    let color=
      LEVELS[current][3];

    if(p.type==="coin")
      color="#ffd43b";

    if(p.type==="pad")
      color="#49ff9a";

    if(p.type==="portal")
      color="#ff4be8";

    if(p.type==="win"){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      color=
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ];
    }

    ctx.fillStyle=color;

    ctx.save();

    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -p.size/2,
      -p.size/2,
      p.size,
      p.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =========================================================
   MUZYKA
========================================================= */

function startMusic(){

  stopMusic();

  try{

    if(!audio){

      audio=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    if(audio.state==="suspended")
      audio.resume();

    const notes=[
      262,330,392,523,
      392,330,294,330
    ];

    const bpm=
      LEVELS[current][4];

    musicIndex=0;

    function note(){

      if(
        !sound||
        !running||
        paused
      )return;

      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();

      osc.type=
        current%3===0?
        "square":
        "triangle";

      osc.frequency.value=
        notes[
          musicIndex%notes.length
        ];

      gain.gain.setValueAtTime(
        .035,
        audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+.16
      );

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();
      osc.stop(audio.currentTime+.17);

      musicIndex++;
    }

    note();

    musicTimer=setInterval(
      note,
      60000/bpm
    );

  }catch(e){}
}

function stopMusic(){

  if(musicTimer){

    clearInterval(musicTimer);
    musicTimer=null;
  }
}

/* =========================================================
   PAUZA
========================================================= */

function togglePause(){

  if(!running)return;

  paused=!paused;

  pause.style.display=
    paused?
    "flex":
    "none";

  if(paused){

    stopMusic();

  }else{

    last=performance.now();

    if(sound)
      startMusic();
  }
}

========================================================= */

function backToMenu(){

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){

    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="none";
  menu.style.display="flex";

  pause.style.display="none";
  finish.style.display="none";

  renderMenu();
  renderAchievements();
  renderMissions();
  renderStats();
}

/* =========================================================
   VICTORY
========================================================= */

function victoryAnimation(){

  let frames=0;

  function anim(){

    if(!finished)return;

    updateParticles(.016);
    draw();

    frames++;

    if(frames<100)
      requestAnimationFrame(anim);
  }

  requestAnimationFrame(anim);
}
