const menu=document.getElementById("menu");

/* =====================================================
   STORAGE
===================================================== */

function get(key,def){

  try{

    const v=
      localStorage.getItem(key);

    return v===null?
      def:
      v;

  }catch(e){

    return def;
  }
}


function set(key,val){

  try{

    localStorage.setItem(
      key,
      String(val)
    );

  }catch(e){}
}


function completed(i){

  return get(
    "nd_level_"+i,
    "0"
  )==="1";
}


function completedCount(){

  let n=0;

  for(
    let i=0;
    i<LEVELS.length;
    i++
  ){

    if(completed(i))
      n++;
  }

  return n;
}


/* =====================================================
   ACHIEVEMENTY
===================================================== */

function unlocked(id){

  return get(
    "nd_ach_"+id,
    "0"
  )==="1";
}


function unlock(id){

  if(!unlocked(id)){

    set(
      "nd_ach_"+id,
      "1"
    );

  }
}


function checkAchievements(){

  const n=
    completedCount();

  if(n>=1)
    unlock("first");

  if(n>=3)
    unlock("three");

  if(n>=6)
    unlock("six");

  if(n>=10)
    unlock("ten");

  if(n>=20)
    unlock("all");


  for(
    let i=1;
    i<LEVELS.length;
    i++
  ){

    if(completed(i)){

      if(i===11)
        unlock("final");
      else
        unlock("level"+(i+1));

    }
  }


  const total=
    Number(
      get(
        "nd_totalCoins",
        "0"
      )
    );


  if(total>=10)
    unlock("coins10");

  if(total>=25)
    unlock("coins25");

  if(total>=50)
    unlock("coins50");

  if(deaths===0)
    unlock("perfect");

  if(deaths>=3)
    unlock("survivor");

  if(runCoins===3)
    unlock("allcoins");
}

/* =====================================================
   CANVAS
===================================================== */

let W=window.innerWidth;
let H=window.innerHeight;

let ground=H*.78;


const player={
  x:150,
  y:0,
  size:34,
  vy:0,
  rot:0,
  grounded:false
};


function resize(){

  W=
    Math.max(
      240,
      window.innerWidth
    );

  H=
    Math.max(
      240,
      window.innerHeight
    );


  const d=
    Math.min(
      Math.max(
        window.devicePixelRatio||1,
        1
      ),
      2
    );


  canvas.width=
    Math.round(W*d);

  canvas.height=
    Math.round(H*d);


  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";


  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );


  ground=
    Math.max(
      160,
      Math.min(
        H-55,
        H*.78
      )
    );


  if(!running){

    player.y=
      ground-
      player.size;
  }


  createStars();
}


window.addEventListener(
  "resize",
  resize
);

let dying=false;

/* =====================================================
   MENU

function renderMenu(){

  levelsBox.innerHTML="";


  LEVELS.forEach(
    (l,i)=>{

      const b=
        document.createElement(
          "button"
        );


      b.type="button";

      b.className=

      b.innerHTML=

          "▶️"
        )+
        '</span>'+
        '<div class="levelName">'+

        l[0]+

        '<div class="levelInfo">'+
        l[1]+
        " • "+

        bez addEventListener.
        Bezpośrednie globalne
        wywołanie startLevel().
      */

      b.setAttribute(
        "onclick",
        "startLevel("+i+")"
      );


      levelsBox.appendChild(b);

    }
  );


  const done=
    completedCount();


  const p=
    Math.round(
      done/
      LEVELS.length*
      100
    );


  progressText.textContent=
    p+"%";

  menuBar.style.width=
    p+"%";

  doneText.textContent=
    done+
    " / "+
    LEVELS.length+
    " poziomów";
}


/* =====================================================
   START LEVELU
===================================================== */

function startLevel(index){

  /*
    Zamiana na Number pozwala
    obsłużyć także wywołanie
    startLevel("5").
  */

  index=
    Number(index);


  if(
    !Number.isInteger(index)||
    index<0||
    index>=LEVELS.length
  ){

    showError(
      "Nieprawidłowy numer poziomu."
    );

    return;
  }


  try{

    current=index;

    running=false;
    paused=false;
    finished=false;
    dying=false;


    if(raf){

      cancelAnimationFrame(
        raf
      );

      raf=0;
    }


    stopMusic();


    deaths=0;
    runCoins=0;

    collected=
      new Set();


    world=0;
    shake=0;
    flash=0;


    /*
      GRAVITY BREAK
      to poziom nr 10,
      czyli indeks 9.
    */

    gravity=
      index===9?
      -1:
      1;


    obstacles=[];
    coinObjects=[];
    pads=[];
    portals=[];
    particles=[];
    trail=[];
    stars=[];


    menu.style.display=
      "none";

    game.style.display=
      "block";


    pause.style.display=
      "none";

    finish.style.display=
      "none";


    resize();

    generateLevel();

    resetPlayer();


    levelName.textContent=
      (index+1)+
      " • "+
      LEVELS[index][0];


    coinsText.textContent=
      "🪙 0/3";

    percent.textContent=
      "0%";

    gameBar.style.width=
      "0%";


    running=true;

    last=
      performance.now();


    draw();


    raf=
      requestAnimationFrame(
        loop
      );


    if(sound)
      startMusic();


  }catch(error){

    console.error(
      "START LEVEL ERROR:",
      error
    );


    running=false;


    showError(
      "Błąd uruchamiania poziomu: "+
      error.message
    );


    backToMenu();
  }
}


/* =====================================================
   RESET PLAYER
===================================================== */

function resetPlayer(){

  player.x=
    Math.max(
      90,
      Math.min(
        180,
        W*.22
      )
    );


  player.y=
    gravity===1?
    ground-player.size:
    0;


  player.vy=0;
  player.rot=0;
  player.grounded=true;
}


/* =====================================================
   GENEROWANIE POZIOMU
===================================================== */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];


  const length=
    9000+
    current*350;


  let x=600;


  /*
    Brak triple spike.
  */

  const patterns=[
    "spike",
    "saw",
    "gap",
    "double",
    "pad",
    "speed",
    "spike",
    "saw"
  ];


  let p=0;


  while(x<length){

    const type=
      patterns[
        p%
        patterns.length
      ];


    if(type==="spike"){

      spike(
        x,
        "bottom"
      );

      x+=430;

    }


    else if(type==="saw"){

      saw(
        x,
        "bottom"
      );

      x+=520;

    }


    else if(type==="gap"){

      gap(
        x,
        140
      );

      x+=610;

    }


    else if(type==="double"){

      spike(
        x,
        "bottom"
      );

      spike(
        x+75,
        "bottom"
      );

      x+=560;

    }


    else if(type==="pad"){

      pad(x);

      spike(
        x+220,
        "bottom"
      );

      x+=650;

    }


    else if(type==="speed"){

      speedPortal(x);

      spike(
        x+240,
        "bottom"
      );

      saw(
        x+500,
        "bottom"
      );

      x+=750;

    }


    p++;
  }


  /*
    Specjalny, bezpieczniejszy
    GRAVITY BREAK.
  */

  if(current===9){

    obstacles=[];
    portals=[];


    spike(
      1200,
      "bottom"
    );

    saw(
      1700,
      "bottom"
    );

    spike(
      2200,
      "bottom"
    );


    gravityPortal(
      2800,
      -1
    );


    /*
      Po zmianie grawitacji
      przeszkody są NA DOLE,
      więc gracz na górze
      nie wpada w nie.
    */

    spike(
      3400,
      "bottom"
    );

    saw(
      3900,
      "bottom"
    );

    spike(
      4500,
      "bottom"
    );


    gravityPortal(
      5200,
      1
    );


    /*
      Po powrocie na dół
      przeszkody są NA GÓRZE.
    */

    spike(
      5800,
      "top"
    );

    saw(
      6300,
      "top"
    );

    spike(
      6800,
      "top"
    );
  }


  /*
    Dokładnie 3 monety.
  */

  const coinPositions=[
    length*.25,
    length*.50,
    length*.75
  ];


  coinPositions.forEach(
    (cx,i)=>{

      coinObjects.push({

        id:i,

        x:cx,

        y:
          current===9?
          (
            i===1?
            H*.35:
            (
              i===2?
              H*.65:
              ground-120
            )
          ):
          ground-120,

        collected:false
      });

    }
  );
}


/* =====================================================
   OBIEKTY
===================================================== */

function spike(
  x,
  side="bottom"
){

  obstacles.push({

    type:"spike",

    x:x,

    side:side
  });
}


function saw(
  x,
  side="bottom"
){

  obstacles.push({

    type:"saw",

    x:x,

    r:28,

    side:side
  });
}


function gap(
  x,
  w
){

  obstacles.push({

    type:"gap",

    x:x,

    w:w,

    side:"bottom"
  });
}


function pad(x){

  pads.push({

    x:x,

    used:false
  });
}


function speedPortal(x){

  portals.push({

    type:"speed",

    x:x,

    used:false
  });
}


function gravityPortal(
  x,
  target
){

  portals.push({

    type:"gravity",

    x:x,

    target:target,

    used:false
  });
}


/* =====================================================
   STEROWANIE
===================================================== */

function jump(){

  if(
    !running||
    paused||
    dying||
    finished
  )
    return;


  if(player.grounded){

    player.vy=
      -730*
      gravity;


    player.grounded=
      false;


    particlesJump();

    shake=3;
  }
}


game.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target.closest(
        ".gameButtons"
      )||
      e.target.closest(
        "#pause"
      )||
      e.target.closest(
        "#finish"
      )
    )
      return;


    jump();

  },
  {

  }
);


window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="Space"||
      e.code==="ArrowUp"||

    ){

    ){

    }
  }
);


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  const level=
    LEVELS[current];


  let speed=
    level[2];


  for(const p of portals){

    if(
      p.type==="speed"&&
      !p.used&&
      world+player.x>
        p.x
    ){

      p.used=true;

      speed*=1.18;
    }
  }


  world+=
    speed*dt;


  const g=
    2050*
    gravity;


  player.vy+=
    g*dt;

  player.y+=
    player.vy*dt;


  if(gravity===1){

    const floor=
      ground-
      player.size;


    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;

      player.vy=0;

      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/
          (Math.PI/2)
        )*
        (Math.PI/2);

    }else{

      player.grounded=false;

      player.rot+=
        dt*8;
    }

  }else{

    if(
      player.y<=0
    ){

      player.y=0;

      player.vy=0;

      player.grounded=true;

    }else{

      player.grounded=false;

      player.rot-=
        dt*8;
    }
  }


  checkPads();

  checkGravityPortals();

  checkCoins();

  collisions();


  if(Math.random()<.8){

    trail.push({

      x:player.x+17,

      y:player.y+17,

      life:.3,

      size:16
    });
  }


  updateTrail(dt);

  updateParticles(dt);


  if(shake>0){

    shake-=
      dt*12;

    if(shake<0)
      shake=0;
  }


  if(flash>0){

    flash-=
      dt*3;

    if(flash<0)
      flash=0;
  }
}


function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;


  for(const o of obstacles){

    if(
      o.type==="gap"&&
      center>o.x&&
      center<
        o.x+o.w
    )
      return true;
  }


  return false;
}


/* =====================================================
   PORTALE GRAWITACYJNE
===================================================== */

function checkGravityPortals(){

  for(const p of portals){

    if(
      p.type!=="gravity"||
      p.used
    )
      continue;


    const px=
      world+
      player.x+
      player.size/2;


    if(
      px>
        p.x&&
      px<
        p.x+70
    ){

      p.used=true;

      gravity=
        p.target;


      /*
        Natychmiast ustawiamy
        gracza po bezpiecznej
        stronie.
      */

      if(gravity===-1){

        player.y=0;

      }else{

        player.y=
          ground-
          player.size;
      }


      player.vy=0;

      player.grounded=true;

      player.rot=0;

      particlesPortal(
        p.x-world
      );

      shake=8;
    }
  }
}


/* =====================================================
   PADY
===================================================== */

function checkPads(){

  for(const p of pads){

    if(p.used)
      continue;


    const px=
      world+
      player.x+
      player.size/2;


    if(
      px>p.x&&
      px<p.x+55&&
      player.grounded
    ){

      p.used=true;

      player.vy=
        -1000*
        gravity;

      player.grounded=
        false;

      particlesPad(
        p.x-world
      );

      shake=5;
    }
  }
}


/* =====================================================
   MONETY
===================================================== */

function checkCoins(){

  for(const c of coinObjects){

    if(c.collected)
      continue;


    const cx=
      c.x-world;

    const cy=
      c.y;


    const px=
      player.x+
      player.size/2;

    const py=
      player.y+
      player.size/2;


    if(
      Math.hypot(
        px-cx,
        py-cy
      )<38
    ){

      c.collected=true;

      collected.add(c.id);

      runCoins=
        collected.size;


      coinsText.textContent=
        "🪙 "+
        runCoins+
        "/3";


      particlesCoin(
        cx,
        cy
      );

      shake=3;
    }
  }
}


/* =====================================================
   KOLIZJE
===================================================== */

function collisions(){

  const px=
    world+
    player.x;


  const s=
    player.size;


  const left=
    px+7;

  const right=
    px+s-7;

  const top=
    player.y+7;

  const bottom=
    player.y+s-5;


  for(const o of obstacles){

    if(o.type==="spike"){

      if(
        o.side==="bottom"&&
        right>o.x+7&&
        left<o.x+46&&
        bottom>ground-48
      ){

        die();

        return;
      }


      if(
        o.side==="top"&&
        right>o.x+7&&
        left<o.x+46&&
        top<48
      ){

        die();

        return;
      }
    }


    if(o.type==="saw"){

      const cx=
        o.x;


      const cy=
        o.side==="top"?
        o.r:
        ground-o.r;


      const nx=
        Math.max(
          left,
          Math.min(
            cx,
            right
          )
        );


      const ny=
        Math.max(
          top,
          Math.min(
            cy,
            bottom
          )
        );


      const dx=
        cx-nx;

      const dy=
        cy-ny;


      if(
        dx*dx+
        dy*dy<
        (o.r-5)*
        (o.r-5)
      ){

        die();

        return;
      }
    }


    if(o.type==="gap"){

      const center=
        world+
        player.x+
        s/2;


      if(
        center>o.x&&
        center<
          o.x+o.w&&
        gravity===1&&
        bottom>=ground-10
      ){

        die();

        return;
      }
    }
  }
}


/* =====================================================
   ŚMIERĆ
===================================================== */

function die(){

  if(
    dying||
    finished||
    !running
  )
    return;


  dying=true;

  deaths++;

  running=false;

  shake=14;

  flash=1;

  particlesDeath();


  setTimeout(
    ()=>{
      
      if(!dying)
        return;


      dying=false;

      startLevel(
        current
      );

    },
    600
  );
}


/* =====================================================
   KONIEC POZIOMU
===================================================== */

function checkWin(){

  const length=
    9000+
    current*350;


  if(world>=length){

    finishLevel();
  }
}


function finishLevel(){

  if(finished)
    return;


  finished=true;

  running=false;

  stopMusic();


  set(
    "nd_level_"+current,
    "1"
  );


  const old=
    Number(
      get(
        "nd_totalCoins",
        "0"
      )
    );


  set(
    "nd_totalCoins",
    old+
    runCoins
  );


  checkAchievements();


  document.getElementById(
    "finishTitle"
  ).textContent=
    "🎉 POZIOM UKOŃCZONY!";


  document.getElementById(
    "finishInfo"
  ).textContent=
    LEVELS[current][0]+
    " • 🪙 "+
    runCoins+
    "/3 • ☠️ "+
    deaths+
    " śmierci";


  finish.style.display=
    "flex";


  renderMenu();

  victoryAnimation();
}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running)
    return;


  if(paused){

    last=time;

    raf=
      requestAnimationFrame(
        loop
      );

    return;
  }


  let dt=
    (time-last)/
    1000;


  if(
    !Number.isFinite(dt)||
    dt<0
  )
    dt=0;


  dt=
    Math.min(
      dt,
      .05
    );


  last=time;


  update(dt);

  draw();

  checkWin();


  if(running){

    raf=
      requestAnimationFrame(
        loop
      );
  }
}


/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

  const color=
    LEVELS[current][3];


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.save();


  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*
      shake,
      (Math.random()-.5)*
      shake
    );
  }


  const bg=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  bg.addColorStop(
    0,
    "#080b20"
  );

  bg.addColorStop(
    1,
    "#020207"
  );


  ctx.fillStyle=bg;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  drawStars();

  drawGrid();


  ctx.fillStyle="#0b0d18";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );


  ctx.strokeStyle=color;

  ctx.lineWidth=3;

  ctx.shadowColor=color;

  ctx.shadowBlur=12;


  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();


  ctx.shadowBlur=0;


  for(const o of obstacles){

    const x=
      o.x-world;


    if(
      x<-150||
      x>W+150
    )
      continue;


    if(
      o.type==="spike"
    )
      drawSpike(o,x);


    if(
      o.type==="saw"
    )
      drawSaw(o,x);


    if(
      o.type==="gap"
    ){

      ctx.fillStyle=
        "#020207";


      ctx.fillRect(
        x,
        ground,
        o.w,
        H-ground
      );
    }
  }


  for(const p of pads){

    const x=
      p.x-world;


    if(
      x>-80&&
      x<W+80
    )
      drawPad(x);
  }


  for(const p of portals){

    const x=
      p.x-world;


    if(
      x>-100&&
      x<W+100
    ){

      if(p.type==="speed")
        drawSpeedPortal(x);

      else
        drawGravityPortal(x);
    }
  }


  for(const c of coinObjects){

    if(c.collected)
      continue;


    const x=
      c.x-world;


    if(
      x>-50&&
      x<W+50
    ){

      drawCoin(
        x,
        c.y
      );
    }
  }


  drawTrail();


  if(
    !dying&&
    !finished
  )
    drawPlayer();


  drawParticles();


  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(
        .5,
        flash*.5
      )+
      ")";


    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }


  ctx.restore();


  const length=
    9000+
    current*350;


  const p=
    Math.min(
      100,
      Math.floor(
        world/
        length*
        100
      )
    );


  percent.textContent=
    p+"%";


  gameBar.style.width=
    p+"%";
}


/* =====================================================
   GRACZ
===================================================== */

function drawPlayer(){

  const color=
    LEVELS[current][3];


  ctx.save();


  ctx.translate(
    player.x+17,
    player.y+17
  );


  ctx.rotate(
    player.rot
  );


  ctx.shadowColor=color;

  ctx.shadowBlur=20;

  ctx.fillStyle=color;


  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );


  ctx.shadowBlur=0;


  ctx.strokeStyle="#fff";

  ctx.lineWidth=2;


  ctx.strokeRect(
    -17,
    -17,
    34,
    34
  );


  ctx.restore();
}


/* =====================================================
   SPIKE
===================================================== */

function drawSpike(
  o,
  x
){

  const color=
    LEVELS[current][3];


  ctx.save();


  ctx.fillStyle=color;

  ctx.shadowColor=color;

  ctx.shadowBlur=16;


  ctx.beginPath();


  if(o.side==="top"){

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+23,
      47
    );

    ctx.lineTo(
      x+46,
      0
    );

  }else{

    ctx.moveTo(
      x,
      ground
    );

    ctx.lineTo(
      x+23,
      ground-47
    );

    ctx.lineTo(
      x+46,
      ground
    );
  }


  ctx.closePath();

  ctx.fill();


  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.stroke();


  ctx.restore();
}


/* =====================================================
   SAW
===================================================== */

function drawSaw(
  o,
  x
){

  const color=
    LEVELS[current][3];


  const cy=
    o.side==="top"?
    o.r:
    ground-o.r;


  ctx.save();


  ctx.translate(
    x,
    cy
  );


  ctx.rotate(
    performance.now()/280
  );


  ctx.fillStyle=color;

  ctx.shadowColor=color;

  ctx.shadowBlur=17;


  const teeth=14;


  ctx.beginPath();


  for(
    let i=0;
    i<teeth*2;
    i++
  ){

    const a=
      i*Math.PI/teeth;


    const r=
      i%2===0?
      o.r:
      o.r*.7;


    const xx=
      Math.cos(a)*r;

    const yy=
      Math.sin(a)*r;


    if(i===0)
      ctx.moveTo(
        xx,
        yy
      );

    else
      ctx.lineTo(
        xx,
        yy
      );
  }


  ctx.closePath();

  ctx.fill();


  ctx.shadowBlur=0;


  ctx.fillStyle="#05050c";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    o.r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();
}


/* =====================================================
   COIN
===================================================== */

function drawCoin(
  x,
  y
){

  const s=
    1+
    Math.sin(

    )*.1;


  ctx.save();


  ctx.translate(

  );


  ctx.scale(

  );


  ctx.shadowColor=
    "#ffd43b";

  ctx.shadowBlur=22;

  ctx.fillStyle=
    "#ffd43b";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.lineWidth=2;

  ctx.stroke();


  ctx.restore();
}

/* =====================================================
   TŁO
===================================================== */

function createStars(){

  stars=[];


  for(
    let i=0;
    i<80;
    i++
  ){

    stars.push({

      x:
        Math.random()*W,

      y:
        Math.random()*
        Math.max(
          100,
          ground*.9
        ),

      r:
        Math.random()*2+
        .5,

      v:
        Math.random()*.8+
        .2
    });
  }
}


function drawStars(){

  ctx.fillStyle="#fff";


  for(const s of stars){

    s.x-=s.v;


    if(s.x<0)
      s.x=W;


    ctx.globalAlpha=
      .3+
      s.r*.2;


    ctx.beginPath();


    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );


    ctx.fill();
  }


  ctx.globalAlpha=1;
}


function drawGrid(){

  const color=
    LEVELS[current][3];


  ctx.strokeStyle=color;

  ctx.globalAlpha=.08;


  const size=70;


  const off=
    -(world*.25)%size;


  for(
    let x=off;
    x<W;
    x+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      ground
    );

    ctx.stroke();
  }


  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();
  }


  ctx.globalAlpha=1;
}


/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;


    if(
      trail[i].life<=0
    )
      trail.splice(i,1);
  }


  if(trail.length>35){

    trail.splice(
      0,
      trail.length-35
    );
  }
}


function drawTrail(){

  const color=
    LEVELS[current][3];


  for(const t of trail){

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/.3
      )*.35;


    ctx.fillStyle=color;


    ctx.fillRect(
      t.x-t.size/2,
      t.y-t.size/2,
      t.size,
      t.size
    );
  }


  ctx.globalAlpha=1;
}


/* =====================================================
   PARTICLE
===================================================== */

function particle(
  x,
  y,
  vx,
  vy,
  life,
  size,
  type
){

  if(
    particles.length>260
  )
    return;


  particles.push({

    x:x,

    y:y,

    vx:vx,

    vy:vy,

    life:life,

    max:life,

    size:size,

    type:type,

    rot:
      Math.random()*6
  });
}


function particlesJump(){

  for(
    let i=0;
    i<10;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*150,
      Math.random()*80,
      .4,
      3,
      "jump"
    );
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];


    p.life-=dt;

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      500*dt;


    if(p.life<=0)
      particles.splice(i,1);
  }
}


function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );


    let color=
      LEVELS[current][3];


    if(p.type==="coin")
      color="#ffd43b";

    if(p.type==="pad")
      color="#49ff9a";

    if(p.type==="portal")
      color="#ff4be8";


    ctx.fillStyle=color;


    ctx.fillRect(
      p.x-p.size/2,
      p.y-p.size/2,
      p.size,
      p.size
    );
  }


  ctx.globalAlpha=1;
}


/* =====================================================
   MUZYKA
===================================================== */

function startMusic(){

  stopMusic();


  try{

    if(!audio){

      audio=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();
    }


    if(
      audio.state===
      "suspended"
    )
      audio.resume();


    const notes=[
      262,
      330,
      392,
      523,
      392,
      330
    ];


    let n=0;


    function note(){

      if(
        !sound||
        !running||
        paused
      )
        return;


      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();


      osc.type="square";


      osc.frequency.value=
        notes[
          n%
          notes.length
        ];


      gain.gain.setValueAtTime(
        .025,
        audio.currentTime
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+.15
      );


      osc.connect(gain);

      gain.connect(
        audio.destination
      );


      osc.start();


      osc.stop(
        audio.currentTime+.16
      );


      n++;
    }


    note();


    musicTimer=
      setInterval(
        note,
        400
      );

  }catch(e){}
}


function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}
