
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050511;
    color:white;
}
body.light{
    background:#e9eef5;
    color:#111;
}
button{
    border:0;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}
#home{
    position:absolute;
    inset:0;
    overflow:auto;
    padding:25px;
    text-align:center;
    background:
      radial-gradient(circle at 50% 20%,#17215c 0%,#080817 45%,#020207 100%);
}
body.light #home{
    background:linear-gradient(#eef3ff,#dfe6f2);
}
.logo{
    margin-top:25px;
    font-size:54px;
    font-weight:900;
    color:#00ffff;
    text-shadow:0 0 10px #00ffff,0 0 35px #0088ff;
}
.subtitle{
    color:#aaa;
    margin-bottom:20px;
}
.menuBtn{
    display:block;
    width:min(420px,90%);
    margin:12px auto;
    padding:16px;
    border-radius:14px;
    color:white;
    background:linear-gradient(90deg,#075eff,#00c8ff);
    box-shadow:0 0 18px #0077ff66;
    transition:.15s;
}
.menuBtn:hover{transform:scale(1.03)}
.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:18px auto;
}
.stat{
    background:#ffffff12;
    border:1px solid #ffffff20;
    padding:10px 16px;
    border-radius:12px;
}
#game{
    position:absolute;
    inset:0;
    display:none;
}
canvas{
    width:100%;
    height:100%;
    display:block;
}
#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    font-weight:bold;
    text-shadow:0 2px 5px black;
}
.hudBox{
    padding:9px 12px;
    border-radius:10px;
    background:#0008;
}
#mobileJump{
    display:none;
    position:absolute;
    right:20px;
    bottom:25px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#00ffffaa;
    box-shadow:0 0 25px #00ffff;
    color:#001;
}
.panel{
    position:absolute;
    inset:0;
    background:#03030bee;
    overflow:auto;
    padding:25px;
    text-align:center;
}
.panel h2{
    color:#00ffff;
    font-size:32px;
}
.cardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;
    max-width:900px;
    margin:20px auto;
}
.card{
    padding:15px;
    border-radius:15px;
    background:#ffffff0c;
    border:1px solid #ffffff20;
}
.skinPreview{
    width:65px;
    height:65px;
    margin:8px auto 12px;
    border-radius:12px;
    box-shadow:0 0 18px currentColor;
}
.buy{
    width:100%;
    padding:9px;
    border-radius:9px;
    color:white;
    background:#1769ff;
}
.buy:disabled{
    opacity:.5;
    cursor:not-allowed;
}
.closeBtn{
    padding:12px 25px;
    border-radius:10px;
    background:#333;
    color:white;
}
.levelLocked{
    opacity:.35;
}
.levelCard{
    cursor:pointer;
    padding:18px;
    border-radius:15px;
    background:#ffffff10;
    border:1px solid #ffffff20;
}
.levelCard:hover{
    background:#ffffff20;
}
.toggle{
    max-width:400px;
    margin:10px auto;
    padding:15px;
    border-radius:12px;
    background:#ffffff10;
    display:flex;
    justify-content:space-between;
}
#toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    background:#111;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:50;
}
#toast.show{opacity:1}

@keyframes confettiFall{
    from{transform:translateY(-100vh) rotate(0deg)}
    to{transform:translateY(110vh) rotate(720deg)}
}

@media(max-width:700px){
    #mobileJump{display:block}
    .logo{font-size:40px}
}
</style>
</head>

<body>

<div id="toast"></div>

<div id="home">
    <div class="logo">NEON DASH</div>
    <div class="subtitle">Jump • Dodge • Collect • Survive</div>

    <div class="stats">
        <div class="stat">🪙 <span id="coinCount">0</span></div>
        <div class="stat">🏆 <span id="completedCount">0</span>/18</div>
        <div class="stat">🎨 <span id="skinName">Classic</span></div>
    </div>

    <button class="menuBtn" onclick="startGame()">▶ GRAJ</button>
    <button class="menuBtn" onclick="openLevels()">📋 POZIOMY</button>
    <button class="menuBtn" onclick="openShop()">🎨 SKLEP</button>
    <button class="menuBtn" onclick="openAchievements()">🏆 OSIĄGNIĘCIA</button>
    <button class="menuBtn" onclick="openSettings()">⚙ USTAWIENIA</button>
</div>

<div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div class="hudBox">
            Poziom: <span id="levelText">1</span>
        </div>
        <div class="hudBox">
            🪙 <span id="runCoins">0</span>
        </div>
        <div class="hudBox">
            <span id="progressText">0%</span>
        </div>
    </div>

    <button id="mobileJump">JUMP</button>
</div>

<div id="levelsPanel" class="panel" style="display:none">
    <h2>📋 POZIOMY</h2>
    <div id="levelsGrid" class="cardGrid"></div>
    <button class="closeBtn" onclick="backHome()">← Wróć</button>
</div>

<div id="shopPanel" class="panel" style="display:none">
    <h2>🎨 SKLEP</h2>
    <p>Twoje monety: 🪙 <span id="shopCoins">0</span></p>
    <div id="shopGrid" class="cardGrid"></div>
    <button class="closeBtn" onclick="backHome()">← Wróć</button>
</div>

<div id="achievementsPanel" class="panel" style="display:none">
    <h2>🏆 OSIĄGNIĘCIA</h2>
    <div id="achievementList"></div>
    <button class="closeBtn" onclick="backHome()">← Wróć</button>
</div>

<div id="settingsPanel" class="panel" style="display:none">
    <h2>⚙ USTAWIENIA</h2>

    <div class="toggle">
        <span>🔊 Dźwięki</span>
        <button id="soundBtn" onclick="toggleSetting('sound')"></button>
    </div>

    <div class="toggle">
        <span>🎵 Muzyka</span>
        <button id="musicBtn" onclick="toggleSetting('music')"></button>
    </div>

    <div class="toggle">
        <span>✨ Efekty</span>
        <button id="effectsBtn" onclick="toggleSetting('effects')"></button>
    </div>

    <div class="toggle">
        <span>📳 Wibracje</span>
        <button id="vibrationBtn" onclick="toggleSetting('vibration')"></button>
    </div>

    <div class="toggle">
        <span>🌙 Motyw</span>
        <button onclick="toggleTheme()">Zmień</button>
    </div>

    <div class="toggle">
        <span>⛶ Pełny ekran</span>
        <button onclick="toggleFullscreen()">Włącz</button>
    </div>

    <button class="menuBtn" onclick="resetProgress()">♻ Resetuj postęp</button>
    <button class="closeBtn" onclick="backHome()">← Wróć</button>
</div>

<script>
"use strict";

const levels = [
 ["NEON RUSH","#00ffff",5.8,7000],
 ["CRYSTAL DRIVE","#6fa8ff",6.0,7300],
 ["LAVA PULSE","#ff482e",6.2,7600],
 ["SKY CIRCUIT","#75ff70",6.4,7900],
 ["VIOLET RUN","#c86cff",6.6,8200],
 ["SHADOW FACTORY","#aaaabb",6.8,8500],
 ["CYBER STORM","#00aaff",7.0,8800],
 ["INFERNO CORE","#ff7800",7.2,9000],
 ["ELECTRIC VOID","#eeff00",7.4,9200],
 ["GRAVITY BREAK","#ff35bb",7.6,9400],
 ["OVERDRIVE","#00ff88",7.8,9600],
 ["FINAL CHAOS","#ffffff",8.0,10000],

 ["NEON HORIZON","#ff00ff",8.2,10300],
 ["CYBER JUNGLE","#55ff55",8.4,10600],
 ["LASER CITY","#00ddff",8.6,10900],
 ["NIGHT RUNNER","#8855ff",8.8,11200],
 ["INFINITE PULSE","#ff4466",9.0,11500],
 ["ULTIMATE DASH","#ffffff",9.2,12000]
];

const skins = [
 {name:"Classic",color:"#00ffff",price:0},
 {name:"Fire",color:"#ff4422",price:20},
 {name:"Lime",color:"#66ff44",price:30},
 {name:"Purple",color:"#bb55ff",price:40},
 {name:"Gold",color:"#ffd42a",price:60},
 {name:"Pink",color:"#ff55bb",price:80},
 {name:"Ice",color:"#aaffff",price:100},
 {name:"Void",color:"#ffffff",price:150}
];

const achievements = [
 ["first","Pierwszy krok","Ukończ pierwszy poziom"],
 ["five","Szybki gracz","Ukończ 5 poziomów"],
 ["ten","Dash Master","Ukończ 10 poziomów"],
 ["all","Neon Legend","Ukończ wszystkie poziomy"],
 ["collector","Kolekcjoner","Zbierz 50 monet"],
 ["shopper","Stylista","Odblokuj 3 skiny"]
];

let saveData = JSON.parse(localStorage.getItem("neonDashSave") || "{}");

saveData.coins ??= 0;
saveData.completed ??= [];
saveData.ownedSkins ??= [0];
saveData.selectedSkin ??= 0;
saveData.achievements ??= [];
saveData.settings ??= {
 sound:true,
 music:true,
 effects:true,
 vibration:true,
 theme:"dark"
};

function save(){
 localStorage.setItem("neonDashSave",JSON.stringify(saveData));
 updateHome();
}

function updateHome(){
 document.getElementById("coinCount").textContent=saveData.coins;
 document.getElementById("completedCount").textContent=saveData.completed.length;
 document.getElementById("skinName").textContent=skins[saveData.selectedSkin].name;
}

updateHome();

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

let W=0,H=0;
let running=false;
let paused=false;
let levelIndex=0;
let levelTime=0;
let levelCoins=0;
let currentSpeed=1;
let cameraX=0;
let lastTime=0;
let obstacles=[];
let coins=[];
let pads=[];
let portals=[];
let particles=[];
let confetti=[];
let shake=0;

let player={
 x:130,
 y:0,
 w:38,
 h:38,
 vy:0,
 grounded:false,
 blink:0
};

function resize(){
 W=Math.max(320,innerWidth);
 H=Math.max(320,innerHeight);
 canvas.width=W;
 canvas.height=H;
}
addEventListener("resize",resize);
resize();

function groundY(){
 return H-100;
}

function createLevel(){
 obstacles=[];
 coins=[];
 pads=[];
 portals=[];
 particles=[];
 levelTime=0;
 levelCoins=0;
 currentSpeed=1;
 cameraX=0;

 player.x=130;
 player.y=groundY()-player.h;
 player.vy=0;
 player.grounded=true;

 let spacing=390;
 let total=levels[levelIndex][3];

 for(let x=600,i=0;x<total;x+=spacing,i++){
    let type=i%7;

    if(type===0){
        obstacles.push({x,y:groundY()-55,w:55,h:55});
    }
    if(type===1){
        obstacles.push({x,y:groundY()-75,w:75,h:75});
    }
    if(type===2){
        obstacles.push({x,y:groundY()-45,w:120,h:45});
    }
    if(type===3){
        pads.push({x,y:groundY()-18,w:55,h:18,used:false});
    }
    if(type===4){
        portals.push({x,y:groundY()-100,w:30,h:100,mult:1.2});
    }
    if(type===5){
        obstacles.push({x,y:groundY()-45,w:45,h:45});
        obstacles.push({x:x+75,y:groundY()-70,w:45,h:70});
    }
    if(type===6){
        obstacles.push({x,y:groundY()-90,w:45,h:90});
    }

    if(i%2===0){
        coins.push({
            x:x+120,
            y:groundY()-130,
            r:10,
            collected:false
        });
    }
 }

 coins.push({
   x:total-180,
   y:groundY()-150,
   r:10,
   collected:false
 });
}

function startGame(index=null){
 if(index!==null) levelIndex=index;
 else{
    levelIndex=saveData.completed.length;
    if(levelIndex>=levels.length) levelIndex=levels.length-1;
 }
 if(levelIndex>0){
    for(let i=0;i<levelIndex;i++){
      if(!saveData.completed.includes(i)){
        levelIndex=i;
        break;
      }
    }
 }
 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";
 createLevel();
 running=true;
 paused=false;
 lastTime=performance.now();
 startMusic();
 requestAnimationFrame(loop);
}

function jump(){
 if(!running || paused)return;

 if(player.grounded){
    player.vy=-12;
    player.grounded=false;
    soundJump();
 }
}

document.addEventListener("keydown",e=>{
 if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){
    e.preventDefault();
    jump();
 }
 if(e.code==="Escape"){
    if(running) backHome();
 }
});

canvas.addEventListener("touchstart",e=>{
 e.preventDefault();
 jump();
},{passive:false});

canvas.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse")jump();
});

document.getElementById("mobileJump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 e.stopPropagation();
 jump();
});

function updatePhysics(dt){
 if(!running || paused)return;

 let level=levels[levelIndex];
 currentSpeed=Math.min(1.8,currentSpeed);

 let move=level[2]*currentSpeed*dt;
 cameraX+=move;
 player.x+=move;

 player.vy+=0.72*dt;
 player.y+=player.vy*dt;
 player.grounded=false;

 let gy=groundY()-player.h;

 if(player.y>=gy){
    player.y=gy;
    player.vy=0;
    player.grounded=true;
 }

 for(const pad of pads){
    if(pad.used)continue;

    if(
      player.x+player.w>pad.x &&
      player.x<pad.x+pad.w &&
      player.y+player.h>=pad.y &&
      player.y+player.h<=pad.y+25 &&
      player.vy>=0
    ){
      player.vy=-15;
      pad.used=true;
      soundPad();
    }
 }

 for(const portal of portals){
    if(
      player.x+player.w>portal.x &&
      player.x<portal.x+portal.w &&
      player.y+player.h>portal.y
    ){
      portal.x=-9999;
      currentSpeed=Math.min(1.8,currentSpeed*portal.mult);
      soundPortal();
    }
 }

 for(const ob of obstacles){
    if(rectHit(player,ob)){
      die();
      return;
    }
 }

 for(const c of coins){
    if(c.collected)continue;

    let dx=(player.x+player.w/2)-c.x;
    let dy=(player.y+player.h/2)-c.y;

    if(Math.sqrt(dx*dx+dy*dy)<30){
      c.collected=true;
      levelCoins++;
      saveData.coins++;
      save();
      soundCoin();
      burst(c.x-cameraX,c.y);
    }
 }

 if(player.y>H+100){
    die();
    return;
 }

 levelTime+=dt;
 let percent=Math.min(100,Math.floor((cameraX/(level[3]))*100));
 document.getElementById("progressText").textContent=percent+"%";
 document.getElementById("runCoins").textContent=levelCoins;

 if(cameraX>=level[3]){
    winLevel();
 }

 player.blink+=dt;
 if(player.blink>170){
    player.blink=0;
 }
}

function rectHit(a,b){
 return a.x<a.x+a.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y;
}

function die(){
 if(!running)return;

 running=false;
 soundDie();

 if(saveData.settings.vibration && navigator.vibrate)
    navigator.vibrate([80,50,120]);

 showToast("💥 Próba nieudana!");

 setTimeout(()=>{
   if(confirm("Poziom nieukończony. Spróbować ponownie?")){
      startGame(levelIndex);
   }else{
      backHome();
   }
 },300);
}

function winLevel(){
 if(!running)return;

 running=false;

 if(!saveData.completed.includes(levelIndex))
    saveData.completed.push(levelIndex);

 checkAchievements();
 save();

 soundWin();
 makeConfetti();

 setTimeout(()=>{
   let next=levelIndex+1;

   if(next<levels.length){
      if(confirm(
        "🎉 Poziom ukończony!\n\nPrzejść do następnego poziomu?"
      )){
        startGame(next);
      }else{
        backHome();
      }
   }else{
      alert("🏆 Ukończyłeś wszystkie 18 poziomów!");
      backHome();
   }
 },700);
}

function loop(t){
 if(!running)return;

 let dt=Math.min(2,(t-lastTime)/16.67);
 lastTime=t;

 updatePhysics(dt);
 draw();

 if(running)
   requestAnimationFrame(loop);
}

function draw(){
 ctx.clearRect(0,0,W,H);

 drawBackground();

 ctx.save();

 if(shake>0){
   ctx.translate(
     (Math.random()-.5)*shake,
     (Math.random()-.5)*shake
   );
   shake*=.88;
 }

 let offset=cameraX;

 drawGround(offset);

 for(const c of coins){
   if(!c.collected) drawCoin(c.x-offset,c.y);
 }

 for(const ob of obstacles){
   drawObstacle(ob.x-offset,ob.y,ob.w,ob.h);
 }

 for(const pad of pads){
   drawPad(pad.x-offset,pad.y,pad.w,pad.h);
 }

 for(const portal of portals){
   if(portal.x>-100)
      drawPortal(portal.x-offset,portal.y,portal.w,portal.h);
 }

 drawPlayer();

 drawParticles();

 ctx.restore();

 drawConfetti();
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#050522");
 g.addColorStop(1,"#10051a");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.globalAlpha=.2;
 for(let x=0;x<W;x+=70){
   ctx.fillStyle="#00ffff";
   ctx.fillRect(x,(x*3)%H,2,2);
 }
 ctx.globalAlpha=1;
}

function drawGround(offset){
 let gy=groundY();

 ctx.fillStyle="#101020";
 ctx.fillRect(0,gy,W,H-gy);

 ctx.strokeStyle=levels[levelIndex][1];
 ctx.shadowBlur=12;
 ctx.shadowColor=levels[levelIndex][1];
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(0,gy);
 ctx.lineTo(W,gy);
 ctx.stroke();
 ctx.shadowBlur=0;

 let start=-(offset%50);
 for(let x=start;x<W;x+=50){
   ctx.fillStyle="#222244";
   ctx.fillRect(x,gy+20,25,3);
 }
}

function drawPlayer(){
 let s=skins[saveData.selectedSkin];
 let x=player.x-cameraX;
 let y=player.y;

 ctx.save();

 ctx.shadowBlur=20;
 ctx.shadowColor=s.color;
 ctx.fillStyle=s.color;
 ctx.fillRect(x,y,player.w,player.h);

 ctx.shadowBlur=0;

 ctx.fillStyle="#111";
 ctx.fillRect(x+8,y+9,7,7);
 ctx.fillRect(x+24,y+9,7,7);

 if(player.blink>150){
   ctx.fillStyle=s.color;
   ctx.fillRect(x+7,y+8,9,8);
   ctx.fillRect(x+23,y+8,9,8);
 }

 ctx.fillStyle="#111";
 ctx.fillRect(x+11,y+27,17,4);

 ctx.strokeStyle="#fff";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(x+5,y+player.h);
 ctx.lineTo(x+1,y+player.h+8);
 ctx.moveTo(x+33,y+player.h);
 ctx.lineTo(x+37,y+player.h+8);
 ctx.stroke();

 ctx.restore();
}

function drawObstacle(x,y,w,h){
 ctx.save();
 ctx.fillStyle="#ff1744";
 ctx.shadowBlur=15;
 ctx.shadowColor="#ff1744";
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#111";
 ctx.fillRect(x+6,y+6,w-12,5);

 ctx.restore();
}

function drawPad(x,y,w,h){
 ctx.save();
 ctx.fillStyle="#ffe600";
 ctx.shadowBlur=20;
 ctx.shadowColor="#ffe600";
 ctx.fillRect(x,y,w,h);
 ctx.restore();
}

function drawPortal(x,y,w,h){
 ctx.save();
 ctx.strokeStyle="#00ff88";
 ctx.lineWidth=4;
 ctx.shadowBlur=20;
 ctx.shadowColor="#00ff88";

 ctx.beginPath();
 ctx.arc(x+w/2,y+h/2,25,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x+8,y+h/2);
 ctx.lineTo(x+w-8,y+h/2);
 ctx.stroke();

 ctx.restore();
}

function drawCoin(x,y){
 ctx.save();
 ctx.fillStyle="#ffd700";
 ctx.shadowBlur=18;
 ctx.shadowColor="#ffd700";
 ctx.beginPath();
 ctx.arc(x,y,10,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#fff4a0";
 ctx.beginPath();
 ctx.arc(x-3,y-3,3,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function burst(x,y){
 if(!saveData.settings.effects)return;

 for(let i=0;i<12;i++){
   particles.push({
     x,y,
     vx:(Math.random()-.5)*6,
     vy:(Math.random()-.5)*6,
     life:30
   });
 }
}

function drawParticles(){
 for(let i=particles.length-1;i>=0;i--){
   let p=particles[i];

   p.x+=p.vx;
   p.y+=p.vy;
   p.life--;

   ctx.globalAlpha=Math.max(0,p.life/30);
   ctx.fillStyle="#00ffff";
   ctx.fillRect(p.x,p.y,4,4);

   if(p.life<=0)particles.splice(i,1);
 }

 ctx.globalAlpha=1;
}

function makeConfetti(){
 if(!saveData.settings.effects)return;

 confetti=[];

 for(let i=0;i<80;i++){
   confetti.push({
     x:Math.random()*W,
     y:-Math.random()*H,
     s:4+Math.random()*8,
     v:2+Math.random()*4,
     r:Math.random()*Math.PI
   });
 }
}

function drawConfetti(){
 for(const c of confetti){
   c.y+=c.v;
   c.r+=.08;

   ctx.save();
   ctx.translate(c.x,c.y);
   ctx.rotate(c.r);
   ctx.fillStyle=["#00ffff","#ff00ff","#ffff00","#55ff55","#ff5555"][
      Math.floor(Math.random()*5)
   ];
   ctx.fillRect(0,0,c.s,c.s);
   ctx.restore();
 }
}

function buySkin(i){
 let s=skins[i];

 if(saveData.ownedSkins.includes(i)){
   saveData.selectedSkin=i;
   save();
   renderShop();
   showToast("🎨 Wybrano skin: "+s.name);
   return;
 }

 if(saveData.coins<s.price){
   showToast("❌ Za mało monet!");
   return;
 }

 saveData.coins-=s.price;
 saveData.ownedSkins.push(i);
 saveData.selectedSkin=i;

 renderShop();

}

/* =========================
   AUDIO / MUZYKA
========================= */

let audioCtx=null;
let musicTimer=null;
let musicStep=0;

function getAudio(){
 if(!audioCtx){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx;
}

function tone(freq,duration,type="square",volume=.04){
 if(!saveData.settings.sound)return;

 let a=getAudio();
 let o=a.createOscillator();
 let g=a.createGain();

 o.type=type;
 o.frequency.value=freq;
 g.gain.value=volume;

 o.connect(g);
 g.connect(a.destination);

 let now=a.currentTime;
 g.gain.setValueAtTime(volume,now);
 g.gain.exponentialRampToValueAtTime(.001,now+duration);

 o.start(now);
 o.stop(now+duration);
}

function soundJump(){tone(520,.08,"square",.05)}
function soundCoin(){tone(880,.08,"triangle",.06)}
function soundPad(){tone(330,.15,"sawtooth",.04)}
function soundPortal(){
 tone(700,.08,"sine",.04);
 setTimeout(()=>tone(1000,.08,"sine",.03),60);
}
function soundDie(){tone(120,.35,"sawtooth",.05)}
function soundWin(){
 tone(523,.12,"square",.05);
 setTimeout(()=>tone(659,.12,"square",.05),120);
 setTimeout(()=>tone(784,.25,"square",.05),240);
}

const melody=[
  261.63,329.63,392.00,329.63,
  293.66,349.23,440.00,349.23,
  261.63,329.63,392.00,523.25
];

function playMusicNote(){
 if(!saveData.settings.music || !running)return;

 let freq=melody[musicStep%melody.length];
 musicStep++;

 let a=getAudio();
 let o=a.createOscillator();
 let g=a.createGain();

 o.type="triangle";
 o.frequency.value=freq;

 g.gain.setValueAtTime(.018,a.currentTime);
 g.gain.exponentialRampToValueAtTime(
   .001,
   a.currentTime+.18
 );

 o.connect(g);
 g.connect(a.destination);

 o.start();
 o.stop(a.currentTime+.19);
}

function startMusic(){
 if(!saveData.settings.music)return;

 getAudio();

 if(musicTimer)return;

 musicStep=0;
 playMusicNote();

 musicTimer=setInterval(()=>{
   playMusicNote();
 },220);
}

function stopMusic(){
 if(musicTimer){
   clearInterval(musicTimer);
   musicTimer=null;
 }
}

/* Start music after first user interaction */
document.addEventListener("pointerdown",()=>{
 if(running && saveData.settings.music)
   startMusic();
},{once:false});
