<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03030a;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:#fff;
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

button:focus-visible{
  outline:2px solid #00eaff;
  outline-offset:2px;
}

/* =====================================================
   MENU
===================================================== */

#menu{
  position:fixed;
  inset:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    max(30px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 5%,#252b78,#090a20 45%,#020207);
  z-index:50;
}

.logo{
  margin:12px 0 4px;
  font-size:clamp(30px,7vw,54px);
  font-weight:900;
  letter-spacing:clamp(2px,1vw,6px);
  text-align:center;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 45px #a855ff;
}

.subtitle{
  text-align:center;
  opacity:.7;
  font-size:clamp(13px,3vw,17px);
  margin-bottom:18px;
}

.progress{
  width:min(680px,100%);
  background:#11152d;
  border:2px solid #303963;
  border-radius:17px;
  padding:15px;
  margin-bottom:15px;
}

.progressTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:bold;
}

.bar{
  height:13px;
  background:#050712;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

#menuBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 14px #00eaff;
  transition:.4s;
}

#doneText{
  text-align:center;
  opacity:.65;
  margin-top:7px;
}

#levels{
  width:min(680px,100%);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.level{
  min-width:0;
  min-height:82px;
  text-align:left;
  padding:12px;
  border-radius:15px;
  border:2px solid #303861;
  background:linear-gradient(135deg,#171c3b,#0d1024);
  position:relative;
  overflow:hidden;
  transition:
    transform .1s,
    border-color .1s,
    box-shadow .15s;
}

.level:hover{
  border-color:#00eaff;
  box-shadow:0 0 18px #00eaff22;
}

.level:active{
  transform:scale(.96);
}

.levelStatus{
  float:right;
  font-size:20px;
}

.levelName{
  font-weight:900;
  font-size:clamp(14px,3.5vw,18px);
  padding-right:25px;
}

.levelInfo{
  font-size:12px;
  opacity:.7;
  margin-top:5px;
}

#achBtn{
  width:min(680px,100%);
  min-height:48px;
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:#242a50;
  border:2px solid #414d7c;
  font-weight:bold;
}

/* =====================================================
   PANELE
===================================================== */

#achievements,
#pause,
#finish{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:15px;
}

.panel{
  width:min(570px,100%);
  max-height:min(90vh,700px);
  overflow:auto;
  background:#10142c;
  border:2px solid #3d4a7d;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 40px #00eaff22;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

.panel button{
  width:100%;
  min-height:46px;
  margin-top:9px;
  padding:12px;
  border-radius:12px;
  background:#29335e;
  font-weight:bold;
}

.panel button:hover{
  background:#34416f;
}

.ach{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:#191e3b;
  opacity:.4;
}

.ach.on{
  opacity:1;
  border:1px solid #00eaff;
  box-shadow:0 0 12px #00eaff18;
}

/* =====================================================
   GRA
===================================================== */

#game{
  position:fixed;
  inset:0;
  display:none;
  touch-action:none;
  overscroll-behavior:none;
}

canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:4;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

.hudLine{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(12px,2.8vw,17px);
  font-weight:bold;
}

.hudBar{
  margin-top:7px;
  height:9px;
  background:#0008;
  border-radius:20px;
  overflow:hidden;
}

#gameBar{
  height:100%;
  width:0;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
  transition:width .08s linear;
}

.gameButtons{
  position:absolute;
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  z-index:10;
  display:flex;
  gap:7px;
}

.gameButtons button{
  min-width:44px;
  min-height:44px;
  padding:8px 11px;
  background:#10162ddd;
  border:1px solid #53618e;
  border-radius:10px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px){
  #levels{
    grid-template-columns:1fr;
  }
}

@media(min-width:1000px){
  #levels{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-height:500px){
  .logo{
    margin:4px 0;
    font-size:30px;
  }

  .subtitle{
    margin-bottom:8px;
  }

  .progress{
    padding:9px;
    margin-bottom:8px;
  }

  .level{
    min-height:65px;
  }

  #achBtn{
    margin-top:8px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

  <div class="logo">NEON DASH</div>

  <div class="subtitle">
    Ultimate Edition • Dotknij / kliknij / SPACJA
  </div>

  <div class="progress">
    <div class="progressTop">
      <span>📊 PROGRES GRY</span>
      <span id="progressText">0%</span>
    </div>

    <div class="bar">
      <div id="menuBar"></div>
    </div>

    <div id="doneText">0 / 12 poziomów</div>
  </div>

  <div id="levels"></div>

  <button id="achBtn">🏆 ACHIEVEMENTY</button>

</div>

<!-- =====================================================
     ACHIEVEMENTY
===================================================== -->

<div id="achievements">
  <div class="panel">

    <h2>🏆 ACHIEVEMENTY</h2>

    <div id="achList"></div>

    <button id="closeAch">ZAMKNIJ</button>

  </div>
</div>

<!-- =====================================================
     GRA
===================================================== -->

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">

    <div class="hudLine">

      <span id="coins">🪙 0/3</span>

    </div>

    <div class="hudBar">

    </div>

  </div>

  <div class="gameButtons">
    <button id="pauseBtn" aria-label="Pauza">⏸</button>
    <button id="soundBtn" aria-label="Dźwięk">🔊</button>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>

  <!-- PAUZA -->

      <h2>⏸ PAUZA</h2>

</div>

/* =====================================================
   DOM
===================================================== */

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const levelsBox = document.getElementById("levels");
const achievements = document.getElementById("achievements");
const achList = document.getElementById("achList");

const pause = document.getElementById("pause");
const finish = document.getElementById("finish");

const levelName = document.getElementById("levelName");
const coinsText = document.getElementById("coins");
const percent = document.getElementById("percent");

const gameBar = document.getElementById("gameBar");

const progressText = document.getElementById("progressText");
const doneText = document.getElementById("doneText");

/* =====================================================
   STORAGE
===================================================== */

function get(key,def){

  try{
    const value = localStorage.getItem(key);

    return value === null
      ? def
      : value;

  }catch(e){

    return def;
  }
}

function set(key,value){

  try{
    localStorage.setItem(
      key,
      String(value)
    );
  }catch(e){}
}

function completed(index){

  return get(
    "nd_level_"+index,
    "0"
  ) === "1";
}

function completedCount(){

  let total = 0;

  for(
    let i=0;
    i<LEVELS.length;
    i++
  ){

    if(completed(i))
      total++;
  }

  return total;
}

/* =====================================================
   ACHIEVEMENTY
===================================================== */

const ACH = [
  [
    "first",
    "🎮 Pierwszy krok",
    "Ukończ poziom 1."
  ],
  [
    "three",

  ],
  [

    "Ukończ 6 poziomów."
  ],

    "Ukończ wszystkie poziomy."
  ],
  [
    "final",

    "Ukończ FINAL CHAOS."
  ],
  [
    "coins10",

    "Zbierz 10 monet."
  ],
  [

  ],
  [
    "perfect",

    "Ukończ poziom bez śmierci."
  ],
  [
    "survivor",

    "Ukończ poziom po 3+ śmierciach."
  ],
  [
    "allcoins",
    "🌟 Pełna kolekcja",
    "Zbierz wszystkie 3 monety."
  ]
];

function achUnlocked(id){

  return get(
    "nd_ach_"+id,
    "0"
  ) === "1";
}

function unlock(id){

  if(achUnlocked(id))
    return;

  set(
    "nd_ach_"+id,
    "1"
  );

  renderAchievements();
}

function checkAchievements(){

  const count =
    completedCount();

  if(count>=1)
    unlock("first");

  if(count>=3)
    unlock("three");

  if(count>=6)
    unlock("six");

  if(count>=LEVELS.length)
    unlock("all");

  if(completed(LEVELS.length-1))
    unlock("final");

  const totalCoins =
    Number(
      get("nd_totalCoins","0")
    );

  if(totalCoins>=10)
    unlock("coins10");

  if(totalCoins>=25)
    unlock("coins25");

  if(deaths===0)
    unlock("perfect");

  if(deaths>=3)
    unlock("survivor");

  if(runCoins===3)
    unlock("allcoins");
}

function renderAchievements(){

  achList.innerHTML="";

  ACH.forEach(a=>{

    const div =
      document.createElement("div");

    div.className =
      "ach"+
      (
        achUnlocked(a[0])
        ? " on"
        : ""
      );

    div.innerHTML =
      "<b>"+a[1]+"</b><br>"+
      "<small>"+a[2]+"</small>";

    achList.appendChild(div);
  });
}

/* =====================================================
   MENU
===================================================== */

function renderMenu(){

  levelsBox.innerHTML="";

  LEVELS.forEach((level,index)=>{

    const button =
      document.createElement("button");

    button.type="button";
    button.className="level";

    button.innerHTML =
      '<span class="levelStatus">'+
      (
        completed(index)
        ? "✅"
        : "▶️"
      )+
      '</span>'+
      '<div class="levelName">'+
      (index+1)+". "+
      level.name+
      '</div>'+
      '<div class="levelInfo">'+
      level.diff+
      " • "+
      level.speed+
      " px/s"+
      '</div>';

    button.addEventListener(
      "click",
      async event=>{

        event.preventDefault();
        event.stopPropagation();

        await startLevel(
          index,
          true,
          true
        );
      }
    );

    levelsBox.appendChild(button);
  });

  const done =
    completedCount();

  const progress =
    Math.round(
      done/
      LEVELS.length*
      100
    );

  progressText.textContent =
    progress+"%";

  menuBar.style.width =
    progress+"%";

  doneText.textContent =
    done+
    " / "+
    LEVELS.length+
    " poziomów";
}

document
  .getElementById("achBtn")
  .addEventListener(
    "click",
    ()=>{
      achievements.style.display="flex";
      renderAchievements();
    }
  );

document
  .getElementById("closeAch")
  .addEventListener(
    "click",
    ()=>{
      achievements.style.display="none";
    }

/* =====================================================
   CANVAS
===================================================== */

let W = window.innerWidth;
let H = window.innerHeight;
let ground = H*.78;

function resize(){

  W =
    Math.max(
      240,
      window.innerWidth
    );

  H =
    Math.max(
      240,
      window.innerHeight
    );

  const d =
    Math.min(
      Math.max(
        window.devicePixelRatio||1,
        1
      ),
      2
    );

  canvas.width =
    Math.round(W*d);

  canvas.height =
    Math.round(H*d);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );

  ground =
    Math.max(
      160,
      Math.min(
        H-55,
        H*.78
      )
    );

  if(!running){
    resetPlayer();
  }

  createStars();
}

window.addEventListener(
  "resize",
  resize,
  {passive:true}
);

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      resize,
      100
    );
  },
  {passive:true}
);

/* =====================================================
   GAME STATE
===================================================== */

let current = 0;

let running = false;
let paused = false;
let finished = false;
let dying = false;

let world = 0;
let last = 0;
let raf = 0;

let deaths = 0;
let runCoins = 0;

let collected = new Set();

let obstacles = [];
let coinObjects = [];
let pads = [];
let portals = [];
let particles = [];
let stars = [];
let trail = [];

let shake = 0;
let flash = 0;

let gravityDirection = 1;

/* =====================================================
   PLAYER
===================================================== */

const player = {
  x:150,
  y:0,
  size:34,
  vy:0,
  rot:0,
  grounded:false
};

function resetPlayer(){

  player.x =
    Math.max(
      80,
      Math.min(
        180,
        W*.22
      )
    );

  player.y =
    gravityDirection===1
      ? ground-player.size
      : 0;

  player.vy=0;
  player.rot=0;
  player.grounded=true;
}

/* =====================================================
   AUDIO
===================================================== */

let audio = null;
let musicTimer = null;
let musicIndex = 0;

let sound =
  get(
    "nd_sound",
    "1"
  ) === "1";

function initAudio(){

  try{

    if(audio)
      return true;

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return false;

    audio =
      new AudioContext();

    return true;

  }catch(error){

    console.warn(
      "Audio niedostępne:",
      error
    );

    return false;
  }
}

async function unlockAudio(){

  if(!initAudio())
    return false;

  try{

    if(
      audio.state==="suspended"||
      audio.state==="interrupted"
    ){
      await audio.resume();
    }

    return (
      audio.state==="running"
    );

  }catch(error){

    return false;
  }
}

function playTone(
  frequency,
  duration=.1,
  type="square",
  volume=.04
){

  if(
    !audio||
    !sound||
    audio.state!=="running"
  ){
    return;
  }

  try{

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.type=type;

    oscillator.frequency.setValueAtTime(
      frequency,
      audio.currentTime
    );

    gain.gain.setValueAtTime(
      0.0001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      audio.currentTime+.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audio.currentTime+
      Math.max(
        duration,
        .03
      )
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime+
      duration+
      .03
    );

  }catch(e){}
}

function startMusic(){

  stopMusic();

  if(
    !sound||
    !audio||
    audio.state!=="running"||
    !running||
    paused
  ){
    return;
  }

  const level =
    LEVELS[current];

  musicIndex=0;

  const note = ()=>{

    if(
      !sound||
      !audio||
      audio.state!=="running"||
      !running||
      paused
    ){
      return;
    }

    const frequency =
      level.notes[
        musicIndex%
        level.notes.length
      ];

    playTone(
      frequency,
      .15,
      level.wave,
      .035
    );

    musicIndex++;
  };

  note();

  musicTimer =
    setInterval(
      note,
      Math.max(
        80,
        60000/level.bpm
      )
    );
}

function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}

function playJumpSound(){

  playTone(
    520,
    .08,
    "square",
    .07
  );
}

function playCoinSound(){

  playTone(
    880,
    .1,
    "triangle",
    .07
  );

  setTimeout(
    ()=>{
      playTone(
        1320,
        .12,
        "triangle",
        .055
      );
    },
    70
  );
}

function playDeathSound(){

  playTone(
    100,
    .25,
    "sawtooth",
    .08
  );
}

/* =====================================================
   START LEVEL
===================================================== */

async function startLevel(
  index,
  newRun=true,
  fromUserGesture=false
){

  if(
    index<0||
    index>=LEVELS.length
  ){
    return;
  }

  if(fromUserGesture){
    await unlockAudio();
  }

  current=index;

  if(newRun){

    deaths=0;
    runCoins=0;
    collected =
      new Set();
  }

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){

    cancelAnimationFrame(
      raf
    );

    raf=0;
  }

  stopMusic();

  game.style.display="block";
  menu.style.display="none";

  pause.style.display="none";
  finish.style.display="none";

  world=0;
  last=performance.now();

  particles=[];
  trail=[];

  shake=0;
  flash=0;

  gravityDirection =
    LEVELS[current].gravity;

  resetPlayer();

  generateLevel();
  createStars();

  levelName.textContent =
    (current+1)+
    " • "+
    LEVELS[current].name;

  coinsText.textContent =
    "🪙 "+
    runCoins+
    "/3";

  percent.textContent="0%";
  gameBar.style.width="0%";

  running=true;

  draw();

  raf =
    requestAnimationFrame(
      loop
    );

  if(
    sound&&
    audio&&
    audio.state==="running"
  ){
    startMusic();
  }
}

/* =====================================================
   GENEROWANIE POZIOMU
===================================================== */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];

  const length =
    11500+
    current*600;

  let x=650;
  let patternIndex=0;

  const patterns=[
    "spike",
    "double",
    "saw",
    "gap",
    "pad",
    "spike",
    "saw",
    "speed",
    "double",
    "gap",
    "spikeSaw",
    "gravity",
    "triple",
    "saw"
  ];

  while(x<length){

    const type =
      patterns[
        patternIndex%
        patterns.length
      ];

    if(type==="spike"){

      spike(x);
      x+=430;

    }else if(type==="double"){

      spike(x);
      spike(x+65);
      x+=520;

    }else if(type==="triple"){

      spike(x);
      spike(x+65);
      spike(x+130);
      x+=610;

    }else if(type==="saw"){

      saw(x);
      x+=520;

    }else if(type==="spikeSaw"){

      spike(x);
      saw(x+230);
      x+=650;

    }else if(type==="gap"){

      gap(x,150);
      x+=630;

    }else if(type==="pad"){

      pad(x);
      spike(x+190);
      x+=600;

    }else if(type==="speed"){

      speedPortal(
        x,
        1.18
      );

      spike(x+250);
      saw(x+480);

      x+=760;

    }else if(type==="gravity"){

      gravityPortal(x);

      spike(x+280);
      spike(x+345);

      x+=720;
    }

    patternIndex++;
  }

  const coinPositions=[
    length*.25,
    length*.52,
    length*.79
  ];

  coinPositions.forEach(
    (originalX,index)=>{

      let coinX =
        originalX;

      for(
        let attempt=0;
        attempt<40;
        attempt++
      ){

        let bad=false;

        for(
          const obstacle
          of obstacles
        ){

          if(
            obstacle.type==="gap"
          ){

            if(
              coinX>
                obstacle.x-100&&
              coinX<
                obstacle.x+
                obstacle.w+
                100
            ){
              bad=true;
              break;
            }

          }else{

            if(
              Math.abs(
                coinX-
                obstacle.x
              )<120
            ){
              bad=true;
              break;
            }
          }
        }

        if(!bad)
          break;

        coinX+=120;
      }

      coinObjects.push({
        id:index,
        x:coinX,
        collected:
          collected.has(index)
      });
    }
  );
}

/* =====================================================
   OBIEKTY
===================================================== */

function spike(x){

  obstacles.push({
    type:"spike",
    x
  });
}

function saw(x){

  obstacles.push({
    type:"saw",
    x,
    r:28
  });
}

function gap(x,w){

  obstacles.push({
    type:"gap",
    x,
    w
  });
}

function pad(x){

  pads.push({
    x,
    used:false
  });
}

function speedPortal(x,mult){

  portals.push({
    type:"speed",
    x,
    mult,
    used:false
  });
}

function gravityPortal(x){

  portals.push({
    type:"gravity",
    x,
    used:false
  });
}

/* =====================================================
   STEROWANIE
===================================================== */

function jump(){

  if(
    !running||
    paused||
    dying||
    finished
  ){
    return;
  }

  if(player.grounded){

    player.vy =
      -730*
      gravityDirection;

    player.grounded=false;

    particlesJump();

    playJumpSound();

    shake=3;
  }
}

game.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest(".gameButtons")||
      event.target.closest("#pause")||
      event.target.closest("#finish")
    ){
      return;
    }

    jump();
  },
  {passive:true}
);

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.code==="Space"||
      event.code==="ArrowUp"||
      event.code==="KeyW"
    ){

      event.preventDefault();

      jump();
    }

    if(
      event.code==="Escape"||
      event.code==="KeyP"
    ){

      if(running){
        togglePause();
      }
    }
  }
);

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  const level =
    LEVELS[current];

  let speed =
    level.speed;

  for(
    const portal
    of portals
  ){

    if(
      portal.type==="speed"&&
      world+player.x>
        portal.x&&
      world+player.x<
        portal.x+180
    ){

      speed *=
        portal.mult;
    }
  }

  world +=
    speed*dt;

  const gravity =
    2100*
    gravityDirection;

  player.vy +=
    gravity*dt;

  player.y +=
    player.vy*dt;

  if(
    gravityDirection===1
  ){

    const floor =
      ground-
      player.size;

    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot =
        Math.round(
          player.rot/
          (Math.PI/2)
        )*
        (Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8;
    }

  }else{

    const ceiling=0;

    if(
      player.y<=ceiling&&
      !gapUnder()
    ){

      player.y=ceiling;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;
    }
  }

  checkPads();
  checkPortals();
  checkCoins();
  collisions();

  if(
    Math.random()<.9
  ){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.35,
      size:18
    });
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){

    shake-=dt*13;

    if(shake<0)
      shake=0;
  }

  if(flash>0){

    flash-=dt*3;

    if(flash<0)
      flash=0;
  }
}

function gapUnder(){

  const center =
    world+
    player.x+
    player.size/2;

  for(
    const obstacle
    of obstacles
  ){

    if(
      obstacle.type==="gap"&&
      center>obstacle.x&&
      center<
        obstacle.x+
        obstacle.w
    ){
      return true;
    }
  }

  return false;
}

/* =====================================================
   PADY
===================================================== */

function checkPads(){

  for(
    const padObject
    of pads
  ){

    if(padObject.used)
      continue;

    const px =
      world+
      player.x+
      17;

    if(
      px>padObject.x&&
      px<padObject.x+50&&
      player.grounded
    ){

      padObject.used=true;

      player.vy =
        -1000*
        gravityDirection;

      player.grounded=false;

      particlesPad(
        padObject.x-world
      );

      shake=5;
    }
  }
}

/* =====================================================
   PORTALE
===================================================== */

function checkPortals(){

  for(
    const portal
    of portals
  ){

    if(portal.used)
      continue;

    const px =
      world+
      player.x+
      17;

    if(
      px>portal.x&&
      px<portal.x+55
    ){

      portal.used=true;

      if(
        portal.type==="gravity"
      ){

        gravityDirection *= -1;

        particlesPortal(
          portal.x-world
        );

        player.vy=0;
        player.grounded=false;

        shake=7;
      }
    }
  }
}

/* =====================================================
   MONETY
===================================================== */

function checkCoins(){

  for(
    const coin
    of coinObjects
  ){

    if(coin.collected)
      continue;

    const x =
      coin.x-world;

    const y =
      gravityDirection===1
        ? ground-125
        : 125;

    const px =
      player.x+17;

    const py =
      player.y+17;

    if(
      Math.hypot(
        px-x,
        py-y
      )<35
    ){

      coin.collected=true;

      collected.add(
        coin.id
      );

      runCoins =
        collected.size;

      coinsText.textContent =
        "🪙 "+
        runCoins+
        "/3";

      particlesCoin(
        x,
        y
      );

      playCoinSound();

      shake=3;
    }
  }
}

/* =====================================================
   KOLIZJE
===================================================== */

function collisions(){

  const px =
    world+
    player.x;

  const size =
    player.size;

  const left =
    px+6;

  const right =
    px+size-6;

  const top =
    player.y+6;

  const bottom =
    player.y+
    size-5;

  for(
    const obstacle
    of obstacles
  ){

    if(
      obstacle.type==="spike"
    ){

      if(
        gravityDirection===1&&
        right>obstacle.x+7&&
        left<obstacle.x+44&&
        bottom>ground-48
      ){

        die();
        return;
      }

      if(
        gravityDirection===-1&&
        right>obstacle.x+7&&
        left<obstacle.x+44&&
        top<48
      ){

        die();
        return;
      }
    }

    if(
      obstacle.type==="saw"
    ){

      const cx =
        obstacle.x;

      const cy =
        gravityDirection===1
          ? ground-obstacle.r
          : obstacle.r;

      const nearestX =
        Math.max(
          left,
          Math.min(
            cx,
            right
          )
        );

      const nearestY =
        Math.max(
          top,
          Math.min(
            cy,
            bottom
          )
        );

      const dx =
        cx-nearestX;

      const dy =
        cy-nearestY;

      if(
        dx*dx+
        dy*dy<
        Math.pow(
          obstacle.r-5,
          2
        )
      ){

        die();
        return;
      }
    }

    if(
      obstacle.type==="gap"
    ){

      const center =
        world+
        player.x+
        size/2;

      if(
        gravityDirection===1&&
        center>obstacle.x&&
        center<
          obstacle.x+
          obstacle.w&&
        bottom>=ground-8
      ){

        die();
        return;
      }
    }
  }

  /*
    Dodatkowa ochrona przed wypadnięciem
    poza ekran.
  */

  if(
    player.y>H+100||
    player.y+size<-100
  ){

    die();
  }
}

/* =====================================================
   ŚMIERĆ
===================================================== */

function die(){

  if(
    dying||
    finished||
    !running
  ){
    return;
  }

  dying=true;
  deaths++;

  running=false;

  shake=14;
  flash=1;

  playDeathSound();
  particlesDeath();

  setTimeout(
    ()=>{

      if(
        !dying||
        finished
      ){
        return;
      }

      dying=false;

      startLevel(
        current,
        false,
        false
      );
    },
    650
  );
}

/* =====================================================
   WIN
===================================================== */

function checkWin(){

  const length =
    11500+
    current*600;

  if(world>=length){

    finishLevel();
  }
}

function finishLevel(){

  if(finished)
    return;

  finished=true;
  running=false;

  stopMusic();

  set(
    "nd_level_"+current,
    "1"
  );

  const oldCoins =
    Number(
      get(
        "nd_totalCoins",
        "0"
      )
    );

  set(
    "nd_totalCoins",
    oldCoins+
    runCoins
  );

  checkAchievements();

  particlesWin();

  document.getElementById(
    "finishTitle"
  ).textContent =
    "🎉 POZIOM UKOŃCZONY!";

  document.getElementById(
    "finishInfo"
  ).textContent =
    LEVELS[current].name+
    " • 🪙 "+
    runCoins+
    "/3"+
    " • ☠️ "+
    deaths+
    " śmierci";

  finish.style.display="flex";

  renderMenu();

  victoryAnimation();
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(
    !running&&
    !finished
  ){
    return;
  }

  if(paused){

    last=time;

    raf =
      requestAnimationFrame(
        loop
      );

    return;
  }

  let dt =
    (time-last)/1000;

  if(
    !Number.isFinite(dt)||
    dt<0
  ){
    dt=0;
  }

  dt =
    Math.min(
      dt,
      .05
    );

  last=time;

  if(running){

    update(dt);
    draw();
    checkWin();
  }

  if(running){

    raf =
      requestAnimationFrame(
        loop
      );
  }
}

/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

  const level =
    LEVELS[current];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*
        shake,
      (Math.random()-.5)*
        shake
    );
  }

  /* TŁO */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#080b20"
  );

  gradient.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  drawStars();
  drawGrid();
  drawSpeedLines();

  /* ZIEMIA */

  ctx.fillStyle="#0b0d18";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle =
    level.color;

  ctx.lineWidth=3;

  ctx.shadowColor =
    level.color;

  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  /* PRZESZKODY */

  for(
    const obstacle
    of obstacles
  ){

    const x =
      obstacle.x-world;

    if(
      x<-150||
      x>W+150
    ){
      continue;
    }

    if(
      obstacle.type==="spike"
    ){
      drawSpike(x);
    }

    if(
      obstacle.type==="saw"
    ){
      drawSaw(
        x,
        obstacle.r
      );
    }

    if(
      obstacle.type==="gap"
    ){

      ctx.fillStyle="#020207";

      ctx.fillRect(
        x,
        ground,
        obstacle.w,
        H-ground
      );
    }
  }

  /* PADY */

  for(
    const padObject
    of pads
  ){

    const x =
      padObject.x-world;

    if(
      x>-80&&
      x<W+80
    ){

      drawPad(x);
    }
  }

  /* PORTALE */

  for(
    const portal
    of portals
  ){

    const x =
      portal.x-world;

    if(
      x>-100&&
      x<W+100
    ){

      if(
        portal.type==="speed"
      ){

        drawSpeedPortal(x);

      }else{

        drawGravityPortal(x);
      }
    }
  }

  /* MONETY */

  for(
    const coin
    of coinObjects
  ){

    if(coin.collected)
      continue;

    const x =
      coin.x-world;

    if(
      x>-50&&
      x<W+50
    ){

      drawCoin(
        x,
        gravityDirection===1
          ? ground-125
          : 125
      );
    }
  }

  drawTrail();

  if(
    !dying&&
    !finished
  ){

    drawPlayer();
  }

  drawParticles();

  if(flash>0){

    ctx.fillStyle =
      "rgba(255,255,255,"+
      Math.min(
        .5,
        flash*.5
      )+
      ")";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }

  ctx.restore();

  const length =
    11500+
    current*600;

  const progress =
    Math.min(
      100,
      Math.floor(
        world/
        length*
        100
      )
    );

  percent.textContent =
    progress+"%";

  gameBar.style.width =
    progress+"%";
}

/* =====================================================
   PLAYER
===================================================== */

let nextBlink =
  performance.now()+3000;

let blinkUntil=0;

function updateBlink(){

  const now =
    performance.now();

  if(now>=nextBlink){

    blinkUntil =
      now+120;

    nextBlink =
      now+
      2500+
      Math.random()*3000;
  }
}

function drawPlayer(){

  updateBlink();

  const color =
    LEVELS[current].color;

  const now =
    performance.now();

  const blinking =
    now<blinkUntil;

  ctx.save();

  ctx.translate(
    player.x+17,
    player.y+17
  );

  ctx.rotate(
    player.rot
  );

  /* KWADRAT */

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.fillStyle=color;

  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );

  ctx.shadowBlur=0;

  /* OCZY */

  ctx.fillStyle="#050510";

  if(blinking){

    ctx.fillRect(
      -11,
      -4,
      7,
      2
    );

    ctx.fillRect(
      4,
      -4,
      7,
      2
    );

  }else{

    ctx.fillRect(
      -10,
      -8,
      5,
      7
    );

    ctx.fillRect(
      5,
      -8,
      5,
      7
    );
  }

  ctx.restore();
}

/* =====================================================
   PRZESZKODY
===================================================== */

function drawSpike(x){

  const color =
    LEVELS[current].color;

  ctx.save();

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=16;

  ctx.beginPath();

  if(
    gravityDirection===1
  ){

    ctx.moveTo(
      x,
      ground
    );

    ctx.lineTo(
      x+23,
      ground-47
    );

    ctx.lineTo(
      x+46,
      ground
    );

  }else{

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+23,
      47
    );

    ctx.lineTo(
      x+46,
      0
    );
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";
  ctx.stroke();

  ctx.restore();
}

function drawSaw(x,r){

  const color =
    LEVELS[current].color;

  const centerY =
    gravityDirection===1
      ? ground-r
      : r;

  ctx.save();

  ctx.translate(
    x,
    centerY
  );

  ctx.rotate(
    performance.now()/280
  );

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=17;

  const teeth=14;

  ctx.beginPath();

  for(
    let i=0;
    i<teeth*2;
    i++
  ){

    const angle =
      i*Math.PI/teeth;

    const radius =
      i%2===0
        ? r
        : r*.7;

    const x2 =
      Math.cos(angle)*
      radius;

    const y2 =
      Math.sin(angle)*
      radius;

    if(i===0)
      ctx.moveTo(
        x2,
        y2
      );
    else
      ctx.lineTo(
        x2,
        y2
      );
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawCoin(x,y){

  const scale =
    1+
    Math.sin(
      performance.now()/130
    )*.1;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.fillStyle="#ffd43b";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";
  ctx.lineWidth=2;

  ctx.stroke();

  ctx.restore();
}

/* =====================================================
   PADY I PORTALE
===================================================== */

function drawPad(x){

  ctx.save();

  ctx.fillStyle="#49ff9a";

  ctx.shadowColor="#49ff9a";
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    x+25,
    ground-10,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";
  ctx.stroke();

  ctx.restore();
}

function drawSpeedPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  ctx.strokeStyle="#ffe14a";

  ctx.shadowColor="#ffe14a";
  ctx.shadowBlur=20;

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    28+
    Math.sin(
      performance.now()/120
    )*4,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="white";

  ctx.font=
    "bold 18px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    ">>",
    0,
    7
  );

  ctx.restore();
}

function drawGravityPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  ctx.strokeStyle="#ff4be8";

  ctx.shadowColor="#ff4be8";
  ctx.shadowBlur=22;

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    29+
    Math.sin(

    )*4,

  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="white";

  ctx.font=

/* =====================================================
   TŁO
===================================================== */

function createStars(){

  stars=[];

  for(
    let i=0;
    i<75;
    i++
  ){

    stars.push({
      x:Math.random()*W,
      y:
        Math.random()*
        Math.max(
          100,
          ground*.9
        ),
      r:
        Math.random()*2+.5,
      v:
        Math.random()*.8+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="white";

  for(
    const star
    of stars
  ){

    star.x -=
      star.v;

    if(star.x<0)
      star.x=W;

    ctx.globalAlpha =
      .3+
      star.r*.2;

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const color =
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.08;

  const size=70;

  const offset =
    -(world*.25)%size;

  for(
    let x=offset;
    x<W;
    x+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      ground
    );

    ctx.stroke();
  }

  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const color =
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.12;
  ctx.lineWidth=2;

  const offset =
    -(world*.8)%190;

  for(
    let x=offset-190;
    x<W+190;
    x+=190
  ){

    const y =
      100+
      Math.abs(x*7)%
      Math.max(
        100,
        ground-150
      );

    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );

    ctx.lineTo(
      x+80,
      y
    );

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life -=
      dt;

    if(
      trail[i].life<=0
    ){

      trail.splice(
        i,
        1
      );
    }
  }

  if(trail.length>35){

    trail.splice(
      0,
      trail.length-35
    );
  }
}

function drawTrail(){

  const color =
    LEVELS[current].color;

  for(
    const item
    of trail
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        item.life/.35
      )*.35;

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    ctx.fillRect(
      item.x-item.size/2,
      item.y-item.size/2,
      item.size,
      item.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================
   PARTICLE
===================================================== */

function particle(
  x,
  y,
  vx,
  vy,
  life,
  size,
  type
){

  if(
    particles.length>260
  ){
    return;
  }

  particles.push({
    x,
    y,
    vx,
    vy,
    life,
    max:life,
    size,
    type,
    rot:Math.random()*6,
    spin:(Math.random()-.5)*10
  });
}

function particlesJump(){

  for(
    let i=0;
    i<10;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*150,
      Math.random()*80,
      .4,
      3,
      "jump"
    );
  }
}

function particlesDeath(){

  for(
    let i=0;
    i<45;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*500,
      (Math.random()-.6)*500,
      .9,
      Math.random()*7+2,
      "death"
    );
  }
}

function particlesCoin(x,y){

  for(
    let i=0;
    i<20;
    i++
  ){

    particle(
      x,
      y,
      (Math.random()-.5)*250,
      (Math.random()-.7)*250,
      .7,
      Math.random()*5+2,
      "coin"
    );
  }
}

function particlesPad(x){

  for(
    let i=0;
    i<18;
    i++
  ){

    particle(
      x,
      ground-15,
      (Math.random()-.5)*220,
      -Math.random()*220,
      .7,
      4,
      "pad"
    );
  }
}

function particlesPortal(x){

  for(
    let i=0;
    i<30;
    i++
  ){

    particle(
      x,
      H*.48,
      (Math.random()-.5)*300,
      (Math.random()-.5)*300,
      .8,
      4,
      "portal"
    );
  }
}

function particlesWin(){

  for(
    let i=0;
    i<130;
    i++
  ){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*700,
      (Math.random()-.8)*700,
      1.5+
        Math.random(),
      Math.random()*8+3,
      "win"
    );
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const particleObject =
      particles[i];

    particleObject.life -=
      dt;

    particleObject.x +=
      particleObject.vx*dt;

    particleObject.y +=
      particleObject.vy*dt;

    particleObject.vy +=
      500*dt;

    particleObject.rot +=
      particleObject.spin*dt;

    if(
      particleObject.life<=0
    ){

      particles.splice(
        i,
        1
      );
    }
  }
}

function drawParticles(){

  for(
    const particleObject
    of particles
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        particleObject.life/
        particleObject.max
      );

    let color =
      LEVELS[current].color;

    if(
      particleObject.type==="coin"
    ){
      color="#ffd43b";
    }

    if(
      particleObject.type==="pad"
    ){
      color="#49ff9a";
    }

    if(
      particleObject.type==="portal"
    ){
      color="#ff4be8";
    }

    if(
      particleObject.type==="win"
    ){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      color =
        colors[
          Math.floor(
            Math.random()*
            colors.length
          )
        ];
    }

    ctx.fillStyle=color;

    ctx.save();

    ctx.translate(
      particleObject.x,
      particleObject.y
    );

    ctx.rotate(
      particleObject.rot
    );

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -particleObject.size/2,
      -particleObject.size/2,
      particleObject.size,
      particleObject.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================
   PAUZA
===================================================== */

function togglePause(){

  if(
    !running&&
    !paused
  ){
    return;
  }

  paused =
    !paused;

  pause.style.display =
    paused
      ? "flex"
      : "none";

  if(paused){

    stopMusic();

  }else{

    last =
      performance.now();

    if(sound){

      unlockAudio()
        .then(
          ()=>{
            if(
              running&&
              !paused
            ){
              startMusic();
            }
          }
        );
    }
  }
}

document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    event=>{
      event.stopPropagation();
      togglePause();
    }
  );

document
  .getElementById("resume")
  .addEventListener(
    "click",
    async()=>{
      paused=false;

      pause.style.display="none";

      last =
        performance.now();

      if(sound){

        const ok =
          await unlockAudio();

        if(
          ok&&
          running
        ){
          startMusic();
        }
      }
    }
  );

/* =====================================================
   MENU Z GRY
===================================================== */

function goMenu(){

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){

    cancelAnimationFrame(
      raf
    );

    raf=0;
  }

  stopMusic();

  game.style.display="none";
  menu.style.display="flex";

  pause.style.display="none";
  finish.style.display="none";

  renderMenu();
  renderAchievements();
}

document
  .getElementById("menuBtn")
  .addEventListener(
    "click",
    event=>{
      event.stopPropagation();
      goMenu();
    }
  );

document
  .getElementById("pauseMenu")
  .addEventListener(
    "click",
    goMenu
  );

document
  .getElementById("finishMenu")
  .addEventListener(
    "click",
    goMenu
  );

/* =====================================================
   RESTART
===================================================== */

document
  .getElementById("again")
  .addEventListener(
    "click",
    async event=>{

      event.stopPropagation();

      await startLevel(
        current,
        true,
        true
      );
    }
  );

/* =====================================================
   DŹWIĘK
===================================================== */

function updateSound(){

  document.getElementById(
    "soundBtn"
  ).textContent =
    sound
      ? "🔊"
      : "🔇";
}

document
  .getElementById("soundBtn")
  .addEventListener(
    "click",
    async event=>{

      event.stopPropagation();

      sound =
        !sound;

      set(
        "nd_sound",
        sound
          ? "1"
          : "0"
      );

      updateSound();

      if(
        sound&&
        running&&
        !paused
      ){

        const ok =
          await unlockAudio();

        if(ok)
          startMusic();

      }else{

        stopMusic();
      }
    }
  );

/* =====================================================
   AUTO PAUZA
===================================================== */

function autoPause(){

  if(
    running&&
    !paused&&
    !finished
  ){

    paused=true;

    pause.style.display="flex";

    stopMusic();
  }
}

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){
      autoPause();
    }
  }
);

window.addEventListener(
  "blur",
  autoPause
);

/* =====================================================
   VICTORY
===================================================== */

function victoryAnimation(){

  let frames=0;

  function animation(){

    if(!finished)
      return;

    updateParticles(.016);
    draw();

    frames++;

    if(frames<100){

      requestAnimationFrame(
        animation
      );
    }
  }

  requestAnimationFrame(
    animation
  );
}

/* =====================================================
   START APLIKACJI
===================================================== */

resize();
renderMenu();
renderAchievements();
updateSound();

</script>
