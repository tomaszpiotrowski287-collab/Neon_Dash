<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DASH</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
  color:#fff;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}

/* =========================
   MENU
========================= */

#menu{
  position:fixed;
  inset:0;
  overflow:auto;
  text-align:center;
  padding:24px 14px 40px;
  background:
    radial-gradient(circle at 50% -10%,#3440a0 0,#11163d 30%,#050713 65%,#020207 100%);
}

#menu:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background:
    linear-gradient(transparent 95%,#00eaff 96%),
    linear-gradient(90deg,transparent 95%,#00eaff 96%);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

.logo{
  position:relative;
  font-size:clamp(40px,9vw,74px);
  font-weight:900;
  letter-spacing:5px;
  margin:8px 0 3px;
  color:#fff;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 55px #9b5cff;
  animation:logoPulse 1.8s infinite alternate;
}

@keyframes logoPulse{
  from{transform:scale(1)}
  to{transform:scale(1.035)}
}

.sub{
  position:relative;
  opacity:.7;
  margin-bottom:18px;
  font-size:14px;
}

.stats{
  position:relative;
  width:min(820px,100%);
  margin:auto;
  padding:17px;
  border:1px solid #46548d;
  border-radius:20px;
  background:linear-gradient(135deg,#121833dd,#090d20dd);
  box-shadow:
    0 0 30px #00eaff12,
    inset 0 0 30px #536cff08;
  backdrop-filter:blur(8px);
}

.statsTop{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  padding:10px 6px;
  border-radius:12px;
  background:#080c1b;
  border:1px solid #28365f;
}

.stat b{
  font-size:18px;
}

.stat small{
  display:block;
  opacity:.55;
  margin-top:3px;
}

.progress{
  height:12px;
  background:#03050d;
  border-radius:20px;
  margin-top:13px;
  overflow:hidden;
  border:1px solid #26345d;
}

#progressBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 18px #00eaff;
  transition:width .4s;
}

.menuButtons{
  position:relative;
  width:min(820px,100%);
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.menuButtons button,
.smallBtn{
  min-height:52px;
  padding:10px;
  border-radius:14px;
  background:linear-gradient(135deg,#202957,#141a39);
  border:1px solid #4d5d91;
  font-weight:bold;
  transition:.15s;
  box-shadow:0 5px 15px #0005;
}

.menuButtons button:hover,
.smallBtn:hover{
  transform:translateY(-2px);
  border-color:#00eaff;
  box-shadow:0 0 18px #00eaff22;
}

.menuButtons button:active{
  transform:scale(.97);
}

#levels{
  position:relative;
  width:min(820px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.level{
  min-height:82px;
  text-align:left;
  padding:13px;
  border-radius:16px;
  background:
    linear-gradient(135deg,#171e42,#0b1026);
  border:1px solid #35436f;
  position:relative;
  overflow:hidden;
  transition:.15s;
}

.level:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,#00eaff10,transparent);
  transform:translateX(-100%);
  transition:.4s;
}

.level:hover:before{
  transform:translateX(100%);
}

.level:hover{
  transform:translateY(-2px);
  border-color:#00eaff;
  box-shadow:0 0 20px #00eaff18;
}

.level:active{
  transform:scale(.97);
}

.level.locked{
  opacity:.35;
  filter:grayscale(.4);
}

.level b{
  font-size:16px;
}

.level small{
  opacity:.6;
}

.status{
  float:right;
  font-size:21px;
}

/* =========================
   PANELE
========================= */

.panelBg{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:#000c;
  backdrop-filter:blur(7px);
}

.panel{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:22px;
  text-align:center;
  background:
    linear-gradient(145deg,#151b3c,#080c1e);
  border:1px solid #526298;
  box-shadow:
    0 0 50px #00eaff18,
    inset 0 0 30px #ffffff05;
}

.panel h2{
  margin-top:0;
  text-shadow:0 0 12px #00eaff;
}

.panel button{
  width:100%;
  min-height:46px;
  margin-top:9px;
  padding:10px;
  border-radius:13px;
  background:#242d58;
  border:1px solid #46588f;
  font-weight:bold;
}

.panel button:hover{
  border-color:#00eaff;
}

.item{
  padding:13px;
  margin:8px 0;
  border-radius:13px;
  background:#111735;
  border:1px solid #28365f;
  text-align:left;
}

.item.unlocked{
  border-color:#00eaff;
  box-shadow:0 0 12px #00eaff12;
}

.item button{
  width:auto;
  float:right;
  margin:0;
  padding:7px 12px;
}

/* =========================
   GRA
========================= */

#game{
  position:fixed;
  inset:0;
  display:none;
  touch-action:none;
  background:#020207;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:5;
  left:10px;
  right:10px;
  top:10px;
  pointer-events:none;
  text-shadow:0 2px 6px #000;
}

.hudline{
  display:flex;
  justify-content:space-between;
  gap:7px;
  font-size:clamp(12px,3vw,17px);
  font-weight:bold;
}

.hudbar{
  height:9px;
  background:#000b;
  border-radius:20px;
  margin-top:7px;
  overflow:hidden;
  border:1px solid #26345d;
}

#gameBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00eaff,#9b5cff,#ff27d7);
  box-shadow:0 0 14px #00eaff;
}

.gameBtns{
  position:absolute;
  z-index:10;
  right:10px;
  top:10px;
  display:flex;
  gap:6px;
}

.gameBtns button{
  min-width:44px;
  min-height:44px;
  border-radius:11px;
  background:#0c1225dd;
  border:1px solid #53618e;
}

#fpsCounter{
  position:absolute;
  z-index:7;
  right:10px;
  top:62px;
  padding:5px 8px;
  border-radius:7px;
  background:#050814aa;
  color:#8df6ff;
  font:11px monospace;
  pointer-events:none;
}

#combo{
  position:absolute;
  z-index:8;
  top:24%;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  opacity:0;
  color:#fff;
  text-shadow:0 0 12px #00eaff,0 0 30px #00eaff;
  pointer-events:none;
}

#practiceText{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  opacity:.65;
  font-size:12px;
  pointer-events:none;
}

#touchControls{
  position:absolute;
  bottom:15px;
  left:15px;
  right:15px;
  display:none;
  justify-content:space-between;
  z-index:9;
  pointer-events:none;
}

.touchGroup{
  display:flex;
  gap:10px;
}

.touchBtn{
  width:68px;
  height:60px;
  border-radius:15px;
  background:#101a35cc;
  border:2px solid #53618e;
  font-size:24px;
  pointer-events:auto;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){
  .statsTop{
    grid-template-columns:repeat(2,1fr);
  }

  #levels{
    grid-template-columns:1fr;
  }

  .menuButtons{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-height:520px){
  #menu{
    padding-top:8px;
  }

  .logo{
    font-size:32px;
    margin:2px;
  }

  .sub{
    margin-bottom:6px;
  }

  .stats{
    padding:8px;
  }

  .menuButtons{
    margin:7px auto;
  }
}
</style>

</head>

<script>
"use strict";

/* =====================================================
   POZIOMY
===================================================== */

const LEVELS=[
["NEON RUSH",124,280,"#00eaff"],
["CRYSTAL DRIVE",112,295,"#72a7ff"],
["LAVA PULSE",140,310,"#ff4d42"],
["SKY CIRCUIT",132,305,"#9c7bff"],
["VIOLET RUN",128,320,"#d35cff"],
["SHADOW FACTORY",118,325,"#b44cff"],
["CYBER STORM",136,335,"#27f0c5"],
["INFERNO CORE",145,345,"#ff7338"],
["ELECTRIC VOID",150,355,"#35b7ff"],
["GRAVITY BREAK",142,340,"#45ff9a"],
["OVERDRIVE",154,365,"#ff3bea"],
["FINAL CHAOS",158,375,"#ff247f"],
["STARLIGHT",135,350,"#ffe36e"],
["PLASMA DRIVE",148,370,"#4b8cff"],
["DARK MATTER",155,380,"#9b5cff"],
["NEON TEMPEST",160,390,"#00ffd5"],
["CYBERFALL",164,395,"#ff5e9c"],
["QUANTUM",168,405,"#62e8ff"],
["INFINITE",172,415,"#b7ff45"],
["NEON APOCALYPSE",178,430,"#ff245d"]
].map((x,i)=>({
  name:x[0],
  bpm:x[1],
  speed:x[2],
  color:x[3],
  gravity:i===9?-1:1,
  length:10500+i*420
}));


/* =====================================================
   DOM
===================================================== */

const $=id=>document.getElementById(id);

const canvas=$("canvas");

const ctx=canvas.getContext("2d",{
  alpha:false,
  desynchronized:true
});

let W=innerWidth;
let H=innerHeight;
let ground=H*.78;


/* =====================================================
   BEZPIECZNY ZAPIS
===================================================== */

function read(key,def){

  try{

    const value=localStorage.getItem(key);

    return value===null?
      def:
      value;

  }catch(e){

    return def;
  }
}


function write(key,value){

  try{
    localStorage.setItem(
      key,
      String(value)
    );
  }catch(e){}
}


function readArray(key){

  try{

    const value=
      JSON.parse(
        read(key,"[]")
      );

    return Array.isArray(value)?
      value:
      [];

  }catch(e){

    return [];
  }
}


let save={

  coins:Number(read("nd_coins",0))||0,

  diamonds:
    Number(read("nd_diamonds",0))||0,

  stars:
    Number(read("nd_stars",0))||0,

  completed:
    readArray("nd_completed"),

  skin:
    read("nd_skin","cyan"),

  trail:
    read("nd_trail","neon"),

  music:
    read("nd_music","1")==="1",

  sfx:
    read("nd_sfx","1")==="1",

  touch:
    read("nd_touch","0")==="1",

  highFPS:
    read("nd_highfps","1")==="1",

  deaths:
    Number(read("nd_deaths",0))||0

};


function saveGame(){

  write("nd_coins",save.coins);
  write("nd_diamonds",save.diamonds);
  write("nd_stars",save.stars);
  write("nd_completed",JSON.stringify(save.completed));
  write("nd_skin",save.skin);
  write("nd_trail",save.trail);
  write("nd_music",save.music?"1":"0");
  write("nd_sfx",save.sfx?"1":"0");
  write("nd_touch",save.touch?"1":"0");
  write("nd_highfps",save.highFPS?"1":"0");
  write("nd_deaths",save.deaths);
}


/* =====================================================
   OSIĄGNIĘCIA
===================================================== */

const ACH=[

["first","🎮 Pierwszy krok","Ukończ pierwszy poziom."],
["five","🔥 Rozgrzewka","Ukończ 5 poziomów."],
["ten","⚡ Weteran","Ukończ 10 poziomów."],
["twenty","👑 Mistrz","Ukończ wszystkie poziomy."],
["coin10","🪙 Łowca monet","Zbierz 10 monet."],
["coin30","💰 Kolekcjoner","Zbierz 30 monet."],
["diamond","💎 Diament","Zdobądź pierwszy diament."],
["death50","💀 Nie poddawaj się","Zgiń 50 razy."],
["perfect","🌟 Perfekcja","Ukończ poziom bez śmierci."],
["speed","🚀 Prędkość","Ukończ poziom 15 lub wyższy."]

];


function unlocked(id){

  return read(
    "nd_ach_"+id,
    "0"
  )==="1";

}


function unlock(id){

  if(!unlocked(id)){

    write(
      "nd_ach_"+id,
      "1"
    );

  }

}


function checkAchievements(){

  const n=
    save.completed.length;

  if(n>=1)unlock("first");
  if(n>=5)unlock("five");
  if(n>=10)unlock("ten");
  if(n>=20)unlock("twenty");

  if(save.coins>=10)
    unlock("coin10");

  if(save.coins>=30)
    unlock("coin30");

  if(save.diamonds>=1)
    unlock("diamond");

  if(save.deaths>=50)
    unlock("death50");

  if(runDeaths===0)
    unlock("perfect");

  if(current>=14)
    unlock("speed");

  renderAchievements();
}


/* =====================================================
   MISJE
===================================================== */

const MISSIONS=[

["coin","🪙 Zbierz 5 monet",5],
["coin20","💰 Zbierz 20 monet",20],
["levels","🏆 Ukończ 3 poziomy",3],
["diamond","💎 Zdobądź diament",1],
["deaths","💀 Zgiń 10 razy",10]

];


function missionValue(id){

  return Number(
    read("nd_m_"+id,0)
  )||0;

}


function missionDone(id){

  return read(
    "nd_md_"+id,
    "0"
  )==="1";

}


function missionAdd(id,n){

  if(missionDone(id))
    return;

  const m=
    MISSIONS.find(
      x=>x[0]===id
    );

  if(!m)return;

  const value=Math.min(
    m[2],
    missionValue(id)+n
  );

  write(
    "nd_m_"+id,
    value
  );

  if(value>=m[2]){

    write(
      "nd_md_"+id,
      "1"
    );

    save.coins+=5;

  }

}


/* =====================================================
   SKLEP
===================================================== */

const SHOP=[

["skin","cyan","🟦 CYAN","Darmowy",0],
["skin","purple","🟪 PURPLE","100 monet",100],
["skin","red","🟥 RED","200 monet",200],
["skin","gold","🟨 GOLD","350 monet",350],
["skin","green","🟩 GREEN","500 monet",500],

["trail","neon","🌈 NEON TRAIL","Darmowy",0],
["trail","fire","🔥 FIRE TRAIL","150 monet",150],
["trail","ice","❄️ ICE TRAIL","250 monet",250],
["trail","rainbow","🌈 RAINBOW TRAIL","400 monet",400]

];


function owned(type,id){

  const free=
    type==="skin"&&id==="cyan"||
    type==="trail"&&id==="neon";

  return read(
    "nd_owned_"+type+"_"+id,
    free?"1":"0"
  )==="1";

}


function buy(type,id,price){

  if(owned(type,id)){

    if(type==="skin")
      save.skin=id;
    else
      save.trail=id;

    saveGame();
    renderShop();

    return;
  }

  if(save.coins<price)
    return;

  save.coins-=price;

  write(
    "nd_owned_"+type+"_"+id,
    "1"
  );

  if(type==="skin")
    save.skin=id;
  else
    save.trail=id;

  saveGame();

  renderShop();
  renderMenu();
}


/* =====================================================
   MENU
===================================================== */

function renderMenu(){

  $("completed").textContent=
    save.completed.length;

  $("coins").textContent=
    save.coins;

  $("diamonds").textContent=
    save.diamonds;

  $("stars").textContent=
    save.stars;

  $("progressBar").style.width=
    Math.min(
      100,
      save.completed.length/20*100
    )+"%";


  $("levels").innerHTML="";


  LEVELS.forEach((l,i)=>{

    const unlockedLevel=
      i===0||
      save.completed.includes(i-1);

    const b=
      document.createElement("button");

    b.className=
      "level "+
      (unlockedLevel?"":"locked");

    b.innerHTML=
      '<span class="status">'+
      (
        save.completed.includes(i)?
        "✅":
        unlockedLevel?
        "▶️":
        "🔒"
      )+
      '</span>'+
      '<b>'+
      (i+1)+
      ". "+
      l.name+
      '</b><br>'+
      '<small>⭐ '+
      (i<5?2:i<12?3:4)+
      " • "+
      l.speed+
      " px/s</small>";


    b.onclick=()=>{

      if(unlockedLevel)
        startLevel(i,false);

    };


    $("levels").appendChild(b);

  });

}


function renderAchievements(){

  $("achList").innerHTML="";

  ACH.forEach(a=>{

/* =====================================================
   AUDIO
===================================================== */

let audio=null;
let master=null;
let musicTimer=null;
let musicIndex=0;


function initAudio(){

  try{

    if(!audio){

      audio=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();

      master=
        audio.createGain();

      master.gain.value=.7;

      master.connect(
        audio.destination
      );

    }

    if(
      audio.state==="suspended"
    ){
      audio.resume();
    }

  }catch(e){}

}


function tone(
  freq,
  duration=.12,
  type="square",
  volume=.06
){

  if(
    !save.sfx||
    !audio||
    !master
  )return;

  try{

    const o=
      audio.createOscillator();

    const g=
      audio.createGain();

    o.type=type;
    o.frequency.value=freq;

    g.gain.setValueAtTime(
      volume,
      audio.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    o.connect(g);
    g.connect(master);

    o.start();

    o.stop(
      audio.currentTime+duration
    );

  }catch(e){}

}


function startMusic(){

  if(!save.music)return;

  initAudio();

  stopMusic();

  const notes=[
    261,330,392,523,
    392,330,294,349,
    440,523,659,523
  ];

  musicIndex=0;

  function note(){

    if(
      !running||
      paused||
      !save.music
    )return;

    const f=
      notes[
        musicIndex%
        notes.length
      ];

    tone(
      f,
      .16,
      "triangle",
      .035
    );

    if(
      musicIndex%4===0
    ){

      tone(
        f/2,
        .2,
        "sine",
        .025
      );

    }

    musicIndex++;

  }

  note();

  musicTimer=
    setInterval(
      note,
      60000/
      LEVELS[current].bpm
    );

}


function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;

  }

}

function resetPlayer(){

    Math.max(
      80,
      Math.min(

    gravity===1?

  player.vy=0;

/* =====================================================
   GENEROWANIE
   WAŻNE:
   NIE MA JUŻ PROSTOKĄTNYCH PRZESZKÓD.
===================================================== */

function generateLevel(){

  let x=550;
  let pattern=0;

  const length=
    LEVELS[current].length;

  while(x<length){

    const type=
      pattern%12;

    if(type===0){

      spike(x);
      x+=390;

    }

    else if(type===1){

      spike(x);
      spike(x+60);
      x+=500;

    }

    else if(type===2){

      saw(x);
      x+=520;

    }

    else if(type===3){

      gap(x,150);
      x+=620;

    }

    else if(type===4){

      pad(x);
      spike(x+220);
      x+=650;

    }

    else if(type===5){

      saw(x);
      spike(x+180);
      x+=680;

    }

    else if(type===6){

      spike(x);
      saw(x+180);
      x+=620;

    }

    else if(type===7){

      speedPortal(x);
      spike(x+250);
      x+=720;

    }

    else if(type===8){

      gravityPortal(x);
      spike(x+260);
      x+=700;

    }

    else if(type===9){

      spike(x);
      spike(x+55);
      saw(x+230);
      x+=700;

    }

    else if(type===10){

      saw(x);
      saw(x+220);
      spike(x+440);
      x+=760;

    }

    else{

      gap(x,180);
      pad(x+240);
      spike(x+470);
      x+=850;

    }

    pattern++;

  }


  /* 3 MONETY */

  const coinPositions=[

    length*.22,
    length*.50,
    length*.78

  ];

  coinPositions.forEach(
    (x,i)=>{

      coins.push({

        x:x,

        y:
          gravity===1?
          ground-125:
          125,

        id:i,

        got:false

      });

    }
  );


  /* 1 DIAMENT */

  diamonds.push({

    x:length*.63,

    y:
      gravity===1?
      ground-190:
      190,

    got:false

  });

}

/* =====================================================
   UPDATE
   FIXED STEP = 120 Hz
===================================================== */

function update(dt){

  let speed=
    LEVELS[current].speed*
    speedBoost;

  world+=
    speed*dt;


  const g=
    2100*
    gravity;

  player.vy+=
    g*dt;

  player.y+=
    player.vy*dt;


  /* GRAWITACJA */

  if(gravity===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !gapAtPlayer()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/
          (Math.PI/2)
        )*
        (Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8;

    }

  }else{

    if(
      player.y<=0
    ){

      player.y=0;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;

    }

  }


  checkPads();
  checkPortals();
  checkCollectibles();
  checkCollisions();


  if(speedBoost>1){

    speedBoost=
      Math.max(
        1,
        speedBoost-dt*.15
      );

  }


  /* CHECKPOINTY PRACTICE */

  if(
    practice&&
    world>
      checkpoint+1800
  ){

    checkpoint=world;

  }


  /* TRAIL */

  if(
    Math.random()<.85
  ){

    trail.push({

      x:player.x+17,
      y:player.y+17,
      life:.35

    });

  }


  updateTrail(dt);
  updateParticles(dt);
  updateCombo(dt);


  if(shake>0){

    shake=
      Math.max(
        0,
        shake-dt*14
      );

  }


  if(flash>0){

    flash=
      Math.max(
        0,
        flash-dt*3
      );

  }

}


function gapAtPlayer(){

  const cx=
    world+
    player.x+
    17;

  return obstacles.some(
    o=>
      o.type==="gap"&&
      cx>o.x&&
      cx<o.x+o.w
  );

}


/* =====================================================
   MECHANIKI
===================================================== */

function checkPads(){

  for(const p of pads){

    if(p.used)
      continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+55&&
      player.grounded
    ){

      p.used=true;

      player.vy=
        -1000*
        gravity;

      player.grounded=false;

      particlesPad(
        p.x-world
      );

      tone(
        700,
        .15,
        "square",
        .08
      );

    }

  }

}


function checkPortals(){

  for(const p of portals){

    if(p.used)
      continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+60
    ){

      p.used=true;

      if(
        p.type==="speed"
      ){

        speedBoost=1.45;

        tone(
          900,
          .18,
          "sawtooth",
          .07
        );

      }else{

        gravity*=-1;

        player.vy=0;
        player.grounded=false;

        tone(
          250,
          .2,
          "triangle",
          .08
        );

      }

      particlesPortal(
        p.x-world
      );

    }

  }

}


function checkCollectibles(){

  for(const c of coins){

    if(c.got)
      continue;

    const x=
      c.x-world;

    if(
      Math.hypot(
        player.x+17-x,
        player.y+17-c.y
      )<38
    ){

      c.got=true;

      runCoins++;

      combo++;

      missionAdd(
        "coin",
        1
      );

      tone(
        900+
        combo*40,
        .1,
        "square",
        .06
      );

      particlesCoin(
        x,
        c.y
      );

      showCombo();

    }

  }


  for(const d of diamonds){

    if(d.got)
      continue;

    const x=
      d.x-world;

    if(
      Math.hypot(
        player.x+17-x,
        player.y+17-d.y
      )<40
    ){

      d.got=true;

      runDiamond=true;

      missionAdd(
        "diamond",
        1
      );

      tone(
        1200,
        .2,
        "triangle",
        .08
      );

      particlesDiamond(
        x,
        d.y
      );

    }

  }

}


/* =====================================================
   KOLIZJE
===================================================== */

function checkCollisions(){

  const left=
    world+
    player.x+
    6;

  const right=
    world+
    player.x+
    player.size-
    6;

  const top=
    player.y+
    6;

  const bottom=
    player.y+
    player.size-
    5;


  for(const o of obstacles){

    /* KOLCE */

    if(
      o.type==="spike"
    ){

      if(
        gravity===1&&
        right>o.x+5&&
        left<o.x+47&&
        bottom>ground-48
      ){

        die();
        return;

      }


      if(
        gravity===-1&&
        right>o.x+5&&
        left<o.x+47&&
        top<48
      ){

        die();
        return;

      }

    }


    /* PIŁA */

    if(
      o.type==="saw"
    ){

      const cy=
        gravity===1?
        ground-o.r:
        o.r;

      const nx=
        Math.max(
          left,
          Math.min(
            o.x,
            right
          )
        );

      const ny=
        Math.max(
          top,
          Math.min(
            cy,
            bottom
          )
        );

      const dx=
        o.x-nx;

      const dy=
        cy-ny;

      if(
        dx*dx+
        dy*dy<
        (o.r-5)*
        (o.r-5)
      ){

        die();
        return;

      }

    }


    /* DZIURA */

    if(
      o.type==="gap"
    ){

      const cx=
        world+
        player.x+
        17;

      if(
        gravity===1&&
        cx>o.x&&
        cx<o.x+o.w&&
        bottom>=ground-5
      ){

        die();
        return;

      }

    }

  }

}


/* =====================================================
   ŚMIERĆ
===================================================== */

function die(){

  if(
    !running||
    finished
  )return;

  runDeaths++;

  save.deaths++;

  missionAdd(
    "deaths",
    1
  );

  combo=0;

  flash=1;
  shake=14;

  particlesDeath();

  tone(
    100,
    .3,
    "sawtooth",
    .1
  );

  running=false;

  stopMusic();


  setTimeout(()=>{

    if(finished)
      return;


    if(
      practice&&
      checkpoint>0
    ){

      world=checkpoint;

      player.x=
        Math.max(
          80,
          Math.min(
            180,
            W*.22
          )
        );

      player.y=
        gravity===1?
        ground-player.size:
        0;

      player.vy=0;
      player.grounded=true;

      particlesRespawn();

      running=true;

      last=
        performance.now();

      if(save.music)
        startMusic();

      raf=
        requestAnimationFrame(
          loop
        );

    }else{

      startLevel(
        current,
        practice
      );

    }

  },500);

}


/* =====================================================
   KONIEC
===================================================== */

function finishLevel(){

  if(finished)
    return;

  finished=true;
  running=false;

  stopMusic();

  if(
    !save.completed.includes(current)
  ){

    save.completed.push(current);

    save.completed.sort(
      (a,b)=>a-b
    );

    missionAdd(
      "levels",
      1
    );

  }

  save.coins+=runCoins;

  if(runDiamond)
    save.diamonds++;

  save.stars+=
    current<5?
    2:
    current<12?
    3:
    4;

  checkAchievements();

  saveGame();

  renderMenu();

  $("finishTitle").textContent=
    "🎉 POZIOM UKOŃCZONY!";

  $("finishInfo").textContent=
    LEVELS[current].name+
    " • 🪙 "+
    runCoins+
    "/3"+
    " • 💎 "+
    (runDiamond?"1/1":"0/1")+
    " • ☠️ "+
    runDeaths;

  $("nextBtn").style.display=
    current<
    LEVELS.length-1?
    "block":
    "none";

  $("finishPanel").style.display=
    "flex";

  particlesWin();

}

$("againBtn").onclick=()=>{

  );

};


$("finishMenuBtn").onclick=
  goMenu;


/* =====================================================
   120 FPS / FIXED PHYSICS
===================================================== */

const FIXED_DT=
  1/120;

let accumulator=0;

let fpsFrames=0;
let fpsLast=
  performance.now();

let displayedFPS=0;


function updateFPS(time){

  fpsFrames++;

  if(
    time-fpsLast>=500
  ){

    displayedFPS=
      Math.round(
        fpsFrames*
        1000/
        (time-fpsLast)
      );

    fpsFrames=0;
    fpsLast=time;

    $("fpsCounter").textContent=
      "FPS: "+
      displayedFPS+
      " • "+
      (
        displayedFPS>=110?
        "120Hz+":
        displayedFPS>=55?
        "60Hz":
        "LOW"
      );

  }

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running)
    return;


  updateFPS(time);


  if(paused){

    last=time;

    raf=
      requestAnimationFrame(
        loop
      );

    return;

  }


  let frameDt=
    Math.min(
      .05,
      Math.max(
        0,
        (time-last)/1000
      )
    );

  last=time;


  /*
    FIZYKA DZIAŁA W 120 Hz.
    Renderowanie pozostaje zsynchronizowane
    z ekranem przez requestAnimationFrame.
  */

  accumulator+=frameDt;


  let steps=0;

  while(
    accumulator>=FIXED_DT&&
    steps<8
  ){

    update(FIXED_DT);

    accumulator-=
      FIXED_DT;

    steps++;

    if(!running)
      break;

  }


  draw();


  if(
    running&&
    world>=
      LEVELS[current].length
  ){

    finishLevel();
    return;

  }


  if(running){

    raf=
      requestAnimationFrame(
        loop
      );

  }

}


/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

  const l=
    LEVELS[current];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.save();


  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*
      shake,
      (Math.random()-.5)*
      shake
    );

  }


  const bg=
    ctx.createLinearGradient(
      0,0,0,H
    );

  bg.addColorStop(
    0,
    "#080b20"
  );

  bg.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=bg;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  drawStars();
  drawGrid();


  ctx.fillStyle=
    "#080b16";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );


  /* PODŁOGA */

  ctx.strokeStyle=
    l.color;

  ctx.shadowColor=
    l.color;

  ctx.shadowBlur=15;

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();

  ctx.shadowBlur=0;


  /* PRZESZKODY */

  for(
    const o of obstacles
  ){

    const x=
      o.x-world;

    if(
      x<-200||
      x>W+200
    )continue;


    if(
      o.type==="spike"
    )
      drawSpike(x);


    if(
      o.type==="saw"
    )
      drawSaw(
        x,
        o.r
      );


    if(
      o.type==="gap"
    ){

      ctx.fillStyle=
        "#020207";

      ctx.fillRect(
        x,
        ground,
        o.w,
        H-ground
      );

    }

  }


  /* PADY */

  for(
    const p of pads
  ){

    const x=
      p.x-world;

    if(
      x>-100&&
      x<W+100
    )
      drawPad(x);

  }


  /* PORTALE */

  for(
    const p of portals
  ){

    const x=
      p.x-world;

    if(
      x>-100&&
      x<W+100
    ){

      if(
        p.type==="speed"
      )
        drawSpeedPortal(x);
      else
        drawGravityPortal(x);

    }

  }


  /* MONETY */

  for(
    const c of coins
  ){

    if(c.got)
      continue;

    const x=
      c.x-world;

    if(
      x>-50&&
      x<W+50
    )
      drawCoin(
        x,
        c.y
      );

  }


  /* DIAMENT */

  for(
    const d of diamonds
  ){

    if(d.got)
      continue;

    const x=
      d.x-world;

    if(
      x>-50&&
      x<W+50
    )
      drawDiamond(
        x,
        d.y
      );

  }


  drawTrail();


  if(
    running&&
    !finished
  )
    drawPlayer();


  drawParticles();


  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(
        .45,
        flash*.45
      )+
      ")";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  ctx.restore();


  const progress=
    Math.min(
      100,
      Math.floor(
        world/
        LEVELS[current].length*
        100
      )
    );


  $("percent").textContent=
    progress+"%";

  $("gameBar").style.width=
    progress+"%";

  $("runCollect").textContent=
    "🪙 "+
    runCoins+
    "/3 💎 "+
    (runDiamond?"1":"0")+
    "/1";

}


/* =====================================================
   POSTAĆ
   TYLKO KWADRAT + OCZY
===================================================== */

function skinColor(){

  return{

    cyan:"#00eaff",
    purple:"#b65cff",
    red:"#ff405c",
    gold:"#ffd43b",
    green:"#49ff9a"

  }[save.skin]||"#00eaff";

}


function drawPlayer(){

  const c=
    skinColor();

  ctx.save();

  ctx.translate(
    player.x+17,
    player.y+17
  );

  ctx.rotate(
    player.rot
  );


  ctx.shadowColor=c;
  ctx.shadowBlur=22;

  ctx.fillStyle=c;

  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );


  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.lineWidth=2;

  ctx.strokeRect(
    -17,
    -17,
    34,
    34
  );


  /* TYLKO OCZY */

  ctx.fillStyle=
    "#05050c";

  ctx.beginPath();

  ctx.arc(
    -7,
    -4,
    3,
    0,
    Math.PI*2
  );

  ctx.arc(
    7,
    -4,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* =====================================================
   KOLCE
===================================================== */

function drawSpike(x){

  const c=
    LEVELS[current].color;

  ctx.save();

  ctx.fillStyle=c;

  ctx.shadowColor=c;
  ctx.shadowBlur=18;

  ctx.beginPath();


  if(gravity===1){

    ctx.moveTo(
      x,
      ground
    );

    ctx.lineTo(
      x+23,
      ground-48
    );

    ctx.lineTo(
      x+46,
      ground
    );

  }else{

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+23,
      48
    );

    ctx.lineTo(
      x+46,
      0
    );

  }


  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.stroke();

  ctx.restore();

}


/* =====================================================
   PIŁA
===================================================== */

function drawSaw(x,r){

  const c=
    LEVELS[current].color;

  const cy=
    gravity===1?
    ground-r:
    r;

  ctx.save();

  ctx.translate(
    x,
    cy
  );

  ctx.rotate(
    performance.now()/250
  );

  ctx.fillStyle=c;

  ctx.shadowColor=c;
  ctx.shadowBlur=18;

  ctx.beginPath();


  for(
    let i=0;
    i<28;
    i++
  ){

    const a=
      i*Math.PI/14;

    const rr=
      i%2===0?
      r:
      r*.68;

    const xx=
      Math.cos(a)*rr;

    const yy=
      Math.sin(a)*rr;

    if(i===0)
      ctx.moveTo(
        xx,
        yy
      );
    else
      ctx.lineTo(
        xx,
        yy
      );

  }


  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.27,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   PAD
===================================================== */

function drawPad(x){

  ctx.save();

  ctx.fillStyle="#49ff9a";

  ctx.shadowColor="#49ff9a";
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    x+25,
    ground-10,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.stroke();

  ctx.restore();

}


/* =====================================================
   PORTALE
===================================================== */

function drawSpeedPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  ctx.strokeStyle="#ffe14a";

  ctx.shadowColor="#ffe14a";
  ctx.shadowBlur=20;

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    30+
    Math.sin(
      performance.now()/120
    )*4,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 18px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    ">>",
    0,
    7
  );

  ctx.restore();

}


function drawGravityPortal(x){

  ctx.save();

  ctx.translate(
    x+25,
    H*.48
  );

  ctx.strokeStyle="#ff4be8";

  ctx.shadowColor="#ff4be8";
  ctx.shadowBlur=22;

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    30+
    Math.sin(
      performance.now()/140
    )*4,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 22px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    "↕",
    0,
    8
  );

  ctx.restore();

}


/* =====================================================
   MONETA / DIAMENT
===================================================== */

function drawCoin(x,y){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  const s=
    1+
    Math.sin(
      performance.now()/120
    )*.1;

  ctx.scale(s,s);

  ctx.fillStyle="#ffd43b";

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.stroke();

  ctx.restore();

}


function drawDiamond(x,y){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    Math.PI/4
  );

  ctx.fillStyle="#58e8ff";

  ctx.shadowColor="#58e8ff";
  ctx.shadowBlur=25;

  ctx.fillRect(
    -12,
    -12,
    24,
    24
  );

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";

  ctx.strokeRect(
    -12,
    -12,
    24,
    24
  );

  ctx.restore();

}


/* =====================================================
   TŁO
===================================================== */

function createStars(){

  stars=[];

  for(
    let i=0;
    i<80;
    i++
  ){

    stars.push({

      x:Math.random()*W,

      y:
        Math.random()*
        Math.max(
          100,
          ground*.9
        ),

      r:
        Math.random()*2+.4,

      v:
        Math.random()*.8+.2

    });

  }

}


function drawStars(){

  ctx.fillStyle="#fff";

  for(
    const s of stars
  ){

    s.x-=s.v;

    if(s.x<0)
      s.x=W;

    ctx.globalAlpha=
      .25+s.r*.2;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

}


function drawGrid(){

  const c=
    LEVELS[current].color;

  ctx.strokeStyle=c;

  ctx.globalAlpha=.07;

  const size=70;

  const off=
    -(world*.25)%
    size;


  for(
    let x=off;
    x<W;
    x+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      ground
    );

    ctx.stroke();

  }


  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }


  ctx.globalAlpha=1;

}


/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;

    if(
      trail[i].life<=0
    )
      trail.splice(i,1);

  }

  if(
    trail.length>35
  ){

    trail.splice(
      0,
      trail.length-35
    );

  }

}


function drawTrail(){

  const colors={

    neon:"#00eaff",
    fire:"#ff5b32",
    ice:"#8cecff"

  };


  for(
    let i=0;
    i<trail.length;
    i++
  ){

    const t=
      trail[i];

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/.35
      )*.4;


    let c=
      colors[save.trail]||
      "#00eaff";


    if(
      save.trail==="rainbow"
    ){

      const hue=
        (
          i*25+
          performance.now()/5
        )%360;

      c=
        "hsl("+
        hue+
        ",100%,60%)";

    }


    ctx.fillStyle=c;

    ctx.fillRect(
      t.x-7,
      t.y-7,
      14,
      14
    );

  }

  ctx.globalAlpha=1;

}


/* =====================================================
   PARTICLE
===================================================== */

function particle(
  x,
  y,
  vx,
  vy,
  life,
  size,
  type
){

  if(
    particles.length>300
  )return;

  particles.push({

    x,
    y,
    vx,
    vy,
    life,
    max:life,
    size,
    type

  });

}


function particlesJump(){

  for(
    let i=0;
    i<10;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*180,
      Math.random()*80,
      .4,
      4,
      "normal"
    );

  }

}


function particlesDeath(){

  for(
    let i=0;
    i<45;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*600,
      (Math.random()-.5)*600,
      .8,
      Math.random()*7+2,
      "death"
    );

  }

}


function particlesCoin(x,y){

  for(
    let i=0;
    i<22;
    i++
  ){

    particle(
      x,
      y,
      (Math.random()-.5)*300,
      (Math.random()-.5)*300,
      .7,
      4,
      "coin"
    );

  }

}


function particlesDiamond(x,y){

  for(
    let i=0;
    i<35;
    i++
  ){

    particle(
      x,
      y,
      (Math.random()-.5)*350,
      (Math.random()-.5)*350,
      1,
      5,
      "diamond"
    );

  }

}


function particlesPad(x){

  for(
    let i=0;
    i<20;
    i++
  ){

    particle(
      x,
      ground-10,
      (Math.random()-.5)*250,
      -Math.random()*250,
      .7,
      4,
      "pad"
    );

  }

}


function particlesPortal(x){

  for(
    let i=0;
    i<30;
    i++
  ){

    particle(
      x,
      H*.48,
      (Math.random()-.5)*350,
      (Math.random()-.5)*350,
      .8,
      4,
      "portal"
    );

  }

}


function particlesRespawn(){

  for(
    let i=0;
    i<30;
    i++
  ){

    particle(
      player.x+17,
      player.y+17,
      (Math.random()-.5)*250,
      (Math.random()-.5)*250,
      .7,
      5,
      "diamond"
    );

  }

}


function particlesWin(){

  for(
    let i=0;
    i<140;
    i++
  ){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*800,
      (Math.random()-.7)*800,
      1.5+Math.random(),
      Math.random()*8+3,
      "win"
    );

  }

}


function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.life-=dt;

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      500*dt;

    if(
      p.life<=0
    )
      particles.splice(i,1);

  }

}


function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );


    let c=
      LEVELS[current].color;


    if(
      p.type==="coin"
    )
      c="#ffd43b";


    if(
      p.type==="diamond"
    )
      c="#58e8ff";


    if(
      p.type==="pad"
    )
      c="#49ff9a";


    if(
      p.type==="portal"
    )
      c="#ff4be8";


    if(
      p.type==="win"
    ){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      c=
        colors[
          Math.floor(
            Math.random()*
            colors.length
          )
        ];

    }


    ctx.fillStyle=c;

    ctx.fillRect(
      p.x-p.size/2,
      p.y-p.size/2,
      p.size,
      p.size
    );

  }

  ctx.globalAlpha=1;

}


/* =====================================================
   COMBO
===================================================== */

function showCombo(){

  $("combo").textContent=
    "COMBO x"+
    Math.max(
      1,
      combo
    );

  $("combo").style.opacity="1";

  comboTimer=1;

}


function updateCombo(dt){

  if(
    comboTimer>0
  ){

    comboTimer-=dt;

    $("combo").style.opacity=
      Math.max(
        0,
        comboTimer
      );

  }

}


/* =====================================================
   PAUZA
===================================================== */

function togglePause(){

  if(
    !running||
    finished
  )return;

  paused=!paused;

  $("pausePanel").style.display=
    paused?
    "flex":
    "none";


  if(paused){

    stopMusic();

  }else{

    last=
      performance.now();

    accumulator=0;

    if(save.music)
      startMusic();

  }

}


$("pauseBtn").onclick=
  togglePause;


$("resumeBtn").onclick=
  togglePause;


$("restartBtn").onclick=()=>{

  $("pausePanel").style.display=
    "none";

  startLevel(
    current,
    practice
  );

};


$("restartGameBtn").onclick=()=>{

  startLevel(
    current,
    practice
  );

};


$("soundBtn").onclick=()=>{

  save.music=
    !save.music;

  saveGame();

  updateSoundButton();

  if(
    save.music&&
    running
  )
    startMusic();
  else
    stopMusic();

};


function updateSoundButton(){

  $("soundBtn").textContent=
    save.music?
    "🔊":
    "🔇";

}


/* =====================================================
   MENU Z GRY
===================================================== */

$("menuGameBtn").onclick=
  goMenu;

$("pauseMenuBtn").onclick=
  goMenu;


function goMenu(){

  running=false;
  paused=false;
  finished=false;

  stopMusic();

  cancelAnimationFrame(
    raf
  );

  $("game").style.display=
    "none";

  $("pausePanel").style.display=
    "none";

  $("finishPanel").style.display=
    "none";

  $("menu").style.display=
    "block";

  renderMenu();
  renderAchievements();
  renderMissions();
  updateSoundButton();

}


/* =====================================================
   TOUCH
===================================================== */

function updateTouch(){

  $("touchControls").style.display=
    save.touch?
    "flex":
    "none";

}


/* =====================================================
   AUTO PAUSE
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden&&
      running&&
      !paused
    ){

      togglePause();

    }

  }
);


addEventListener(
  "blur",
  ()=>{

    if(
      running&&
      !paused
    ){

      togglePause();

    }

  }
);


/* =====================================================
   START APLIKACJI
===================================================== */

resize();

renderMenu();

renderAchievements();

renderMissions();

renderShop();

renderSettings();

updateSoundButton();

updateTouch();

</script>
