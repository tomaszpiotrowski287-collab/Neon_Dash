function get(k,d="0"){
try{
 const v=localStorage.getItem(k);

}catch(e){return d}
}

function set(k,v){

catch(e){}
}

/* =====================================================
   GENEROWANIE POZIOMÓW
===================================================== */

function spike(x,side="bottom"){
obstacles.push({
type:"spike",
x:x,
side:side
});
}

function saw(x,side="bottom"){
obstacles.push({
type:"saw",
x:x,
r:28,
side:side
});
}

function gap(x,w,side="bottom"){
obstacles.push({
type:"gap",
x:x,
w:w,
side:side
});
}

function gravityPortal(x,target){
portals.push({
type:"gravity",
x:x,
target:target,
used:false
});
}

function speedPortal(x){
portals.push({
type:"speed",
x:x,
used:false
});
}

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

if(portalShield>0){
portalShield-=dt;
}

let speed=
LEVELS[current][2];

world+=speed*dt;

const g=
2100*gravity;

player.vy+=g*dt;
player.y+=player.vy*dt;

const floor=
ground-player.size;

if(gravity===1){

if(
player.y>=floor&&
!gapAtSide("bottom")
){

player.y=floor;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot+=dt*8;
}

}else{

if(
player.y<=0&&
!gapAtSide("top")
){

player.y=0;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot-=dt*8;
}
}

checkPortals();
checkCoins();
collisions();

if(shake>0){
shake-=dt*12;
if(shake<0)shake=0;
}

if(flash>0){
flash-=dt*3;
if(flash<0)flash=0;
}

updateParticles(dt);
updateTrail(dt);
}

function gapAtSide(side){

const center=
world+
player.x+
player.size/2;

for(const o of obstacles){

if(
o.type==="gap"&&
o.side===side&&
center>o.x&&
center<o.x+o.w
){

return true;
}
}

return false;
}

/* =====================================================
   GRAWITACJA
===================================================== */

function checkPortals(){

for(const p of portals){

if(p.used)continue;

const px=
world+
player.x+
player.size/2;

if(
px>p.x&&
px<p.x+65
){

p.used=true;

if(p.type==="gravity"){

gravity=p.target;

if(gravity===1){
player.y=ground-player.size;
}else{
player.y=0;
}

player.vy=0;
player.grounded=true;

portalShield=.5;

particlesPortal(
p.x-world
);

shake=7;
}
}
}
}

/* =====================================================
   MONETY
===================================================== */

function coinY(c){

return c.side==="top"?
120:
ground-125;
}

function checkCoins(){

for(const c of coinObjects){

if(c.collected)continue;

const cx=c.x-world;
const cy=coinY(c);

const px=
player.x+player.size/2;

const py=
player.y+player.size/2;

if(
Math.hypot(px-cx,py-cy)<40
){

c.collected=true;
collected.add(c.id);

runCoins++;

combo+=2;

particlesCoin(cx,cy);

document.getElementById(
"coinHUD"
).textContent=
"🪙 "+runCoins+"/3";
}
}
}

/* =====================================================
   KOLIZJE
===================================================== */

function collisions(){

if(portalShield>0)return;

const left=
world+
player.x+6;

const right=
world+
player.x+
player.size-6;

const top=
player.y+6;

const bottom=
player.y+
player.size-5;

for(const o of obstacles){

if(o.type==="spike"){

if(
o.side==="bottom"&&
right>o.x+6&&
left<o.x+46&&
bottom>ground-46
){

die();
return;
}

if(
o.side==="top"&&
right>o.x+6&&
left<o.x+46&&
top<46
){

die();
return;
}
}

if(o.type==="saw"){

const cx=o.x;

const cy=
o.side==="bottom"?
ground-o.r:
o.r;

const nx=
Math.max(left,Math.min(cx,right));

const ny=
Math.max(top,Math.min(cy,bottom));

const dx=cx-nx;
const dy=cy-ny;

if(
dx*dx+dy*dy<
(o.r-5)*(o.r-5)
){

die();
return;
}
}

if(o.type==="gap"){

const center=
world+
player.x+
player.size/2;

if(
o.side==="bottom"&&
gravity===1&&
center>o.x&&
center<o.x+o.w&&
bottom>=ground-8
){

die();
return;
}

if(
o.side==="top"&&
gravity===-1&&
center>o.x&&
center<o.x+o.w&&
top<=8
){

die();
return;
}
}
}
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

if(!running)return;

if(paused){

last=time;

raf=requestAnimationFrame(loop);

return;
}

let dt=
(time-last)/1000;

if(!Number.isFinite(dt)||dt<0){
dt=0;
}

dt=Math.min(dt,.05);

last=time;

update(dt);
draw();

const length=
11500+
current*600;

if(world>=length){
finishLevel();
}

if(running){
raf=requestAnimationFrame(loop);
}
}

function draw(){

const color=
LEVELS[current][3];

ctx.clearRect(
0,0,W,H
);

ctx.save();

if(shake>0){

ctx.translate(
(Math.random()-.5)*shake,
(Math.random()-.5)*shake
);
}

const grad=
ctx.createLinearGradient(
0,0,0,H
);

grad.addColorStop(
0,
"#080b20"
);

grad.addColorStop(
.55,
color+"18"
);

grad.addColorStop(
1,
"#020207"
);

ctx.fillStyle=grad;

ctx.fillRect(
0,0,W,H
);

drawStars();
drawGrid();

ctx.fillStyle="#0a0d18";

ctx.fillRect(
0,
ground,
W,
H-ground
);

ctx.strokeStyle=color;
ctx.lineWidth=3;
ctx.shadowColor=color;
ctx.shadowBlur=14;

ctx.beginPath();
ctx.moveTo(0,ground);
ctx.lineTo(W,ground);
ctx.stroke();

ctx.shadowBlur=0;

for(const o of obstacles){

const x=o.x-world;

if(x<-100||x>W+100)continue;

if(o.type==="spike"){
drawSpike(o);
}

if(o.type==="saw"){
drawSaw(o);
}

if(o.type==="gap"){

ctx.fillStyle="#020207";

if(o.side==="bottom"){
ctx.fillRect(
x,ground,o.w,H-ground
);
}else{
ctx.fillRect(
x,0,o.w,50
);
}
}
}

for(const p of portals){

const x=p.x-world;

if(x>-100&&x<W+100){
drawPortal(p,x);
}
}

for(const c of coinObjects){

if(c.collected)continue;

const x=c.x-world;

if(x>-60&&x<W+60){

drawCoin(
x,
coinY(c),
c.bonus
);
}
}

drawTrail();

if(!dying&&!finished){
drawPlayer();
}

drawParticles();

ctx.restore();

const length=
11500+
current*600;

const p=Math.min(
100,
Math.floor(world/length*100)
);

document.getElementById(
"percent"
).textContent=p+"%";

document.getElementById(
"gameFill"
).style.width=p+"%";

document.getElementById(
"combo"
).textContent=
"🔥 COMBO x"+Math.floor(combo);
}

/* =====================================================
   OBSTACLES
===================================================== */

function drawSpike(o){

const x=o.x-world;
const color=LEVELS[current][3];

ctx.save();

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=18;

ctx.beginPath();

if(o.side==="bottom"){

ctx.moveTo(x,ground);
ctx.lineTo(x+23,ground-47);
ctx.lineTo(x+46,ground);

}else{

ctx.moveTo(x,0);
ctx.lineTo(x+23,47);
ctx.lineTo(x+46,0);
}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;

ctx.strokeStyle="#fff";
ctx.stroke();

ctx.restore();
}

function drawSaw(o){

const x=o.x-world;
const color=LEVELS[current][3];

const cy=
o.side==="bottom"?
ground-o.r:
o.r;

ctx.save();

ctx.translate(x,cy);

ctx.rotate(
performance.now()/250
);

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=18;

const teeth=14;

ctx.beginPath();

for(let i=0;i<teeth*2;i++){

const a=i*Math.PI/teeth;
const r=i%2===0?o.r:o.r*.68;

const px=Math.cos(a)*r;
const py=Math.sin(a)*r;

if(i===0)
ctx.moveTo(px,py);
else
ctx.lineTo(px,py);
}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;

ctx.fillStyle="#05050c";

ctx.beginPath();

ctx.arc(
0,0,o.r*.28,
0,Math.PI*2
);

ctx.fill();

ctx.restore();
}

   TŁO

function createStars(){

stars=[];

for(let i=0;i<90;i++){

stars.push({
x:Math.random()*W,
y:Math.random()*Math.max(100,ground*.9),
r:Math.random()*2+.4,
v:Math.random()*.8+.15
});
}
}

function drawStars(){

ctx.fillStyle="#fff";

for(const s of stars){

s.x-=s.v;

if(s.x<0)s.x=W;

ctx.globalAlpha=.25+s.r*.2;

ctx.beginPath();

ctx.arc(
s.x,s.y,s.r,
0,Math.PI*2
);

ctx.fill();
}

ctx.globalAlpha=1;
}

function drawGrid(){

const color=
LEVELS[current][3];

ctx.strokeStyle=color;
ctx.globalAlpha=.08;

const size=70;

const off=
-(world*.25)%size;

for(
let x=off;
x<W;
x+=size
){

ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,ground);
ctx.stroke();
}

for(
let y=40;
y<ground;
y+=size
){

ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(W,y);
ctx.stroke();
}

ctx.globalAlpha=1;
}

function updateTrail(dt){

for(

}

t.x-t.size/2,
t.y-t.size/2,
t.size,
t.size
);

ctx.shadowBlur=0;
}

function particlesCoin(x,y){

for(let i=0;i<22;i++){

function particlesPortal(x){

x,H*.48,
(Math.random()-.5)*320,

);

function updateParticles(dt){

for(
let i=particles.length-1;
i>=0;
i--
){

const p=particles[i];

p.life-=dt;
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.vy+=500*dt;
p.rot+=p.spin*dt;

if(p.life<=0){
particles.splice(i,1);
}
}
}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=
Math.max(0,p.life/p.max);

let color=
LEVELS[current][3];

if(p.type==="coin")
color="#ffd43b";

if(p.type==="portal")
color="#ff4be8";

if(p.type==="win"){

const colors=[
"#00eaff",
"#ff27d7",
"#ffe14a",
"#49ff9a",
"#a855ff"
];

color=
colors[
Math.floor(
Math.random()*colors.length
)
];
}

ctx.fillStyle=color;

ctx.save();

ctx.translate(p.x,p.y);
ctx.rotate(p.rot);

ctx.shadowColor=color;
ctx.shadowBlur=10;

ctx.fillRect(
-p.size/2,
-p.size/2,
p.size,
p.size
);

ctx.restore();
}

ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

/* =====================================================
   DŹWIĘK
===================================================== */

function startMusic(){

stopMusic();

try{

if(!audio){

audio=new(
window.AudioContext||
window.webkitAudioContext
)();
}

if(audio.state==="suspended"){
audio.resume();
}

const notes=[
262,330,392,523,
392,330,294,330
];

musicIndex=0;

function note(){

if(!sound||!running||paused)return;

const osc=
audio.createOscillator();

const gain=
audio.createGain();

osc.type=
current%2===0?
"triangle":
"square";

osc.frequency.value=
notes[
musicIndex%notes.length
];

gain.gain.setValueAtTime(
.035,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+.16
);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();

osc.stop(
audio.currentTime+.17
);

musicIndex++;
}

note();

musicTimer=
setInterval(
note,
60000/LEVELS[current][4]
);

}catch(e){}
}

function stopMusic(){

if(musicTimer){

clearInterval(musicTimer);
musicTimer=null;
}
}

menu.style.display="block";

pause.style.display="none";

   VICTORY
===================================================== */

function victoryAnimation(){

let frames=0;

function anim(){

if(!finished)return;

updateParticles(.016);
draw();

frames++;

if(frames<150){
requestAnimationFrame(anim);
}
}

requestAnimationFrame(anim);
}

()=>{

if(

){
