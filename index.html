<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Dash 2.5</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03030a;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  color:#fff;
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

#menu{
  position:fixed;
  inset:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    max(30px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 0%,#29327d,#090a20 43%,#020207 100%);
}

.logo{
  margin:10px 0 3px;
  font-size:clamp(32px,8vw,58px);
  font-weight:900;
  letter-spacing:clamp(2px,1vw,7px);
  text-align:center;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 50px #a855ff;
  animation:logoPulse 1.8s infinite alternate;
}

@keyframes logoPulse{
  from{transform:scale(1)}
  to{transform:scale(1.025)}
}

.subtitle{
  opacity:.72;
  text-align:center;
  font-size:clamp(12px,3vw,17px);
  margin-bottom:14px;
}

.topCards{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px;
}

.topCard{
  min-width:0;
  background:#10142b;
  border:1px solid #35416f;
  border-radius:16px;
  padding:11px;
  text-align:center;
  box-shadow:0 0 20px #0005;
}

.topCard small{
  display:block;
  opacity:.6;
  margin-bottom:4px;
}

.topCard b{
  font-size:clamp(15px,4vw,22px);
}

.progress{
  width:min(900px,100%);
  background:#11152d;
  border:2px solid #303963;
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
}

.progressTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:bold;
}

.bar{
  height:12px;
  background:#050712;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

#menuBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 14px #00eaff;
  transition:.35s;
}

#doneText{
  text-align:center;
  opacity:.65;
  margin-top:7px;
  font-size:13px;
}

.quick{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.quick button,
#achBtn{
  min-height:46px;
  padding:10px;
  border-radius:13px;
  background:#202750;
  border:1px solid #465582;
  font-weight:bold;
}

.quick button:hover,
#achBtn:hover{
  border-color:#00eaff;
}

#dailyCard{
  width:min(900px,100%);
  padding:14px;
  margin-bottom:12px;
  border-radius:17px;
  border:2px solid #8d5cff;
  background:
    linear-gradient(135deg,#25164d,#11152d);
  box-shadow:0 0 25px #8d5cff22;
}

.dailyTitle{
  font-weight:900;
  font-size:18px;
}

.dailyInfo{
  opacity:.72;
  margin-top:4px;
  font-size:13px;
}

#dailyBtn{
  margin-top:10px;
  width:100%;
  min-height:44px;
  border-radius:12px;
  background:#7c4dff;
  font-weight:bold;
}

.searchRow{
  width:min(900px,100%);
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

#search{
  flex:1;
  min-width:0;
  min-height:44px;
  padding:10px 13px;
  color:#fff;
  background:#0d1125;
  border:1px solid #39476f;
  border-radius:12px;
  outline:none;
}

#search:focus{
  border-color:#00eaff;
}

#levels{
  width:min(900px,100%);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding-bottom:20px;
}

.level{
  min-width:0;
  min-height:94px;
  text-align:left;
  padding:12px;
  border-radius:15px;
  border:2px solid #303861;
  background:linear-gradient(135deg,#171c3b,#0d1024);
  position:relative;
  overflow:hidden;
}

.level:hover{
  border-color:#00eaff;
}

.levelStatus{
  float:right;
  font-size:20px;
}

.levelName{
  font-weight:900;
  font-size:clamp(14px,3.5vw,18px);
  padding-right:28px;
}

.levelInfo{
  font-size:12px;
  opacity:.7;
  margin-top:5px;
}

.levelBest{
  font-size:11px;
  color:#ffd43b;
  margin-top:5px;
}

.favorite{
  position:absolute;
  right:9px;
  bottom:7px;
  opacity:.75;
  font-size:16px;
}

#achBtn{
  width:min(900px,100%);
  margin-bottom:20px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:15px;
}

.panel{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#10142c;
  border:2px solid #3d4a7d;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 40px #00eaff22;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

.panel button{
  width:100%;
  min-height:44px;
  margin-top:9px;
  padding:10px;
  border-radius:12px;
  background:#29335e;
  font-weight:bold;
}

.ach{
  padding:11px;
  margin:7px 0;
  border-radius:12px;
  background:#191e3b;
  opacity:.4;
}

.ach.on{
  opacity:1;
  border:1px solid #00eaff;
}

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  padding:12px;
  background:#191e3b;
  border-radius:12px;
}

.shopItem{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:#191e3b;
  border:1px solid #303861;
}

.shopItem button{
  margin-top:7px;
}

.mission{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:#191e3b;
}

.mission.done{
  border:1px solid #49ff9a;
}

#game{
  position:fixed;
  inset:0;
  display:none;
  touch-action:none;
  overscroll-behavior:none;
  background:#03030a;
}

canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:5;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

.hudLine{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(11px,2.8vw,17px);
  font-weight:bold;
}

.hudBar{
  margin-top:7px;
  height:9px;
  background:#0008;
  border-radius:20px;
  overflow:hidden;
}

#gameBar{
  height:100%;
  width:0;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
}

.gameButtons{
  position:absolute;
  right:max(10px,env(safe-area-inset-right));
  top:max(10px,env(safe-area-inset-top));
  z-index:10;
  display:flex;
  gap:7px;
}

.gameButtons button{
  min-width:44px;
  min-height:44px;
  padding:8px 11px;
  background:#10162ddd;
  border:1px solid #53618e;
  border-radius:10px;
}

#pause,
#finish{
  z-index:20;
}

.finishStats{
  text-align:center;
  opacity:.8;
  line-height:1.7;
}

@media(max-width:650px){
  .topCards{
    grid-template-columns:repeat(3,1fr);
  }

  .quick{
    grid-template-columns:repeat(2,1fr);
  }

  #levels{
    grid-template-columns:1fr;
  }
}

@media(max-height:520px){
  .logo{
    margin:3px 0;
    font-size:30px;
  }

  .subtitle{
    margin-bottom:5px;
  }

  .topCards,
  .dailyCard{
    display:none;
  }
}
</style>

</head>

/* =====================================================

===================================================== */

function get(key,def){
  try{
    const value=localStorage.getItem(key);
    return value===null?def:value;
  }catch(e){
    return def;
  }
}

function set(key,value){
  try{
    localStorage.setItem(key,String(value));
  }catch(e){}
}

function getNum(key,def=0){
  const n=Number(get(key,String(def)));
  return Number.isFinite(n)?n:def;
}

function completed(i){
  return get("nd_level_"+i,"0")==="1";
}

function completedCount(){
  let n=0;
  for(let i=0;i<LEVELS.length;i++){
    if(completed(i)) n++;
  }
  return n;
}

  return getNum("nd_totalCoins",0);
}

  set("nd_totalCoins",totalCoins()+n);
}

function addXP(n){

}

}

}

function startLevel(index){

  if(typeof index!=="number"){
    index=Number(index);
  }

  if(
    !Number.isInteger(index)||
    index<0||
    index>=LEVELS.length
  ){

    return;
  }

  try{

    current=index;

    running=false;
    paused=false;
    finished=false;
    dying=false;

    if(raf){
      cancelAnimationFrame(raf);
      raf=0;
    }

    stopMusic();

    deaths=0;
    runCoins=0;
    combo=0;
    bestCombo=0;

    collected=new Set();

    world=0;
    shake=0;
    flash=0;

    gravity=
      index===9?
      -1:
      1;

    obstacles=[];
    coinObjects=[];
    pads=[];
    portals=[];
    particles=[];
    trail=[];
    stars=[];

    menu.style.display="none";
    game.style.display="block";

    pause.style.display="none";
    finish.style.display="none";

    resetPlayer();

      error.message
    );

  }
}

/* =====================================================
   GENEROWANIE POZIOMU
===================================================== */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];

  /*
    Poziomy stają się stopniowo dłuższe.
  */
  const length=
    10000+
    current*430;

  let x=620;

  /*
    Każdy poziom ma własny zestaw wzorów.
    Brak Triple Spike.
  */
  const patternSets=[
    ["spike","spike","saw","gap","spike","pad"],
    ["spike","double","saw","gap","pad","spike"],
    ["saw","spike","gap","double","speed","saw"],
    ["spike","pad","saw","gap","spike","speed"],
    ["double","saw","spike","gap","pad","speed"],
    ["saw","double","gap","spike","gravity","saw"],
    ["speed","spike","saw","double","gap","pad"],
    ["saw","gravity","spike","speed","double","gap"]
  ];

  const setIndex=
    current%patternSets.length;

  const patterns=
    patternSets[setIndex];

  let p=0;

  while(x<length-500){

    const type=
      patterns[p%patterns.length];

    if(type==="spike"){
      spike(x);
      x+=390;
    }

    else if(type==="double"){
      spike(x);
      spike(x+62);
      x+=540;
    }

    else if(type==="saw"){
      saw(x);
      x+=500;
    }

    else if(type==="gap"){
      gap(x,135);
      x+=590;
    }

    else if(type==="pad"){
      pad(x);
      spike(x+210);
      x+=620;
    }

    else if(type==="speed"){
      speedPortal(x);
      spike(x+230);
      saw(x+470);
      x+=760;
    }

    else if(type==="gravity"){
      gravityPortal(x);
      spike(x+280);
      x+=730;
    }

    p++;
  }

  /*
    Dokładnie 3 monety na każdy poziom.
    Ich pozycje są sprawdzane względem przeszkód.
  */
  const targets=[
    length*.25,
    length*.52,
    length*.79
  ];

  targets.forEach((target,i)=>{

    let finalX=target;

    for(let attempt=0;attempt<60;attempt++){

      let bad=false;

      for(const o of obstacles){

        const distance=
          Math.abs(finalX-o.x);

        if(o.type==="gap"){

          if(
            finalX>o.x-80&&
            finalX<o.x+o.w+80
          ){
            bad=true;
            break;
          }

        }else if(distance<100){

          bad=true;
          break;
        }
      }

      if(!bad) break;

      finalX+=95;
    }

    coinObjects.push({
      id:i,
      x:finalX,
      collected:false
    });
  });
}

/* =====================================================
   OBIEKTY
===================================================== */

function spike(x){
  obstacles.push({
    type:"spike",
    x:x
  });
}

function saw(x){
  obstacles.push({
    type:"saw",
    x:x,
    r:27
  });
}

function gap(x,w){
  obstacles.push({
    type:"gap",
    x:x,
    w:w
  });
}

function pad(x){
  pads.push({
    x:x,
    used:false
  });
}

function speedPortal(x){
  portals.push({
    type:"speed",
    x:x,
    used:false
  });
}

function gravityPortal(x){
  portals.push({
    type:"gravity",
    x:x,
    used:false
  });
}

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  const level=LEVELS[current];

  let speed=level[2];

  for(const p of portals){

    if(
      p.type==="speed"&&
      world+player.x>
        p.x-20&&
      world+player.x<
        p.x+180
    ){
      speed*=1.16;
    }
  }

  world+=speed*dt;

  const g=
    2050*gravity;

  player.vy+=g*dt;
  player.y+=player.vy*dt;

  if(gravity===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*(Math.PI/2);

    }else{

      player.grounded=false;
      player.rot+=dt*8;
    }

  }else{

    if(
      player.y<=0&&
      !gapUnder()
    ){

      player.y=0;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;
    }
  }

  checkPads();
  checkPortals();
  checkCoins();
  collisions();

  if(Math.random()<.9){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.32,
      size:18
    });
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){
    shake=Math.max(0,shake-dt*13);
  }

  if(flash>0){
    flash=Math.max(0,flash-dt*3);
  }
}

function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;

  for(const o of obstacles){

    if(
      o.type==="gap"&&
      center>o.x&&
      center<o.x+o.w
    ){
      return true;
    }
  }

  return false;
}

/* =====================================================
   MECHANIKI
===================================================== */

function checkPads(){

  for(const p of pads){

    if(p.used) continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+55&&
      player.grounded&&
      gravity===1
    ){

      p.used=true;

      player.vy=-980;
      player.grounded=false;

      createPadParticles(
        p.x-world
      );

      shake=5;
    }
  }
}

function checkPortals(){

  for(const p of portals){

    if(p.used) continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+60
    ){

      p.used=true;

      if(p.type==="gravity"){

        gravity*=-1;

        player.vy=0;
        player.grounded=false;

        createPortalParticles(
          p.x-world
        );

        shake=7;
      }
    }
  }
}

function checkCoins(){

  for(const c of coinObjects){

    if(c.collected) continue;

    const cx=
      c.x-world;

    const cy=
      gravity===1?
      ground-125:
      125;

    const px=
      player.x+17;

    const py=
      player.y+17;

    if(
      Math.hypot(
        px-cx,
        py-cy
      )<38
    ){

      c.collected=true;

      collected.add(c.id);

      runCoins=collected.size;

      combo++;

      if(combo>bestCombo){
        bestCombo=combo;
      }

      coinsText.textContent=
        "🪙 "+runCoins+"/3";

      createCoinParticles(cx,cy);

      shake=3;
    }
  }
}

/* =====================================================
   KOLIZJE
===================================================== */

function collisions(){

  const px=
    world+
    player.x;

  const s=player.size;

  const left=px+7;
  const right=px+s-7;
  const top=player.y+7;
  const bottom=player.y+s-5;

  for(const o of obstacles){

    if(o.type==="spike"){

      if(
        gravity===1&&
        right>o.x+6&&
        left<o.x+46&&
        bottom>ground-45
      ){
        die();
        return;
      }

      if(
        gravity===-1&&
        right>o.x+6&&
        left<o.x+46&&
        top<46
      ){
        die();
        return;
      }
    }

    if(o.type==="saw"){

      const cx=o.x;

      const cy=
        gravity===1?
        ground-o.r:
        o.r;

      const nx=
        Math.max(
          left,
          Math.min(cx,right)
        );

      const ny=
        Math.max(
          top,
          Math.min(cy,bottom)
        );

      const dx=cx-nx;
      const dy=cy-ny;

      if(
        dx*dx+
        dy*dy<
        (o.r-6)*(o.r-6)
      ){
        die();
        return;
      }
    }

    if(o.type==="gap"){

      const center=
        world+
        player.x+
        s/2;

      if(
        gravity===1&&
        center>o.x&&
        center<o.x+o.w&&
        bottom>=ground-7
      ){
        die();
        return;
      }
    }
  }
}

function die(){

  if(
    dying||
    finished||
    !running
  ){
    return;

  dying=true;
  running=false;

  deaths++;
  addDeath();

  combo=0;

  shake=14;
  flash=1;

  setTimeout(()=>{

    if(finished) return;

    dying=false;

    /*
      Restart jest całkowity.
      To usuwa problemy z uszkodzonym stanem obiektów.
    */
    startLevel(current);

  },550);
}

function updateStreak(){

  const today=
    new Date().toDateString();

  const lastDay=
    get("nd_lastFinish","");

  if(lastDay===today){
    return;
  }

  const previous=
    getNum("nd_streak",0);

  set(
    "nd_streak",
    previous+1
  );

  set(
    "nd_lastFinish",
    today
  );
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running){
    return;
  }

  if(paused){

    last=time;

    raf=requestAnimationFrame(loop);

    return;
  }

  let dt=
    (time-last)/1000;

  if(
    !Number.isFinite(dt)||
    dt<0
  ){
    dt=0;
  }

  dt=Math.min(dt,.045);

  last=time;

  update(dt);
  draw();
  checkWin();

  if(running){
    raf=requestAnimationFrame(loop);
  }
}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  levelName.textContent=
    (current+1)+" • "+LEVELS[current][0];

  coinsText.textContent=
    "🪙 "+runCoins+"/3";

  percent.textContent="0%";
  gameBar.style.width="0%";
}

/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

  const color=
    LEVELS[current][3];

  ctx.clearRect(
    0,0,W,H
  );

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  const bg=
    ctx.createLinearGradient(
      0,0,0,H
    );

  bg.addColorStop(0,"#080b20");
  bg.addColorStop(1,"#020207");

  ctx.fillStyle=bg;

  ctx.fillRect(
    0,0,W,H
  );

  drawStars();
  drawGrid();
  drawSpeedLines();

  ctx.fillStyle="#0b0d18";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle=color;
  ctx.lineWidth=3;
  ctx.shadowColor=color;
  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.moveTo(0,ground);
  ctx.lineTo(W,ground);

  ctx.stroke();

  ctx.shadowBlur=0;

  for(const o of obstacles){

    const x=o.x-world;

    if(
      x<-150||
      x>W+150
    ){
      continue;
    }

    if(o.type==="spike"){
      drawSpike(x);
    }

    else if(o.type==="saw"){
      drawSaw(x,o.r);
    }

    else if(o.type==="gap"){

      ctx.fillStyle="#020207";

      ctx.fillRect(
        x,
        ground,
        o.w,
        H-ground
      );
    }
  }

  for(const p of pads){

    const x=p.x-world;

    if(
      x>-80&&
      x<W+80
    ){
      drawPad(x);
    }
  }

  for(const p of portals){

    const x=p.x-world;

    if(
      x>-100&&
      x<W+100
    ){

      if(p.type==="speed"){
        drawSpeedPortal(x);
      }else{
        drawGravityPortal(x);
      }
    }
  }

  for(const c of coinObjects){

    if(c.collected) continue;

    const x=c.x-world;

    if(
      x>-50&&
      x<W+50
    ){

      drawCoin(
        x,
        gravity===1?
        ground-125:
        125
      );
    }
  }

  drawTrail();

  if(!dying&&!finished){
    drawPlayer();
  }

  drawParticles();

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(.5,flash*.5)+
      ")";

    ctx.fillRect(
      0,0,W,H
    );
  }

  ctx.restore();

  const length=
    10000+
    current*430;

  const p=Math.min(
    100,
    Math.floor(

/* =====================================================

===================================================== */

function currentSkinColor(){

  for(const s of SKINS){

    if(s[0]===selectedSkin){
      return s[2];

  return LEVELS[current][3];

/* =====================================================
   PRZESZKODY
===================================================== */

function drawSpike(x){

  const color=
    LEVELS[current][3];

  ctx.save();

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=16;

  ctx.beginPath();

  if(gravity===1){

    ctx.moveTo(x,ground);
    ctx.lineTo(x+23,ground-47);
    ctx.lineTo(x+46,ground);

  }else{

    ctx.moveTo(x,0);
    ctx.lineTo(x+23,47);
    ctx.lineTo(x+46,0);
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.strokeStyle="#fff";
  ctx.stroke();

  ctx.restore();
}

function drawSaw(x,r){

  const color=
    LEVELS[current][3];

  const cy=
    gravity===1?
    ground-r:
    r;

  ctx.save();

  ctx.translate(x,cy);

  ctx.rotate(
    performance.now()/280
  );

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=17;

  const teeth=14;

  ctx.beginPath();

  for(let i=0;i<teeth*2;i++){

    const a=i*Math.PI/teeth;
    const rr=i%2===0?r:r*.7;

    const xx=Math.cos(a)*rr;
    const yy=Math.sin(a)*rr;

    if(i===0){
      ctx.moveTo(xx,yy);
    }else{
      ctx.lineTo(xx,yy);
    }
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,0,r*.28,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawCoin(x,y){

  const s=
    1+
    Math.sin(
      performance.now()/130
    )*.1;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.fillStyle="#ffd43b";

  ctx.beginPath();

  ctx.arc(
    0,0,14,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.fillStyle="#7c5b00";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText("★",0,5);

  ctx.restore();
}

/* =====================================================
   TŁO
===================================================== */

function createStars(){

  stars=[];

  for(let i=0;i<75;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*
        Math.max(100,ground*.9),
      r:Math.random()*2+.5,
      v:Math.random()*.8+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="#fff";

  for(const s of stars){

    s.x-=s.v;

    if(s.x<0){
      s.x=W;
    }

    ctx.globalAlpha=
      .3+s.r*.2;

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const color=
    LEVELS[current][3];

  ctx.strokeStyle=color;
  ctx.globalAlpha=.08;

  const size=70;

  const off=
    -(world*.25)%size;

  for(
    let x=off;
    x<W;
    x+=size
  ){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,ground);
    ctx.stroke();
  }

  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const color=
    LEVELS[current][3];

  ctx.strokeStyle=color;
  ctx.globalAlpha=.12;
  ctx.lineWidth=2;

  const off=
    -(world*.8)%190;

  for(
    let x=off-190;
    x<W+190;
    x+=190
  ){

    const y=
      100+
      Math.abs(x*7)%
      Math.max(100,ground-150);

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+80,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =====================================================
   TRAIL
===================================================== */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;

    if(trail[i].life<=0){
      trail.splice(i,1);
    }
  }

  if(trail.length>35){
    trail.splice(
      0,
      trail.length-35
    );
  }
}

function drawTrail(){

  const color=
    currentSkinColor();

  for(const t of trail){

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/.32
      )*.32;

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    ctx.fillRect(
      t.x-t.size/2,
      t.y-t.size/2,
      t.size,
      t.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================

===================================================== */

function particle(
  x,y,vx,vy,life,size,type
){

  if(particles.length>280){
    return;
  }

  particles.push({
    x:x,
    y:y,
    vx:vx,
    vy:vy,
    life:life,
    max:life,
    size:size,
    type:type,
    rot:Math.random()*6,
    spin:(Math.random()-.5)*10
  });
}

function createPadParticles(x){

}

function createPortalParticles(x){

  for(let i=0;i<30;i++){

    particle(

function createWinParticles(){

  for(let i=0;i<130;i++){

    particle(
      W/2,
      H*.35,
      (Math.random()-.5)*700,
      (Math.random()-.8)*700,
      1.5+Math.random(),
      Math.random()*8+3,
      "win"
    );
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=500*dt;
    p.rot+=p.spin*dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );

    let color=
      LEVELS[current][3];

    if(p.type==="coin"){
      color="#ffd43b";
    }

    if(p.type==="pad"){
      color="#49ff9a";
    }

    if(p.type==="portal"){
      color="#ff4be8";
    }

    if(p.type==="win"){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      color=
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ];
    }

    ctx.fillStyle=color;

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(p.rot);

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -p.size/2,
      -p.size/2,
      p.size,
      p.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =====================================================
   MUZYKA
===================================================== */

function startMusic(){

  stopMusic();

  try{

    if(!audio){

      audio=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    if(audio.state==="suspended"){
      audio.resume();
    }

    const level=LEVELS[current];

    const notes=[
      220,
      277,
      330,
      440,
      523,
      440,
      330,
      277
    ];

    musicIndex=0;

    function note(){

      if(
        !sound||
        !running||
        paused
      ){
        return;
      }

      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();

      const base=
        notes[
          musicIndex%notes.length
        ];

      osc.type=
        current%3===0?
        "square":
        current%3===1?
        "triangle":
        "sine";

      osc.frequency.value=
        base+
        current*2;

      gain.gain.setValueAtTime(
        .025,
        audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+.16
      );

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();

      osc.stop(
        audio.currentTime+.17
      );

      musicIndex++;
    }

    note();

    musicTimer=
      setInterval(
        note,
        60000/level[4]
      );

  }catch(e){
    console.warn("Audio unavailable",e);
  }
}

function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}

===================================================== */

function togglePause(){

  if(!running){
    return;
  }

  paused=!paused;

  pause.style.display=
    paused?
    "flex":
    "none";

  if(paused){

    stopMusic();

  }else{

    last=performance.now();

    if(sound){
      startMusic();
    }
  }
}

/* =====================================================
   SKLEP
===================================================== */

function owned(item){
  return get(
    "nd_owned_"+item,
    "0"
  )==="1";
}

function renderShop(){

  shopList.innerHTML="";

  const coins=totalCoins();

  document.getElementById(
    "shopCoins"
  ).textContent=
    "Masz "+coins+" 🪙";

  SKINS.forEach(s=>{

    const unlocked=
      completedCount()>=s[3];

    const div=
      document.createElement("div");

    div.className="shopItem";

    div.innerHTML=
      "<b style=\"color:"+s[2]+"\">⬛ "+s[1]+"</b><br>"+
      "<small>"+
      (
        unlocked?
        "Odblokowany":
        "Odblokuj po ukończeniu "+s[3]+" poziomów"
      )+
      "</small>";

    const btn=
      document.createElement("button");

    btn.textContent=
      selectedSkin===s[0]?
      "✅ WYBRANY":
      unlocked?
      "UŻYJ":
      "🔒 ZABLOKOWANY";

    btn.disabled=!unlocked;

    btn.addEventListener(
      "click",
      ()=>{
        selectedSkin=s[0];
        set("nd_skin",selectedSkin);
        renderShop();
      }
    );

    div.appendChild(btn);
    shopList.appendChild(div);
  });

  SHOP.forEach(item=>{

    const div=
      document.createElement("div");

    div.className="shopItem";

    const have=
      owned(item[0]);

    div.innerHTML=
      "<b>"+item[1]+"</b><br>"+
      "<small>"+item[2]+" 🪙</small>";

    const btn=
      document.createElement("button");

    btn.textContent=
      have?
      "✅ KUPIONO":
      "KUP";

    btn.disabled=
      have||
      coins<item[2];

    btn.addEventListener(
      "click",
      ()=>{
        if(totalCoins()<item[2]){
          return;
        }

        set(
          "nd_totalCoins",
          totalCoins()-item[2]
        );

        set(
          "nd_owned_"+item[0],
          "1"
        );

        set("nd_bought","1");

        checkAchievements();
        renderShop();
        renderMenu();
      }
    );

    div.appendChild(btn);
    shopList.appendChild(div);
  });
}

    renderShop();

function missionDone(id){

  if(id==="levels3"){
    return completedCount()>=3;
  }

  if(id==="levels10"){
    return completedCount()>=10;
  }

  if(id==="coins25"){
    return totalCoins()>=25;
  }

  if(id==="coins50"){
    return totalCoins()>=50;
  }

  if(id==="deaths10"){
    return deathsTotal()>=10;
  }

  return false;
}

function renderMissions(){

  missionList.innerHTML="";

  MISSIONS.forEach(m=>{

    const done=missionDone(m[0]);

    const d=document.createElement("div");

    d.className=
      "mission"+
      (done?" done":"");

    d.innerHTML=
      "<b>"+(done?"✅ ":"🎯 ")+m[1]+"</b><br>"+
      "<small>"+
      (done?"MISJA UKOŃCZONA":"Postęp zapisuje się automatycznie.")+
      "</small>";

    missionList.appendChild(d);
  });
}

/* =====================================================
   VICTORY
===================================================== */

function victoryAnimation(){

  let frames=0;

  function anim(){

    if(!finished){
      return;
    }

    updateParticles(.016);
    draw();

    frames++;

    if(frames<100){
      requestAnimationFrame(anim);
    }
  }

  requestAnimationFrame(anim);
}
