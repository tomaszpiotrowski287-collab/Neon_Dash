<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#03030a;
color:white;
font-family:Arial,sans-serif;
}

button{
font:inherit;
color:white;
border:0;
cursor:pointer;
user-select:none;
-webkit-user-select:none;
touch-action:manipulation;
}

button:active{
transform:scale(.96);
}

#menu{
position:fixed;
inset:0;
z-index:50;
overflow:auto;
display:flex;
flex-direction:column;
align-items:center;
padding:18px 14px 35px;
background:
radial-gradient(circle at 50% 0%,#30398d,#101333 35%,#050610 70%,#020207);
}

.logo{
margin:10px 0 2px;
font-size:clamp(34px,8vw,64px);
font-weight:900;
letter-spacing:5px;
text-align:center;
text-shadow:
0 0 10px #00eaff,
0 0 25px #00eaff,
0 0 50px #8c4dff,
0 0 80px #ff20d4;
animation:logoPulse 1.5s infinite alternate;
}

@keyframes logoPulse{
from{transform:scale(1)}
to{transform:scale(1.035)}
}

.subtitle{
opacity:.7;
margin-bottom:15px;
text-align:center;
}

.menuStats{
width:min(720px,100%);
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px;
}

.stat{
background:#11152d;
border:1px solid #394570;
border-radius:13px;
padding:10px;
text-align:center;
}

.stat b{
display:block;
font-size:18px;
}

.stat small{
opacity:.6;
}

.progress{
width:min(720px,100%);
background:#11152d;
border:2px solid #303963;
border-radius:17px;
padding:15px;
margin-bottom:12px;
}

.progressTop{
display:flex;
justify-content:space-between;
font-weight:bold;
}

.bar{
height:13px;
background:#050712;
border-radius:20px;
overflow:hidden;
margin-top:8px;
}

#menuBar{
height:100%;
width:0;
background:linear-gradient(90deg,#00eaff,#765cff,#ff27d7);
box-shadow:0 0 15px #00eaff;
transition:.3s;
}

#doneText{
text-align:center;
opacity:.65;
margin-top:7px;
font-size:13px;
}

.menuButtons{
width:min(720px,100%);
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px;
}

.menuButtons button{
min-height:48px;
border-radius:13px;
background:#20274b;
border:1px solid #45517e;
font-weight:bold;
}

#levels{
width:min(720px,100%);
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.level{
min-height:88px;
text-align:left;
padding:12px;
border-radius:15px;
border:2px solid #303861;
background:linear-gradient(135deg,#171c3b,#0d1024);
position:relative;
overflow:hidden;
}

.level.locked{
opacity:.5;
filter:grayscale(.4);
}

.levelStatus{
float:right;
font-size:20px;
}

.levelName{
font-weight:900;
font-size:17px;
padding-right:28px;
}

.levelInfo{
font-size:12px;
opacity:.7;
margin-top:5px;
}

.levelBest{
font-size:11px;
opacity:.55;
margin-top:5px;
}

#achievements,

#missions,

position:fixed;
inset:0;
z-index:100;
display:none;
align-items:center;
justify-content:center;

width:min(600px,100%);

.ach.on{

}

padding:12px 5px;
border-radius:13px;
background:#191e3b;

text-align:center;
}

.skin.selected{
border-color:#00eaff;
box-shadow:0 0 15px #00eaff44;

.skinPreview{
width:38px;
height:38px;
margin:0 auto 7px;
border-radius:6px;
box-shadow:0 0 15px currentColor;
}

.skin small{
display:block;
opacity:.7;

}

.mission{

padding:12px;
border-radius:12px;

.missionBar{
height:7px;
background:#050712;
border-radius:10px;
overflow:hidden;
margin-top:7px;
}

.missionFill{
height:100%;
background:#49ff9a;
}

#game{
position:fixed;
inset:0;
display:none;
touch-action:none;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
touch-action:none;
}

#hud{
position:absolute;
z-index:4;
left:10px;
right:10px;
top:10px;
pointer-events:none;
text-shadow:0 2px 5px #000;
}

.hudLine{
display:flex;
justify-content:space-between;
gap:7px;
font-size:clamp(11px,2.7vw,17px);
font-weight:bold;
}

.hudBar{
margin-top:7px;
height:9px;
background:#0008;
border-radius:20px;
overflow:hidden;
}

#gameBar{
height:100%;
width:0;
background:#00eaff;

}

#comboText{
position:absolute;
top:70px;
left:50%;
transform:translateX(-50%);
font-size:24px;
font-weight:900;
opacity:0;
text-shadow:0 0 15px currentColor;

.gameButtons{
position:absolute;
right:10px;
top:10px;
z-index:10;
display:flex;
gap:7px;

.gameButtons button{
min-width:44px;

padding:8px 11px;

border:1px solid #53618e;
border-radius:10px;

#practiceLabel{
position:absolute;
left:50%;
bottom:15px;
transform:translateX(-50%);

font-size:12px;

}

@media(max-width:650px){

@media(max-width:430px){

}

/* =====================================================
   STORAGE
===================================================== */

function get(key,def){
try{
const value=localStorage.getItem(key);
return value===null?def:value;
}catch{
return def;
}
}

function set(key,value){
try{
localStorage.setItem(key,String(value));
}catch{}
}

function num(key,def=0){
const n=Number(get(key,def));
return Number.isFinite(n)?n:def;
}

function completed(i){
return get("nd_level_"+i,"0")==="1";
}

function completedCount(){

let n=0;

for(let i=0;i<LEVELS.length;i++){
if(completed(i))n++;
}

return n;
}

function achUnlocked(id){
return get("nd_ach_"+id,"0")==="1";
}

if(achUnlocked(id))return;

set("nd_ach_"+id,"1");

renderAchievements();
}

function checkAchievements(){

const n=completedCount();
const coins=num("nd_totalCoins");
const diamonds=num("nd_diamonds");

if(n>=1)unlock("first");
if(n>=3)unlock("three");
if(n>=6)unlock("six");
if(n>=10)unlock("ten");
if(n>=LEVELS.length)unlock("all");

if(completed(LEVELS.length-1))
unlock("final");

if(coins>=10)unlock("coins10");
if(coins>=50)unlock("coins50");

if(diamonds>=10)unlock("diamonds10");

if(deaths===0)unlock("perfect");

if(bestCombo>=10)unlock("combo10");

if(practiceMode&&finished)
unlock("practice");

if(runCoins===3)
unlock("allcoins");

if(deaths===0)
unlock("speed");

let owned=0;

for(let i=0;i<SKINS.length;i++){
if(ownedSkin(i))owned++;
}

if(owned>=5)
unlock("skins");
}

});

===================================================== */

let audio=null;
let masterGain=null;
let musicTimer=null;
let musicIndex=0;

let sound=
get("nd_sound","1")==="1";

function initAudio(){

if(audio)return true;

try{

const AudioClass=
window.AudioContext||
window.webkitAudioContext;

if(!AudioClass)return false;

audio=
new AudioClass();

masterGain=
audio.createGain();

masterGain.gain.value=.8;

masterGain.connect(
audio.destination
);

return true;

}catch{

audio=null;
masterGain=null;

return false;
}
}

function startMusic(){

stopMusic();

if(!sound)return;

if(!initAudio())return;

try{

if(audio.state==="suspended")
audio.resume();

}catch{}

const level=
LEVELS[current];

musicIndex=0;

function note(){

if(
!sound||
!running||
paused||
!audio||
audio.state!=="running"
)return;

try{

const osc=
audio.createOscillator();

const gain=
audio.createGain();

const now=
audio.currentTime;

osc.type=
level.wave;

osc.frequency.value=
level.notes[
musicIndex%
level.notes.length
];

gain.gain.setValueAtTime(
.0001,
now
);

gain.gain.exponentialRampToValueAtTime(
.06,
now+.015
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.2
);

osc.connect(gain);
gain.connect(masterGain);

osc.start(now);
osc.stop(now+.22);

musicIndex++;

}catch{}
}

note();

musicTimer=
setInterval(
note,
60000/level.bpm
);
}

function stopMusic(){

if(musicTimer){

clearInterval(
musicTimer
);

musicTimer=null;
}
}

function playTone(
frequency,
duration=.12,
volume=.07,
type="sine"
){

if(
!sound||
!audio||
!masterGain||
audio.state!=="running"
)return;

try{

const osc=
audio.createOscillator();

const gain=
audio.createGain();

const now=
audio.currentTime;

osc.type=type;
osc.frequency.value=frequency;

gain.gain.setValueAtTime(
.0001,
now
);

gain.gain.exponentialRampToValueAtTime(
volume,
now+.015
);

gain.gain.exponentialRampToValueAtTime(
.0001,
now+duration
);

osc.connect(gain);
gain.connect(masterGain);

osc.start(now);
osc.stop(now+duration+.02);

}catch{}
}

function generateLevel(){

obstacles=[];
coinObjects=[];
diamondObjects=[];
pads=[];
portals=[];
checkpoints=[];

const length=
12500+
current*850;

let x=650;
let pattern=0;

const patterns=[
"spike",
"double",
"saw",
"gap",
"pad",
"spike",
"saw",
"speed",
"double",
"gap",
"spikeSaw",
"gravity",
"triple",
"block",
"movingSaw",
"checkpoint"
];

while(x<length-700){

const type=
patterns[
pattern%patterns.length
];

if(type==="spike"){

spike(x);
x+=430;

}

else if(type==="double"){

spike(x);
spike(x+65);
x+=520;

}

else if(type==="triple"){

spike(x);
spike(x+65);
spike(x+130);
x+=610;

}

else if(type==="saw"){

saw(x);
x+=520;

}

else if(type==="movingSaw"){

movingSaw(x);
x+=620;

}

else if(type==="spikeSaw"){

spike(x);
saw(x+230);
x+=650;

}

else if(type==="gap"){

gap(x,150);
x+=630;

}

else if(type==="pad"){

pad(x);
spike(x+190);
x+=600;

}

else if(type==="speed"){

speedPortal(x);
spike(x+250);
saw(x+480);
x+=760;

}

else if(type==="gravity"){

gravityPortal(x);
spike(x+280);
spike(x+345);
x+=720;

}

else if(type==="block"){

block(x);
block(x+90);
x+=580;

}

else if(type==="checkpoint"){

checkpoint(x);
spike(x+260);
x+=700;

}

pattern++;
}

/* trzy monety */

const coinPositions=[
length*.23,
length*.51,
length*.78
];

coinPositions.forEach((cx,i)=>{

coinObjects.push({
id:i,
x:cx,
collected:false
});
});

/* diamenty */

diamondObjects.push({
id:0,
x:length*.38,
y:.42,
collected:false
});

diamondObjects.push({
id:1,
x:length*.66,
y:.58,
collected:false
});

x:length*.9,
y:.35,
collected:false
});
}

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

const level=
LEVELS[current];

world+=
level.speed*
speedMultiplier*
dt;

speedMultiplier+=
(1-speedMultiplier)*
dt*2;

player.vy+=
2100*
gravityDirection*
dt;

player.y+=
player.vy*
dt;

if(gravityDirection===1){

const floor=
ground-player.size;

if(
player.y>=floor&&
!gapUnder()
){

player.y=floor;
player.vy=0;
player.grounded=true;

player.rot=
Math.round(
player.rot/(Math.PI/2)
)*
Math.PI/2;

}else{

player.grounded=false;
player.rot+=dt*8;

}

}else{

if(
player.y<=0&&
!gapUnder()
){

player.y=0;
player.vy=0;
player.grounded=true;

}else{

player.grounded=false;
player.rot-=dt*8;

}
}

checkPads();
checkPortals();
checkCoins();
checkDiamonds();
checkCheckpoints();
checkCombo();
collisions();

score+=
Math.floor(
level.speed*
dt
);

document.getElementById(
"scoreText"
).textContent=
"SCORE: "+
score;

if(Math.random()<.8){

trail.push({
x:player.x+17,
y:player.y+17,
life:.3,
size:16
});

}

updateTrail(dt);
updateParticles(dt);

if(shake>0){

shake-=dt*13;

if(shake<0)
shake=0;

}

if(flash>0){

flash-=dt*3;

if(flash<0)
flash=0;

}
}

function gapUnder(){

const center=
world+
player.x+
player.size/2;

for(const o of obstacles){

if(
o.type==="gap"&&
center>o.x&&
center<o.x+o.w
){
return true;
}
}

return false;
}

/* =====================================================
   COLLISIONS
===================================================== */

function collisions(){

const px=
world+
player.x;

const left=px+6;
const right=px+player.size-6;

const top=player.y+6;
const bottom=player.y+player.size-5;

for(const o of obstacles){

if(o.type==="spike"){

if(
gravityDirection===1&&
right>o.x+7&&
left<o.x+44&&
bottom>ground-48
){

die();
return;

}

if(
gravityDirection===-1&&
right>o.x+7&&
left<o.x+44&&
top<48
){

die();
return;

}
}

if(
o.type==="saw"||
o.type==="movingSaw"
){

let cx=o.x;

let cy=
gravityDirection===1?
ground-o.r:
o.r;

if(o.type==="movingSaw"){

cy+=
Math.sin(
performance.now()/400+
o.phase
)*90;

}

const nx=
Math.max(
left,
Math.min(cx,right)
);

const ny=
Math.max(
top,
Math.min(cy,bottom)
);

const dx=cx-nx;
const dy=cy-ny;

if(
dx*dx+
dy*dy<
(o.r-5)*
(o.r-5)
){

die();
return;

}
}

if(o.type==="gap"){

const center=
world+
player.x+
player.size/2;

if(
gravityDirection===1&&
center>o.x&&
center<o.x+o.w&&
bottom>=ground-8
){

die();
return;

}
}

if(o.type==="block"){

const bx=o.x;
const by=
gravityDirection===1?
ground-o.h:
0;

if(
right>bx&&
left<bx+o.w&&
bottom>by&&
top<by+o.h
){

die();
return;

}
}
}
}

/* =====================================================
   LOOP
===================================================== */

function loop(time){

if(!running)return;

if(paused){

last=time;

raf=
requestAnimationFrame(loop);

return;
}

let dt=
(time-last)/1000;

if(
!Number.isFinite(dt)||
dt<0
){
dt=0;
}

dt=
Math.min(
dt,
.05
);

last=time;

update(dt);
draw();
checkWin();

if(running){

raf=
requestAnimationFrame(loop);
}
}

/* =====================================================

===================================================== */

function drawSpike(x){

const color=
LEVELS[current].color;

ctx.save();

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=16;

ctx.beginPath();

if(gravityDirection===1){

ctx.moveTo(
x,
ground
);

ctx.lineTo(
x+23,
ground-47
);

ctx.lineTo(
x+46,
ground
);

}else{

ctx.moveTo(
x,
0
);

ctx.lineTo(
x+23,
47
);

ctx.lineTo(
x+46,
0
);

}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;

ctx.strokeStyle="white";
ctx.stroke();

ctx.restore();
}

function drawSaw(x,r){

const color=
LEVELS[current].color;

const y=
gravityDirection===1?
ground-r:
r;

ctx.save();

ctx.translate(x,y);

ctx.rotate(
performance.now()/280
);

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=18;

const teeth=14;

ctx.beginPath();

for(let i=0;i<teeth*2;i++){

const angle=
i*Math.PI/teeth;

const radius=
i%2===0?
r:
r*.7;

const px=
Math.cos(angle)*radius;

const py=
Math.sin(angle)*radius;

if(i===0)
ctx.moveTo(px,py);
else
ctx.lineTo(px,py);

}

ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;

ctx.fillStyle="#05050c";

ctx.beginPath();

ctx.arc(
0,
0,
r*.28,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();
}

function drawMovingSaw(x,o){

const y=
gravityDirection===1?
ground-o.r:
o.r;

const movingY=
y+
Math.sin(
performance.now()/400+
o.phase
)*90;

ctx.save();

ctx.translate(
x,
movingY
);

ctx.rotate(
performance.now()/220
);

ctx.fillStyle="#ff4be8";

ctx.shadowColor="#ff4be8";
ctx.shadowBlur=20;

const r=o.r;

ctx.beginPath();

for(let i=0;i<28;i++){

const a=
i*Math.PI/14;

const rr=
i%2===0?r:r*.68;

const px=Math.cos(a)*rr;
const py=Math.sin(a)*rr;

if(i===0)
ctx.moveTo(px,py);
else
ctx.lineTo(px,py);

}

ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawBlock(x,o){

const y=
gravityDirection===1?
ground-o.h:
0;

ctx.save();

ctx.fillStyle=
LEVELS[current].color;

ctx.shadowColor=
LEVELS[current].color;

ctx.shadowBlur=15;

ctx.fillRect(
x,
y,
o.w,
o.h
);

ctx.shadowBlur=0;

ctx.strokeStyle="white";
ctx.strokeRect(
x,
y,
o.w,
o.h
);

ctx.restore();
}

function createStars(){

stars=[];

for(let i=0;i<90;i++){

stars.push({
x:Math.random()*W,
y:Math.random()*
Math.max(100,ground*.9),
r:Math.random()*2+.4,
v:Math.random()*.9+.2
});

}
}

function drawStars(){

ctx.fillStyle="white";

for(const star of stars){

star.x-=star.v;

if(star.x<0)
star.x=W;

ctx.globalAlpha=
.25+
star.r*.22;

ctx.beginPath();

ctx.arc(
star.x,
star.y,
star.r,
0,
Math.PI*2
);

ctx.fill();
}

ctx.globalAlpha=1;
}

function drawGrid(){

const color=
LEVELS[current].color;

ctx.strokeStyle=color;
ctx.globalAlpha=.08;

const size=70;

const offset=
-(world*.25)%size;

for(
let x=offset;
x<W;
x+=size
){

ctx.beginPath();

ctx.moveTo(
x,
0
);

ctx.lineTo(
x,
ground
);

ctx.stroke();
}

for(
let y=40;
y<ground;
y+=size
){

ctx.beginPath();

ctx.moveTo(
0,
y
);

ctx.lineTo(
W,
y
);

ctx.stroke();
}

ctx.globalAlpha=1;
}

function drawSpeedLines(){

const color=
LEVELS[current].color;

ctx.strokeStyle=color;
ctx.globalAlpha=.12;
ctx.lineWidth=2;

const offset=
-(world*.8)%190;

for(
let x=offset-190;
x<W+190;
x+=190
){

const y=
100+
Math.abs(x*7)%
Math.max(
100,
ground-150
);

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
x+80,
y
);

ctx.stroke();
}

ctx.globalAlpha=1;
}

function updateTrail(dt){

for(
let i=trail.length-1;
i>=0;
i--
){

trail[i].life-=dt;

if(trail[i].life<=0){
trail.splice(i,1);
}

}

if(trail.length>40){

trail.splice(
0,
trail.length-40
);

}
}

function drawTrail(){

if(
get("nd_particles","1")!=="1"
)return;

const color=
LEVELS[current].color;

for(const t of trail){

ctx.globalAlpha=
Math.max(
0,
t.life/.3
)*.3;

ctx.fillStyle=color;

ctx.shadowColor=color;
ctx.shadowBlur=15;

ctx.fillRect(
t.x-t.size/2,
t.y-t.size/2,
t.size,
t.size
);
}

ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

function updateParticles(dt){

for(
let i=particles.length-1;
i>=0;
i--
){

const p=particles[i];

p.life-=dt;

p.x+=p.vx*dt;
p.y+=p.vy*dt;

p.vy+=500*dt;
p.rot+=p.spin*dt;

if(p.life<=0){
particles.splice(i,1);
}
}
}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=
Math.max(
0,
p.life/p.max
);

let color=
p.color||
LEVELS[current].color;

if(p.type==="win"){

const colors=[
"#00eaff",
"#ff36d1",
"#ffe14a",
"#49ff9a",
"#9c7bff"
];

color=
colors[
Math.floor(
Math.random()*colors.length
)
];
}

ctx.fillStyle=color;

ctx.save();

ctx.translate(
p.x,
p.y
);

ctx.rotate(
p.rot
);

ctx.shadowColor=color;
ctx.shadowBlur=10;

ctx.fillRect(
-p.size/2,
-p.size/2,
p.size,
p.size
);

ctx.restore();
}

ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

).addEventListener(

/* =====================================================
   AUTO PAUSE
===================================================== */

document.addEventListener(
"visibilitychange",
()=>{

if(
document.hidden&&
running&&
!paused
){

paused=true;

pause.style.display="flex";

stopMusic();

}

}
);

window.addEventListener(
"blur",
()=>{

if(
running&&
!paused
){

paused=true;

pause.style.display="flex";

stopMusic();

}

}
);


/* =====================================================
   VICTORY
===================================================== */

function victoryAnimation(){

let frames=0;

function animate(){

if(!finished)return;

updateParticles(.016);
draw();

frames++;

if(frames<130){

requestAnimationFrame(
animate
);

}

}

requestAnimationFrame(
animate
);
}
