 H=Math.max(240,innerHeight);

  devicePixelRatio||1,
  2
 );

 canvas.width=Math.round(W*d);

}

  const button=document.createElement("button");

  button.type="button";

/* =====================================================
   START LEVEL
===================================================== */

function startLevel(index,isPractice){

 if(
  index<0||
  index>=LEVELS.length
 )return;

 cancelAnimationFrame(raf);
 stopMusic();

 current=index;
 practice=!!isPractice;

 running=false;
 paused=false;
 finished=false;

 world=0;
 speedMultiplier=1;

 gravityDirection=
  LEVELS[current].gravity;

 deathsRun=0;
 runCoins=0;
 checkpointIndex=-1;

 player.x=
  Math.max(
   110,
   W*.22
  );

 player.y=
  gravityDirection===1
  ?ground-player.size
  :0;

 player.vy=0;
 player.rotation=0;
 player.grounded=true;
 player.mode="cube";
 player.alive=true;

 generateLevel();

 menu.style.display="none";
 game.style.display="block";

 pauseBox.style.display="none";
 finishBox.style.display="none";

 document.getElementById(
  "levelName"
 ).textContent=
  (current+1)+
  " • "+
  LEVELS[current].name;

 document.getElementById(
  "touchJump"
 ).style.display=
  save.touch
  ?"block"
  :"none";

 updateHUD();

 running=true;
 lastTime=performance.now();
 accumulator=0;

 if(save.music)
  startMusic();

 raf=requestAnimationFrame(loop);
}


/* =====================================================
   GENEROWANIE POZIOMU
===================================================== */

function generateLevel(){

 obstacles=[];
 coins=[];
 pads=[];
 portals=[];
 orbs=[];
 checkpoints=[];

 const length=
  LEVELS[current].length;

 let x=600;
 let section=0;

 while(
  x<
  length-800
 ){

  switch(section%10){

   case 0:

    spike(x);

    x+=420;

    /*
      PODWÓJNE KOLCE:
      drugi zaczyna się 44 px
      od pierwszego, więc
      zachodzą na siebie.
    */

    spike(x);
    spike(x+44);

    x+=620;

    break;


   case 1:

    orb(
     x,
     "yellow"
    );

    spike(x+190);

    x+=650;

    break;


   case 2:

    saw(x);
    saw(x+250);

    x+=650;

    break;


   case 3:

    gap(x,145);

    x+=620;

    break;


   case 4:

    pad(x);

    /*
      PODWÓJNE KOLCE
      BEZ SZCZELINY
    */

    spike(x+230);
    spike(x+274);

    x+=720;

    break;


   case 5:

    gravityPortal(x);

    spike(x+250);

    x+=700;

    break;


   case 6:

    speedPortal(
     x,
     1.12
    );

    saw(x+250);

    x+=700;

    break;


   case 7:

    modePortal(
     x,
     "ship"
    );

    saw(x+250);
    saw(x+500);

    modePortal(
     x+650,
     "cube"
    );

    x+=850;

    break;


   case 8:

    modePortal(
     x,
     "ufo"
    );

    spike(x+250);
    spike(x+294);

    modePortal(
     x+500,
     "cube"
    );

    x+=720;

    break;


   case 9:

    modePortal(
     x,
     "wave"
    );

    /*
      TRZY KOLCE TEŻ ZACHODZĄ
      NA SIEBIE, WIĘC NIE MA SZCZELIN.
    */

    spike(x+220);
    spike(x+264);
    spike(x+308);

    modePortal(
     x+520,
     "cube"
    );

    x+=780;

    break;
  }

  section++;
 }

 coinAt(length*.25);
 coinAt(length*.52);
 coinAt(length*.79);

 checkpoint(length*.32);
 checkpoint(length*.62);
 checkpoint(length*.84);
}


/* =====================================================
   OBIEKTY
===================================================== */

function spike(x,gravity){

 obstacles.push({

  type:"spike",

  x:x,

  gravity:
   gravity===undefined
   ?gravityDirection
   :gravity
 });
}

function saw(x){

 obstacles.push({

  type:"saw",

  x:x,

  r:29,

  gravity:gravityDirection
 });
}

function gap(x,w){

 obstacles.push({

  type:"gap",

  x:x,

  w:w,

  gravity:gravityDirection
 });
}

function pad(x){

 pads.push({

  x:x,

  gravity:gravityDirection,

  used:false
 });
}

function orb(x,type){

 orbs.push({

  x:x,

  type:type,

  gravity:gravityDirection,

  used:false
 });
}

function speedPortal(x,mult){

 portals.push({

  x:x,

  type:"speed",

  mult:mult,

  used:false
 });
}

function gravityPortal(x){

 portals.push({

  x:x,

  type:"gravity",

  used:false
 });
}

function modePortal(x,mode){

 portals.push({

  x:x,

  type:"mode",

  mode:mode,

  used:false
 });
}

function coinAt(x){

 coins.push({

  x:x,

  y:ground-125,

  collected:false
 });
}

function checkpoint(x){

 checkpoints.push({

  x:x,

  activated:false
 });
}

===================================================== */

 if(
  !running||
  paused||
  finished||
  !player.alive
 )return;

 if(
  player.mode==="cube"
 ){

  if(player.grounded){

   player.vy=
    -PHYSICS.jump*
    gravityDirection;

   player.grounded=false;

   player.rotation+=
    gravityDirection===1
    ?Math.PI/2
    :-Math.PI/2;

   burst(
    player.x+18,
    player.y+18,
    8,
    LEVELS[current].color
   );

   playSfx(520);
  }

  return;
 }

 if(
  player.mode==="ship"
 ){

  player.vy=
   -PHYSICS.shipThrust*
   gravityDirection;

  playSfx(620);

  return;
 }

 if(
  player.mode==="ufo"
 ){

  player.vy=
   -PHYSICS.ufoJump*
   gravityDirection;

  playSfx(700);

  return;
 }

 if(
  player.mode==="wave"
 ){

  player.vy=
   -PHYSICS.waveSpeed*
   gravityDirection;

  return;
 }

 if(
  player.mode==="ball"
 ){

  gravityDirection*=-1;

  player.vy=0;

  playSfx(580);
 }
}

/* =====================================================
   FIZYKA
===================================================== */

function physics(dt){

 if(!running)return;

 world+=
  LEVELS[current].speed*
  speedMultiplier*
  dt;

 updatePlayer(dt);

 checkPads();
 checkOrbs();
 checkPortals();
 checkCoins();
 checkCheckpoints();
 checkCollisions();

 updateParticles(dt);
 updateTrail(dt);

 if(
  world>=
  LEVELS[current].length
 ){

  finishLevel();
 }
}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer(dt){

 if(
  player.mode==="cube"
 ){

  player.vy+=
   PHYSICS.gravity*
   gravityDirection*
   dt;

  player.y+=
   player.vy*dt;

  if(
   gravityDirection===1
  ){

   const floor=
    ground-player.size;

   if(
    player.y>=floor&&
    !gapAtPlayer()
   ){

    player.y=floor;
    player.vy=0;
    player.grounded=true;

    player.rotation=
     Math.round(
      player.rotation/
      (Math.PI/2)
     )*
     (Math.PI/2);

   }else{

    player.grounded=false;

    player.rotation+=
     7.2*
     dt*
     gravityDirection;
   }

  }else{

   if(
    player.y<=0&&
    !gapAtPlayer()
   ){

    player.y=0;
    player.vy=0;
    player.grounded=true;

    player.rotation=
     Math.round(
      player.rotation/
      (Math.PI/2)
     )*
     (Math.PI/2);

   }else{

    player.grounded=false;

    player.rotation-=
     7.2*dt;
   }
  }

  return;
 }


 if(
  player.mode==="ship"
 ){

  player.vy+=
   PHYSICS.shipGravity*
   gravityDirection*
   dt;

  player.y+=
   player.vy*dt;

  clampPlayer();

  player.rotation=
   Math.max(
    -.65,
    Math.min(
     .65,
     player.vy*.001
    )
   );

  return;
 }


 if(
  player.mode==="ufo"
 ){

  player.vy+=
   PHYSICS.ufoGravity*
   gravityDirection*
   dt;

  player.y+=
   player.vy*dt;

  clampPlayer();

  player.rotation=
   player.vy<0
   ?-.3
   :.3;

  return;
 }


 if(
  player.mode==="wave"
 ){

  player.vy=
   player.vy<0
   ?-PHYSICS.waveSpeed
   :PHYSICS.waveSpeed;

  player.y+=
   player.vy*dt;

  player.rotation=
   player.vy<0
   ?-.65
   :.65;

  if(
   player.y<0||
   player.y+player.size>ground
  ){

   die();
  }

  return;
 }


 if(
  player.mode==="ball"
 ){

  player.vy+=
   PHYSICS.gravity*
   gravityDirection*
   dt;

  player.y+=
   player.vy*dt;

  clampPlayer();

  player.rotation+=
   gravityDirection*
   8*dt;
 }
}


function clampPlayer(){

 if(player.y<0){

  player.y=0;
  player.vy=0;
 }

 if(
  player.y+player.size>ground
 ){

  player.y=
   ground-player.size;

  player.vy=0;
 }
}


function gapAtPlayer(){

 const center=
  world+
  player.x+
  player.size/2;

 return obstacles.some(
  function(o){

   return(
    o.type==="gap"&&
    o.gravity===
     gravityDirection&&
    center>o.x&&
    center<
     o.x+o.w
   );
  }
 );
}


/* =====================================================
   MECHANIKI
===================================================== */

function checkPads(){

 if(
  player.mode!=="cube"
 )return;

 const px=
  world+
  player.x+
  18;

 pads.forEach(
  function(p){

   if(p.used)return;

   if(
    p.gravity===
     gravityDirection&&
    px>p.x&&
    px<p.x+60&&
    player.grounded
   ){

    p.used=true;

    player.vy=
     -PHYSICS.pad*
     gravityDirection;

    player.grounded=false;

    burst(
     p.x-world,
     gravityDirection===1
     ?ground-10
     :10,
     16,
     "#49ff9a"
    );

    playSfx(760);
   }
  }
 );
}


function checkOrbs(){

 const px=
  world+
  player.x+
  18;

 const py=
  player.y+
  18;

 orbs.forEach(
  function(o){

   if(o.used)return;

   const oy=
    o.gravity===1
    ?ground-110
    :110;

   if(
    Math.hypot(
     px-o.x,
     py-oy
    )<36
   ){

    o.used=true;

    if(
     o.type==="yellow"
    ){

     player.vy=
      -PHYSICS.jump*

    }

    if(
     o.type==="blue"
    ){

     gravityDirection*=-1;
     player.vy=0;
    }

    burst(
     o.x-world,
     oy,
     20,
     "#ffe14a"
    );

    playSfx(800);
   }
  }
 );
}


function checkPortals(){

 const px=
  world+
  player.x+
  18;

 portals.forEach(
  function(p){

   if(p.used)return;

   if(
    px>p.x&&
    px<p.x+65
   ){

function checkCheckpoints(){

function respawnPractice(){

 if(
  !practice||

 ){

   current,
   true
  );

 }

 const cp=
  checkpoints[
   checkpointIndex
  ];

 world=cp.x;

 gravityDirection=
  LEVELS[current].gravity;

 speedMultiplier=1;

 portals.forEach(
  function(p){
   p.used=p.x<world;
  }
 );

 pads.forEach(
  function(p){
   p.used=p.x<world;
  }
 );

 orbs.forEach(
  function(o){
   o.used=o.x<world;
  }
 );

 player.mode="cube";
 player.vy=0;
 player.rotation=0;
 player.grounded=true;
 player.alive=true;

 player.y=
  gravityDirection===1
  ?ground-player.size
  :0;

 running=true;
 paused=false;

 lastTime=performance.now();
 accumulator=0;
}


/* =====================================================
   KOLIZJE
===================================================== */

function collisionRect(){

 return{

  left:
   world+
   player.x+
   6,

  right:
   world+
   player.x+
   player.size-
   6,

  top:
   player.y+
   6,

  bottom:
   player.y+
   player.size-
   6
 };
}


function checkCollisions(){

 const r=
  collisionRect();

 for(
  const o of obstacles
 ){

  if(
   o.type==="spike"
  ){

   if(
    o.gravity===1
   ){

    if(
     r.right>
      o.x+5&&
     r.left<
      o.x+42&&
     r.bottom>
      ground-44
    ){

     die();
     return;
    }

   }else{

    if(
     r.right>
      o.x+5&&
     r.left<
      o.x+42&&
     r.top<44
    ){

     die();
     return;
    }
   }
  }


  if(
   o.type==="saw"
  ){

   const cy=
    o.gravity===1
    ?ground-o.r
    :o.r;

   const nx=
    Math.max(
     r.left,
     Math.min(
      o.x,
      r.right
     )
    );

   const ny=
    Math.max(
     r.top,
     Math.min(
      cy,
      r.bottom
     )
    );

   const dx=
    o.x-nx;

   const dy=
    cy-ny;

   if(
    dx*dx+
    dy*dy<
    (o.r-7)*
    (o.r-7)
   ){

    die();
    return;
   }
  }


  if(
   o.type==="gap"
  ){

   const cx=
    world+
    player.x+
    player.size/2;

   if(
    cx>o.x&&
    cx<o.x+o.w
   ){

    if(
     o.gravity===1&&
     r.bottom>=ground-5
    ){

     die();
     return;
    }

    if(
     o.gravity===-1&&
     r.top<=5
    ){

     die();
     return;
    }
   }
  }
 }
}

 ).textContent=

 );

/* =====================================================
   LOOP 120 FPS
===================================================== */

function loop(now){

 if(!running)return;

 if(paused){

  lastTime=now;

  raf=requestAnimationFrame(loop);

  return;
 }

 let frame=
  (now-lastTime)/1000;

 if(
  !Number.isFinite(frame)||
  frame<0
 ){

  frame=0;
 }

 frame=Math.min(
  frame,
  .05
 );

 lastTime=now;

 accumulator+=frame;

 let steps=0;

 while(
  accumulator>=PHYSICS.dt&&
  steps<10
 ){

  physics(
   PHYSICS.dt
  );

  accumulator-=
   PHYSICS.dt;

  steps++;
 }

 draw();

 if(running){

  raf=
   requestAnimationFrame(
    loop
   );
 }
}


/* =====================================================
   RYSOWANIE
===================================================== */

function draw(){

 const color=
  LEVELS[current].color;

 ctx.clearRect(
  0,
  0,
  W,
  H
 );

 const bg=
  ctx.createLinearGradient(
   0,
   0,
   0,
   H
  );

 bg.addColorStop(
  0,
  "#080b20"
 );

 bg.addColorStop(
  1,
  "#020207"
 );

 ctx.fillStyle=bg;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );

 drawStars();
 drawGrid();

 ctx.fillStyle="#080a13";

 ctx.fillRect(
  0,
  ground,
  W,
  H-ground
 );

 ctx.strokeStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=15;
 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(
  0,
  ground
 );

 ctx.lineTo(
  W,
  ground
 );

 ctx.stroke();

 ctx.shadowBlur=0;


 for(
  const o of obstacles
 ){

  const x=
   o.x-world;

  if(
   x<-120||
   x>W+120
  )continue;

  if(
   o.type==="spike"
  )
   drawSpike(x,o);

  if(
   o.type==="saw"
  )
   drawSaw(x,o);

  if(
   o.type==="gap"
  )
   drawGap(x,o);
 }


 for(
  const p of pads
 ){

  const x=
   p.x-world;

  if(
   x>-100&&
   x<W+100
  ){

   drawPad(x,p);
  }
 }


 for(
  const o of orbs
 ){

  const x=
   o.x-world;

  if(
   x>-80&&
   x<W+80
  ){

   drawOrb(x,o);
  }
 }


 for(
  const p of portals
 ){

  const x=
   p.x-world;

  if(
   x>-100&&
   x<W+100
  ){

   drawPortal(x,p);
  }
 }


 for(
  const c of coins
 ){

  if(c.collected)
   continue;

  const x=
   c.x-world;

  if(
   x>-50&&
   x<W+50
  ){

   drawCoin(
    x,
    c.y
   );
  }
 }


 if(practice){

  checkpoints.forEach(
   function(cp){

    const x=
     cp.x-world;

    if(
     x>-30&&
     x<W+30
    ){

     drawCheckpoint(
      x,
      cp
     );
    }
   }
  );
 }


 drawTrail();

 if(player.alive)
  drawPlayer();

 drawParticles();

 const percent=
  Math.min(
   100,
   Math.floor(
    world/
    LEVELS[current].length*
    100
   )
  );

 document.getElementById(
  "percent"
 ).textContent=
  percent+"%";

 document.getElementById(
  "gameBar"
 ).style.width=
  percent+"%";
}

   PLAYER DRAW

  "#00eaff",
  "#d35cff",
  "#ff5147",

 ctx.save();

 );

 );


 if(
  player.mode==="ship"
 ){

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.moveTo(
   22,
   0
  );

  ctx.lineTo(
   -17,
   -15
  );

  ctx.lineTo(
   -8,
   0
  );

  ctx.lineTo(
   -17,
   15
  );

 }else if(
  player.mode==="ufo"
 ){

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.beginPath();

  ctx.arc(
   0,
   3,
   18,
   Math.PI,
   0
  );

  ctx.lineTo(
   18,
   9
  );

  ctx.lineTo(
   -18,
   9
  );

  ctx.closePath();

  ctx.fill();

 }else if(
  player.mode==="wave"
 ){

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=20;

  ctx.beginPath();

  ctx.moveTo(
   -21,
   0
  );

  ctx.lineTo(
   20,
   -12
  );

  ctx.lineTo(
   20,
   12
  );

  ctx.closePath();

  ctx.fill();

 }else{

  ctx.fillStyle=color;

  ctx.shadowColor=color;

  );

  ctx.shadowBlur=0;

  ctx.lineWidth=2;

   -18,
   -18,
   36,
   36
  );

  /* DWA OCZY */

  ctx.arc(

   -4,

  );

  );

/* =====================================================
   SPIKES
===================================================== */

function drawSpike(x,o){

 const color=
  LEVELS[current].color;

 ctx.save();

 ctx.fillStyle=color;

 ctx.shadowColor=color;
 ctx.shadowBlur=17;

 ctx.beginPath();

 if(
  o.gravity===1
 ){

  ctx.moveTo(
   x,
   ground
  );

  ctx.lineTo(
   x+23,
   ground-48
  );

  ctx.lineTo(
   x+46,
   ground
  );

 }else{

  ctx.moveTo(
   x,
   0
  );

  ctx.lineTo(
   x+23,
   48
  );

  ctx.lineTo(
   x+46,
   0
  );
 }

 ctx.closePath();

 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle="#fff";

 ctx.stroke();

 ctx.restore();
}


/* =====================================================
   SAW
===================================================== */

function drawSaw(x,o){

 const cy=
  o.gravity===1
  ?ground-o.r
  :o.r;

 const color=
  LEVELS[current].color;

 ctx.save();

 ctx.translate(
  x,
  cy
 );

 ctx.rotate(
  performance.now()/280
 );

 ctx.fillStyle=color;

 ctx.shadowColor=color;
 ctx.shadowBlur=18;

 ctx.beginPath();

 for(
  let i=0;
  i<28;
  i++
 ){

  const angle=
   i*Math.PI/14;

  const radius=
   i%2===0
   ?o.r
   :o.r*.68;

  const px=
   Math.cos(angle)*
   radius;

  const py=
   Math.sin(angle)*
   radius;

  if(i===0)
   ctx.moveTo(px,py);
  else
   ctx.lineTo(px,py);
 }

 ctx.closePath();

 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#05050c";

 ctx.beginPath();

 ctx.arc(
  0,
  0,
  o.r*.27,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.restore();
}


/* =====================================================
   GAP
===================================================== */

function drawGap(x,o){

 ctx.fillStyle="#010105";

 if(
  o.gravity===1
 ){

  ctx.fillRect(
   x,
   ground,
   o.w,
   H-ground
  );

 }else{

  ctx.fillRect(
   x,
   0,
   o.w,
   ground
  );
 }
}


/* =====================================================
   PAD
===================================================== */

function drawPad(x,p){

 ctx.save();

 ctx.fillStyle="#49ff9a";

 ctx.shadowColor="#49ff9a";
 ctx.shadowBlur=20;

 ctx.beginPath();

 if(
  p.gravity===1
 ){

  ctx.arc(
   x+27,
   ground-8,
   20,
   Math.PI,
   Math.PI*2
  );

 }else{

  ctx.arc(
   x+27,
   8,
   20,
   0,
   Math.PI
  );
 }

 ctx.fill();

 ctx.restore();
}


/* =====================================================
   ORB
===================================================== */

function drawOrb(x,o){

 const color=
  o.type==="blue"
  ?" #4de8ff"
  :"#ffe14a";

 const y=
  o.gravity===1
  ?ground-110
  :110;

 ctx.save();

 ctx.translate(
  x,

 ctx.fillStyle="#fff";

 stars.forEach(
  function(s){

   s.x-=s.v;

   if(s.x<0)
    s.x=W;

   ctx.globalAlpha=
    .25+
    s.r*.12;

   ctx.beginPath();

   ctx.arc(
    s.x,
    s.y,
    s.r,
    0,
    Math.PI*2
   );

  }
 );

 ctx.globalAlpha=1;
}


function drawGrid(){

 const color=
  LEVELS[current].color;

 ctx.strokeStyle=color;
 ctx.globalAlpha=.08;

 const size=70;

 const offset=
  -(world*.23)%size;

 for(
  let x=offset;
  x<W;
  x+=size
 ){

  ctx.beginPath();

  ctx.moveTo(
   x,
   0
  );

  ctx.lineTo(
   x,
   ground
  );

  ctx.stroke();
 }

 for(
  let y=40;
  y<ground;
  y+=size
 ){

  ctx.beginPath();

  ctx.moveTo(
   0,
   y
  );

  ctx.lineTo(
   W,
   y
  );

  ctx.stroke();
 }

 ctx.globalAlpha=1;
}


/* =====================================================
   PARTICLE
===================================================== */

function burst(
 x,
 y,
 count,
 color
){

 for(
  let i=0;
  i<count;
  i++
 ){

  if(
   particles.length>350
  )break;

  particles.push({

   x:x,
   y:y,

   vx:
    (Math.random()-.5)*
    520,

   vy:
    (Math.random()-.5)*
    520,

   life:
    .4+
    Math.random()*.8,

   size:
    2+
    Math.random()*6,

   color:color
  });
 }
}


function updateParticles(dt){

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  const p=
   particles[i];

  p.life-=dt;

  p.x+=
   p.vx*dt;

  p.y+=
   p.vy*dt;

  p.vy+=
   450*dt;

  if(
   p.life<=0
  ){

   particles.splice(
    i,
    1
   );
  }
 }
}


function drawParticles(){

 particles.forEach(
  function(p){

   ctx.globalAlpha=
    Math.max(
     0,
     p.life
    );

   ctx.fillStyle=
    p.color;

   ctx.shadowColor=
    p.color;

   ctx.shadowBlur=10;

   ctx.fillRect(
    p.x-p.size/2,
    p.y-p.size/2,
    p.size,
    p.size
   );
  }
 );

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

/* =====================================================
   AUDIO
===================================================== */

function getAudio(){

 if(audio)return audio;

 try{

  audio=new(
   window.AudioContext||
   window.webkitAudioContext
  )();

 }catch(e){

  audio=null;
 }

 return audio;
}


function playSfx(freq){

 if(!save.sfx)return;

 try{

  const a=getAudio();

  if(!a)return;

  if(
   a.state==="suspended"
  )
   a.resume();

  const o=
   a.createOscillator();

  const g=
   a.createGain();

  o.type="square";

  o.frequency.value=
   freq;

  g.gain.setValueAtTime(
   .035,
   a.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
   .001,
   a.currentTime+.12
  );

  o.connect(g);

  g.connect(
   a.destination
  );

  o.start();

  o.stop(
   a.currentTime+.13
  );

 }catch(e){}
}


function startMusic(){

 stopMusic();

 if(!save.music)return;

 try{

  const a=getAudio();

  if(!a)return;

  if(
   a.state==="suspended"
  )
   a.resume();

  const level=
   LEVELS[current];

  musicIndex=0;

  musicTimer=
   setInterval(
    function(){

     if(
      !running||
      paused
     )return;

     const o=
      a.createOscillator();

     const g=
      a.createGain();

     o.type=
      level.wave;

     o.frequency.value=
      level.notes[
       musicIndex%
       level.notes.length
      ];

     g.gain.setValueAtTime(
      .018,
      a.currentTime
     );

     g.gain.exponentialRampToValueAtTime(
      .001,
      a.currentTime+.16
     );

     o.connect(g);

     g.connect(
      a.destination
     );

     o.start();

     o.stop(
      a.currentTime+.17
     );

     musicIndex++;

    },
    60000/level.bpm
   );

 }catch(e){}
}


function stopMusic(){

 if(musicTimer){

  clearInterval(
   musicTimer
  );

  musicTimer=null;
 }
}
