<body>

<!-- MENU -->
<div id="menu">
    <div id="title">NEON DASH</div>

    <button class="menuButton" onclick="startGame()">▶ GRAJ</button>
    <button class="menuButton" onclick="showLevels()">▣ POZIOMY</button>
    <button class="menuButton" onclick="showShop()">◆ SKLEP</button>
    <button class="menuButton" onclick="showAchievements()">★ OSIĄGNIĘCIA</button>
    <button class="menuButton" onclick="showSettings()">⚙ USTAWIENIA</button>
</div>

<!-- GAME -->
<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">
        <div id="levelName">Poziom 1</div>
        <div id="progressBack">
            <div id="progress"></div>
        </div>
    </div>

    <button id="pauseButton" onclick="pauseGame()">Ⅱ</button>

    <div id="controls">
        <div class="controlGroup">
            <button class="control" id="leftButton">◀</button>
            <button class="control" id="rightButton">▶</button>
        </div>

        <button class="control" id="jumpButton">▲</button>
    </div>

    <div id="message">
        <div class="messageBox">
            <h2 id="messageTitle">Gotowy?</h2>
            <p id="messageText"></p>
            <button onclick="restartLevel()">↻ ZAGRAJ PONOWNIE</button>
            <button onclick="backToMenu()">⌂ MENU</button>
        </div>
    </div>

    <div id="panel">
        <div class="panelBox" id="panelContent"></div>
    </div>
</div>

<script>
/* =========================
   NEON DASH
   ========================= */

var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var game = document.getElementById("game");
var menu = document.getElementById("menu");

var W = 0;
var H = 0;

var running = false;
var paused = false;
var gameOver = false;

var level = 1;
var unlockedLevel = 1;

var coins = 0;
var selectedSkin = 0;

var soundOn = true;
var musicOn = true;

var cameraX = 0;

var player = {
    x: 100,
    y: 0,
    size: 34,
    vx: 0,
    vy: 0,
    speed: 5,
    jump: -11,
    onGround: false,
    rotation: 0,
    blinkTimer: 0
};

var world = {
    groundY: 0,
    length: 6000,
    obstacles: [],
    coins: []
};

var keys = {
    left: false,
    right: false
};

var lastTime = 0;

/* =========================
   SAVE
   ========================= */

function loadSave() {
    try {
        var data = JSON.parse(localStorage.getItem("neonDashSave"));

        if (data) {
            unlockedLevel = data.unlockedLevel || 1;
            coins = data.coins || 0;
            selectedSkin = data.selectedSkin || 0;
            soundOn = data.soundOn !== false;
            musicOn = data.musicOn !== false;
        }
    } catch (e) {
        unlockedLevel = 1;
        coins = 0;
        selectedSkin = 0;
    }
}

function saveGame() {
    try {
        localStorage.setItem("neonDashSave", JSON.stringify({
            unlockedLevel: unlockedLevel,
            coins: coins,
            selectedSkin: selectedSkin,
            soundOn: soundOn,
            musicOn: musicOn
        }));
    } catch (e) {}
}

loadSave();

/* =========================
   RESIZE
   ========================= */

function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    world.groundY = H - Math.max(110, H * 0.18);

    if (!running) {
        player.y = world.groundY - player.size;
    }
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================
   LEVEL GENERATION
   ========================= */

function generateLevel(number) {

    world.length = 5000 + number * 500;
    world.obstacles = [];
    world.coins = [];

    var spacing = 260 - Math.min(number * 4, 100);

    for (var x = 550; x < world.length - 400; x += spacing) {

        var type = Math.floor(Math.random() * 4);

        if (type === 0) {
            world.obstacles.push({
                x: x,
                y: world.groundY - 45,
                w: 45,
                h: 45,
                type: "spike"
            });
        }

        if (type === 1) {
            world.obstacles.push({
                x: x,
                y: world.groundY - 70,
                w: 50,
                h: 70,
                type: "block"
            });
        }

        if (type === 2) {
            world.obstacles.push({
                x: x,
                y: world.groundY - 40,
                w: 90,
                h: 40,
                type: "block"
            });
        }

        if (type === 3) {
            world.obstacles.push({
                x: x,
                y: world.groundY - 90,
                w: 45,
                h: 90,
                type: "spike"
            });
        }

        if (Math.random() < 0.8) {
            world.coins.push({
                x: x + 80,
                y: world.groundY - 100 - Math.random() * 80,
                r: 10,
                taken: false
            });
        }
    }
}

/* =========================
   START GAME
   ========================= */

function startGame() {
    level = 1;
    openLevel(level);
}

function openLevel(number) {

    if (number > unlockedLevel) {
        return;
    }

    level = number;

    menu.style.display = "none";
    game.style.display = "block";

    document.getElementById("panel").style.display = "none";
    document.getElementById("message").style.display = "none";

    running = true;
    paused = false;
    gameOver = false;

    cameraX = 0;

    player.x = 100;
    player.y = world.groundY - player.size;
    player.vx = 0;
    player.vy = 0;
    player.rotation = 0;
    player.onGround = true;

    generateLevel(level);

    document.getElementById("levelName").textContent =
        "Poziom " + level;

    lastTime = performance.now();

    requestAnimationFrame(loop);
}

/* =========================
   DRAW BACKGROUND
   ========================= */

function drawBackground() {

    var gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#09091b");
    gradient.addColorStop(1, "#20204a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    /* neon circles */

    for (var i = 0; i < 8; i++) {

        var bx = i * 500 - cameraX * 0.2;

        ctx.beginPath();
        ctx.arc(
            bx,
            100 + (i % 3) * 100,
            80,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "rgba(0,255,255,0.035)";
        ctx.fill();
    }

    /* background grid */

    ctx.strokeStyle = "rgba(0,255,255,0.08)";
    ctx.lineWidth = 1;

    var gridSize = 60;

    for (
        var x = -cameraX % gridSize;
        x < W;
        x += gridSize
    ) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (var y = 0; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

/* =========================
   DRAW GROUND
   ========================= */

function drawGround() {

    ctx.fillStyle = "#15152b";
    ctx.fillRect(
        0,
        world.groundY,
        W,
        H - world.groundY
    );

    ctx.fillStyle = "#00ffff";
    ctx.fillRect(
        0,
        world.groundY,
        W,
        5
    );

    ctx.strokeStyle = "rgba(0,255,255,0.15)";
    ctx.lineWidth = 2;

    for (
        var x = -cameraX % 50;
        x < W;
        x += 50
    ) {
        ctx.beginPath();
        ctx.moveTo(x, world.groundY);
        ctx.lineTo(x + 35, H);
        ctx.stroke();
    }
}

/* =========================
   DRAW PLAYER
   ========================= */

function drawPlayer() {

    var px = player.x - cameraX;
    var py = player.y;
    var s = player.size;

    ctx.save();

    ctx.translate(px + s / 2, py + s / 2);

    if (!player.onGround) {
        ctx.rotate(player.rotation);
    }

    /* ONE SIMPLE SHAPE */

    var skinColors = [
        "#00ffff",
        "#ff3bd4",
        "#7cff00",
        "#ffb000",
        "#9b5cff"
    ];

    ctx.fillStyle = skinColors[selectedSkin];

    ctx.shadowBlur = 18;
    ctx.shadowColor = skinColors[selectedSkin];

    ctx.fillRect(
        -s / 2,
        -s / 2,
        s,
        s
    );

    ctx.shadowBlur = 0;

    /* eyes */

    var blink =
        Math.floor(performance.now() / 1000) % 5 === 0 &&
        performance.now() % 1000 < 120;

    ctx.fillStyle = "#101020";

    if (blink) {

        ctx.fillRect(
            -9,
            -5,
            6,
            2
        );

        ctx.fillRect(
            3,
            -5,
            6,
            2
        );

    } else {

        ctx.fillRect(
            -9,
            -7,
            6,
            8
        );

        ctx.fillRect(
            3,
            -7,
            6,
            8
        );
    }

    /* mouth */

    ctx.fillRect(
        -7,
        8,
        14,
        3
    );

    ctx.restore();
}

/* =========================
   DRAW OBSTACLES
   ========================= */

function drawObstacles() {

    for (var i = 0; i < world.obstacles.length; i++) {

        var o = world.obstacles[i];

        var sx = o.x - cameraX;

        if (sx < -100 || sx > W + 100) {
            continue;
        }

        if (o.type === "spike") {

            ctx.fillStyle = "#ff2875";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff2875";

            ctx.beginPath();

            ctx.moveTo(sx, o.y + o.h);
            ctx.lineTo(sx + o.w / 2, o.y);
            ctx.lineTo(sx + o.w, o.y + o.h);
            ctx.closePath();

            ctx.fill();

            ctx.shadowBlur = 0;

        } else {

            ctx.fillStyle = "#8a2be2";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#8a2be2";

            ctx.fillRect(
                sx,
                o.y,
                o.w,
                o.h
            );

            ctx.shadowBlur = 0;

            ctx.strokeStyle = "#00ffff";
            ctx.strokeRect(
                sx,
                o.y,
                o.w,
                o.h
            );
        }
    }
}

/* =========================
   DRAW COINS
   ========================= */

function drawCoins() {

    for (var i = 0; i < world.coins.length; i++) {

        var c = world.coins[i];

        if (c.taken) {
            continue;
        }

        var sx = c.x - cameraX;

        if (sx < -50 || sx > W + 50) {
            continue;
        }

        ctx.beginPath();
        ctx.arc(
            sx,
            c.y,
            c.r,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffd43b";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffd43b";
        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = "#fff4a3";
        ctx.fillRect(
            sx - 2,
            c.y - 5,
            4,
            10
        );
    }
}

/* =========================
   COLLISION
   ========================= */

function rectangleCollision(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

function checkCollisions() {

    var p = {
        x: player.x + 5,
        y: player.y + 5,
        w: player.size - 10,
        h: player.size - 10
    };

    for (var i = 0; i < world.obstacles.length; i++) {

        var o = world.obstacles[i];

        if (rectangleCollision(p, o)) {
            die();
            return;
        }
    }

    for (var j = 0; j < world.coins.length; j++) {

        var c = world.coins[j];

        if (c.taken) {
            continue;
        }

        var dx =
            player.x + player.size / 2 - c.x;

        var dy =
            player.y + player.size / 2 - c.y;

        var distance = Math.sqrt(
            dx * dx + dy * dy
        );

        if (distance < player.size / 2 + c.r) {

            c.taken = true;
            coins++;

            saveGame();
        }
    }
}

/* =========================
   UPDATE
   ========================= */

function update(dt) {

    if (!running || paused || gameOver) {
        return;
    }

    var gravity = 0.65;

    /* automatic forward movement */

    player.vx = player.speed;

    if (keys.left) {
        player.vx = player.speed - 2;
    }

    if (keys.right) {
        player.vx = player.speed + 2;
    }

    player.x += player.vx;

    player.vy += gravity;
    player.y += player.vy;

    /* ground */

    if (player.y + player.size >= world.groundY) {

        player.y =
            world.groundY - player.size;

        player.vy = 0;
        player.onGround = true;
        player.rotation = 0;

    } else {

        player.onGround = false;

        player.rotation += 0.08;
    }

    /* camera */

    cameraX = player.x - W * 0.25;

    if (cameraX < 0) {
        cameraX = 0;
    }

    if (cameraX > world.length - W) {
        cameraX = world.length - W;
    }

    checkCollisions();

    /* finish */

    if (player.x >= world.length - 150) {
        winLevel();
    }

    var percent =
        Math.min(
            100,
            Math.max(
                0,
                ((player.x - 100) /
                (world.length - 250)) * 100
            )
        );

    document.getElementById("progress").style.width =
        percent + "%";
}

/* =========================
   LOOP
   ========================= */

function loop(time) {

    if (!running) {
        return;
    }

    var dt = time - lastTime;
    lastTime = time;

    if (dt > 50) {
        dt = 50;
    }

    update(dt);

    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawGround();
    drawCoins();
    drawObstacles();
    drawPlayer();

    if (running) {
        requestAnimationFrame(loop);
    }
}

/* =========================
   JUMP
   ========================= */

function jump() {

    if (!running || paused || gameOver) {
        return;
    }

    if (player.onGround) {

        player.vy = player.jump;
        player.onGround = false;
        player.rotation = 0;
    }
}

/* =========================
   DIE
   ========================= */

function die() {

    if (gameOver) {
        return;
    }

    gameOver = true;

    document.getElementById("messageTitle").textContent =
        "💥 KONIEC";

    document.getElementById("messageText").textContent =
        "Uderzyłeś w przeszkodę!";

    document.getElementById("message").style.display =
        "flex";
}

/* =========================
   WIN
   ========================= */

function winLevel() {

    if (gameOver) {
        return;
    }

    gameOver = true;

    if (level >= unlockedLevel &&
        unlockedLevel < 18) {

        unlockedLevel = level + 1;
        saveGame();
    }

    if (level >= 18) {

        document.getElementById("messageTitle").textContent =
            "🏆 UKOŃCZONO GRĘ!";

        document.getElementById("messageText").textContent =
            "Ukończyłeś wszystkie 18 poziomów!";
    } else {

        document.getElementById("messageTitle").textContent =
            "🎉 POZIOM UKOŃCZONY!";

        document.getElementById("messageText").textContent =
            "Odblokowano poziom " + (level + 1) + "!";
    }

    document.getElementById("message").style.display =
        "flex";
}

/* =========================
   RESTART
   ========================= */

function restartLevel() {
    openLevel(level);
}

/* =========================
   PAUSE
   ========================= */

function pauseGame() {

    if (!running || gameOver) {
        return;
    }

    paused = !paused;

    if (paused) {

        document.getElementById("messageTitle").textContent =
            "⏸ PAUZA";

        document.getElementById("messageText").textContent =
            "Gra jest zatrzymana.";

        document.getElementById("message").style.display =
            "flex";

    } else {

        document.getElementById("message").style.display =
            "none";

        lastTime = performance.now();
        requestAnimationFrame(loop);
    }
}

/* =========================
   BACK TO MENU
   ========================= */

function backToMenu() {

    running = false;
    paused = false;
    gameOver = false;

    document.getElementById("message").style.display =
        "none";

    document.getElementById("panel").style.display =
        "none";

    game.style.display = "none";
    menu.style.display = "flex";
}

/* =========================
   PANELS
   ========================= */

function showPanel(html) {

    document.getElementById("panelContent").innerHTML =
        html;

    document.getElementById("panel").style.display =
        "flex";
}

function closePanel() {

    document.getElementById("panel").style.display =
        "none";
}

function showLevels() {

    var html =
        "<h2>▣ POZIOMY</h2>" +
        "<p>Odblokowane: " +
        unlockedLevel +
        "/18</p>";

    for (var i = 1; i <= 18; i++) {

        if (i <= unlockedLevel) {

            html +=
                "<button class='levelButton' onclick='openLevel(" +
                i +
                ")'>POZIOM " +
                i +
                "</button>";

        } else {

            html +=
                "<button class='levelButton locked' disabled>" +
                "🔒 POZIOM " +
                i +
                "</button>";
        }
    }

    html +=
        "<button class='panelButton' onclick='closePanel()'>" +
        "ZAMKNIJ</button>";

    showPanel(html);
}

function showShop() {

    var skins = [
        "#00ffff",
        "#ff3bd4",
        "#7cff00",
        "#ffb000",
        "#9b5cff"
    ];

    var html =
        "<h2>◆ SKLEP</h2>" +
        "<p>Monety: <span class='coin'>● " +
        coins +
        "</span></p>";

    for (var i = 0; i < skins.length; i++) {

        var price = i * 10;

        if (i === 0) {
            price = 0;
        }

        html +=
            "<button class='panelButton' " +
            "onclick='buySkin(" + i + ")'>" +
            "■ SKIN " + (i + 1) +
            " — " + price + " monet" +
            "</button>";
    }

    html +=
        "<button class='panelButton' onclick='closePanel()'>" +
        "ZAMKNIJ</button>";

    showPanel(html);
}

function buySkin(index) {

    var prices = [0, 10, 20, 30, 40];
    var price = prices[index];

    if (index === 0) {

        selectedSkin = 0;
        saveGame();

    } else if (coins >= price) {

        coins -= price;
        selectedSkin = index;

        saveGame();

    } else {

        alert("Masz za mało monet!");
        return;
    }

    showShop();
}

function showAchievements() {

    var html =
        "<h2>★ OSIĄGNIĘCIA</h2>" +
        "<p>🏁 Pierwszy poziom — " +
        (unlockedLevel >= 2 ? "ODBLOKOWANE" : "🔒") +
        "</p>" +
        "<p>🏆 Poziom 10 — " +
        (unlockedLevel >= 11 ? "ODBLOKOWANE" : "🔒") +
        "</p>" +
        "<p>👑 Mistrz — " +
        (unlockedLevel >= 19 ? "ODBLOKOWANE" : "🔒") +
        "</p>" +
        "<p>💰 Monety: " +
        coins +
        "</p>" +
        "<button class='panelButton' onclick='closePanel()'>" +
        "ZAMKNIJ</button>";

    showPanel(html);
}

function showSettings() {

    var html =
        "<h2>⚙ USTAWIENIA</h2>" +
        "<button class='panelButton' onclick='toggleSound()'>" +
        "DŹWIĘK: " +
        (soundOn ? "WŁĄCZONY" : "WYŁĄCZONY") +
        "</button>" +

        "<button class='panelButton' onclick='toggleMusic()'>" +
        "MUZYKA: " +
        (musicOn ? "WŁĄCZONA" : "WYŁĄCZONA") +
        "</button>" +

        "<button class='panelButton' onclick='fullscreenGame()'>" +
        "⛶ PEŁNY EKRAN</button>" +

        "<button class='panelButton' onclick='resetSave()'>" +
        "🗑 RESET DANYCH</button>" +

        "<button class='panelButton' onclick='closePanel()'>" +
        "ZAMKNIJ</button>";

    showPanel(html);
}

function toggleSound() {

    soundOn = !soundOn;
    saveGame();
    showSettings();
}

function toggleMusic() {

    musicOn = !musicOn;
    saveGame();
    showSettings();
}

function fullscreenGame() {

    try {

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

    } catch (e) {}
}

function resetSave() {

    var ok = confirm(
        "Czy na pewno chcesz usunąć zapis gry?"
    );

    if (!ok) {
        return;
    }

    unlockedLevel = 1;
    coins = 0;
    selectedSkin = 0;

    saveGame();

    showSettings();
}

/* =========================

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a") {

        keys.left = true;
    }

    if (e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d") {

        keys.right = true;
    }

    if (e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w") {

        jump();
    }

    if (e.key === "Escape") {

        pauseGame();
    }
});

document.addEventListener("keyup", function(e) {

    if (e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a") {

        keys.left = false;
    }

    if (e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d") {

        keys.right = false;
    }
});

/* =========================
   MOBILE BUTTONS
   ========================= */

function holdButton(button, key) {

    button.addEventListener("touchstart", function(e) {
        e.preventDefault();
        keys[key] = true;
    }, {passive:false});

    button.addEventListener("touchend", function(e) {
        e.preventDefault();
        keys[key] = false;
    }, {passive:false});

    button.addEventListener("touchcancel", function(e) {
        e.preventDefault();
        keys[key] = false;
    }, {passive:false});

    button.addEventListener("mousedown", function() {
        keys[key] = true;
    });

    button.addEventListener("mouseup", function() {
        keys[key] = false;
    });

    button.addEventListener("mouseleave", function() {
        keys[key] = false;
    });
}

holdButton(
    document.getElementById("leftButton"),
    "left"
);

holdButton(
    document.getElementById("rightButton"),
    "right"
);

document.getElementById("jumpButton")
.addEventListener("touchstart", function(e) {

    e.preventDefault();
    jump();

}, {passive:false});

document.getElementById("jumpButton")
.addEventListener("mousedown", function() {
    jump();
});
