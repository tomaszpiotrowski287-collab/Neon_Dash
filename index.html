<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dash</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080812;
    font-family:Arial;
}

#menu {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#101025;
}

h1 {
    color:#00ffff;
    font-size:45px;
}

button {
    width:240px;
    padding:16px;
    margin:7px;
    border:0;
    border-radius:10px;
    background:#673ab7;
    color:white;
    font-size:20px;
    font-weight:bold;
}

#game {
    display:none;
    width:100%;
    height:100%;
    position:relative;
}

canvas {
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="menu">
    <h1>NEON DASH</h1>
    <button onclick="startGame()">GRAJ</button>
</div>

<div id="game">
    <canvas id="canvas"></canvas>
</div>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var menu = document.getElementById("menu");
var game = document.getElementById("game");

var player = {
    x:100,
    y:100,
    size:40,
    speed:5,
    vy:0,
    jumping:false
};

var ground;
var gameRunning = false;
var animationFrame = null;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ground = canvas.height - 100;

    if (!player.jumping) {
        player.y = ground - player.size;
    }
}

window.addEventListener("resize", resize);
resize();

function startGame() {

    // Zatrzymaj poprzednią pętlę
    if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }

    menu.style.display = "none";
    game.style.display = "block";

    gameRunning = true;

    player.x = 100;
    player.y = ground - player.size;
    player.vy = 0;
    player.jumping = false;

    // Uruchom tylko jedną pętlę
    animationFrame = requestAnimationFrame(loop);
}

function jump() {
    if (!gameRunning) return;

    if (!player.jumping) {
        player.vy = -12;
        player.jumping = true;
    }
}

document.addEventListener("keydown", function(e) {
    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key === "w"
    ) {
        jump();
    }
});

function update() {

    if (!gameRunning) return;

    player.vy += 0.6;
    player.y += player.vy;

    if (player.y + player.size >= ground) {
        player.y = ground - player.size;
        player.vy = 0;
        player.jumping = false;
    }
}

function draw() {

    ctx.fillStyle = "#11112b";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Ziemia
    ctx.fillStyle = "#222244";
    ctx.fillRect(
        0,
        ground,
        canvas.width,
        canvas.height - ground
    );

    // Linia ziemi
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(
        0,
        ground,
        canvas.width,
        5
    );

    // Kwadrat
    ctx.fillStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 20;

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.shadowBlur = 0;

    // Oczy
    ctx.fillStyle = "#111122";

    ctx.fillRect(
        player.x + 8,
        player.y + 9,
        7,
        9
    );

    ctx.fillRect(
        player.x + 25,
        player.y + 9,
        7,
        9
    );

    // Buźka
    ctx.fillRect(
        player.x + 10,
        player.y + 28,
        20,
        3
    );
}

function loop() {

    update();
    draw();

    if (gameRunning) {
        animationFrame = requestAnimationFrame(loop);
    } else {
        animationFrame = null;
    }
}
</script>

</body>
</html>
