<script>
/* ==========================================================
   NEON DASH
   WERSJA UPROSZCZONA I ODPORNA NA BŁĘDY
========================================================== */

(function(){

"use strict";


/* ==========================================================
   POMOCNICZE
========================================================== */

function $(id){
    return document.getElementById(id);
}


/* ==========================================================
   ELEMENTY
========================================================== */

var menu=$("menu");
var game=$("game");
var canvas=$("gameCanvas");
var ctx=canvas.getContext("2d");
var errorBox=$("errorBox");


/* ==========================================================
   ZMIENNE
========================================================== */

var W=window.innerWidth;
var H=window.innerHeight;

var running=false;
var paused=false;

var levelIndex=0;
var currentLevel=null;

var player=null;

var cameraX=0;

var lastTime=0;
var animationId=0;

var leftPressed=false;
var rightPressed=false;

var particles=[];
var coinsTaken=[];

var saveKey="neon_dash_save_v5";


/* ==========================================================
   ZAPIS
========================================================== */

var save={
    unlocked:1,
    completed:[],
    coins:0,
    selectedSkin:0,
    ownedSkins:[0],
    achievements:[],
    music:true,
    sound:true
};


function loadSave(){

    try{

        var raw=localStorage.getItem(saveKey);

        if(raw){

            var data=JSON.parse(raw);

            if(data){

                if(typeof data.unlocked==="number")
                    save.unlocked=data.unlocked;

                if(Array.isArray(data.completed))
                    save.completed=data.completed;

                if(typeof data.coins==="number")
                    save.coins=data.coins;

                if(typeof data.selectedSkin==="number")
                    save.selectedSkin=data.selectedSkin;

                if(Array.isArray(data.ownedSkins))
                    save.ownedSkins=data.ownedSkins;

                if(Array.isArray(data.achievements))
                    save.achievements=data.achievements;

                if(typeof data.music==="boolean")
                    save.music=data.music;

                if(typeof data.sound==="boolean")
                    save.sound=data.sound;
            }

        }

    }catch(error){

        console.log("Nie udało się wczytać zapisu.",error);
    }
}


function saveGame(){

    try{

        localStorage.setItem(
            saveKey,
            JSON.stringify(save)
        );

    }catch(error){

        console.log("Nie udało się zapisać gry.",error);
    }
}


loadSave();


/* ==========================================================
   ROZMIAR
========================================================== */

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;

    if(!running){
        drawMenuBackground();
    }
}


window.addEventListener(
    "resize",
    resize
);


/* ==========================================================
   SKINY
========================================================== */

var skins=[
    {
        name:"Neon",
        color:"#00eaff",
        price:0
    },
    {
        name:"Czerwony",
        color:"#ff3355",
        price:25
    },
    {
        name:"Zielony",
        color:"#55ff88",
        price:50
    },
    {
        name:"Fioletowy",
        color:"#b45cff",
        price:75
    },
    {
        name:"Złoty",
        color:"#ffe600",
        price:100
    },
    {
        name:"Pomarańczowy",
        color:"#ff7b00",
        price:150
    }
];


/* ==========================================================
   POZIOMY
========================================================== */

var levelNames=[
    "Stereo Start",
    "Blue Rush",
    "Neon City",
    "Red Line",
    "Electric",
    "Purple Sky",
    "Dark Pulse",
    "Hyper Drive",
    "Gravity",
    "Flash",
    "Inferno",
    "Crystal",
    "Voltage",
    "Cyber",
    "Galaxy",
    "Final Rush",
    "Neon Storm",
    "Ultimate Run"
];


var levelColors=[
    "#00eaff",
    "#168cff",
    "#b400ff",
    "#ff3355",
    "#ffe600",
    "#8d45ff",
    "#00ff91",
    "#ff7b00",
    "#ff00c8",
    "#00ffea",
    "#ff4422",
    "#62a0ff",
    "#aaff00",
    "#00ff66",
    "#a855ff",
    "#00eaff",
    "#ff4cff",
    "#00ffd5"
];


var levels=[];


function createLevels(){

    levels=[];

    var i;

    for(i=0;i<18;i++){

        var obstacles=[];
        var coinList=[];

        var length=3500+i*260;

        var speed=5+i*0.16;

        var x=600;

        while(x<length-250){

            var width=
                45+
                ((Math.floor(x/250)%3)*20);

            var height=
                45+
                ((Math.floor(x/400)%2)*20);

            obstacles.push({
                x:x,
                width:width,
                height:height
            });

            coinList.push(x-80);

            x+=280+
                ((Math.floor(x/350)%3)*40);
        }

        levels.push({
            name:levelNames[i],
            color:levelColors[i],
            length:length,
            speed:speed,
            obstacles:obstacles,
            coins:coinList
        });
    }
}


createLevels();


/* ==========================================================
   POSTAĆ
========================================================== */

function createPlayer(){

    return{
        x:120,
        y:getGroundY()-42,

        width:42,
        height:42,

        velocityY:0,

        grounded:true,

        rotation:0,

        blinkTimer:0,

        blinking:false
    };
}


function getGroundY(){

    return H-95;
}


/* ==========================================================
   MENU
========================================================== */

function hideAllPanels(){

    var panels=document.querySelectorAll(".panel");

    var i;

    for(i=0;i<panels.length;i++){

        panels[i].classList.add("hidden");
    }
}


function goHome(){

    running=false;
    paused=false;

    leftPressed=false;
    rightPressed=false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId=0;
    }

    hideAllPanels();

    game.classList.add("hidden");

    menu.classList.remove("hidden");

    drawMenuBackground();
}


/* ==========================================================
   START GRY
========================================================== */

function startGame(index){

    hideAllPanels();

    menu.classList.add("hidden");

    game.classList.remove("hidden");

    if(typeof index!=="number")
        index=0;

    if(index<0)
        index=0;

    if(index>=levels.length)
        index=levels.length-1;

    levelIndex=index;

    currentLevel=levels[levelIndex];

    player=createPlayer();

    cameraX=0;

    coinsTaken=[];

    particles=[];

    running=true;
    paused=false;

    $("levelName").textContent=
        "Poziom "+
        (levelIndex+1)+
        " — "+
        currentLevel.name;

    updateProgress();

    lastTime=performance.now();

    if(animationId)
        cancelAnimationFrame(animationId);

    animationId=
        requestAnimationFrame(gameLoop);
}


/* ==========================================================
   PĘTLA
========================================================== */

function gameLoop(time){

    if(!running)
        return;

    animationId=
        requestAnimationFrame(gameLoop);

    if(paused)
        return;

    var dt=
        (time-lastTime)/16.666;

    if(!isFinite(dt))
        dt=1;

    if(dt<0.2)
        dt=0.2;

    if(dt>2)
        dt=2;

    lastTime=time;

    update(dt);

    draw();
}


/* ==========================================================
   UPDATE
========================================================== */

function update(dt){

    if(!player || !currentLevel)
        return;


    /* RUCH */

    var speed=currentLevel.speed;

    if(leftPressed)
        speed-=2;

    if(rightPressed)
        speed+=2;

    if(speed<2)
        speed=2;

    player.x+=speed*dt;


    /* GRAWITACJA */

    player.velocityY+=0.72*dt;

    player.y+=player.velocityY*dt;


    var floor=
        getGroundY()-
        player.height;


    if(player.y>=floor){

        player.y=floor;

        player.velocityY=0;

        player.grounded=true;

        player.rotation*=0.75;

    }else{

        player.grounded=false;

        player.rotation+=0.055*dt;
    }


    /* MRUGANIE */

    player.blinkTimer+=dt;

    if(player.blinkTimer>180){

        player.blinkTimer=0;

        player.blinking=true;

        setTimeout(
            function(){

                if(player)
                    player.blinking=false;

            },
            100
        );
    }


    /* KOLIZJE */

    var i;

    for(i=0;i<currentLevel.obstacles.length;i++){

        var obstacle=
            currentLevel.obstacles[i];

        var obstacleY=
            getGroundY()-
            obstacle.height;

        if(
            player.x+player.width-5>obstacle.x &&
            player.x+5<obstacle.x+obstacle.width &&
            player.y+player.height-5>obstacleY
        ){

            die();

            return;
        }
    }


    /* MONETY */

    for(i=0;i<currentLevel.coins.length;i++){

        if(coinsTaken.indexOf(i)!==-1)
            continue;

        var coinX=currentLevel.coins[i];

        var coinY=getGroundY()-95;

        var dx=
            player.x+
            player.width/2-
            coinX;

        var dy=
            player.y+
            player.height/2-
            coinY;

        if(Math.sqrt(dx*dx+dy*dy)<35){

            coinsTaken.push(i);

            save.coins++;

            saveGame();

            createParticles(
                coinX,
                coinY,
                currentLevel.color,
                10
            );

            checkAchievements();
        }
    }


    /* KAMERA */

    var target=
        player.x-150;

    if(target>cameraX){

        cameraX+=
            (target-cameraX)*
            0.12*
            dt;
    }

    if(cameraX<0)
        cameraX=0;


    /* META */

    if(player.x>=currentLevel.length){

        win();

        return;
    }


    /* PARTICLES */

    for(i=particles.length-1;i>=0;i--){

        var p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=0.12*dt;

        p.life-=dt;

        if(p.life<=0)
            particles.splice(i,1);
    }


    updateProgress();
}


/* ==========================================================
   SKOK
========================================================== */

function jump(){

    if(!running)
        return;

    if(paused)
        return;

    if(!player)
        return;

    if(player.grounded){

        player.velocityY=-13;

        player.grounded=false;

        createParticles(
            player.x+21,
            getGroundY(),
            currentLevel.color,
            7
        );

        playSound(
            520,
            0.08
        );
    }
}


/* ==========================================================
   ŚMIERĆ
========================================================== */

function die(){

    if(!running)
        return;

    running=false;

    playSound(
        110,
        0.18
    );

    setTimeout(
        function(){

            var again=
                window.confirm(
                    "Ups! Rozbiłeś się.\n\nZagrać jeszcze raz?"
                );

            if(again){

                startGame(levelIndex);

            }else{

                goHome();
            }

        },
        200
    );
}


/* ==========================================================
   WYGRANA
========================================================== */

function win(){

    if(!running)
        return;

    running=false;

    if(
        save.completed.indexOf(levelIndex)
        ===-1
    ){

        save.completed.push(levelIndex);

        save.coins+=5;

        if(
            levelIndex+1>
            save.unlocked
        ){

            save.unlocked=
                levelIndex+2;
        }

        saveGame();
    }

    checkAchievements();

    playSound(
        700,
        0.12
    );

    setTimeout(
        function(){
            playSound(
                900,
                0.12
            );
        },
        120
    );

    $("winPanel")
        .classList
        .remove("hidden");

    if(levelIndex>=levels.length-1){

        $("nextButton")
            .classList
            .add("hidden");

    }else{

        $("nextButton")
            .classList
            .remove("hidden");
    }
}


/* ==========================================================
   POSTĘP
========================================================== */

function updateProgress(){

    if(!currentLevel || !player)
        return;

    var percent=
        (player.x/currentLevel.length)*100;

    if(percent<0)
        percent=0;

    if(percent>100)
        percent=100;

    $("progressText").textContent=
        Math.floor(percent)+"%";

    $("progressBar").style.width=
        percent+"%";
}


/* ==========================================================
   RYSOWANIE TŁA MENU
========================================================== */

function drawMenuBackground(){

    var gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#111342"
    );

    gradient.addColorStop(
        1,
        "#030306"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* ==========================================================
   RYSOWANIE
========================================================== */

function draw(){

    if(!running && !currentLevel){

        drawMenuBackground();

        return;
    }

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawGround();

    drawObstacles();

    drawCoins();

    drawFinish();

    drawParticles();

    drawPlayer();
}


/* ==========================================================
   TŁO
========================================================== */

function drawBackground(){

    var gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#09092a"
    );

    gradient.addColorStop(
        1,
        "#020204"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    var grid=60;

    var offset=
        -(cameraX*0.25)%grid;

    ctx.strokeStyle=
        currentLevel.color+"18";

    var x;

    for(
        x=offset;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    var y;

    for(
        y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }
}


/* ==========================================================
   ZIEMIA
========================================================== */

function drawGround(){

    var gy=getGroundY();

    ctx.fillStyle="#10101b";

    ctx.fillRect(
        0,
        gy,
        W,
        H-gy
    );

    ctx.fillStyle=
        currentLevel.color;

    ctx.shadowColor=
        currentLevel.color;

    ctx.shadowBlur=12;

    ctx.fillRect(
        0,
        gy-4,
        W,
        4
    );

    ctx.shadowBlur=0;
}


/* ==========================================================
   PRZESZKODY
========================================================== */

function drawObstacles(){

    var gy=getGroundY();

    var i;

    for(i=0;i<currentLevel.obstacles.length;i++){

        var o=
            currentLevel.obstacles[i];

        var x=o.x-cameraX;

        if(
            x+o.width<0 ||
            x>W
        )
            continue;

        var y=
            gy-o.height;

        ctx.fillStyle="#ff3d68";

        ctx.shadowColor="#ff174f";

        ctx.shadowBlur=15;

        ctx.fillRect(
            x,
            y,
            o.width,
            o.height
        );

        ctx.shadowBlur=0;

        ctx.fillStyle="#ff9bb2";

        ctx.fillRect(
            x+5,
            y+5,
            o.width-10,
            5
        );
    }
}


/* ==========================================================
   MONETY
========================================================== */

function drawCoins(){

    var gy=getGroundY();

    var i;

    for(i=0;i<currentLevel.coins.length;i++){

        if(coinsTaken.indexOf(i)!==-1)
            continue;

        var x=
            currentLevel.coins[i]-
            cameraX;

        var y=gy-95;

        if(x<-30 || x>W+30)
            continue;

        ctx.fillStyle="#ffe600";

        ctx.shadowColor="#ffe600";

        ctx.shadowBlur=15;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    }
}


/* ==========================================================
   META
========================================================== */

function drawFinish(){

    var x=
        currentLevel.length-
        cameraX;

    if(x<-100 || x>W+100)
        return;

    var gy=getGroundY();

    ctx.fillStyle=
        currentLevel.color;

    ctx.shadowColor=
        currentLevel.color;

    ctx.shadowBlur=20;

    ctx.fillRect(
        x,
        gy-150,
        8,
        150
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="white";

    ctx.font="bold 16px Arial";

    ctx.fillText(
        "META",
        x-20,
        gy-160
    );
}


/* ==========================================================
   POSTAĆ
========================================================== */

function drawPlayer(){

    if(!player)
        return;

    var skin=
        skins[save.selectedSkin];

    if(!skin)
        skin=skins[0];

    var x=
        player.x-
        cameraX;

    var y=
        player.y;

    var size=42;

    var cx=
        x+
        size/2;

    var cy=
        y+
        size/2;


    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        player.rotation
    );

    ctx.translate(
        -size/2,
        -size/2
    );


    /* JEDNA BRYŁA */

    ctx.fillStyle=
        skin.color;

    ctx.shadowColor=
        skin.color;

    ctx.shadowBlur=18;


    /* Zwykły prostokąt z zaokrąglonymi rogami.
       Bez roundRect(), żeby działało też
       w starszych przeglądarkach. */

    var r=7;

    ctx.beginPath();

    ctx.moveTo(
        r,
        0
    );

    ctx.lineTo(
        size-r,
        0
    );

    ctx.quadraticCurveTo(
        size,
        0,
        size,
        r
    );

    ctx.lineTo(
        size,
        size-r
    );

    ctx.quadraticCurveTo(
        size,
        size,
        size-r,
        size
    );

    ctx.lineTo(
        r,
        size
    );

    ctx.quadraticCurveTo(
        0,
        size,
        0,
        size-r
    );

    ctx.lineTo(
        0,
        r
    );

    ctx.quadraticCurveTo(
        0,
        0,
        r,
        0
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;


    /* OCZY */

    ctx.fillStyle="#101018";


    if(player.blinking){

        ctx.fillRect(
            8,
            18,
            8,
            2
        );

        ctx.fillRect(
            26,
            18,
            8,
            2
        );

    }else{

        ctx.beginPath();

        ctx.arc(
            13,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            29,
            19,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(
            12,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            28,
            18,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* USTA */

    ctx.strokeStyle="#101018";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        15,
        30
    );

    ctx.lineTo(
        27,
        30
    );

    ctx.stroke();


    ctx.restore();
}


/* ==========================================================
   PARTICLES
========================================================== */

function createParticles(
    x,
    y,
    color,
    amount
){

    var i;

    for(i=0;i<amount;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-0.5)*5,

            vy:
                (Math.random()-0.5)*5,

            life:30,

            color:color
        });
    }
}


function drawParticles(){

    var i;

    for(i=0;i<particles.length;i++){

        var p=particles[i];

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/30
            );

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            4,
            4
        );
    }

    ctx.globalAlpha=1;
}

                save.ownedSkins.indexOf(index)!==-1;

            var selected=
                save.selectedSkin===index;

            div.className=
                "skin"+

            var preview=
                document.createElement("div");

            preview.className="skinPreview";

            preview.style.background=

            preview.style.boxShadow=
                "0 0 15px "+skin.color;


            var name=
                document.createElement("div");

            name.style.marginTop="10px";

            name.textContent=
                skin.name;


            var price=
                document.createElement("div");

            price.style.marginTop="5px";

            price.style.color="#aaa";

            if(owned){

                price.textContent=
                    "POSIADANY";

            }else{

                price.textContent=
                    skin.price+
                    " monet";
            }


            div.appendChild(preview);

            div.appendChild(name);

            div.appendChild(price);


            div.addEventListener(
                "click",
                function(){

                    if(owned){

                        save.selectedSkin=
                            index;

                        saveGame();

                        renderShop();

                        return;
                    }

                    if(
                        save.coins>=
                        skin.price
                    ){

                        save.coins-=
                            skin.price;

                        save.ownedSkins.push(
                            index
                        );

                        save.selectedSkin=
                            index;

                        saveGame();

                        renderShop();

                        playSound(
                            800,
                            0.1
                        );
                    }
                }
            );


            grid.appendChild(div);

        })(i);
    }
}

var audioContext=null;


function getAudioContext(){

    try{

        var AudioClass=
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass)
            return null;

        if(!audioContext)
            audioContext=
                new AudioClass();

        if(
            audioContext.state===
            "suspended"
        ){

            audioContext.resume();
        }

        return audioContext;

    }catch(error){

        return null;
    }
}


function playSound(
    frequency,
    duration
){

    if(!save.sound)
        return;

    var audio=
        getAudioContext();

    if(!audio)
        return;

    try{

        var oscillator=
            audio.createOscillator();

        var gain=
            audio.createGain();

        oscillator.type="square";

        oscillator.frequency.value=
            frequency;

        gain.gain.setValueAtTime(
            0.035,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime+duration
        );

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime+
            duration
        );

    }catch(error){}
}
