<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#03030a;
  color:white;
  font-family:Arial,sans-serif;
}

button{
  font:inherit;
  color:white;
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

#menu{
  position:fixed;
  inset:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 14px 30px;
  background:
    radial-gradient(circle at 50% 5%,#252b78,#090a20 45%,#020207);
}

.logo{
  margin:12px 0 4px;
  font-size:clamp(30px,7vw,54px);
  font-weight:900;
  letter-spacing:5px;
  text-align:center;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 45px #a855ff;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:18px;
}

.progress{
  width:min(680px,100%);
  background:#11152d;
  border:2px solid #303963;
  border-radius:17px;
  padding:15px;
  margin-bottom:15px;
}

.progressTop{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.bar{
  height:13px;
  background:#050712;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

#menuBar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#00eaff,#7b5cff,#ff27d7);
  box-shadow:0 0 14px #00eaff;
  transition:.3s;
}

#doneText{
  text-align:center;
  opacity:.65;
  margin-top:7px;
}

#levels{
  width:min(680px,100%);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.level{
  min-height:82px;
  text-align:left;
  padding:12px;
  border-radius:15px;
  border:2px solid #303861;
  background:linear-gradient(135deg,#171c3b,#0d1024);
}

.level:active{
  transform:scale(.96);
}

.levelStatus{
  float:right;
  font-size:20px;
}

.levelName{
  font-weight:900;
  font-size:17px;
}

.levelInfo{
  font-size:12px;
  opacity:.7;
  margin-top:5px;
}

#achBtn{
  width:min(680px,100%);
  min-height:48px;
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:#242a50;
  border:2px solid #414d7c;
  font-weight:bold;
}

#achievements,
#pause,
#finish{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:15px;
}

.panel{
  width:min(570px,100%);
  max-height:90vh;
  overflow:auto;
  background:#10142c;
  border:2px solid #3d4a7d;
  border-radius:20px;
  padding:20px;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

.panel button{
  width:100%;
  min-height:46px;
  margin-top:9px;
  padding:12px;
  border-radius:12px;
  background:#29335e;
  font-weight:bold;
}

.ach{
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  background:#191e3b;
  opacity:.4;
}

.ach.on{
  opacity:1;
  border:1px solid #00eaff;
}

#game{
  position:fixed;
  inset:0;
  display:none;
  touch-action:none;
}

canvas{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  z-index:4;
  left:10px;
  right:10px;
  top:10px;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

.hudLine{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(12px,2.8vw,17px);
  font-weight:bold;
}

.hudBar{
  margin-top:7px;
  height:9px;
  background:#0008;
  border-radius:20px;
  overflow:hidden;
}

#gameBar{
  height:100%;
  width:0;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
}

.gameButtons{
  position:absolute;
  right:10px;
  top:10px;
  z-index:10;
  display:flex;
  gap:7px;
}

.gameButtons button{
  min-width:44px;
  min-height:44px;
  padding:8px 11px;
  background:#10162ddd;
  border:1px solid #53618e;
  border-radius:10px;
}

@media(max-width:650px){
  #levels{
    grid-template-columns:1fr;
  }
}

@media(min-width:1000px){
  #levels{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
</style>

</head>

<script>
"use strict";

/* =========================
   POZIOMY
========================= */

const LEVELS=[
 {name:"NEON RUSH",diff:"⭐⭐",speed:280,color:"#00eaff",bpm:124,wave:"square",notes:[262,330,392,523,392,330,294,330],gravity:1},
 {name:"CRYSTAL DRIVE",diff:"⭐⭐⭐",speed:295,color:"#72a7ff",bpm:112,wave:"triangle",notes:[196,247,294,370,494,370,294,247],gravity:1},
 {name:"LAVA PULSE",diff:"⭐⭐⭐⭐",speed:310,color:"#ff4d42",bpm:140,wave:"sawtooth",notes:[110,110,165,147,110,131,98,110],gravity:1},
 {name:"SKY CIRCUIT",diff:"⭐⭐⭐⭐",speed:305,color:"#9c7bff",bpm:132,wave:"sine",notes:[330,392,494,659,587,494,392,330],gravity:1},
 {name:"VIOLET RUN",diff:"⭐⭐⭐⭐",speed:320,color:"#d35cff",bpm:128,wave:"triangle",notes:[220,277,330,440,523,440,330,277],gravity:1},
 {name:"SHADOW FACTORY",diff:"⭐⭐⭐⭐⭐",speed:325,color:"#b44cff",bpm:118,wave:"square",notes:[147,174,220,207,147,174,233,220],gravity:1},
 {name:"CYBER STORM",diff:"⭐⭐⭐⭐⭐",speed:335,color:"#27f0c5",bpm:136,wave:"triangle",notes:[165,220,277,330,440,330,277,220],gravity:1},
 {name:"INFERNO CORE",diff:"⭐⭐⭐⭐⭐",speed:345,color:"#ff7338",bpm:145,wave:"sawtooth",notes:[98,123,147,196,147,123,110,98],gravity:1},
 {name:"ELECTRIC VOID",diff:"⭐⭐⭐⭐⭐⭐",speed:355,color:"#35b7ff",bpm:150,wave:"square",notes:[220,330,440,659,523,440,330,247],gravity:1},
 {name:"GRAVITY BREAK",diff:"⭐⭐⭐⭐⭐⭐",speed:340,color:"#45ff9a",bpm:142,wave:"triangle",notes:[196,247,330,392,494,392,330,247],gravity:-1},
 {name:"OVERDRIVE",diff:"⭐⭐⭐⭐⭐⭐",speed:365,color:"#ff3bea",bpm:154,wave:"square",notes:[247,330,440,523,659,523,440,330],gravity:1},
 {name:"FINAL CHAOS",diff:"⭐⭐⭐⭐⭐⭐",speed:375,color:"#ff247f",bpm:158,wave:"sawtooth",notes:[220,330,440,659,523,784,659,440],gravity:1}
];

/* =========================
   DOM
========================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const levelsBox=document.getElementById("levels");
const achievements=document.getElementById("achievements");
const achList=document.getElementById("achList");

const pause=document.getElementById("pause");
const finish=document.getElementById("finish");

const levelName=document.getElementById("levelName");
const coinsText=document.getElementById("coins");
const percent=document.getElementById("percent");
const menuBar=document.getElementById("menuBar");
const gameBar=document.getElementById("gameBar");
const progressText=document.getElementById("progressText");
const doneText=document.getElementById("doneText");

/* =========================
   STORAGE
========================= */

function get(key,def){
  try{
    const value=localStorage.getItem(key);
    return value===null?def:value;
  }catch{
    return def;
  }
}

function set(key,value){
  try{
    localStorage.setItem(key,String(value));
  }catch{}
}

function completed(i){
  return get("nd_level_"+i,"0")==="1";
}

function completedCount(){
  let n=0;

  for(let i=0;i<LEVELS.length;i++){
    if(completed(i))n++;
  }

  return n;
}

/* =========================
   ACHIEVEMENTY
========================= */

const ACH=[
 ["first","🎮 Pierwszy krok","Ukończ poziom 1."],
 ["three","⚡ Rozgrzewka","Ukończ 3 poziomy."],
 ["six","🔥 Weteran","Ukończ 6 poziomów."],
 ["all","👑 Mistrz Neon Dash","Ukończ wszystkie poziomy."],
 ["final","💀 Chaos pokonany","Ukończ FINAL CHAOS."],
 ["coins10","🪙 Łowca monet","Zbierz 10 monet."],
 ["coins25","💰 Kolekcjoner","Zbierz 25 monet."],
 ["perfect","💎 Perfekcja","Ukończ poziom bez śmierci."],
 ["survivor","🛡️ Twardziel","Ukończ poziom po 3+ śmierciach."],
 ["allcoins","🌟 Pełna kolekcja","Zbierz wszystkie 3 monety."]
];

function achUnlocked(id){
  return get("nd_ach_"+id,"0")==="1";
}

function unlock(id){
  if(achUnlocked(id))return;

  set("nd_ach_"+id,"1");
  renderAchievements();
}

function checkAchievements(){

  const n=completedCount();

  if(n>=1)unlock("first");
  if(n>=3)unlock("three");
  if(n>=6)unlock("six");
  if(n>=12)unlock("all");

  if(completed(11))unlock("final");

  const total=Number(get("nd_totalCoins","0"));

  if(total>=10)unlock("coins10");
  if(total>=25)unlock("coins25");

  if(deaths===0)unlock("perfect");
  if(deaths>=3)unlock("survivor");

  if(runCoins===3)unlock("allcoins");
}

function renderAchievements(){

  achList.innerHTML="";

  ACH.forEach(a=>{

    const div=document.createElement("div");

    div.className=
      "ach"+
      (achUnlocked(a[0])?" on":"");

    div.innerHTML=
      "<b>"+a[1]+"</b><br>"+
      "<small>"+a[2]+"</small>";

    achList.appendChild(div);
  });
}

/* =========================
   MENU
========================= */

function renderMenu(){

  levelsBox.innerHTML="";

  LEVELS.forEach((level,index)=>{

    const button=document.createElement("button");

    button.type="button";
    button.className="level";

    button.innerHTML=
      '<span class="levelStatus">'+
      (completed(index)?"✅":"▶️")+
      '</span>'+
      '<div class="levelName">'+
      (index+1)+". "+level.name+
      '</div>'+
      '<div class="levelInfo">'+
      level.diff+
      " • "+
      level.speed+
      " px/s"+
      '</div>';

    button.addEventListener("click",function(e){

      e.preventDefault();
      e.stopPropagation();

      startFromButton(index);

    });

    levelsBox.appendChild(button);
  });

  const done=completedCount();

  const progress=
    Math.round(
      done/LEVELS.length*100
    );

  progressText.textContent=
    progress+"%";

  menuBar.style.width=
    progress+"%";

  doneText.textContent=
    done+" / "+
    LEVELS.length+
    " poziomów";
}

/* =========================
   CANVAS
========================= */

let W=window.innerWidth;
let H=window.innerHeight;
let ground=H*.78;

const player={
  x:150,
  y:0,
  size:34,
  vy:0,
  rot:0,
  grounded:false
};

function resize(){

  W=Math.max(240,window.innerWidth);
  H=Math.max(240,window.innerHeight);

  const d=Math.min(
    Math.max(window.devicePixelRatio||1,1),
    2
  );

  canvas.width=Math.round(W*d);
  canvas.height=Math.round(H*d);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(d,0,0,d,0,0);

  ground=
    Math.max(
      160,
      Math.min(
        H-55,
        H*.78
      )
    );

  if(!running){
    player.y=ground-player.size;
  }

  createStars();
}

window.addEventListener("resize",resize);

/* =========================
   GAME STATE
========================= */

let current=0;
let running=false;
let paused=false;
let finished=false;
let dying=false;

let world=0;
let last=0;
let raf=0;

let deaths=0;
let runCoins=0;

let collected=new Set();

let obstacles=[];
let coinObjects=[];
let pads=[];
let portals=[];

let particles=[];
let stars=[];
let trail=[];

let shake=0;
let flash=0;

let gravityDirection=1;

/* =========================
   AUDIO
========================= */

let audio=null;
let masterGain=null;
let musicTimer=null;
let musicIndex=0;

let sound=
  get("nd_sound","1")==="1";

function initAudio(){

  if(audio)return true;

  try{

    const AudioClass=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioClass)return false;

    audio=new AudioClass();

    masterGain=
      audio.createGain();

    masterGain.gain.value=.75;

    masterGain.connect(
      audio.destination
    );

    return true;

  }catch{
    audio=null;
    masterGain=null;
    return false;
  }
}

function unlockAudio(){

  if(!sound)return Promise.resolve();

  if(!initAudio())
    return Promise.resolve();

  try{

    if(audio.state==="suspended"){
      return audio.resume().catch(()=>{});
    }

  }catch{}

  return Promise.resolve();
}

function playTone(
  frequency,
  duration=.15,
  volume=.08,
  type="sine"
){

  if(!sound)return;
  if(!audio||!masterGain)return;
  if(audio.state!=="running")return;

  try{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type=type;
    osc.frequency.value=frequency;

    const now=
      audio.currentTime;

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      now+.015
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now+duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now+duration+.02);

  }catch{}
}

function startMusic(){

  stopMusic();

  if(!sound)return;

  if(!initAudio())return;

  if(audio.state!=="running"){
    audio.resume().catch(()=>{});
  }

  const level=
    LEVELS[current];

  musicIndex=0;

  function note(){

    if(
      !sound||
      !running||
      paused||
      !audio||
      audio.state!=="running"
    ){
      return;
    }

    try{

      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();

      const now=
        audio.currentTime;

      const frequency=
        level.notes[
          musicIndex%
          level.notes.length
        ];

      osc.type=
        level.wave;

      osc.frequency.setValueAtTime(
        frequency,
        now
      );

      gain.gain.setValueAtTime(
        .0001,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        .055,
        now+.015
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        now+.20
      );

      osc.connect(gain);
      gain.connect(masterGain);

      osc.start(now);
      osc.stop(now+.22);

      musicIndex++;

    }catch{}
  }

  note();

  musicTimer=
    setInterval(
      note,
      60000/level.bpm
    );
}

function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;
  }
}

function updateSoundButton(){

  document.getElementById(
    "soundBtn"
  ).textContent=
    sound?"🔊":"🔇";
}

/* =========================
   START
========================= */

function startFromButton(index){

  if(sound){

    initAudio();

    try{
      if(audio.state==="suspended"){
        audio.resume();
      }
    }catch{}
  }

  startLevel(index,true);

  if(sound){

    setTimeout(()=>{

      if(
        running&&
        !paused
      ){

        startMusic();

        playTone(
          660,
          .12,
          .08,
          "triangle"
        );
      }

    },80);
  }
}

function resetPlayer(){

  player.x=
    Math.max(
      80,
      Math.min(
        180,
        W*.22
      )
    );

  player.y=
    gravityDirection===1?
    ground-player.size:
    0;

  player.vy=0;
  player.rot=0;
  player.grounded=true;
}

function startLevel(index,newRun=true){

  if(
    index<0||
    index>=LEVELS.length
  )return;

  current=index;

  if(newRun){

    deaths=0;
    runCoins=0;
    collected=new Set();
  }

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){
    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="block";
  menu.style.display="none";

  pause.style.display="none";
  finish.style.display="none";

  world=0;
  last=performance.now();

  particles=[];
  trail=[];
  shake=0;
  flash=0;

  gravityDirection=
    LEVELS[current].gravity;

  resetPlayer();

  generateLevel();
  createStars();

  levelName.textContent=
    (current+1)+
    " • "+
    LEVELS[current].name;

  coinsText.textContent=
    "🪙 "+
    runCoins+
    "/3";

  running=true;

  if(sound){
    startMusic();
  }

  draw();

  raf=
    requestAnimationFrame(loop);
}

/* =========================
   LEVEL GENERATION
========================= */

function generateLevel(){

  obstacles=[];
  coinObjects=[];
  pads=[];
  portals=[];

  const length=
    10500+
    current*650;

  let x=650;
  let pattern=0;

  const patterns=[
    "spike",
    "double",
    "saw",
    "gap",
    "pad",
    "spike",
    "saw",
    "speed",
    "double",
    "gap",
    "spikeSaw",
    "gravity",
    "triple"
  ];

  while(x<length-700){

    const type=
      patterns[
        pattern%patterns.length
      ];

    if(type==="spike"){
      spike(x);
      x+=430;
    }

    else if(type==="double"){
      spike(x);
      spike(x+65);
      x+=520;
    }

    else if(type==="triple"){
      spike(x);
      spike(x+65);
      spike(x+130);
      x+=610;
    }

    else if(type==="saw"){
      saw(x);
      x+=520;
    }

    else if(type==="spikeSaw"){
      spike(x);
      saw(x+230);
      x+=650;
    }

    else if(type==="gap"){
      gap(x,150);
      x+=630;
    }

    else if(type==="pad"){
      pad(x);
      spike(x+190);
      x+=600;
    }

    else if(type==="speed"){
      speedPortal(x);
      spike(x+250);
      saw(x+480);
      x+=760;
    }

    else if(type==="gravity"){
      gravityPortal(x);
      spike(x+280);
      spike(x+345);
      x+=720;
    }

    pattern++;
  }

  const positions=[
    length*.25,
    length*.52,
    length*.79
  ];

  positions.forEach((cx,i)=>{

    let finalX=cx;

    for(let n=0;n<30;n++){

      let bad=false;

      for(const o of obstacles){

        if(o.type==="gap"){

          if(
            finalX>o.x-80&&
            finalX<o.x+o.w+80
          ){
            bad=true;
            break;
          }

        }else{

          if(
            Math.abs(finalX-o.x)<100
          ){
            bad=true;
            break;
          }
        }
      }

      if(!bad)break;

      finalX+=110;
    }

    coinObjects.push({
      id:i,
      x:finalX,
      collected:false
    });
  });
}

/* =========================
   UPDATE
========================= */

function update(dt){

  const speed=
    LEVELS[current].speed;

  world+=speed*dt;

  player.vy+=
    2100*
    gravityDirection*
    dt;

  player.y+=
    player.vy*dt;

  if(gravityDirection===1){

    const floor=
      ground-player.size;

    if(
      player.y>=floor&&
      !gapUnder()
    ){

      player.y=floor;
      player.vy=0;
      player.grounded=true;

      player.rot=
        Math.round(
          player.rot/(Math.PI/2)
        )*
        Math.PI/2;

    }else{

      player.grounded=false;
      player.rot+=dt*8;
    }

  }else{

    if(
      player.y<=0&&
      !gapUnder()
    ){

      player.y=0;
      player.vy=0;
      player.grounded=true;

    }else{

      player.grounded=false;
      player.rot-=dt*8;
    }
  }

  checkPads();
  checkPortals();
  checkCoins();
  collisions();

  if(Math.random()<.8){

    trail.push({
      x:player.x+17,
      y:player.y+17,
      life:.3,
      size:16
    });
  }

  updateTrail(dt);
  updateParticles(dt);

  if(shake>0){
    shake-=dt*13;
    if(shake<0)shake=0;
  }

  if(flash>0){
    flash-=dt*3;
    if(flash<0)flash=0;
  }
}

function gapUnder(){

  const center=
    world+
    player.x+
    player.size/2;

  for(const o of obstacles){

    if(
      o.type==="gap"&&
      center>o.x&&
      center<o.x+o.w
    ){
      return true;
    }
  }

  return false;
}

/* =========================
   MECHANICS
========================= */

function checkPads(){

  for(const p of pads){

    if(p.used)continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+50&&
      player.grounded
    ){

      p.used=true;

      player.vy=
        -1000*
        gravityDirection;

      player.grounded=false;

      particlesPad(
        p.x-world
      );

      playTone(
        880,
        .12,
        .07,
        "triangle"
      );
    }
  }
}

function checkPortals(){

  for(const p of portals){

    if(p.used)continue;

    const px=
      world+
      player.x+
      17;

    if(
      px>p.x&&
      px<p.x+55
    ){

      p.used=true;

      if(p.type==="gravity"){

        gravityDirection*=-1;

        player.vy=0;
        player.grounded=false;

        particlesPortal(
          p.x-world
        );

        playTone(
          330,
          .18,
          .08,
          "sawtooth"
        );
      }
    }
  }
}

function checkCoins(){

  for(const coin of coinObjects){

    if(coin.collected)continue;

    const x=
      coin.x-world;

    const y=
      gravityDirection===1?
      ground-125:
      125;

    const px=
      player.x+17;

    const py=
      player.y+17;

    if(
      Math.hypot(
        px-x,
        py-y
      )<35
    ){

      coin.collected=true;
      collected.add(coin.id);

      runCoins=
        collected.size;

      coinsText.textContent=
        "🪙 "+
        runCoins+
        "/3";

      particlesCoin(x,y);

      playTone(
        1000,
        .12,
        .08,
        "triangle"
      );
    }
  }
}

/* =========================
   COLLISION
========================= */

function collisions(){

  const px=
    world+
    player.x;

  const s=
    player.size;

  const left=px+6;
  const right=px+s-6;

  const top=player.y+6;
  const bottom=player.y+s-5;

  for(const o of obstacles){

    if(o.type==="spike"){

      if(
        gravityDirection===1&&
        right>o.x+7&&
        left<o.x+44&&
        bottom>ground-48
      ){

        die();
        return;
      }

      if(
        gravityDirection===-1&&
        right>o.x+7&&
        left<o.x+44&&
        top<48
      ){

        die();
        return;
      }
    }

    if(o.type==="saw"){

      const cx=o.x;

      const cy=
        gravityDirection===1?
        ground-o.r:
        o.r;

      const nx=
        Math.max(
          left,
          Math.min(cx,right)
        );

      const ny=
        Math.max(
          top,
          Math.min(cy,bottom)
        );

      const dx=cx-nx;
      const dy=cy-ny;

      if(
        dx*dx+dy*dy<
        (o.r-5)*(o.r-5)
      ){

        die();
        return;
      }
    }

    if(o.type==="gap"){

      const center=
        world+
        player.x+
        s/2;

      if(
        gravityDirection===1&&
        center>o.x&&
        center<o.x+o.w&&
        bottom>=ground-8
      ){

        die();
        return;
      }
    }
  }
}

/* =========================
   DEATH
========================= */

function die(){

  if(
    dying||
    finished||
    !running
  )return;

  dying=true;
  deaths++;

  running=false;

  shake=14;
  flash=1;

  particlesDeath();

  playTone(
    120,
    .35,
    .10,
    "sawtooth"
  );

  setTimeout(()=>{

    if(!dying)return;

    dying=false;

    startLevel(
      current,
      false
    );

  },650);
}

/* =========================
   WIN
========================= */

function checkWin(){

  const length=
    10500+
    current*650;

  if(world>=length){
    finishLevel();
  }
}

function finishLevel(){

  if(finished)return;

  finished=true;
  running=false;

  stopMusic();

  set(
    "nd_level_"+current,
    "1"
  );

  const old=
    Number(
      get("nd_totalCoins","0")
    );

  set(
    "nd_totalCoins",
    old+runCoins
  );

  checkAchievements();

  particlesWin();

  document.getElementById(
    "finishTitle"
  ).textContent=
    "🎉 POZIOM UKOŃCZONY!";

  document.getElementById(
    "finishInfo"
  ).textContent=
    LEVELS[current].name+
    " • 🪙 "+
    runCoins+
    "/3"+
    " • ☠️ "+
    deaths+
    " śmierci";

  finish.style.display="flex";

  renderMenu();

  victoryAnimation();
}

/* =========================
   LOOP
========================= */

function loop(time){

  if(!running)return;

  if(paused){

    last=time;

    raf=requestAnimationFrame(loop);

    return;
  }

  let dt=
    (time-last)/1000;

  if(!Number.isFinite(dt)||dt<0){
    dt=0;
  }

  dt=Math.min(dt,.05);

  last=time;

  update(dt);
  draw();
  checkWin();

  if(running){
    raf=requestAnimationFrame(loop);
  }
}

/* =========================
   DRAW
========================= */

function draw(){

  const level=
    LEVELS[current];

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  const background=
    ctx.createLinearGradient(
      0,0,0,H
    );

  background.addColorStop(
    0,
    "#080b20"
  );

  background.addColorStop(
    1,
    "#020207"
  );

  ctx.fillStyle=background;

  ctx.fillRect(
    0,0,W,H
  );

  drawStars();
  drawGrid();
  drawSpeedLines();

  ctx.fillStyle="#0b0d18";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle=
    level.color;

  ctx.lineWidth=3;

  ctx.shadowColor=
    level.color;

  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();

  ctx.shadowBlur=0;

  for(const o of obstacles){

    const x=
      o.x-world;

    if(
      x<-150||
      x>W+150
    )continue;

    if(o.type==="spike"){
      drawSpike(x);
    }

    else if(o.type==="saw"){
      drawSaw(x,o.r);
    }

    else if(o.type==="gap"){

      ctx.fillStyle="#020207";

      ctx.fillRect(
        x,
        ground,
        o.w,
        H-ground
      );
    }
  }

  for(const p of pads){

    const x=
      p.x-world;

    if(x>-80&&x<W+80){
      drawPad(x);
    }
  }

  for(const p of portals){

    const x=
      p.x-world;

    if(x>-100&&x<W+100){

      if(p.type==="speed"){
        drawSpeedPortal(x);
      }else{
        drawGravityPortal(x);
      }
    }
  }

  for(const coin of coinObjects){

    if(coin.collected)continue;

    const x=
      coin.x-world;

    if(x>-50&&x<W+50){

      drawCoin(
        x,
        gravityDirection===1?
        ground-125:
        125
      );
    }
  }

  drawTrail();

  if(!dying&&!finished){
    drawPlayer();
  }

  drawParticles();

  if(flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,"+
      Math.min(.5,flash*.5)+
      ")";

    ctx.fillRect(
      0,0,W,H
    );
  }

  ctx.restore();

  const length=
    10500+
    current*650;

  const p=Math.min(
    100,
    Math.floor(
      world/length*100
    )
  );

  percent.textContent=
    p+"%";

  gameBar.style.width=
    p+"%";
}

/* =========================
   OBIEKTY
========================= */

function drawSpike(x){

  const color=
    LEVELS[current].color;

  ctx.save();

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=16;

  ctx.beginPath();

  if(gravityDirection===1){

    ctx.moveTo(
      x,
      ground
    );

    ctx.lineTo(
      x+23,
      ground-47
    );

    ctx.lineTo(
      x+46,
      ground
    );

  }else{

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x+23,
      47
    );

    ctx.lineTo(
      x+46,
      0
    );
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";
  ctx.stroke();

  ctx.restore();
}

function drawSaw(x,r){

  const color=
    LEVELS[current].color;

  const y=
    gravityDirection===1?
    ground-r:
    r;

  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(
    performance.now()/280
  );

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=17;

  const teeth=14;

  ctx.beginPath();

  for(let i=0;i<teeth*2;i++){

    const angle=
      i*Math.PI/teeth;

    const radius=
      i%2===0?r:r*.7;

    const px=
      Math.cos(angle)*radius;

    const py=
      Math.sin(angle)*radius;

    if(i===0){
      ctx.moveTo(px,py);
    }else{
      ctx.lineTo(px,py);
    }
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#05050c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawCoin(x,y){

  const scale=
    1+
    Math.sin(
      performance.now()/130
    )*.1;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(scale,scale);

  ctx.shadowColor="#ffd43b";
  ctx.shadowBlur=22;

  ctx.fillStyle="#ffd43b";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    14,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();
}

function drawPad(x){

  ctx.save();

/* =========================
   BACKGROUND
========================= */

function createStars(){

  stars=[];

  for(let i=0;i<75;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*
        Math.max(100,ground*.9),
      r:Math.random()*2+.5,
      v:Math.random()*.8+.2
    });
  }
}

function drawStars(){

  ctx.fillStyle="white";

  for(const star of stars){

    star.x-=star.v;

    if(star.x<0){
      star.x=W;
    }

    ctx.globalAlpha=
      .3+star.r*.2;

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function drawGrid(){

  const color=
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.08;

  const size=70;

  const offset=
    -(world*.25)%size;

  for(
    let x=offset;
    x<W;
    x+=size
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,ground);

    ctx.stroke();
  }

  for(
    let y=40;
    y<ground;
    y+=size
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function drawSpeedLines(){

  const color=
    LEVELS[current].color;

  ctx.strokeStyle=color;
  ctx.globalAlpha=.12;
  ctx.lineWidth=2;

  const offset=
    -(world*.8)%190;

  for(
    let x=offset-190;
    x<W+190;
    x+=190
  ){

    const y=
      100+
      Math.abs(x*7)%
      Math.max(
        100,
        ground-150
      );

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+80,y);

    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

/* =========================
   TRAIL
========================= */

function updateTrail(dt){

  for(
    let i=trail.length-1;
    i>=0;
    i--
  ){

    trail[i].life-=dt;

    if(trail[i].life<=0){
      trail.splice(i,1);
    }
  }

  if(trail.length>35){

    trail.splice(
      0,
      trail.length-35
    );
  }
}

function drawTrail(){

  const color=
    LEVELS[current].color;

  for(const t of trail){

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/.3
      )*.35;

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    ctx.fillRect(
      t.x-t.size/2,
      t.y-t.size/2,
      t.size,
      t.size
    );
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

    max:life,

    type:type,

    spin:(Math.random()-.5)*10
  });
}

function particlesWin(){

    particle(
      W/2,

      (Math.random()-.8)*700,
      1.5+Math.random(),
      Math.random()*8+3,

    );
  }

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=500*dt;
    p.rot+=p.spin*dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/p.max
      );

    let color=
      LEVELS[current].color;

    if(p.type==="coin"){
      color="#ffd43b";
    }

    if(p.type==="pad"){
      color="#49ff9a";
    }

    if(p.type==="portal"){
      color="#ff4be8";
    }

    if(p.type==="win"){

      const colors=[
        "#00eaff",
        "#ff36d1",
        "#ffe14a",
        "#49ff9a",
        "#9c7bff"
      ];

      color=
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ];
    }

    ctx.fillStyle=color;

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(p.rot);

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.fillRect(
      -p.size/2,
      -p.size/2,
      p.size,
      p.size
    );

    ctx.restore();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

/* =========================
   PAUSE
========================= */

function togglePause(){

  if(!running)return;

  paused=!paused;

  pause.style.display=
    paused?"flex":"none";

  if(paused){

    stopMusic();

  }else{

    last=performance.now();

    if(sound){
      startMusic();
    }
  }
}

document.getElementById(
  "pauseBtn"
).addEventListener(
  "click",
  e=>{
    e.stopPropagation();
    togglePause();
  }
);

document.getElementById(
  "resume"
).addEventListener(
  "click",
  ()=>{
    paused=false;
    pause.style.display="none";
    last=performance.now();

    if(sound){
      startMusic();
    }
  }
);

document.getElementById(
  "restart"
).addEventListener(
  "click",
  ()=>{
    pause.style.display="none";
    startLevel(current,true);
  }
);

/* =========================
   MENU
========================= */

function goMenu(){

  running=false;
  paused=false;
  finished=false;
  dying=false;

  if(raf){
    cancelAnimationFrame(raf);
    raf=0;
  }

  stopMusic();

  game.style.display="none";
  menu.style.display="flex";

  pause.style.display="none";
  finish.style.display="none";

  renderMenu();
  renderAchievements();
}

document.getElementById(
  "menuBtn"
).addEventListener(
  "click",
  e=>{
    e.stopPropagation();
    goMenu();
  }
);

document.getElementById(
  "pauseMenu"
).addEventListener(
  "click",
  goMenu
);

document.getElementById(
  "finishMenu"
).addEventListener(
  "click",
  goMenu
);

document.getElementById(
  "again"
).addEventListener(
  "click",
  ()=>{
    startFromButton(current);
  }
);

document.getElementById(
  "next"
).addEventListener(
  "click",
  ()=>{
    if(current<LEVELS.length-1){
      startFromButton(current+1);
    }else{
      goMenu();
    }
  }
);

/* =========================
   SOUND BUTTON
========================= */

document.getElementById(
  "soundBtn"
).addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    sound=!sound;

    set(
      "nd_sound",
      sound?"1":"0"
    );

    updateSoundButton();

    if(sound){

      initAudio();

      try{
        audio.resume();
      }catch{}

      if(running&&!paused){
        startMusic();
      }

    }else{

      stopMusic();
    }
  }
);

/* =========================
   ACHIEVEMENTS
========================= */

document.getElementById(
  "achBtn"
).addEventListener(
  "click",
  ()=>{
    achievements.style.display="flex";
    renderAchievements();
  }
);

document.getElementById(
  "closeAch"
).addEventListener(
  "click",
  ()=>{
    achievements.style.display="none";
  }
);

/* =========================
   AUTO PAUSE
========================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden&&
      running&&
      !paused
    ){

      paused=true;

      pause.style.display="flex";

      stopMusic();
    }
  }
);

window.addEventListener(
  "blur",
  ()=>{

    if(
      running&&
      !paused
    ){

      paused=true;

      pause.style.display="flex";

      stopMusic();
    }
  }
);

/* =========================
   VICTORY
========================= */

function victoryAnimation(){

  let frames=0;

  function animate(){

    if(!finished)return;

    updateParticles(.016);
    draw();

    frames++;

    if(frames<120){
      requestAnimationFrame(animate);
    }
  }

  requestAnimationFrame(animate);
}

/* =========================
   START
========================= */

resize();
renderMenu();
renderAchievements();
updateSoundButton();

</script>
