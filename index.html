```html
<!--
  NEON DASH
  NOWE MENU:
  - animowane neonowe tło
  - gwiazdy i cząsteczki
  - neonowe logo
  - panel statystyk
  - licznik monet
  - liczba ukończonych poziomów
  - przyciski z animacjami
  - podświetlenie przy najechaniu
  - responsywność PC + telefon
  - zachowane istniejące funkcje gry

  WSTAW TEN BLOK CSS DO SWOJEGO index.html
  zamiast starego CSS MENU.
*/

/* =========================
   NOWE NEONOWE MENU
========================= */

#menu{
  position:absolute;
  inset:0;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      #14275c 0%,
      #0a102c 30%,
      #050718 62%,
      #02030b 100%
    );
}

/* delikatna siatka */

#menu::before{
  content:"";
  position:absolute;
  inset:-100px;

  background-image:
    linear-gradient(#00eaff12 1px,transparent 1px),
    linear-gradient(90deg,#00eaff12 1px,transparent 1px);

  background-size:50px 50px;

  transform:perspective(500px)
            rotateX(60deg)
            translateY(160px)
            scale(1.5);

  animation:menuGrid 7s linear infinite;

  pointer-events:none;
}

@keyframes menuGrid{
  from{
    background-position:0 0,0 0;
  }
  to{
    background-position:0 50px,50px 0;
  }
}

/* gwiazdy */

.menu-stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.menu-star{
  position:absolute;
  width:2px;
  height:2px;

  background:#fff;
  border-radius:50%;

  box-shadow:
    0 0 5px #fff,
    0 0 10px #00eaff;

  animation:
    menuStarMove linear infinite,
    menuStarBlink ease-in-out infinite alternate;
}

@keyframes menuStarMove{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(110vh);
  }
}

@keyframes menuStarBlink{
  from{opacity:.15}
  to{opacity:1}
}

/* główne centrum */

.menu-content{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(94%,560px);

  text-align:center;

  z-index:5;
}

/* LOGO */

.logo{
  position:relative;

  margin-bottom:8px;

  font-size:clamp(48px,9vw,88px);

  font-weight:1000;

  letter-spacing:5px;

  color:#fff;

  text-transform:uppercase;

  animation:
    logoFloat 3s ease-in-out infinite,
    logoGlow 2s ease-in-out infinite alternate;

  user-select:none;
}

.logo::before{
  content:"NEON DASH";

  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  color:#00ffff;

  opacity:.22;

  filter:blur(14px);

  z-index:-1;

  white-space:nowrap;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

@keyframes logoGlow{
  from{
    text-shadow:
      0 0 5px #00ffff,
      0 0 15px #00ffff,
      0 0 35px #0088ff;
  }
  to{
    text-shadow:
      0 0 8px #fff,
      0 0 20px #00ffff,
      0 0 45px #00aaff,
      0 0 75px #0066ff;
  }
}

/* napis pod logo */

.menu-subtitle{
  color:#8cefff;
  font-size:12px;
  letter-spacing:5px;
  margin-bottom:22px;
  opacity:.8;
}

/* statystyki */

.menu-stats{
  display:flex;
  justify-content:center;
  gap:10px;

  margin:0 auto 18px;

  width:min(100%,480px);
}

.menu-stat{
  flex:1;

  min-width:0;

  padding:10px 8px;

  border:1px solid #00dfff55;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #071a32cc,
      #071020cc
    );

  box-shadow:
    inset 0 0 20px #00eaff08,
    0 0 15px #00eaff0d;

  backdrop-filter:blur(5px);
}

.menu-stat-value{
  font-size:21px;
  font-weight:900;
  color:#fff;

  text-shadow:
    0 0 8px #00eaff;
}

.menu-stat-label{
  margin-top:3px;

  font-size:9px;
  letter-spacing:1px;

  color:#79ddeb;
}

/* przyciski */

.menu-buttons{
  display:grid;
  gap:10px;

  width:min(100%,460px);

  margin:auto;
}

.menu-btn{
  position:relative;

  min-height:54px;

  border:1px solid #00eaff;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #061426,
      #0a2038,
      #061426
    );

  color:white;

  font-size:17px;
  font-weight:900;

  letter-spacing:1px;

  cursor:pointer;

  overflow:hidden;

  box-shadow:
    0 0 10px #00eaff22,
    inset 0 0 20px #00eaff08;

  transition:
    transform .15s,
    border-color .15s,
    box-shadow .15s,
    background .15s;
}

/* światło przechodzące po przycisku */

.menu-btn::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffffff20,
      transparent
    );

  transform:skewX(-20deg);

  transition:left .45s;
}

.menu-btn:hover::before{
  left:140%;
}

.menu-btn:hover{
  transform:
    translateY(-2px)
    scale(1.025);

  border-color:#fff;

  background:
    linear-gradient(
      90deg,
      #08233e,
      #0d3654,
      #08233e
    );

  box-shadow:
    0 0 10px #00eaff88,
    0 0 30px #00eaff33,
    inset 0 0 25px #00eaff12;
}

.menu-btn:active{
  transform:scale(.97);
}

/* główny przycisk GRAJ */

.menu-btn.play{
  min-height:66px;

  font-size:22px;

  border:2px solid #00ffff;

  background:
    linear-gradient(
      90deg,
      #063a45,
      #07596a,
      #063a45
    );

  box-shadow:
    0 0 15px #00ffff66,
    0 0 35px #00ffff22;
}

.menu-btn.play:hover{
  box-shadow:
    0 0 20px #00ffffaa,
    0 0 50px #00ffff44;
}

/* dolny pasek */

.menu-footer{
  margin-top:17px;

  font-size:9px;

  color:#608797;

  letter-spacing:2px;
}

/* wersja */

.menu-version{
  position:absolute;

  right:12px;
  bottom:10px;

  font-size:9px;

  color:#42606e;

  letter-spacing:1px;
}

/* =========================
   NOWE KARTY POZIOMÓW
========================= */

#levels{
  background:
    radial-gradient(
      circle at 50% 20%,
      #102452,
      #050817 70%
    );
}

#levels .panel{
  border-color:#00eaff;
  box-shadow:
    0 0 25px #00eaff22,
    inset 0 0 35px #00eaff06;
}

#levels .panel h2{
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #0088ff;
}

.level-grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(170px,1fr));

  gap:11px;
}

.level-card{
  position:relative;

  min-height:105px;

  overflow:hidden;

  text-align:left;

  border:1px solid #00d9ff55;

  background:
    linear-gradient(
      145deg,
      #071a2d,
      #071020
    );

  transition:
    transform .15s,
    box-shadow .15s;
}

.level-card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 0 18px #00eaff44;
}

.level-card::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:3px;

  background:currentColor;

  box-shadow:0 0 10px currentColor;
}

.level-number{
  font-size:10px;
  color:#6f9baa;
  letter-spacing:1px;
}

.level-title{
  margin-top:7px;

  font-size:16px;
  font-weight:900;
}

.level-status{
  margin-top:10px;

  font-size:11px;
  color:#a5c9d2;
}

/* =========================
   RESPONSYWNOŚĆ
========================= */

@media(max-width:700px){

  .menu-content{
    width:92%;
  }

  .logo{
    font-size:clamp(42px,13vw,70px);
  }

  .menu-subtitle{
    font-size:9px;
    letter-spacing:3px;
  }

  .menu-stats{
    gap:6px;
  }

  .menu-stat{
    padding:8px 5px;
  }

  .menu-stat-value{
    font-size:17px;
  }

  .menu-stat-label{
    font-size:8px;
  }

  .menu-btn{
    min-height:48px;
    font-size:15px;
  }

  .menu-btn.play{
    min-height:58px;
    font-size:19px;
  }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  .menu-star,
  .logo,
  #menu::before{
    animation:none!important;
  }

  .menu-btn{
    transition:none;
  }
}
```

I dodaj tę funkcję do JavaScriptu:

```javascript
function updateMenuStats(){

  const completed =
    document.getElementById("menuCompleted");

  const coins =
    document.getElementById("menuCoins");

  const achievements =
    document.getElementById("menuAchievements");

  if(completed){
    completed.textContent =
      data.completed.length + "/" + levels.length;
  }

  if(coins){
    coins.textContent = data.coins;
  }

  if(achievements){
    achievements.textContent =
      data.achievements.length + "/" + achievements.length;
  }
}
```

Po każdym `saveData()` możesz też wywołać:

```javascript
updateMenuStats();
```

oraz po uruchomieniu gry:

```javascript
updateMenuStats();
```

**Efekt:** menu będzie wyglądało dużo bardziej jak prawdziwa gra — neonowe tło, animowana siatka, świecące logo, statystyki i przyciski z efektem świetlnym. ✨
