<script>
/* =========================

const levels=[

["NIGHTMARE","#ff3333",9.0,12000,205,123.47,[0,1,5,7,10,7,5,1]],

];

const skins=[
["CLASSIC","#ffffff",0],
["CYAN","#00ffff",10],
["LIME","#8cff5a",20],
["VIOLET","#c86cff",30],
["FIRE","#ff4b2e",40],
["GOLD","#ffd83d",60],
["PINK","#ff55c8",80],
["ICE","#8eeeff",100]
];

const achievements=[
["first","Pierwszy krok","Ukończ pierwszy poziom"],
["three","Trzy poziomy","Ukończ 3 poziomy"],
["six","Sześć poziomów","Ukończ 6 poziomów"],

["survivor","Niezniszczalny","Ukończ poziom po 5+ próbach"]
];

/* =========================
   ZAPIS
========================= */

let data=JSON.parse(localStorage.getItem("neonDashSave")||"null")||{
  unlocked:1,
  completed:[],
  coins:0,
  collected:[],
  ownedSkins:[0],
  selectedSkin:0,
  achievements:[],
  settings:{music:true,sound:true,fx:true}
};

let settings=data.settings;
function saveData(){
  data.settings=settings;
  localStorage.setItem("neonDashSave",JSON.stringify(data));
}

/* =========================
   EKRANY
========================= */

const screens=document.querySelectorAll(".screen");
function show(id){
  screens.forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backHome(){
  stopLoop();
  stopMusic();
  playing=false;
  victoryAnimation=false;
  document.querySelectorAll(".overlay").forEach(x=>x.classList.remove("show"));
  show("menu");
}

function showLevels(){
  renderLevels();
  show("levels");
}

  renderSkins();

  show("achievements");

  soundToggle.checked=settings.sound;
  fxToggle.checked=settings.fx;

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let masterGain=null;
let musicGain=null;
let musicTimer=null;
let musicStep=0;
let musicRunning=false;

function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;

    audioCtx=new AC();

    masterGain=audioCtx.createGain();
    musicGain=audioCtx.createGain();

    masterGain.gain.value=.85;
    musicGain.gain.value=.34;

    musicGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume().catch(()=>{});
  }

  return true;
}

/* Ważna poprawka:
   muzyka ma osobny kanał i jest uruchamiana po kliknięciu GRAJ. */

function note(freq,duration=.12,type="square",volume=.12,when=0){
  if(!audioCtx||!settings.music)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(freq,when);

  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),when+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start(when);
  osc.stop(when+duration+.02);
}

function kick(when){
  if(!audioCtx||!settings.music)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.setValueAtTime(130,when);
  osc.frequency.exponentialRampToValueAtTime(45,when+.12);

  gain.gain.setValueAtTime(.22,when);
  gain.gain.exponentialRampToValueAtTime(.001,when+.13);

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start(when);
  osc.stop(when+.15);
}

function snare(when){
  if(!audioCtx||!settings.music)return;

  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*.08,audioCtx.sampleRate);
  const ch=buffer.getChannelData(0);

  for(let i=0;i<ch.length;i++){
    ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  }

  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  src.buffer=buffer;
  gain.gain.value=.08;

  src.connect(gain);
  gain.connect(musicGain);

  src.start(when);
}

function hat(when){
  if(!audioCtx||!settings.music)return;

  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*.035,audioCtx.sampleRate);
  const ch=buffer.getChannelData(0);

  for(let i=0;i<ch.length;i++){
    ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  }

  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  src.buffer=buffer;
  gain.gain.value=.035;

  src.connect(gain);
  gain.connect(musicGain);

  src.start(when);
}

function startMusic(){
  if(!settings.music)return;
  if(!playing)return;

  initAudio();
  if(!audioCtx)return;

  stopMusic();

  musicRunning=true;
  musicStep=0;

  const level=levels[currentLevel];
  const beat=60/level[4];

  function schedule(){
    if(!musicRunning||!playing||paused||dead||won)return;

    const now=audioCtx.currentTime+.03;

    for(let i=0;i<8;i++){
      const step=musicStep+i;
      const t=now+i*beat/2;

      const melody=level[6][step%level[6].length];
      const freq=level[5]*Math.pow(2,melody/12);

      note(freq,beat*.38,"square",.105,t);

      if(step%2===0){
        const bass=level[5]/2*Math.pow(2,level[6][(step/2)%level[6].length]/12);
        note(bass,beat*.7,"triangle",.085,t);
        kick(t);
      }

      if(step%4===2)snare(t);
      hat(t);
      if(step%8===4){
        const harmony=freq*1.5;
        note(harmony,beat*.25,"sawtooth",.035,t);
      }
    }

    musicStep+=8;
    musicTimer=setTimeout(schedule,beat*4000);
  }

  schedule();
}

function stopMusic(){
  musicRunning=false;
  if(musicTimer){
    clearTimeout(musicTimer);
    musicTimer=null;
  }
}

function sfx(freq,duration=.08,type="square",volume=.08){
  if(!settings.sound)return;
  initAudio();
  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioCtx.currentTime+duration+.02);
}

/* =========================
   GRA
========================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let currentLevel=0;
let playing=false;
let paused=false;
let dead=false;
let won=false;
let animationFrame=null;

let player;
let obstacles=[];
let coins=[];
let pads=[];
let portals=[];
let particles=[];
let trail=[];
let stars=[];
let attempts=0;
let levelCoins=0;
let cameraX=0;
let worldSpeed=6;
let victoryAnimation=false;
let victoryStart=0;

function createStars(){
  stars=[];
  for(let i=0;i<100;i++){
    stars.push({
      x:Math.random()*14000,
      y:Math.random()*Math.max(250,H*.75),
      r:Math.random()*1.7+.3,
      a:Math.random()*.8+.2
    });
  }
}

function createLevel(){
  const level=levels[currentLevel];

  obstacles=[];
  coins=[];
  pads=[];
  portals=[];
  particles=[];
  trail=[];
  createStars();

  worldSpeed=level[2];

  player={
    x:130,
    y:H*.5-30,
    w:36,
    h:36,
    vy:0,
    rotation:0,
    grounded:false,
    blink:0,
    walk:0
  };

  /* podłoże */
  for(let x=0;x<level[3];x+=420){
    if(x<500||Math.random()>.15){
      obstacles.push({type:"ground",x:x,y:H*.78,w:420,h:H*.3});
    }
  }

  /* przeszkody */
  let x=700;

  while(x<level[3]-400){
    const type=Math.random();

    if(type<.45){
      obstacles.push({type:"spike",x,y:H*.78-38,w:38,h:38});
      if(Math.random()>.68)
        obstacles.push({type:"spike",x:x+42,y:H*.78-38,w:38,h:38});
    }else if(type<.7){
      obstacles.push({type:"saw",x:x+25,y:H*.78-65,r:28});
    }else if(type<.84){
      obstacles.push({type:"block",x:x+15,y:H*.78-75,w:70,h:75});
    }else{
      obstacles.push({type:"gap",x,y:H*.78,w:100,h:H*.3});
    }

    if(Math.random()>.72){
      pads.push({x:x+140,y:H*.78-14,w:55,h:14});
    }

    x+=180+Math.random()*220;
  }

  /* monety */
  const coinPositions=[
    level[3]*.25,
    level[3]*.52,
    level[3]*.78
  ];

  coinPositions.forEach((cx,i)=>{
    coins.push({
      x:cx,
      y:H*.55-(i%2)*90,
      r:12,
      taken:false,
      index:i
    });
  });

  /* portale */
  portals.push({x:level[3]*.4,y:H*.5,r:35});
  portals.push({x:level[3]*.7,y:H*.5,r:35});

  cameraX=0;
  levelCoins=0;

  updateHUD();
}

function updateHUD(){
  document.getElementById("levelName").textContent=
    `${currentLevel+1}. ${levels[currentLevel][0]}`;

  document.getElementById("levelName").style.color=levels[currentLevel][1];

  document.getElementById("coinHud").textContent=
    `🪙 ${levelCoins}/3`;

  const p=Math.min(100,Math.max(0,
    ((player?.x||0)/levels[currentLevel][3])*100
  ));

  document.getElementById("progress").style.width=p+"%";
  document.getElementById("progress").style.background=levels[currentLevel][1];
}

/* =========================
   START / RESTART
========================= */

function startLevel(index){
  if(index>data.unlocked-1)return;

  currentLevel=index;
  attempts=0;
  paused=false;
  dead=false;
  won=false;
  victoryAnimation=false;

  document.querySelectorAll(".overlay").forEach(x=>x.classList.remove("show"));

  createLevel();

  playing=true;
  show("game");

  /*
    KLUCZOWE:
    initAudio() wykonuje się w reakcji na kliknięcie
    przycisku poziomu, czyli przeglądarka traktuje to
    jako dozwoloną interakcję użytkownika.
  */
  initAudio();

  if(settings.music){
    startMusic();
  }

  startLoop();
}

function restartLevel(){
  if(!playing)return;

  stopLoop();
  stopMusic();

  paused=false;
  dead=false;
  won=false;
  victoryAnimation=false;

  attempts++;
  createLevel();

  playing=true;

  initAudio();

  if(settings.music)startMusic();

  startLoop();
}

function pauseGame(){
  if(!playing||dead||won)return;

  paused=true;
  stopMusic();
  document.getElementById("pauseOverlay").classList.add("show");
}

function resumeGame(){
  if(!playing)return;

  paused=false;
  document.getElementById("pauseOverlay").classList.remove("show");

  initAudio();
  if(settings.music)startMusic();

  startLoop();
}

function nextLevel(){
  if(currentLevel<levels.length-1){
    startLevel(currentLevel+1);
  }else{
    backHome();
  }
}

/* =========================
   STEROWANIE
========================= */

function jump(){
  if(!playing||paused||dead||won)return;

  initAudio();

  if(player.grounded){
    player.vy=-12;
    player.grounded=false;
    sfx(520,.08,"square",.08);
  }
}

addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
    e.preventDefault();
    jump();
  }

  if(e.code==="Escape"){
    if(paused)resumeGame();
    else pauseGame();
  }
});

const mobileJump=document.getElementById("mobileJump");

mobileJump.addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

/* =========================
   FIZYKA
========================= */

function update(){
  if(!playing||paused||dead||won)return;

  player.x+=worldSpeed;

  player.vy+=.65;
  player.y+=player.vy;

  const groundY=H*.78-player.h;

  player.grounded=false;

  if(player.y>=groundY){
    player.y=groundY;
    player.vy=0;
    player.grounded=true;
  }

  /* kolizje z blokami */
  for(const o of obstacles){
    if(o.type==="block"&&rectHit(player,o)){
      if(player.vy>=0&&player.y+player.h<=o.y+20){
        player.y=o.y-player.h;
        player.vy=0;
        player.grounded=true;
      }else{
        die();
        return;
      }
    }

    if(o.type==="spike"){
      const hit={
        x:o.x+7,y:o.y+8,w:o.w-14,h:o.h-8
      };
      if(rectHit(player,hit)){
        die();
        return;
      }
    }

    if(o.type==="saw"){
      const dx=(player.x+player.w/2)-o.x;
      const dy=(player.y+player.h/2)-o.y;
      if(Math.hypot(dx,dy)<o.r+18){
        die();
        return;
      }
    }

    if(o.type==="gap"){
      if(
        player.x+player.w>o.x &&
        player.x<o.x+o.w &&
        player.y+player.h>=H*.78-3
      ){
        die();
        return;
      }
    }
  }

  /* pady */
  for(const p of pads){
    if(rectHit(player,p)&&player.vy>=0){
      player.y=p.y-player.h;
      player.vy=-14;
      sfx(700,.09,"square",.08);
    }
  }

  /* monety */
  for(const c of coins){
    if(c.taken)continue;

    const dx=(player.x+18)-c.x;
    const dy=(player.y+18)-c.y;

    if(Math.hypot(dx,dy)<28){
      c.taken=true;
      levelCoins++;
      data.coins++;
      sfx(900,.1,"triangle",.1);

      if(settings.fx){
        burst(c.x,c.y,levels[currentLevel][1],12);
      }

      checkAchievements();
      saveData();
    }
  }

  /* portale */
  for(const p of portals){
    const dx=(player.x+18)-p.x;
    const dy=(player.y+18)-p.y;

    if(Math.hypot(dx,dy)<p.r){
      sfx(260,.15,"sawtooth",.06);
    }
  }

  /* animacja */
  player.rotation+=player.grounded?.09:.16;
  player.walk+=.22;
  player.blink++;

  if(player.blink>240+Math.random()*180){
    player.blink=0;
  }

  /* trail */
  trail.push({
    x:player.x,
    y:player.y,
    life:1
  });

  if(trail.length>25)trail.shift();

  trail.forEach(t=>t.life-=.055);

  /* cząsteczki */
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.08;
    p.life-=.025;
  });

  particles=particles.filter(p=>p.life>0);

  cameraX=Math.max(0,player.x-W*.28);

  updateHUD();

  if(player.x>=levels[currentLevel][3]){
    win();
  }
}

function rectHit(a,b){
  return a.x<b.x+b.w &&
         a.x+a.w>b.x &&
         a.y<b.y+b.h &&
         a.y+a.h>b.y;
}

/* =========================
   ŚMIERĆ / WYGRANA
========================= */

function die(){
  if(dead||won)return;

  dead=true;
  attempts++;

  stopMusic();

  sfx(100,.3,"sawtooth",.12);

  if(settings.fx){
    for(let i=0;i<35;i++){
      burst(
        player.x+18,
        player.y+18,
        "#ff304f",
        1
      );
    }
  }

  document.getElementById("deathText").textContent=
    `Próba: ${attempts}`;

  document.getElementById("deathOverlay").classList.add("show");

  checkAchievements();
  saveData();
}

function win(){
  if(won)return;

  won=true;
  victoryAnimation=true;
  victoryStart=performance.now();

  stopMusic();

  sfx(523,.12,"square",.1);
  setTimeout(()=>sfx(659,.12,"square",.1),120);
  setTimeout(()=>sfx(784,.25,"square",.12),240);

  if(!data.completed.includes(currentLevel)){
    data.completed.push(currentLevel);
  }

  data.unlocked=Math.max(
    data.unlocked,
    Math.min(levels.length,currentLevel+2)
  );

  checkAchievements();

  document.getElementById("winCoins").textContent=
    `Zebrane monety: ${levelCoins}/3`;

  saveData();

  setTimeout(()=>{
    if(won){
      document.getElementById("winOverlay").classList.add("show");
    }
  },1100);

  if(settings.fx){
    for(let i=0;i<80;i++){
      particles.push({
        x:player.x+Math.random()*100,
        y:player.y+Math.random()*100,
        vx:(Math.random()-.5)*8,
        vy:(Math.random()-.5)*8,
        life:1,
        color:levels[currentLevel][1]
      });
    }
  }
}

/* =========================
   EFEKTY
========================= */

function burst(x,y,color,count=1){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:1,
      color
    });
  }
}

/* =========================
   RYSOWANIE
========================= */

function draw(){
  ctx.clearRect(0,0,W,H);

  const color=levels[currentLevel][1];

  /* niebo */
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#050518");
  grad.addColorStop(1,"#0a1020");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  /* gwiazdy */
  for(const s of stars){
    const sx=s.x-cameraX*.2;
    if(sx<-5||sx>W+5)continue;

    ctx.globalAlpha=s.a;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(sx,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  /* grid */
  ctx.strokeStyle=color+"22";
  ctx.lineWidth=1;

  const grid=50;
  const offset=-(cameraX%grid);

  for(let x=offset;x<W;x+=grid){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=grid){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* ziemia */
  ctx.fillStyle="#121b2a";
  ctx.fillRect(0,H*.78,W,H*.22);

  ctx.strokeStyle=color;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,H*.78);
  ctx.lineTo(W,H*.78);
  ctx.stroke();

  /* obiekty */
  for(const o of obstacles){
    const x=o.x-cameraX;

    if(o.type==="ground"){
      ctx.fillStyle="#16243a";
      ctx.fillRect(x,o.y,o.w,o.h);
    }

    if(o.type==="block"){
      ctx.fillStyle="#182d47";
      ctx.fillRect(x,o.y,o.w,o.h);
      ctx.strokeStyle=color;
      ctx.strokeRect(x,o.y,o.w,o.h);
    }

    if(o.type==="spike"){
      ctx.fillStyle="#fff";
      ctx.shadowBlur=10;
      ctx.shadowColor=color;
      ctx.beginPath();
      ctx.moveTo(x,o.y+o.h);
      ctx.lineTo(x+o.w/2,o.y);
      ctx.lineTo(x+o.w,o.y+o.h);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur=0;
    }

    if(o.type==="saw"){
      const sx=x;
      ctx.save();
      ctx.translate(sx,o.y);
      ctx.rotate(performance.now()/500);
      ctx.fillStyle="#ddd";
      ctx.beginPath();

      for(let i=0;i<16;i++){
        const a=i*Math.PI/8;
        const r=i%2?o.r*.78:o.r;
        const px=Math.cos(a)*r;
        const py=Math.sin(a)*r;

        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      }

      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#111";
      ctx.beginPath();
      ctx.arc(0,0,8,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    if(o.type==="gap"){
      ctx.fillStyle="#020205";
      ctx.fillRect(x,o.y,o.w,o.h);
    }
  }

  /* pady */
  for(const p of pads){
    const x=p.x-cameraX;
    ctx.fillStyle="#ffe34d";
    ctx.shadowBlur=15;
    ctx.shadowColor="#ffe34d";
    ctx.fillRect(x,p.y,p.w,p.h);
    ctx.shadowBlur=0;
  }

  /* portale */
  for(const p of portals){
    const x=p.x-cameraX;
    ctx.strokeStyle=color;
    ctx.lineWidth=5;
    ctx.shadowBlur=20;
    ctx.shadowColor=color;
    ctx.beginPath();
    ctx.arc(x,p.y,p.r,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  /* monety */
  for(const c of coins){
    if(c.taken)continue;

    const x=c.x-cameraX;
    const pulse=1+Math.sin(performance.now()/180+c.index)*.08;

    ctx.save();
    ctx.translate(x,c.y);
    ctx.scale(pulse,pulse);

    ctx.fillStyle="#ffe65c";
    ctx.shadowBlur=15;
    ctx.shadowColor="#ffe65c";

    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff2a0";
    ctx.font="bold 14px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("★",0,1);

    ctx.restore();
    ctx.shadowBlur=0;
  }

  /* trail */
  for(const t of trail){
    const x=t.x-cameraX;

    ctx.globalAlpha=Math.max(0,t.life)*.35;
    ctx.fillStyle=color;
    ctx.fillRect(x-8,t.y-8,16,16);
  }
  ctx.globalAlpha=1;

  /* gracz */
  if(player&&!dead){
    const px=player.x-cameraX;
    const py=player.y;

    const skin=skins[data.selectedSkin][1];

    ctx.save();
    ctx.translate(px+18,py+18);
    ctx.rotate(player.rotation);

    ctx.fillStyle=skin;
    ctx.shadowBlur=18;
    ctx.shadowColor=skin;
    ctx.fillRect(-18,-18,36,36);
    ctx.shadowBlur=0;

    /* nogi */
    const leg=Math.sin(player.walk)*4;

    ctx.strokeStyle="#111";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(-8,17);
    ctx.lineTo(-8+leg,25);
    ctx.moveTo(8,17);
    ctx.lineTo(8-leg,25);
    ctx.stroke();

    /* ręce */
    ctx.beginPath();
    ctx.moveTo(-17,0);
    ctx.lineTo(-24,-5+leg);
    ctx.moveTo(17,0);
    ctx.lineTo(24,-5-leg);
    ctx.stroke();

    /* oczy */
    ctx.fillStyle="#111";

    if(player.blink<8){
      ctx.fillRect(-10,-7,5,2);
      ctx.fillRect(5,-7,5,2);
    }else{
      ctx.fillRect(-10,-10,5,7);
      ctx.fillRect(5,-10,5,7);
    }

    /* usta */
    ctx.fillRect(-5,6,10,3);

    ctx.restore();
  }

  /* particles */
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color||color;
    ctx.fillRect(p.x-cameraX,p.y,4,4);
  }
  ctx.globalAlpha=1;

  /* victory */
  if(victoryAnimation){
    const elapsed=performance.now()-victoryStart;

    ctx.fillStyle=`rgba(255,255,255,${Math.max(0,1-elapsed/450)})`;
    ctx.fillRect(0,0,W,H);

    const cx=W/2;
    const cy=H/2;

    ctx.strokeStyle=color;
    ctx.lineWidth=5;

    for(let i=0;i<5;i++){
      const r=80+elapsed*.45+i*35;

      ctx.globalAlpha=Math.max(0,1-(elapsed-i*100)/1600);
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";
    ctx.font="900 48px Arial";
    ctx.textAlign="center";
    ctx.fillText("LEVEL COMPLETE!",cx,cy);
  }
}

/* =========================
   PĘTLA
========================= */

function loop(){
  if(!playing)return;

  update();
  draw();

  if(playing&&!paused&&!dead&&!won){
    animationFrame=requestAnimationFrame(loop);
  }else if(victoryAnimation){
    animationFrame=requestAnimationFrame(loop);
  }
}

function startLoop(){
  stopLoop();
  animationFrame=requestAnimationFrame(loop);
}

function stopLoop(){
  if(animationFrame){
    cancelAnimationFrame(animationFrame);
    animationFrame=null;
  }
}

   MENU POZIOMÓW
========================= */

function renderLevels(){
  const grid=document.getElementById("levelGrid");
  grid.innerHTML="";

  levels.forEach((l,i)=>{
    const unlocked=i<data.unlocked;

    const div=document.createElement("button");
    div.className="level-card"+(unlocked?"":" locked");

    const complete=data.completed.includes(i);

    div.innerHTML=`
      <div class="level-number">POZIOM ${i+1}</div>
      <div class="level-title" style="color:${l[1]}">${l[0]}</div>
      <div class="level-status">
        ${!unlocked?"🔒 ZABLOKOWANY":complete?"✅ UKOŃCZONY":"▶ ZAGRAJ"}
      </div>
    `;

    if(unlocked){
      div.onclick=()=>startLevel(i);
    }

    grid.appendChild(div);
  });
}

/* =========================
   SKINY
========================= */

function renderSkins(){
  document.getElementById("shopCoins").textContent=data.coins;

  const grid=document.getElementById("skinGrid");
  grid.innerHTML="";

  skins.forEach((s,i)=>{
    const owned=data.ownedSkins.includes(i);

    const div=document.createElement("button");
    div.className="skin-card"+(data.selectedSkin===i?" selected":"");

    div.innerHTML=`
      <div class="skin-preview" style="background:${s[1]};color:${s[1]}"></div>
      <b>${s[0]}</b>
      <div class="price">
        ${owned?(data.selectedSkin===i?"✓ WYBRANA":"POSIADANA"):`🪙 ${s[2]}`}
      </div>
    `;

    div.onclick=()=>{
      if(owned){
        data.selectedSkin=i;
        saveData();
        renderSkins();
        return;
      }

      if(data.coins>=s[2]){
        data.coins-=s[2];
        data.ownedSkins.push(i);
        data.selectedSkin=i;
        saveData();
        renderSkins();
      }
    };

    grid.appendChild(div);
  });
}

/* =========================
   OSIĄGNIĘCIA
========================= */

function checkAchievements(){
  const unlock=id=>{
    if(!data.achievements.includes(id)){
      data.achievements.push(id);
    }
  };

  if(data.completed.length>=1)unlock("first");
  if(data.completed.length>=3)unlock("three");
  if(data.completed.length>=6)unlock("six");
  if(data.completed.length>=18)unlock("all");
  if(data.coins>=10)unlock("coins10");
  if(data.coins>=25)unlock("coins25");
  if(won&&attempts<=1)unlock("perfect");
  if(won&&attempts>=5)unlock("survivor");

  saveData();
}

function renderAchievements(){
  const grid=document.getElementById("achievementGrid");
  grid.innerHTML="";

  achievements.forEach(a=>{
    const unlocked=data.achievements.includes(a[0]);

    const div=document.createElement("div");
    div.className="skin-card";

    div.style.opacity=unlocked?"1":".45";

    div.innerHTML=`
      <div style="font-size:35px">${unlocked?"🏆":"🔒"}</div>
      <b>${a[1]}</b>
      <div class="small">${a[2]}</div>
    `;

    grid.appendChild(div);
  });
}
